name: RC1008 ExportHUB System SOPs Legacy Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1008 System-SOP Vertrag
        run: node --test test/rc1008-system-sops.test.mjs
      - name: Bestehende Node-Regression
        run: npm test
