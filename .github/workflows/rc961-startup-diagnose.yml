name: RC961 Startup Diagnose

on:
  push:
    branches:
      - rc961-startup-teamdata-timeout
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc961-startup-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc961-startup-teamdata-timeout
          fetch-depth: 0
      - name: Verify committed startup total-timeout behavior
        run: node .github/rc961_statecall_test.cjs
      - name: RC961 static regression
        run: python .github/rc961_regression.py
      - name: Existing baseline tests
        run: npm test
      - name: RC961 committed product diff check
        run: git diff --check origin/main...HEAD -- TESTVERSION.html
