name: RC1505 Build Diagnostic

on:
  push:
    branches:
      - debug/rc1505-build-contract-20261013

permissions:
  contents: read

concurrency:
  group: rc1505-build-diagnostic-${{ github.sha }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Normalize sources like Main Verification
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1018/apply-public-language.mjs
          node .github/rc1018/fix-mail-wording.mjs

      - name: Build RC1112 three environments
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1112/build-three-env.mjs

      - name: Verify final HTML
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1121/verify-final-html.mjs

      - name: RC1505 basic pages and build markers
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-rc1112/index.html
          test -s dist-rc1112/TESTVERSION.html
          test -s dist-rc1112/demo.html
          grep -Fq 'ExportHUB RC1112 environment=production-candidate' dist-rc1112/index.html
          grep -Fq 'ExportHUB RC1112 environment=testservice' dist-rc1112/TESTVERSION.html
          grep -Fq 'ExportHUB RC1112 environment=demo' dist-rc1112/demo.html
          grep -Fq "version:'RC1112'" dist-rc1112/index.html
          grep -Fq "version:'RC1112'" dist-rc1112/TESTVERSION.html
          grep -Fq "version:'RC1112'" dist-rc1112/demo.html
          grep -Fq "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'" dist-rc1112/production-version.js

      - name: RC1505 common markers index
        shell: bash
        run: |
          set -euo pipefail
          file=dist-rc1112/index.html
          while IFS= read -r marker; do grep -Fq "$marker" "$file"; done <<'EOF'
          assets/rc1016-mobile-navigation.js?v=1400
          assets/rc1014-task-runtime.js?v=1359
          assets/rc1014-shipment-overview.js?v=1370
          assets/rc1014-shipment-overview.css?v=1370
          assets/rc1065-registration-cc.js?v=1093
          assets/rc1077-customer-labels.js?v=1394
          assets/rc1079-profile-settings.js?v=1079
          assets/rc1080-customer-history.js?v=1080
          assets/rc1081-audit-history.js?v=1177
          assets/rc1092-customer-mail-contacts.js?v=1399
          assets/rc1015-lieferavis-mail-flow.js?v=1383
          assets/abholkalender.js?v=1012
          assets/rc1012-abholkalender-runtime.js?v=1012
          assets/rc1018-mail-language-standard.js?v=1018
          assets/rc1113-stowplan-persist.js?v=1113
          assets/rc1114-shipping-neutral.js?v=1386
          assets/rc1017-multi-truck.js?v=1017
          assets/rc1013-gate41-ui.js?v=1385
          assets/rc1074-login-clean.js?v=1349
          assets/rc1305-loading-list-print.js?v=1379
          assets/rc1315-loading-list-quick-print.js?v=1322
          assets/rc1283-loading-list-search.js?v=1305
          assets/rc1027-lieferavis-immediate.js?v=20261005
          assets/rc1177-release-notes.js?v=
          EOF

      - name: RC1505 common markers TESTVERSION
        shell: bash
        run: |
          set -euo pipefail
          file=dist-rc1112/TESTVERSION.html
          while IFS= read -r marker; do grep -Fq "$marker" "$file"; done <<'EOF'
          assets/rc1016-mobile-navigation.js?v=1400
          assets/rc1014-task-runtime.js?v=1359
          assets/rc1014-shipment-overview.js?v=1370
          assets/rc1014-shipment-overview.css?v=1370
          assets/rc1065-registration-cc.js?v=1093
          assets/rc1077-customer-labels.js?v=1394
          assets/rc1079-profile-settings.js?v=1079
