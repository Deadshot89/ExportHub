      - name: Verify RC886 API hotfix and unchanged script boundaries
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "version:'RC886',cache:'886',loginReturn:'/TESTVERSION.html?v=886'" TESTVERSION.html
          grep -Fq "/* exporthub-rc886-testservice-api-hotfix */" TESTVERSION.html
          grep -Fq "window.location.origin" TESTVERSION.html
          grep -Fq "redirect = 'manual'" TESTVERSION.html
          grep -Fq "credentials = 'same-origin'" TESTVERSION.html
          grep -Fq "__EXPORTHUB_TESTSERVICE_API_DIAGNOSTICS__" TESTVERSION.html

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          src=Path("TESTVERSION.html").read_text(encoding="utf-8",errors="replace")
          expected={
              "script_open":int(Path("/tmp/rc886_script_open_count").read_text()),
              "script_close":int(Path("/tmp/rc886_script_close_count").read_text()),
              "style_open":int(Path("/tmp/rc886_style_open_count").read_text()),
              "style_close":int(Path("/tmp/rc886_style_close_count").read_text()),
          }
          actual={
              "script_open":src.lower().count("<script"),
              "script_close":src.lower().count("</script>"),
              "style_open":src.lower().count("<style"),
              "style_close":src.lower().count("</style>"),
          }
          if actual!=expected:
              raise SystemExit("RC886 hat Script-/Style-Grenzen verändert: "+repr({"vorher":expected,"nachher":actual}))

          class V(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script=0
                  self.style=0
                  self.parts=[]
              def handle_starttag(self,tag,attrs):
                  t=tag.lower()
                  if t=="script": self.script+=1
                  elif t=="style": self.style+=1
              def handle_endtag(self,tag):
                  t=tag.lower()
                  if t=="script" and self.script: self.script-=1
                  elif t=="style" and self.style: self.style-=1
              def handle_data(self,data):
                  if not self.script and not self.style:
                      self.parts.append(data)

          p=V()
          p.feed(src)
          p.close()
          visible="\n".join(p.parts)
          bad=[
              "function applyFixedBlocks()",
              "window.open('about:blank'",
              'window.open("about:blank"',
              "function requestFor(",
              "exporthub-rc886-testservice-api-hotfix"
          ]
          leaks=[x for x in bad if x in visible]
          if leaks:
              raise SystemExit("JavaScript als sichtbarer Seitentext: "+", ".join(leaks))

          # Ensure the hotfix is located before the legacy route-error marker in the same script.
          hot=src.find("/* exporthub-rc886-testservice-api-hotfix */")
          legacy=src.find("AZURE_ROUTE_BLOCKED")
          if hot < 0 or legacy < 0 or hot >= legacy:
              raise SystemExit("RC886 API-Hotfix wird nicht vor der bisherigen Fehlerbehandlung ausgeführt.")

          if src.find("</script>",hot,legacy) >= 0:
              raise SystemExit("RC886 API-Hotfix und bisherige API-Fehlerbehandlung liegen nicht im selben Scriptblock.")

          print("RC886 source safety PASS")
          PY

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet --             index.html             production-version.js             api             pickup.html             location.html             customer-avis.html             staticwebapp.config.json             staticwebapp.testservice.config.json
          then
            echo "::error::Produktions-/API-/Config-Dateien wurden verändert."
            exit 1
          fi

          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "TESTVERSION.html" ]]; then
            echo "::error::RC886 darf ausschließlich TESTVERSION.html ändern."
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi

      - name: Commit RC886 TESTSERVICE API hotfix
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC886: same-origin ExportHUB API hotfix"
          git push origin main

      - name: Snapshot TESTSERVICE deploy runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list             --workflow exporthub-testservice.yml             --limit 50             --json databaseId             --jq '.[].databaseId' > /tmp/testservice_runs_before.txt || true

      - name: Dispatch TESTSERVICE deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/exporthub-testservice.yml/dispatches"             -f ref=main

      - name: Wait for RC886 TESTSERVICE deploy
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""

          for attempt in $(seq 1 60); do
            mapfile -t IDS < <(
              gh run list                 --workflow exporthub-testservice.yml                 --event workflow_dispatch                 --branch main                 --limit 20                 --json databaseId                 --jq '.[].databaseId'
            )

            for id in "${IDS[@]}"; do
              if ! grep -qx "${id}" /tmp/testservice_runs_before.txt 2>/dev/null; then
                RUN_ID="${id}"
                break
              fi
            done

            [[ -n "${RUN_ID}" ]] && break
            sleep 5
          done

          if [[ -z "${RUN_ID}" ]]; then
            echo "::error::TESTSERVICE-Deploy wurde nicht gefunden."
            exit 1
          fi

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          gh run watch "${RUN_ID}" --exit-status

      - name: Verify RC886 deploy success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ steps.deploy.outputs.run_id }}
        run: |
          set -euo pipefail
          CONCLUSION="$(gh run view "${DEPLOY_RUN_ID}" --json conclusion --jq '.conclusion')"
          if [[ "${CONCLUSION}" != "success" ]]; then
            echo "::error::TESTSERVICE-Deploy endete mit ${CONCLUSION}."
            exit 1
          fi
          echo "RC886 TESTSERVICE API-Hotfix wurde erfolgreich deployed."

      - name: RC886 summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RC886 TESTSERVICE API Hotfix"
            echo
            echo "- Basis: RC885 Clean Workspace v4"
            echo "- Änderung: nur TESTVERSION.html"
            echo "- /api/exporthub-* wird auf window.location.origin normalisiert"
            echo "- API-Cookies: credentials=same-origin"
            echo "- Microsoft-/Auth-Redirects: redirect=manual, keine automatische Neuanmeldung"
            echo "- HTML statt API-Antwort wird separat erkannt"
            echo "- Bestehende Teamdaten-Wiederholung nutzt dieselbe Sitzung"
            echo "- Keine neuen HTML-Script-/Style-Grenzen"
            echo "- Produktion, APIs und Static-Web-App-Konfiguration unverändert"
            echo
            echo "Nach grünem Deploy Testseite mit Strg+F5 öffnen und Teamdaten erneut laden."
          } >> "$GITHUB_STEP_SUMMARY"
