name: RC1484 Apply Deepfix

on:
  push:
    branches:
      - 'fix/rc1484-generic-pickup-reminder'
    paths:
      - '.github/rc1484/apply.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rc1484-generic-pickup-reminder
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply RC1484 patch
        run: node .github/rc1484/apply.cjs
      - name: Verify focused regression
        run: |
          node --check assets/rc1166-avis-reminder-overview.js
          node --test test/rc1484-generic-pickup-reminder.test.mjs
          node --test test/rc1166-avis-reminder-overview.test.mjs
      - name: Commit runtime fix
        run: |
          if git diff --quiet -- assets/rc1166-avis-reminder-overview.js; then
            echo 'No runtime changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rc1166-avis-reminder-overview.js
          git commit -m 'fix(RC1484): keep pickup reminder available on open shipments'
          git push origin HEAD:fix/rc1484-generic-pickup-reminder
