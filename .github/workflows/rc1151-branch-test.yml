name: RC1151 Branch Test
on:
  push:
    branches:
      - fix/rc1151-document-download-history
  pull_request:
    branches: [main]
    paths:
      - 'assets/rc1063-abd-blob-viewer-compat.js'
      - 'assets/rc1071-shipment-history.js'
      - '.github/rc1112/build-three-env.mjs'
      - 'playwright.config.mjs'
      - 'e2e/specs/multi-truck-live.spec.mjs'
      - 'test/rc1152-task-detail-roster.test.mjs'
      - 'test/rc1590-registration-confirmation.test.mjs'
      - 'test/rc1585-managed-registration.test.mjs'
      - 'assets/taskplanner-v2-workflow.js'
      - 'test/rc1585-managed-registration.test.mjs'
      - 'test/rc1585-abd-saved-promotion.test.mjs'
      - 'assets/taskplanner-v2-workflow.js'
      - 'assets/rc1049-abd-avis-policy.js'
      - 'test/rc1207-ups-toolbox.test.mjs'
      - 'test/rc1548-shipping-cost-autofill.test.mjs'
      - 'test/rc1549-live-browser-timeout-budget.test.mjs'
      - 'test/rc1551-multi-truck-response-match.test.mjs'
      - 'assets/rc1014-task-runtime.js'
      - 'assets/rc1206-shipping-rules.js'
      - 'test/rc1151-document-download-history.test.mjs'
      - '.github/workflows/rc1151-branch-test.yml'
permissions:
  contents: read
jobs:
  rc1151:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: node --test test/rc1151-document-download-history.test.mjs
      - name: RC1266 UPS und Aufgaben Regression
        run: node --test test/rc1207-ups-toolbox.test.mjs test/rc1152-task-detail-roster.test.mjs
      - name: RC1590 Anmeldung erst nach Versandbestätigung erledigen
        run: node --test test/rc1590-registration-confirmation.test.mjs test/rc1585-managed-registration.test.mjs test/rc1071-shipment-history.test.mjs test/rc1100-history-action-coverage.test.mjs
      - name: RC1585 Aufgaben/ABD Safety Regression
        run: node --test test/rc1585-managed-registration.test.mjs test/rc1585-abd-saved-promotion.test.mjs test/taskplanner-v2-workflow.test.mjs test/taskplanner-v2-workflow-bindings.test.mjs test/rc1550-abd-completed-upload.test.mjs test/rc1617-abd-upload-failure-feedback.test.mjs
      - name: RC1548 Versandkosten Autoübernahme Regression
        run: node --test test/rc1548-shipping-cost-autofill.test.mjs
      - name: RC1549 Live-Browser Zeitbudget Regression
        run: node --test test/rc1549-live-browser-timeout-budget.test.mjs
      - name: RC1551 Mehr-LKW Response-Zuordnung Regression
        run: node --test test/rc1551-multi-truck-response-match.test.mjs
      - name: RC1266 Drei-Umgebungen-Build
        run: node .github/rc1112/build-three-env.mjs
