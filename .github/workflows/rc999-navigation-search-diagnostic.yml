name: RC999 Navigation Search Diagnostic

on:
  push:
    branches:
      - rc999-navigation-search-final
    paths:
      - '.github/workflows/rc999-navigation-search-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Inspect canonical navigation and search owners
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('TESTVERSION.html','utf8');

          function around(needle,before=1200,after=2600,max=20){
            let from=0,count=0;
            console.log(`\n### ${needle}`);
            while(count<max){
              const i=src.indexOf(needle,from); if(i<0)break;
              console.log(`\n--- @${i} ---\n${src.slice(Math.max(0,i-before),Math.min(src.length,i+needle.length+after))}`);
              from=i+needle.length; count++;
            }
            console.log(`\nCOUNT ${needle}: ${count}${count===max?' (capped)':''}`);
          }

          [
            'function initIndex321(){',
            'function go(view){',
            'function rc990RememberView(',
            'function rc990BackView(',
            'selectedCustomerId',
            'selectedShipmentId',
            'selectedTaskId',
            'taskId',
            'shipmentId',
            'customerId',
            'renderCustomers',
            'renderCustomer',
            'renderShipmentOverview',
            'renderTasks',
            'function renderTasks',
            'function renderShipment',
            'function renderCustomers'
          ].forEach(n=>around(n));

          console.log('\n### ASSIGNMENTS selectedCustomerId');
          [...src.matchAll(/selectedCustomerId\s*=\s*[^;\n]+/g)].slice(0,80).forEach(m=>console.log(m[0]));
          console.log('\n### ASSIGNMENTS selectedShipmentId');
          [...src.matchAll(/selectedShipmentId\s*=\s*[^;\n]+/g)].slice(0,80).forEach(m=>console.log(m[0]));
          console.log('\n### ASSIGNMENTS task-like selection');
          [...src.matchAll(/(?:selectedTaskId|taskFocusId|focusedTaskId|activeTaskId)\s*=\s*[^;\n]+/g)].slice(0,80).forEach(m=>console.log(m[0]));

          console.log('\n### STORE ID SHAPES');
          for(const expr of [
            /store\.customers[^\n]{0,220}/g,
            /store\.shipments[^\n]{0,220}/g,
            /store\.tasks[^\n]{0,220}/g
          ]) [...src.matchAll(expr)].slice(0,80).forEach(m=>console.log(m[0]));
          NODE
