name: ExportHUB TESTSERVICE State API Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/exporthub-testservice-state-probe.yml'

permissions:
  contents: read

jobs:
  probe_state_api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live TESTSERVICE state API version
        shell: bash
        env:
          TESTSERVICE_URL: https://wonderful-forest-0f315e310-testservice.centralus.7.azurestaticapps.net
          MIN_STATE_API_VERSION: RC931
        run: |
          set -euo pipefail

          url="${TESTSERVICE_URL}/api/exporthub-state?mode=ping"
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT

          http="$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --dump-header "$headers" --output "$body" \
            --write-out '%{http_code}' "$url")"

          echo "HTTP $http"
          echo '--- response headers ---'
          cat "$headers"
          echo '--- response body ---'
          cat "$body"
          echo

          if [[ "$http" != "200" ]]; then
            echo "FEHLER: State-API Ping liefert HTTP $http statt 200."
            exit 1
          fi

          node - "$body" "$MIN_STATE_API_VERSION" <<'NODE'
          const fs = require('fs');
          const [file, minimum] = process.argv.slice(2);
          const raw = fs.readFileSync(file, 'utf8');
          let data;
          try { data = JSON.parse(raw); }
          catch (error) { throw new Error('State-API antwortet nicht mit gültigem JSON: ' + raw.slice(0, 500)); }

          const version = String(data.serverVersion || data.version || '').trim();
          if (!/^RC\d+$/.test(version)) {
            throw new Error('State-API liefert keine Versionskennung. Antwort: ' + JSON.stringify(data));
          }

          const current = Number(version.slice(2));
          const required = Number(String(minimum).replace(/^RC/, ''));
          if (!Number.isFinite(current) || current < required) {
            throw new Error(`State-API ist zu alt: ${version}; benötigt mindestens ${minimum}.`);
          }

          console.log(`OK: Live-State-API ${version} erfüllt Mindeststand ${minimum}.`);
          NODE
