name: RC977 Colli Typography

on:
  push:
    branches: [main]
    paths:
      - 'TESTVERSION.html'
      - 'test/rc977-colli-typography.test.mjs'
      - '.github/workflows/rc977-colli-typography.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: RC971 bis RC977 komplette Regression
        run: node --test test/rc971-global-form-field-standard.test.mjs test/rc972-field-exception-audit.test.mjs test/rc973-long-text-autogrow.test.mjs test/rc975-global-render-integrity.test.mjs test/rc976-render-fallback-recovery.test.mjs test/rc977-colli-typography.test.mjs
