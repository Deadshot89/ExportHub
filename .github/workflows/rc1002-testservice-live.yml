name: RC1002 TESTSERVICE Live
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc1002-testservice-live.yml'
permissions:
  contents: read
concurrency:
  group: rc1002-testservice-live
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: RC1002 TESTSERVICE prüfen und paketieren
        shell: bash
        run: |
          set -euo pipefail
          node --test test/rc1002-release-sync.test.mjs
          npm test
          rm -rf .rc1002_testservice_app
          mkdir -p .rc1002_testservice_app
          cp TESTVERSION.html .rc1002_testservice_app/index.html
          cp TESTVERSION.html .rc1002_testservice_app/TESTVERSION.html
          cp pickup.html customer-avis.html location.html pod-notfall.html .rc1002_testservice_app/
          cp staticwebapp.testservice.config.json .rc1002_testservice_app/staticwebapp.config.json
          cp -R assets .rc1002_testservice_app/assets
          grep -q "version:'RC1002'" .rc1002_testservice_app/index.html
          node --check api/exporthub-auth/index.js
          node --check api/exporthub-auth-probe/index.js
          node --check api/exporthub-health/index.js
      - name: Deploy RC1002 TESTSERVICE
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1002_testservice_app
          api_location: api
          output_location: ''
          skip_app_build: true
          deployment_environment: testservice
      - name: RC1002 TESTSERVICE live prüfen
        shell: bash
        run: |
          set -euo pipefail
          base='https://wonderful-forest-0f315e310-testservice.centralus.7.azurestaticapps.net'
          page=$(mktemp); probe=$(mktemp); health=$(mktemp); trap 'rm -f "$page" "$probe" "$health"' EXIT
          for attempt in {1..24}; do
            p=$(curl -sS -L -o "$page" -w '%{http_code}' --max-time 20 "$base/TESTVERSION.html?rc1002=$GITHUB_SHA-$attempt" || true)
            a=$(curl -sS -o "$probe" -w '%{http_code}' --max-time 25 "$base/api/exporthub-auth-probe?rc1002=$GITHUB_SHA-$attempt" || true)
            h=$(curl -sS -o "$health" -w '%{http_code}' --max-time 20 "$base/api/exporthub-health?rc1002=$GITHUB_SHA-$attempt" || true)
            echo "Check $attempt: page=$p auth=$a health=$h"
            if [[ "$p" == '200' && "$a" == '200' && "$h" == '200' ]] && grep -q "version:'RC1002'" "$page" && grep -q '"ok":true' "$probe" && grep -q '"version":"RC1002"' "$health"; then
              echo 'RC1002 TESTSERVICE live bestätigt.'
              exit 0
            fi
            sleep 10
          done
          echo 'RC1002 TESTSERVICE nicht vollständig bestätigt.'
          cat "$probe" || true
          cat "$health" || true
          exit 1
