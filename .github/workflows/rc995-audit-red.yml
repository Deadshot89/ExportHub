name: RC995 Apply + Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc995-audit-red.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Produktionsmarker vor Änderung absichern
        shell: bash
        run: |
          set -euo pipefail
          grep -q "RC990" production-version.js
          if grep -q "RC995" production-version.js; then exit 1; fi

      - name: RC995 Stage promoten und Server-Sicherheit finalisieren
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import shutil

          stage=Path('.github/rc995/stage/api')
          if not stage.is_dir(): raise SystemExit('RC995 Stage-Verzeichnis fehlt')
          files=[x for x in stage.rglob('*') if x.is_file()]
          if not files: raise SystemExit('RC995 Stage enthält keine Dateien')
          for src in files:
              dst=Path('api')/src.relative_to(stage)
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              print('promote',src.relative_to(stage))

          access=Path('api/shared/public-access-store.js')
          s=access.read_text(encoding='utf-8')
          old="crypto.randomBytes(32).toString('base64url')"
          if s.count(old)!=1: raise SystemExit(f'Public-Access Tokenanker: {s.count(old)}')
          s=s.replace(old,"crypto.randomBytes(24).toString('hex')",1)
          access.write_text(s,encoding='utf-8')

          p=Path('api/shared/merge.js')
          s=p.read_text(encoding='utf-8')
          anchor="function isObject(value) {\n  return value && typeof value === 'object' && !Array.isArray(value);\n}\n"
          if 'function stripPublicAccessSecrets(' not in s:
              if s.count(anchor)!=1: raise SystemExit('merge.js isObject-Anker fehlt')
              add="""
          const PUBLIC_ACCESS_SECRET_KEYS = ['customerAvisToken','avisToken','pickupToken','pickupQrToken','qrToken'];
          function stripPublicAccessSecrets(state) {
            if (!isObject(state)) return state;
            const out = clone(state) || {};
            const strip = (shipment) => {
              if (!isObject(shipment)) return shipment;
              const next = clone(shipment) || {};
              for (const key of PUBLIC_ACCESS_SECRET_KEYS) delete next[key];
              return next;
            };
            ['shipments','savedShipments','shipmentArchive','archivedShipments'].forEach((key) => {
              if (Array.isArray(out[key])) out[key] = out[key].map(strip);
            });
            ['shipment','currentShipment','selectedShipment'].forEach((key) => {
              if (isObject(out[key])) out[key] = strip(out[key]);
            });
            return out;
          }
          """
              import textwrap
              s=s.replace(anchor,anchor+'\n'+textwrap.dedent(add),1)
          oldret="  out._teamSyncMeta = mergedMeta;\n  return out;\n}\n\nfunction mergeUsers"
          if oldret in s:
              s=s.replace(oldret,"  out._teamSyncMeta = mergedMeta;\n  return stripPublicAccessSecrets(out);\n}\n\nfunction mergeUsers",1)
          elif 'return stripPublicAccessSecrets(out);' not in s:
              raise SystemExit('mergeState Rückgabeanker fehlt')
          oldsan="  out._teamSyncMeta.tombstones = normalizeTombstones(out._teamSyncMeta);\n  return out;\n}\n\nfunction pruneTombstones"
          if oldsan in s:
              s=s.replace(oldsan,"  out._teamSyncMeta.tombstones = normalizeTombstones(out._teamSyncMeta);\n  return stripPublicAccessSecrets(out);\n}\n\nfunction pruneTombstones",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: RC995 Client und Druckvertrag anwenden
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, textwrap

          p=Path('TESTVERSION.html')
          s=p.read_text(encoding='utf-8')
          old="var BUILD=Object.freeze({version:'RC994',cache:'994',loginReturn:'/TESTVERSION.html?v=994'});"
          new="var BUILD=Object.freeze({version:'RC995',cache:'995',loginReturn:'/TESTVERSION.html?v=995'});"
          if s.count(old)!=1: raise SystemExit(f'RC994 BUILD-Anker: {s.count(old)}')
          s=s.replace(old,new,1)

          done="function done(data,compat){var beforeDone=syncSnapshot(sh)"
          done995="function done(data,compat){var serverToken=q(data&&data.token);if(!/^[a-f0-9]{48}$/i.test(serverToken))throw new Error('RC995: Der Server hat keinen gültigen sicheren Pickup-Token geliefert.');token=serverToken;patchCopies(sh,{pickupToken:serverToken,pickupQrToken:serverToken});var beforeDone=syncSnapshot(sh)"
          if s.count(done)!=1: raise SystemExit(f'Pickup done-Anker: {s.count(done)}')
          s=s.replace(done,done995,1)

          qr="return'<div class=\"index351-qr-box\" data-qr-token=\"'+token+'\">'+svg+'<span>QR-Abholung</span></div>'"
          qr995="return'<div class=\"index351-qr-box\" data-rc995-print-qr=\"pickup\">'+svg+'<span>QR-Abholung</span></div>'"
          if s.count(qr)!=1: raise SystemExit(f'Pickup QR-Markup-Anker: {s.count(qr)}')
          s=s.replace(qr,qr995,1)

          if s.count('SECURITY_VERSION=2')<1: raise SystemExit('Avis SECURITY_VERSION fehlt')
          s=s.replace('SECURITY_VERSION=2','SECURITY_VERSION=995',1)
          enabled="function enabled(sh){var a=avisSnapshot(sh);return !!(a.active&&a.token&&a.securityVersion>=SECURITY_VERSION&&a.enabledAt&&!pickupStamp(a.source||sh)&&!expired(a.source||sh))}"
          enabled995="function enabled(sh){var a=avisSnapshot(sh);return !!(a.active&&a.securityVersion>=SECURITY_VERSION&&a.enabledAt&&!pickupStamp(a.source||sh)&&!expired(a.source||sh))}"
          if s.count(enabled)!=1: raise SystemExit(f'Avis enabled-Anker: {s.count(enabled)}')
          s=s.replace(enabled,enabled995,1)

          rt="function render(){return false}\nasync function toggle(on)"
          helper="""function render(){return false}
          function rc995AvisHeaders(){var rt=window.ExportHUBClean&&window.ExportHUBClean.runtime||{},t=q(rt.authToken||'');if(!t)throw new Error('ExportHUB-Sitzung ist nicht mehr gültig.');return{'Content-Type':'application/json','Accept':'application/json','Cache-Control':'no-cache','X-ExportHUB-Token':t,'X-ExportHUB-Session':t,'Authorization':'Bearer '+t,'X-ExportHUB-Environment':/-testservice\\./i.test(String(location.hostname||''))?'testservice':'production'}}
          async function rc995AvisAction(action,sh){var payload={action:action,shipmentId:id(sh),reference:ref(sh),environment:/-testservice\\./i.test(String(location.hostname||''))?'testservice':'production'},r=await fetch('/api/customer-avis',{method:'POST',credentials:'same-origin',cache:'no-store',headers:rc995AvisHeaders(),body:JSON.stringify(payload)}),data=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(q(data.message)||('HTTP '+r.status));return data}
          async function toggle(on)"""
          helper=textwrap.dedent(helper)
          if s.count(rt)!=1: raise SystemExit(f'Avis toggle-Anker: {s.count(rt)}')
          s=s.replace(rt,helper,1)
          pattern=r"async function toggle\(on\)\{.*?\}\nasync function autoDisableIfDue\(\)"
          m=list(re.finditer(pattern,s,re.S))
          if len(m)!=1: raise SystemExit(f'Avis toggle-Funktion: {len(m)}')
          repl="""async function toggle(on){var sh=current();if(!sh)return false;if(on&&pickupStamp(sh)){alert('Der Lieferavis ist nach der Abholung geschlossen und kann nicht erneut aktiviert werden.');return false}if(on&&!ref(sh)){alert('Die Sendung benötigt zuerst eine Referenznummer.');return false}try{var data=await rc995AvisAction(on?'issue':'disable',sh),stamp=new Date().toISOString(),values=on?{customerAvisEnabled:true,avisEnabled:true,customerAvisToken:q(data.token),avisToken:q(data.token),customerAvisSecurityVersion:995,avisSecurityVersion:995,customerAvisEnabledAt:stamp,avisEnabledAt:stamp,customerAvisExpiresAt:q(data.expiresAt),avisExpiresAt:q(data.expiresAt),customerAvisDisabledAt:'',avisDisabledAt:'',customerAvisResponseStatus:'offen',avisResponseStatus:'offen'}:{customerAvisEnabled:false,avisEnabled:false,customerAvisToken:'',avisToken:'',customerAvisSecurityVersion:0,avisSecurityVersion:0,customerAvisDisabledAt:stamp,avisDisabledAt:stamp};patchCopies(sh,values);lastSig='';render();window.dispatchEvent(new CustomEvent('exporthub:customer-avis-updated',{detail:{reference:ref(sh),enabled:on,version:'RC995'}}));try{if(window.ExportHUBMailStatus373&&typeof window.ExportHUBMailStatus373.patch==='function')window.ExportHUBMailStatus373.patch('Kunden-Avis RC995 geändert')}catch(_){}schedule();return false}catch(e){alert('Kunden-Avis konnte nicht geändert werden.\\n\\n'+q(e&&e.message||e));return false}}
          async function autoDisableIfDue()"""
          repl=textwrap.dedent(repl)
          s=s[:m[0].start()]+repl+s[m[0].end():]

          if '<!-- exporthub-rc995-public-access -->' in s: raise SystemExit('RC995 Clientblock bereits vorhanden')
          block="""
          <!-- exporthub-rc995-public-access -->
          <style id="exporthub-rc995-print-qr">
          .index351-qr-box[data-rc995-print-qr="pickup"]{display:none!important}
          @media print{
            .index351-qr-box[data-rc995-print-qr="pickup"]{display:none!important}
            html:not([data-rc995-pdf="1"]) .index351-qr-box[data-rc995-print-qr="pickup"][data-rc995-print-first="1"]{display:flex!important;width:28mm!important;max-width:28mm!important;min-width:28mm!important;height:auto!important;flex-direction:column!important;gap:1.2mm!important;align-items:center!important;break-inside:avoid!important}
            html:not([data-rc995-pdf="1"]) .index351-qr-box[data-rc995-print-qr="pickup"][data-rc995-print-first="1"] .rc569-qr-svg{width:26mm!important;height:26mm!important;max-width:26mm!important;max-height:26mm!important}
            html:not([data-rc995-pdf="1"]) .index351-qr-box[data-rc995-print-qr="pickup"][data-rc995-print-first="1"] span{font-size:8pt!important;line-height:1.1!important}
          }
          </style>
          <script id="exporthub-rc995-public-access">
          (function(){
          'use strict';
          if(window.__EXPORTHUB_RC995_PUBLIC_ACCESS__)return;window.__EXPORTHUB_RC995_PUBLIC_ACCESS__=true;
          window.RC995_PDF_NO_QR=true;
          window.rc995PdfMode=false;
          window.RC995_CUSTOMER_CONFIRMATION_AVIS_ONLY=true;
          function pickupQrs(){return Array.prototype.slice.call(document.querySelectorAll('.index351-qr-box[data-rc995-print-qr="pickup"]'))}
          function clear(){pickupQrs().forEach(function(n){n.removeAttribute('data-rc995-print-first')})}
          function beforePrint(){clear();document.documentElement.removeAttribute('data-rc995-pdf');var list=pickupQrs();if(list.length)list[0].setAttribute('data-rc995-print-first','1')}
          function afterPrint(){clear()}
          window.addEventListener('beforeprint',beforePrint);
          window.addEventListener('afterprint',afterPrint);
          window.ExportHUBRC995=Object.freeze({version:'RC995',printOnlyPickupQr:true,pdfQr:false,customerConfirmation:'customer-avis-only',beforePrint:beforePrint,afterPrint:afterPrint});
          })();
          </script>
          <!-- /exporthub-rc995-public-access -->
          """
          block=textwrap.dedent(block)
          if s.count('</body>')!=1: raise SystemExit('body-Ende nicht eindeutig')
          s=s.replace('</body>',block+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: RC995 Vertrag und Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          for f in api/shared/public-access-store.js api/shared/merge.js api/pickup-init/index.js api/pickup-status/index.js api/pickup-confirm-v2/index.js api/pickup-pod/index.js api/pod-backup/index.js api/customer-avis/index.js; do node --check "$f"; done
          node --test .github/rc995/rc995-contract.test.mjs
          grep -q "version:'RC995'" TESTVERSION.html
          grep -q 'data-rc995-print-qr' TESTVERSION.html
          grep -q 'RC995_CUSTOMER_CONFIRMATION_AVIS_ONLY' TESTVERSION.html
          grep -q 'customerAvisToken' api/shared/merge.js
          grep -Eq 'pickupToken|qrToken' api/shared/merge.js
          grep -q 'delete next\[key\]' api/shared/merge.js
          grep -q 'RC990' production-version.js
          if grep -q 'RC995' production-version.js; then exit 1; fi

      - name: Bestehende Kernregressionen
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for f in test/rc917-pickup-token-contract.test.mjs test/rc965-avis-retry-performance.test.mjs test/rc969-conditional-state-read.test.mjs test/rc970-auth-etag-cache.test.mjs test/rc975-global-render-integrity.test.mjs test/rc980-colli-row-stability.test.mjs test/rc990-check.test.mjs test/rc991-check.test.mjs test/rc992-check.test.mjs; do
            [ -f "$f" ] && tests+=("$f")
          done
          if [ ${#tests[@]} -gt 0 ]; then node --test "${tests[@]}"; else echo 'Keine optionalen Regressionstests vorhanden.'; fi

      - name: RC995 Nutzdateien committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TESTVERSION.html api
          git diff --cached --check
          if git diff --cached --name-only | grep -qx 'production-version.js'; then exit 1; fi
          if git diff --cached --quiet; then echo 'Keine Änderungen'; exit 0; fi
          git commit -m 'RC995: QR-Abholung und Kunden-Avis sicher aktivieren'
          git push origin HEAD:main
