name: RC946 Drag Audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc946-drag-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Aktive Task- und Lager-Dragpfade präzisieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC945',cache:'945',loginReturn:'/TESTVERSION.html?v=945'" in text, 'Basis ist nicht RC945'

          needles=[
            'function initTasksMoveMode()',
            'function moveTaskCard',
            'function moveTaskRow',
            'function persistUserTaskOrder',
            'exporthub-rc311-task-drag-stability',
            'exporthub-rc457-task-drop-standard',
            'exporthub-rc615-no-task-drag-modals',
            'exporthub-rc620-task-move-fix',
            'exporthub-rc735-task-move-fix',
            'function initWarehouseColumnDrag()',
            'function setWarehouseColumnOrder',
            'function applyWarehouseOrder',
            'warehouseColumnOrder',
            'draggable="true"',
            "setAttribute('draggable','true')",
            'data-move',
          ]

          for needle in needles:
            positions=[]; start=0
            while True:
              pos=text.find(needle,start)
              if pos<0: break
              positions.append(pos)
              start=pos+len(needle)
            print(f'\n### {needle} COUNT={len(positions)} POS={positions}')
            for pos in positions[-12:]:
              lo=max(0,pos-4200); hi=min(len(text),pos+7200)
              print(f'\n=== {needle} @ {pos} ===\n{text[lo:hi].replace("><",">\\n<")}\n')

          print('\n=== DRAG LISTENER OCCURRENCES ===')
          for m in re.finditer(r'addEventListener\(["\'](dragstart|dragend|dragover|drop|pointerdown|pointermove|pointerup|touchstart|touchmove|touchend|mousedown|mousemove|mouseup)["\']', text):
            pos=m.start(); lo=max(0,pos-900); hi=min(len(text),pos+1800)
            ctx=text[lo:hi]
            if re.search(r'task|aufgab|warehouse|lager|planner|card|column|tile',ctx,re.I):
              print(f'\n--- {m.group(1)} @ {pos} ---\n{ctx.replace("><",">\\n<")}')

          print('\n=== RELEVANTE CSS-BLÖCKE ===')
          css_needles=['.task-card{','#warehouse .ext-table-wrap','[draggable="true"]','cursor:grab','cursor:grabbing','touch-action','user-select']
          for needle in css_needles:
            positions=[]; start=0
            while True:
              pos=text.find(needle,start)
              if pos<0: break
              positions.append(pos); start=pos+len(needle)
            print(f'\nCSS {needle} COUNT={len(positions)} POS={positions[-20:]}')
            for pos in positions[-10:]:
              lo=max(0,pos-1200); hi=min(len(text),pos+2400)
              ctx=text[lo:hi]
              if re.search(r'task|aufgab|warehouse|lager|planner|card|column|tile|drag',ctx,re.I):
                print(ctx.replace('><','>\\n<'))
          PY
