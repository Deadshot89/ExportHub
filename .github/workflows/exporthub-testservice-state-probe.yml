name: ExportHUB TESTSERVICE State API Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'TESTVERSION.html'
      - '.github/workflows/exporthub-testservice-state-probe.yml'

permissions:
  contents: read

concurrency:
  group: exporthub-testservice-state-probe
  cancel-in-progress: true

jobs:
  probe_state_api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for live TESTSERVICE state API serverVersion RC931+
        shell: bash
        env:
          TESTSERVICE_URL: https://wonderful-forest-0f315e310-testservice.centralus.7.azurestaticapps.net
          MIN_STATE_API_VERSION: RC931
        run: |
          set -euo pipefail

          url="${TESTSERVICE_URL}/api/exporthub-state?mode=ping"
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT

          for attempt in $(seq 1 30); do
            : > "$headers"
            : > "$body"

            http="$(curl --silent --show-error --location \
              --connect-timeout 8 --max-time 20 \
              --dump-header "$headers" --output "$body" \
              --write-out '%{http_code}' "$url" || true)"

            server_version="$(node - "$body" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          let raw = '';
          try { raw = fs.readFileSync(file, 'utf8'); } catch (_) {}
          try {
            const data = JSON.parse(raw || '{}');
            process.stdout.write(String(data.serverVersion || '').trim());
          } catch (_) {}
          NODE
            )"

            echo "State-API Live-Check $attempt/30: HTTP=${http:-000} serverVersion=${server_version:-fehlt}"

            if [[ "$http" == "200" && "$server_version" =~ ^RC[0-9]+$ ]]; then
              current="${server_version#RC}"
              required="${MIN_STATE_API_VERSION#RC}"
              if (( current >= required )); then
                echo "OK: Live-State-API serverVersion=$server_version erfüllt Mindeststand $MIN_STATE_API_VERSION."
                echo '--- response body ---'
                cat "$body"
                echo
                exit 0
              fi
            fi

            if [[ "$attempt" != "30" ]]; then
              sleep 10
            fi
          done

          echo "FEHLER: Der TESTSERVICE liefert keine echte serverVersion ab $MIN_STATE_API_VERSION."
          echo '--- letzte response headers ---'
          cat "$headers" || true
          echo '--- letzte response body ---'
          cat "$body" || true
          echo
          exit 1
