name: RC885 Productivity Stage 1 Recovery v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc885-productivity-recovery
  cancel-in-progress: false

jobs:
  patch-testservice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Internal main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard current testservice baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html
          VERSION="$(grep -o "version:'RC[0-9]*',cache:'[0-9]*',loginReturn:'/TESTVERSION.html?v=[0-9]*'" TESTVERSION.html | head -n1 | sed -E "s/version:'(RC[0-9]+)'.*/\1/")"
          echo "Detected TESTVERSION baseline: $VERSION"
          test "$VERSION" = "RC883" -o "$VERSION" = "RC884"
          grep -q "function rc843EnsureView()" TESTVERSION.html
          grep -q "__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__=rc843ReleaseViewGuard" TESTVERSION.html
          grep -q "function route(view,source)" TESTVERSION.html
          grep -q "rc807ShipmentSearch" TESTVERSION.html
          grep -q "function placeWorkflowButtons(customerBody,shipmentBody,documentsBody)" TESTVERSION.html
          grep -q "function avisHost(view)" TESTVERSION.html
          grep -q "function renderDashboard(forceFull)" TESTVERSION.html
          grep -q "window.ExportHUBShipmentView=Object.freeze" TESTVERSION.html
          grep -q "function setShipmentCustomerSearchAuto(v)" TESTVERSION.html
          ! grep -q 'id="exporthub-rc885-productivity"' TESTVERSION.html

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable recovery backup tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-before-rc885-productivity-recovery"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Backup tag already exists: $TAG"
          else
            git tag -a "$TAG" -m "Last known testservice baseline before RC885 productivity recovery"
            git push origin "$TAG"
          fi

      - name: Apply missing RC884 fixes and RC885 productivity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'TESTVERSION.html';
          let text = fs.readFileSync(path, 'utf8');
          const original = text;

          function replaceOnce(oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0) throw new Error(label + ': Ausgangsblock nicht gefunden');
            if (text.indexOf(oldText, first + oldText.length) >= 0) throw new Error(label + ': Ausgangsblock mehrfach gefunden');
            text = text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          function findFunctionRange(source, name, fromIndex) {
            const marker = 'function ' + name + '(';
            const start = source.indexOf(marker, fromIndex || 0);
            if (start < 0) throw new Error(name + ': Funktion nicht gefunden');
            const brace = source.indexOf('{', start);
            if (brace < 0) throw new Error(name + ': öffnende Klammer fehlt');
            let depth = 0, quote = '', escape = false, lineComment = false, blockComment = false;
            for (let i = brace; i < source.length; i++) {
              const c = source[i], n = source[i + 1] || '';
              if (lineComment) { if (c === '\n') lineComment = false; continue; }
              if (blockComment) { if (c === '*' && n === '/') { blockComment = false; i++; } continue; }
              if (quote) {
                if (escape) { escape = false; continue; }
                if (c === '\\') { escape = true; continue; }
                if (c === quote) quote = '';
                continue;
              }
              if (c === '/' && n === '/') { lineComment = true; i++; continue; }
              if (c === '/' && n === '*') { blockComment = true; i++; continue; }
              if (c === "'" || c === '"' || c === '`') { quote = c; continue; }
              if (c === '{') depth++;
              if (c === '}') {
                depth--;
                if (depth === 0) return { start, end: i + 1, source: source.slice(start, i + 1) };
              }
            }
            throw new Error(name + ': Funktionsende nicht gefunden');
          }

          function replaceFunctionAfter(anchor, name, newSource, label) {
            const anchorIndex = text.indexOf(anchor);
            if (anchorIndex < 0) throw new Error(label + ': Anker nicht gefunden');
            const range = findFunctionRange(text, name, anchorIndex);
            text = text.slice(0, range.start) + newSource + text.slice(range.end);
          }

          const build = text.match(/var BUILD=Object\.freeze\(\{version:'(RC\d+)',cache:'(\d+)',loginReturn:'\/TESTVERSION\.html\?v=(\d+)'\}\);/);
          if (!build) throw new Error('Canonical BUILD konnte nicht erkannt werden');
          const startVersion = build[1];
          if (startVersion !== 'RC883' && startVersion !== 'RC884') throw new Error('Nicht unterstützte Ausgangsversion: ' + startVersion);

          // RC884-Reparaturen nur nachholen, wenn der Testservice noch RC883 ist.
          if (startVersion === 'RC883') {
            const oldRouteAfterPermission =
              "}var now=Date.now();if(routeBusy||(view===lastRoute&&now-lastRouteAt<120)){duplicateRoutesBlocked++;return false}var previous=current();routeBusy=true;";
            const newRouteAfterPermission =
              "}var now=Date.now();if(routeBusy||(view===lastRoute&&now-lastRouteAt<120)){duplicateRoutesBlocked++;return false}var previous=current();if(view!=='shipmentview'&&typeof window.__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__==='function'){try{window.__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__('route-'+view)}catch(_){}}routeBusy=true;";
            if (!text.includes("__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__('route-'+view)")) {
              replaceOnce(oldRouteAfterPermission, newRouteAfterPermission, 'Navigation Guard Release');
            }

            const oldGuard =
              "function rc843EnsureView(){if(rc843ViewGuardBusy||!rc843ViewGuard)return false;var g=rc843ViewGuard,sh=find(g.id||g.ref);if(!sh){rc843ReleaseViewGuard('shipment-missing');return false}var s=state(),wanted=idOf(sh)||refOf(sh),currentId=q(s.shipmentViewId);if(low(s.view)==='shipmentview'&&currentId===wanted&&rc843ViewDomOk())return true;rc843ViewGuardBusy=true;try{s.shipmentViewId=wanted;if(!q(s.shipmentViewReturnView))s.shipmentViewReturnView=g.source||'shipmentoverview';s.view='shipmentview';try{if(typeof window.__EXPORTHUB_BIND_STATE__==='function')window.__EXPORTHUB_BIND_STATE__(s)}catch(_){}try{document.body.setAttribute('data-exporthub-view','shipmentview');document.body.setAttribute('data-current-view','shipmentview')}catch(_){}render();return true}finally{rc843ViewGuardBusy=false}}";
            const newGuard =
              "function rc843EnsureView(){if(rc843ViewGuardBusy||!rc843ViewGuard)return false;var g=rc843ViewGuard,sh=find(g.id||g.ref);if(!sh){rc843ReleaseViewGuard('shipment-missing');return false}var s=state(),wanted=idOf(sh)||refOf(sh),currentId=q(s.shipmentViewId);if(low(s.view)!=='shipmentview'&&Date.now()<Number(window.__EXPORTHUB_NAVIGATION_ACTIVE_UNTIL__||0)){rc843ReleaseViewGuard('explicit-navigation');return false}if(low(s.view)==='shipmentview'&&currentId===wanted&&rc843ViewDomOk())return true;rc843ViewGuardBusy=true;try{s.shipmentViewId=wanted;if(!q(s.shipmentViewReturnView))s.shipmentViewReturnView=g.source||'shipmentoverview';s.view='shipmentview';try{if(typeof window.__EXPORTHUB_BIND_STATE__==='function')window.__EXPORTHUB_BIND_STATE__(s)}catch(_){}try{document.body.setAttribute('data-exporthub-view','shipmentview');document.body.setAttribute('data-current-view','shipmentview')}catch(_){}render();return true}finally{rc843ViewGuardBusy=false}}";
            if (!text.includes('explicit-navigation')) replaceOnce(oldGuard, newGuard, 'RC843 Shipment View Guard');

            const avisCleanupRender =
              "function render(){['rc705AvisMountRead','rc705AvisMountEdit','rc845AvisReadHost','rc845AvisEditHost','rc844AvisHost','rc849AvisReadCard','rc363BlockAvis'].forEach(function(id){var node=document.getElementById(id);if(node)node.remove()});lastSig='';return false}";
            replaceFunctionAfter('function avisHost(view)', 'render', avisCleanupRender, 'Interner Kunden-Avis Renderer');

            const addressCleanup =
              "function updateConfirmationButtons(){var address=document.getElementById('rc386AddressConfirmed');if(address)address.remove();var hidden=document.getElementById('rc386AddressState');if(hidden)hidden.remove();return false}";
            replaceFunctionAfter('function addressSelectionValid()', 'updateConfirmationButtons', addressCleanup, 'Adressbestätigung');

            const confirmationCall = " confirmationButton(customerActions,'rc386AddressConfirmed','Adresse geprüft und bestätigt','addressConfirmed',[]);";
            if (text.includes(confirmationCall)) replaceOnce(confirmationCall, '', 'Adressbestätigungs-Button');

            const oldCustomerDecl = "     customerBtn=workflowButton(/^kunde ubernehmen$/);";
            const newCustomerDecl = "     customerBtn=workflowButton(/^kunde ubernehmen$/);if(customerBtn){customerBtn.remove();customerBtn=null}";
            if (text.includes(oldCustomerDecl)) replaceOnce(oldCustomerDecl, newCustomerDecl, 'Kunde übernehmen Button');
          }

          // RC885 Build-Metadaten robust aktualisieren – unabhängig vom RC883 Release-Titel.
          text = text.replace(
            /var BUILD=Object\.freeze\(\{version:'RC88[34]',cache:'88[34]',loginReturn:'\/TESTVERSION\.html\?v=88[34]'\}\);/,
            "var BUILD=Object.freeze({version:'RC885',cache:'885',loginReturn:'/TESTVERSION.html?v=885'});"
          );
          const releaseRx = /var RELEASE=Object\.freeze\(\{\s*\n\s*version:'RC88[34]',\s*\n\s*date:'[^']*',\s*\n\s*title:'[^']*',/;
          if (!releaseRx.test(text)) throw new Error('Canonical RELEASE-Metadaten konnten nicht erkannt werden');
          text = text.replace(releaseRx, "var RELEASE=Object.freeze({\n version:'RC885',\n date:'30.08.2026',\n title:'Produktivitätsstufe 1: globale Suche und Arbeitsfokus',");

          const moduleBase64 = '';
          const moduleHtml = Buffer.from(moduleBase64, 'base64').toString('utf8');
          if (!moduleHtml.includes('exporthub-rc885-productivity') || !moduleHtml.includes('ExportHUBProductivity885')) throw new Error('RC885 Modul beschädigt');
          const bodyClose = text.lastIndexOf('</body>');
          if (bodyClose < 0) throw new Error('HTML body-Ende fehlt');
          text = text.slice(0, bodyClose) + '\n' + moduleHtml + '\n' + text.slice(bodyClose);

          const changesAnchor = " changes:Object.freeze([\n";
          const changesPos = text.indexOf(changesAnchor);
          if (changesPos < 0) throw new Error('Release changes: Anker fehlt');
          const newChanges =
            '    "RC885 enthält zusätzlich die RC884-Korrekturen für Navigation, Sendungssuche und die interne Sendungsmaske, falls der Testservice noch auf RC883 stand.",\n' +
            '    "RC885 ergänzt eine globale Suche mit Strg+K. Sie findet Funktionen, Sendungen, Kunden und Aufgaben und verwendet die bestehenden ExportHUB-Routen und die vorhandene schreibgeschützte Sendungsansicht.",\n' +
            '    "RC885 ergänzt auf dem Dashboard Meine Arbeit heute mit Überfällig, Heute, ABD offen und POD fehlt sowie einer priorisierten Liste der nächsten Aktionen.",\n' +
            '    "RC885 merkt die zuletzt verwendeten Sendungen, Kunden und Bereiche ausschließlich als lokale Bedienpräferenz. Fach- und Teamdaten werden dafür nicht verändert oder separat gespeichert.",\n' +
            '    "RC885 ändert ausschließlich TESTVERSION.html. Produktion, APIs, Pickup, Location, Customer-Avis und Produktionskonfiguration bleiben unverändert.",\n';
          text = text.slice(0, changesPos + changesAnchor.length) + newChanges + text.slice(changesPos + changesAnchor.length);

          if (text === original) throw new Error('Keine Änderung erzeugt');
          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: Static RC885 recovery safety tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('TESTVERSION.html', 'utf8');
          function required(rx, message) { if (!rx.test(text)) throw new Error(message); }

          required(/version:'RC885',cache:'885',loginReturn:'\/TESTVERSION\.html\?v=885'/, 'RC885 BUILD fehlt');
          required(/__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__\('route-'\+view\)/, 'Navigation-Guard wird nicht freigegeben');
          required(/explicit-navigation/, 'Explizite Navigation ist nicht geschützt');
          required(/input\.id==='rc807ShipmentSearch'/, 'Bestehende Sendungssuche fehlt');
          required(/function setShipmentCustomerSearchAuto\(v\)/, 'Automatische Kundenauswahl fehlt');
          required(/function renderDashboard\(forceFull\)/, 'Dashboard-Renderer fehlt');
          required(/window\.ExportHUBShipmentView=Object\.freeze/, 'Sendungsansicht-API fehlt');
          if (text.includes("confirmationButton(customerActions,'rc386AddressConfirmed','Adresse geprüft und bestätigt'")) throw new Error('Adressbestätigung ist zurückgekehrt');

          required(/id="exporthub-rc885-productivity-style"/, 'RC885 CSS fehlt');
          required(/id="exporthub-rc885-productivity"/, 'RC885 Modul fehlt');
          required(/__EXPORTHUB_RC885_PRODUCTIVITY__/, 'RC885 Single-Install-Guard fehlt');
          required(/ctrlKey\|\|e\.metaKey/, 'Strg+K / Cmd+K Tastatursteuerung fehlt');
          required(/ExportHUBProductivity885=Object\.freeze/, 'RC885 Diagnose-API fehlt');
          required(/Meine Arbeit heute/, 'Dashboard Arbeitsfokus fehlt');
          required(/ABD offen/, 'ABD Arbeitsstatus fehlt');
          required(/POD fehlt/, 'POD Arbeitsstatus fehlt');
          required(/Zuletzt verwendet/, 'Recent-Bereich fehlt');
          required(/localStorage\.setItem\(RECENT_KEY/, 'Lokale Recent-Persistenz fehlt');

          const scriptStart = text.indexOf('<script id="exporthub-rc885-productivity">');
          const bodyStart = text.indexOf('\n', scriptStart) + 1;
          const scriptEnd = text.indexOf('</script>', bodyStart);
          if (scriptStart < 0 || bodyStart <= 0 || scriptEnd < 0) throw new Error('RC885 Script kann nicht extrahiert werden');
          new Function(text.slice(bodyStart, scriptEnd));
          console.log('RC885 recovery safety tests: PASS');
          NODE

      - name: Verify production scope untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json; then
            echo "ERROR: Production/API/public files changed."
            git diff -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json
            exit 1
          fi
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "TESTVERSION.html"

      - name: Write RC885 recovery test report
        shell: bash
        run: |
          cat > RC885_PRUEFBERICHT.txt <<'EOF'
          TESTBERICHT RC885 – PRODUKTIVITÄTSSTUFE 1 / RECOVERY V2

          Scope:
          - Ausschließlich TESTSERVICE / TESTVERSION.html
          - Produktion, APIs, Pickup, Location, Customer-Avis und Produktionskonfiguration unverändert
          - Unterstützte Ausgangsbasis: RC883 oder RC884

          Recovery:
          - Wenn der Testservice noch RC883 ist, werden die fehlenden RC884-Korrekturen zuerst im selben kontrollierten Lauf nachgezogen.
          - Danach wird RC885 aufgebaut.

          RC884-Korrekturen:
          1. Navigation darf nicht mehr durch den Shipment-View-Guard auf Sendungsansicht zurückspringen.
          2. Sendungssuche bleibt aktiv.
          3. Interner KundenAvis-Bereich wird aus Sendung erstellen / Sendungsansicht entfernt.
          4. Kunde übernehmen und Adresse geprüft und bestätigt werden entfernt.

          RC885 Produktivität:
          1. Globale Suche mit Strg+K / Cmd+K.
          2. Suche nach Funktionen, Sendungen, Kunden und Aufgaben.
          3. Dashboard „Meine Arbeit heute“.
          4. Überfällig / Heute / ABD offen / POD fehlt.
          5. Zuletzt verwendete Sendungen, Kunden und Bereiche.

          Live-Test:
          A. TESTSERVICE öffnen und RC885 prüfen.
          B. Strg+K öffnen und bekannte Referenz suchen.
          C. Sendungsansicht öffnen und danach Dashboard, Aufgaben, Planung und Kunden wechseln – kein Zurückspringen.
          D. Sendung erstellen: kein Kunde-übernehmen-Button, keine Adressbestätigung, kein interner KundenAvis.
          E. Dashboard: „Meine Arbeit heute“ und „Zuletzt verwendet“ sichtbar.
          F. Produktion nicht testen/verändern.
          EOF

      - name: Commit RC885 testservice recovery
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html RC885_PRUEFBERICHT.txt
          git commit -m "RC885: recover RC884 baseline and add productivity stage 1"
          git push origin main
