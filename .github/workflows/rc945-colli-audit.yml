name: RC945 Colli Layout Audit

on:
  push:
    paths:
      - '.github/workflows/rc945-colli-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Aktiven Colli Bereich präzisieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          text = Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC944',cache:'944',loginReturn:'/TESTVERSION.html?v=944'" in text, 'Basis ist nicht RC944'

          needles = [
              'exporthub-rc900-stable-colli-layout',
              'exporthub-rc904-colli-summary-typography',
              'rc573ColliCard',
              'canonicalColliCard',
              'function ownedRow',
              'rc363-colli-grid',
              'rc626-colli-grid',
              'rc626-colli-row',
          ]
          for needle in needles:
              positions=[]; start=0
              while True:
                  pos=text.find(needle,start)
                  if pos<0: break
                  positions.append(pos); start=pos+len(needle)
              print(f'\n### {needle} COUNT={len(positions)} POS={positions[-12:]}')
              for pos in positions[-8:]:
                  lo=max(0,pos-2600); hi=min(len(text),pos+5200)
                  print(f'\n=== {needle} @ {pos} ===\n{text[lo:hi].replace("><",">\\n<")}\n')
          PY
