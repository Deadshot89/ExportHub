name: RC1111 Deckblatt Diagnose

on:
  push:
    branches:
      - rc1111-deckblatt-contrast
    paths:
      - 'scripts/inspect-deckblatt.mjs'
      - '.github/workflows/rc1111-deckblatt-diagnose.yml'
      - 'assets/rc1111-deckblatt-contrast.js'
      - '.github/rc1048/build-three-env.mjs'
      - 'test/rc1111-deckblatt-contrast.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Inspect Deckblatt source
        run: node scripts/inspect-deckblatt.mjs
