<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ExportHUB · Location buchen</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#102a43;background:#eef7fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#edf7fc,#f8fbfd);padding:22px}.wrap{max-width:720px;margin:0 auto}.top{background:#facc15;border:3px solid #eab308;border-radius:20px 20px 0 0;padding:14px 18px;font-weight:900;color:#422006;text-align:center;letter-spacing:.04em}.card{background:#fff;border:1px solid #cbddeb;border-radius:0 0 22px 22px;box-shadow:0 18px 50px rgba(15,65,95,.14);padding:22px}.brand{display:flex;gap:14px;align-items:center;margin-bottom:20px}.logo{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,#38bdf8,#67e8f9);display:grid;place-items:center;font-weight:950;font-size:20px}.brand h1{font-size:25px;margin:0;color:#08275c}.brand p{margin:4px 0 0;color:#61758a;font-size:14px}.status{padding:12px 14px;border-radius:12px;background:#eef7ff;border:1px solid #bfdaf2;margin:0 0 16px}.status.bad{background:#fff1f2;border-color:#fecaca;color:#991b1b}.status.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}.box{border:1px solid #d8e5ef;background:#f8fbfd;border-radius:14px;padding:12px}.box span{display:block;font-size:12px;font-weight:800;color:#64748b;margin-bottom:5px}.box b{font-size:17px;color:#0b295a}.current{grid-column:1/-1;background:#fffbeb;border-color:#fde68a}.form{border-top:1px solid #e2e8f0;padding-top:18px}.form h2{font-size:18px;margin:0 0 6px}.form p{margin:0 0 16px;color:#64748b}.locs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 15px}.loc{border:1px solid #bdd3e4;border-radius:12px;background:#fff;padding:12px 6px;text-align:center;font-size:13px;font-weight:800;cursor:pointer}.loc strong{display:block;font-size:20px;color:#0f5d89}.loc.active{background:#fff7cc;border:2px solid #eab308}.field{display:block;font-weight:800;font-size:13px;margin-top:12px}.field input{width:100%;margin-top:6px;padding:13px 14px;border:1px solid #bfd2e3;border-radius:12px;font-size:18px}.btn{margin-top:16px;width:100%;border:0;border-radius:13px;padding:14px 18px;background:#0ea5e9;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.done{text-align:center;padding:22px 4px}.done .check{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:#dcfce7;color:#15803d;font-size:34px;font-weight:900}@media(max-width:560px){body{padding:10px}.card{padding:16px}.grid{grid-template-columns:1fr}.locs{grid-template-columns:repeat(2,minmax(0,1fr))}.current{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap"><div class="top">GELB = LOCATION · EXPORT HUB</div><main class="card"><div class="brand"><div class="logo">EH</div><div><h1>Sendung bereitstellen</h1><p>Ausgangslocation buchen oder umbuchen</p></div></div><div id="status" class="status">Sendungsdaten werden geladen …</div><div id="content"></div></main></div>
<script>
(function(){'use strict';
var selected=0,record=null,submitting=false;
function q(v){return String(v==null?'':v).trim()}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function token(){try{var u=new URL(location.href),h=decodeURIComponent(String(u.hash||'').replace(/^#/,'')),m=h.match(/(?:^|[&/])location(?:=|\/)([A-Za-z0-9_-]{6,128})/i);return q(u.searchParams.get('location')||u.searchParams.get('token')||(m&&m[1]))}catch(_){return''}}
function stat(t,k){var e=document.getElementById('status');e.textContent=t;e.className='status '+(k||'')}
async function api(action,opt){opt=opt||{};var u='/api/location-booking?action='+encodeURIComponent(action)+'&token='+encodeURIComponent(token())+'&_='+Date.now(),r=await fetch(u,{method:opt.method||'GET',credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json','Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined}),b={};try{b=await r.json()}catch(_){}if(!r.ok||b.ok===false)throw new Error(b.message||('HTTP '+r.status));return b}
var locs=[[1,'Regal'],[2,'Lane 1'],[3,'Lane 2'],[4,'Lane 3'],[5,'Lane 4'],[6,'Lane 5'],[7,'Vor dem Regal']];
function render(r){record=r;var c=document.getElementById('content');if(r.collected){stat('Diese Sendung wurde bereits abgeholt. Eine neue Location-Buchung ist gesperrt.','bad');c.innerHTML='<div class="done"><div class="check">✓</div><h2>Sendung abgeholt</h2><p>Die Sendung befindet sich nicht mehr im Versandlager.</p></div>';return}var buttons=locs.map(function(x){return'<button type="button" class="loc '+(Number(r.locationCode)===x[0]?'active':'')+'" data-location="'+x[0]+'"><strong>'+x[0]+'</strong>'+esc(x[1])+'</button>'}).join('');c.innerHTML='<div class="grid"><div class="box"><span>Sendung</span><b>'+esc(r.reference||r.shipmentId||'—')+'</b></div><div class="box"><span>Kunde</span><b>'+esc(r.customer||'—')+'</b></div><div class="box"><span>Anzahl der Paletten</span><b>'+esc(r.palletCount||0)+'</b></div><div class="box"><span>Verlader</span><b>'+esc(r.loaderName||'Noch nicht gebucht')+'</b></div><div class="box current"><span>Aktuelle Location</span><b>'+esc(r.currentLocation||'Eingang')+'</b></div></div><form id="form" class="form"><h2>Ausgangslocation</h2><p>Location auswählen oder einfach die Zahl 1 bis 7 antippen.</p><div class="locs">'+buttons+'</div><label class="field">Location 1–7<input id="locationCode" type="number" inputmode="numeric" min="1" max="7" step="1" autocomplete="off"></label><label class="field">Persönlicher Verlader-PIN<input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="one-time-code"></label><button id="save" class="btn" type="submit">Location buchen</button></form>';document.querySelectorAll('[data-location]').forEach(function(b){b.onclick=function(){selected=Number(this.dataset.location);document.getElementById('locationCode').value=selected;document.querySelectorAll('[data-location]').forEach(function(x){x.classList.toggle('active',x===b)})}});document.getElementById('locationCode').oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,1);selected=Number(this.value||0)};document.getElementById('pin').oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,4)};document.getElementById('form').onsubmit=book;stat(r.prepared?'Sendung ist bereitgestellt. Eine Umbuchung ist möglich.':'Sendung ist zur Bereitstellung freigegeben.','ok')}
async function load(){if(!/^[A-Za-z0-9_-]{6,128}$/.test(token())){stat('Location-QR ist ungültig.','bad');return}try{render(await api('status'))}catch(e){stat(e.message,'bad')}}
async function book(e){e.preventDefault();if(submitting)return false;var code=Number(document.getElementById('locationCode').value||selected),pin=q(document.getElementById('pin').value),button=document.getElementById('save');if(!(code>=1&&code<=7)){stat('Bitte eine Location von 1 bis 7 auswählen.','bad');return false}if(!/^\d{4}$/.test(pin)){stat('Der Verlader-PIN muss genau vier Ziffern enthalten.','bad');return false}submitting=true;button.disabled=true;stat('Location wird gebucht …');try{var r=await api('book',{method:'POST',body:{locationCode:code,pin:pin}});render(r);stat('✓ Location erfolgreich gebucht: '+r.currentLocation+' · Verlader: '+r.loaderName,'ok')}catch(err){stat(err.message,'bad')}finally{submitting=false;var b=document.getElementById('save');if(b)b.disabled=false}return false}
load();
})();
</script>
</body></html>
