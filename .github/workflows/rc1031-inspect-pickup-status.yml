name: RC1031 Pickup Status Inspect
on:
  push:
    branches:
      - fix/rc1031-diagnostics-lieferavis-storage
    paths:
      - .github/workflows/rc1031-inspect-pickup-status.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: QR-Synchronisation und Resetpfad untersuchen
        run: |
          node - <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('TESTVERSION.html','utf8');
          for(const needle of ['serverMissUntil','function tokensFor(','function resetPickupServer(','function syncOne(','function syncAll(']){
            let at=0,n=0;while((at=s.indexOf(needle,at))>=0){n++;console.log('\n### '+needle+' '+n+' @ '+at+' ###');console.log(s.slice(Math.max(0,at-1400),Math.min(s.length,at+3600)).replace(/\n/g,' '));at+=needle.length}
          }
          NODE
