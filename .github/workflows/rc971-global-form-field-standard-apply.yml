name: RC971 Global Form Field Standard Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc971-global-form-field-standard-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RC971 Produktpatch anwenden
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64

          p=Path('TESTVERSION.html')
          s=p.read_text(encoding='utf-8')
          assert 'id="rc971-global-form-field-standard"' not in s, 'RC971 Style bereits vorhanden'
          assert "var BUILD=Object.freeze({version:'RC970',cache:'970'" in s, 'Erwarteter RC970 BUILD fehlt'

          style=base64.b64decode('<TRUNCATED_BASE64>','utf-8').decode('ascii'))

          s=s.replace("var BUILD=Object.freeze({version:'RC970',cache:'970'","var BUILD=Object.freeze({version:'RC971',cache:'971'",1)
          needle=' changes:Object.freeze([\n'
          assert needle in s
          notes=("    'RC971 führt einen globalen Form-&-Field-Standard für ExportHUB ein: Text-, Zahl-, Datums-, Such-, E-Mail-, Passwort-, Select-, Textarea- und Uploadfelder erhalten einheitliche Höhen, Innenabstände, Schriftgrößen, Fokuszustände und Placeholder-Typografie.',\n"
                 "    'RC971 korrigiert zusätzlich die besonders kompakten Sonderbereiche Sendung/Colli, Dokumente & ABD, Mail, Aufgabenplaner und Stauplan. Druck-/CMR- und Signaturbereiche bleiben von der Bildschirm-Formularnorm ausgeschlossen; Fach- und Speicherlogik bleiben unverändert.',\n")
          s=s.replace(needle,needle+notes,1)
          assert '</head>' in s
          s=s.replace('</head>',style+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY

          git diff --check
          node --test test/rc971-global-form-field-standard.test.mjs
          npm test

      - name: Commit RC971 Produktpatch
        shell: bash
        run: |
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add TESTVERSION.html
          git commit -m 'RC971: globalen Form- und Feldstandard anwenden'
          git push origin main
