name: RC1005 E3 Legacy Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1005 Regressionen prüfen
        run: |
          node --test test/rc1005-e3-packaging-dimensions.test.mjs
          node --test test/rc1005-e3-packaging-precedence.test.mjs
          node --test test/rc980-colli-row-stability.test.mjs
