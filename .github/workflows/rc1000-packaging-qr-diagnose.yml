name: RC1000 Pickup Reissue RED

on:
  push:
    branches: [rc1000-clean-navigation-search]
    paths:
      - '.github/workflows/rc1000-packaging-qr-diagnose.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1000-clean-navigation-search
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: node --test .github/rc1000/rc1000-pickup-reissue.test.cjs
