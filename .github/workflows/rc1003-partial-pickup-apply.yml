name: RC1003 Partial Pickup Apply

on:
  push:
    branches: [rc1003-partial-pickup-ui]
    paths:
      - '.github/workflows/rc1003-partial-pickup-apply.yml'
      - '.github/rc1003/apply-partial-pickup-ui.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Teilabholung UI anwenden
        run: node .github/rc1003/apply-partial-pickup-ui.mjs
      - name: Teilabholung-Vertrag
        run: node --test .github/rc998/partial-pickup-avis-contract.test.mjs
      - name: Bestehende QR-Abholung Regression
        run: node --test .github/rc1000/rc1000-production-pickup.test.mjs
      - name: Diff pruefen
        run: git diff --check
      - name: Gepruefte Aenderung committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pickup.html; then
            echo 'Keine pickup.html-Aenderung erzeugt'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pickup.html
          git commit -m 'RC1003: Teilabholung in QR-Abholung bedienbar machen'
          git push origin HEAD:rc1003-partial-pickup-ui
