name: RC891 Professional Shipment Overview Stage 7 v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc891-overview-v2
  cancel-in-progress: false

jobs:
  patch-testservice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Internal main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard RC890 baseline
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f TESTVERSION.html ]; then
            echo "::error title=TESTVERSION fehlt::TESTVERSION.html wurde im Repository nicht gefunden."
            exit 1
          fi
          VERSION="$(grep -o "version:'RC[0-9]*',cache:'[0-9]*',loginReturn:'/TESTVERSION.html?v=[0-9]*'" TESTVERSION.html | head -n1 | sed -E "s/version:'(RC[0-9]+)'.*/\1/")"
          echo "Detected TESTVERSION baseline: ${VERSION:-unbekannt}"
          if [ "$VERSION" != "RC890" ]; then
            echo "::error title=RC890 Voraussetzung fehlt::Erkannt wurde ${VERSION:-keine Version}. Bitte zuerst 'RC890 Personal Workspace Stage 6 v2' erfolgreich ausführen. RC891 verändert in diesem Zustand nichts."
            exit 1
          fi
          required_marker() {
            local marker="$1"
            local label="$2"
            if ! grep -Fq "$marker" TESTVERSION.html; then
              echo "::error title=RC890 unvollständig::$label fehlt. RC891 wird aus Sicherheitsgründen nicht installiert."
              exit 1
            fi
          }
          required_marker "Produktivitätsstufe 6: Persönlicher Arbeitsplatz, Warncenter und Übersicht-Schnellaktionen" "RC890 Release-Metadaten"
          required_marker 'id="exporthub-rc885-productivity"' "RC885 Produktivitätsmodul"
          required_marker 'ExportHUBProductivity885=Object.freeze' "RC885 Diagnose-API"
          required_marker 'id="exporthub-rc886-shipment-progress"' "RC886 Fortschrittsmodul"
          required_marker 'ExportHUBShipmentProgress886=Object.freeze' "RC886 Diagnose-API"
          required_marker 'id="exporthub-rc887-quickwork"' "RC887 Schnellarbeitsmodul"
          required_marker 'ExportHUBQuickWork887=Object.freeze' "RC887 Diagnose-API"
          required_marker 'id="exporthub-rc888-professional"' "RC888 Professional-Modul"
          required_marker 'ExportHUBProfessional888=Object.freeze' "RC888 Diagnose-API"
          required_marker 'id="exporthub-rc889-actionbar"' "RC889 Aktionsleisten-Modul"
          required_marker 'ExportHUBUX889=Object.freeze' "RC889 Diagnose-API"
          required_marker 'id="exporthub-rc890-workspace"' "RC890 Arbeitsplatz-Modul"
          required_marker 'ExportHUBWorkspace890=Object.freeze' "RC890 Diagnose-API"
          if grep -Fq 'id="exporthub-rc891-overview"' TESTVERSION.html; then
            echo "::error title=RC891 bereits vorhanden::Der RC891-Modulmarker ist bereits vorhanden. Workflow beendet sicher, statt doppelt zu installieren."
            exit 1
          fi

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC890 backup tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-rc890-before-rc891-overview"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Backup tag already exists: $TAG"
          else
            git tag -a "$TAG" -m "Last known RC890 baseline before RC891 shipment overview"
            git push origin "$TAG"
          fi

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'TESTVERSION.html';
          let text = fs.readFileSync(path, 'utf8');
          const original = text;

          function replaceOnce(oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0) throw new Error(label + ': Ausgangsblock nicht gefunden');
            if (text.indexOf(oldText, first + oldText.length) >= 0) throw new Error(label + ': Ausgangsblock mehrfach gefunden');
            text = text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          replaceOnce(
            "var BUILD=Object.freeze({version:'RC890',cache:'890',loginReturn:'/TESTVERSION.html?v=890'});",
            "var BUILD=Object.freeze({version:'RC891',cache:'891',loginReturn:'/TESTVERSION.html?v=891'});",
            'Canonical BUILD'
          );

          replaceOnce(
            " version:'RC890',\n date:'30.08.2026',\n title:'Produktivitätsstufe 6: Persönlicher Arbeitsplatz, Warncenter und Übersicht-Schnellaktionen',",
            " version:'RC891',\n date:'30.08.2026',\n title:'Produktivitätsstufe 7: Professionelle Sendungsübersicht mit Filtern, Sortierung und gespeicherten Ansichten',",
            'Release metadata'
          );

          const module = Buffer.from('', 'base64').toString('utf8');
          if (!module.includes('id="exporthub-rc891-overview"')) throw new Error('RC891 Modulmarker fehlt im eingebetteten Modul');
          const bodyClose = text.lastIndexOf('</body>');
          if (bodyClose < 0) throw new Error('</body> nicht gefunden');
          text = text.slice(0, bodyClose) + '\n' + module + '\n' + text.slice(bodyClose);

          if (text === original) throw new Error('RC891 hat keine Änderung erzeugt');
          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: RC891 static safety tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('TESTVERSION.html', 'utf8');
          function required(re, msg) { if (!re.test(text)) throw new Error(msg); }
          function count(s) { return text.split(s).length - 1; }

          required(/version:'RC891',cache:'891',loginReturn:'\/TESTVERSION\.html\?v=891'/, 'RC891 BUILD fehlt');
          if (count('id="exporthub-rc891-overview"') !== 1) throw new Error('RC891 Scriptmarker nicht genau einmal vorhanden');
          if (count('id="exporthub-rc891-overview-style"') !== 1) throw new Error('RC891 Stylemarker nicht genau einmal vorhanden');
          required(/ExportHUBOverview891=Object\.freeze/, 'RC891 Diagnose-API fehlt');
          required(/PROFESSIONELLE SENDUNGSÜBERSICHT/, 'RC891 Übersichtsbereich fehlt');
          required(/Filter, Sortierung & gespeicherte Ansichten/, 'RC891 Funktionsüberschrift fehlt');
          required(/data-rc891-quick=/, 'RC891 Schnellfilter fehlen');
          required(/data-rc891-saved=/, 'RC891 gespeicherte Ansichten fehlen');
          required(/PREF_KEY='exporthub:rc891:shipment-overview:v1'/, 'RC891 lokale Filterpräferenz fehlt');
          required(/SAVED_KEY='exporthub:rc891:saved-views:v1'/, 'RC891 lokale gespeicherte Ansichten fehlen');
          required(/ExportHUBShipmentView/, 'RC891 nutzt nicht den bestehenden Sendungs-Öffnen-Pfad');

          const scriptStart = text.indexOf('<script id="exporthub-rc891-overview">');
          const bodyStart = text.indexOf('\n', scriptStart) + 1;
          const scriptEnd = text.indexOf('</script>', bodyStart);
          if (scriptStart < 0 || bodyStart <= 0 || scriptEnd < 0) throw new Error('RC891 Script kann nicht extrahiert werden');
          const js = text.slice(bodyStart, scriptEnd);
          new Function(js);

          if (/fetch\s*\(|XMLHttpRequest|sendBeacon\s*\(|WebSocket\s*\(/.test(js)) throw new Error('RC891 enthält unerlaubten Netzwerkweg');
          if (/queueSave\s*\(|saveShipment\s*\(|saveTeam|azureSave|teamSave/.test(js)) throw new Error('RC891 enthält unerlaubten Speicherweg');
          if (/state\(\)\.shipments\s*=|\.shipments\.push\s*\(/.test(js)) throw new Error('RC891 schreibt direkt in gespeicherte Sendungen');
          if (/\.status\s*=|actualPickupDate\s*=|podAvailable\s*=/.test(js)) throw new Error('RC891 verändert Sendungsstatus oder Abholung/POD direkt');
          if (!/localStorage/.test(js)) throw new Error('RC891 lokale Filter-/Ansichtsspeicherung fehlt');
          console.log('RC891 static safety tests: PASS');
          NODE

      - name: Verify production scope untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json; then
            echo "ERROR: Production/API/public files changed."
            git diff -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json
            exit 1
          fi
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "TESTVERSION.html"

      - name: Write RC891 test report
        shell: bash
        run: |
          cat > RC891_PRUEFBERICHT.txt <<'EOF'
          TESTBERICHT RC891 – PRODUKTIVITÄTSSTUFE 7

          Scope:
          - Ausschließlich TESTSERVICE / TESTVERSION.html
          - Keine Produktionsdatei und keine API geändert
          - RC884 bis RC890 bleiben erhalten

          Neue Funktionen:
          1. Professionelle Sendungsübersicht
             - Zusätzliche kompakte Arbeitsansicht oberhalb der bestehenden Sendungsübersicht
             - Bestehende Übersicht bleibt unverändert darunter erhalten
             - Direkte Öffnung nutzt den vorhandenen ExportHUBShipmentView-Pfad

          2. Zentrale Suche innerhalb der Übersicht
             - Referenz
             - Kunde
             - Kundennummer
             - Empfänger
             - Spedition
             - Status
             - Dokumentnamen aus bereits geladenen Sendungsdaten

          3. Schnellfilter
             - Alle
             - Heute
             - Überfällig
             - ABD offen
             - POD fehlt
             - Bereit zur Abholung
             - Abgeholt
             - Abgeschlossen

          4. Zeitraum und Sortierung
             - Alle Termine / nächste 7 Tage / nächste 30 Tage
             - Abholung zuerst oder zuletzt
             - Kunde A-Z
             - Status A-Z
             - Referenz A-Z

          5. Gespeicherte Ansichten
             - Aktuelle Filterkombination kann benannt und gespeichert werden
             - Gespeicherte Ansichten sind nur auf diesem Gerät im Browser gespeichert
             - Ansichten können angewendet und gelöscht werden
             - Keine Cloud-Speicherung und keine Änderung an Sendungsdaten

          6. Kompakte Darstellung
             - Umschaltbar zwischen Standard- und Kompaktzeilen
             - Für große Sendungsmengen werden zunächst 40 Treffer dargestellt
             - Weitere Treffer können schrittweise eingeblendet werden

          Sicherheit:
          - Keine neue API
          - Keine Netzwerkaufrufe
          - Keine automatische Speicherung
          - Keine Statusänderung
          - Keine Änderung an Abholung, POD oder Aufgaben
          - Filter/Ansichten ausschließlich localStorage
          - Bestehende Sendungsübersicht bleibt als Rückfallebene erhalten

          Wo sichtbar:
          A. RC891 erfolgreich ausführen und Testservice mit Strg+F5 neu laden.
          B. Version RC891 prüfen.
          C. „Sendungsübersicht“ öffnen.
          D. Unter „Schnellaktionen & kritische Sendungen“ erscheint „Filter, Sortierung & gespeicherte Ansichten“.
          E. Suche mit Referenz oder Kundenname testen.
          F. Schnellfilter „Heute“, „ABD offen“, „POD fehlt“ testen.
          G. Sortierung ändern.
          H. Eine Ansicht speichern, Seite neu laden und erneut anwenden.
          I. Kompaktmodus ein-/ausschalten.
          J. Eine Trefferzeile öffnen und prüfen, dass die bestehende Sendungsansicht erscheint.

          Regression:
          - RC884 Navigation/Suche/KundenAvis-Trennung
          - RC885 globale Suche/Meine Arbeit heute
          - RC886 Fortschritt/Dokumenten-Ampel
          - RC887 Favoriten/Vorlagen
          - RC888 Übergabe/Timeline/Performance
          - RC889 Aktionsleiste/Sperrgründe/Arbeitszustände
          - RC890 Arbeitsplatz/Warncenter/Schnellaktionen
          - Produktion unverändert
          EOF

      - name: Commit RC891 testservice
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html RC891_PRUEFBERICHT.txt
          git commit -m "RC891: add professional shipment overview filters and saved views"
          git push origin main
