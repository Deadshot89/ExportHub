name: RC1122 Live Production HTML Diagnose
on:
  push:
    branches:
      - debug-rc1121-visible-source-leak
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch live production HTML
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' 'https://wonderful-forest-0f315e310.7.azurestaticapps.net/?rc1122='${GITHUB_SHA} -o live.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          s=Path('live.html').read_text(encoding='utf-8',errors='replace')
          print('SIZE',len(s))
          print('BUILD_RC1112',"version:'RC1112'" in s)
          markers=["window.open('about:blank'","RC824_SOP_DETAILS","window.rc524OpenTaskEditor","exporthub-rc1113-stowplan-persist","exporthub-rc1114-shipping-neutral"]
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False); self.stack=[]; self.h=[]
              def handle_starttag(self,t,a): self.stack.append(t.lower())
              def handle_endtag(self,t):
                  t=t.lower()
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i]==t: self.stack=self.stack[:i]; break
              def handle_data(self,d):
                  for m in markers:
                      if m in d: self.h.append((m,list(self.stack),self.getpos()))
          p=P(); p.feed(s)
          print('HITS',p.h)
          # exact unsafe literal inside outer scripts
          for m in re.finditer(r'<script\b[^>]*>[\s\S]*?</script\s*>',s,re.I):
              block=m.group(0)
              if "window.open('about:blank'" in block:
                  print('ABOUTBLANK_SCRIPT_BLOCK',m.start(),m.end(),'rc1059 unsafe?', '<script src="assets/rc1059-document-blob.js?v=RC1059"></script>' in block,'safe?', '<script src="assets/rc1059-document-blob.js?v=RC1059"><\\/script>' in block)
          # show the exact neighborhood of the second print payload
          i=s.find("window.open('about:blank'",4750000)
          print('SECOND_ABOUT',i)
          if i>=0: print(s[max(0,i-1600):i+2200])
          PY
