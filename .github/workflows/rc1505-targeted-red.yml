name: RC1505 Targeted Render Regression

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'test/rc1505-save-confirmation-render-gate.test.mjs'
      - 'scripts/rc1505-save-confirmation-render-hotfix.mjs'
      - 'scripts/rc1462-pretest.mjs'
      - '.github/rc1112/build-three-env.mjs'
      - '.github/workflows/rc1505-targeted-red.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: RC1505 targeted regression
        run: node --test test/rc1505-save-confirmation-render-gate.test.mjs
