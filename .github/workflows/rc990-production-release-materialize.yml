          sed -i 's/^          //' /tmp/rc990-uploaded.sha256
          sha256sum -c /tmp/rc990-uploaded.sha256
          test "$(wc -l < /tmp/rc990-uploaded.sha256 | tr -d ' ')" = '62'
          echo "62/62 unveränderte Snapshot-Dateien stimmen bytegenau mit dem hochgeladenen Release-ZIP überein."

      - name: Materialize exact RC990 production files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const source=fs.readFileSync('TESTVERSION.html','utf8');
          const build=source.match(/var\s+BUILD\s*=\s*Object\.freeze\(\{version:'(RC\d+)',cache:'([^']+)'/);
          if(!build) throw new Error('Kanonischer BUILD-Marker fehlt');
          if(build[1]!=='RC990') throw new Error('Erwartet RC990, gefunden '+build[1]);
          const CACHE=build[2];
          function stripReleaseBlock(html,tag,id){
            var re=new RegExp('<'+tag+'\\b[^>]*id=["\\\']'+id+'["\\\'][^>]*>[\\s\\S]*?<\\/'+tag+'>','gi');
            return html.replace(re,'');
          }
          let html=source;
          html=stripReleaseBlock(html,'script','rc561-testportal-mode');
          html=stripReleaseBlock(html,'style','rc561-testportal-identity-style');
          html=stripReleaseBlock(html,'script','rc561-testportal-runtime');
          html=html.replace(/loginReturn:\s*['"]\/TESTVERSION\.html\?v=\d+['"]/i,"loginReturn:'/?v="+CACHE+"'");
          html=html.replace(/loginReturn:\s*['"]\/test\?v=\d+['"]/i,"loginReturn:'/?v="+CACHE+"'");
          html=html.replace(/window\.__EXPORTHUB_RELEASE_CHANNEL__\s*=\s*['"]test['"];?/g,'');
          html=html.replace(/document\.documentElement\.setAttribute\(['"]data-exporthub-portal['"],['"]test['"]\);?/g,'');
          const hash=crypto.createHash('sha256').update(Buffer.from(html,'utf8')).digest('hex');
          const expected='f71ec67c3e97fab6a290f0ff98f13198b280e697aa5267802d0e6d9a5675f5c3';
          console.log('Generierter index SHA-256:',hash);
          console.log('Hochgeladener index SHA-256:',expected);
          if(hash!==expected) throw new Error('Produktionsindex ist nicht bytegleich mit dem geprüften Release-Center-ZIP');
          fs.writeFileSync('index.html',html,'utf8');
          NODE

          printf "%s" "window.__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC990';" > production-version.js

          cat > RELEASE_MANIFEST.txt <<'EOF'
          ExportHUB RC990
          Erstellt: 3.9.2026, 21:49:47
          Quelle: geprüfter TESTSERVICE Produktions-Snapshot
          Git SHA: cd5e1ceada201966dad68dbfb3492a434c351e8b
          Snapshot erstellt: 2026-09-03T19:33:22.113Z

          Dateien:
          - .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml
          - RELEASE_MANIFEST.txt
          - api/customer-avis/function.json
          - api/customer-avis/index.js
          - api/exporthub-auth-probe/function.json
          - api/exporthub-auth-probe/index.js
          - api/exporthub-auth/function.json
          - api/exporthub-auth/index.js
          - api/exporthub-health/function.json
          - api/exporthub-health/index.js
          - api/exporthub-release/function.json
          - api/exporthub-release/index.js
          - api/exporthub-state/function.json
          - api/exporthub-state/index.js
          - api/health/function.json
          - api/health/index.js
          - api/host.json
          - api/loader-pins-admin/function.json
          - api/loader-pins-admin/index.js
          - api/local.settings.example.json
          - api/location-booking/function.json
          - api/location-booking/index.js
          - api/package.json
          - api/pickup-confirm-v2/function.json
          - api/pickup-confirm-v2/index.js
          - api/pickup-confirm/function.json
          - api/pickup-confirm/index.js
          - api/pickup-disable/function.json
          - api/pickup-disable/index.js
          - api/pickup-health/function.json
          - api/pickup-health/index.js
          - api/pickup-init/function.json
          - api/pickup-init/index.js
          - api/pickup-pod/function.json
          - api/pickup-pod/index.js
          - api/pickup-status/function.json
          - api/pickup-status/index.js
          - api/pod-backup/function.json
          - api/pod-backup/index.js
          - api/production-version-check/function.json
          - api/production-version-check/index.js
          - api/rc963-deploy-marker.json
          - api/reference-files/function.json
          - api/reference-files/index.js
          - api/shared/auth-store.js
          - api/shared/blob-rest.js
          - api/shared/graph-drive.js
          - api/shared/loader-pin-store.js
          - api/shared/merge.js
          - api/shared/pickup-store.js
          - api/shared/user-policy.js
          - api/testservice-deploy-marker.json
          - assets/css/app.css
          - assets/js/app.js
          - assets/rc971-global-form-field-standard.css
          - customer-avis.html
          - index.html
          - infra/production-loader.html
          - infra/test-loader.html
          - location.html
          - package.json
          - pickup.html
          - pod-notfall.html
          - production-version.js
          - staticwebapp.config.json
          EOF
          sed -i 's/^          //' RELEASE_MANIFEST.txt

      - name: Verify release hashes, production preflight and regression suite
        shell: bash
        run: |
          set -euo pipefail
          base='cd5e1ceada201966dad68dbfb3492a434c351e8b'
          test "$(sha256sum index.html | awk '{print $1}')" = 'f71ec67c3e97fab6a290f0ff98f13198b280e697aa5267802d0e6d9a5675f5c3'
          test "$(sha256sum production-version.js | awk '{print $1}')" = '3b878a2fc9d2c69c2af6239d39ecb96b35f6669d145da780e084745587f57443'
          test "$(sha256sum RELEASE_MANIFEST.txt | awk '{print $1}')" = 'ae766906c32f6793441bf58b8201e5475b0d80fda57f2008ff502d76dc17e110'

          node --check api/exporthub-state/index.js
          node --check api/exporthub-health/index.js
          node --check api/shared/merge.js
          node -e "JSON.parse(require('fs').readFileSync('api/exporthub-state/function.json','utf8'));JSON.parse(require('fs').readFileSync('api/exporthub-health/function.json','utf8'));JSON.parse(require('fs').readFileSync('staticwebapp.config.json','utf8'));"

          versions="$(python3 - <<'PY'
          import re
          from pathlib import Path
          marker=Path('production-version.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8',errors='ignore')
          mm=re.search(r"__EXPORTHUB_PRODUCTION_VERSION_PROBE__\s*=\s*['\"](RC\d+)['\"]",marker)
          mb=re.search(r'<script\s+id=["\']exporthub-canonical-build-source["\'][^>]*>(.*?)</script>',index,re.S|re.I)
          mi=re.search(r"\bversion\s*:\s*['\"](RC\d+)['\"]",mb.group(1) if mb else '')
          if not mm or not mi: raise SystemExit('Versionsprüfung fehlgeschlagen')
          print(mm.group(1),mi.group(1))
          PY
          )"
          echo "Marker/Index: $versions"
          test "$versions" = 'RC990 RC990'

          npm test
          git diff --check

          expected="$(printf '%s\n' RELEASE_MANIFEST.txt index.html production-version.js | sort)"
          actual="$(git diff --name-only "$base" -- . ':!.github/workflows/rc990-production-release-materialize.yml' | sort)"
          echo "Release-Dateien:"
          echo "$actual"
          test "$actual" = "$expected"

      - name: Commit only verified release artifacts
        shell: bash
        run: |
          set -euo pipefail
          base='cd5e1ceada201966dad68dbfb3492a434c351e8b'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rc990-production-release-materialize.yml
          git add index.html production-version.js RELEASE_MANIFEST.txt
          git diff --cached --check
          git commit -m 'RC990: geprüftes Produktionspaket materialisieren'
          final_tree_files="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' RELEASE_MANIFEST.txt index.html production-version.js | sort)"
          echo "Finaler Branch-Diff:"
          echo "$final_tree_files"
          test "$final_tree_files" = "$expected"
          git push origin HEAD:rc990-production-release
