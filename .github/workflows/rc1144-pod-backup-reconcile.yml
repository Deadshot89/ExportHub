name: RC1144 POD Backup Reconcile

on:
  workflow_run:
    workflows:
      - ExportHUB RC1112 Drei-Umgebungen Deploy
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      reference:
        description: 'Optional: gezielt eine Sendungsreferenz prüfen/nachholen'
        required: false
        type: string
      environment:
        description: 'Umgebung für einen manuellen Nachweis'
        required: true
        default: production
        type: choice
        options:
          - production
          - testservice
          - both

permissions:
  contents: read
  id-token: write

concurrency:
  group: rc1144-pod-backup-reconcile
  cancel-in-progress: false

jobs:
  testservice:
    name: POD-Backup-Nachholung TESTSERVICE
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') && (github.event_name != 'workflow_dispatch' || inputs.environment == 'testservice' || inputs.environment == 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Offene TESTSERVICE POD-Backups nachholen
        shell: bash
        env:
          BASE_URL: https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net
          TARGET_ENV: testservice
          TARGET_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.reference || '' }}
        run: |
          set -euo pipefail
          set +x

          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-pod-backup-reconcile" \
              | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"

          payload="$(node -e "process.stdout.write(JSON.stringify({environment:process.env.TARGET_ENV,limit:25,reference:String(process.env.TARGET_REFERENCE||'').trim().toUpperCase()}))")"
          response_file="$(mktemp)"
          http_code="$(
            curl -sS -L -o "$response_file" -w '%{http_code}' \
              -H "Content-Type: application/json" \
              -H "x-exporthub-github-oidc: $oidc_token" \
              -H "x-exporthub-environment: $TARGET_ENV" \
              -d "$payload" \
              "$BASE_URL/api/pod-backup-reconcile" || true
          )"
          result="$(cat "$response_file")"
          rm -f "$response_file"

          printf '%s\n' "$result" | node -e "
            let s='';const status=Number(process.argv[1]||0);process.stdin.on('data',c=>s+=c).on('end',()=>{
              let v={};try{v=JSON.parse(s||'{}')}catch(_){}
              const pendingCodes=Array.from(new Set((Array.isArray(v.pending)?v.pending:[]).map(x=>String(x&&x.error||'').split(':',1)[0].trim()).filter(Boolean))).slice(0,10);
              const safe={httpStatus:status,code:v.code,message:v.message,environment:v.environment,reference:v.reference,graphConfigured:v.graphConfigured,missing:Array.isArray(v.missing)?v.missing:[],targetFolder:v.targetFolder,scanned:v.scanned,selected:v.selected,savedCount:v.savedCount,alreadySavedCount:v.alreadySavedCount,pendingCount:v.pendingCount,errorCount:v.errorCount,verifiedCount:v.verifiedCount,repairedStateCount:v.repairedStateCount,pendingCodes,target:v.target&&{reference:v.target.reference,status:v.target.status,matchedCount:v.target.matchedCount,podReadyCount:v.target.podReadyCount,alreadySavedCount:v.target.alreadySavedCount,savedNowCount:v.target.savedNowCount,pendingCount:v.target.pendingCount,errorCount:v.target.errorCount}};
              console.log('TESTSERVICE POD reconcile',JSON.stringify(safe));
              if(status<200||status>=300||!v.ok||Number(v.errorCount||0)>0)process.exit(3);if(v.reference&&(!v.target||!['already-saved','saved-now'].includes(v.target.status)))process.exit(5);
            })" "$http_code"

  production:
    name: POD-Backup-Nachholung PRODUCTION
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') && (github.event_name != 'workflow_dispatch' || inputs.environment == 'production' || inputs.environment == 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Offene PRODUCTION POD-Backups nachholen
        shell: bash
        env:
          BASE_URL: https://wonderful-forest-0f315e310.7.azurestaticapps.net
          TARGET_ENV: production
          TARGET_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.reference || '' }}
        run: |
          set -euo pipefail
          set +x

          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-pod-backup-reconcile" \
              | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"

          payload="$(node -e "process.stdout.write(JSON.stringify({environment:process.env.TARGET_ENV,limit:25,reference:String(process.env.TARGET_REFERENCE||'').trim().toUpperCase()}))")"
          response_file="$(mktemp)"
          http_code="$(
            curl -sS -L -o "$response_file" -w '%{http_code}' \
              -H "Content-Type: application/json" \
              -H "x-exporthub-github-oidc: $oidc_token" \
              -H "x-exporthub-environment: $TARGET_ENV" \
              -d "$payload" \
              "$BASE_URL/api/pod-backup-reconcile" || true
          )"
          result="$(cat "$response_file")"
          rm -f "$response_file"

          printf '%s\n' "$result" | node -e "
            let s='';const status=Number(process.argv[1]||0);process.stdin.on('data',c=>s+=c).on('end',()=>{
              let v={};try{v=JSON.parse(s||'{}')}catch(_){}
              const pendingCodes=Array.from(new Set((Array.isArray(v.pending)?v.pending:[]).map(x=>String(x&&x.error||'').split(':',1)[0].trim()).filter(Boolean))).slice(0,10);
              const safe={httpStatus:status,code:v.code,message:v.message,environment:v.environment,reference:v.reference,graphConfigured:v.graphConfigured,missing:Array.isArray(v.missing)?v.missing:[],targetFolder:v.targetFolder,scanned:v.scanned,selected:v.selected,savedCount:v.savedCount,alreadySavedCount:v.alreadySavedCount,pendingCount:v.pendingCount,errorCount:v.errorCount,verifiedCount:v.verifiedCount,repairedStateCount:v.repairedStateCount,pendingCodes,target:v.target&&{reference:v.target.reference,status:v.target.status,matchedCount:v.target.matchedCount,podReadyCount:v.target.podReadyCount,alreadySavedCount:v.target.alreadySavedCount,savedNowCount:v.target.savedNowCount,pendingCount:v.target.pendingCount,errorCount:v.target.errorCount}};
              console.log('PRODUCTION POD reconcile',JSON.stringify(safe));
              if(status<200||status>=300||!v.ok||Number(v.errorCount||0)>0||Number(v.pendingCount||0)>0)process.exit(4);if(v.reference&&(!v.target||!['already-saved','saved-now'].includes(v.target.status)))process.exit(6);
            })" "$http_code"
