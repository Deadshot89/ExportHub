name: RC1110 Packaging Regression Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc1110-packaging-hotfix.yml'
      - 'assets/rc1096-packaging-groups.js'
      - '.github/rc1048/build-three-env.mjs'
      - '.github/rc1112/build-three-env.mjs'
      - 'test/rc1096-packaging-groups.test.mjs'

permissions:
  contents: read

concurrency:
  group: exporthub-rc1110-packaging-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: RC1110 targeted regression
        run: node --test test/rc1096-packaging-groups.test.mjs

      - name: Build current RC1112 three environments
        run: node .github/rc1112/build-three-env.mjs

      - name: Verify packaging in current release
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html TESTVERSION.html demo.html; do
            grep -q 'ExportHUB RC1112 environment=' "dist-rc1112/$file"
            grep -q 'assets/rc1096-packaging-groups.js?v=1110' "dist-rc1112/$file"
          done
          grep -Fq "closest('.rc682-packaging-columns')" dist-rc1112/assets/rc1096-packaging-groups.js
          grep -Fq "closest('.rc682-packaging-column')" dist-rc1112/assets/rc1096-packaging-groups.js
          grep -Fq '#rc573ColliCard .rc682-packaging-columns' dist-rc1112/assets/rc1096-packaging-groups.js
          grep -Fq 'grid-template-columns:repeat(3,minmax(0,1fr))!important' dist-rc1112/assets/rc1096-packaging-groups.js
          if grep -Fq 'min-width:720px!important' dist-rc1112/assets/rc1096-packaging-groups.js; then exit 1; fi
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'" dist-rc1112/production-version.js
