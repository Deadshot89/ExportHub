name: RC1189 Mobile Navigation PR Browser Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'test/rc1189-*'
      - 'playwright.config.mjs'
      - '.github/rc1112/**'
      - '.github/workflows/rc1189-mobile-navigation-pr-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc1189-mobile-navigation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: RC1189 Vertrag prüfen
        run: node --test test/rc1189-mobile-full-navigation-gate.test.mjs test/rc1189-pr-browser-gate.test.mjs

      - name: Aktuelles Drei-Umgebungen-Paket bauen
        run: node .github/rc1112/build-three-env.mjs

      - name: Playwright installieren
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Vollständige Navigation lokal im echten Browser prüfen
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_ENTRY: /demo.html
          EXPORTHUB_E2E_PUBLIC_ENV: testservice
        run: npx playwright test e2e/specs/navigation.spec.mjs

      - name: Browser-Fehlerartefakte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rc1189-mobile-navigation-browser
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
