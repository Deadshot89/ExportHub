<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExportHUB Testportal</title>
<style>
:root{--blue:#2563eb;--red:#dc2626;--green:#16a34a;--line:#dbe7f1;--ink:#08275c;--muted:#64748b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eef6fb;color:#0f172a}body.loader{min-height:100vh;display:grid;place-items:center}.box{width:min(660px,calc(100% - 36px));background:#fff;border:1px solid #d9e6f1;border-radius:28px;box-shadow:0 24px 70px rgba(15,44,80,.16);padding:34px;text-align:center}.mark{width:68px;height:68px;border-radius:22px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-weight:1000;font-size:25px}.bar{height:12px;border-radius:999px;background:#e7eef5;overflow:hidden;margin:24px 0 10px}.fill{height:100%;width:10%;background:linear-gradient(90deg,#dc2626,#f97316);transition:width .2s}.err{display:none;margin-top:16px;background:#fee2e2;color:#991b1b;border-radius:12px;padding:12px;white-space:pre-wrap}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}button{font:inherit}.actions button,.btn,.ghost{border-radius:12px;padding:10px 15px;font-weight:900;cursor:pointer}.btn{border:0;background:#2563eb;color:#fff}.btn.green{background:#16a34a}.ghost{background:#fff;color:#334155;border:1px solid #cbd5e1}.btn:disabled,.ghost:disabled{opacity:.4;cursor:not-allowed}.control{padding:22px;max-width:1500px;margin:0 auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.head h1{margin:0;color:var(--ink)}.head p{margin:5px 0 0;color:var(--muted)}.warn{background:#fef2f2;border-left:5px solid var(--red);border-radius:13px;padding:12px 14px;color:#991b1b;font-weight:900;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat,.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.stat span{font-size:11px;text-transform:uppercase;font-weight:900;color:var(--muted)}.stat strong{display:block;font-size:20px;color:var(--ink);margin-top:5px}.hero{margin:14px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border:2px solid #bfdbfe}.hero h2{margin:0;color:var(--ink)}.hero ul{margin:9px 0 0;padding-left:20px;color:#334155}.status{margin:12px 0;padding:10px 12px;border-radius:12px;background:#eff6ff;color:#1e3a8a;font-weight:800}.status.ok{background:#f0fdf4;color:#166534}.status.bad{background:#fee2e2;color:#991b1b}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:1100px}.table th,.table td{padding:11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.table th{background:#f8fafc;color:#475569;font-size:11px;text-transform:uppercase}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:950;margin:3px 3px 0 0;background:#e2e8f0;color:#334155}.pill.prod{background:#dcfce7;color:#166534}.pill.test{background:#fee2e2;color:#991b1b}.pill.done{background:#dbeafe;color:#1d4ed8}.changes{margin:7px 0 0;padding-left:18px}.changes li{margin:3px 0}.rowactions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.head,.hero{display:block}.head .actions,.hero .actions{margin-top:12px;justify-content:flex-start}}
</style></head>
<body class="loader"><div id="loader" class="box"><div class="mark">EH</div><h1>ExportHUB Testportal</h1><p id="msg">Aktive GitHub-Testversion wird ermittelt …</p><div class="bar"><div id="fill" class="fill"></div></div><strong id="pct">10 %</strong><div id="err" class="err"></div><div class="actions"><button id="retry" class="btn" style="display:none" onclick="location.reload()">Erneut versuchen</button><button class="ghost" onclick="location.href='/'">Zur Hauptseite</button></div></div><main id="control" class="control" hidden></main>
<script>(function(){'use strict';var API='/api/exporthub-release',written=false;
function q(v){return String(v==null?'':v).trim()}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function low(v){return q(v).toLowerCase()}
function progress(n,t){document.getElementById('fill').style.width=n+'%';document.getElementById('pct').textContent=n+' %';if(t)document.getElementById('msg').textContent=t}
function fail(t){progress(100,'Testversion konnte nicht geladen werden');var e=document.getElementById('err');e.style.display='block';e.textContent=t||'Release-API nicht erreichbar.';document.getElementById('retry').style.display='inline-block'}
function tabSession(){try{var raw=sessionStorage.getItem('exporthub_rc301_tab_session');if(raw){var x=JSON.parse(raw);if(x&&x.token)return x}}catch(_){}try{for(var i=0;i<sessionStorage.length;i++){var k=sessionStorage.key(i),r=sessionStorage.getItem(k);if(!r||r.charAt(0)!=='{')continue;var x=JSON.parse(r);if(x&&x.token&&x.user)return x}}catch(_){}return null}
function headers(){var h={Accept:'application/json'},s=tabSession();if(s&&s.token){h['X-ExportHUB-Token']=s.token;h['X-ExportHUB-Session']=s.token;h.Authorization='Bearer '+s.token}return h}
async function api(action,method,body){var r=await fetch(API+'?action='+encodeURIComponent(action)+'&_='+Date.now(),{method:method||'GET',credentials:'same-origin',cache:'no-store',headers:Object.assign({'Content-Type':'application/json'},headers()),body:body?JSON.stringify(body):undefined}),t=await r.text(),d={};try{d=t?JSON.parse(t):{}}catch(_){d={message:t}}if(!r.ok||d.ok===false){var e=new Error(d.message||('HTTP '+r.status));e.status=r.status;e.code=d.code;throw e}return d}
function removeId(h,tag,id){var re=new RegExp("<"+tag+"\b[^>]*\bid=\""+id+"\"[^>]*>[\s\S]*?<\/"+tag+">\s*","ig");return h.replace(re,"")}
function sanitize(h){h=String(h||'');var legacy=h.indexOf('id="rc503-release-portal-controller"')>=0||h.indexOf('id="rc503-release-bootstrap"')>=0||h.indexOf('id="rc504-static-test-channel"')>=0;['rc504-static-test-channel','rc503-release-bootstrap','rc503-release-portal-controller'].forEach(function(id){h=removeId(h,'script',id)});h=removeId(h,'style','rc503-release-portal-style');if(legacy)h=h.replace(/\s*\{view:'releasecenter',label:'Release-Center',right:'releasecenter'\},?/g,'');return h}
function normalizeTabView(){try{var k='exporthub_rc301_tab_session',raw=sessionStorage.getItem(k);if(!raw)return;var x=JSON.parse(raw);if(x&&low(x.view)==='releasecenter'){x.view='dashboard';sessionStorage.setItem(k,JSON.stringify(x))}}catch(_){}}
function marker(v){return '<script>window.__EXPORTHUB_RELEASE_STREAMED__=true;window.__EXPORTHUB_RELEASE_CHANNEL__="test";window.__EXPORTHUB_RELEASE_VERSION__='+JSON.stringify(v)+';window.__EXPORTHUB_EXTERNAL_RELEASE_LOADER__=true;<\/script>'}
function bridge(v){return '<style id="exporthub-test-shell-style">html{scroll-padding-top:44px}body{padding-top:44px!important}#exporthubTestShell{position:fixed;left:0;right:0;top:0;z-index:2147483000;height:44px;background:#dc2626;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:950;box-shadow:0 2px 12px rgba(0,0,0,.2)}#exporthubTestShell button{border:0;background:#fff;color:#991b1b;border-radius:9px;padding:6px 10px;font-weight:900;cursor:pointer}</style><script id="exporthub-test-shell-bridge">(function(){"use strict";var V='+JSON.stringify(v)+';function q(x){return String(x==null?"":x).trim()}function low(x){return q(x).toLowerCase()}function user(){try{return(typeof window.__EXPORTHUB_GET_CURRENT_USER__==="function"&&window.__EXPORTHUB_GET_CURRENT_USER__())||(window.ExportHUBClean&&window.ExportHUBClean.runtime&&window.ExportHUBClean.runtime.user)||{}}catch(_){return{}}}function admin(u){var r=low(u&&(u.role||u.rolle||u.level||u.type)),n=low(u&&(u.user||u.login||u.username||u.name||u.displayName)),p=Array.isArray(u&&u.permissions)?u.permissions:[];return!!u&&(u.globalAdmin===true||u.isAdmin===true||u.admin===true||n==="tobias"||/global.?admin|administrator|vollzugriff|admin/.test(r)||p.indexOf("*")>=0)}function install(){if(!document.body)return;var x=document.getElementById("exporthubTestShell");if(!x){x=document.createElement("div");x.id="exporthubTestShell";x.innerHTML="<span>TESTPORTAL · LIVE-DATEN · "+V+"</span><button type=button id=exporthubReleaseControl>Release-Center</button><button type=button id=exporthubMainLink>Zur Hauptseite</button>";document.body.appendChild(x);x.querySelector("#exporthubReleaseControl").onclick=function(){location.href="/test/?release=1&_="+Date.now()};x.querySelector("#exporthubMainLink").onclick=function(){location.href="/"}}var b=document.getElementById("releaseTestPortalBtn");if(b)b.style.display="none"}function guard(){var rt=window.ExportHUBClean&&window.ExportHUBClean.runtime||{},u=user();if(!rt.authToken||!q(u&&(u.user||u.login||u.username||u.name)))return;if(!admin(u)){alert("Das Testportal ist ausschließlich für Global Admin freigegeben.");location.href="/"}}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",install,{once:true});else install();window.addEventListener("exporthub:ready",function(){install();guard()})})();<\/script>'}
function inject(h,v){if(written)return;if(!/<html[\s>]/i.test(h)||h.indexOf('exporthub-canonical-build-source')<0)throw new Error('Ungültige Testdatei.');written=true;normalizeTabView();h=sanitize(h);h=h.replace(/<head(\s[^>]*)?>/i,function(m,a){return '<head'+(a||'')+'>'+marker(v)});h=h.replace(/<\/body>/i,bridge(v)+'</body>');progress(100,'Testversion '+v+' wird gestartet …');setTimeout(function(){document.open('text/html','replace');document.write(h);document.close()},10)}
async function get(url,accept){var r=await fetch(url,{credentials:'same-origin',cache:'no-store',headers:{Accept:accept||'application/json'}}),t=await r.text();if(!r.ok)throw new Error(t||('HTTP '+r.status));return t}
function date(v){if(!q(v))return'–';try{return new Date(v).toLocaleString('de-DE')}catch(_){return q(v)}}
function rel(m,v){return (Array.isArray(m&&m.releases)?m.releases:[]).find(function(r){return q(r.version)===q(v)})||null}
function status(msg,kind){var e=document.getElementById('releaseStatus');if(!e)return;e.textContent=msg;e.className='status'+(kind?' '+kind:'')}
function changeList(r){var a=Array.isArray(r&&r.changes)?r.changes:[];return a.length?'<ul>'+a.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<p class="small">'+esc(r&&r.commitMessage||'Keine Änderungsbeschreibung hinterlegt.')+'</p>'}
function row(r,m){var at=q(m.test)===q(r.version),ap=q(m.production)===q(r.version),tested=!!r.testedAt,flags='';if(ap)flags+='<span class="pill prod">PRODUKTION</span>';if(at)flags+='<span class="pill test">TEST AKTIV</span>';if(tested)flags+='<span class="pill done">GETESTET</span>';var act='';if(!at&&!ap&&r.source==='github')act+='<button class="ghost" onclick="return window.rcSetTest(\''+esc(r.version)+'\')">Im Test aktivieren</button>';if(at&&!tested)act+='<button class="ghost" onclick="return window.rcMarkTested(\''+esc(r.version)+'\')">Test bestanden</button>';if(at&&tested&&!ap)act+='<button class="btn green" onclick="return window.rcPromote(\''+esc(r.version)+'\')">Produktion freigeben</button>';return'<tr><td><strong>'+esc(r.version)+'</strong><div>'+flags+'</div><div class="small">GitHub '+esc(r.githubShortSha||'–')+'</div></td><td><strong>'+esc(r.title||r.version)+'</strong>'+(Array.isArray(r.changes)&&r.changes.length?'<ul class="changes">'+r.changes.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<div class="small">'+esc(r.commitMessage||'Keine Änderungsbeschreibung')+'</div>')+'</td><td>'+esc(date(r.committedAt))+'<br><span class="small">'+esc(r.githubAuthor||'GitHub')+'</span></td><td>'+(tested?esc(date(r.testedAt)):'–')+'</td><td>'+Math.round(Number(r.size||0)/1024)+' KB</td><td><div class="rowactions">'+(act||'<span class="small">Keine Aktion</span>')+'</div></td></tr>'}
function paint(m){var c=document.getElementById('control'),tr=rel(m,m.test),tested=!!(tr&&tr.testedAt),isProd=q(m.production)===q(m.test)&&!!m.test;c.innerHTML='<div class="head"><div><h1>🚀 Release-Center</h1><p>GitHub ist die einzige RC-Quelle. Hier wird nur ausgewählt, getestet und freigegeben.</p></div><div class="actions"><button class="ghost" onclick="location.href=\'/test/?_=\'+Date.now()">Aktive Testversion öffnen</button><button class="ghost" onclick="location.href=\'/\'">Zur Hauptseite</button></div></div><div class="warn">TESTPORTAL = LIVE-DATEN. Programmcode ist getrennt; Sendungs-/Kundendaten sind gemeinsam.</div><div class="grid"><div class="stat"><span>Produktion</span><strong>'+esc(m.production||'–')+'</strong></div><div class="stat"><span>Aktive Testversion</span><strong>'+esc(m.test||'–')+'</strong></div><div class="stat"><span>Rollback</span><strong>'+esc(m.previousProduction||'–')+'</strong></div></div><section class="hero"><div><h2>'+esc(m.test||'Keine aktive Test-RC')+'</h2>'+(tr?'<p class="small">'+esc(tr.title||'')+' · GitHub '+esc(tr.githubShortSha||'–')+' · '+Math.round(Number(tr.size||0)/1024)+' KB</p>'+changeList(tr):'<p>Wähle eine GitHub-RC als Testversion.</p>')+'</div><div class="actions"><button class="btn" '+(!m.test||tested||isProd?'disabled':'')+' onclick="return window.rcMarkTested(\''+esc(m.test||'')+'\')">'+(tested?'✓ Test bestanden':'Test bestanden')+'</button><button class="btn green" '+(!m.test||!tested||isProd?'disabled':'')+' onclick="return window.rcPromote(\''+esc(m.test||'')+'\')">Produktion freigeben</button></div></section><div id="releaseStatus" class="status ok">GitHub-Versionen geladen.</div><section class="panel"><div class="head"><div><h2>GitHub RC-Versionen</h2><p>Änderungen, Commit und echte Dateigröße der jeweiligen Version.</p></div><div class="actions"><button class="ghost" onclick="return window.rcRefresh()">GitHub prüfen</button><button class="ghost" onclick="return window.rcRollback()">Vorherige Produktion wiederherstellen</button></div></div><div class="tablewrap"><table class="table"><thead><tr><th>RC</th><th>Was ändert diese Version?</th><th>GitHub</th><th>Getestet</th><th>Größe</th><th>Aktion</th></tr></thead><tbody>'+(m.releases||[]).map(function(r){return row(r,m)}).join('')+'</tbody></table></div></section>'}
async function loadControl(force){try{var m=await api(force?'sync-github':'list');paint(m)}catch(e){document.getElementById('control').innerHTML='<div class="head"><div><h1>🚀 Release-Center</h1><p>Die Admin-Sitzung wird benötigt.</p></div><div class="actions"><button class="ghost" onclick="location.href=\'/test/?_=\'+Date.now()">Testversion öffnen / anmelden</button><button class="ghost" onclick="location.href=\'/\'">Zur Hauptseite</button></div></div><div class="status bad">'+esc(e.message)+'</div>'}}
window.rcRefresh=function(){loadControl(true);return false};window.rcSetTest=async function(v){try{await api('set-test','POST',{version:v});location.href='/test/?_='+Date.now()}catch(e){status(e.message,'bad')}return false};window.rcMarkTested=async function(v){if(!v)return false;try{await api('mark-tested','POST',{version:v});await loadControl(false)}catch(e){status(e.message,'bad')}return false};window.rcPromote=async function(v){if(!v)return false;if(!confirm(v+' wirklich für Produktion freigeben?'))return false;try{await api('promote','POST',{version:v});await loadControl(false);status(v+' wurde für Produktion freigegeben.','ok')}catch(e){status(e.message,'bad')}return false};window.rcRollback=async function(){if(!confirm('Vorherige Produktionsversion wirklich wiederherstellen?'))return false;try{await api('rollback','POST',{});await loadControl(false);status('Vorherige Produktionsversion wurde wiederhergestellt.','ok')}catch(e){status(e.message,'bad')}return false};
(async function(){var u=new URL(location.href);if(u.searchParams.get('release')==='1'){document.body.className='';document.getElementById('loader').hidden=true;document.getElementById('control').hidden=false;await loadControl(false);return}try{progress(30,'Aktive Testversion wird geprüft …');var m=JSON.parse(await get(API+'?action=active&channel=test&_='+Date.now())),v=q(m.version).toUpperCase();if(!/^RC\d+$/.test(v))throw new Error('Im Release-Center ist keine aktive Testversion ausgewählt.');progress(58,'Testversion '+v+' wird geladen …');var h=await get(API+'?action=html&channel=test&_='+Date.now(),'text/html');progress(86,'Testoberfläche wird vorbereitet …');inject(h,v)}catch(e){fail(e&&e.message||String(e))}})();})();</script></body></html>
