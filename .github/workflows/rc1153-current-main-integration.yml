name: RC1153 Current Main Integration Test

on:
  push:
    branches:
      - fix/rc1153-testservice-release-gate-current
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc1153:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: RC1153 fokussierte Regression
        run: node --test test/rc1153-testservice-release-gate.test.mjs
      - name: Vollständige Node-Regression
        run: node --test --test-concurrency=1 test/*.test.mjs
      - name: Playwright installieren
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: RC1124 Lokaler Browser-Gate
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_ENTRY: /demo.html
          EXPORTHUB_E2E_PUBLIC_ENV: testservice
        run: |
          node --test test/rc1124-browser-release-gate.test.mjs
          npx playwright test e2e/specs/navigation.spec.mjs e2e/specs/notifications.spec.mjs e2e/specs/public-smoke.spec.mjs
