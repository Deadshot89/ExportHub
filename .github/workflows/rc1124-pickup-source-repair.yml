name: RC1124 Pickup Source Repair
on:
  push:
    branches: [rc1124-browser-e2e-gate]
    paths:
      - '.github/rc1124/repair-pickup-route-regex.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rc1124-browser-e2e-gate
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Repair pickup source
        run: node .github/rc1124/repair-pickup-route-regex.mjs
      - name: Verify pickup syntax
        run: node --test test/rc1124-pickup-script-syntax.test.mjs
      - name: Commit repaired pickup source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --quiet pickup.html && exit 0
          git config user.name "ExportHUB RC1124"
          git config user.email "actions@users.noreply.github.com"
          git add pickup.html
          git commit -m "fix: repair pickup route regex syntax"
          git push origin HEAD:rc1124-browser-e2e-gate
