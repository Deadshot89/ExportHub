          grep -Fq 'shipmentHistory.action.registrationStarted' dist-rc1112/assets/rc1071-shipment-history.js
          grep -Fq 'history.customer.customer-created' dist-rc1112/assets/rc1080-customer-history.js
          grep -Fq 'history.customer.customer-updated' dist-rc1112/assets/rc1080-customer-history.js
          grep -Fq 'history.title' dist-rc1112/assets/rc1081-audit-history.js
