name: RC942 Kundenordner Standortschreiber

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc942-customer-folder-location-writer.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rc942-customer-folder-location-writer
  cancel-in-progress: false

jobs:
  patch_verify_deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED – RC941 muss den zweiten 3-ID-Kundenstandortschreiber noch enthalten
        id: red
        continue-on-error: true
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC941',cache:'941',loginReturn:'/TESTVERSION.html?v=941'" in text, 'Basis ist nicht exakt RC941.'
          desired="ls.push(Object.assign({},previous,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id,name:lname,address:address"
          assert desired in text, desired
          PY

      - name: RED-Ergebnis verifizieren
        shell: bash
        env:
          RED_OUTCOME: ${{ steps.red.outcome }}
        run: |
          if [[ "$RED_OUTCOME" != "failure" ]]; then
            echo "RED ist nicht wie erwartet fehlgeschlagen. RC941 wird nicht verändert."
            exit 1
          fi
          echo "RED bestätigt: Der zweite Kundenordner-Schreibpfad speichert noch nur drei Standort-ID-Aliase."

      - name: RC942 direkt im bestehenden Kundenordner-Schreibpfad korrigieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('TESTVERSION.html')
          text=p.read_text(encoding='utf-8')

          def once(src,old,new,label):
              n=src.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: erwartet 1 Fundstelle, gefunden {n}')
              return src.replace(old,new,1)

          text=once(text,
              "version:'RC941',cache:'941',loginReturn:'/TESTVERSION.html?v=941'",
              "version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'",
              'BUILD-Version')

          marker="changes:Object.freeze([\n"
          if text.count(marker)!=1:
              raise SystemExit('Release-Anker nicht eindeutig')
          note="    'RC942 beseitigt den letzten dreifachen Kundenstandort-Schreibpfad: Beim dauerhaften Speichern des Kundenordners werden Standort-IDs jetzt auch dort unter locationId, selectedLocationId, siteId und destinationId gemeinsam persistiert.',\n"
          text=text.replace(marker,marker+note,1)

          text=once(text,
              "ls.push(Object.assign({},previous,{id:id,locationId:id,siteId:id,name:lname,address:address",
              "ls.push(Object.assign({},previous,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id,name:lname,address:address",
              'Kundenordner Standort-Persistenz')

          p.write_text(text,encoding='utf-8')
          PY

      - name: GREEN – RC942 Kundenordner-Standortschreiber prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'" in text
          assert "RC942 beseitigt den letzten dreifachen Kundenstandort-Schreibpfad" in text
          assert "ls.push(Object.assign({},previous,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id,name:lname,address:address" in text
          assert "ls.push(Object.assign({},previous,{id:id,locationId:id,siteId:id,name:lname,address:address" not in text

          # Beide Kundenordner-Speicherwege müssen nun alle vier Aliase persistieren.
          assert "Object.assign({},old,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id,name:name,address:address" in text
          assert "c.locations=ls;c.sites=copy(ls);c.standorte=copy(ls);" in text

          # Keine einfache Sendungs-Schreibstelle darf wieder nur drei Aliase setzen.
          bad=[]
          for m in re.finditer(r'[^\n]{0,220}(?:sh|s)\.locationId\s*=.*?(?:sh|s)\.selectedLocationId\s*=.*?(?:sh|s)\.siteId\s*=[^\n]{0,220}',text):
              row=m.group(0)
              if 'destinationId' not in row: bad.append(row)
          assert not bad, bad[:3]
          print('GREEN: RC942 Kundenordner-Standortschreiber konsistent; 3-ID-Sendungsschreiber = 0.')
          PY

      - name: Diff und Integrität prüfen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          grep -m1 -oE "version:'RC[0-9]+'" TESTVERSION.html

      - name: RC942 nach main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          if git diff --cached --quiet; then
            echo "Keine Änderung erzeugt – Abbruch."
            exit 1
          fi
          git commit -m "RC942 Kundenordner-Standortschreiber vereinheitlichen"
          git push origin HEAD:main

      - name: Temporären RC942-Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm .github/workflows/rc942-customer-folder-location-writer.yml
          git commit -m "RC942 temporären Patch-Workflow entfernen"
          git push origin HEAD:main

      - name: TESTSERVICE-Deploy für RC942 auslösen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/exporthub-testservice-final-artifact-fix.yml/dispatches" \
            -d '{"ref":"main"}')"
          cat /tmp/dispatch.out || true
          [[ "$code" == "204" ]] || { echo "Dispatch fehlgeschlagen: HTTP $code"; exit 1; }
          echo "TESTSERVICE-Deploy RC942 ausgelöst."
