name: RC1546 Performance Forward Port Once

on:
  push:
    branches:
      - perf/rc1546-no-rerender-current-main
    paths:
      - .github/workflows/rc1546-forward-port-once.yml

permissions:
  contents: write

jobs:
  forward_port:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1546 Forward-Port ausführen
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/rc1546-forward-port-once.mjs
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo 'RC1546 Forward-Port wurde bereits vollständig gepusht.'
            exit 0
          fi

          test "$(git log -1 --pretty=%s)" = 'RC1546: No-Rerender Performance-Fix auf aktuellen main portieren'

          # Der Runner darf keine Workflow-Dateien pushen. Die Migration erzeugt
          # lokal bereits den fertigen Produkt-/Testcommit; vor dem Push entfernen
          # wir nur die neu erzeugte Workflow-Datei und stellen den einmaligen
          # Workflow aus dem Elterncommit wieder her.
          git rm -f --ignore-unmatch .github/workflows/rc1546-performance-regression.yml
          git checkout HEAD^ -- .github/workflows/rc1546-forward-port-once.yml
          git add .github/workflows
          git commit --amend --no-edit
          git push origin HEAD:perf/rc1546-no-rerender-current-main
