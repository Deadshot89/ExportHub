          marker="/* exporthub-rc888-shipment-create-professional */"
          if marker in src:
              raise SystemExit("RC888 Marker bereits vorhanden")

          # Reuse the same proven classic script anchor as RC885/RC886.
          anchor="function avisHost(view)"
          pos=src.find(anchor)
          if pos<0 or src.find(anchor,pos+1)>=0:
              raise SystemExit("Sicherer Script-Anker avisHost ist nicht eindeutig")

          open_pos=src.rfind("<script",0,pos)
          open_end=src.find(">",open_pos)
          if open_pos<0 or open_end<0 or src.find("</script>",open_end,pos)>=0:
              raise SystemExit("avisHost liegt nicht sicher in einem Scriptblock")

          src=src[:pos]+js+"\n"+src[pos:]
          p.write_text(src,encoding="utf-8")
          print("RC888 Pure-JS Modul eingefügt.")
