name: RC965 Avis Retry Performance Regression

on:
  push:
    paths:
      - 'TESTVERSION.html'
      - 'tests/rc965-avis-retry-performance.test.cjs'
      - '.github/workflows/rc965-avis-retry-performance-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RC965 Avis retry performance regression
        run: node tests/rc965-avis-retry-performance.test.cjs
