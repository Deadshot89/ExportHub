name: RC991 Materialize Release Marker Fix

on:
  push:
    branches:
      - rc991-release-marker-fix
    paths:
      - tools/rc991-apply-release-marker-fix.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply RC991 fix
        run: node tools/rc991-apply-release-marker-fix.mjs
      - name: Verify full regression suite before commit
        run: npm test
      - name: Commit materialized TESTVERSION
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          git diff --cached --quiet && { echo "No TESTVERSION change to commit"; exit 1; }
          git commit -m "RC991: Release-Center Markerhoheit reparieren"
          git push origin HEAD:rc991-release-marker-fix
