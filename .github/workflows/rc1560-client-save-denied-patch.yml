name: RC1560 browser save-denial patch

on:
  push:
    branches:
      - fix/rc1560-state-save-permission-gate
    paths:
      - scripts/rc1560-client-save-denied-fix.mjs
      - .github/workflows/rc1560-client-save-denied-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch production and test HTML only
        run: node scripts/rc1560-client-save-denied-fix.mjs
      - name: Install API regression dependencies
        run: npm install --prefix api --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Verify denied-save regression
        run: node --test test/diagnose-export-fixes.test.mjs test/rc1560-state-save-permission-gate.test.mjs
      - name: Commit verified UI correction to fix branch
        run: |
          git add index.html TESTVERSION.html test/diagnose-export-fixes.test.mjs
          if git diff --cached --quiet; then
            echo "No change required"
            exit 0
          fi
          git -c user.name='ExportHUB CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(RC1560): retain pending state on denied save and stop error loops'
          git push origin HEAD:fix/rc1560-state-save-permission-gate
