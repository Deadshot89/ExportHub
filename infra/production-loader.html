<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExportHUB</title>
<style>html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eaf4fb;color:#0b2b5e}body{min-height:100vh;display:grid;place-items:center}.box{width:min(620px,calc(100% - 36px));background:#fff;border:1px solid #d9e6f1;border-radius:28px;box-shadow:0 24px 70px rgba(15,44,80,.16);padding:34px;text-align:center}.mark{width:68px;height:68px;border-radius:22px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#fff;font-weight:1000;font-size:25px}.bar{height:12px;border-radius:999px;background:#e7eef5;overflow:hidden;margin:24px 0 10px}.fill{height:100%;width:12%;background:linear-gradient(90deg,#2563eb,#13b9ea);transition:width .2s}.err{display:none;margin-top:16px;background:#fee2e2;color:#991b1b;border-radius:12px;padding:12px;white-space:pre-wrap}.retry{display:none;margin:15px auto 0;border:0;background:#2563eb;color:#fff;font-weight:900;border-radius:12px;padding:10px 18px;cursor:pointer}</style></head>
<body><div class="box"><div class="mark">EH</div><h1>ExportHUB wird geladen</h1><p id="msg">Freigegebene Produktionsversion wird ermittelt …</p><div class="bar"><div id="fill" class="fill"></div></div><strong id="pct">12 %</strong><div id="err" class="err"></div><button id="retry" class="retry" onclick="location.reload()">Erneut versuchen</button></div>
<script>(function(){'use strict';var API='/api/exporthub-release',done=false;
try{var u=new URL(location.href);if(u.searchParams.get('portal')==='test'||/^\/test(?:\/|$)/i.test(u.pathname)){location.replace('/test/?_='+Date.now());return}}catch(_){}
function p(n,t){document.getElementById('fill').style.width=n+'%';document.getElementById('pct').textContent=n+' %';if(t)document.getElementById('msg').textContent=t}
function fail(t){p(100,'Produktionsversion konnte nicht geladen werden');var e=document.getElementById('err');e.style.display='block';e.textContent=t||'Release-API nicht erreichbar.';document.getElementById('retry').style.display='block'}
function removeScriptById(h,id){var re=new RegExp('<script[^>]+id=["\\\']'+id+'["\\\'][^>]*>[\\s\\S]*?<\\/script>','ig');return h.replace(re,'')}
function sanitize(h){h=String(h||'');h=removeScriptById(h,'rc503-release-bootstrap');return h}
function marker(v){return '<script>window.__EXPORTHUB_RELEASE_STREAMED__=true;window.__EXPORTHUB_RELEASE_CHANNEL__="production";window.__EXPORTHUB_RELEASE_VERSION__='+JSON.stringify(v)+';window.__EXPORTHUB_EXTERNAL_RELEASE_LOADER__=true;<\\/script>'}
function bridge(){return '<script>(function(){"use strict";var API="/api/exporthub-release",cache=null,busy=false;function q(v){return String(v==null?"":v).trim()}function token(){try{return q(window.ExportHUBClean&&window.ExportHUBClean.runtime&&window.ExportHUBClean.runtime.authToken)}catch(_){return""}}function heads(){var t=token(),h={Accept:"application/json","Content-Type":"application/json"};if(t){h["X-ExportHUB-Token"]=t;h["X-ExportHUB-Session"]=t;h.Authorization="Bearer "+t}return h}function go(){location.href="/test/?_="+Date.now();return false}async function setTest(v){if(busy)return false;busy=true;try{v=q(v).toUpperCase();var r=await fetch(API+"?action=set-test&_="+Date.now(),{method:"POST",credentials:"same-origin",cache:"no-store",headers:heads(),body:JSON.stringify({version:v})}),d={};try{d=await r.json()}catch(_){}if(!r.ok||d.ok===false)throw new Error(d.message||("HTTP "+r.status));location.href="/test/?active="+encodeURIComponent(v)+"&_="+Date.now()}catch(e){alert("Testversion konnte nicht aktiviert werden: "+e.message)}finally{busy=false}return false}function esc(v){return String(v==null?"":v).replace(/[&<>\"]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":"&quot;"})}async function loadMeta(){var t=token();if(!t)return null;try{var r=await fetch(API+"?action=list&_="+Date.now(),{credentials:"same-origin",cache:"no-store",headers:heads()}),d=await r.json();if(r.ok&&d.ok!==false){cache=d;decorate();return d}}catch(_){}return null}function decorate(){var host=document.getElementById("rc503ReleaseManager");if(!host)return;var up=host.querySelector(".rc503-release-upload");if(up)up.style.display="none";var page=document.querySelector(".rc503-release-center-view .page-head p");if(page)page.textContent="Neue RCs werden automatisch aus GitHub erkannt. Hier nur testen und freigeben.";if(!cache||!Array.isArray(cache.releases))return;host.querySelectorAll("#rc503ReleaseRows tr").forEach(function(tr){var st=tr.querySelector("td strong");if(!st)return;var v=q(st.textContent).toUpperCase(),r=cache.releases.find(function(x){return q(x.version).toUpperCase()===v});if(!r)return;var td=tr.querySelector("td");if(!td||td.querySelector(".eh-gh-meta"))return;var box=document.createElement("div");box.className="eh-gh-meta";box.style.cssText="margin-top:7px;padding:7px 9px;border-radius:9px;background:#f0f9ff;color:#0c4a6e;font-size:11px;line-height:1.35";var ch=Array.isArray(r.changes)?r.changes.slice(0,3):[];box.innerHTML="<b>"+esc(r.title||r.commitMessage||v)+"</b>"+(ch.length?"<br>"+ch.map(function(x){return "• "+esc(x)}).join("<br>"):"")+"<br><span style=\"color:#64748b\">GitHub "+esc(r.githubShortSha||"–")+" · "+Math.round(Number(r.size||0)/1024)+" KB</span>";td.appendChild(box)})}function install(){window.rc503OpenTestPortal=go;window.rc503SetTest=setTest;var b=document.getElementById("releaseTestPortalBtn");if(b)b.onclick=go;decorate()}install();window.addEventListener("exporthub:ready",function(){install();loadMeta()});window.addEventListener("exporthub:rendered",function(){install();setTimeout(decorate,80)});window.addEventListener("exporthub:viewchange",function(){setTimeout(function(){install();loadMeta()},120)});document.addEventListener("click",function(e){var b=e.target&&e.target.closest&&e.target.closest("#releaseTestPortalBtn");if(!b)return;e.preventDefault();e.stopImmediatePropagation();go()},true);var mo=new MutationObserver(function(){setTimeout(decorate,30)});var c=document.getElementById("content");if(c)mo.observe(c,{childList:true,subtree:true});setTimeout(loadMeta,800)})();<\\/script>'}
function inject(h,v){if(done)return;if(!/<html[\s>]/i.test(h))throw new Error('Ungültige Produktionsdatei.');done=true;h=sanitize(h);h=h.replace(/<head(\s[^>]*)?>/i,function(m,a){return '<head'+(a||'')+'>'+marker(v)});h=h.replace(/<\/body>/i,bridge()+'</body>');p(100,'Produktion '+v+' wird gestartet …');setTimeout(function(){document.open('text/html','replace');document.write(h);document.close()},10)}
async function get(url,accept){var r=await fetch(url,{credentials:'same-origin',cache:'no-store',headers:{Accept:accept||'application/json'}}),t=await r.text();if(!r.ok)throw new Error(t||('HTTP '+r.status));return t}
(async function(){try{p(32,'Produktionsstatus wird geprüft …');var m=JSON.parse(await get(API+'?action=active&channel=production&_='+Date.now())),v=String(m.version||'').trim().toUpperCase();if(!v)throw new Error('Im Release-Center ist keine Produktionsversion freigegeben.');p(58,'Produktion '+v+' wird geladen …');var h=await get(API+'?action=html&channel=production&_='+Date.now(),'text/html');p(86,'Oberfläche wird vorbereitet …');inject(h,v)}catch(e){fail(e.message)}})();})();</script></body></html>
