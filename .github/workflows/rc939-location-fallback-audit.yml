name: RC939 Standort-Fallback-Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc939-location-fallback-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: RC938 Fallback-Leser untersuchen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC938',cache:'938',loginReturn:'/TESTVERSION.html?v=938'" in text
          print('=== RC939 FALLBACK AUDIT BASIS RC938 ===')

          def contexts(label,needle,r=1100,limit=8):
              hits=[]; pos=0
              while True:
                  i=text.find(needle,pos)
                  if i<0: break
                  hits.append(i); pos=i+1
              print(f'\n## {label}: {len(hits)}')
              for no,i in enumerate(hits[:limit],1):
                  print(f'--- {no} @ {i} ---')
                  print(text[max(0,i-r):min(len(text),i+len(needle)+r)].replace('\r',''))

          for label,needle in [
            ('shipmentLocation','function shipmentLocation(sh,c){'),
            ('embeddedShipmentCustomer','function embeddedShipmentCustomer(sh){'),
            ('visibleShipmentCustomer','function visibleShipmentCustomer(sh,existing){'),
            ('locationFor','function locationFor(c,sh){'),
            ('customerForConfirmation','function customerForConfirmation(){'),
            ('shipmentLocationIdentity','function shipmentLocationIdentity('),
            ('addressSelectionValid','function addressSelectionValid(){'),
            ('3-ID shipment reader','sh.locationId||sh.selectedLocationId||sh.siteId)'),
            ('3-ID location reader','l.id||l.locationId||l.siteId||l.code'),
            ('3-ID existing reader','existing.locationId||existing.selectedLocationId||existing.siteId'),
          ]: contexts(label,needle)

          print('\n## Schreibstellen mit drei IDs ohne destinationId')
          out=[]
          for m in re.finditer(r'[^\n]{0,220}(?:sh|x)\.locationId\s*=.*?(?:sh|x)\.selectedLocationId\s*=.*?(?:sh|x)\.siteId\s*=[^\n]{0,220}',text):
              s=m.group(0)
              if 'destinationId' not in s and s not in out: out.append(s)
          for i,s in enumerate(out[:30],1): print(f'{i:02d}: {s}')
          print('WRITE3_TOTAL=',len(out))
          PY
      - name: Audit-Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc939-location-fallback-audit.yml
          git commit -m "RC939 temporären Audit-Workflow entfernen"
          git push origin HEAD:main
