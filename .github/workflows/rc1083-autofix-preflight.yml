name: RC1083 Autofix Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc1083-autofix-preflight.yml'
      - '.github/workflows/diagnostic-autofix.yml'
      - 'api/diagnostic-autofix/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Kurzlebige GitHub-OIDC-Identität abrufen
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=exporthub-diagnostic-autofix")
          token=$(printf '%s' "$response" | jq -r '.value // empty')
          test -n "$token" || { echo 'GitHub-OIDC-Token konnte nicht erstellt werden.' >&2; exit 1; }
          echo "::add-mask::$token"
          umask 077
          printf '%s' "$token" > "$RUNNER_TEMP/exporthub-autofix-preflight.jwt"

      - name: ExportHUB OIDC und GitHub-Dispatch vollständig prüfen
        shell: bash
        run: |
          set -u
          oidc=$(cat "$RUNNER_TEMP/exporthub-autofix-preflight.jwt")
          prod='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          testservice='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          failed=0
          for entry in "production|$prod" "testservice|$testservice"; do
            envName="${entry%%|*}"
            base="${entry#*|}"
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 \
              -X POST "$base/api/diagnostic-autofix" \
              -H 'Content-Type: application/json' \
              -H "X-ExportHUB-GitHub-OIDC: $oidc" \
              --data "$(jq -nc --arg e "$envName" '{action:"preflight",environment:$e}')" || true)
            if [[ "$code" == '200' ]] && jq -e '.ok == true and .callbackMode == "github-oidc"' "$body" >/dev/null; then
              dispatch=$(jq -r '.githubDispatchConfigured // false' "$body")
              if [[ "$dispatch" == 'true' ]]; then
                echo "OK: ExportHUB $envName akzeptiert GitHub OIDC und besitzt die GitHub-Dispatch-Konfiguration."
              else
                echo "FEHLT: ExportHUB $envName akzeptiert GitHub OIDC, aber EXPORTHUB_GITHUB_AUTOFIX_TOKEN ist serverseitig nicht konfiguriert." >&2
                failed=1
              fi
            else
              echo "FEHLER: ExportHUB $envName OIDC-Vorflug HTTP $code" >&2
              head -c 500 "$body" | tr '\n' ' ' >&2 || true
              echo >&2
              failed=1
            fi
            rm -f "$body"
          done
          echo "SERVER_PREFLIGHT_FAILED=$failed" >> "$GITHUB_ENV"

      - name: OpenAI-Key vollständig prüfen
        shell: bash
        run: |
          set -u
          failed=0
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo 'FEHLT: OPENAI_API_KEY ist als GitHub Repository-Secret nicht konfiguriert.' >&2
            failed=1
          else
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H 'Accept: application/json' \
              https://api.openai.com/v1/models || true)
            if [[ "$code" == '200' ]]; then
              echo 'OK: OPENAI_API_KEY ist für einen read-only API-Aufruf gültig.'
            else
              echo "FEHLER: OpenAI-Key konnte nicht validiert werden (HTTP $code)." >&2
              head -c 400 "$body" | tr '\n' ' ' >&2 || true
              echo >&2
              failed=1
            fi
            rm -f "$body"
          fi
          echo "OPENAI_PREFLIGHT_FAILED=$failed" >> "$GITHUB_ENV"

      - name: Autofix-Bereitschaft zusammenfassen
        shell: bash
        run: |
          set -euo pipefail
          server="${SERVER_PREFLIGHT_FAILED:-1}"
          openai="${OPENAI_PREFLIGHT_FAILED:-1}"
          if [[ "$server" == '0' && "$openai" == '0' ]]; then
            echo 'RC1083 Autofix ist vollständig bereit: GitHub OIDC, Dispatch und OpenAI sind bestätigt.'
            exit 0
          fi
          echo "RC1083 Autofix ist noch nicht vollständig bereit: server=$server openai=$openai" >&2
          exit 1

      - name: OIDC-Datei entfernen
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/exporthub-autofix-preflight.jwt"
