name: RC977 Apply Colli Typography

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc977-colli-typography-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RC977 Colli-Typografie einbauen
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('TESTVERSION.html')
          s = p.read_text(encoding='utf-8')

          old_build = "var BUILD=Object.freeze({version:'RC976',cache:'976',loginReturn:'/TESTVERSION.html?v=968'});"
          new_build = "var BUILD=Object.freeze({version:'RC977',cache:'977',loginReturn:'/TESTVERSION.html?v=968'});"
          if s.count(old_build) != 1:
              raise SystemExit(f'BUILD RC976: erwartet 1 Fundstelle, gefunden {s.count(old_build)}')
          if 'id="rc977-colli-typography"' in s:
              raise SystemExit('RC977 Colli-Stylesheet ist bereits vorhanden')
          s = s.replace(old_build, new_build, 1)

          css = '''
<style id="rc977-colli-typography">
#rc363BlockColli #rc573ColliCard{--rc977-colli-font:12px}
#rc363BlockColli #rc573ColliCard .rc363-colli-grid>[data-rc363-field]{font-size:var(--rc977-colli-font)!important;line-height:1.2!important}
#rc363BlockColli #rc573ColliCard .rc363-colli-grid :is(input,select,button,.rc682-packaging-toggle){min-height:var(--rc971-control-h)!important;height:var(--rc971-control-h)!important;padding:7px 8px!important;font-size:var(--rc977-colli-font)!important;line-height:1.15!important}
#rc363BlockColli #rc573ColliCard .rc682-packaging-toggle{font-size:var(--rc977-colli-font)!important;line-height:1.15!important;white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important}
#rc363BlockColli #rc573ColliCard [data-rc363-field="action"] button,#rc363BlockColli #rc573ColliCard [data-rc363-add-row]{font-size:var(--rc977-colli-font)!important}
#rc363BlockColli #rc573ColliCard .rc344-summary .summaryBox span{font-size:10px!important;line-height:1.15!important}
#rc363BlockColli #rc573ColliCard .rc344-summary .summaryBox strong{font-size:14px!important;line-height:1.1!important}
#rc363BlockColli #rc573ColliCard :is(.notice,.badbox,.infobox){font-size:11px!important;line-height:1.3!important}
</style>
'''

          body_pos = s.find('<body')
          if body_pos < 0:
              raise SystemExit('<body> wurde nicht gefunden')
          head_pos = s.rfind('</head>', 0, body_pos)
          if head_pos < 0:
              raise SystemExit('Echtes </head> vor <body> wurde nicht gefunden')
          s = s[:head_pos] + css + s[head_pos:]

          p.write_text(s, encoding='utf-8')
          print('RC977: isolierte Colli-Typografie vor echtem </head> eingefügt.')
          PY

      - name: RC971 bis RC977 Regression
        run: node --test test/rc971-global-form-field-standard.test.mjs test/rc972-field-exception-audit.test.mjs test/rc973-long-text-autogrow.test.mjs test/rc975-global-render-integrity.test.mjs test/rc976-render-fallback-recovery.test.mjs test/rc977-colli-typography.test.mjs

      - name: RC977 committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          git diff --cached --check
          git commit -m "RC977: Colli-Schrift kompakt und einheitlich anpassen"
          git push origin HEAD:main
