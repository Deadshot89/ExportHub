name: RC891 Sendungsdaten Layout and Lieferavis TESTSERVICE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc891-sendungsdaten-lieferavis
  cancel-in-progress: false

jobs:
  patch-testservice:
    name: RC891 TESTSERVICE layout render avis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard valid TESTSERVICE baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html
          test -f customer-avis.html
          grep -Eq "var BUILD=Object\.freeze\(\{version:'RC88(7|8|9)|RC890',cache:'88(7|8|9)|890',loginReturn:'/TESTVERSION\.html\?v=(88(7|8|9)|890)'\}\);" TESTVERSION.html ||           grep -Eq "var BUILD=Object\.freeze\(\{version:'RC890',cache:'890',loginReturn:'/TESTVERSION\.html\?v=890'\}\);" TESTVERSION.html
          grep -Fq "function avisHost(view)" TESTVERSION.html
          grep -Fq "__rc887AvisAllowed" TESTVERSION.html

      - name: RED verify RC891 is not yet active
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "exporthub-rc891-layout-avis-render-fix" TESTVERSION.html; then
            echo "::error::RC891 ist bereits aktiv."
            exit 1
          fi
          echo "RED bestätigt: RC891 fehlt noch."

      - name: Snapshot source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path("TESTVERSION.html").read_text(encoding="utf-8")
          info = {
            "script_open": src.lower().count("<script"),
            "script_close": src.lower().count("</script>"),
            "style_open": src.lower().count("<style"),
            "style_close": src.lower().count("</style>")
          }
          for k, v in info.items():
            Path("/tmp/rc891_" + k).write_text(str(v), encoding="utf-8")
          print(info)
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-before-rc891-${GITHUB_RUN_ID}"
          git tag -a "$TAG" -m "Backup before RC891 sendungsdaten layout, render stability and lieferavis fix"
          git push origin "refs/tags/$TAG"

