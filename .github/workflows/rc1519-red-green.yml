name: RC1519 Red Green

on:
  push:
    branches:
      - debug/rc1505-build-contract-20261013

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1519 focused regression
        run: node --test test/rc1018-production-deploy.test.mjs
