name: RC883 Performance Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc883-performance
  cancel-in-progress: false

jobs:
  patch-testservice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Internal main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard RC882 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html
          grep -q "version:'RC882',cache:'882',loginReturn:'/TESTVERSION.html?v=882'" TESTVERSION.html
          grep -q "function flushBeforeSuspend(reason)" TESTVERSION.html
          grep -q "function rc640ScheduleOverviewPatch()" TESTVERSION.html

      - name: Create immutable RC882 backup tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-rc882-before-rc883-performance"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Backup tag already exists: $TAG"
          else
            git tag -a "$TAG" -m "Last known RC882 baseline before RC883 performance fix"
            git push origin "$TAG"
          fi

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'TESTVERSION.html';
          let text = fs.readFileSync(path, 'utf8');
          const original = text;

          function replaceOnce(oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0) throw new Error(label + ': Ausgangsblock nicht gefunden');
            if (text.indexOf(oldText, first + oldText.length) >= 0) {
              throw new Error(label + ': Ausgangsblock mehrfach gefunden');
            }
            text = text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          const oldSuspend = `function flushBeforeSuspend(reason){if(!runtime.ready||runtime.loading||runtime.applyingRemote)return false;if(runtime.saveTimer){native.clearTimeout(runtime.saveTimer);runtime.saveTimer=null}if(runtime.pendingSave||runtime.dirty||runtime.saving){runtime.deferredSuspendSave=true;if(runtime.activeSaveAbortController)try{runtime.activeSaveAbortController.abort()}catch(_){ }var info=by('saveInfo');if(info)info.textContent='Änderung vorgemerkt · wird bei aktiver App gespeichert';return true}return false}`;
          const newSuspend = `function flushBeforeSuspend(reason){if(!runtime.ready||runtime.loading||runtime.applyingRemote)return false;if(runtime.saveTimer){native.clearTimeout(runtime.saveTimer);runtime.saveTimer=null}if(runtime.saving){runtime.deferredSuspendSave=true;var runningInfo=by('saveInfo');if(runningInfo)runningInfo.textContent='Laufende Azure-Speicherung wird abgeschlossen';return true}if(runtime.pendingSave||runtime.dirty){runtime.deferredSuspendSave=true;var info=by('saveInfo');if(info)info.textContent='Änderung vorgemerkt · wird bei aktiver App gespeichert';return true}return false}`;
          replaceOnce(oldSuspend, newSuspend, 'flushBeforeSuspend');

          const oldOverviewSchedule = `function rc640ScheduleOverviewPatch(){if(rc640OverviewPatchTimer)return false;var nt=window.ExportHUBClean&&window.ExportHUBClean.native&&window.ExportHUBClean.native.setTimeout||window.setTimeout;rc640OverviewPatchTimer=nt(function(){rc640OverviewPatchTimer=null;rc640PatchOverviewQuietly()},40);return true}`;
          const newOverviewSchedule = `function rc640ScheduleOverviewPatch(){var nativeApi=window.ExportHUBClean&&window.ExportHUBClean.native||window,ct=nativeApi.clearTimeout||window.clearTimeout,st=nativeApi.setTimeout||window.setTimeout;if(rc640OverviewPatchTimer)try{ct(rc640OverviewPatchTimer)}catch(_){ }rc640OverviewPatchTimer=st(function(){rc640OverviewPatchTimer=null;rc640PatchOverviewQuietly()},320);return true}`;
          replaceOnce(oldOverviewSchedule, newOverviewSchedule, 'rc640ScheduleOverviewPatch');

          const oldBuild = `var BUILD=Object.freeze({version:'RC882',cache:'882',loginReturn:'/TESTVERSION.html?v=882'});`;
          const newBuild = `var BUILD=Object.freeze({version:'RC883',cache:'883',loginReturn:'/TESTVERSION.html?v=883'});`;
          replaceOnce(oldBuild, newBuild, 'Canonical BUILD');

          const oldReleaseHead = " version:'RC882',\n date:'30.08.2026',\n title:'Login stabilisiert und Dashboard-Eingang frei einfärbbar',";
          const newReleaseHead = " version:'RC883',\n date:'30.08.2026',\n title:'Azure-Speicherung und Sendungsübersicht stabilisiert',";
          replaceOnce(oldReleaseHead, newReleaseHead, 'Release metadata');

          const changesAnchor = " changes:Object.freeze([\n";
          const anchorPos = text.indexOf(changesAnchor);
          if (anchorPos < 0) throw new Error('Release changes: Anker nicht gefunden');
          const rc883Changes =
            `    "RC883 beendet laufende Azure-State-Speicherungen beim Wechsel in den Hintergrund nicht mehr aktiv. Pending/Dirty bleibt vorgemerkt; ein bereits laufender Request darf regulär abschließen und wird nicht mehr durch flushBeforeSuspend selbst abgebrochen.",\n` +
            `    "RC883 entprellt die Status-/Sync-Aktualisierung der Sendungsübersicht. Mehrere unmittelbar aufeinanderfolgende Ereignisse werden zu einem stabilen Patch zusammengefasst, bevor ein möglicher Voll-Render geprüft wird.",\n`;
          text = text.slice(0, anchorPos + changesAnchor.length) + rc883Changes + text.slice(anchorPos + changesAnchor.length);

          if (text === original) throw new Error('Keine Änderung erzeugt');
          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: Static RC883 safety tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('TESTVERSION.html', 'utf8');

          function functionSource(name) {
            const marker = 'function ' + name + '(';
            const start = text.indexOf(marker);
            if (start < 0) throw new Error(name + ' fehlt');
            const brace = text.indexOf('{', start);
            let depth = 0, quote = '', escape = false, lineComment = false, blockComment = false;
            for (let i = brace; i < text.length; i++) {
              const c = text[i], n = text[i+1] || '';
              if (lineComment) { if (c === '\n') lineComment = false; continue; }
              if (blockComment) { if (c === '*' && n === '/') { blockComment = false; i++; } continue; }
              if (quote) {
                if (escape) { escape = false; continue; }
                if (c === '\\') { escape = true; continue; }
                if (c === quote) quote = '';
                continue;
              }
              if (c === '/' && n === '/') { lineComment = true; i++; continue; }
              if (c === '/' && n === '*') { blockComment = true; i++; continue; }
              if (c === "'" || c === '"' || c === '`') { quote = c; continue; }
              if (c === '{') depth++;
              if (c === '}') {
                depth--;
                if (depth === 0) return text.slice(start, i + 1);
              }
            }
            throw new Error(name + ': Ende nicht gefunden');
          }

          const suspend = functionSource('flushBeforeSuspend');
          const scheduler = functionSource('rc640ScheduleOverviewPatch');

          if (/activeSaveAbortController\s*\.\s*abort\s*\(/.test(suspend)) {
            throw new Error('flushBeforeSuspend bricht noch aktiven Save ab');
          }
          if (!/runtime\.saving/.test(suspend) || !/deferredSuspendSave\s*=\s*true/.test(suspend)) {
            throw new Error('Suspend-Schutz unvollständig');
          }
          if (!/clearTimeout/.test(scheduler) || !/320/.test(scheduler)) {
            throw new Error('Overview-Debounce nicht aktiv');
          }
          if (!/version:'RC883',cache:'883',loginReturn:'\/TESTVERSION\.html\?v=883'/.test(text)) {
            throw new Error('RC883 Build-Metadaten fehlen');
          }
          if (!/title:'Azure-Speicherung und Sendungsübersicht stabilisiert'/.test(text)) {
            throw new Error('RC883 Release-Titel fehlt');
          }

          // Parse the two directly modified functions as JavaScript.
          new Function('"use strict"; return (' + suspend + ');');
          new Function('"use strict"; return (' + scheduler + ');');

          console.log('RC883 static safety tests: PASS');
          NODE

      - name: Verify production files untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html production-version.js api pickup.html location.html staticwebapp.config.json; then
            echo "ERROR: Production/API files changed."
            git diff -- index.html production-version.js api pickup.html location.html staticwebapp.config.json
            exit 1
          fi
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "TESTVERSION.html"

      - name: Write RC883 test report
        shell: bash
        run: |
          cat > RC883_PRUEFBERICHT.txt <<'EOF'
          TESTBERICHT RC883 – PERFORMANCE / HAUPTSEITE

          Grundlage:
          - RC882 Produktionsdiagnose vom 30.08.2026
          - Reparatur wird ausschließlich in TESTVERSION.html vorbereitet.
          - Produktion/index.html, APIs, pickup.html, location.html und staticwebapp.config.json werden nicht verändert.

          Behoben:
          1. flushBeforeSuspend beendet einen bereits laufenden Azure-State-Save nicht mehr per AbortController.
          2. Pending/Dirty bleibt beim Hintergrundwechsel vorgemerkt und kann nach Rückkehr weiter gespeichert werden.
          3. Status-/Sync-Ereignisse der Sendungsübersicht werden 320 ms entprellt und zu einem Patch zusammengefasst.
          4. Der vorhandene Overview-Patch bleibt erhalten; Layout und Fachlogik werden nicht verändert.
          5. RC883 Build-/Cache-Kennung für den Testservice gesetzt.

          Automatische Prüfungen:
          - RC882 als Ausgangsversion erkannt.
          - Alter abortender flushBeforeSuspend-Block genau einmal gefunden und ersetzt.
          - Alter 40-ms-Overview-Trigger genau einmal gefunden und ersetzt.
          - Neuer flushBeforeSuspend enthält keinen activeSaveAbortController.abort()-Aufruf.
          - Neuer Overview-Trigger enthält clearTimeout + 320-ms-Debounce.
          - Geänderte Funktionen syntaktisch geparst.
          - Produktions- und API-Dateien unverändert.

          Verbindlicher Live-Test im Testservice:
          A. Sendung ändern und sofort zu einer anderen ExportHUB-Ansicht wechseln.
             Erwartung: Kein AbortError aus flushBeforeSuspend; Änderung bleibt gespeichert/vorgemerkt.
          B. Sendungsübersicht 30–60 Sekunden geöffnet lassen.
             Erwartung: Keine Serie großer Voll-Render direkt hintereinander.
          C. Suche/Filter in der Sendungsübersicht bedienen.
             Erwartung: Eingabe bleibt stabil; kein Flackern/Zurückspringen.
          D. QR/Pickup-Status aktualisieren.
             Erwartung: Kachelstatus wird aktualisiert, ohne mehrfachen Vollaufbau der Übersicht.
          E. Neue Fehlerdiagnose exportieren und mit RC882 vergleichen.
          EOF

      - name: Commit RC883 testservice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add TESTVERSION.html RC883_PRUEFBERICHT.txt
          git commit -m "RC883: stabilize save suspend and overview rendering"
          git push origin main
