name: RC967 Shipment Render Diagnose

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc967-shipment-render-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sendungsansicht Renderpfade analysieren
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('TESTVERSION.html','utf8');

          const build = s.match(/var BUILD=Object\.freeze\(\{version:'(RC\d+)'/);
          console.log('BUILD', build ? build[1] : 'unbekannt');

          function extractFunction(name){
            const re = new RegExp('function\\s+' + name.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&') + '\\s*\\([^)]*\\)\\s*\\{','g');
            const m = re.exec(s);
            if(!m) return null;
            let i = s.indexOf('{', m.index), depth = 0, quote = '', esc = false, line = false, block = false;
            for(; i < s.length; i++){
              const c=s[i], n=s[i+1];
              if(line){ if(c==='\n') line=false; continue; }
              if(block){ if(c==='*'&&n==='/'){block=false;i++;} continue; }
              if(quote){ if(esc){esc=false;continue;} if(c==='\\'){esc=true;continue;} if(c===quote){quote='';} continue; }
              if(c==='/'&&n==='/'){line=true;i++;continue;}
              if(c==='/'&&n==='*'){block=true;i++;continue;}
              if(c==='"'||c==="'"||c==='`'){quote=c;continue;}
              if(c==='{') depth++;
              else if(c==='}' && --depth===0) return s.slice(m.index,i+1);
            }
            return null;
          }

          const names=[];
          const re=/function\s+([A-Za-z_$][\w$]*)\s*\(/g;
          let m;
          while((m=re.exec(s))) names.push(m[1]);
          const uniq=[...new Set(names)];

          function count(body, needle){ return body ? body.split(needle).length-1 : 0; }
          const rows=[];
          for(const name of uniq){
            const body=extractFunction(name);
            if(!body) continue;
            const dom = count(body,'.innerHTML') + count(body,'insertAdjacentHTML') + count(body,'replaceChildren(') + count(body,'appendChild(') + count(body,'append(');
            const shipmentRefs = (body.match(/shipment|sendung|colli|lademeter|ladeliste|cmr/ig)||[]).length;
            const renderRefs = (body.match(/stableRender\(|performStableRender\(|render\(/g)||[]).length;
            if(shipmentRefs && (dom || renderRefs || /shipment|sendung/i.test(name))) rows.push({name,len:body.length,dom,shipmentRefs,renderRefs});
          }
          rows.sort((a,b)=>(b.dom*100000+b.renderRefs*10000+b.shipmentRefs*100+b.len)-(a.dom*100000+a.renderRefs*10000+a.shipmentRefs*100+a.len));
          console.log('\n=== Shipment-nahe Funktionen mit DOM/Render-Aktivität ===');
          rows.slice(0,35).forEach(x=>console.log(JSON.stringify(x)));

          const core=['stableRender','performStableRender','renderShipment','shipmentView','showShipment','renderShipmentView','viewShipment'];
          console.log('\n=== Kernfunktionen ===');
          for(const name of core){
            const body=extractFunction(name);
            if(!body) continue;
            console.log('\n--- '+name+' len='+body.length+' innerHTML='+count(body,'.innerHTML')+' ---');
            console.log(body.slice(0,5000));
            if(body.length>5000) console.log('...[gekürzt]...\n'+body.slice(-1400));
          }

          console.log('\n=== stableRender Aufrufer ===');
          for(const name of uniq){
            const body=extractFunction(name);
            if(body && name!=='stableRender' && body.includes('stableRender()')){
              console.log(name,'len='+body.length,'calls='+count(body,'stableRender()'),'shipmentRefs='+(body.match(/shipment|sendung/ig)||[]).length);
            }
          }

          console.log('\n=== direkte Shipment/Sendung innerHTML-Kontexte ===');
          const needleRe=/(shipment|sendung)[^\n]{0,500}innerHTML|innerHTML[^\n]{0,500}(shipment|sendung)/ig;
          let nm, shown=0;
          while((nm=needleRe.exec(s)) && shown<30){
            console.log('CTX',shown+1, s.slice(Math.max(0,nm.index-350),Math.min(s.length,nm.index+900)).replace(/\s+/g,' '));
            shown++;
          }
          console.log('contexts',shown);
          NODE
