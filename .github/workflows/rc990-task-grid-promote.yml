name: RC990 Task Grid Promote

on:
  push:
    branches:
      - rc990-large-ux
    paths:
      - .github/rc990_task_grid_promote.py
      - .github/workflows/rc990-task-grid-promote.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc990-task-grid-promote
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/rc990-large-ux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated RC990 branch
        uses: actions/checkout@v4
        with:
          ref: rc990-large-ux
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair canonical RC990 selectors
        run: python .github/rc990_task_grid_promote.py

      - name: Materialize canonical RC990 design into preview source
        run: python .github/rc990_design_apply.py

      - name: Verify RC990 design and existing green layout baseline
        run: |
          node --test \
            test/migration.test.mjs \
            test/rc971-global-form-field-standard.test.mjs \
            test/rc972-field-exception-audit.test.mjs \
            test/rc973-long-text-autogrow.test.mjs \
            test/rc975-global-render-integrity.test.mjs \
            test/rc976-render-fallback-recovery.test.mjs \
            test/rc977-colli-typography.test.mjs \
            test/rc978-shipment-fluid-layout.test.mjs \
            test/rc979-shipment-inner-density.test.mjs \
            test/rc980-colli-row-stability.test.mjs \
            test/rc990-design-system.test.mjs \
            test/rc990-release-center.test.mjs

      - name: Confirm independent render-navigation contract remains the known RED block
        shell: bash
        run: |
          set +e
          node --test test/rc990-render-navigation.test.mjs > /tmp/rc990-known-red.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Render-navigation contract unexpectedly turned green; this is acceptable but should be reviewed in its own block.'
            exit 0
          fi
          grep -Fq 'RC990: UI-State Snapshot und Restore sind vorhanden' /tmp/rc990-known-red.txt
          grep -Fq 'not ok' /tmp/rc990-known-red.txt
          echo 'Known pre-existing RC990 render-navigation RED confirmed; no design regression attributed to it.'

      - name: Remove one-time promotion and diagnostic helpers
        shell: bash
        run: |
          git rm .github/rc990_task_grid_promote.py .github/workflows/rc990-task-grid-promote.yml
          git rm -f --ignore-unmatch \
            .github/rc990_task_grid_test_result.txt \
            .github/rc990_task_grid_regression_result.txt \
            .github/rc990_task_grid_regression_diag.txt

      - name: Commit canonical RC990 design result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rc990_design_apply.py TESTVERSION.html
          git commit -m "RC990: Aufgabenraster sichtbar und direkt wirksam machen"
          git push origin HEAD:rc990-large-ux
