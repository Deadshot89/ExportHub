name: RC967 Shipment Render Diagnose

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc967-shipment-render-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: refreshVisuals Implementierung analysieren
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('TESTVERSION.html','utf8');
          const build=s.match(/var BUILD=Object\.freeze\(\{version:'(RC\d+)'/);
          console.log('BUILD',build?build[1]:'unbekannt');

          function context(label,token,before=1200,after=7000,limit=20){
            console.log('\n=== '+label+' ===');
            let pos=0,count=0;
            while((pos=s.indexOf(token,pos))>=0&&count<limit){
              count++;
              const out=s.slice(Math.max(0,pos-before),Math.min(s.length,pos+after));
              console.log('\n--- '+count+' @ '+pos+' ---\n'+out);
              pos+=token.length;
            }
            console.log('COUNT',count);
          }

          context('shipmentPatchApi','function shipmentPatchApi(',500,5000,10);
          context('refreshVisuals symbol','refreshVisuals',1400,7000,20);
          context('refreshVisuals property','refreshVisuals:',1400,9000,20);
          context('refreshVisuals assignment','.refreshVisuals=',1400,9000,20);
          NODE
