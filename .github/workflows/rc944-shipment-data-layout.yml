name: RC944 Sichtbaren Sendungsdaten Formularblock eingrenzen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc944-shipment-data-layout.yml'

permissions:
  contents: write

concurrency:
  group: rc944-shipment-data-layout
  cancel-in-progress: false

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sichtbaren Formularblock extrahieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC943',cache:'943',loginReturn:'/TESTVERSION.html?v=943'" in text, 'Basis ist nicht RC943'
          needle='state.shipment.comments=this.value'
          positions=[]; p=0
          while True:
              i=text.find(needle,p)
              if i<0: break
              positions.append(i); p=i+1
          assert positions, 'Bemerkungs-Handler nicht gefunden'
          anchor=positions[-1]
          start=max(0,anchor-18000)
          end=min(len(text),anchor+14000)
          chunk=text[start:end]
          Path('_rc944_active_snippet.txt').write_text('anchor='+str(anchor)+'\n---SNIPPET---\n'+chunk,encoding='utf-8')
          assert 'Bemerkung' in chunk, 'Bemerkungsfeld nicht im Ausschnitt'
          print('anchor',anchor,'Sendungsdaten',chunk.count('Sendungsdaten'),'Bemerkung',chunk.count('Bemerkung'))
          PY

      - name: Diagnose-Ausschnitt aktualisieren
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _rc944_active_snippet.txt
          git commit -m "RC944 sichtbaren Sendungsdaten-Formularblock erfassen"
          git push origin HEAD:main
