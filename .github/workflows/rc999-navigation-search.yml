name: RC999 Navigation Search

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc999-navigation-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Baseline Regressionen
        run: npm test
      - name: Aktiven Suchindex diagnostizieren
        run: node .github/rc999/diagnose-search-owner.mjs
      - name: RC999 Navigation und Suche anwenden
        run: node .github/rc999/apply-navigation-search.mjs
      - name: RC999 Navigation und Suche
        run: node --test .github/rc999/rc999-navigation-search.test.mjs
      - name: RC997 nicht versionsgebundene Funktionsverträge
        run: |
          node --test \
            .github/rc997/android-contract.test.mjs \
            .github/rc997/production-release-contract.test.mjs \
            .github/rc997/rc997-build-contract.test.mjs \
            .github/rc997/rc997-external-contract.test.mjs \
            .github/rc997/rc997-shipment-contract.test.mjs \
            .github/rc997/rc997-workflow-contract.test.mjs
      - name: Produktionsmarker schützen
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RC997' production-version.js
          if grep -q 'RC999' production-version.js; then
            echo 'production-version.js darf RC999 vor Freigabe nicht enthalten.' >&2
            exit 1
          fi
