name: ExportHUB AV-Prüfung

# Prüft alle Sendungen mit erstelltem ABD, auch ältere/archivierte und noch nicht abgeholte.
# Fehlt im REF-Ordner ein AV, erzeugt /api/av-check sofort eine eindeutige Aufgabe je REF.
# Die Aufgabe wird nach verifizierter Ablage der benötigten AVs automatisch erledigt.

on:
  schedule:
    - cron: '15 5-17 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Umgebung'
        required: true
        default: testservice
        type: choice
        options:
          - testservice
          - production
          - both

permissions:
  contents: read
  id-token: write

concurrency:
  group: exporthub-av-check
  cancel-in-progress: false

jobs:
  check:
    name: AV-Prüfung ${{ matrix.target.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - env: testservice
            base_url: https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net
          - env: production
            base_url: https://wonderful-forest-0f315e310.7.azurestaticapps.net
    steps:

      - name: ABD ohne AV-Upload als Aufgabe synchronisieren
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.environment == 'both' || inputs.environment == matrix.target.env }}
        shell: bash
        env:
          BASE_URL: ${{ matrix.target.base_url }}
          TARGET_ENV: ${{ matrix.target.env }}
        run: |
          set -euo pipefail
          set +x
          for batch in $(seq 1 10); do
            oidc_token="$(
              curl -fsSL \
                -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-av-check" \
                | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
            )"
            response_file="$(mktemp)"
            http_code="$(
              curl -sS -L -o "$response_file" -w '%{http_code}' \
                -H "Content-Type: application/json" \
                -H "x-exporthub-github-oidc: $oidc_token" \
                -H "x-exporthub-environment: $TARGET_ENV" \
                -d "{\"environment\":\"$TARGET_ENV\",\"limit\":40,\"uploadTasksOnly\":true}" \
                "$BASE_URL/api/av-check" || true
            )"
            if [ "$http_code" = "404" ]; then
              rm -f "$response_file"
              echo "::notice::AV-Aufgabensynchronisierung $TARGET_ENV noch nicht ausgerollt."
              exit 0
            fi
            verdict="$(node -e "
              const fs=require('fs');let v={};try{v=JSON.parse(fs.readFileSync(process.argv[1],'utf8')||'{}')}catch(_){}
              const status=Number(process.argv[2]||0);
              const errorCodes={};
              for(const item of Array.isArray(v.errors)?v.errors:[]){
                const code=String(item&&item.code||'UNKNOWN').replace(/[^A-Za-z0-9_.-]/g,'').slice(0,70)||'UNKNOWN';
                errorCodes[code]=(errorCodes[code]||0)+1;
              }
              console.error('AV-Upload-Aufgaben',process.env.TARGET_ENV,JSON.stringify({httpStatus:status,mode:v.mode,candidates:v.candidates,checked:v.checked,remaining:v.remaining,uploadPending:v.uploadPending,createdTasks:v.createdTasks,reopenedTasks:v.reopenedTasks,closedTasks:v.closedTasks,errorCount:v.errorCount,errorCodes}));
              if(status<200||status>=300||!v.ok||v.mode!=='upload-tasks')process.exit(3);
              process.stdout.write(Number(v.remaining||0)>0?'again':'done');
            " "$response_file" "$http_code")"
            rm -f "$response_file"
            if [ "$verdict" = "done" ]; then exit 0; fi
          done
          echo 'AV-Upload-Aufgaben: Backfill wird im nächsten Lauf fortgesetzt.' >&2

      - name: REF-Ordner auf Ausgangsvermerk prüfen
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.environment == 'both' || inputs.environment == matrix.target.env }}
        shell: bash
        env:
          BASE_URL: ${{ matrix.target.base_url }}
          TARGET_ENV: ${{ matrix.target.env }}
        run: |
          set -euo pipefail
          set +x

          for batch in $(seq 1 10); do
            oidc_token="$(
              curl -fsSL \
                -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-av-check" \
                | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
            )"
            response_file="$(mktemp)"
            http_code="$(
              curl -sS -L -o "$response_file" -w '%{http_code}' \
                -H "Content-Type: application/json" \
                -H "x-exporthub-github-oidc: $oidc_token" \
                -H "x-exporthub-environment: $TARGET_ENV" \
                -d "{\"environment\":\"$TARGET_ENV\",\"limit\":40}" \
                "$BASE_URL/api/av-check" || true
            )"
            if [ "$http_code" = "404" ]; then
              # Endpunkt ist in dieser Umgebung noch nicht ausgerollt (z. B. Production vor dem nächsten Release).
              rm -f "$response_file"
              echo "::notice::AV-Prüfung $TARGET_ENV übersprungen: /api/av-check ist dort noch nicht ausgerollt."
              exit 0
            fi
            verdict="$(node -e "
              const fs=require('fs');let v={};try{v=JSON.parse(fs.readFileSync(process.argv[1],'utf8')||'{}')}catch(_){}
              const status=Number(process.argv[2]||0);
              // RC1773: individual shipment references are private and must not
              // be copied into Actions logs from Graph/REF error arrays.
              const errorCodes={};
              for(const item of Array.isArray(v.errors)?v.errors:[]){
                const code=String(item&&item.code||'UNKNOWN').replace(/[^A-Za-z0-9_.-]/g,'').slice(0,70)||'UNKNOWN';
                errorCodes[code]=(errorCodes[code]||0)+1;
              }
              console.error('AV-Prüfung',process.env.TARGET_ENV,JSON.stringify({httpStatus:status,code:v.code,graphConfigured:v.graphConfigured,candidates:v.candidates,checked:v.checked,remaining:v.remaining,present:v.present,missing:v.missing,createdTasks:v.createdTasks,closedTasks:v.closedTasks,errorCount:v.errorCount,errorCodes}));
              if(status<200||status>=300||!v.ok)process.exit(3);
              process.stdout.write(Number(v.remaining||0)>0?'again':'done');
            " "$response_file" "$http_code")"
            rm -f "$response_file"
            if [ "$verdict" = "done" ]; then exit 0; fi
          done
          echo 'AV-Prüfung: nach 10 Durchläufen sind noch Sendungen offen; der nächste Lauf setzt fort.' >&2
