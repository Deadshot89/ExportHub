name: RC990 TESTSERVICE Release Gate

on:
  push:
    branches:
      - rc990-large-ux
    paths:
      - '.github/workflows/rc990-testservice-release-gate.yml'
      - 'staticwebapp.testservice.config.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  verify_and_dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact RC990 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify exact candidate SHA and RC990 version
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "candidate_sha=$ACTUAL"
          test "$ACTUAL" = "$GITHUB_SHA"
          VERSION="$(grep -oE "var BUILD=Object\.freeze\(\{version:'RC[0-9]+'" TESTVERSION.html | head -n1 | sed -E "s/.*version:'(RC[0-9]+)'/\1/")"
          echo "candidate_version=$VERSION"
          test "$VERSION" = "RC990"

      - name: Full committed-state regression
        shell: bash
        run: |
          set -euo pipefail
          npm test
          git diff --check 641c8b771cc19881a82bdf2dd10a790b19fe8b6e...HEAD

      - name: API and TESTSERVICE preflight smoke
        shell: bash
        run: |
          set -euo pipefail
          node -e "const c=JSON.parse(require('fs').readFileSync('staticwebapp.testservice.config.json','utf8')); if(c?.platform?.apiRuntime!=='node:20') throw new Error('TESTSERVICE apiRuntime ist nicht node:20');"
          node -e "const p=require('./api/package.json'); if(p?.dependencies?.['@azure/storage-blob']!=='12.27.0') throw new Error('@azure/storage-blob 12.27.0 fehlt');"
          for js in api/exporthub-state/index.js api/exporthub-auth/index.js api/exporthub-auth-probe/index.js api/pickup-status/index.js api/shared/auth-store.js api/shared/user-policy.js api/shared/merge.js; do
            node --check "$js"
          done

      - name: Reconfirm protected standalone runtime paths unchanged
        shell: bash
        run: |
          set -euo pipefail
          BASE=641c8b771cc19881a82bdf2dd10a790b19fe8b6e
          protected="$(git diff --name-only "$BASE"...HEAD -- \
            api/customer-avis 'api/pickup-*' 'api/pod-*' api/loader-pins-admin api/shared/pickup-store.js \
            customer-avis.html pickup.html pod-notfall.html staticwebapp.config.json index.html || true)"
          if [ -n "$protected" ]; then
            echo "$protected"
            exit 1
          fi
          echo 'Protected standalone runtime paths unchanged.'

      - name: Dispatch established TESTSERVICE workflow exactly once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/exporthub-testservice-final-artifact-fix.yml/dispatches"
          code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d '{"ref":"rc990-large-ux"}')"
          cat /tmp/dispatch-response.txt || true
          echo "dispatch_http=$code"
          test "$code" = "204"
          echo 'Established TESTSERVICE workflow dispatched for rc990-large-ux.'
