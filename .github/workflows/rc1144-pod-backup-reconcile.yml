              -d "{\"environment\":\"$TARGET_ENV\",\"graphTargetDiagnostic\":true}" \
              "$BASE_URL/api/pod-backup-reconcile" || true
          )"
          node - "$http_code" "$response_file" "$TARGET_ENV" <<'NODE'
          const fs=require('fs');
          const [status,file,environment]=process.argv.slice(2);
          let data={};
          try {data=JSON.parse(fs.readFileSync(file,'utf8'))}catch(_){}
          const clean=x=>String(x||'').replace(/[^A-Za-z0-9_.-]/g,'').slice(0,70);
          const checks=(Array.isArray(data.checks)?data.checks:[]).slice(0,12).map(x=>({
            stage:clean(x.stage),status:clean(x.status),
            httpStatus:Math.max(0,Math.min(599,Number(x.httpStatus)||0)),
            providerCode:clean(x.providerCode)
          }));
          const summary={environment,httpsStatus:Math.max(0,Number(status)||0),
            ok:data.diagnosticOnly===true&&data.ok===true,
            code:clean(data.code),mode:clean(data.targetMode),
            configured:data.configured===true,missing:(Array.isArray(data.missing)?data.missing:[]).map(clean).slice(0,8),
            checks};
          console.log('RC1687 Graph target diagnostic',JSON.stringify(summary));
          if(!summary.ok)console.log('::warning title=Graph POD target diagnostic::Read-only Graph target verification is pending; see redacted stages in this job.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '\n### RC1687 '+environment+' Graph target (read-only)\n\n' +
