name: RC884 Navigation Search Shipment UX Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc884-navigation-search-shipment-ux
  cancel-in-progress: false

jobs:
  patch-testservice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Internal main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard RC883 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html
          grep -q "version:'RC883',cache:'883',loginReturn:'/TESTVERSION.html?v=883'" TESTVERSION.html
          grep -q "function rc843EnsureView()" TESTVERSION.html
          grep -q "__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__=rc843ReleaseViewGuard" TESTVERSION.html
          grep -q "function route(view,source){view=canonical(view);window.__EXPORTHUB_NAVIGATION_ACTIVE_UNTIL__=Date.now()+1800;" TESTVERSION.html
          grep -q "rc807ShipmentSearch" TESTVERSION.html
          grep -q "function placeWorkflowButtons(customerBody,shipmentBody,documentsBody)" TESTVERSION.html
          grep -q "rc386AddressConfirmed" TESTVERSION.html
          grep -q "KUNDEN-AVIS / LIEFERAVIS" TESTVERSION.html
          grep -q "function avisHost(view)" TESTVERSION.html

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC883 backup tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-rc883-before-rc884-navigation-search-ux"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Backup tag already exists: $TAG"
          else
            git tag -a "$TAG" -m "Last known RC883 baseline before RC884 navigation/search/shipment UX fix"
            git push origin "$TAG"
          fi

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'TESTVERSION.html';
          let text = fs.readFileSync(path, 'utf8');
          const original = text;

          function replaceOnce(oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0) throw new Error(label + ': Ausgangsblock nicht gefunden');
            if (text.indexOf(oldText, first + oldText.length) >= 0) {
              throw new Error(label + ': Ausgangsblock mehrfach gefunden');
            }
            text = text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          function findFunctionRange(source, name, fromIndex) {
            const marker = 'function ' + name + '(';
            const start = source.indexOf(marker, fromIndex || 0);
            if (start < 0) throw new Error(name + ': Funktion nicht gefunden');
            const brace = source.indexOf('{', start);
            if (brace < 0) throw new Error(name + ': öffnende Klammer fehlt');

            let depth = 0, quote = '', escape = false, lineComment = false, blockComment = false;
            for (let i = brace; i < source.length; i++) {
              const c = source[i], n = source[i + 1] || '';
              if (lineComment) {
                if (c === '\n') lineComment = false;
                continue;
              }
              if (blockComment) {
                if (c === '*' && n === '/') { blockComment = false; i++; }
                continue;
              }
              if (quote) {
                if (escape) { escape = false; continue; }
                if (c === '\\') { escape = true; continue; }
                if (c === quote) quote = '';
                continue;
              }
              if (c === '/' && n === '/') { lineComment = true; i++; continue; }
              if (c === '/' && n === '*') { blockComment = true; i++; continue; }
              if (c === "'" || c === '"' || c === '`') { quote = c; continue; }
              if (c === '{') depth++;
              if (c === '}') {
                depth--;
                if (depth === 0) return { start, end: i + 1, source: source.slice(start, i + 1) };
              }
            }
            throw new Error(name + ': Funktionsende nicht gefunden');
          }

          function replaceFunctionAfter(anchor, name, newSource, label) {
            const anchorIndex = text.indexOf(anchor);
            if (anchorIndex < 0) throw new Error(label + ': Anker nicht gefunden');
            const range = findFunctionRange(text, name, anchorIndex);
            text = text.slice(0, range.start) + newSource + text.slice(range.end);
          }

          // 1) Navigation: aktiven Shipment-View-Guard bei jeder echten Navigation
          //    aus shipmentview heraus VOR Cache/Renderer freigeben.
          const oldRouteHead =
            "function route(view,source){view=canonical(view);window.__EXPORTHUB_NAVIGATION_ACTIVE_UNTIL__=Date.now()+1800;if(!canRoute(view)){";
          const newRouteHead =
            "function route(view,source){view=canonical(view);window.__EXPORTHUB_NAVIGATION_ACTIVE_UNTIL__=Date.now()+1800;if(!canRoute(view)){";
          // Head selbst bleibt bis zur Rechteprüfung gleich. Der Release-Hook wird direkt
          // nach erfolgreich bestandener Rechteprüfung und vor dem Fast-View-Pfad eingesetzt.
          if (text.indexOf(oldRouteHead) < 0) throw new Error('Navigation route(): Ausgangskopf fehlt');

          const oldRouteAfterPermission =
            "}var now=Date.now();if(routeBusy||(view===lastRoute&&now-lastRouteAt<120)){duplicateRoutesBlocked++;return false}var previous=current();routeBusy=true;";
          const newRouteAfterPermission =
            "}var now=Date.now();if(routeBusy||(view===lastRoute&&now-lastRouteAt<120)){duplicateRoutesBlocked++;return false}var previous=current();if(view!=='shipmentview'&&typeof window.__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__==='function'){try{window.__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__('route-'+view)}catch(_){}}routeBusy=true;";
          replaceOnce(oldRouteAfterPermission, newRouteAfterPermission, 'Navigation Guard Release');

          // Zweite Sicherung im Guard selbst: ein bereits geplanter sync/render-Timer darf
          // eine gerade gestartete Navigation nicht wieder auf shipmentview zurücksetzen.
          const oldGuard =
            "function rc843EnsureView(){if(rc843ViewGuardBusy||!rc843ViewGuard)return false;var g=rc843ViewGuard,sh=find(g.id||g.ref);if(!sh){rc843ReleaseViewGuard('shipment-missing');return false}var s=state(),wanted=idOf(sh)||refOf(sh),currentId=q(s.shipmentViewId);if(low(s.view)==='shipmentview'&&currentId===wanted&&rc843ViewDomOk())return true;rc843ViewGuardBusy=true;try{s.shipmentViewId=wanted;if(!q(s.shipmentViewReturnView))s.shipmentViewReturnView=g.source||'shipmentoverview';s.view='shipmentview';try{if(typeof window.__EXPORTHUB_BIND_STATE__==='function')window.__EXPORTHUB_BIND_STATE__(s)}catch(_){}try{document.body.setAttribute('data-exporthub-view','shipmentview');document.body.setAttribute('data-current-view','shipmentview')}catch(_){}render();return true}finally{rc843ViewGuardBusy=false}}";
          const newGuard =
            "function rc843EnsureView(){if(rc843ViewGuardBusy||!rc843ViewGuard)return false;var g=rc843ViewGuard,sh=find(g.id||g.ref);if(!sh){rc843ReleaseViewGuard('shipment-missing');return false}var s=state(),wanted=idOf(sh)||refOf(sh),currentId=q(s.shipmentViewId);if(low(s.view)!=='shipmentview'&&Date.now()<Number(window.__EXPORTHUB_NAVIGATION_ACTIVE_UNTIL__||0)){rc843ReleaseViewGuard('explicit-navigation');return false}if(low(s.view)==='shipmentview'&&currentId===wanted&&rc843ViewDomOk())return true;rc843ViewGuardBusy=true;try{s.shipmentViewId=wanted;if(!q(s.shipmentViewReturnView))s.shipmentViewReturnView=g.source||'shipmentoverview';s.view='shipmentview';try{if(typeof window.__EXPORTHUB_BIND_STATE__==='function')window.__EXPORTHUB_BIND_STATE__(s)}catch(_){}try{document.body.setAttribute('data-exporthub-view','shipmentview');document.body.setAttribute('data-current-view','shipmentview')}catch(_){}render();return true}finally{rc843ViewGuardBusy=false}}";
          replaceOnce(oldGuard, newGuard, 'RC843 Shipment View Guard');

          // 2) Kunden-Avis nur noch auf der separaten customer-avis.html.
          //    Der interne Renderer wird deaktiviert und räumt ggf. bereits vorhandene
          //    interne Hosts aus Sendung erstellen / Sendungsansicht auf.
          const avisCleanupRender =
            "function render(){['rc705AvisMountRead','rc705AvisMountEdit','rc845AvisReadHost','rc845AvisEditHost','rc844AvisHost','rc849AvisReadCard','rc363BlockAvis'].forEach(function(id){var node=document.getElementById(id);if(node)node.remove()});lastSig='';return false}";
          replaceFunctionAfter('function avisHost(view)', 'render', avisCleanupRender, 'Interner Kunden-Avis Renderer');

          // 3) Adresse nicht mehr manuell bestätigen.
          const addressCleanup =
            "function updateConfirmationButtons(){var address=document.getElementById('rc386AddressConfirmed');if(address)address.remove();var hidden=document.getElementById('rc386AddressState');if(hidden)hidden.remove();return false}";
          replaceFunctionAfter('function addressSelectionValid()', 'updateConfirmationButtons', addressCleanup, 'Adressbestätigung');

          const confirmationCall =
            " confirmationButton(customerActions,'rc386AddressConfirmed','Adresse geprüft und bestätigt','addressConfirmed',[]);";
          replaceOnce(confirmationCall, '', 'Adressbestätigungs-Button');

          // 4) Kunde wird weiterhin durch die vorhandene Suche automatisch übernommen.
          //    Den redundanten manuellen Button aus dem Workflow-Layout entfernen.
          const oldCustomerDecl =
            "     customerBtn=workflowButton(/^kunde ubernehmen$/);";
          const newCustomerDecl =
            "     customerBtn=workflowButton(/^kunde ubernehmen$/);if(customerBtn){customerBtn.remove();customerBtn=null}";
          replaceOnce(oldCustomerDecl, newCustomerDecl, 'Kunde übernehmen Button');

          // Version / Release.
          replaceOnce(
            "var BUILD=Object.freeze({version:'RC883',cache:'883',loginReturn:'/TESTVERSION.html?v=883'});",
            "var BUILD=Object.freeze({version:'RC884',cache:'884',loginReturn:'/TESTVERSION.html?v=884'});",
            'Canonical BUILD'
          );

          replaceOnce(
            " version:'RC883',\n date:'30.08.2026',\n title:'Azure-Speicherung und Sendungsübersicht stabilisiert',",
            " version:'RC884',\n date:'30.08.2026',\n title:'Navigation, Suche und Sendungsmaske korrigiert',",
            'Release metadata'
          );

          const changesAnchor = " changes:Object.freeze([\n";
          const changesPos = text.indexOf(changesAnchor);
          if (changesPos < 0) throw new Error('Release changes: Anker fehlt');
          const newChanges =
            '    "RC884 gibt den Schutz der schreibgeschützten Sendungsansicht bei jeder echten Navigation sofort frei. Aufgaben, Planung, Dashboard, Kunden und andere Bereiche dürfen nicht mehr durch einen verzögerten sync/render-Guard zurück auf Sendungsansicht gesetzt werden.",\n' +
            '    "RC884 stellt die Sendungssuche wieder unabhängig bereit: der bestehende rc807ShipmentSearch-Handler bleibt erhalten und shipmentsearch wird nicht mehr durch den Shipment-View-Guard überschrieben.",\n' +
            '    "RC884 entfernt Kunden-Avis / Lieferavis aus Sendung erstellen und Sendungsansicht. Die separate customer-avis.html und ihre API bleiben unverändert.",\n' +
            '    "RC884 entfernt die manuellen Schaltflächen Kunde übernehmen und Adresse geprüft und bestätigt aus Sendung erstellen. Die bestehende automatische Kundensuche/-auswahl bleibt aktiv.",\n';
          text = text.slice(0, changesPos + changesAnchor.length) + newChanges + text.slice(changesPos + changesAnchor.length);

          if (text === original) throw new Error('Keine Änderung erzeugt');
          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: Static RC884 safety tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('TESTVERSION.html', 'utf8');

          function functionSource(name, fromText) {
            const source = fromText || text;
            const marker = 'function ' + name + '(';
            const start = source.indexOf(marker);
            if (start < 0) throw new Error(name + ' fehlt');
            const brace = source.indexOf('{', start);
            let depth = 0, quote = '', escape = false, lineComment = false, blockComment = false;
            for (let i = brace; i < source.length; i++) {
              const c = source[i], n = source[i + 1] || '';
              if (lineComment) { if (c === '\n') lineComment = false; continue; }
              if (blockComment) { if (c === '*' && n === '/') { blockComment = false; i++; } continue; }
              if (quote) {
                if (escape) { escape = false; continue; }
                if (c === '\\') { escape = true; continue; }
                if (c === quote) quote = '';
                continue;
              }
              if (c === '/' && n === '/') { lineComment = true; i++; continue; }
              if (c === '/' && n === '*') { blockComment = true; i++; continue; }
              if (c === "'" || c === '"' || c === '`') { quote = c; continue; }
              if (c === '{') depth++;
              if (c === '}') {
                depth--;
                if (depth === 0) return source.slice(start, i + 1);
              }
            }
            throw new Error(name + ': Ende nicht gefunden');
          }

          if (!/version:'RC884',cache:'884',loginReturn:'\/TESTVERSION\.html\?v=884'/.test(text)) {
            throw new Error('RC884 Build-Metadaten fehlen');
          }

          // Navigation / Guard
          if (!/__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__\('route-'\+view\)/.test(text)) {
            throw new Error('Route gibt Shipment-View-Guard nicht frei');
          }
          const guard = functionSource('rc843EnsureView');
          if (!/__EXPORTHUB_NAVIGATION_ACTIVE_UNTIL__/.test(guard) || !/explicit-navigation/.test(guard)) {
            throw new Error('RC843 Guard schützt explizite Navigation noch nicht');
          }

          // Suche muss unverändert vorhanden sein.
          if (!/input\.id==='rc807ShipmentSearch'/.test(text) || !/renderSearchResults\(input\.value\)/.test(text)) {
            throw new Error('Sendungssuche/Live-Handler fehlt');
          }
          if (!/view==='shipmentsearch'/.test(text) || !/renderSearch/.test(text)) {
            throw new Error('shipmentsearch Route fehlt');
          }

          // Interner Avis muss deaktiviert sein; die separate Datei bleibt als Asset vorhanden.
          const avisAnchor = text.indexOf('function avisHost(view)');
          if (avisAnchor < 0) throw new Error('Avis-Controller-Anker fehlt');
          const avisRender = functionSource('render', text.slice(avisAnchor));
          if (!/rc845AvisReadHost/.test(avisRender) || !/rc845AvisEditHost/.test(avisRender) || !/return false/.test(avisRender)) {
            throw new Error('Interner Avis-Cleanup unvollständig');
          }
          if (/panel\.innerHTML|KUNDEN-AVIS \/ LIEFERAVIS/.test(avisRender)) {
            throw new Error('Interner Avis rendert weiterhin Inhalt');
          }
          if (!/EXPORTHUB_TESTSERVICE_FILE_BEGIN path=customer-avis\.html/.test(text)) {
            throw new Error('Separate customer-avis.html fehlt im Testservice-Paket');
          }

          // Bestätigungsbuttons
          const addrAnchor = text.indexOf('function addressSelectionValid()');
          if (addrAnchor < 0) throw new Error('Adresslogik-Anker fehlt');
          const updateAddress = functionSource('updateConfirmationButtons', text.slice(addrAnchor));
          if (!/rc386AddressConfirmed/.test(updateAddress) || !/\.remove\(\)/.test(updateAddress)) {
            throw new Error('Adressbestätigungs-Cleanup fehlt');
          }
          if (text.includes("confirmationButton(customerActions,'rc386AddressConfirmed','Adresse geprüft und bestätigt'")) {
            throw new Error('Adressbestätigungs-Button wird noch erzeugt');
          }
          if (!/customerBtn=workflowButton\(\/\^kunde ubernehmen\$\/\);if\(customerBtn\)\{customerBtn\.remove\(\);customerBtn=null\}/.test(text)) {
            throw new Error('Kunde-übernehmen-Button wird nicht entfernt');
          }

          // Automatische Kundenauswahl muss bestehen bleiben.
          if (!/function setShipmentCustomerSearchAuto\(v\)/.test(text) || !/findCustomerBySearch\(v\)/.test(text)) {
            throw new Error('Automatische Kundensuche wurde beschädigt');
          }

          // Die zwei direkt modifizierten Kernfunktionen syntaktisch prüfen.
          new Function('"use strict"; return (' + guard + ');');
          new Function('"use strict"; return (' + updateAddress + ');');
          new Function('"use strict"; return (' + avisRender + ');');

          console.log('RC884 static safety tests: PASS');
          NODE

      - name: Verify production and public avis files untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json; then
            echo "ERROR: Production/API/public Customer-Avis files changed."
            git diff -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json
            exit 1
          fi
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "TESTVERSION.html"

      - name: Write RC884 test report
        shell: bash
        run: |
          cat > RC884_PRUEFBERICHT.txt <<'EOF'
          TESTBERICHT RC884 – NAVIGATION / SUCHE / SENDUNG ERSTELLEN

          Ausgangslage:
          - RC883 Testservice als Basis.
          - Die hochgeladene neue Fehlerdiagnose des Anwenders meldete RC882 production.
          - Daher dient sie als Fehlernachweis der Hauptseite, nicht als Messung des RC883-Testservice.

          Behoben:
          1. Shipment-View-Guard wird bei Navigation aus shipmentview sofort freigegeben.
          2. Ein bereits geplanter RC843 sync/render-Timer darf eine aktive Navigation nicht mehr auf shipmentview zurücksetzen.
          3. Sendungssuche rc807ShipmentSearch bleibt aktiv und wird nicht mehr vom Shipment-View-Guard verdrängt.
          4. Kunden-Avis/Lieferavis wird intern in Sendung erstellen und Sendungsansicht nicht mehr gerendert.
          5. Separate customer-avis.html und API bleiben unverändert.
          6. "Kunde übernehmen" wird aus Sendung erstellen entfernt.
          7. "Adresse geprüft und bestätigt" wird aus Sendung erstellen entfernt.
          8. Bestehende automatische Kundensuche/-auswahl bleibt erhalten.

          Automatische Sicherheitsprüfungen:
          - RC883 Build als Ausgangsbasis erkannt.
          - RC843 Release-Hook vorhanden.
          - Navigation gibt RC843 Guard vor dem Renderwechsel frei.
          - rc843EnsureView respektiert aktive Navigation.
          - rc807ShipmentSearch Input-Handler vorhanden.
          - shipmentsearch Route vorhanden.
          - Interner Kunden-Avis-Renderer ist Cleanup/No-Op.
          - customer-avis.html ist weiterhin im Testservice-Paket vorhanden.
          - Adressbestätigungs-Button wird nicht mehr erzeugt.
          - Kunde-übernehmen-Button wird aus dem Workflow entfernt.
          - Produktionsdateien, APIs und öffentliche Customer-Avis-Datei unverändert.

          Verbindlicher Live-Test im Testservice:
          A. Eine Sendung über Sendungsübersicht -> Sendungsansicht öffnen.
             Danach nacheinander Aufgaben, Planung, Dashboard und Kunden öffnen.
             Erwartung: Jeder gewählte Bereich bleibt sichtbar. Kein Zurückspringen auf Sendungsansicht.

          B. Sendungsansicht/Suche öffnen und nach Referenz, Kunde und Kennzeichen suchen.
             Erwartung: Suchergebnisse reagieren auf Eingaben; Seite bleibt in der Suche.

          C. Sendung erstellen öffnen.
             Erwartung: Kein Button "Kunde übernehmen".
             Kunde über Suchfeld/Datalist auswählen.
             Erwartung: Kundendaten/Standort werden ohne separaten Bestätigungsbutton übernommen.

          D. Sendung erstellen.
             Erwartung: Kein Button "Adresse geprüft und bestätigt".

          E. Sendung erstellen UND schreibgeschützte Sendungsansicht.
             Erwartung: Kein interner Block "KUNDEN-AVIS / LIEFERAVIS".

          F. Separate customer-avis.html über einen gültigen Kunden-Avis-Link prüfen.
             Erwartung: Customer-Avis funktioniert dort weiterhin.

          G. Fehlerdiagnose aus dem TESTSERVICE exportieren.
             Erwartung: version = RC884.
             Wenn version = RC882/production erscheint, wurde weiterhin die Hauptseite getestet.
          EOF

      - name: Commit RC884 testservice
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html RC884_PRUEFBERICHT.txt
          git commit -m "RC884: fix navigation search and shipment UX"
          git push origin main
