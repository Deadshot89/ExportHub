name: RC1031 Diagnose Fix Apply
on:
  push:
    branches:
      - fix/rc1031-diagnostics-lieferavis-storage
    paths:
      - .github/rc1031/apply.cjs
      - .github/workflows/rc1031-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: RC1031 Diagnosefixes anwenden
        run: node .github/rc1031/apply.cjs
      - name: Syntax prüfen
        run: |
          node --check api/shared/public-access-store.js
          node --check api/customer-avis/index.js
          node --check assets/rc1027-lieferavis-immediate.js
      - name: RC1031 Zieltests
        run: node --test test/rc1031-diagnostics-lieferavis-storage.test.mjs
      - name: Gesamte Node-Regression
        run: npm test
      - name: Geprüfte Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/shared/public-access-store.js api/customer-avis/index.js assets/rc1027-lieferavis-immediate.js .github/rc1018/fix-mail-wording.mjs test/rc1027-lieferavis-release.test.mjs
          if git diff --cached --quiet; then
            echo "Keine Änderung erforderlich."
            exit 0
          fi
          git commit -m "RC1031: Lieferavis-Link und Public-Access-Speicher stabilisieren"
          git push origin HEAD:fix/rc1031-diagnostics-lieferavis-storage
