name: RC1112 Main Contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'demo.html'
      - 'production-version.js'
      - 'package.json'
      - 'package-lock.json'
      - 'staticwebapp.config.json'
      - 'staticwebapp.testservice.config.json'
      - 'api/**'
      - 'assets/**'
      - 'android-app/**'
      - 'scripts/**'
      - 'test/**'
      - '.github/rc1000/**'
      - '.github/rc1001/**'
      - '.github/rc1002/**'
      - '.github/rc1003/**'
      - '.github/rc1005/**'
      - '.github/rc1007/**'
      - '.github/rc1008/**'
      - '.github/rc1009/**'
      - '.github/rc1010/**'
      - '.github/rc1011/**'
      - '.github/rc1012/**'
      - '.github/rc1013/**'
      - '.github/rc1017/**'
      - '.github/rc1018/**'
      - '.github/rc1043/**'
      - '.github/rc1044/**'
      - '.github/rc1045/**'
      - '.github/rc1046/**'
      - '.github/rc1047/**'
      - '.github/rc1048/**'
      - '.github/rc1112/**'
      - '.github/rc995/**'
      - '.github/rc997/diagnostic-notifications-contract.test.mjs'
      - '.github/rc998/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: rc1048-main-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1088 Security Gate
        run: npm run test:security
      - name: RC1088 Accessibility & Responsive Gate
        run: npm run test:accessibility
      - name: RC1013 historische Release-Regression
        run: node --test --test-concurrency=1 test/rc1013-restpunkte.test.mjs test/rc1013-three-env-sync.test.mjs test/rc1012-abholkalender-completion.test.mjs test/rc1012-abholkalender-runtime-integration.test.mjs test/rc1012-three-env-sync.test.mjs test/rc1011-core-open-issues.test.mjs test/rc1011-project-isolation.test.mjs test/rc1011-three-env-sync.test.mjs test/rc1010-sop-release-readiness.test.mjs test/rc1010-three-env-sync.test.mjs test/rc1009-sop-selection-ui.test.mjs test/rc1008-system-sops.test.mjs test/rc1007-iso-sop-contract.test.mjs test/rc1007-sop-model.test.mjs test/rc1007-sop-catalog.test.mjs test/rc1007-sop-visuals.test.mjs test/rc1007-sop-ui.test.mjs test/rc1007-sop-workflow.test.mjs test/rc1007-sop-print-mobile.test.mjs test/rc1006-gate41-route.test.mjs test/rc1005-e3-packaging-dimensions.test.mjs test/rc1005-e3-packaging-precedence.test.mjs
      - name: QR- und Lieferavis-End-to-End-Regression
        shell: bash
        run: |
          node .github/rc1018/fix-mail-wording.mjs
          node --test test/rc1013-pickup-readonly-flow.test.mjs
          node --test --test-name-pattern='RC995 Pickup-PIN' .github/rc995/rc995-flow.test.cjs
          node --test --test-concurrency=1 .github/rc998/partial-pickup-avis-contract.test.mjs .github/rc1000/rc1000-production-pickup.test.mjs
      - name: Android-Regression
        run: node --test --test-concurrency=1 test/rc1003-android-native-direct-open.test.mjs test/rc1003-three-env-sync.test.mjs
      - name: Aufgaben-Verträge
        run: node --test --test-concurrency=1 test/rc1002-task-groups.test.mjs test/rc1001-task-tiles-cleanup.test.mjs
      - name: Diagnose- und Android-Regression
        shell: bash
        run: |
          node --test --test-name-pattern='Fehlerdiagnose besitzt|Website-App-Brücke|Tipp auf Diagnose-Benachrichtigung|veraltete MainActivity' .github/rc997/diagnostic-notifications-contract.test.mjs
      - name: RC1017 Mehr-LKW Releasevertrag
        run: node --test test/rc1017-three-env-release.test.mjs
      - name: RC1018 Mail- und Sprachbasis
        run: node --test --test-concurrency=1 test/rc1018-mail-language-standard.test.mjs test/rc1018-production-deploy.test.mjs
      - name: Lieferavis Pretest-Vertrag anwenden
        run: npm run pretest
      - name: Lieferavis Fix - einzelner reproduzierbarer Test
        run: node --test --test-name-pattern='RC1015 Lieferavis-Korrektur wird über den gemeinsamen Drei-Umgebungen-Build ausgerollt' test/rc1015-lieferavis-mail-flow.test.mjs
      - name: Lieferavis Fix - betroffene Testdatei
        run: node --test --test-concurrency=1 test/rc1015-lieferavis-mail-flow.test.mjs
      - name: Lieferavis Fix - betroffene Suite
        run: node --test --test-concurrency=1 test/rc1015-lieferavis-mail-flow.test.mjs test/rc1467-startup-avis-guard.test.mjs
      - name: API-Runtime-Abhaengigkeiten fuer Node-Regression
        run: npm install --prefix api --ignore-scripts --no-audit --no-fund
      - name: Gesamte Node-Regression
        run: npm test
      - name: Ersten Node-Regressionsfehler isolieren
        if: failure()
        shell: bash
        run: |
          set +e
          diag="${RUNNER_TEMP}/node-first-fail.txt"
          current="${RUNNER_TEMP}/node-current-test.log"
          : > "$diag"
          found=0
          for f in test/*.test.mjs tests/*.test.cjs; do
            printf '\n### %s\n' "$f" >> "$diag"
            node --test --test-concurrency=1 "$f" > "$current" 2>&1
            code=$?
            cat "$current" >> "$diag"
            printf '\nEXIT_CODE=%s\n' "$code" >> "$diag"
            if [ "$code" -ne 0 ]; then
              printf 'FIRST_FAIL=%s\n' "$f" | tee -a "$diag"
              found=$code
              break
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo 'NO_INDIVIDUAL_FAILURE=1' | tee -a "$diag"
          fi
          cat "$diag"
          exit "$found"
      - name: Node-Regressionsdiagnose sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-first-fail
          path: ${{ runner.temp }}/node-first-fail.txt
          if-no-files-found: error
          retention-days: 1
      - name: Historischen RC1013 Drei-Umgebungen-Build reproduzieren
        run: node .github/rc1013/build-three-env.mjs
      - name: RC1013 Baseline und RC1112 Produktionsmarker prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ExportHUB RC1013 environment=production-candidate' dist-rc1013/index.html
          grep -q 'ExportHUB RC1013 environment=testservice' dist-rc1013/TESTVERSION.html
          grep -q 'ExportHUB RC1013 environment=demo' dist-rc1013/demo.html
          grep -q "version:'RC1013'" dist-rc1013/index.html
          grep -q "version:'RC1013'" dist-rc1013/TESTVERSION.html
          grep -q "version:'RC1013'" dist-rc1013/demo.html
          grep -q 'assets/sop/rc1010-sop-release.js' dist-rc1013/index.html
          grep -q 'assets/abholkalender.js?v=1012' dist-rc1013/index.html
          grep -q 'assets/rc1012-abholkalender-runtime.js?v=1012' dist-rc1013/index.html
          grep -q 'assets/rc1013-diagnostics.js?v=1013' dist-rc1013/index.html
          grep -q 'assets/rc1013-gate41-ui.js?v=1013' dist-rc1013/index.html
          grep -q 'assets/rc1017-multi-truck.js?v=1017' dist-rc1013/index.html
          grep -q 'assets/rc1017-multi-truck.js?v=1017' dist-rc1013/TESTVERSION.html
          grep -q 'assets/rc1017-multi-truck.js?v=1017' dist-rc1013/demo.html
          test -s dist-rc1013/assets/rc1017-multi-truck.js
          grep -q "view:'pickupcalendar',label:'Abholkalender',right:'pickupcalendar'" dist-rc1013/index.html
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'" production-version.js
          git diff --check
