name: RC936 Testservice auslösen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc936-trigger-testservice.yml'

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bestehenden TESTSERVICE-Deploy für main starten
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload='{"ref":"main"}'
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/exporthub-testservice-final-artifact-fix.yml/dispatches" \
            -d "$payload")"
          cat /tmp/dispatch.out || true
          if [[ "$code" != "204" ]]; then
            echo "Workflow-Dispatch fehlgeschlagen: HTTP $code"
            exit 1
          fi
          echo "TESTSERVICE-Deploy für main wurde ausgelöst."
