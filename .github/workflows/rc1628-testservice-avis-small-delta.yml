name: RC1628 TESTSERVICE AVIS Small Delta

on:
  pull_request:
    paths:
      - 'e2e/specs/testservice-mutation.spec.mjs'
      - 'test/rc1628-testservice-avis-small-delta.test.mjs'
      - '.github/workflows/rc1628-testservice-avis-small-delta.yml'
  push:
    branches: [main]
    paths:
      - 'e2e/specs/testservice-mutation.spec.mjs'
      - 'test/rc1628-testservice-avis-small-delta.test.mjs'
      - '.github/workflows/rc1628-testservice-avis-small-delta.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Check live test script syntax
        run: node --check e2e/specs/testservice-mutation.spec.mjs
      - name: Check non-destructive small-delta merge and 30-MB request limit
        run: node --test test/rc1628-testservice-avis-small-delta.test.mjs
