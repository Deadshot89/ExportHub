name: RC943 Sendung erstellen Felder entfernen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc943-remove-shipment-fields.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rc943-remove-shipment-fields
  cancel-in-progress: false

jobs:
  patch_verify_deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RC942 Vorbedingungen prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'" in text
          def blocks(label,handler):
              found=[]; pos=0
              while True:
                  i=text.find(label,pos)
                  if i<0: break
                  a=text.rfind('<label',max(0,i-900),i+1); b=text.find('</label>',i)
                  if a>=0 and b>=0 and handler in text[a:b+8]: found.append((a,b+8))
                  pos=i+1
              return list(dict.fromkeys(found))
          assert len(blocks('Geplantes Abholdatum','setShipmentPickupDate(this.value)'))==1
          assert len(blocks('Spedition','state.shipment.carrier=this.value'))==1
          assert 'function setShipmentPickupDate(v)' in text
          assert 'function updateSavedShipmentPickupDate(id,v)' in text
          assert 'function createOrUpdateShipmentCreatedTask(s,c)' in text
          print('RC942 Vorbedingungen OK.')
          PY

      - name: RC943 – nur die zwei Eingabefelder entfernen
        shell: bash
        run: |
          cp TESTVERSION.html /tmp/TESTVERSION.before.html
          python3 <<'PY'
          from pathlib import Path
          p=Path('TESTVERSION.html'); text=p.read_text(encoding='utf-8')
          old="version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'"
          new="version:'RC943',cache:'943',loginReturn:'/TESTVERSION.html?v=943'"
          assert text.count(old)==1
          text=text.replace(old,new,1)
          marker="changes:Object.freeze([\n"
          note="    'RC943 entfernt in Sendung erstellen die sichtbaren Eingabefelder Geplantes Abholdatum und Spedition. Die vorhandenen Abhol-, Aufgaben-, QR-, Speditions- und Dokumentdatenpfade bleiben unverändert erhalten.',\n"
          assert text.count(marker)==1
          text=text.replace(marker,marker+note,1)
          def remove(source,label,handler):
              found=[]; pos=0
              while True:
                  i=source.find(label,pos)
                  if i<0: break
                  a=source.rfind('<label',max(0,i-900),i+1); b=source.find('</label>',i)
                  if a>=0 and b>=0 and handler in source[a:b+8]: found.append((a,b+8))
                  pos=i+1
              found=list(dict.fromkeys(found)); assert len(found)==1, (label,len(found))
              a,b=found[0]
              return source[:a]+source[b:]
          text=remove(text,'Geplantes Abholdatum','setShipmentPickupDate(this.value)')
          text=remove(text,'Spedition','state.shipment.carrier=this.value')
          p.write_text(text,encoding='utf-8')
          PY

      - name: RC943 exakt verifizieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          before=Path('/tmp/TESTVERSION.before.html').read_text(encoding='utf-8')
          after=Path('TESTVERSION.html').read_text(encoding='utf-8')
          old="version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'"
          new="version:'RC943',cache:'943',loginReturn:'/TESTVERSION.html?v=943'"
          marker="changes:Object.freeze([\n"
          note="    'RC943 entfernt in Sendung erstellen die sichtbaren Eingabefelder Geplantes Abholdatum und Spedition. Die vorhandenen Abhol-, Aufgaben-, QR-, Speditions- und Dokumentdatenpfade bleiben unverändert erhalten.',\n"
          expected=before.replace(old,new,1).replace(marker,marker+note,1)
          def remove(source,label,handler):
              found=[]; pos=0
              while True:
                  i=source.find(label,pos)
                  if i<0: break
                  a=source.rfind('<label',max(0,i-900),i+1); b=source.find('</label>',i)
                  if a>=0 and b>=0 and handler in source[a:b+8]: found.append((a,b+8))
                  pos=i+1
              found=list(dict.fromkeys(found)); assert len(found)==1
              a,b=found[0]; return source[:a]+source[b:]
          expected=remove(expected,'Geplantes Abholdatum','setShipmentPickupDate(this.value)')
          expected=remove(expected,'Spedition','state.shipment.carrier=this.value')
          assert after==expected, 'Änderungen außerhalb des freigegebenen RC943-Deltas gefunden.'
          assert new in after and old not in after
          assert 'setShipmentPickupDate(this.value)' not in after
          assert 'state.shipment.carrier=this.value' not in after
          assert 'function setShipmentPickupDate(v)' in after
          assert 'function updateSavedShipmentPickupDate(id,v)' in after
          assert 'function createOrUpdateShipmentCreatedTask(s,c)' in after
          print('GREEN: exakt RC943 – nur beide sichtbaren Felder entfernt.')
          PY
          git diff --check
          git diff --stat

      - name: RC943 nach main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          git diff --cached --check
          git commit -m "RC943 Sendung erstellen Felder entfernen"
          git push origin HEAD:main

      - name: Temporären RC943-Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm .github/workflows/rc943-remove-shipment-fields.yml
          git commit -m "RC943 temporären Patch-Workflow entfernen"
          git push origin HEAD:main

      - name: TESTSERVICE-Deploy für RC943 auslösen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/exporthub-testservice-final-artifact-fix.yml/dispatches" \
            -d '{"ref":"main"}')"
          cat /tmp/out || true
          [[ "$code" == "204" ]] || { echo "Deploy-Dispatch fehlgeschlagen: HTTP $code"; exit 1; }
          echo "TESTSERVICE-Deploy RC943 ausgelöst."
