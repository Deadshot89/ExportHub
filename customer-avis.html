<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ExportHUB · Kunden-Avis</title>
<style>
*{box-sizing:border-box}:root{--bg:#f3f6fa;--surface:#fff;--surface2:#f8fafc;--line:#d8e2ec;--line2:#c5d2df;--text:#172b3a;--title:#0c2438;--muted:#647789;--primary:#0f6cbd;--primary2:#2385cf;--primarySoft:#eaf3fb;--ok:#167a58;--okSoft:#e8f7f1;--bad:#c13e3e;--badSoft:#fff0f0;--warn:#9a620e;--warnSoft:#fff5e2;--font:"Segoe UI Variable Text","Aptos","Segoe UI",system-ui,-apple-system,sans-serif}html,body{margin:0;min-height:100%;background:linear-gradient(145deg,#f5f7fa,#eaf0f6);font-family:var(--font);color:var(--text)}body{padding:22px}.portal{width:calc(100vw - 44px);max-width:1160px;min-width:0;margin:1.5vh auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.brand{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:17px 19px;box-shadow:0 14px 34px rgba(18,42,64,.08)}.logo{width:52px;height:52px;border-radius:13px;background:linear-gradient(145deg,var(--primary2),var(--primary));color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 8px 18px rgba(15,108,189,.2)}.brand h1{margin:0;color:var(--title);font-size:25px;letter-spacing:-.025em}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px;font-weight:600}.status{border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:11px;padding:10px 12px;background:var(--primarySoft);font-size:12px;font-weight:700}.status.ok{border-left-color:var(--ok);background:var(--okSoft);color:var(--ok)}.status.bad{border-left-color:var(--bad);background:var(--badSoft);color:var(--bad)}.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 7px 20px rgba(18,42,64,.055)}.card h2{margin:0 0 12px;color:var(--title);font-size:19px;letter-spacing:-.015em}.summary{min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.summary>div,.totals>div{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:0 4px 12px rgba(18,42,64,.04)}.summary>div:before,.totals>div:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}.summary span,.totals span,.grid span{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}.summary b,.totals b{font-size:17px;color:var(--title);overflow-wrap:anywhere}.grid{min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid>div{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--surface2)}.grid p{margin:5px 0 0;color:#4f6576;white-space:pre-line;font-size:12px}.totals{min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.table-wrap{width:100%;max-width:100%;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}.table-wrap table{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}.table-wrap th,.table-wrap td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:12px}.table-wrap th{background:#edf3f8;color:#465c6e;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.table-wrap tr:last-child td{border-bottom:0}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.docs{display:grid;gap:7px;margin-top:11px}.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:10px 11px;color:var(--text);transition:border-color .13s ease,background .13s ease}.doc:hover{border-color:#9ec5e5;background:var(--primarySoft)}.doc span{min-width:0}.doc b{display:block;overflow-wrap:anywhere}.doc small{display:block;color:var(--muted);margin-top:2px}.doc strong{white-space:nowrap;color:var(--primary);font-size:11px}.empty{border:1px dashed var(--line2);border-radius:11px;padding:12px;color:var(--muted);background:var(--surface2);font-size:12px}.picked{margin-top:12px;border:1px solid #9ed8c2;background:var(--okSoft);color:var(--ok);border-radius:11px;padding:11px;font-weight:700}.pod{display:grid;gap:3px;border-radius:11px;padding:11px}.pod.ok{border:1px solid #9ed8c2;background:var(--okSoft);color:var(--ok)}.pod.pending{border:1px solid #efd49a;background:var(--warnSoft);color:var(--warn)}.pod span{font-size:12px}button{min-height:40px;border:1px solid #0b5fa7;border-radius:10px;background:linear-gradient(180deg,var(--primary2),var(--primary));color:#fff;padding:8px 13px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 10px rgba(15,108,189,.16)}button:disabled{opacity:.55;cursor:wait;box-shadow:none}form{display:grid;gap:10px;margin-top:13px}label{display:grid;gap:5px;font-size:11px;font-weight:700;color:#344b5d}input,textarea{width:100%;min-height:40px;border:1px solid var(--line2);border-radius:10px;padding:9px 10px;background:#fff;font:inherit;font-size:13px;color:var(--text);outline:0}input:focus,textarea:focus{border-color:#4d9bd2;box-shadow:0 0 0 3px rgba(77,155,210,.16)}textarea{min-height:90px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.access{width:min(620px,100%);margin:3vh auto}.access h2{margin:0 0 7px;color:var(--title)}.access p{color:var(--muted);line-height:1.5;font-size:13px}.security{display:grid;gap:7px;margin:12px 0;padding:11px;border-radius:11px;border:1px solid #bdd7ed;background:var(--primarySoft);color:#234f76;font-size:11px;font-weight:650}.expires{font-size:11px;color:var(--muted);font-weight:650;padding:0 3px}@media(max-width:760px){body{padding:8px}.portal{width:calc(100vw - 16px);max-width:calc(100vw - 16px)}.summary,.grid,.totals,.form-grid{grid-template-columns:1fr}.section-head{display:grid}.portal{margin:0}.brand{border-radius:14px;padding:13px}.brand h1{font-size:22px}.card{padding:13px;border-radius:13px}.doc{align-items:flex-start}.doc strong{white-space:normal;text-align:right}}
</style>
</head>
<body>
<main class="portal">
  <div class="brand"><div class="logo">EH</div><div><h1>Kunden-Avis</h1><p>Essentra · sicheres Abholavis &amp; Sendungsportal</p></div></div>
  <div id="status" class="status info">Sicherer Zugang wird vorbereitet …</div>
  <div id="content"></div>
</main>
<script>
(function(){
'use strict';
var token='',session='',sessionExpiresAt='',dataEnvironment=/-testservice\./i.test(String(location.hostname||''))?'testservice':'production';
try{var u=new URL(location.href);token=String(u.searchParams.get('token')||u.searchParams.get('avis')||'').trim()}catch(_){token=''}
function q(v){return String(v==null?'':v).trim()}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmtDate(v){if(!v)return'–';try{var d=/^\d{4}-\d{2}-\d{2}$/.test(v)?new Date(v+'T12:00:00'):new Date(v);if(!isFinite(d))return q(v);return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})+(String(v).indexOf('T')>=0?' · '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'')}catch(_){return q(v)}}
function fmtNum(v,d){var n=Number(v||0);return Number.isFinite(n)?n.toLocaleString('de-DE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}):'0'}
function setStatus(text,kind){var n=document.getElementById('status');n.className='status '+(kind||'info');n.textContent=text}
function api(path,opt){opt=opt||{};var ctl=new AbortController(),timer=setTimeout(function(){ctl.abort()},20000),headers=Object.assign({Accept:'application/json','Cache-Control':'no-cache','X-ExportHUB-Environment':dataEnvironment},opt.headers||{});if(session)headers['X-ExportHUB-Avis-Session']=session;return fetch('/api/customer-avis'+path,Object.assign({},opt,{cache:'no-store',credentials:'omit',headers:headers,signal:ctl.signal})).then(async function(r){clearTimeout(timer);var ct=String(r.headers.get('content-type')||'').toLowerCase(),data=ct.indexOf('application/json')>=0?await r.json().catch(function(){return{}}):{};if(!r.ok){var e=new Error(q(data.message)||('HTTP '+r.status));e.code=data.code;e.status=r.status;throw e}return data}).catch(function(e){clearTimeout(timer);if(e&&e.name==='AbortError'){var x=new Error('Der Kunden-Avis-Service antwortet momentan nicht.');x.code='TIMEOUT';throw x}throw e})}
function showGate(message){session='';sessionExpiresAt='';setStatus(message||'Bitte die Sendungsreferenz bestätigen.','info');var host=document.getElementById('content');host.innerHTML='<section class="card access"><h2>Zugriff bestätigen</h2><p>Über dieses sichere Portal können Sie jederzeit die aktuellen Sendungsdaten und Lieferscheine und den POD einsehen sowie Ihren geplanten Abholtermin mitteilen. Bitte bestätigen Sie zuerst die Sendungsreferenz.</p><div class="security"><span>✓ Sicherer persönlicher Avis-Link</span><span>✓ Automatisches Ende 3 Arbeitstage nach Abholung</span><span>✓ Keine ExportHUB-Anmeldung erforderlich</span></div><form id="accessForm"><label>Referenznummer<input name="reference" autocomplete="off" maxlength="40" required></label><button type="submit">Sendungsdaten öffnen</button></form></section>';document.getElementById('accessForm').addEventListener('submit',authorize)}
function authorize(e){e.preventDefault();var f=e.currentTarget,b=f.querySelector('button'),fd=new FormData(f),payload={action:'authorize',token:token,reference:q(fd.get('reference')),environment:dataEnvironment};b.disabled=true;b.textContent='Wird geprüft …';setStatus('Referenz wird geprüft …','info');api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(data){session=q(data.session);sessionExpiresAt=q(data.sessionExpiresAt);if(!session)throw new Error('Sichere Sitzung konnte nicht erstellt werden.');render(data)}).catch(function(err){b.disabled=false;b.textContent='Sendungsdaten öffnen';setStatus(q(err.message)||'Zugriff konnte nicht bestätigt werden.','bad')})}
function rowsHtml(rows){if(!rows||!rows.length)return'<div class="empty">Keine Colli-Positionen hinterlegt.</div>';return'<div class="table-wrap"><table><thead><tr><th>Pos.</th><th>Verpackung</th><th>Anzahl</th><th>Gewicht</th><th>LDM je Colli</th><th>L × B × H</th></tr></thead><tbody>'+rows.map(function(r){return'<tr><td>'+esc(r.position)+'</td><td><b>'+esc(r.type||'–')+'</b></td><td>'+esc(r.count)+'</td><td>'+fmtNum(r.weight,2)+' kg</td><td>'+fmtNum(r.ldm,2)+'</td><td>'+fmtNum(r.length,0)+' × '+fmtNum(r.width,0)+' × '+fmtNum(r.height,0)+' cm</td></tr>'}).join('')+'</tbody></table></div>'}
function fileSize(v){var n=Number(v||0);if(!(n>0))return'';if(n>=1048576)return(n/1048576).toLocaleString('de-DE',{maximumFractionDigits:1})+' MB';if(n>=1024)return Math.round(n/1024).toLocaleString('de-DE')+' KB';return Math.round(n).toLocaleString('de-DE')+' B'}
function docHtml(d){d=d||{};var url=q(d.downloadUrl),meta=[q(d.category),fileSize(d.size)].filter(Boolean).join(' · '),isPod=q(d.category).toUpperCase()==='POD';if(!url)return'<div class="doc"><span><b>'+esc(d.name||'Dokument')+'</b><small>'+esc(meta||'Dokument')+'</small></span><strong>Nicht verfügbar</strong></div>';return'<a class="doc" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer"><span><b>'+esc(d.name||'Dokument')+'</b><small>'+esc(meta||'Dokument')+'</small></span><strong>'+(isPod?'POD herunterladen':'Öffnen / herunterladen')+'</strong></a>'}
function appointmentText(a){if(!a||!a.date)return'Noch keine Abholzeit gemeldet.';var time=[q(a.timeFrom),q(a.timeTo)].filter(Boolean).join(' – '),parts=[fmtDate(a.date)+(time?' · '+time+' Uhr':'')];if(q(a.shipmentNumber))parts.push('Sendungsnr. '+q(a.shipmentNumber));if(q(a.plate))parts.push('Kennzeichen '+q(a.plate));if(a.submittedAt)parts.push('gemeldet '+fmtDate(a.submittedAt));return parts.join(' · ')}
function render(data){if(data.session)session=q(data.session);if(data.sessionExpiresAt)sessionExpiresAt=q(data.sessionExpiresAt);setStatus('Aktueller Status: '+q(data.status||'–')+' · automatisch aktualisiert','ok');var host=document.getElementById('content'),docs=data.documents||[],deliveryDocs=docs.filter(function(d){return q(d.category).toLowerCase()==='lieferschein'}),podDocs=data.pod&&data.pod.documents||[],actual=q(data.actualPickupAt),a=data.appointment||{},expiry=q(data.avis&&data.avis.autoExpiresOn),expiryInfo=expiry?('Automatische Deaktivierung: '+fmtDate(expiry)+' · Wochenende wird nicht mitgerechnet'):('Automatische Deaktivierung 3 Arbeitstage nach tatsächlicher Abholung · Wochenende wird nicht mitgerechnet');host.innerHTML='<section class="summary"><div><span>Referenz</span><b>'+esc(data.reference||'–')+'</b></div><div><span>Status</span><b>'+esc(data.status||'–')+'</b></div><div><span>Empfänger</span><b>'+esc(data.customerName||data.recipientName||'–')+'</b></div><div><span>Zielland</span><b>'+esc(data.country||'–')+'</b></div></section><div class="expires">'+esc(expiryInfo)+' · automatische Aktualisierung alle 15 Sekunden · Datenstand '+esc(fmtDate(data.lastUpdatedAt||new Date().toISOString()))+'</div>'+ '<section class="card"><h2>Sendung</h2><div class="grid"><div><span>Absender</span><b>'+esc(data.sender&&data.sender.name||'–')+'</b><p>'+esc(data.sender&&data.sender.address||'–')+'</p></div><div><span>Empfänger / Lieferadresse</span><b>'+esc(data.recipientName||data.customerName||'–')+'</b><p>'+esc(data.recipientAddress||'–')+'</p></div><div><span>Kundendaten</span><b>'+esc(data.customerName||'–')+'</b><p>'+esc([data.customerNumber?('Kundennr. '+data.customerNumber):'',data.customerReference?('Kundenreferenz '+data.customerReference):'',data.salesOrder?('Sales Order '+data.salesOrder):''].filter(Boolean).join(' · ')||'–')+'</p></div><div><span>Versanddaten</span><b>'+esc(data.carrier||'–')+'</b><p>'+esc([data.shipDate?('Versanddatum '+fmtDate(data.shipDate)):'',data.incoterm?('Incoterm '+data.incoterm):'',data.goodsDescription||''].filter(Boolean).join(' · ')||'–')+'</p></div></div><div class="totals"><div><span>Collis</span><b>'+fmtNum(data.totals&&data.totals.count,0)+'</b></div><div><span>Gesamtgewicht</span><b>'+fmtNum(data.totals&&data.totals.weight,2)+' kg</b></div><div><span>Lademeter</span><b>'+fmtNum(data.totals&&data.totals.ldm,2)+'</b></div></div>'+rowsHtml(data.rows)+'</section>'+ '<section class="card"><div class="section-head"><div><h2>Lieferscheine</h2><p>Die zu dieser Sendung freigegebenen Lieferscheine können Sie hier direkt öffnen oder herunterladen.</p></div></div><div class="docs">'+(deliveryDocs.length?deliveryDocs.map(docHtml).join(''):'<div class="empty">Aktuell ist noch kein Lieferschein zum Download verfügbar.</div>')+'</div></section>'+ '<section class="card"><h2>Abholung</h2><div class="grid"><div><span>Gemeldeter Abholtermin</span><b>'+esc(appointmentText(a))+'</b></div><div><span>Tatsächlich abgeholt</span><b>'+(actual?esc(fmtDate(actual)):'Noch nicht abgeholt')+'</b></div></div>'+(actual?'<div class="picked">✓ Die Sendung wurde am '+esc(fmtDate(actual))+' abgeholt.</div>':'<form id="avisForm"><h3>Abholtermin mitteilen</h3><div class="form-grid"><label>Abholdatum<input name="pickupDate" type="date" required value="'+esc(a.date||'')+'"></label><label>Zeit von<input name="timeFrom" type="time" value="'+esc(a.timeFrom||'')+'"></label><label>Zeit bis<input name="timeTo" type="time" value="'+esc(a.timeTo||'')+'"></label></div><div class="form-grid"><label>Kennzeichen (optional)<input name="plate" maxlength="40" autocomplete="off" value="'+esc(a.plate||'')+'"></label><label>Sendungsnummer<input name="shipmentNumber" maxlength="120" autocomplete="off" required value="'+esc(a.shipmentNumber||'')+'"></label></div><label>Hinweis (optional)<textarea name="note" maxlength="1000">'+esc(a.note||'')+'</textarea></label><button type="submit">Abholtermin verbindlich übermitteln</button></form>')+'</section>'+ '<section class="card"><h2>POD / Abliefernachweis</h2><div class="pod '+(data.pod&&data.pod.available?'ok':'pending')+'"><b>'+esc(data.pod&&data.pod.status||'Noch nicht vorhanden')+'</b><span>'+(data.pod&&data.pod.available?'Der POD ist der Sendung zugeordnet und kann unten heruntergeladen werden.':'Der POD wird nach der tatsächlichen Abholung hier verfügbar.')+'</span></div>'+(podDocs.length?'<div class="docs">'+podDocs.map(docHtml).join('')+'</div>':(data.pod&&data.pod.available?'<div class="empty">POD vorhanden, aber noch keine auslieferbare POD-Datei gespeichert.</div>':''))+'</section>';var f=document.getElementById('avisForm');if(f)f.addEventListener('submit',submit)}
function submit(e){e.preventDefault();var f=e.currentTarget,b=f.querySelector('button'),fd=new FormData(f),payload={action:'appointment',pickupDate:q(fd.get('pickupDate')),timeFrom:q(fd.get('timeFrom')),timeTo:q(fd.get('timeTo')),plate:q(fd.get('plate')),shipmentNumber:q(fd.get('shipmentNumber')),note:q(fd.get('note')),environment:dataEnvironment};b.disabled=true;b.textContent='Wird gespeichert …';api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(render).catch(function(err){if(err&&err.status===401)return showGate('Die sichere Sitzung ist abgelaufen. Bitte erneut bestätigen.');b.disabled=false;b.textContent='Abholtermin verbindlich übermitteln';setStatus(q(err.message)||'Abholtermin konnte nicht gespeichert werden.','bad')})}
function refresh(){if(!session)return;api('?_='+Date.now()).then(render).catch(function(err){if(err&&err.status===401)return showGate('Die sichere Sitzung ist abgelaufen. Bitte erneut bestätigen.');if(err&&err.status===410){setStatus(q(err.message)||'Dieser Avis-Link ist nicht mehr gültig.','bad');document.getElementById('content').innerHTML='<section class="card">Bitte wenden Sie sich an Ihren Ansprechpartner bei Essentra.</section>'}})}
function boot(){if(!token||!/^[A-Za-z0-9_-]{32,160}$/.test(token)){setStatus('Dieser Kunden-Avis-Link ist ungültig.','bad');document.getElementById('content').innerHTML='<section class="card">Bitte wenden Sie sich an Ihren Ansprechpartner bei Essentra.</section>';return}showGate();setInterval(function(){if(!document.hidden&&session)refresh()},15000);window.addEventListener('focus',function(){if(session)refresh()});document.addEventListener('visibilitychange',function(){if(!document.hidden&&session)refresh()})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
</body>
</html>
