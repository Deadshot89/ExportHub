name: RC885 Clean Workspace TESTSERVICE v3

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: exporthub-rc885-clean-workspace-v3
  cancel-in-progress: false

jobs:
  patch-testservice:
    name: RC885 clean workspace v3
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout RC884 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard clean RC884 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html
          grep -Fq "version:'RC884',cache:'884',loginReturn:'/TESTVERSION.html?v=884'" TESTVERSION.html

          if grep -Fq "exporthub-rc885-clean-workspace" TESTVERSION.html; then
            echo "::error::RC885 Workspace ist bereits vorhanden."
            exit 1
          fi

          if grep -Eq "version:'RC(885|886|887|888|889|890|891|892)'" TESTVERSION.html; then
            echo "::error::TESTVERSION ist nicht mehr die erwartete RC884-Basis."
            exit 1
          fi

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC884 backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-clean-rc884-before-rc885-${GITHUB_RUN_ID}"
          git tag -a "${TAG}" -m "Clean RC884 before RC885 workspace"
          git push origin "refs/tags/${TAG}"

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          p = Path("TESTVERSION.html")
          src = p.read_text(encoding="utf-8")

          old_build = "var BUILD=Object.freeze({version:'RC884',cache:'884',loginReturn:'/TESTVERSION.html?v=884'});"
          new_build = "var BUILD=Object.freeze({version:'RC885',cache:'885',loginReturn:'/TESTVERSION.html?v=885'});"

          if src.count(old_build) != 1:
              raise SystemExit("RC884 BUILD nicht eindeutig gefunden.")
          src = src.replace(old_build, new_build, 1)

          old_release = (
              " version:'RC884',\n"
              " date:'30.08.2026',\n"
              " title:'Navigation, Suche und Sendung erstellen bereinigt',"
          )
          new_release = (
              " version:'RC885',\n"
              " date:'30.08.2026',\n"
              " title:'Persönlicher Arbeitsplatz und Warncenter neu aufgebaut',"
          )
          if old_release in src:
              src = src.replace(old_release, new_release, 1)

