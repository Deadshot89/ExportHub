name: Training Center Native Patch Apply

on:
  push:
    branches:
      - design/sop-training-center-rebuild-2026-10-15
    paths:
      - 'docs/superpowers/native-patches/*.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply reviewed training-center patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(docs/superpowers/native-patches/*.patch)
          if [ ${#patches[@]} -ne 1 ]; then
            echo "Expected exactly one pending patch, found ${#patches[@]}" >&2
            exit 1
          fi
          git apply --check "${patches[0]}"
          git apply "${patches[0]}"
          rm "${patches[0]}"
          git config user.name 'exporthub-training-center-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(training-center): integrate isolated center merge'
          git push origin HEAD:"${GITHUB_REF_NAME}"
