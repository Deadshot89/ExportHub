<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExportHUB</title>
<style>html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eaf4fb;color:#0b2b5e}body{min-height:100vh;display:grid;place-items:center}.box{width:min(620px,calc(100% - 36px));background:#fff;border:1px solid #d9e6f1;border-radius:28px;box-shadow:0 24px 70px rgba(15,44,80,.16);padding:34px;text-align:center}.mark{width:68px;height:68px;border-radius:22px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#fff;font-weight:1000;font-size:25px}.bar{height:12px;border-radius:999px;background:#e7eef5;overflow:hidden;margin:24px 0 10px}.fill{height:100%;width:10%;background:linear-gradient(90deg,#2563eb,#13b9ea);transition:width .2s}.err{display:none;margin-top:16px;background:#fee2e2;color:#991b1b;border-radius:12px;padding:12px;white-space:pre-wrap}.retry{display:none;margin:15px auto 0;border:0;background:#2563eb;color:#fff;font-weight:900;border-radius:12px;padding:10px 18px;cursor:pointer}</style></head>
<body><div class="box"><div class="mark">EH</div><h1>ExportHUB wird geladen</h1><p id="msg">Freigegebene Produktionsversion wird ermittelt …</p><div class="bar"><div id="fill" class="fill"></div></div><strong id="pct">10 %</strong><div id="err" class="err"></div><button id="retry" class="retry" onclick="location.reload()">Erneut versuchen</button></div>
<script>(function(){'use strict';var API='/api/exporthub-release',written=false;
try{var u=new URL(location.href);if(u.searchParams.get('portal')==='test'||/^\/test(?:\/|$)/i.test(u.pathname)){location.replace('/test/?_='+Date.now());return}}catch(_){}
function progress(n,t){document.getElementById('fill').style.width=n+'%';document.getElementById('pct').textContent=n+' %';if(t)document.getElementById('msg').textContent=t}
function fail(t){progress(100,'Produktionsversion konnte nicht geladen werden');var e=document.getElementById('err');e.style.display='block';e.textContent=t||'Release-API nicht erreichbar.';document.getElementById('retry').style.display='block'}
function sanitizeDocument(h,v){
 h=String(h||'');
 if(!/<html[\s>]/i.test(h)||h.indexOf('exporthub-canonical-build-source')<0)throw new Error('Ungültige Produktionsdatei.');
 var doc=new DOMParser().parseFromString(h,'text/html');
 if(!doc||!doc.documentElement||!doc.head||!doc.body)throw new Error('Produktionsdatei konnte nicht geparst werden.');
 ['rc504-static-test-channel','rc503-release-bootstrap','rc503-release-portal-controller','exporthub-test-shell-bridge'].forEach(function(id){var el=doc.getElementById(id);if(el)el.remove()});
 ['rc503-release-portal-style','exporthub-test-shell-style'].forEach(function(id){var el=doc.getElementById(id);if(el)el.remove()});
 var nav=doc.getElementById('index321-single-navigation-controller');
 if(nav&&nav.textContent){nav.textContent=nav.textContent.replace(/\s*\{view:'releasecenter',label:'Release-Center',right:'releasecenter'\},?/g,'')}
 var marker=doc.createElement('script');marker.id='exporthub-external-release-marker';marker.textContent='window.__EXPORTHUB_RELEASE_STREAMED__=true;window.__EXPORTHUB_RELEASE_CHANNEL__="production";window.__EXPORTHUB_RELEASE_VERSION__='+JSON.stringify(v)+';window.__EXPORTHUB_EXTERNAL_RELEASE_LOADER__=true;';doc.head.insertBefore(marker,doc.head.firstChild);
 var bridge=doc.createElement('script');bridge.id='exporthub-production-shell-bridge';bridge.textContent='(function(){"use strict";function bind(){var b=document.getElementById("releaseTestPortalBtn");if(!b)return;b.onclick=function(e){if(e){e.preventDefault();e.stopPropagation()}location.href="/test/?_="+Date.now();return false};b.textContent="Testportal – Admin"}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",bind,{once:true});else bind();window.addEventListener("exporthub:ready",bind)})();';doc.body.appendChild(bridge);
 return '<!DOCTYPE html>\n'+doc.documentElement.outerHTML;
}
function inject(h,v){if(written)return;var safe=sanitizeDocument(h,v);written=true;progress(100,'Produktion '+v+' wird gestartet …');setTimeout(function(){document.open('text/html','replace');document.write(safe);document.close()},10)}
async function get(url,accept){var r=await fetch(url,{credentials:'same-origin',cache:'no-store',headers:{Accept:accept||'application/json'}}),t=await r.text();if(!r.ok)throw new Error(t||('HTTP '+r.status));return t}
(async function(){try{progress(32,'Produktionsstatus wird geprüft …');var m=JSON.parse(await get(API+'?action=active&channel=production&_='+Date.now())),v=String(m.version||'').trim().toUpperCase();if(!/^RC\d+$/.test(v))throw new Error('Im Release-Center ist keine Produktionsversion freigegeben.');progress(58,'Produktion '+v+' wird geladen …');var h=await get(API+'?action=html&channel=production&_='+Date.now(),'text/html');progress(86,'Oberfläche wird vorbereitet …');inject(h,v)}catch(e){fail(e&&e.message||String(e))}})();})();</script></body></html>
