name: RC1014 Development

on:
  push:
    branches: [rc1014-tasks-final]
    paths:
      - 'assets/rc1014-**'
      - 'api/shared/fixed-pickup-store.js'
      - 'api/shared/rc1014-fixed-pickup-seed.js'
      - 'test/rc1014-**'
      - 'browser/rc1014-**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'android-app/**'
      - '.github/rc1014/**'
      - '.github/workflows/rc1014-development.yml'

permissions:
  contents: read

concurrency:
  group: rc1014-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: RC1014 Lifecycle-Vertrag
        run: node --test test/rc1014-task-lifecycle.test.mjs
      - name: RC1014 Runtime-Integration
        run: node --test test/rc1014-task-runtime-integration.test.mjs
      - name: RC1014 Aufgaben-Design und Direktöffnung
        run: node --test test/rc1014-task-design.test.mjs
      - name: RC1014 Android Aufgaben-Erinnerungen
        run: node --test test/rc1014-task-android.test.mjs
      - name: RC1014 Sendungsübersicht Erfassungsdatum und Colli
        run: node --test test/rc1014-shipment-overview-meta.test.mjs
      - name: RC1014 fixe Essentra-Abholtage
        run: node --test test/rc1014-fixed-pickup-seed.test.mjs
      - name: RC1014 Release-Synchronisierung
        run: node --test test/rc1014-release-sync.test.mjs
      - name: QR- und Lieferavis-End-to-End-Regression
        shell: bash
        run: |
          node --test --test-name-pattern='RC995 Pickup-Bedienfluss|RC995 Pickup-PIN' .github/rc995/rc995-flow.test.cjs
          node --test .github/rc998/partial-pickup-avis-contract.test.mjs .github/rc1000/rc1000-production-pickup.test.mjs
      - name: Vollständige Node-Regression
        run: npm test
      - name: Finaler Drei-Umgebungen-Build und Diff-Prüfung
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1014/build-three-env.mjs
          grep -q 'ExportHUB RC1014 environment=production-candidate' dist-rc1014/index.html
          grep -q 'ExportHUB RC1014 environment=testservice' dist-rc1014/TESTVERSION.html
          grep -q 'ExportHUB RC1014 environment=demo' dist-rc1014/demo.html
          grep -q 'assets/rc1014-task-runtime.js?v=1014' dist-rc1014/index.html
          grep -q 'assets/rc1014-shipment-overview.js?v=1014' dist-rc1014/index.html
          git diff --check

  browser-design:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: RC1014 Drei-Umgebungen-Build
        run: node .github/rc1014/build-three-env.mjs
      - name: Chromium installieren
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Demo-Server starten und echten Browser-Test ausführen
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist-rc1014 >/tmp/rc1014-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/demo.html >/dev/null; then break; fi
            sleep 1
          done
          node browser/rc1014-visual-functional.mjs
      - name: Browser-Screenshots und Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC1014-Browser-Design-Test
          path: artifacts/rc1014-browser
          if-no-files-found: warn
          retention-days: 30
