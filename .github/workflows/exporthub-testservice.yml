name: ExportHUB TESTSERVICE Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'TESTVERSION.html'
      - 'staticwebapp.testservice.config.json'
      - '.github/workflows/exporthub-testservice.yml'
      - 'api/**'

permissions:
  contents: read

concurrency:
  group: exporthub-testservice-deploy
  cancel-in-progress: false

jobs:
  deploy_testservice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy TESTSERVICE preview environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Detect and validate TESTSERVICE version
        id: meta
        shell: bash
        run: |
          set -u
          failed=0

          require_file() {
            if [[ -f "$1" ]]; then
              echo "OK: $1"
            else
              echo "FEHLT: $1"
              failed=1
            fi
          }

          require_dir() {
            if [[ -d "$1" ]]; then
              echo "OK: $1/"
            else
              echo "FEHLT: $1/"
              failed=1
            fi
          }

          require_file TESTVERSION.html
          require_file staticwebapp.testservice.config.json
          require_dir api

          VERSION=""
          if [[ -f TESTVERSION.html ]]; then
            VERSION="$(grep -oE "version:'RC[0-9]+'" TESTVERSION.html | head -n 1 | sed -E "s/version:'(RC[0-9]+)'/\1/" || true)"
            if [[ -n "$VERSION" ]]; then
              echo "OK: erkannte Testversion = $VERSION"
            else
              echo "FEHLER: Keine RC-Version in TESTVERSION.html gefunden."
              failed=1
            fi
          fi

          if [[ -f staticwebapp.testservice.config.json ]]; then
            if node -e "JSON.parse(require('fs').readFileSync('staticwebapp.testservice.config.json','utf8'));"; then
              echo "OK: staticwebapp.testservice.config.json ist gültiges JSON"
            else
              echo "FEHLER: staticwebapp.testservice.config.json ist ungültig."
              failed=1
            fi
          fi

          for js in api/exporthub-state/index.js api/shared/merge.js; do
            if [[ -f "$js" ]]; then
              if node --check "$js"; then
                echo "OK: Syntax $js"
              else
                echo "FEHLER: JavaScript-Syntax in $js"
                failed=1
              fi
            else
              echo "HINWEIS: $js nicht vorhanden; der Preflight blockiert deshalb nicht."
            fi
          done

          if [[ "$failed" != "0" ]]; then
            echo "TESTSERVICE-Preflight fehlgeschlagen. Oben steht die konkrete Ursache."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TESTSERVICE-Preflight vollständig bestanden für $VERSION."

      - name: Prepare isolated TESTSERVICE payload
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu

          # RC671: Build a version-bound snapshot and apply TESTSERVICE-only release overrides BEFORE
          # the TESTSERVICE payload replaces index.html/staticwebapp.config.json.
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const version = String(process.env.EXPECTED_VERSION || '').trim();
          if (!/^RC\d+$/.test(version)) throw new Error('Ungültige EXPECTED_VERSION: ' + version);

          const testHtml = fs.readFileSync('TESTVERSION.html', 'utf8');
          const overrides = new Map();
          const overrideRe = /<!--\s*EXPORTHUB_TESTSERVICE_FILE_BEGIN\s+path=([^\s]+)\s+encoding=base64\s+sha256=([a-f0-9]{64})\s*\n([A-Za-z0-9+/=\r\n]+?)\nEXPORTHUB_TESTSERVICE_FILE_END\s*-->/g;
          let om;
          while ((om = overrideRe.exec(testHtml))) {
            const rel = String(om[1] || '').replace(/\\/g, '/').replace(/^\.\//, '');
            if (!rel || rel.startsWith('/') || rel.includes('..')) throw new Error('Ungültiger TESTSERVICE-Override-Pfad: ' + rel);
            const data = Buffer.from(String(om[3] || '').replace(/\s+/g, ''), 'base64');
            const actual = crypto.createHash('sha256').update(data).digest('hex');
            if (actual !== String(om[2]).toLowerCase()) throw new Error('SHA-256 stimmt für TESTSERVICE-Override nicht: ' + rel);
            overrides.set(rel, data);
          }

          const productionHtml = fs.existsSync('index.html') ? fs.readFileSync('index.html', 'utf8') : '';
          const productionMatch =
            productionHtml.match(/var\s+BUILD\s*=\s*Object\.freeze\(\{version:\s*['"](RC\d+)['"]/i) ||
            productionHtml.match(/version:\s*['"](RC\d+)['"]/i);
          const productionVersion = productionMatch ? String(productionMatch[1]).trim() : 'unbekannt';

          const required = [
            'staticwebapp.config.json',
            'location.html',
            'pickup.html',
            'pod-notfall.html',
            '.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml',
            'api/package.json',
            'api/exporthub-state/index.js',
            'api/exporthub-state/function.json',
            'api/exporthub-health/index.js',
            'api/exporthub-health/function.json',
            'api/shared/merge.js'
          ];

          function posix(rel) { return rel.split(path.sep).join('/').replace(/^\.\//, ''); }
          function walk(dir) {
            const out = [];
            if (!fs.existsSync(dir)) return out;
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, ent.name);
              if (ent.isDirectory()) out.push(...walk(full));
              else if (ent.isFile()) out.push(posix(full));
            }
            return out;
          }
          function excluded(rel) {
            const r = posix(rel);
            if (!r || r === 'index.html' || r === 'TESTVERSION.html' || r === 'test-loader.html') return true;
            if (r === 'staticwebapp.testservice.config.json' || r === 'testservice-environment.json' || r === 'release-assets.json') return true;
            if (r === '.github/workflows/exporthub-testservice.yml') return true;
            if (r.startsWith('.git/') || r.startsWith('releases/')) return true;
            if (/^RC\d+_/i.test(r)) return true;
            if (/(^|\/)node_modules\//i.test(r)) return true;
            return false;
          }
          function productionScope(rel) {
            const r = posix(rel);
            if (excluded(r)) return false;
            if (r.startsWith('api/') || r.startsWith('infra/') || r.startsWith('assets/')) return true;
            if (r === '.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml') return true;
            if (!r.includes('/') && /\.(?:html|json|js|css|svg|png|jpe?g|gif|ico|webp|woff2?|txt)$/i.test(r)) return true;
            return false;
          }

          const paths = walk('.').filter(productionScope).sort();
          for (const file of required) {
            if (!paths.includes(file)) throw new Error('Pflichtdatei fehlt im Produktions-Snapshot: ' + file);
          }

          const files = paths.map(file => {
            const data = overrides.has(file) ? overrides.get(file) : fs.readFileSync(file);
            return {
              path: file,
              encoding: 'base64',
              size: data.length,
              sha256: crypto.createHash('sha256').update(data).digest('hex'),
              content: data.toString('base64')
            };
          });
          const manifest = {
            schema: 'exporthub-release-assets-v1',
            version,
            productionVersion,
            gitSha: String(process.env.GITHUB_SHA || ''),
            generatedAt: new Date().toISOString(),
            mode: 'full-production-snapshot',
            files
          };
          fs.writeFileSync('release-assets.json', JSON.stringify(manifest));
          for (const [rel, data] of overrides) {
            fs.mkdirSync(path.dirname(rel), { recursive: true });
            fs.writeFileSync(rel, data);
            console.log(`TESTSERVICE-Override angewendet: ${rel} · ${data.length} Bytes`);
          }
          console.log(`Release-Snapshot ${version}: ${files.length} Produktionsdateien · Produktion ${productionVersion} · Overrides ${overrides.size}.`);
          NODE

          node --check api/exporthub-state/index.js
          cp TESTVERSION.html index.html
          cp staticwebapp.testservice.config.json staticwebapp.config.json
          cat > testservice-environment.json <<EOF
          {
            "environment": "testservice",
            "isolated": true,
            "data": "TEST-DATEN",
            "productionWritesAllowed": false,
            "expectedVersion": "$EXPECTED_VERSION"
          }
          EOF
          echo "TESTSERVICE-Payload für $EXPECTED_VERSION vorbereitet."

      - name: Deploy TESTSERVICE named environment
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: ""
          deployment_environment: testservice

      - name: Verify live TESTSERVICE version
        shell: bash
        env:
          TESTSERVICE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -u
          if [[ -z "${TESTSERVICE_URL:-}" ]]; then
            echo "Azure hat keine Testservice-URL zurückgegeben."
            exit 1
          fi
          if [[ -z "${EXPECTED_VERSION:-}" ]]; then
            echo "Es wurde keine erwartete Testversion ermittelt."
            exit 1
          fi

          echo "TESTSERVICE URL: $TESTSERVICE_URL"
          echo "Erwartete Version: $EXPECTED_VERSION"

          ok=0
          tmp_direct="$(mktemp)"
          tmp_route="$(mktemp)"
          trap 'rm -f "$tmp_direct" "$tmp_route"' EXIT

          for attempt in $(seq 1 24); do
            direct_url="$TESTSERVICE_URL/TESTVERSION.html?verify=$GITHUB_SHA-$attempt"
            route_url="$TESTSERVICE_URL/test?verify=$GITHUB_SHA-$attempt"

            : > "$tmp_direct"
            : > "$tmp_route"
            direct_code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o "$tmp_direct" -w '%{http_code}' "$direct_url" || true)"
            route_code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o "$tmp_route" -w '%{http_code}' "$route_url" || true)"

            direct_version="$(grep -oE "version:'RC[0-9]+'" "$tmp_direct" | head -n 1 | sed -E "s/version:'(RC[0-9]+)'/\1/" || true)"
            route_version="$(grep -oE "version:'RC[0-9]+'" "$tmp_route" | head -n 1 | sed -E "s/version:'(RC[0-9]+)'/\1/" || true)"

            echo "Live-Check $attempt/24: direct HTTP=$direct_code ${direct_version:-keine-RC} | /test HTTP=$route_code ${route_version:-keine-RC}"

            if [[ "$direct_code" == "200" && "$route_code" == "200" && "$direct_version" == "$EXPECTED_VERSION" && "$route_version" == "$EXPECTED_VERSION" ]]; then
              echo "$EXPECTED_VERSION ist im TESTSERVICE live."
              ok=1
              break
            fi

            sleep 10
          done

          if [[ "$ok" != "1" ]]; then
            echo "TESTSERVICE-Verifikation fehlgeschlagen: erwartet $EXPECTED_VERSION."
            exit 1
          fi

      - name: Publish TESTSERVICE address
        shell: bash
        env:
          TESTSERVICE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "## ExportHUB TESTSERVICE $EXPECTED_VERSION"
            echo
            echo "**Diese Adresse zum Testen verwenden:**"
            echo
            echo "$TESTSERVICE_URL/test?v=${EXPECTED_VERSION#RC}"
            echo
            echo "Direktprüfung: $TESTSERVICE_URL/TESTVERSION.html?v=${EXPECTED_VERSION#RC}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ÖFFNEN: $TESTSERVICE_URL/test?v=${EXPECTED_VERSION#RC}"
          echo "DIREKT: $TESTSERVICE_URL/TESTVERSION.html?v=${EXPECTED_VERSION#RC}"
