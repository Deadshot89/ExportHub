name: RC1547 Apply Production Gate Once

on:
  push:
    branches:
      - fix/rc1547-taskplanner-v2-production-live-gate
    paths:
      - .github/workflows/rc1547-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rc1547-taskplanner-v2-production-live-gate
          fetch-depth: 0
      - name: RC1547 Production-Workflow direkt aktualisieren
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const file='.github/workflows/exporthub-production-release.yml';
          let source=fs.readFileSync(file,'utf8');
          const gateName='      - name: RC1547 TaskPlanner V2 Production Read-only Liveprüfung\n';
          const dashboardAnchor='      - name: RC1530 Dashboard-Personalisierung Production-Liveprüfung\n';
          const artifactName='      - name: RC1547 TaskPlanner V2 Production Browser-Artefakte\n';
          const dashboardArtifactAnchor='      - name: RC1530 Dashboard Production Browser-Artefakte\n';

          if(!source.includes(gateName)){
            const at=source.indexOf(dashboardAnchor);
            if(at<0)throw new Error('RC1547 Dashboard-Step-Anker fehlt');
            const gate=[
              '      - name: RC1547 TaskPlanner V2 Production Read-only Liveprüfung',
              '        id: rc1547_taskplanner_v2_production',
              '        shell: bash',
              '        env:',
              "          EXPORTHUB_E2E_LIVE: '1'",
              '          EXPORTHUB_E2E_BASE_URL: https://wonderful-forest-0f315e310.7.azurestaticapps.net',
              '          EXPORTHUB_E2E_PUBLIC_ENV: production',
              '        run: |',
              '          set -euo pipefail',
              '          npx playwright test e2e/specs/taskplanner-v2-production.spec.mjs --project=laptop',
              '',
            ].join('\n');
            source=source.slice(0,at)+gate+source.slice(at);
          }

          if(!source.includes(artifactName)){
            const at=source.indexOf(dashboardArtifactAnchor);
            if(at<0)throw new Error('RC1547 Dashboard-Artefakt-Anker fehlt');
            const artifact=[
              '      - name: RC1547 TaskPlanner V2 Production Browser-Artefakte',
              "        if: ${{ failure() && steps.rc1547_taskplanner_v2_production.outcome == 'failure' }}",
              '        uses: actions/upload-artifact@v7',
              '        with:',
              '          name: rc1547-taskplanner-production-${{ inputs.release_sha }}',
              '          path: |',
              '            test-results',
              '            playwright-report',
              '          if-no-files-found: ignore',
              '          retention-days: 14',
              '',
            ].join('\n');
            source=source.slice(0,at)+artifact+source.slice(at);
          }

          if(!source.includes(gateName)||!source.includes(artifactName))throw new Error('RC1547 Production-Gate unvollständig');
          fs.writeFileSync(file,source,'utf8');
          NODE
          git rm .github/workflows/rc1547-apply-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/exporthub-production-release.yml .github/workflows/rc1547-apply-once.yml
          git commit -m 'ci(rc1547): add TaskPlanner production live gate'
          git push origin HEAD:fix/rc1547-taskplanner-v2-production-live-gate
