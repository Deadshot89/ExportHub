name: RC969 Conditional State Read Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc969-conditional-state-read-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: RC969 State-API direkt schalten
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, base64, hashlib, json

          api_path=Path('api/exporthub-state/index.js')
          html_path=Path('TESTVERSION.html')
          fn_path=Path('api/exporthub-state/function.json')
          wrapper_path=Path('api/exporthub-state/wrapper.js')
          api=api_path.read_text(encoding='utf-8')
          html=html_path.read_text(encoding='utf-8')

          old_ping="if(mode==='ping'){const environment=requestedEnvironment(req,payload);context.res=json(200,{ok:true,service:'exporthub-state',version:API_VERSION,routeReachable:true,storageChecked:false,environment,blob:teamBlobForEnvironment(environment),time:now()});return}"
          new_ping="if(mode==='ping'){const environment=requestedEnvironment(req,payload);context.res=json(200,{ok:true,service:'exporthub-state',version:API_VERSION,serverVersion:API_VERSION,routeReachable:true,storageChecked:false,environment,blob:teamBlobForEnvironment(environment),time:now()});return}"
          assert old_ping in api, 'Ping-Block nicht gefunden'
          api=api.replace(old_ping,new_ping,1)

          old_meta="await validateSessionAuthOnly(req,payload,c);context.res=json(200,Object.assign({ok:true,metaOnly:true,environment:c.environment,blob:c.teamBlobName},await metadataOnly(c.team)));return"
          new_meta="await validateSessionAuthOnly(req,payload,c);context.res=json(200,Object.assign({ok:true,metaOnly:true,serverVersion:API_VERSION,environment:c.environment,blob:c.teamBlobName},await metadataOnly(c.team)));return"
          assert old_meta in api, 'Meta-Block nicht gefunden'
          api=api.replace(old_meta,new_meta,1)
          api_path.write_text(api,encoding='utf-8')

          fn=json.loads(fn_path.read_text(encoding='utf-8'))
          assert fn.get('scriptFile')=='wrapper.js','wrapper.js ist nicht der aktuelle Function-Einstieg'
          fn['scriptFile']='index.js'
          fn_path.write_text(json.dumps(fn,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          assert wrapper_path.exists(),'wrapper.js fehlt unerwartet'
          wrapper_path.unlink()

          # Produktions-Fallback in TESTVERSION muss exakt dem direkten API-Stand entsprechen.
          api_bytes=api_path.read_bytes()
          sha=hashlib.sha256(api_bytes).hexdigest()
          b64=base64.b64encode(api_bytes).decode('ascii')
          pat=re.compile(r'<!--\s*EXPORTHUB_TESTSERVICE_FILE_BEGIN\s+path=api/exporthub-state/index\.js\s+encoding=base64\s+sha256=[a-f0-9]{64}\s*\r?\n[\s\S]*?\r?\nEXPORTHUB_TESTSERVICE_FILE_END\s*-->',re.I)
          repl='<!-- EXPORTHUB_TESTSERVICE_FILE_BEGIN path=api/exporthub-state/index.js encoding=base64 sha256='+sha+'\n'+b64+'\nEXPORTHUB_TESTSERVICE_FILE_END -->'
          html,count=pat.subn(repl,html,count=1)
          assert count==1,'Eingebetteter State-API-Fallback nicht gefunden'
          html_path.write_text(html,encoding='utf-8')
          PY

          node --check api/exporthub-state/index.js
          git diff --check

      - name: RC969 Cleanup GREEN prüfen
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const api=fs.readFileSync('api/exporthub-state/index.js','utf8');
          const html=fs.readFileSync('TESTVERSION.html','utf8');
          const fn=JSON.parse(fs.readFileSync('api/exporthub-state/function.json','utf8'));
          assert.strictEqual(fn.scriptFile,'index.js');
          assert(!fs.existsSync('api/exporthub-state/wrapper.js'));
          assert(/mode==='ping'[\s\S]{0,500}serverVersion:API_VERSION/.test(api));
          assert(/mode==='meta'[\s\S]{0,500}serverVersion:API_VERSION/.test(api));
          assert(api.includes("const API_VERSION = 'RC969';"));
          assert(html.includes("version:'RC969',cache:'969'"));
          assert(api.indexOf('notModified:true')>api.indexOf('const current=await validateSession(req,payload,c),blob=c.team;'));
          assert(html.includes("mode==='read'&&runtime.loaded&&runtime.lastSnapshot"));
          console.log('RC969 direct State-API GREEN');
          NODE

      - name: Commit RC969 State-API Cleanup
        shell: bash
        run: |
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add TESTVERSION.html api/exporthub-state/index.js api/exporthub-state/function.json api/exporthub-state/wrapper.js
          git commit -m 'RC969: State API direkt ohne Wrapper ausliefern'
          git push origin main
