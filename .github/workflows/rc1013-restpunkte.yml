name: RC1013 Restpunkte Gate41 QR Benachrichtigungen

on:
  push:
    branches:
      - rc1013-restpunkte-gate41-qr-notifications
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: RC1013 Restpunkte-Vertrag
        run: node --test test/rc1013-restpunkte.test.mjs
