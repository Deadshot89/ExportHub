name: RC1061 Branch Test

on:
  push:
    branches:
      - rc1061-document-migration-admin-ui-sync
    paths:
      - 'assets/rc1061-document-migration-admin.js'
      - 'assets/rc1059-document-blob.js'
      - 'test/rc1061-document-migration-admin-ui.test.mjs'
      - 'test/rc1060-testservice-migration-control.test.mjs'
      - '.github/rc1049/fix-mail-abd-gate.mjs'
      - '.github/workflows/rc1061-branch-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rc1061-document-migration-admin-ui-sync
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1061 Regression
        run: node --test test/rc1061-document-migration-admin-ui.test.mjs
      - name: RC1060 Dokumentmigration Regression
        run: node --test test/rc1060-legacy-document-migration.test.mjs test/rc1060-document-migration-endpoint.test.mjs test/rc1060-release-contract.test.mjs test/rc1060-testservice-migration-control.test.mjs
      - name: RC1059 Dokument-Blob-Storage Regression
        run: node --test test/rc1059-document-blob-store.test.mjs test/rc1059-document-container.test.mjs test/rc1059-document-download.test.mjs test/rc1059-document-dual-read.test.mjs test/rc1059-state-diagnostics.test.mjs
      - name: QR- und Lieferavis-End-to-End-Regression
        shell: bash
        run: |
          node --test test/rc1013-pickup-readonly-flow.test.mjs
          node --test --test-name-pattern='RC995 Pickup-PIN' .github/rc995/rc995-flow.test.cjs
          node --test --test-concurrency=1 .github/rc998/partial-pickup-avis-contract.test.mjs .github/rc1000/rc1000-production-pickup.test.mjs
      - name: Gesamte Node-Regression
        run: npm test
      - name: Drei-Umgebungen-Build
        run: |
          node .github/rc1018/fix-mail-wording.mjs
          node .github/rc1048/build-three-env.mjs
          for file in index.html TESTVERSION.html demo.html; do count=$(grep -F -c 'assets/rc1061-document-migration-admin.js?v=1061' "dist-rc1048/$file" || true); echo "RC1061_ASSET_COUNT $file=$count"; done
          grep -F -q 'assets/rc1061-document-migration-admin.js?v=1061' dist-rc1048/index.html
          grep -F -q 'assets/rc1061-document-migration-admin.js?v=1061' dist-rc1048/TESTVERSION.html
          if grep -F -q 'assets/rc1061-document-migration-admin.js?v=1061' dist-rc1048/demo.html; then exit 1; fi
          git diff --check
