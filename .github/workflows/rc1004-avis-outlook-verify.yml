name: RC1004 Outlook Avis Verify
on:
  push:
    branches: [rc1004-avis-outlook-body-fix]
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'test/rc1004-avis-outlook-body.test.mjs'
      - '.github/rc998/partial-pickup-avis-contract.test.mjs'
      - '.github/workflows/rc1004-avis-outlook-verify.yml'
permissions:
  contents: read
concurrency:
  group: rc1004-avis-outlook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: RC1004 Outlook-Avis Langtext
        run: node --test test/rc1004-avis-outlook-body.test.mjs
      - name: Bestehender RC998 Avis-Vertrag
        run: node --test --test-name-pattern='Outlook erhält auch bei langen Vorlagen den vollständigen Mailtext|Kundenmail behält Sendungsdetails' .github/rc998/partial-pickup-avis-contract.test.mjs
