name: RC990 Render Focus Navigation Apply

on:
  push:
    branches:
      - rc990-large-ux
    paths:
      - '.github/rc990_render_nav_apply.py'
      - '.github/workflows/rc990-render-nav-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc990-render-focus-navigation-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/rc990-large-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated RC990 branch
        uses: actions/checkout@v4
        with:
          ref: rc990-large-ux
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply canonical RC990 render focus navigation core
        run: python .github/rc990_render_nav_apply.py

      - name: Verify focused RC990 render navigation contract
        run: node --test test/rc990-render-navigation.test.mjs

      - name: Verify existing render layout design and release contracts
        run: |
          node --test \
            test/rc975-global-render-integrity.test.mjs \
            test/rc976-render-fallback-recovery.test.mjs \
            test/rc977-colli-typography.test.mjs \
            test/rc978-shipment-fluid-layout.test.mjs \
            test/rc979-shipment-inner-density.test.mjs \
            test/rc980-colli-row-stability.test.mjs \
            test/rc990-design-system.test.mjs \
            test/rc990-release-center.test.mjs

      - name: Verify complete regression suite
        run: npm test

      - name: Remove one-time RC990 render navigation helpers
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/rc990_render_nav_apply.py \
            .github/workflows/rc990-render-nav-apply.yml \
            .github/rc990_render_nav_materialize.py \
            .github/workflows/rc990-render-nav-materialize.yml \
            .github/rc990_render_nav_audit_result.txt \
            .github/rc990_render_focus_audit.txt \
            .github/rc990_render_scheduler_audit.txt \
            .github/rc990_render_view_audit.txt

      - name: Commit verified canonical RC990 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RC990: Rendering Fokus und Zurücknavigation stabilisieren'
          git push origin HEAD:rc990-large-ux
