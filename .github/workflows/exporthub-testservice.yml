name: ExportHUB TESTSERVICE Einzel-Deploy

# Standard ist der gemeinsame RC1018-Drei-Umgebungen-Deploy über
# azure-static-web-apps-wonderful-forest-0f315e310.yml.
# Ein einzelner TESTSERVICE-Deploy ist nur bei ausdrücklich genehmigter
# Abweichung von Produktion und Demo möglich. Auch dann wird der aktuelle
# RC1018-Buildvertrag verwendet und kein historischer Release zurückgespielt.
on:
  workflow_dispatch:
    inputs:
      confirm_divergence:
        description: 'Nur für ausdrücklich erlaubte Abweichung exakt eingeben: ICH ERLAUBE EINE ABWEICHENDE TESTSERVICE-VERSION'
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: exporthub-testservice-explicit-only
  cancel-in-progress: false

jobs:
  deploy_testservice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Abweichenden Einzel-Deploy absichern
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_divergence }}" != "ICH ERLAUBE EINE ABWEICHENDE TESTSERVICE-VERSION" ]; then
            echo 'Abweichender Einzel-Deploy ist gesperrt. Produktion, TESTSERVICE und Demo müssen denselben Versionsstand haben.'
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1018 TESTSERVICE-Ausnahmevertrag prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1018'" production-version.js
          node .github/rc1018/apply-public-language.mjs
          node .github/rc1018/fix-mail-wording.mjs
          node --test --test-concurrency=1 test/rc1018-mail-language-standard.test.mjs test/rc1018-production-deploy.test.mjs test/rc1018-testservice-exception-sync.test.mjs
          node --test test/rc1017-three-env-release.test.mjs
          node --test --test-concurrency=1 test/rc1015-lieferavis-mail-flow.test.mjs test/rc1011-core-open-issues.test.mjs
          node --test test/rc1013-pickup-readonly-flow.test.mjs
          node --test --test-name-pattern='RC995 Pickup-PIN' .github/rc995/rc995-flow.test.cjs
          node --test --test-concurrency=1 .github/rc998/partial-pickup-avis-contract.test.mjs .github/rc1000/rc1000-production-pickup.test.mjs
          npm test
          node .github/rc1018/build-three-env.mjs
          grep -q 'ExportHUB RC1018 environment=testservice' dist-rc1018/TESTVERSION.html
          grep -q 'ExportHUB RC1018 environment=demo' dist-rc1018/demo.html
          grep -q "version:'RC1018'" dist-rc1018/TESTVERSION.html
          grep -q "version:'RC1018'" dist-rc1018/demo.html
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1018'" dist-rc1018/production-version.js
          grep -q 'assets/rc1018-mail-language-standard.js?v=1018' dist-rc1018/TESTVERSION.html
          grep -q 'assets/rc1018-mail-language-standard.js?v=1018' dist-rc1018/demo.html
          grep -q 'assets/rc1018-public-language.js?v=1018' dist-rc1018/customer-avis.html
          grep -q 'assets/rc1018-public-language.js?v=1018' dist-rc1018/pickup.html
          grep -q 'assets/rc1018-public-language.js?v=1018' dist-rc1018/location.html
          grep -q 'assets/rc1017-multi-truck.js?v=1017' dist-rc1018/TESTVERSION.html
          grep -q 'assets/rc1017-multi-truck.js?v=1017' dist-rc1018/demo.html
          test -s dist-rc1018/assets/rc1018-mail-language-standard.js
          test -s dist-rc1018/assets/rc1018-public-language.js
          test -s dist-rc1018/assets/rc1017-multi-truck.js
      - name: TESTSERVICE-Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rc1018_testservice_app
          mkdir -p .rc1018_testservice_app
          cp dist-rc1018/pickup.html dist-rc1018/customer-avis.html dist-rc1018/location.html dist-rc1018/pod-notfall.html .rc1018_testservice_app/
          cp dist-rc1018/production-version.js .rc1018_testservice_app/production-version.js
          cp -R assets .rc1018_testservice_app/assets
          cp -R dist-rc1018/assets/. .rc1018_testservice_app/assets/
          cp staticwebapp.testservice.config.json .rc1018_testservice_app/staticwebapp.config.json
          cp dist-rc1018/TESTVERSION.html .rc1018_testservice_app/index.html
          cp dist-rc1018/TESTVERSION.html .rc1018_testservice_app/TESTVERSION.html
          cp dist-rc1018/demo.html .rc1018_testservice_app/demo.html
          test -s .rc1018_testservice_app/assets/rc1017-multi-truck.js
          test -s .rc1018_testservice_app/assets/rc1018-mail-language-standard.js
          test -s .rc1018_testservice_app/assets/rc1018-public-language.js
      - name: Deploy TESTSERVICE explicit only
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1018_testservice_app
          api_location: api
          output_location: ''
          skip_app_build: true
          deployment_environment: testservice
