<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ExportHUB abgemeldet</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Segoe UI,Roboto,Arial,sans-serif;background:#eef6fb;color:#0f172a}.card{width:min(720px,92vw);background:#fff;border:1px solid #dbe4ef;border-radius:28px;padding:30px;box-shadow:0 18px 46px rgba(15,23,42,.10);text-align:center}h1{color:#08245d}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}a{border-radius:14px;padding:11px 16px;text-decoration:none;font-weight:900}.btn{background:#2563eb;color:#fff}.ghost{background:#fff;border:1px solid #dbe4ef;color:#334155}</style><script>try{sessionStorage.clear();['exporthub_current_user','currentUser','ExportHUB_currentUser','exporthub_rc168_current_user','exporthub_rc169_current_user','exporthub_rc170_current_user','exporthub_rc171_manual_user','ExportHUB_AZURE_LOGIN_REQUESTED'].forEach(k=>localStorage.removeItem(k));for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i)||'';if(/azure.*login|microsoft.*login|exporthub_rc16[0-9]_current_user|exporthub_rc170_current_user/i.test(k))localStorage.removeItem(k)}}catch(e){}</script></head><body><main class="card"><h1>ExportHUB wurde abgemeldet</h1><p>Die lokale ExportHUB-Sitzung wurde beendet. Deine Microsoft-Browser-Sitzung kann weiterhin aktiv sein; ExportHUB nutzt die Microsoft-Sitzung nicht für einen automatischen internen Login.</p><div class="actions"><a class="btn" href="/start.html">Zur Startseite</a><a class="ghost" href="/index.html">ExportHUB Login öffnen</a><a class="ghost" href="/.auth/logout?post_logout_redirect_uri=/logged-out.html">Microsoft-Sitzung zusätzlich abmelden</a></div></main></body></html>
