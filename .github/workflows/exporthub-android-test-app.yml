name: Build ExportHUB Android Test APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/exporthub-android-test-app.yml'

permissions:
  contents: read

concurrency:
  group: exporthub-android-test-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        working-directory: android-app
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ExportHUB-Test-RC876-v1.apk
          sha256sum out/ExportHUB-Test-RC876-v1.apk > out/ExportHUB-Test-RC876-v1.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExportHUB-Test-RC876-Android
          path: android-app/out/*
          if-no-files-found: error
          retention-days: 30
