<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ExportHUB · Abholung bestätigen</title>
<style>
:root{color-scheme:light;font-family:Segoe UI,Arial,sans-serif;color:#0f172a;background:#eef6fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,rgba(5,184,255,.18),transparent 34%),#eef6fb}
main{min-height:100vh;padding:clamp(10px,3vw,24px)}.card{width:min(780px,100%);margin:0 auto;background:#fff;border:1px solid #bfdbfe;border-radius:28px;padding:clamp(18px,4vw,32px);box-shadow:0 18px 46px rgba(15,23,42,.14)}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid #dbeafe;margin-bottom:18px}.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#05b8ff);color:#fff;display:grid;place-items:center;font-weight:1000;font-size:20px;flex:0 0 auto}.brand h1{font-size:clamp(24px,5vw,34px);color:#08245d;margin:0}.brand p{margin:4px 0 0;color:#64748b;font-weight:750}
.status{border-radius:15px;padding:13px;margin:12px 0;font-weight:850;line-height:1.45}.status.info{border-left:5px solid #2563eb;background:#eff6ff}.status.ok{border-left:5px solid #16a34a;background:#f0fdf4;color:#166534}.status.bad{border-left:5px solid #dc2626;background:#fee2e2;color:#991b1b}
.info-grid,.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box,.section{border:1px solid #dbeafe;background:#f8fbff;border-radius:18px;padding:14px}.box span{display:block;color:#64748b;font-size:11px;font-weight:900;text-transform:uppercase;margin-bottom:5px}.box b{font-size:16px;overflow-wrap:anywhere}.section{display:grid;gap:13px;margin-top:13px}.section h2{font-size:16px;margin:0;color:#08245d}
label{display:grid;gap:7px;font-weight:850;color:#1e293b}small,.help{font-size:12px;color:#64748b;font-weight:650}input{width:100%;min-height:48px;border:1px solid #94a3b8;border-radius:12px;background:#fff;padding:10px 12px;font:inherit;color:#0f172a}input:focus{outline:3px solid rgba(37,99,235,.17);border-color:#2563eb}
.signature-trigger{width:100%;min-height:118px;border:2px dashed #60a5fa;border-radius:16px;background:#fff;color:#1e3a8a;font:inherit;font-weight:900;padding:12px;display:grid;place-items:center;cursor:pointer}.signature-trigger.has-signature{border-style:solid;background:#f0fdf4}.signature-trigger img{max-width:100%;max-height:120px;object-fit:contain}
.primary{width:100%;min-height:52px;border:0;border-radius:14px;background:#1454d1;color:#fff;font:inherit;font-weight:950;padding:12px 18px;cursor:pointer;margin-top:15px}.primary:disabled{opacity:.55;cursor:wait}
.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:1000;background:rgba(15,23,42,.72);display:grid;place-items:center;padding:14px}.dialog{width:min(900px,100%);background:#fff;border-radius:22px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.35)}.dialog h2{margin:0 0 6px}.canvas-wrap{border:2px solid #2563eb;border-radius:15px;overflow:hidden;background:#fff}.canvas-wrap canvas{display:block;width:100%;height:min(42vh,330px);touch-action:none;background:#fff}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:13px;flex-wrap:wrap}.actions button{min-height:46px;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer}.clear{border:1px solid #fca5a5;background:#fff1f2;color:#991b1b}.cancel{border:1px solid #cbd5e1;background:#fff;color:#334155}.save{border:0;background:#1454d1;color:#fff}
.success{text-align:center;padding:24px 8px}.success .icon{width:74px;height:74px;border-radius:50%;margin:0 auto 16px;background:#dcfce7;color:#166534;display:grid;place-items:center;font-size:38px;font-weight:1000}.success h2{font-size:28px;margin:0 0 10px;color:#166534}.success p{font-size:16px;line-height:1.5;color:#475569}.version{text-align:center;color:#64748b;font-size:11px;margin-top:14px}
@media(max-width:620px){main{padding:8px}.card{border-radius:20px;padding:16px}.info-grid,.form-grid{grid-template-columns:1fr}.actions button{flex:1}.brand h1{font-size:25px}}
</style>
</head>
<body>
<main id="app">
<section class="card">
<div class="brand"><div class="logo">EH</div><div><h1>Abholung bestätigen</h1><p>ExportHUB · digitaler Abliefernachweis</p></div></div>
<div id="status" class="status info">QR-Code wird geprüft …</div>
<div id="details"></div>
<form id="form" hidden novalidate>
<section class="section"><h2>Fahrer und Fahrzeug</h2><div class="form-grid">
<label>Name des Fahrers <small>(optional)</small><input id="driver" autocomplete="name" autocapitalize="words"><span class="help">Fehlende Angabe wird als „Nicht angegeben“ gespeichert.</span></label>
<label>Kennzeichen <small>(optional)</small><input id="plate" autocomplete="off" inputmode="text"><span class="help">Freie Eingabe, kein bestimmtes Format erforderlich.</span></label>
</div><label id="returnLabel" hidden>Zurückgegebene Europaletten<input id="returned" type="number" min="0" step="1" value="0"></label></section>
<section class="section"><h2>Digitale Bestätigung</h2>
<label>Unterschrift des Fahrers<button id="signatureOpen" class="signature-trigger" type="button"><span id="signaturePrompt">Zum Unterschreiben hier antippen</span><img id="signaturePreview" alt="Erfasste Fahrerunterschrift" hidden></button><span class="help">Die digitale Unterschrift ist Pflicht und wird auf der Ladeliste gespeichert. Die unterschriebene Ladeliste ist der POD.</span></label>
<input id="signatureData" type="hidden">
<label>Persönlicher PIN des Verladers<input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]{4}"></label>
</section>
<button id="confirm" class="primary" type="submit">Abholung und POD übertragen</button>
</form>
<div class="version">Pickup-Seite RC277</div>
</section>
</main>
<div id="signatureModal" class="modal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="signatureTitle"><h2 id="signatureTitle">Unterschrift des Fahrers</h2><p>Bitte im großen Feld mit Finger, Stift oder Maus unterschreiben.</p><div class="canvas-wrap"><canvas id="signatureCanvas" width="1000" height="360"></canvas></div><div class="actions"><button id="signatureClear" class="clear" type="button">Löschen</button><button id="signatureCancel" class="cancel" type="button">Abbrechen</button><button id="signatureSave" class="save" type="button">Unterschrift übernehmen</button></div></div></div>
<script>
(function(){
'use strict';
var VERSION='RC277',LOADER={id:'daniel-ollmann',name:'Daniel Ollmann',personalPin:'4466'};
function q(v){return String(v==null?'':v).trim()}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function validToken(v){return /^[A-Za-z0-9_-]{6,128}$/.test(q(v))}
function tokenFromLocation(){
 var u=new URL(location.href),h='';try{h=decodeURIComponent(String(u.hash||'').replace(/^#/,''))}catch(_){h=String(u.hash||'').replace(/^#/,'')}
 var hm=h.match(/(?:^|[\/?&])pickup(?:=|\/)([A-Za-z0-9_-]{6,128})(?:$|[&\/?])/i)||h.match(/^pickup=([A-Za-z0-9_-]{6,128})$/i),pm=String(u.pathname||'').match(/\/pickup(?:\.html)?\/([A-Za-z0-9_-]{6,128})\/?$/i);
 var list=[u.searchParams.get('pickup'),u.searchParams.get('token'),u.searchParams.get('ref'),pm&&pm[1],hm&&hm[1]];for(var i=0;i<list.length;i++)if(validToken(list[i]))return q(list[i]);return'';
}
function serverPin(token){var h=2166136261;token=q(token);for(var i=0;i<token.length;i++){h^=token.charCodeAt(i);h=Math.imul(h,16777619)}return String(1000+(Math.abs(h>>>0)%9000))}
function status(text,kind){var n=document.getElementById('status');n.className='status '+(kind||'info');n.textContent=text}
function api(path,opt){opt=opt||{};opt.credentials='same-origin';opt.cache='no-store';opt.headers=Object.assign({'Accept':'application/json'},opt.headers||{});if(opt.body&&!opt.headers['Content-Type'])opt.headers['Content-Type']='application/json';return fetch('/api/'+path.replace(/^\//,''),opt).then(async function(r){var b={};try{b=await r.json()}catch(_){b={}}if(!r.ok){var e=new Error(b.message||b.error||('HTTP '+r.status));e.status=r.status;e.code=b.code||'';throw e}return b})}
function signatureAvailable(data){return !!(data&&(data.signatureAvailable||data.driverSignatureAvailable||data.driverSignatureUrl||data.pickupSignatureUrl||data.signatureUrl))}
function confirmed(data){return !!(data&&(data.confirmedAt||data.used||/confirmed|completed|abgeholt|used/i.test(String(data.status||''))))}
function disabled(data){return !!(data&&(data.disabled||data.active===false||/disabled|cancelled|storniert/i.test(String(data.status||''))))}
var token=tokenFromLocation(),canvas=document.getElementById('signatureCanvas'),ctx=canvas.getContext('2d',{alpha:false}),drawing=false,drawn=false,saved='';
function clearCanvas(){ctx.save();ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();drawn=false}
function point(e){var r=canvas.getBoundingClientRect(),p=e.touches&&e.touches[0]||e.changedTouches&&e.changedTouches[0]||e;return{x:(p.clientX-r.left)*(canvas.width/r.width),y:(p.clientY-r.top)*(canvas.height/r.height)}}
function openSignature(){document.getElementById('signatureModal').hidden=false;document.body.style.overflow='hidden';clearCanvas();if(saved){var im=new Image();im.onload=function(){ctx.drawImage(im,0,0,canvas.width,canvas.height);drawn=true};im.src=saved}}
function closeSignature(){document.getElementById('signatureModal').hidden=true;document.body.style.overflow=''}
function saveSignature(){if(!drawn){status('Bitte zuerst im großen Feld unterschreiben.','bad');return}saved=canvas.toDataURL('image/jpeg',0.82);document.getElementById('signatureData').value=saved;var img=document.getElementById('signaturePreview');img.src=saved;img.hidden=false;document.getElementById('signaturePrompt').textContent='Unterschrift erfasst – zum Ändern antippen';document.getElementById('signatureOpen').classList.add('has-signature');closeSignature();status('Unterschrift erfasst. Bitte den persönlichen Verlader-PIN eingeben.','info')}
ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='#0f172a';clearCanvas();
canvas.addEventListener('pointerdown',function(e){e.preventDefault();drawing=true;drawn=true;var p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',function(e){if(!drawing)return;e.preventDefault();var p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()});
['pointerup','pointercancel','pointerleave'].forEach(function(name){canvas.addEventListener(name,function(e){if(!drawing)return;e.preventDefault();drawing=false;ctx.closePath()})});
document.getElementById('signatureOpen').addEventListener('click',openSignature);document.getElementById('signatureClear').addEventListener('click',clearCanvas);document.getElementById('signatureCancel').addEventListener('click',closeSignature);document.getElementById('signatureSave').addEventListener('click',saveSignature);
document.getElementById('pin').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,4)});
function showData(data){
 var ref=data.reference||data.ref||data.shipmentRef||'—',customer=data.recipient||data.customer||data.customerName||'—',pallets=Math.max(0,Number(data.palletOut||data.euroPallets||0)||0);
 document.getElementById('details').innerHTML='<div class="info-grid"><div class="box"><span>Sendungsreferenz</span><b>'+esc(ref)+'</b></div><div class="box"><span>Empfänger</span><b>'+esc(customer)+'</b></div></div>'+(pallets?'<div class="box" style="margin-top:12px"><span>Europaletten Ausgang</span><b>'+pallets+'</b></div>':'');
 var form=document.getElementById('form');if(disabled(data)){form.hidden=true;status('Dieser QR-Code ist gesperrt oder die Sendung wurde storniert.','bad');return}if(confirmed(data)&&signatureAvailable(data)){form.hidden=true;status('Die Abholung und die digitale Unterschrift wurden bereits vollständig gespeichert.','ok');return}form.hidden=false;document.getElementById('returnLabel').hidden=pallets<=0;if(confirmed(data))status('Die Abholung ist bestätigt, aber die digitale Unterschrift fehlt. Bitte erneut unterschreiben.','bad');else status('Bitte digital unterschreiben und anschließend den persönlichen Verlader-PIN eingeben.','info')
}
function verifyStored(){return api('pickup-status?token='+encodeURIComponent(token)+'&verify='+Date.now()).then(function(data){if(!confirmed(data))throw new Error('Die Abholung wurde serverseitig nicht bestätigt.');if(!signatureAvailable(data))throw new Error('Die digitale Unterschrift wurde serverseitig nicht gespeichert.');return fetch(data.driverSignatureUrl||data.pickupSignatureUrl||('/api/pickup-pod?token='+encodeURIComponent(token)+'&signature=1&verify='+Date.now()),{credentials:'same-origin',cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Die gespeicherte Unterschrift ist nicht abrufbar.');var ct=String(r.headers.get('content-type')||'').toLowerCase();if(!/^image\/(jpeg|png|webp)/.test(ct))throw new Error('Der Server liefert keine Bild-Unterschrift.');return r.blob()}).then(function(blob){if(!blob||blob.size<100)throw new Error('Die gespeicherte Unterschrift ist leer.');return data})})}
function success(data){document.querySelector('.card').innerHTML='<div class="success"><div class="icon">✓</div><h2>Abholung erfolgreich gespeichert</h2><p>Die digitale Fahrerunterschrift wurde serverseitig geprüft und gespeichert.<br><b>Die unterschriebene Ladeliste ist der POD.</b><br>Verladen durch: '+esc(data.loaderName||LOADER.name)+'</p><div class="status ok">Dieses Fenster kann jetzt geschlossen werden.</div></div><div class="version">Pickup-Seite '+VERSION+'</div>'}
document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var pin=q(document.getElementById('pin').value),signature=q(document.getElementById('signatureData').value||saved),driver=q(document.getElementById('driver').value),plate=q(document.getElementById('plate').value),returned=Math.max(0,Math.round(Number(document.getElementById('returned').value||0))),button=document.getElementById('confirm');if(pin!==LOADER.personalPin){status('Der persönliche Verlader-PIN ist nicht gültig.','bad');return}if(!/^data:image\/jpeg;base64,/i.test(signature)){status('Bitte die digitale Unterschrift des Fahrers erfassen.','bad');return}var body={token:token,pin:serverPin(token),driverName:driver,pickupDriverName:driver,licensePlate:plate,vehicleLicensePlate:plate,kennzeichen:plate,loaderId:LOADER.id,loaderName:LOADER.name,loadedBy:LOADER.name,loader:LOADER.name,verlader:LOADER.name,driverSignature:signature,signatureDataUrl:signature,pickupSignature:signature,signature:signature,returnedEuroPallets:returned,podRequested:true,podType:'signed-loadlist'};button.disabled=true;status('Abholung und digitale Unterschrift werden gespeichert …','info');api('pickup-confirm',{method:'POST',body:JSON.stringify(body)}).then(verifyStored).then(success).catch(function(err){button.disabled=false;status('Abholung konnte nicht bestätigt werden: '+err.message,'bad')})});
if(!validToken(token)){document.getElementById('form').hidden=true;status('Ungültiger oder fehlender QR-Code.','bad');return}
try{history.replaceState(history.state,'',location.pathname+'?pickup='+encodeURIComponent(token)+'&token='+encodeURIComponent(token)+'&v=277#pickup='+encodeURIComponent(token))}catch(_){}
api('pickup-status?token='+encodeURIComponent(token)).then(showData).catch(function(err){document.getElementById('form').hidden=true;status(err.status===404?'Dieser QR-Code ist nicht registriert oder nicht mehr gültig.':'Sendungsdaten konnten nicht geladen werden: '+err.message,'bad')});
})();
</script>
</body>
</html>
