name: RC965 Render Path Analysis

on:
  push:
    paths:
      - '.github/workflows/rc965-render-path-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse dashboard and shipment render paths
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('TESTVERSION.html','utf8');
          function indices(needle){const a=[];let p=0;while((p=s.indexOf(needle,p))!==-1){a.push(p);p+=needle.length}return a}
          function clip(i,r=620){return s.slice(Math.max(0,i-r),Math.min(s.length,i+r)).replace(/\s+/g,' ')}
          function show(label,needle,r=620){const a=indices(needle);console.log(`\n### ${label} ${JSON.stringify(needle)} COUNT=${a.length}`);a.slice(0,40).forEach((i,k)=>console.log(`\n--- ${label}_${k+1} OFFSET=${i} ---\n${clip(i,r)}`))}

          console.log('FILE_BYTES='+Buffer.byteLength(s));
          show('PERFORM_ASSIGN','performStableRender=',900);
          show('WINDOW_RENDER_ASSIGN','window.render=',800);
          show('WINDOW_RENDER_CALL','window.render()',600);
          show('DASHBOARD','renderDashboard(',900);
          show('DASHBOARD_REFRESH','refreshDashboardIfChanged(',900);
          show('SHIPMENT_MODULE','ExportHUBShipmentView.render()',900);
          show('SHIPMENT_GUARD','rc843EnsureView',1200);
          show('RENDER_EVENT',"exporthub:rendered",900);
          show('VIEWCHANGE_EVENT',"exporthub:viewchange",900);
          show('SYNC_EVENT',"exporthub:sync",900);
          show('TIMEOUT_RENDER','setTimeout(()=>render()',900);
          show('TIMEOUT_WINDOW_RENDER',"setTimeout(function(){try{if(typeof window.render==='function')window.render()",900);
          NODE
