<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Abholbestätigung</title>
<style>
:root{--bg:#eef6fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#dbe4ef;--blue:#2563eb;--green:#166534;--red:#991b1b;--orange:#92400e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 10% 0,rgba(37,99,235,.16),transparent 34%),var(--bg);color:var(--text);padding:18px}.wrap{width:min(640px,100%);margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 22px 58px rgba(15,23,42,.14);padding:22px}.brand{display:flex;align-items:center;gap:10px;font-weight:1000;color:#08245d;letter-spacing:.03em}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#2563eb,#05b8ff);display:grid;place-items:center;color:#fff;font-size:18px}h1{font-size:30px;margin:18px 0 8px;color:#08245d}p{line-height:1.5;color:var(--muted);font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.box{border:1px solid var(--line);background:#f8fbff;border-radius:16px;padding:12px}.box span{display:block;color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase}.box strong{display:block;margin-top:5px;font-size:17px;word-break:break-word}.field{display:grid;gap:7px;margin:14px 0;font-weight:900;color:#334155}.field input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;font:inherit;font-weight:900;background:#fff}.pin{font-size:26px!important;text-align:center;letter-spacing:.3em}.btn{width:100%;border:0;border-radius:15px;min-height:48px;padding:12px 16px;background:linear-gradient(135deg,#2563eb,#05b8ff);color:#fff;font:inherit;font-weight:1000;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{border-radius:15px;padding:12px;margin:12px 0;font-weight:850;line-height:1.45}.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a}.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:var(--green)}.bad{background:#fff1f2;border:1px solid #fecaca;color:var(--red)}.warn{background:#fffbeb;border:1px solid #fde68a;color:var(--orange)}.hidden{display:none!important}.pods{display:grid;gap:8px;margin-top:10px}.pod{border:1px solid var(--line);border-radius:12px;padding:10px;background:#f8fbff}.small{font-size:12px;color:var(--muted);font-weight:800}.spinner{width:42px;height:42px;border:5px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;margin:18px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:560px){body{padding:10px}.card{padding:17px;border-radius:20px}.grid{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>
<main class="wrap"><section class="card" id="app"><div class="brand"><span class="mark">✓</span><span>Sichere Abholbestätigung</span></div><div class="spinner"></div><p style="text-align:center">Verbindung wird geprüft …</p></section></main>
<script>
(function(){
'use strict';
var app=document.getElementById('app'),token=(new URLSearchParams(location.search).get('token')||'').trim(),statusData=null,busy=false;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function arr(v){return Array.isArray(v)?v:[]}
function fmt(v){try{return new Date(v).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'medium'})}catch(_){return String(v||'')}}
function api(path,opt){opt=opt||{};opt.credentials='same-origin';opt.headers=Object.assign({'Accept':'application/json','Content-Type':'application/json'},opt.headers||{});return fetch('/api'+path,opt).then(async function(r){var b={};try{b=await r.json()}catch(_){ }if(!r.ok){var e=new Error(b.message||b.error||('HTTP '+r.status));e.status=r.status;e.body=b;throw e}return b})}
function shell(inner){app.innerHTML='<div class="brand"><span class="mark">✓</span><span>Sichere Abholbestätigung</span></div>'+inner}
function error(text){shell('<h1>Abholung</h1><div class="msg bad">'+esc(text)+'</div>')}
function isUsed(s){return !!(s&&(s.confirmedAt||s.used===true||/used|confirmed|abgeholt/i.test(String(s.status||''))))}
function isDisabled(s){return !!(s&&(s.disabled===true||/disabled|cancelled|storniert|expired/i.test(String(s.status||''))))}
function render(msg,kind){var s=statusData||{},used=isUsed(s),disabled=isDisabled(s),pods=arr(s.podFiles),palletOut=Math.max(0,Number(s.palletOut||0)||0),uploadKey='';try{uploadKey=sessionStorage.getItem('pickupUpload:'+token)||''}catch(_){ }
 var content='<h1>Abholbestätigung</h1><p>Bitte prüfen Sie die Referenz und bestätigen Sie die Abholung einmalig mit der bereitgestellten PIN.</p><div class="grid"><div class="box"><span>Referenz</span><strong>'+esc(s.reference||'')+'</strong></div><div class="box"><span>Kunde / Empfänger</span><strong>'+esc(s.customer||s.recipient||'')+'</strong></div></div>'+(msg?'<div class="msg '+esc(kind||'info')+'">'+esc(msg)+'</div>':'');
 if(disabled)content+='<div class="msg bad">Dieser QR-Code ist gesperrt und kann nicht verwendet werden.</div>';
 else if(used)content+='<div class="msg ok">Abholung bestätigt am <b>'+esc(fmt(s.confirmedAt))+'</b>. Dieser QR-Code ist bereits verwendet und kann nicht erneut bestätigt werden.</div>';
 else content+='<label class="field">Vierstellige PIN<input id="pin" class="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]*" placeholder="••••"></label><label class="field">Fahrername (optional)<input id="driver" autocomplete="name" maxlength="80"></label>'+(palletOut>0?'<label class="field">Zurückgegebene Europaletten<input id="returned" type="number" inputmode="numeric" min="0" max="'+palletOut+'" step="1" value="0"></label><div class="msg info">Ausgang: '+palletOut+' Europaletten. Die zurückgegebene Menge wird beim Abholscan im Palettenkonto berücksichtigt.</div>':'')+'<button class="btn" id="confirm">Abholung bestätigen</button>';
 if(used&&uploadKey)content+='<hr><h2>POD-Fotos hochladen</h2><p class="small">Bis zu sechs Bilder können in dieser bestätigten Sitzung hochgeladen werden.</p><label class="field">POD-Fotos<input id="files" type="file" accept="image/*" capture="environment" multiple></label><button class="btn" id="upload">POD-Fotos hochladen</button>';
 if(pods.length)content+='<h2>Gespeicherte POD-Nachweise</h2><div class="pods">'+pods.map(function(f){return '<div class="pod"><b>'+esc(f.name||'POD')+'</b><div class="small">'+esc(fmt(f.uploadedAt||''))+'</div></div>'}).join('')+'</div>';
 shell(content);var c=document.getElementById('confirm');if(c)c.addEventListener('click',confirm);var u=document.getElementById('upload');if(u)u.addEventListener('click',upload)
}
function load(msg,kind){if(!/^[a-f0-9]{48}$/i.test(token)){error('Der QR-Code ist ungültig.');return}api('/pickup-status?token='+encodeURIComponent(token),{method:'GET',headers:{'Accept':'application/json'}}).then(function(s){statusData=s||{};render(msg,kind)}).catch(function(e){error(e.status===404?'Dieser QR-Code ist ungültig, abgelaufen oder noch nicht aktiviert.':'Der Abholdienst ist momentan nicht erreichbar.')})}
function confirm(){if(busy)return;var pin=(document.getElementById('pin')||{}).value||'',driver=(document.getElementById('driver')||{}).value||'',maxRet=Math.max(0,Math.round(Number(statusData&&statusData.palletOut||0))),ret=Math.min(maxRet,Math.max(0,Math.round(Number((document.getElementById('returned')||{}).value||0))));if(!/^\d{4}$/.test(pin)){render('Bitte die vierstellige PIN vollständig eingeben.','bad');return}busy=true;var b=document.getElementById('confirm');if(b)b.disabled=true;api('/pickup-confirm',{method:'POST',body:JSON.stringify({token:token,pin:pin,driverName:driver,returnedEuroPallets:ret})}).then(function(r){try{if(r.uploadKey)sessionStorage.setItem('pickupUpload:'+token,r.uploadKey)}catch(_){ }return load('Abholung wurde mit Datum und Uhrzeit gespeichert.','ok')}).catch(function(e){var m=e.status===409?'Diese Abholung wurde bereits bestätigt.':e.status===423?'Zu viele falsche Eingaben. Bitte später erneut versuchen.':e.status===401?'Die PIN ist nicht korrekt.':e.status===410?'Der QR-Code ist abgelaufen oder gesperrt.':'Die Bestätigung konnte nicht gespeichert werden.';load(m,'bad')}).finally(function(){busy=false})}
function fileData(file){return new Promise(function(resolve,reject){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){try{var max=1600,sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);var data=c.toDataURL('image/jpeg',.82).split(',')[1];URL.revokeObjectURL(u);resolve({name:file.name.replace(/\.[^.]+$/,'.jpg'),type:'image/jpeg',dataBase64:data,size:Math.ceil(data.length*.75)})}catch(e){reject(e)}};img.onerror=function(){URL.revokeObjectURL(u);reject(new Error('Bild konnte nicht gelesen werden'))};img.src=u})}
function upload(){if(busy)return;var input=document.getElementById('files'),files=Array.from(input&&input.files||[]).slice(0,6),key='';try{key=sessionStorage.getItem('pickupUpload:'+token)||''}catch(_){ }if(!files.length){render('Bitte mindestens ein Foto auswählen.','bad');return}if(!key){render('Die Upload-Sitzung ist abgelaufen.','bad');return}busy=true;Promise.all(files.map(fileData)).then(function(images){return api('/pickup-pod',{method:'POST',body:JSON.stringify({token:token,uploadKey:key,images:images})})}).then(function(){load('POD-Fotos wurden sicher gespeichert.','ok')}).catch(function(e){load(e.status===401?'Die Upload-Sitzung ist ungültig oder abgelaufen.':'Der POD-Upload ist fehlgeschlagen.','bad')}).finally(function(){busy=false})}
load();
})();
</script>
</body>
</html>
