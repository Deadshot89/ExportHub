name: RC1026 Apply State Save Patch

on:
  push:
    branches:
      - rc1026-state-save-payload-performance
    paths:
      - scripts/rc1026-apply-state-save-patch.mjs
      - test/rc1026-state-save-payload-performance.test.mjs
      - .github/workflows/rc1026-apply-state-save-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Deterministischen RC1026 Patch anwenden
        run: node scripts/rc1026-apply-state-save-patch.mjs
      - name: RC1026 Zielvertrag vor Commit prüfen
        run: node --test test/rc1026-state-save-payload-performance.test.mjs
      - name: Gepatchten State-Save committen
        run: |
          if git diff --quiet -- api/exporthub-state/index.js; then
            echo "Keine Änderung erforderlich."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/exporthub-state/index.js
          git commit -m "RC1026: State-Save-Payload verkleinern und messen"
          git push origin HEAD:rc1026-state-save-payload-performance
