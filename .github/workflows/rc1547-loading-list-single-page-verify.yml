name: RC1547 Loading List Single Page

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/rc1305-loading-list-print.js'
      - 'assets/document-print-name.js'
      - 'test/rc1547-loading-list-single-page.test.mjs'
      - 'test/rc1550-pod-print-layout.test.mjs'
      - 'e2e/specs/rc1547-loading-list-single-page.spec.mjs'
      - 'e2e/specs/rc1550-pod-print-layout.spec.mjs'
      - 'test/rc1559-pod-real-template.test.mjs'
      - 'e2e/specs/rc1559-pod-real-template.spec.mjs'
      - 'test/rc1560-pod-pdf-signature-frame.test.mjs'
      - 'e2e/specs/rc1560-pod-pdf-signature.spec.mjs'
      - 'e2e/helpers/**'
      - '.github/rc1112/**'
      - '.github/workflows/rc1547-loading-list-single-page-verify.yml'
  push:
    branches: [main]
    paths:
      - 'assets/rc1305-loading-list-print.js'
      - 'assets/document-print-name.js'
      - 'test/rc1547-loading-list-single-page.test.mjs'
      - 'test/rc1550-pod-print-layout.test.mjs'
      - 'e2e/specs/rc1547-loading-list-single-page.spec.mjs'
      - 'e2e/specs/rc1550-pod-print-layout.spec.mjs'
      - 'test/rc1559-pod-real-template.test.mjs'
      - 'e2e/specs/rc1559-pod-real-template.spec.mjs'
      - 'test/rc1560-pod-pdf-signature-frame.test.mjs'
      - 'e2e/specs/rc1560-pod-pdf-signature.spec.mjs'
      - 'e2e/helpers/**'
      - '.github/rc1112/**'
      - '.github/workflows/rc1547-loading-list-single-page-verify.yml'

permissions:
  contents: read

concurrency:
  group: rc1547-loading-list-single-page-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Ladelisten- und POD-Verträge prüfen
        run: node --test test/rc1547-loading-list-single-page.test.mjs test/rc1550-pod-print-layout.test.mjs test/rc1559-pod-real-template.test.mjs test/rc1560-pod-pdf-signature-frame.test.mjs

      - name: Aktuelles Drei-Umgebungen-Paket bauen
        run: node .github/rc1112/build-three-env.mjs

      - name: Playwright installieren
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: Ladeliste und POD im echten Browser prüfen
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_ENTRY: /demo.html
          EXPORTHUB_E2E_PUBLIC_ENV: testservice
        run: npx playwright test e2e/specs/rc1547-loading-list-single-page.spec.mjs e2e/specs/rc1550-pod-print-layout.spec.mjs e2e/specs/rc1559-pod-real-template.spec.mjs e2e/specs/rc1560-pod-pdf-signature.spec.mjs --project=laptop

      - name: Browser-Fehlerartefakte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rc1547-loading-list-single-page
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
