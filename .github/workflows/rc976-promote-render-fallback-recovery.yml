name: RC976 Promote Render Fallback Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc976-promote-render-fallback-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: RC976 Render-Fallback-Recovery einbauen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('TESTVERSION.html')
          s = p.read_text(encoding='utf-8')

          replacements = []

          old_build = "var BUILD=Object.freeze({version:'RC975',cache:'975',loginReturn:'/TESTVERSION.html?v=968'});"
          new_build = "var BUILD=Object.freeze({version:'RC976',cache:'976',loginReturn:'/TESTVERSION.html?v=968'});"
          replacements.append((old_build, new_build, 'BUILD RC975 -> RC976'))

          render_anchor = "function performStableRender(){"
          helper = "/* exporthub-rc976-render-fallback-recovery */\nfunction rc976ClearRenderFallback(targetRoot){var host=targetRoot||root(),nodes=host&&host.querySelectorAll?host.querySelectorAll('[data-exporthub-render-fallback=\"1\"]'):[],i;for(i=nodes.length-1;i>=0;i--){var n=nodes[i];if(n&&n.parentNode)n.parentNode.removeChild(n)}return nodes.length}\n"
          replacements.append((render_anchor, helper + render_anchor, 'RC976 Cleanup-Helper'))

          old_try = "var started=performance.now?performance.now():Date.now(),v=currentView(),patchOnly=mayPatchExistingShipment(v,arguments),domChanged=true;\n try{"
          new_try = "var started=performance.now?performance.now():Date.now(),v=currentView(),patchOnly=mayPatchExistingShipment(v,arguments),domChanged=true;\n try{\n  rc976ClearRenderFallback(root());"
          replacements.append((old_try, new_try, 'Cleanup am Beginn jedes Render-Versuchs'))

          old_fallback = "var fallbackRoot=root();if(fallbackRoot&&!fallbackRoot.childElementCount)fallbackRoot.innerHTML='<section class=\\\"card\\\"><h2>ExportHUB</h2><p>Die Ansicht konnte nicht vollständig aufgebaut werden. Die Navigation bleibt verfügbar.</p></section>';"
          new_fallback = "var fallbackRoot=root();if(fallbackRoot&&!fallbackRoot.childElementCount)fallbackRoot.innerHTML=`<section class=\"card\" data-exporthub-render-fallback=\"1\"><h2>ExportHUB</h2><p>Die Ansicht konnte nicht vollständig aufgebaut werden. Die Navigation bleibt verfügbar.</p></section>`;"
          replacements.append((old_fallback, new_fallback, 'markierter aktueller Render-Fallback'))

          for old, new, label in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: erwartet genau 1 Fundstelle, gefunden {count}')
              s = s.replace(old, new, 1)
              print('OK:', label)

          p.write_text(s, encoding='utf-8')
          PY
      - name: RC971 bis RC976 komplette Regression
        run: node --test test/rc971-global-form-field-standard.test.mjs test/rc972-field-exception-audit.test.mjs test/rc973-long-text-autogrow.test.mjs test/rc975-global-render-integrity.test.mjs test/rc976-render-fallback-recovery.test.mjs
      - name: RC976 committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          git diff --cached --check
          git commit -m "RC976: veralteten Render-Fallback beim Neuaufbau entfernen"
          git push origin HEAD:main
