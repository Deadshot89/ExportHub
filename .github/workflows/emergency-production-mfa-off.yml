name: Emergency Production MFA Off

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-production-mfa-off.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exporthub-emergency-production-mfa-off
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Verify MFA is fully removed
        shell: bash
        run: |
          set -euo pipefail
          node --test test/rc1252-privileged-mfa.test.mjs

      - name: Build current production package
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1112/build-three-env.mjs
          node .github/rc1121/verify-final-html.mjs

          rm -rf .emergency_production_app
          mkdir -p .emergency_production_app

          cp dist-rc1112/index.html .emergency_production_app/index.html
          cp dist-rc1112/pickup.html .emergency_production_app/pickup.html
          cp dist-rc1112/customer-avis.html .emergency_production_app/customer-avis.html
          cp dist-rc1112/location.html .emergency_production_app/location.html
          cp dist-rc1112/pod-notfall.html .emergency_production_app/pod-notfall.html
          cp dist-rc1112/migration-recovery.html .emergency_production_app/migration-recovery.html
          cp dist-rc1112/production-version.js .emergency_production_app/production-version.js
          cp staticwebapp.config.json .emergency_production_app/staticwebapp.config.json
          cp -R assets .emergency_production_app/assets
          cp -R dist-rc1112/assets/. .emergency_production_app/assets/

          ! grep -R -n -E 'MFA_ENROLL_REQUIRED|MFA_REQUIRED|MFA_REAUTH_REQUIRED|mfaChallenge|mfaEnrollment|mfaTotp' \
            .emergency_production_app/index.html \
            api/shared api/auth 2>/dev/null

      - name: Deploy ExportHUB production immediately
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .emergency_production_app
          api_location: api
          output_location: ''
          skip_app_build: true
