name: RC1013 Restpunkte Gate41 QR Benachrichtigungen

on:
  push:
    branches:
      - rc1013-restpunkte-gate41-qr-notifications
      - rc1014-diagnose-integration
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: RC1013 und RC1014 Diagnose-Vertrag
        run: node --test test/rc1013-restpunkte.test.mjs test/rc1014-diagnostics-integration.test.mjs test/rc1014-reusable-public-links.test.mjs
      - name: RC1013 gemeinsamer Releasevertrag
        run: node --test test/rc1013-three-env-sync.test.mjs
      - name: Gate41 Regression
        run: node --test test/rc1006-gate41-route.test.mjs
      - name: QR Abholung und Lieferavis End-to-End
        shell: bash
        run: |
          node --test test/rc1013-pickup-readonly-flow.test.mjs
          node --test --test-name-pattern='RC995 Pickup-PIN' .github/rc995/rc995-flow.test.cjs
          node --test .github/rc998/partial-pickup-avis-contract.test.mjs .github/rc1000/rc1000-production-pickup.test.mjs
      - name: Android Direktöffnen und Diagnose Regression
        shell: bash
        run: |
          node --test test/rc1003-android-native-direct-open.test.mjs test/rc1003-three-env-sync.test.mjs
          node --test --test-name-pattern='Fehlerdiagnose besitzt|Website-App-Brücke|Tipp auf Diagnose-Benachrichtigung|veraltete MainActivity' .github/rc997/diagnostic-notifications-contract.test.mjs
      - name: Vollständige Node-Regression
        run: npm test
      - name: RC1013 Drei-Umgebungen-Build prüfen
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1013/build-three-env.mjs
          grep -q 'ExportHUB RC1013 environment=production-candidate' dist-rc1013/index.html
          grep -q 'ExportHUB RC1013 environment=testservice' dist-rc1013/TESTVERSION.html
          grep -q 'ExportHUB RC1013 environment=demo' dist-rc1013/demo.html
          grep -q 'assets/sop/rc1013-sop-stability.js?v=1013' dist-rc1013/index.html
          grep -q 'assets/rc1013-diagnostics.js?v=1013' dist-rc1013/index.html
          grep -q 'assets/rc1013-gate41-ui.js?v=1013' dist-rc1013/index.html
          grep -q 'serverToken=q(data&&data.token)' dist-rc1013/index.html
          grep -q "setRouteData(g,'country','Deutschland')" dist-rc1013/index.html
          git diff --check
