name: RC968 Shipment Summary Apply

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc968-shipment-summary-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: RED Test bestätigen
        shell: bash
        run: |
          set +e
          node tests/rc968-shipment-summary-dom-performance.test.cjs
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'RC968-Test war vor dem Patch bereits grün; Abbruch zum Schutz vor Doppelpatch.'
            exit 1
          fi
          echo 'RED bestätigt: unveränderte Summary erzeugt noch Text-DOM-Writes.'

      - name: RC968 minimal patchen
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='TESTVERSION.html';
          let s=fs.readFileSync(file,'utf8');
          const oldBuild="var BUILD=Object.freeze({version:'RC967',cache:'967',loginReturn:'/TESTVERSION.html?v=967'});";
          const newBuild="var BUILD=Object.freeze({version:'RC968',cache:'968',loginReturn:'/TESTVERSION.html?v=968'});";
          const oldLine="if(lineValue)lineValue.textContent=String(rows.length)";
          const newLine="if(lineValue&&lineValue.textContent!==String(rows.length))lineValue.textContent=String(rows.length)";
          const oldFallback="if(/collis|anzahl/.test(text)){n.textContent=vals.count;if(p)p.textContent='Collis'}else if(/gewicht/.test(text)){n.textContent=vals.weight;if(p)p.textContent='Gewicht'}else if(/lademeter|ldm/.test(text)){n.textContent=vals.ldm;if(p)p.textContent='Lademeter'}";
          const newFallback="if(/collis|anzahl/.test(text)){if(n.textContent!==vals.count)n.textContent=vals.count;if(p&&p.textContent!=='Collis')p.textContent='Collis'}else if(/gewicht/.test(text)){if(n.textContent!==vals.weight)n.textContent=vals.weight;if(p&&p.textContent!=='Gewicht')p.textContent='Gewicht'}else if(/lademeter|ldm/.test(text)){if(n.textContent!==vals.ldm)n.textContent=vals.ldm;if(p&&p.textContent!=='Lademeter')p.textContent='Lademeter'}";
          function count(text,needle){return text.split(needle).length-1}
          if(count(s,oldBuild)!==1)throw new Error('RC967 Build-Kennung nicht exakt einmal gefunden.');
          if(count(s,oldLine)!==1)throw new Error('Zeilen-Summary-Write nicht exakt einmal gefunden.');
          if(count(s,oldFallback)!==1)throw new Error('Summary-Fallback nicht exakt einmal gefunden.');
          s=s.replace(oldBuild,newBuild).replace(oldLine,newLine).replace(oldFallback,newFallback);
          fs.writeFileSync(file,s);
          const after=fs.readFileSync(file,'utf8');
          if(count(after,newBuild)!==1)throw new Error('RC968 Build-Kennung nicht sauber gesetzt.');
          if(count(after,newLine)!==1)throw new Error('RC968 Zeilen-Diff nicht sauber gesetzt.');
          if(count(after,newFallback)!==1)throw new Error('RC968 Fallback-Diff nicht sauber gesetzt.');
          console.log('RC968 Minimalpatch geschrieben.');
          NODE

      - name: GREEN Regressionen
        shell: bash
        run: |
          node tests/rc963-render-performance.test.cjs
          node tests/rc964-render-metrics.test.cjs
          node tests/rc965-avis-retry-performance.test.cjs
          node tests/rc966-warning-ui-render-performance.test.cjs
          node tests/rc967-shipment-visual-refresh-performance.test.cjs
          node tests/rc968-shipment-summary-dom-performance.test.cjs
          git diff --check

      - name: Produktänderung committen
        shell: bash
        run: |
          if git diff --quiet -- TESTVERSION.html; then
            echo 'Keine Produktänderung vorhanden.'
            exit 1
          fi
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add TESTVERSION.html
          git commit -m 'RC968: unveränderte Summary-DOM-Writes überspringen'
          git push origin HEAD:main
