name: RC1016 Lieferavis Persistence

on:
  push:
    branches:
      - rc1016-lieferavis-persistence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: RED – Rücksetzfehler muss vor dem Fix reproduzierbar sein
        shell: bash
        run: |
          set +e
          node --test test/rc1016-lieferavis-persistence.test.mjs > /tmp/rc1016-red.log 2>&1
          status=$?
          set -e
          cat /tmp/rc1016-red.log
          if [ "$status" -eq 0 ]; then
            echo "RC1016 RED fehlgeschlagen: Regression ist bereits grün; Fix wird nicht blind angewendet."
            exit 1
          fi
          grep -q "geplantes Abholdatum wurde durch alten Client zurückgesetzt" /tmp/rc1016-red.log

      - name: RC1016 Schutz in zentrale Sendungs-Synchronisation anwenden
        run: python .github/rc1016/apply.py

      - name: GREEN – Lieferavis-Persistenz gezielt prüfen
        run: node --test test/rc1016-lieferavis-persistence.test.mjs

      - name: Gesamte Node-Regression prüfen
        run: npm test

      - name: Syntax und Diff prüfen
        shell: bash
        run: |
          node --check api/shared/merge.js
          git diff --check
          git diff -- api/shared/merge.js

      - name: Verifizierten RC1016-Fix committen
        shell: bash
        run: |
          if git diff --quiet -- api/shared/merge.js; then
            echo "Keine Änderung an merge.js vorhanden."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/shared/merge.js
          git commit -m "fix: RC1016 Lieferavis-Antwort gegen stale Sync schützen"
          git push origin HEAD:rc1016-lieferavis-persistence
