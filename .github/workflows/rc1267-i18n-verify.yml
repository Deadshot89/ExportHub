name: RC1267 i18n verification

on:
  push:
    branches:
      - feature/rc1267-six-language-i18n
  pull_request:
    branches:
      - main
    paths:
      - 'assets/i18n/**'
      - 'assets/rc1267-i18n.js'
      - 'assets/rc1018-mail-language-standard.js'
      - 'assets/rc1018-public-language.js'
      - 'assets/rc1015-lieferavis-mail-flow.js'
      - 'assets/rc1027-lieferavis-immediate.js'
      - 'assets/rc1079-profile-settings.js'
      - 'assets/rc1166-avis-reminder-overview.js'
      - 'api/**'
      - '*.html'
      - 'scripts/i18n-audit.mjs'
      - 'test/**'
      - 'tests/**'
      - 'package.json'
      - '.github/rc1112/build-three-env.mjs'
      - '.github/workflows/rc1267-i18n-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc1267-i18n-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rc1482_patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'rc1482-release-provenance-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1482-release-provenance-auth
          fetch-depth: 0
      - name: RC1482 minimalen Provenienz-Fix anwenden
        shell: python
        run: |
          from pathlib import Path

          guard = Path('.github/rc1473/verify-main-pr-provenance.mjs')
          text = guard.read_text()
          old = """      const response=await fetchImpl(url,{\n        method:'GET',\n        headers:{\n          'Accept':'application/vnd.github+json',\n          'X-GitHub-Api-Version':API_VERSION,\n          'User-Agent':'ExportHUB-RC1473-Release-Provenance'\n        }\n      });"""
          new = """      const headers={\n        'Accept':'application/vnd.github+json',\n        'X-GitHub-Api-Version':API_VERSION,\n        'User-Agent':'ExportHUB-RC1473-Release-Provenance'\n      };\n      const token=text(env.GITHUB_TOKEN);\n      if(token)headers.Authorization=`Bearer ${token}`;\n      const response=await fetchImpl(url,{method:'GET',headers});"""
          assert text.count(old) == 1, 'Guard-Zielstelle nicht eindeutig'
          guard.write_text(text.replace(old,new))

          main = Path('.github/workflows/rc1002-main-contract.yml')
          text = main.read_text()
          old = "permissions:\n  contents: read\n"
          new = "permissions:\n  contents: read\n  pull-requests: read\n"
          assert text.count(old) == 1, 'Main permissions-Zielstelle nicht eindeutig'
          text = text.replace(old,new)
          old = "  verify:\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n"
          new = "  verify:\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    env:\n      GITHUB_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}\n"
          assert text.count(old) == 1, 'Main job-Zielstelle nicht eindeutig'
          main.write_text(text.replace(old,new))

          deploy = Path('.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml')
          text = deploy.read_text()
          old = "permissions:\n  contents: read\n  id-token: write\n"
          new = "permissions:\n  contents: read\n  pull-requests: read\n  id-token: write\n"
          assert text.count(old) == 1, 'Deploy permissions-Zielstelle nicht eindeutig'
          text = text.replace(old,new)
          old = "  build_and_deploy_job:\n    runs-on: ubuntu-latest\n    timeout-minutes: 75\n"
          new = "  build_and_deploy_job:\n    runs-on: ubuntu-latest\n    timeout-minutes: 75\n    env:\n      GITHUB_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}\n"
          assert text.count(old) == 1, 'Deploy job-Zielstelle nicht eindeutig'
          deploy.write_text(text.replace(old,new))
      - name: RC1482 targeted GREEN vor Commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --test test/rc1473-main-pr-provenance.test.mjs
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/rc1473/verify-main-pr-provenance.mjs .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml .github/workflows/rc1002-main-contract.yml "
      - name: Fix auf Feature-Branch committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc1473/verify-main-pr-provenance.mjs .github/workflows/rc1002-main-contract.yml .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml
          git commit -m 'fix(RC1482): authenticate release provenance GitHub API'
          git push origin HEAD:rc1482-release-provenance-auth

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check RC1267 changed runtimes
        run: |
          node --check assets/rc1267-i18n.js
          node --check assets/rc1018-mail-language-standard.js
          node --check assets/rc1018-public-language.js
          node --check assets/rc1015-lieferavis-mail-flow.js
          node --check assets/rc1027-lieferavis-immediate.js
          node --check assets/rc1079-profile-settings.js
          node --check assets/rc1166-avis-reminder-overview.js
          node --check api/shared/dynamic-i18n.js
          node --check api/exporthub-auth/index.js
          node --check api/exporthub-state/index.js
          node --check api/avis-reminder-mail/index.js
      - name: RC1267 unit and contract tests
        run: npm run verify:i18n
      - name: API Runtime-Abhängigkeiten installieren
        run: npm install --prefix api --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Full regression test suite
        run: npm test
      - name: Restore clean checkout after mutation-heavy regression tests
        if: always()
        run: |
          git reset --hard HEAD
          git clean -fd
      - name: Prepare release runtime after clean checkout
        run: npm run pretest
      - name: Three-environment release build
        run: node .github/rc1112/build-three-env.mjs
      - name: Full i18n audit JSON
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node scripts/i18n-audit.mjs --json | tee i18n-audit.json
      - name: i18n audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc1267-i18n-audit
          path: i18n-audit.json
          if-no-files-found: error
      - name: Strict i18n release gate
        if: always()
        run: npm run i18n:audit:strict
