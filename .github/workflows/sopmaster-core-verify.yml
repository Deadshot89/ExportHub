name: SOPMaster Core Verify

on:
  push:
    branches:
      - design/sopmaster-training-tour-2026-10-12
    paths:
      - 'assets/sop/rc1007-sop-model.js'
      - 'assets/sop/rc1016-sop-consolidation.js'
      - 'assets/sop/rc1500-sop-*.js'
      - 'assets/sop/rc1501-sop-*'
      - 'test/rc1007-sop-workflow.test.mjs'
      - 'test/rc1016-sop-consolidation.test.mjs'
      - 'test/rc1018-sop-image-coverage-complete.test.mjs'
      - 'test/rc1500-sop-*.test.mjs'
      - 'test/rc1501-sop-*.test.mjs'
      - '.github/rc1112/build-three-env.mjs'
      - 'e2e/specs/sopmaster-tour.spec.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/sopmaster-core-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: SOPMaster targeted core and tour regression
        run: node --test test/rc1007-sop-workflow.test.mjs test/rc1016-sop-consolidation.test.mjs test/rc1018-sop-image-coverage-complete.test.mjs test/rc1500-sop-*.test.mjs test/rc1501-sop-*.test.mjs
      - name: Full Node regression
        run: npm test
