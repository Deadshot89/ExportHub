name: SOP Rebuild Branch Gate

on:
  push:
    branches:
      - feature/sop-rebuild-2026-10-16

permissions:
  contents: read

concurrency:
  group: sop-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Full Node regression
        run: npm test
