name: RC890 Dashboard Layout Avis Stability TESTSERVICE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc890-dashboard-layout-avis-stability
  cancel-in-progress: false

jobs:
  patch-testservice:
    name: RC890 Dashboard Layout Avis Stability
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard valid TESTSERVICE baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f TESTVERSION.html
          test -f customer-avis.html

          grep -Eq "var BUILD=Object\.freeze\(\{version:'RC88(7|8|9)',cache:'88(7|8|9)',loginReturn:'/TESTVERSION\.html\?v=88(7|8|9)'\}\);" TESTVERSION.html
          grep -Fq "__rc887AvisAllowed" TESTVERSION.html
          grep -Fq "function avisHost(view)" TESTVERSION.html

      - name: RED verify current gaps still exist
        shell: bash
        run: |
          set -euo pipefail

          if grep -Fq "exporthub-rc890-dashboard-avis-stability" TESTVERSION.html; then
            echo "::error::RC890 ist bereits vorhanden."
            exit 1
          fi

          if grep -Fq 'id="rc890LieferAvisBtn"' TESTVERSION.html; then
            echo "::error::Lieferavis-Button ist bereits vorhanden."
            exit 1
          fi

          echo "RED bestätigt: RC890 Änderungen fehlen noch."

      - name: Snapshot source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("TESTVERSION.html").read_text(encoding="utf-8")
          data={
            "script_open":src.lower().count("<script"),
            "script_close":src.lower().count("</script>"),
            "style_open":src.lower().count("<style"),
            "style_close":src.lower().count("</style>")
          }
          for k,v in data.items():
            Path("/tmp/rc890_"+k).write_text(str(v),encoding="utf-8")
          print(data)
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-before-rc890-${GITHUB_RUN_ID}"
          git tag -a "$TAG" -m "Backup before RC890 dashboard layout, avis and stability changes"
          git push origin "refs/tags/$TAG"

