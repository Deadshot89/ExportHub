      - name: Validate repaired TESTSERVICE workflow
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/exporthub-testservice.yml"

          grep -Fq "id: live_testservice" "$FILE"
          grep -Fq "SWA_BASE_HOST_PREFIX: wonderful-forest-0f315e310" "$FILE"
          grep -Fq 'TESTSERVICE_URL: ${ steps.live_testservice.outputs.url }' "$FILE"
          grep -Fq "api/exporthub-auth-probe?verify=" "$FILE"

          if grep -Fq "name: Verify live TESTSERVICE authentication runtime" "$FILE"; then
            echo "::error::Alter Einmal-Probe-Schritt ist noch vorhanden."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          text = Path(".github/workflows/exporthub-testservice.yml").read_text(encoding="utf-8")
          data = yaml.safe_load(text)

          if not isinstance(data, dict):
              raise SystemExit("Workflow ist kein gültiges YAML-Objekt.")
          if text.count("id: live_testservice") != 1:
              raise SystemExit("live_testservice ist nicht eindeutig.")
          if text.count('${ steps.live_testservice.outputs.url }') < 3:
              raise SystemExit("Nachgelagerte Live-Prüfungen verwenden die verifizierte URL nicht überall.")
          if "deployment_environment: testservice" not in text:
              raise SystemExit("deployment_environment fehlt.")
          if "uses: Azure/static-web-apps-deploy@v1" not in text:
              raise SystemExit("Azure Deploy-Schritt wurde verändert.")

          print("Reparierter TESTSERVICE Workflow: YAML PASS")
          PY

      - name: Verify repair scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only)
          printf 'Geänderte Dateien:\n'
          printf ' - %s\n' "${CHANGED[@]}"

          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != ".github/workflows/exporthub-testservice.yml" ]]; then
            echo "::error::Es darf ausschließlich exporthub-testservice.yml geändert werden."
            exit 1
          fi

          if ! git diff --quiet -- TESTVERSION.html; then
            echo "::error::TESTVERSION.html wurde unerwartet verändert."
            exit 1
          fi

      - name: Commit TESTSERVICE auth verification fix
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/exporthub-testservice.yml
          git commit -m "TESTSERVICE: resolve named URL and wait for auth runtime"
          git push origin main

      - name: Snapshot existing TESTSERVICE deploy runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list             --workflow exporthub-testservice.yml             --limit 50             --json databaseId             --jq '.[].databaseId' > /tmp/testservice_runs_before.txt || true

      - name: Dispatch repaired TESTSERVICE deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/exporthub-testservice.yml/dispatches"             -f ref=main

      - name: Find repaired TESTSERVICE deploy
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""

          for attempt in $(seq 1 60); do
            mapfile -t IDS < <(
              gh run list                 --workflow exporthub-testservice.yml                 --event workflow_dispatch                 --branch main                 --limit 20                 --json databaseId                 --jq '.[].databaseId'
            )

            for id in "${IDS[@]}"; do
              if ! grep -qx "${id}" /tmp/testservice_runs_before.txt 2>/dev/null; then
                RUN_ID="${id}"
                break
              fi
            done

            [[ -n "$RUN_ID" ]] && break
            sleep 5
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Neuer TESTSERVICE Deploy wurde nicht gefunden."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for repaired TESTSERVICE deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.deploy.outputs.run_id }}
        run: |
          set -euo pipefail

          gh run watch "$RUN_ID" || true
          CONCLUSION="$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion')"

          if [[ "$CONCLUSION" != "success" ]]; then
            {
              echo "## Reparierter TESTSERVICE Deploy fehlgeschlagen"
              echo
              echo "Run: $RUN_ID"
              echo
              echo '```text'
              gh run view "$RUN_ID" --log-failed 2>&1 | tail -n 280 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::TESTSERVICE Deploy endete mit $CONCLUSION. Die echten Fehlerlogs stehen in dieser Zusammenfassung."
            exit 1
          fi

          echo "TESTSERVICE Deploy erfolgreich."

      - name: Summary
        if: success()
        shell: bash
        run: |
          {
            echo "## RC886 TESTSERVICE Auth Runtime Fix v2"
            echo
            echo "- RC886 TESTVERSION.html unverändert"
            echo "- Nur exporthub-testservice.yml geändert"
            echo "- stabile -testservice-Adresse wird zuerst geprüft"
            echo "- API-Warmup bis zu 5 Minuten"
            echo "- RC886-Seite und Auth-Probe müssen auf derselben Adresse bereit sein"
            echo "- nachgelagerte Checks und veröffentlichter Link verwenden die verifizierte URL"
          } >> "$GITHUB_STEP_SUMMARY"
