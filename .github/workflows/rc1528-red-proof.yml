name: RC1528 Red Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rc1528_red_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1528 gezielte Production-Domain-Regression
        run: node --test test/rc1505-production-promotion.test.mjs
