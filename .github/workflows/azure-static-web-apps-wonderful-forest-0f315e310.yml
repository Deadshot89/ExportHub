name: ExportHUB RC1014 Drei-Umgebungen Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'demo.html'
      - 'production-version.js'
      - 'pickup.html'
      - 'customer-avis.html'
      - 'location.html'
      - 'pod-notfall.html'
      - 'assets/**'
      - 'api/**'
      - 'android-app/**'
      - 'browser/**'
      - 'staticwebapp.config.json'
      - 'staticwebapp.testservice.config.json'
      - '.github/rc1014/**'
      - '.github/rc1013/**'
      - '.github/rc1012/**'
      - 'test/rc1014-*.test.mjs'
      - 'test/rc1013-*.test.mjs'
      - 'test/rc1012-*.test.mjs'
      - 'test/rc1011-*.test.mjs'
      - 'test/rc1010-*.test.mjs'
      - 'test/rc1009-*.test.mjs'
      - 'test/rc1008-*.test.mjs'
      - 'test/rc1007-sop-*.test.mjs'
      - 'test/rc1007-iso-sop-contract.test.mjs'
      - '.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml'
permissions:
  contents: read
concurrency:
  group: exporthub-rc1014-three-env-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: RC1014 Freigabevertrag prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1014'" production-version.js
          node --test test/rc1014-release-sync.test.mjs test/rc1014-task-lifecycle.test.mjs test/rc1014-task-runtime-integration.test.mjs test/rc1014-task-design.test.mjs test/rc1014-task-android.test.mjs test/rc1014-shipment-overview-meta.test.mjs test/rc1013-restpunkte.test.mjs test/rc1013-three-env-sync.test.mjs test/rc1012-abholkalender-completion.test.mjs test/rc1012-abholkalender-runtime-integration.test.mjs test/rc1012-three-env-sync.test.mjs test/rc1011-core-open-issues.test.mjs test/rc1011-project-isolation.test.mjs test/rc1011-three-env-sync.test.mjs test/rc1010-sop-release-readiness.test.mjs test/rc1010-three-env-sync.test.mjs test/rc1009-sop-selection-ui.test.mjs test/rc1008-system-sops.test.mjs test/rc1007-iso-sop-contract.test.mjs test/rc1007-sop-model.test.mjs test/rc1007-sop-catalog.test.mjs test/rc1007-sop-visuals.test.mjs test/rc1007-sop-ui.test.mjs test/rc1007-sop-workflow.test.mjs test/rc1007-sop-print-mobile.test.mjs test/rc1006-gate41-route.test.mjs
          node --test --test-name-pattern='RC995 Pickup-Bedienfluss|RC995 Pickup-PIN' .github/rc995/rc995-flow.test.cjs
          node --test .github/rc998/partial-pickup-avis-contract.test.mjs .github/rc1000/rc1000-production-pickup.test.mjs
          npm test
      - name: RC1014 Produktion TESTSERVICE und Demo gemeinsam bauen
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1014/build-three-env.mjs
          grep -q 'ExportHUB RC1014 environment=production-candidate' dist-rc1014/index.html
          grep -q 'ExportHUB RC1014 environment=testservice' dist-rc1014/TESTVERSION.html
          grep -q 'ExportHUB RC1014 environment=demo' dist-rc1014/demo.html
          grep -q "version:'RC1014'" dist-rc1014/index.html
          grep -q "version:'RC1014'" dist-rc1014/TESTVERSION.html
          grep -q "version:'RC1014'" dist-rc1014/demo.html
          grep -q 'assets/sop/rc1010-sop-release.js' dist-rc1014/index.html
          grep -q 'assets/abholkalender.js?v=1012' dist-rc1014/index.html
          grep -q 'assets/rc1012-abholkalender-runtime.js?v=1012' dist-rc1014/index.html
          grep -q 'assets/rc1013-diagnostics.js?v=1013' dist-rc1014/index.html
          grep -q 'assets/rc1013-gate41-ui.js?v=1013' dist-rc1014/index.html
          grep -q 'assets/rc1014-task-runtime.js?v=1014' dist-rc1014/index.html
          grep -q 'assets/rc1014-task-ui.css?v=1014' dist-rc1014/index.html
          grep -q 'assets/rc1014-shipment-overview.js?v=1014' dist-rc1014/index.html
          grep -q 'assets/rc1014-shipment-overview.css?v=1014' dist-rc1014/index.html
          grep -q 'serverToken=q(data&&data.token)' dist-rc1014/index.html
          grep -q "setRouteData(g,'country','Deutschland')" dist-rc1014/index.html
      - name: Gemeinsame Deploy-Pakete vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rc1014_production_app .rc1014_testservice_app
          mkdir -p .rc1014_production_app .rc1014_testservice_app
          for dir in .rc1014_production_app .rc1014_testservice_app; do
            cp pickup.html customer-avis.html location.html pod-notfall.html production-version.js "$dir/"
            cp -R assets "$dir/assets"
          done
          cp staticwebapp.config.json .rc1014_production_app/staticwebapp.config.json
          cp dist-rc1014/index.html .rc1014_production_app/index.html
          cp dist-rc1014/assets/exporthub-environment-hub.js .rc1014_production_app/assets/exporthub-environment-hub.js
          cp dist-rc1014/assets/exporthub-demo-bootstrap.js .rc1014_production_app/assets/exporthub-demo-bootstrap.js
          cp dist-rc1014/assets/rc1014-task-runtime.js .rc1014_production_app/assets/rc1014-task-runtime.js
          cp dist-rc1014/assets/rc1014-shipment-overview.js .rc1014_production_app/assets/rc1014-shipment-overview.js
          cp staticwebapp.testservice.config.json .rc1014_testservice_app/staticwebapp.config.json
          cp dist-rc1014/TESTVERSION.html .rc1014_testservice_app/index.html
          cp dist-rc1014/TESTVERSION.html .rc1014_testservice_app/TESTVERSION.html
          cp dist-rc1014/demo.html .rc1014_testservice_app/demo.html
          cp dist-rc1014/assets/exporthub-environment-hub.js .rc1014_testservice_app/assets/exporthub-environment-hub.js
          cp dist-rc1014/assets/exporthub-demo-bootstrap.js .rc1014_testservice_app/assets/exporthub-demo-bootstrap.js
          cp dist-rc1014/assets/rc1014-task-runtime.js .rc1014_testservice_app/assets/rc1014-task-runtime.js
          cp dist-rc1014/assets/rc1014-shipment-overview.js .rc1014_testservice_app/assets/rc1014-shipment-overview.js
      - name: Deploy ExportHUB production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1014_production_app
          api_location: api
          output_location: ''
          skip_app_build: true
      - name: Deploy ExportHUB TESTSERVICE
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1014_testservice_app
          api_location: api
          output_location: ''
          skip_app_build: true
          deployment_environment: testservice
      - name: Live RC1014 Produktion TESTSERVICE und Demo prüfen
        shell: bash
        run: |
          set -euo pipefail
          prod='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          testservice='https://wonderful-forest-0f315e310-testservice.centralus.7.azurestaticapps.net'
          p=$(mktemp); t=$(mktemp); d=$(mktemp); ph=$(mktemp); th=$(mktemp); pt=$(mktemp); tt=$(mktemp); po=$(mktemp); to=$(mktemp)
          trap 'rm -f "$p" "$t" "$d" "$ph" "$th" "$pt" "$tt" "$po" "$to"' EXIT
          for attempt in {1..24}; do
            pc=$(curl -sS -L -o "$p" -w '%{http_code}' --max-time 20 "$prod/?rc1014=$GITHUB_SHA-$attempt" || true)
            tc=$(curl -sS -L -o "$t" -w '%{http_code}' --max-time 20 "$testservice/TESTVERSION.html?rc1014=$GITHUB_SHA-$attempt" || true)
            dc=$(curl -sS -L -o "$d" -w '%{http_code}' --max-time 20 "$testservice/demo.html?rc1014=$GITHUB_SHA-$attempt" || true)
            phc=$(curl -sS -o "$ph" -w '%{http_code}' --max-time 20 "$prod/api/exporthub-health" || true)
            thc=$(curl -sS -o "$th" -w '%{http_code}' --max-time 20 "$testservice/api/exporthub-health" || true)
            ptc=$(curl -sS -o "$pt" -w '%{http_code}' --max-time 20 "$prod/assets/rc1014-task-runtime.js?rc1014=$GITHUB_SHA-$attempt" || true)
            ttc=$(curl -sS -o "$tt" -w '%{http_code}' --max-time 20 "$testservice/assets/rc1014-task-runtime.js?rc1014=$GITHUB_SHA-$attempt" || true)
            poc=$(curl -sS -o "$po" -w '%{http_code}' --max-time 20 "$prod/assets/rc1014-shipment-overview.js?rc1014=$GITHUB_SHA-$attempt" || true)
            toc=$(curl -sS -o "$to" -w '%{http_code}' --max-time 20 "$testservice/assets/rc1014-shipment-overview.js?rc1014=$GITHUB_SHA-$attempt" || true)
            if [[ "$pc" == '200' && "$tc" == '200' && "$dc" == '200' && "$phc" == '200' && "$thc" == '200' && "$ptc" == '200' && "$ttc" == '200' && "$poc" == '200' && "$toc" == '200' ]] \
              && grep -q 'ExportHUB RC1014 environment=production-candidate' "$p" \
              && grep -q 'ExportHUB RC1014 environment=testservice' "$t" \
              && grep -q 'ExportHUB RC1014 environment=demo' "$d" \
              && grep -q "version:'RC1014'" "$p" \
              && grep -q "version:'RC1014'" "$t" \
              && grep -q "version:'RC1014'" "$d" \
              && grep -q 'assets/rc1014-task-runtime.js?v=1014' "$p" \
              && grep -q 'assets/rc1014-task-runtime.js?v=1014' "$t" \
              && grep -q 'assets/rc1014-task-runtime.js?v=1014' "$d" \
              && grep -q 'assets/rc1014-shipment-overview.js?v=1014' "$p" \
              && grep -q 'assets/rc1014-shipment-overview.js?v=1014' "$t" \
              && grep -q 'assets/rc1014-shipment-overview.js?v=1014' "$d" \
              && grep -q 'syncAndroidSnapshot' "$pt" \
              && grep -q 'syncAndroidSnapshot' "$tt" \
              && grep -q 'Erfasst:' "$po" \
              && grep -q 'Colli:' "$po" \
              && grep -q 'Erfasst:' "$to" \
              && grep -q 'Colli:' "$to"; then
              echo 'RC1014 Produktion, TESTSERVICE und Demo live auf gemeinsamem Stand mit Aufgabenabschluss, persönlichen Android-Erinnerungen sowie Erfassungsdatum und Colli in der Sendungsübersicht bestätigt.'
              exit 0
            fi
            sleep 10
          done
          echo 'RC1014 Drei-Umgebungen-Liveprüfung nicht bestätigt.'
          exit 1
