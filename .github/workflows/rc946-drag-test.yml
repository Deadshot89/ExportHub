name: RC946 Drag Regression Test

on:
  push:
    branches:
      - main
    paths:
      - 'TESTVERSION.html'
      - '.github/workflows/rc946-drag-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: RC946 Sofort-Drag prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC946',cache:'946',loginReturn:'/TESTVERSION.html?v=946'" in text, 'RC946 Buildmarker fehlt'
          assert 'draggable="true" data-i218-drag=' not in text, 'Aufgaben verwenden noch natives Browser-Drag'
          assert 'draggable="true" data-warehouse-drag-key=' not in text, 'Lager verwendet noch natives Browser-Drag'
          assert 'function rc946TaskPointerDayAt(' in text, 'Pointer-Pfad für Aufgaben fehlt'
          assert 'function rc946WarehousePointerZone(' in text, 'Pointer-Pfad für Lager fehlt'
          assert "e.target.closest('[data-i218-drag]')" in text, 'Aufgaben-Pointerstart fehlt'
          assert "e.target.closest('[data-warehouse-drag-key]')" in text, 'Lager-Pointerstart fehlt'
          assert "moveTask(id,day.getAttribute('data-i218-drop-date'),day)" in text, 'Bestehende Aufgaben-Verschiebelogik nicht angebunden'
          assert "moveShipmentKey(key,Number(zone.getAttribute('data-warehouse-drop-code')||0))" in text, 'Bestehende Lager-Verschiebelogik nicht angebunden'
          assert "document.addEventListener('dragstart',function(e){var card=e.target&&e.target.closest&&e.target.closest('[data-i218-drag]')" not in text, 'Alter Aufgaben-Dragstart noch aktiv'
          assert "root.addEventListener('dragstart',function(e){var card=e.target&&e.target.closest&&e.target.closest('[data-warehouse-drag-key]')" not in text, 'Alter Lager-Dragstart noch aktiv'
          print('RC946 drag regression checks passed')
          PY
