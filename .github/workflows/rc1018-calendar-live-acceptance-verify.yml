name: RC1018 Calendar Live Acceptance Verify
on:
  pull_request:
    branches: [main]
    paths:
      - 'test/rc1018-calendar-live-acceptance.test.mjs'
      - '.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml'
      - '.github/workflows/rc1018-calendar-live-acceptance-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: RC1018 Kalender-Liveabnahme prüfen
        run: node --test test/rc1018-calendar-live-acceptance.test.mjs
