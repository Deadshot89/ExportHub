name: Deepfix Packmeldungen TDD

on:
  push:
    branches:
      - deepfix/packmeldungen-nav-flow-20261011

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Packmeldungen Navigation Regression
        run: node --test test/pack-notification-task.test.mjs
