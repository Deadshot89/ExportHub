name: ONE-TIME Restore ExportHUB Internal RC882

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Zum Bereinigen exakt RESTORE_RC882 eingeben'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: exporthub-internal-one-time-restore-rc882
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify clean baseline and RC882 source
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          FIRST_PROFESSIONAL_COMMIT: ced6b59
          RC882_SOURCE: 620c356
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "RESTORE_RC882" ]] || { echo "ABBRUCH: Bestätigung muss RESTORE_RC882 lauten."; exit 1; }

          git cat-file -e "${FIRST_PROFESSIONAL_COMMIT}^{commit}"
          git cat-file -e "${RC882_SOURCE}^{commit}"
          CLEAN_BASE="$(git rev-parse "${FIRST_PROFESSIONAL_COMMIT}^")"
          echo "Saubere Internal-Basis vor erstem Professional-Upload: $CLEAN_BASE"
          echo "RC882-Dateiquelle: $RC882_SOURCE"

          VERSION="$(git show "${RC882_SOURCE}:TESTVERSION.html" | grep -oE "var BUILD=Object\.freeze\(\{version:'RC[0-9]+'" | head -n 1 | grep -oE 'RC[0-9]+' || true)"
          [[ "$VERSION" == "RC882" ]] || { echo "ABBRUCH: RC882_SOURCE enthält nicht RC882 (gefunden: ${VERSION:-nichts})."; exit 1; }

          STORAGE="$(git show "${RC882_SOURCE}:api/package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);process.stdout.write(String(p.dependencies&&p.dependencies['@azure/storage-blob']||''));});")"
          [[ "$STORAGE" == "12.27.0" ]] || { echo "ABBRUCH: RC882 api/package.json enthält nicht @azure/storage-blob 12.27.0."; exit 1; }

          echo "CLEAN_BASE=$CLEAN_BASE" >> "$GITHUB_ENV"
          echo "OK: Basis und RC882-Quelle geprüft."

      - name: Create safety branch before cleanup
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          branch="backup-before-rc882-cleanup-$stamp"
          git branch "$branch" HEAD
          git push origin "$branch"
          echo "Sicherungsbranch erstellt: $branch"

      - name: Restore clean Internal tree and overlay RC882 TESTSERVICE
        shell: bash
        env:
          RC882_SOURCE: 620c356
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Vollständigen getrackten Baum auf den Stand VOR dem ersten Professional-Upload zurücksetzen.
          git rm -r --ignore-unmatch . >/dev/null 2>&1 || true
          git checkout "$CLEAN_BASE" -- .

          # Nur die bestätigten Internal-RC882-Testservice-Dateien aus dem grünen RC882-Lauf übernehmen.
          git checkout "$RC882_SOURCE" -- \
            TESTVERSION.html \
            .github/workflows/exporthub-testservice.yml \
            api/package.json \
            api/shared/user-policy.js \
            api/exporthub-auth-probe/index.js \
            api/exporthub-auth-probe/function.json

          # Professional darf im Internal-Repository danach nicht mehr vorhanden sein.
          rm -f professional-project.json UPLOAD_ONLY_TO_NEW_REPOSITORY.txt
          rm -f .github/workflows/professional-ci.yml

          git add -A

          test -f TESTVERSION.html
          test -f .github/workflows/exporthub-testservice.yml
          test ! -f professional-project.json
          test ! -f .github/workflows/professional-ci.yml

          VERSION="$(grep -oE "var BUILD=Object\.freeze\(\{version:'RC[0-9]+'" TESTVERSION.html | head -n 1 | grep -oE 'RC[0-9]+' || true)"
          [[ "$VERSION" == "RC882" ]] || { echo "ABBRUCH: finaler TESTVERSION-Stand ist nicht RC882."; exit 1; }

          node -e "const p=require('./api/package.json'); if(p.dependencies?.['@azure/storage-blob']!=='12.27.0') process.exit(1);"

          if git diff --cached --quiet; then
            echo "Repository ist bereits im gewünschten bereinigten RC882-Teststand."
            exit 0
          fi

          git commit -m "Clean Internal repository and restore RC882 testservice"
          git push origin HEAD:main
          echo "OK: Internal bereinigt. Produktion wurde nicht freigegeben; production-version.js wurde nicht absichtlich geändert."
