permissions:
  contents: read
  id-token: write
concurrency:
  group: exporthub-rc1112-three-env-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1112 Freigabevertrag prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'" production-version.js
          node .github/rc1018/apply-public-language.mjs
          node .github/rc1018/fix-mail-wording.mjs
          node --test --test-concurrency=1 test/rc1018-mail-language-standard.test.mjs test/rc1018-production-deploy.test.mjs
          node --test test/rc1017-three-env-release.test.mjs
          node --test --test-concurrency=1 test/rc1016-production-deploy.test.mjs test/rc1016-release-sync.test.mjs test/rc1016-sop-consolidation.test.mjs test/rc1016-demo-tasks.test.mjs
          node --test --test-concurrency=1 test/rc1014-task-lifecycle.test.mjs test/rc1014-task-runtime-integration.test.mjs test/rc1014-task-design.test.mjs test/rc1014-shipment-overview-meta.test.mjs test/rc1014-fixed-pickup-seed.test.mjs test/rc1014-demo-environment.test.mjs test/rc1014-demo-session-calendar.test.mjs
          node --test --test-concurrency=1 test/rc1015-lieferavis-mail-flow.test.mjs test/rc1013-restpunkte.test.mjs test/rc1013-three-env-sync.test.mjs test/rc1011-core-open-issues.test.mjs test/rc1011-project-isolation.test.mjs
          node --test test/rc1013-pickup-readonly-flow.test.mjs
          node --test --test-name-pattern='RC995 Pickup-PIN' .github/rc995/rc995-flow.test.cjs
          node --test --test-concurrency=1 .github/rc998/partial-pickup-avis-contract.test.mjs .github/rc1000/rc1000-production-pickup.test.mjs
          npm test
      - name: RC1112 Produktion TESTSERVICE und Demo gemeinsam bauen
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1112/build-three-env.mjs
          node .github/rc1121/verify-final-html.mjs
          grep -q 'ExportHUB RC1112 environment=production-candidate' dist-rc1112/index.html
          grep -q 'ExportHUB RC1112 environment=testservice' dist-rc1112/TESTVERSION.html
          grep -q 'ExportHUB RC1112 environment=demo' dist-rc1112/demo.html
          grep -q "version:'RC1112'" dist-rc1112/index.html
          grep -q "version:'RC1112'" dist-rc1112/TESTVERSION.html
          grep -q "version:'RC1112'" dist-rc1112/demo.html
          grep -q 'function addressCountryCode(v)' dist-rc1112/index.html
          grep -q 'function addressCountryCode(v)' dist-rc1112/TESTVERSION.html
          grep -q 'function addressCountryCode(v)' dist-rc1112/demo.html
          grep -q 'id="rc1048GateMaster"' dist-rc1112/index.html
          grep -q 'function saveGateMaster()' dist-rc1112/index.html
          grep -q 'id="rc1048GateMaster"' dist-rc1112/TESTVERSION.html
          grep -q 'id="rc1048GateMaster"' dist-rc1112/demo.html
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'" dist-rc1112/production-version.js
