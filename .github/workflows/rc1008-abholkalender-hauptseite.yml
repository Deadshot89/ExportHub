name: RC1008 Abholkalender Hauptseite

on:
  push:
    branches:
      - rc1008-abholkalender-hauptseite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: RC1008 Abholkalender Hauptseiten-Vertrag
        run: node --test test/rc1004-abholkalender-ui.test.mjs
