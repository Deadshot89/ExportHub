name: RC1484 Generic Pickup Reminder

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/rc1166-avis-reminder-overview.js'
      - 'test/rc1484-generic-pickup-reminder.test.mjs'
      - '.github/workflows/rc1484-generic-reminder.yml'
  push:
    branches: [main]
    paths:
      - 'assets/rc1166-avis-reminder-overview.js'
      - 'test/rc1484-generic-pickup-reminder.test.mjs'
      - '.github/workflows/rc1484-generic-reminder.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: RC1484 regression
        run: node --test test/rc1484-generic-pickup-reminder.test.mjs
