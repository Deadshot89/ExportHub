name: Security Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Hochkonfidente Secrets im Repository ausschließen
        run: node scripts/security-secret-scan.mjs
