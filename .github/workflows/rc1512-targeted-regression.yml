name: RC1512 Targeted Document Viewer Off-View Sync Regression

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'assets/rc1063-abd-blob-viewer-compat.js'
      - 'test/rc1512-document-viewer-offview-sync-gate.test.mjs'
      - '.github/workflows/rc1512-targeted-regression.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: RC1512 targeted regression
        run: node --test test/rc1512-document-viewer-offview-sync-gate.test.mjs
