name: RC1059 Apply Browser Dual Read

on:
  push:
    branches:
      - rc1059-document-blob-storage
    paths:
      - '.github/rc1059/apply-browser-dual-read.cjs'
      - '.github/workflows/rc1059-apply-browser-dual-read.yml'
      - 'assets/rc1059-document-blob.js'
      - 'test/rc1059-document-dual-read.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rc1059-document-blob-storage
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1059 Browser-Dual-Read anwenden
        run: node .github/rc1059/apply-browser-dual-read.cjs
      - name: RC1059 Regressionen
        run: node --test test/rc1059-*.test.mjs
      - name: Änderung committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Keine Änderung notwendig.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'RC1059: Legacy- und Blob-Dokumente gemeinsam lesen'
          git push origin HEAD:rc1059-document-blob-storage
