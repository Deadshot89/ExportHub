name: RC977 Colli Typography

on:
  push:
    branches: [main]
    paths:
      - 'TESTVERSION.html'
      - 'test/rc977-colli-typography.test.mjs'
      - '.github/workflows/rc977-colli-typography.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: RC977 Colli-Typografie prüfen
        run: node --test test/rc977-colli-typography.test.mjs
