name: RC978 Apply Shipment Fluid Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc978-shipment-fluid-layout-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RC978 fluides Sendungsraster einbauen
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('TESTVERSION.html')
          s = p.read_text(encoding='utf-8')

          old_build = "var BUILD=Object.freeze({version:'RC977',cache:'977',loginReturn:'/TESTVERSION.html?v=968'});"
          new_build = "var BUILD=Object.freeze({version:'RC978',cache:'978',loginReturn:'/TESTVERSION.html?v=968'});"
          if s.count(old_build) != 1:
              raise SystemExit(f'BUILD RC977: erwartet 1 Fundstelle, gefunden {s.count(old_build)}')
          s = s.replace(old_build, new_build, 1)

          old_grid = ".rc894-full-stack{display:grid!important;grid-template-columns:minmax(340px,1.05fr) minmax(390px,1.15fr) minmax(360px,.95fr)!important;gap:14px!important;align-items:start!important;width:100%!important;max-width:1420px!important;margin:0 auto!important}"
          new_grid = ".rc894-full-stack{display:grid!important;grid-template-columns:minmax(340px,1.05fr) minmax(390px,1.15fr) minmax(360px,.95fr)!important;gap:14px!important;align-items:stretch!important;width:100%!important;max-width:1420px!important;margin:0 auto!important}"
          if s.count(old_grid) != 1:
              raise SystemExit(f'Basisraster: erwartet 1 Fundstelle, gefunden {s.count(old_grid)}')
          s = s.replace(old_grid, new_grid, 1)

          old_layout = "#rc363FixedShipmentLayout{display:flex!important;flex-direction:column!important;width:100%!important;max-width:1420px!important;margin:0 auto!important;gap:14px!important}"
          new_layout = "#rc363FixedShipmentLayout{display:flex!important;flex-direction:column!important;width:100%!important;max-width:1420px!important;margin:0 auto!important;gap:14px!important;container-type:inline-size!important;container-name:rc978ShipmentLayout!important}"
          if s.count(old_layout) != 1:
              raise SystemExit(f'FixedShipmentLayout: erwartet 1 Fundstelle, gefunden {s.count(old_layout)}')
          s = s.replace(old_layout, new_layout, 1)

          old_stretch = "#rc383TopPair.rc894-full-stack>#rc363BlockCustomer,#rc383TopPair.rc894-full-stack>#rc363BlockShipment,#rc383TopPair.rc894-full-stack>#rc363BlockColli{align-self:start!important;height:auto!important}"
          new_stretch = "#rc383TopPair.rc894-full-stack>#rc363BlockCustomer,#rc383TopPair.rc894-full-stack>#rc363BlockShipment,#rc383TopPair.rc894-full-stack>#rc363BlockColli{align-self:stretch!important;height:auto!important}"
          if s.count(old_stretch) != 1:
              raise SystemExit(f'Obere Kartenregel: erwartet 1 Fundstelle, gefunden {s.count(old_stretch)}')
          s = s.replace(old_stretch, new_stretch, 1)

          old_medium = "@media(max-width:1380px){.rc894-full-stack{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}#rc383TopPair.rc894-full-stack>#rc363BlockCustomer{grid-column:1!important;grid-row:1!important}#rc383TopPair.rc894-full-stack>#rc363BlockShipment{grid-column:2!important;grid-row:1!important}#rc383TopPair.rc894-full-stack>#rc363BlockColli{grid-column:1/-1!important;grid-row:2!important}#rc383TopPair.rc894-full-stack>#rc363BlockDocuments,#rc383TopPair.rc894-full-stack>#rc363BlockAbdDecision{grid-column:1/-1!important;grid-row:auto!important}}"
          new_medium = "@container rc978ShipmentLayout (max-width:1180px){#rc383TopPair.rc894-full-stack{grid-template-columns:repeat(2,minmax(0,1fr))!important}#rc383TopPair.rc894-full-stack>#rc363BlockCustomer{grid-column:1!important;grid-row:1!important}#rc383TopPair.rc894-full-stack>#rc363BlockShipment{grid-column:2!important;grid-row:1!important}#rc383TopPair.rc894-full-stack>#rc363BlockColli{grid-column:1/-1!important;grid-row:2!important}#rc383TopPair.rc894-full-stack>#rc363BlockDocuments{grid-column:1/-1!important;grid-row:auto!important}#rc383TopPair.rc894-full-stack>#rc363BlockAbdDecision{grid-column:1/-1!important;grid-row:auto!important}}@container rc978ShipmentLayout (max-width:760px){#rc383TopPair.rc894-full-stack{grid-template-columns:1fr!important}#rc383TopPair.rc894-full-stack>.rc363-process-block{grid-column:1/-1!important;grid-row:auto!important}}"
          if s.count(old_medium) != 1:
              raise SystemExit(f'Alte 1380px-Rasterregel: erwartet 1 Fundstelle, gefunden {s.count(old_medium)}')
          s = s.replace(old_medium, new_medium, 1)

          old_narrow = '@media(max-width:900px){#rc363BlockDocuments>.rc363-process-body[data-rc899-doc-abd="1"]{grid-template-columns:1fr!important}#rc573ShipmentShell,#rc363FixedShipmentLayout,.rc894-full-stack{max-width:100%!important}.rc894-full-stack{grid-template-columns:1fr!important}#rc383TopPair.rc894-full-stack>.rc363-process-block{grid-column:1/-1!important;grid-row:auto!important}#rc897LieferavisPanel .rc897-avis-summary{grid-template-columns:1fr!important}}'
          new_narrow = '@media(max-width:900px){#rc363BlockDocuments>.rc363-process-body[data-rc899-doc-abd="1"]{grid-template-columns:1fr!important}#rc573ShipmentShell,#rc363FixedShipmentLayout,.rc894-full-stack{max-width:100%!important}#rc897LieferavisPanel .rc897-avis-summary{grid-template-columns:1fr!important}}'
          if s.count(old_narrow) != 1:
              raise SystemExit(f'Alte 900px-Rasterregel: erwartet 1 Fundstelle, gefunden {s.count(old_narrow)}')
          s = s.replace(old_narrow, new_narrow, 1)

          if '@media(max-width:1380px){.rc894-full-stack' in s:
              raise SystemExit('Veraltete viewport-basierte 1380px-Rasterregel ist noch vorhanden')
          if s.count('@container rc978ShipmentLayout (max-width:1180px)') != 1:
              raise SystemExit('RC978 Medium-Container-Query fehlt oder ist doppelt')
          if s.count('@container rc978ShipmentLayout (max-width:760px)') != 1:
              raise SystemExit('RC978 Narrow-Container-Query fehlt oder ist doppelt')

          p.write_text(s, encoding='utf-8')
          print('RC978: Sendungsraster nutzt jetzt reale Inhaltsbreite und schließt die obere Kartenzeile.')
          PY

      - name: RC971 bis RC978 Regression
        run: node --test test/rc971-global-form-field-standard.test.mjs test/rc972-field-exception-audit.test.mjs test/rc973-long-text-autogrow.test.mjs test/rc975-global-render-integrity.test.mjs test/rc976-render-fallback-recovery.test.mjs test/rc977-colli-typography.test.mjs test/rc978-shipment-fluid-layout.test.mjs

      - name: RC978 committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          git diff --cached --check
          git commit -m "RC978: Sendungsraster ohne Zwischenhohlräume responsiv machen"
          git push origin HEAD:main
