              color:#1f4f75;
              cursor:pointer;
            }
            #rc885Workspace .rc885-list{
              display:grid;
              gap:8px;
            }
            #rc885Workspace .rc885-row{
              display:flex;
              gap:10px;
              align-items:flex-start;
              justify-content:space-between;
              padding:10px 11px;
              border:1px solid #e5ebf1;
              border-radius:11px;
              background:#fff;
            }
            #rc885Workspace .rc885-row-main{
              min-width:0;
            }
            #rc885Workspace .rc885-row-title{
              font-weight:780;
              color:#1e293b;
              white-space:nowrap;
              overflow:hidden;
              text-overflow:ellipsis;
            }
            #rc885Workspace .rc885-row-sub{
              margin-top:3px;
              font-size:12px;
              color:#64748b;
            }
            #rc885Workspace .rc885-prio{
              flex:0 0 auto;
              border-radius:999px;
              padding:4px 8px;
              font-size:11px;
              font-weight:850;
              background:#fff1f2;
              color:#be123c;
            }
            #rc885Workspace .rc885-empty{
              padding:16px 10px;
              color:#64748b;
              font-size:13px;
            }
          
            #rc885WarningButton{
              position:fixed;
              top:14px;
              right:18px;
              z-index:1900;
              display:flex;
              align-items:center;
              gap:8px;
              border:1px solid #c7d8e7;
              border-radius:12px;
              background:#fff;
              box-shadow:0 8px 22px rgba(15,23,42,.12);
              padding:8px 11px;
              color:#17324d;
              font-weight:800;
              cursor:pointer;
            }
            #rc885WarningButton .rc885-warning-count{
              min-width:24px;
              height:24px;
              border-radius:999px;
              display:inline-flex;
              align-items:center;
              justify-content:center;
              padding:0 6px;
              background:#dc2626;
              color:#fff;
              font-size:11px;
            }
          
            #rc885WarningDrawer{
              position:fixed;
              inset:0;
              z-index:2500;
              display:none;
              background:rgba(15,23,42,.28);
            }
            #rc885WarningDrawer[data-open="1"]{display:block}
            #rc885WarningDrawer .rc885-drawer{
              position:absolute;
              right:0;
              top:0;
              bottom:0;
              width:min(430px,94vw);
              background:#fff;
              box-shadow:-14px 0 38px rgba(15,23,42,.18);
              display:flex;
              flex-direction:column;
            }
            #rc885WarningDrawer .rc885-drawer-head{
              padding:18px;
              border-bottom:1px solid #e5ebf1;
              display:flex;
              justify-content:space-between;
              gap:14px;
              align-items:center;
            }
            #rc885WarningDrawer .rc885-drawer-title{
              font-size:20px;
              font-weight:900;
              color:#12263a;
            }
            #rc885WarningDrawer .rc885-close{
              border:1px solid #cbd9e7;
              background:#fff;
              border-radius:10px;
              padding:7px 10px;
              font-weight:750;
              cursor:pointer;
            }
            #rc885WarningDrawer .rc885-summary{
              display:grid;
              grid-template-columns:1fr 1fr;
              gap:9px;
              padding:14px 18px;
              border-bottom:1px solid #eef2f6;
            }
            #rc885WarningDrawer .rc885-summary-card{
              border:1px solid #e3e9ef;
              border-radius:12px;
              padding:10px;
              background:#f8fafc;
            }
            #rc885WarningDrawer .rc885-summary-label{
              font-size:11px;
              color:#64748b;
              font-weight:750;
            }
            #rc885WarningDrawer .rc885-summary-value{
              margin-top:3px;
              font-size:22px;
              font-weight:900;
              color:#17324d;
            }
            #rc885WarningDrawer .rc885-warning-list{
              padding:12px 18px 22px;
              overflow:auto;
              display:grid;
              gap:8px;
            }
            #rc885WarningDrawer .rc885-warning-item{
              border:1px solid #e5ebf1;
              border-radius:12px;
              padding:11px;
              background:#fff;
            }
            #rc885WarningDrawer .rc885-warning-item strong{
              display:block;
              color:#1e293b;
            }
            #rc885WarningDrawer .rc885-warning-item span{
              display:block;
              color:#64748b;
              font-size:12px;
              margin-top:3px;
            }
          
            @media (max-width:900px){
              #rc885Workspace .rc885-grid{grid-template-columns:1fr}
              #rc885Workspace .rc885-head{align-items:flex-start;flex-direction:column}
              #rc885WarningButton{top:10px;right:10px}
            }
          </style>
          
          <script id="exporthub-rc885-clean-workspace-script">
          (function(){
            'use strict';
          
            if(window.__EXPORTHUB_RC885_CLEAN_WORKSPACE__) return;
            window.__EXPORTHUB_RC885_CLEAN_WORKSPACE__ = true;
          
            var focus = 'all';
            var scheduled = 0;
          
            function q(v){return String(v==null?'':v).trim()}
            function low(v){return q(v).toLowerCase()}
            function arr(v){return Array.isArray(v)?v:[]}
            function esc(v){
              return q(v).replace(/[&<>"']/g,function(c){
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
              })
            }
          
            function getState(){
              try{
                if(typeof window.state==='function'){
                  var s=window.state();
                  if(s&&typeof s==='object') return s
                }
              }catch(_){}
              try{
                if(window.STATE&&typeof window.STATE==='object') return window.STATE
              }catch(_){}
              return {}
            }
          
            function firstArray(candidates){
              for(var i=0;i<candidates.length;i++){
                if(Array.isArray(candidates[i])) return candidates[i]
              }
              return []
            }
          
            function shipments(){
              var s=getState();
              return firstArray([
                s.shipments,
                s.savedShipments,
                s.shipmentList,
                s.saved,
                window.SHIPMENTS,
                window.shipments
              ])
            }
          
            function tasks(){
              var s=getState();
              return firstArray([
                s.tasks,
                s.taskList,
                s.todos,
                window.TASKS,
                window.tasks
              ])
            }
          
            function currentView(){
              var s=getState();
              return low(
                s.view ||
                document.body.getAttribute('data-exporthub-view') ||
                document.body.getAttribute('data-current-view')
              )
            }
          
            function isDashboard(){
              var v=currentView();
              if(v==='dashboard'||v==='home'||v==='start') return true;
              var h=document.querySelector('main h1,main h2,#content h1,#content h2,.content h1,.content h2');
              return !!(h && /dashboard|startseite|übersicht/i.test(q(h.textContent)))
            }
          
            function mainHost(){
              return document.querySelector(
                '#dashboardView,#dashboard,#mainContent,#content,main,.main-content,.content'
              )
            }
          
            function routeTo(view){
              try{
                if(typeof window.route==='function'){
                  window.route(view,'rc885-workspace');
                  return true
                }
              }catch(_){}
          
              var labels={
                tasks:/^(meine\s+)?aufgaben$/i,
                shipmentoverview:/sendungsübersicht|meine sendungen|sendungen/i
              };
              var rx=labels[view];
              if(!rx) return false;
          
              var nodes=Array.prototype.slice.call(
                document.querySelectorAll('button,a,[role="button"]')
              );
              for(var i=0;i<nodes.length;i++){
                if(rx.test(q(nodes[i].textContent))){
                  try{nodes[i].click();return true}catch(_){}
                }
              }
              return false
            }
          
            function dateValue(obj){
              var keys=['dueDate','due','date','plannedPickupDate','pickupDate','plannedDate','createdAt'];
              for(var i=0;i<keys.length;i++){
                var v=obj&&obj[keys[i]];
                if(!v) continue;
                var d=new Date(v);
                if(!isNaN(d.getTime())) return d
              }
              return null
            }
          
            function dayKey(d){
              if(!d) return '';
              return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
            }
          
            function todayKey(){
              return dayKey(new Date())
            }
          
            function isDone(v){
              var s=low(
                (v&&v.status) ||
                (v&&v.state) ||
                (v&&v.taskStatus)
              );
              return !!(
                (v&&v.completed===true) ||
                (v&&v.done===true) ||
                /erledigt|abgeschlossen|archiviert|storniert|completed|done/.test(s)
              )
            }
          
            function itemTitle(v,fallback){
              return q(
                v && (
                  v.title ||
                  v.name ||
                  v.subject ||
                  v.reference ||
                  v.ref ||
                  v.shipmentRef ||
                  v.customerName ||
                  v.customer
                )
              ) || fallback
            }
          
            function customer(v){
              return q(v&&(v.customerName||v.customer||v.customerNo||v.customerNumber))
            }
          
            function status(v){
              return q(v&&(v.status||v.state||v.taskStatus))
            }
          
            function taskOpenList(){
              return tasks().filter(function(t){return t && !isDone(t)})
            }
          
            function shipmentOpenList(){
              return shipments().filter(function(s){return s && !isDone(s)})
            }
          
            function dueTask(t){
              var d=dateValue(t);
              if(!d) return false;
              return dayKey(d)<=todayKey()
            }
          
            function shipmentNeedsDocuments(s){
              var st=low(status(s));
              if(/wartet auf abd|abd/.test(st)) return true;
              var docs=s&&(s.documents||s.docs||s.files);
              if(Array.isArray(docs)){
                var names=docs.map(function(d){return low(d&& (d.name||d.fileName||d.type||d))}).join(' ');
                if(names && !/lieferschein|delivery/.test(names)) return true
              }
              return false
            }
          
            function shipmentNeedsPickup(s){
              var st=low(status(s));
              return /bereit.*abholung|erstellt|wartet auf abd/.test(st)
            }
          
            function shipmentNeedsPod(s){
              var st=low(status(s));
              return /abgeholt/.test(st) && !/pod vorhanden/.test(st)
            }
          
            function taskRows(){
              var list=taskOpenList();
          
              if(focus==='due') list=list.filter(dueTask);
              if(focus==='documents') list=list.filter(function(t){
                return /abd|dokument|lieferschein|cmr|pod/i.test(itemTitle(t,'')+' '+status(t))
              });
              if(focus==='pickup') list=list.filter(function(t){
                return /abhol|pickup/i.test(itemTitle(t,'')+' '+status(t))
              });
          
              return list.slice(0,5)
            }
          
            function shipmentRows(){
              var list=shipmentOpenList();
          
              if(focus==='due') list=list.filter(function(s){
                var d=dateValue(s);
                return d && dayKey(d)<=todayKey()
              });
              if(focus==='documents') list=list.filter(shipmentNeedsDocuments);
              if(focus==='pickup') list=list.filter(shipmentNeedsPickup);
          
              return list.slice(0,5)
            }
          
            function rowHtml(v,type){
              var title=itemTitle(v,type==='task'?'Aufgabe':'Sendung');
              var c=customer(v);
              var st=status(v);
              var d=dateValue(v);
              var sub=[c,st,d?d.toLocaleDateString('de-DE'):''].filter(Boolean).join(' · ');
              var urgent=(type==='task'&&dueTask(v))||(type==='shipment'&&d&&dayKey(d)<todayKey());
              return '<div class="rc885-row">'+
                '<div class="rc885-row-main">'+
                  '<div class="rc885-row-title">'+esc(title)+'</div>'+
                  '<div class="rc885-row-sub">'+esc(sub||'Offen')+'</div>'+
                '</div>'+
                (urgent?'<span class="rc885-prio">Fällig</span>':'')+
              '</div>'
            }
          
            function panelHtml(type){
              var isTask=type==='task';
              var rows=isTask?taskRows():shipmentRows();
              var total=isTask?taskOpenList().length:shipmentOpenList().length;
              var view=isTask?'tasks':'shipmentoverview';
              var title=isTask?'Meine Aufgaben':'Meine Sendungen';
          
              return '<section class="rc885-panel">'+
                '<div class="rc885-panel-head">'+
                  '<div class="rc885-panel-title">'+
                    '<span>'+esc(title)+'</span>'+
                    '<span class="rc885-badge">'+total+'</span>'+
                  '</div>'+
                  '<button type="button" class="rc885-open" data-rc885-route="'+view+'">Öffnen</button>'+
                '</div>'+
                '<div class="rc885-list">'+
                  (rows.length?rows.map(function(v){return rowHtml(v,type)}).join(''):
                  '<div class="rc885-empty">'+
                    (isTask?'Keine passenden offenen Aufgaben.':'Keine passenden offenen Sendungen.')+
                  '</div>')+
                '</div>'+
              '</section>'
            }
          
            function workspaceHtml(){
              var labels=[
                ['all','Alles'],
                ['due','Fällig'],
                ['documents','Dokumente'],
                ['pickup','Abholung']
              ];
              return '<section id="rc885Workspace">'+
                '<div class="rc885-head">'+
                  '<div>'+
                    '<div class="rc885-kicker">Persönlicher Arbeitsplatz</div>'+
                    '<h2>Mein Arbeitsfokus</h2>'+
                    '<div class="rc885-sub">Aufgaben und Sendungen werden bewusst getrennt angezeigt.</div>'+
                  '</div>'+
                  '<div class="rc885-focus" aria-label="Arbeitsfokus">'+
                    labels.map(function(x){
                      return '<button type="button" data-rc885-focus="'+x[0]+'" aria-pressed="'+(focus===x[0]?'true':'false')+'">'+x[1]+'</button>'
                    }).join('')+
                  '</div>'+
                '</div>'+
                '<div class="rc885-grid">'+panelHtml('task')+panelHtml('shipment')+'</div>'+
              '</section>'
            }
          
            function warningData(){
              var ts=taskOpenList();
              var ss=shipmentOpenList();
          
              var overdueTasks=ts.filter(dueTask);
              var docs=ss.filter(shipmentNeedsDocuments);
              var pickups=ss.filter(shipmentNeedsPickup);
              var pods=ss.filter(shipmentNeedsPod);
          
              var items=[];
          
              overdueTasks.slice(0,3).forEach(function(t){
                items.push({
                  title:itemTitle(t,'Überfällige Aufgabe'),
                  sub:'Aufgabe fällig',
                  route:'tasks'
                })
              });
          
              docs.slice(0,2).forEach(function(s){
                items.push({
                  title:itemTitle(s,'Sendung'),
                  sub:'Dokumente prüfen',
                  route:'shipmentoverview'
                })
              });
          
              pods.slice(0,2).forEach(function(s){
                items.push({
                  title:itemTitle(s,'Sendung'),
                  sub:'POD fehlt',
                  route:'shipmentoverview'
                })
              });
          
              pickups.slice(0,2).forEach(function(s){
                items.push({
                  title:itemTitle(s,'Sendung'),
                  sub:'Abholung offen',
                  route:'shipmentoverview'
                })
              });
          
              return {
                overdue:overdueTasks.length,
                documents:docs.length,
                pod:pods.length,
                pickup:pickups.length,
                total:overdueTasks.length+docs.length+pods.length+pickups.length,
                items:items.slice(0,8)
              }
            }
          
            function ensureWarningUi(){
              var d=warningData();
          
              var btn=document.getElementById('rc885WarningButton');
              if(!btn){
                btn=document.createElement('button');
                btn.type='button';
                btn.id='rc885WarningButton';
                document.body.appendChild(btn)
              }
              btn.innerHTML='Warncenter <span class="rc885-warning-count">'+d.total+'</span>';
          
              var drawer=document.getElementById('rc885WarningDrawer');
              if(!drawer){
                drawer=document.createElement('div');
                drawer.id='rc885WarningDrawer';
                drawer.innerHTML=
                  '<div class="rc885-drawer">'+
                    '<div class="rc885-drawer-head">'+
                      '<div><div class="rc885-drawer-title">Warncenter</div><div class="rc885-sub">Nur Punkte mit Handlungsbedarf</div></div>'+
                      '<button type="button" class="rc885-close">Schließen</button>'+
                    '</div>'+
                    '<div class="rc885-summary"></div>'+
                    '<div class="rc885-warning-list"></div>'+
                  '</div>';
                document.body.appendChild(drawer)
              }
          
              var summary=drawer.querySelector('.rc885-summary');
              if(summary){
                summary.innerHTML=[
                  ['Fällige Aufgaben',d.overdue],
                  ['Dokumente',d.documents],
                  ['POD fehlt',d.pod],
                  ['Abholung',d.pickup]
                ].map(function(x){
                  return '<div class="rc885-summary-card"><div class="rc885-summary-label">'+esc(x[0])+'</div><div class="rc885-summary-value">'+x[1]+'</div></div>'
                }).join('')
              }
          
              var list=drawer.querySelector('.rc885-warning-list');
              if(list){
                list.innerHTML=d.items.length?d.items.map(function(x){
                  return '<button type="button" class="rc885-warning-item" data-rc885-route="'+esc(x.route)+'">'+
                    '<strong>'+esc(x.title)+'</strong>'+
                    '<span>'+esc(x.sub)+'</span>'+
                  '</button>'
                }).join(''):'<div class="rc885-empty">Aktuell kein dringender Handlungsbedarf.</div>'
              }
            }
          
            function mountWorkspace(){
              if(!isDashboard()) {
                var old=document.getElementById('rc885Workspace');
                if(old) old.remove();
                return
              }
          
              var host=mainHost();
              if(!host) return;
          
              var existing=document.getElementById('rc885Workspace');
              var html=workspaceHtml();
          
              if(existing){
                var tmp=document.createElement('div');
                tmp.innerHTML=html;
                existing.replaceWith(tmp.firstElementChild)
              }else{
                var wrap=document.createElement('div');
                wrap.innerHTML=html;
                var node=wrap.firstElementChild;
                if(host.firstElementChild) host.insertBefore(node,host.firstElementChild);
                else host.appendChild(node)
              }
            }
          
            function refresh(){
              scheduled=0;
              try{
                mountWorkspace();
                ensureWarningUi()
              }catch(e){
                console.error('RC885 workspace:',e)
              }
            }
          
            function schedule(){
              if(scheduled) return;
              scheduled=window.setTimeout(refresh,80)
            }
          
            document.addEventListener('click',function(ev){
              var focusBtn=ev.target&&ev.target.closest&&ev.target.closest('[data-rc885-focus]');
              if(focusBtn){
                focus=focusBtn.getAttribute('data-rc885-focus')||'all';
                refresh();
                return
              }
          
              var routeBtn=ev.target&&ev.target.closest&&ev.target.closest('[data-rc885-route]');
              if(routeBtn){
                var view=routeBtn.getAttribute('data-rc885-route');
                var drawer=document.getElementById('rc885WarningDrawer');
                if(drawer) drawer.setAttribute('data-open','0');
                routeTo(view)
              }
          
              if(ev.target&&ev.target.closest&&ev.target.closest('#rc885WarningButton')){
                var d=document.getElementById('rc885WarningDrawer');
                if(d) d.setAttribute('data-open','1')
              }
          
              if(ev.target&&ev.target.closest&&ev.target.closest('#rc885WarningDrawer .rc885-close')){
                var dr=document.getElementById('rc885WarningDrawer');
                if(dr) dr.setAttribute('data-open','0')
              }
          
              if(ev.target&&ev.target.id==='rc885WarningDrawer'){
                ev.target.setAttribute('data-open','0')
              }
            },true);
          
            var mo=new MutationObserver(schedule);
            mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['data-exporthub-view','data-current-view']});
          
            window.addEventListener('hashchange',schedule);
            window.addEventListener('popstate',schedule);
            window.setInterval(schedule,2500);
          
            if(document.readyState==='loading'){
              document.addEventListener('DOMContentLoaded',refresh,{once:true})
            }else{
              refresh()
            }
          })();
          </script>
          '''

          pos = src.lower().rfind("</body>")
          if pos < 0:
              raise SystemExit("</body> fehlt.")

          src = src[:pos] + module + "\n" + src[pos:]
          p.write_text(src, encoding="utf-8")
          print("RC885 Workspace-Modul eingefügt.")
          PY

      - name: RC885 safety and syntax tests
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "version:'RC885',cache:'885',loginReturn:'/TESTVERSION.html?v=885'" TESTVERSION.html
          grep -Fq "<!-- exporthub-rc885-clean-workspace -->" TESTVERSION.html
          grep -Fq 'id="rc885Workspace"' TESTVERSION.html
          grep -Fq 'Meine Aufgaben' TESTVERSION.html
          grep -Fq 'Meine Sendungen' TESTVERSION.html
          grep -Fq 'Warncenter' TESTVERSION.html
          grep -Fq 'data-rc885-focus' TESTVERSION.html
          grep -Fq "routeTo(view)" TESTVERSION.html

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          src = Path("TESTVERSION.html").read_text(encoding="utf-8", errors="replace")

          class V(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script = 0
                  self.style = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  t = tag.lower()
                  if t == "script": self.script += 1
                  elif t == "style": self.style += 1
              def handle_endtag(self, tag):
                  t = tag.lower()
                  if t == "script" and self.script: self.script -= 1
                  elif t == "style" and self.style: self.style -= 1
              def handle_data(self, data):
                  if not self.script and not self.style:
                      self.parts.append(data)

          p = V()
          p.feed(src)
          p.close()
          visible = "\n".join(p.parts)

          leaks = [
              "function applyFixedBlocks()",
              "function canonicalActionButtons(",
              "function createQr(",
              "window.open('about:blank'",
              'window.open("about:blank"',
              "function warningData()",
              "function mountWorkspace()",
          ]
          bad = [x for x in leaks if x in visible]
          if bad:
              raise SystemExit("JavaScript als sichtbarer Seitentext gefunden: " + ", ".join(bad))

          m = re.search(
              r'<script id="exporthub-rc885-clean-workspace-script">(.*?)</script>',
              src,
              flags=re.S
          )
          if not m:
              raise SystemExit("RC885 Scriptblock nicht gefunden.")

          js = m.group(1)
          with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as f:
              f.write(js)
              name = f.name

          r = subprocess.run(["node", "--check", name], text=True, capture_output=True)
          if r.returncode != 0:
              raise SystemExit("RC885 JavaScript-Syntaxfehler:\n" + r.stderr)

          if src.lower().count("</body>") != 1:
              raise SystemExit("HTML besitzt nicht genau einen </body>-Abschluss.")

          print("RC885 Sicherheits- und Syntaxprüfung: PASS")
          PY

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- \
            index.html \
            production-version.js \
            api \
            pickup.html \
            location.html \
            customer-avis.html \
            staticwebapp.config.json \
            staticwebapp.testservice.config.json
          then
            echo "::error::Produktions-/API-Dateien wurden verändert."
            exit 1
          fi

          mapfile -t CHANGED < <(git diff --name-only)

          [[ "${#CHANGED[@]}" -eq 1 && "${CHANGED[0]}" == "TESTVERSION.html" ]] || {
            echo "::error::RC885 darf ausschließlich TESTVERSION.html ändern."
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          }

      - name: Commit RC885 clean workspace
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC885: clean personal workspace"
          git push origin main

      - name: Snapshot TESTSERVICE deploy runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --workflow exporthub-testservice.yml \
            --limit 50 \
            --json databaseId \
            --jq '.[].databaseId' > /tmp/testservice_runs_before.txt || true

      - name: Dispatch TESTSERVICE deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/exporthub-testservice.yml/dispatches" \
            -f ref=main

      - name: Wait for TESTSERVICE RC885 deploy
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID=""

          for attempt in $(seq 1 60); do
            mapfile -t IDS < <(
              gh run list \
                --workflow exporthub-testservice.yml \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId \
                --jq '.[].databaseId'
            )

            for id in "${IDS[@]}"; do
              if ! grep -qx "${id}" /tmp/testservice_runs_before.txt 2>/dev/null; then
                RUN_ID="${id}"
                break
              fi
            done

            [[ -n "${RUN_ID}" ]] && break
            sleep 5
          done

          [[ -n "${RUN_ID}" ]] || {
            echo "::error::TESTSERVICE-Deploy wurde nicht gefunden."
            exit 1
          }

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          gh run watch "${RUN_ID}" --exit-status

      - name: Verify deploy success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ steps.deploy.outputs.run_id }}
        run: |
          set -euo pipefail
          CONCLUSION="$(gh run view "${DEPLOY_RUN_ID}" --json conclusion --jq '.conclusion')"
          [[ "${CONCLUSION}" == "success" ]] || exit 1
          echo "RC885 TESTSERVICE Deploy erfolgreich."

      - name: RC885 summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ExportHUB RC885 – Clean Workspace"
            echo
            echo "- Basis: **RC884**"
            echo "- Nur TESTVERSION.html geändert"
            echo "- Produktion / APIs unverändert"
            echo "- Arbeitsübergabe: **nicht enthalten**"
            echo "- Persönlicher Arbeitsplatz: **neu**"
            echo "- Meine Aufgaben / Meine Sendungen: **getrennt**"
            echo "- Arbeitsfokus: **deutlich markiert**"
            echo "- Warncenter: **kompakter Drawer statt langer Kartenliste**"
            echo "- Sendung erstellen: **noch nicht verändert – folgt separat in RC886**"
            echo
            echo "Nach dem Deploy Testseite mit **Strg + F5** laden und zuerst das Dashboard prüfen."
          } >> "$GITHUB_STEP_SUMMARY"
