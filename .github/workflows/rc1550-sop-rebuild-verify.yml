name: RC1550 SOP Rebuild Verify

on:
  push:
    branches:
      - feature/rc1550-sop-rebuild-current
    paths:
      - 'assets/sop/rc1007-sop-model.js'
      - 'assets/sop/rc1550-sop-*.js'
      - 'assets/sop/rc1550-sop.css'
      - 'assets/sop/screenshots/bsh/**'
      - 'test/rc1550-sop-*.test.mjs'
      - '.github/rc1550/**'
      - '.github/packmeldungen/build-three-env.mjs'
      - '.github/workflows/rc1550-sop-rebuild-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc1550-sop-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-bsh-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Decode and validate staged BSH screenshot archive
        shell: bash
        run: |
          set -euo pipefail
          chunks=(
            .github/rc1550/bsh-upload/part-00
            .github/rc1550/bsh-upload/part-01
            .github/rc1550/bsh-upload/part-02
            .github/rc1550/bsh-upload/part-03
            .github/rc1550/bsh-upload/part-04
            .github/rc1550/bsh-upload/part-05
            .github/rc1550/bsh-upload/part-06
            .github/rc1550/bsh-upload/part-07_08
            .github/rc1550/bsh-upload/part-09_10
            .github/rc1550/bsh-upload/part-11_12
            .github/rc1550/bsh-upload/part-13_14
          )
          for chunk in "${chunks[@]}"; do test -s "$chunk" || { echo "Fehlender Archivteil: $chunk"; exit 1; }; done
          python - <<'PY'
          from pathlib import Path
          import base64, binascii, re
          paths = [
            '.github/rc1550/bsh-upload/part-00',
            '.github/rc1550/bsh-upload/part-01',
            '.github/rc1550/bsh-upload/part-02',
            '.github/rc1550/bsh-upload/part-03',
            '.github/rc1550/bsh-upload/part-04',
            '.github/rc1550/bsh-upload/part-05',
            '.github/rc1550/bsh-upload/part-06',
            '.github/rc1550/bsh-upload/part-07_08',
            '.github/rc1550/bsh-upload/part-09_10',
            '.github/rc1550/bsh-upload/part-11_12',
            '.github/rc1550/bsh-upload/part-13_14',
          ]
          allowed = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          pieces=[]
          any_bad=False
          for path in paths:
              raw=Path(path).read_text('utf-8')
              clean=''.join(raw.split())
              bad=[(i, repr(ch), ord(ch)) for i,ch in enumerate(clean) if ch not in allowed]
              print(f'{path}: len={len(clean)} mod4={len(clean)%4} start={clean[:12]!r} end={clean[-12:]!r} invalid={bad[:12]}')
              if bad: any_bad=True
              pieces.append(clean)
          data=''.join(pieces)
          print(f'assembled: len={len(data)} mod4={len(data)%4} padding={data.count("=")}')
          Path('/tmp/bsh-screenshots.tar.gz.b64').write_text(data, encoding='ascii', errors='strict')
          if any_bad:
              raise SystemExit('Nicht-Base64-Zeichen in Staging-Chunks gefunden')
          try:
              decoded=base64.b64decode(data, validate=True)
          except binascii.Error as exc:
              raise SystemExit(f'Base64-Struktur ungueltig: {exc}')
          Path('/tmp/bsh-screenshots.tar.gz').write_bytes(decoded)
          print(f'decoded bytes={len(decoded)} magic={decoded[:8].hex()}')
          PY
          gzip -t /tmp/bsh-screenshots.tar.gz
          rm -rf /tmp/bsh-extract
          mkdir -p /tmp/bsh-extract
          tar -xzf /tmp/bsh-screenshots.tar.gz -C /tmp/bsh-extract
          required=(
            01-portaluebersicht.png
            02-funktion-auswaehlen.png
            03-kunde-werk.png
            04-hinzufuegen.png
            05-werk-termin.png
            06-verpackungsdaten.png
            07-exporthub-referenz.png
            08-lieferavis-anlegen.png
            09-lieferscheine-mengen.png
            10-sendungsnummer-erstellen.png
            11-erfolgsbestaetigung.png
          )
          rm -rf assets/sop/screenshots/bsh
          mkdir -p assets/sop/screenshots/bsh
          for name in "${required[@]}"; do
            src="$(find /tmp/bsh-extract -type f -name "$name" -print -quit)"
            test -n "$src" || { echo "Pflichtbild fehlt im Archiv: $name"; find /tmp/bsh-extract -maxdepth 4 -type f -print; exit 1; }
            cp "$src" "assets/sop/screenshots/bsh/$name"
          done
          test "$(find assets/sop/screenshots/bsh -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 11
          node --test --test-concurrency=1 test/rc1550-sop-assets.test.mjs
      - name: Commit final BSH screenshot assets and remove staging fragments
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/rc1550/bsh-upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/sop/screenshots/bsh .github/rc1550/bsh-upload
          if git diff --cached --quiet; then
            echo 'Keine Asset-Aenderungen zu committen.'
          else
            git commit -m 'feat: add BSH SOP screenshots'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  compatibility:
    needs: materialize-bsh-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1550 targeted regression
        run: >-
          node --test --test-concurrency=1
          test/rc1550-sop-model.test.mjs
          test/rc1550-sop-catalog.test.mjs
          test/rc1550-sop-assets.test.mjs
          test/rc1550-sop-runtime-isolation.test.mjs
          test/rc1550-sop-ui.test.mjs
          test/rc1550-sop-responsive.test.mjs
          test/rc1550-sop-build.test.mjs
      - name: Full Node regression
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee rc1550-node-regression.log
      - name: Upload Node log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc1550-node-regression
          path: rc1550-node-regression.log
          if-no-files-found: ignore
          retention-days: 14
