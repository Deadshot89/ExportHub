name: RC1510 Targeted Customer Contacts Off-View Sync Regression

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'assets/rc1092-customer-mail-contacts.js'
      - 'test/rc1510-customer-contacts-offview-sync-gate.test.mjs'
      - '.github/workflows/rc1510-targeted-regression.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: RC1510 targeted regression
        run: node --test test/rc1510-customer-contacts-offview-sync-gate.test.mjs
