name: Emergency POD Rescue XG4YNN

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/emergency-xg4ynn-pod-rescue.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  rescue:
    name: Recover production POD XG4YNN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile XG4YNN from durable POD archive
        shell: bash
        env:
          BASE_URL: https://wonderful-forest-0f315e310.7.azurestaticapps.net
          TARGET_ENV: production
          TARGET_REFERENCE: XG4YNN
        run: |
          set -euo pipefail
          set +x

          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-pod-backup-reconcile" \
              | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"

          payload='{"environment":"production","limit":25,"scanPageSize":25,"reference":"XG4YNN","drainAll":false,"continuationToken":""}'
          response_file="$(mktemp)"
          http_code="$(
            curl -sS -L -o "$response_file" -w '%{http_code}' \
              -H "Content-Type: application/json" \
              -H "x-exporthub-github-oidc: $oidc_token" \
              -H "x-exporthub-environment: $TARGET_ENV" \
              -d "$payload" \
              "$BASE_URL/api/pod-backup-reconcile" || true
          )"

          cat "$response_file" | node -e "
            let s='';
            process.stdin.on('data',c=>s+=c).on('end',()=>{
              let v={}; try{v=JSON.parse(s||'{}')}catch(e){console.error('Invalid reconcile response');process.exit(10)}
              const safe={
                httpStatus:Number(process.argv[1]||0), ok:v.ok, code:v.code, message:v.message,
                environment:v.environment, reference:v.reference, backupMode:v.backupMode,
                graphConfigured:v.graphConfigured, targetFolder:v.targetFolder,
                scanned:v.scanned, eligible:v.eligible, selected:v.selected,
                savedCount:v.savedCount, alreadySavedCount:v.alreadySavedCount,
                pendingCount:v.pendingCount, driveSavedCount:v.driveSavedCount,
                drivePendingCount:v.drivePendingCount, verifiedCount:v.verifiedCount,
                repairedStateCount:v.repairedStateCount,
                target:v.target && {
                  reference:v.target.reference, status:v.target.status,
                  matchedCount:v.target.matchedCount, podReadyCount:v.target.podReadyCount,
                  alreadySavedCount:v.target.alreadySavedCount,
                  savedNowCount:v.target.savedNowCount,
                  pendingCount:v.target.pendingCount, errorCount:v.target.errorCount
                }
              };
              console.log(JSON.stringify(safe));
              if(Number(process.argv[1]||0)<200||Number(process.argv[1]||0)>=300||!v.ok)process.exit(11);
              if(!v.target||Number(v.target.matchedCount||0)<1)process.exit(12);
              if(!['already-saved','saved-now'].includes(String(v.target.status||'')))process.exit(13);
            })
          " "$http_code"

          rm -f "$response_file"
