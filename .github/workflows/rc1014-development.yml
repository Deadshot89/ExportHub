name: RC1014 Development

on:
  push:
    branches: [rc1014-tasks-final]
    paths:
      - 'assets/rc1014-**'
      - 'test/rc1014-**'
      - 'browser/rc1014-**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'android-app/**'
      - '.github/rc1014/**'
      - '.github/workflows/rc1014-development.yml'

permissions:
  contents: read

concurrency:
  group: rc1014-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: RC1014 Lifecycle-Vertrag
        run: node --test test/rc1014-task-lifecycle.test.mjs
      - name: RC1014 Runtime-Integration
        run: node --test test/rc1014-task-runtime-integration.test.mjs
      - name: Diagnose bestehenden Aufgaben-Speicherpfad
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('TESTVERSION.html','utf8');
          const s=h.indexOf('function tasks(){');
          const e=h.indexOf('function taskSortRC67',s);
          const block=h.slice(s,e);
          const rx=/.{0,140}(?:save|persist|state\.tasks|tasks\s*=).{0,220}/gi;
          const hits=block.match(rx)||[];
          console.log(hits.slice(0,40).join('\n---\n'));
          NODE
