name: RC969 Conditional State Read Test

on:
  push:
    branches: [main]
    paths:
      - 'TESTVERSION.html'
      - 'api/exporthub-state/**'
      - '.github/workflows/rc969-conditional-state-read-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: RC969 Conditional Read Regression
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const assert=require('assert');
          const api=fs.readFileSync('api/exporthub-state/index.js','utf8');
          const html=fs.readFileSync('TESTVERSION.html','utf8');
          const fn=JSON.parse(fs.readFileSync('api/exporthub-state/function.json','utf8'));

          const apiVersion=Number((api.match(/const API_VERSION = 'RC(\d+)';/)||[])[1]||0);
          const frontendVersion=Number((html.match(/var BUILD=Object\.freeze\(\{version:'RC(\d+)'/)||[])[1]||0);
          assert(apiVersion>=969,'API_VERSION muss RC969 oder höher sein');
          assert(frontendVersion>=969,'TESTVERSION BUILD muss RC969 oder höher sein');
          assert.strictEqual(fn.scriptFile,'index.js','State-Function muss direkt index.js laden');
          assert(!fs.existsSync('api/exporthub-state/wrapper.js'),'RC931 Wrapper muss entfernt sein');
          assert(/mode==='ping'[\s\S]{0,500}serverVersion:API_VERSION/.test(api),'Ping muss echte serverVersion liefern');
          assert(/mode==='meta'[\s\S]{0,500}serverVersion:API_VERSION/.test(api),'Meta muss echte serverVersion liefern');

          const validatePos=api.indexOf('const current=await validateSession(req,payload,c),blob=c.team;');
          const notModifiedPos=api.indexOf('notModified:true');
          const readPos=api.indexOf("if(req.method==='GET'||(req.method==='POST'&&mode==='read'))");
          assert(validatePos>=0&&readPos>validatePos,'Read muss weiterhin nach vollständiger validateSession-Prüfung liegen');
          assert(notModifiedPos>readPos,'notModified darf erst im vollständig validierten Read-Pfad entstehen');
          assert(/knownRevision/.test(api),'API muss knownRevision auswerten');
          assert(/Number\(current\.team&&current\.team\.revision\|\|0\)/.test(api),'Serverrevision muss aus dem vollständig validierten Teamstand kommen');

          const stateCallPos=html.indexOf('function stateCall(mode,payload,requestOptions)');
          assert(stateCallPos>=0,'stateCall fehlt');
          const stateCall=html.slice(stateCallPos,stateCallPos+9000);
          assert(/mode==='read'/.test(stateCall)&&/knownRevision/.test(stateCall),'Read muss bekannte Revision mitsenden');
          assert(/runtime\.loaded/.test(stateCall)&&/runtime\.lastSnapshot/.test(stateCall),'Startup ohne geladenen Snapshot darf nicht conditional lesen');
          assert(/notModified/.test(stateCall)&&/runtime\.lastSnapshot/.test(stateCall),'notModified muss den bereits bestätigten Snapshot verwenden');

          console.log('RC969 conditional read regression OK');
          NODE
