name: ExportHUB TESTSERVICE Einzel-Deploy

# Standard ist ab RC1011 der gemeinsame Drei-Umgebungen-Deploy über
# azure-static-web-apps-wonderful-forest-0f315e310.yml.
# Ein einzelner TESTSERVICE-Deploy ist nur bei ausdrücklich genehmigter
# Abweichung von Produktion und Demo möglich.
on:
  workflow_dispatch:
    inputs:
      confirm_divergence:
        description: 'Nur für ausdrücklich erlaubte Abweichung exakt eingeben: ICH ERLAUBE EINE ABWEICHENDE TESTSERVICE-VERSION'
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: exporthub-testservice-explicit-only
  cancel-in-progress: false

jobs:
  deploy_testservice:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Abweichenden Einzel-Deploy absichern
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_divergence }}" != "ICH ERLAUBE EINE ABWEICHENDE TESTSERVICE-VERSION" ]; then
            echo 'Abweichender Einzel-Deploy ist gesperrt. Produktion, TESTSERVICE und Demo müssen denselben Versionsstand haben.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: RC1011 TESTSERVICE-Ausnahmevertrag prüfen
        run: |
          set -euo pipefail
          node --test test/rc1011-core-open-issues.test.mjs test/rc1011-three-env-sync.test.mjs test/rc1010-sop-release-readiness.test.mjs test/rc1010-three-env-sync.test.mjs test/rc1009-sop-selection-ui.test.mjs test/rc1008-system-sops.test.mjs test/rc1007-iso-sop-contract.test.mjs
          node --test .github/rc998/partial-pickup-avis-contract.test.mjs
          npm test
          node .github/rc1011/build-three-env.mjs
          grep -q 'ExportHUB RC1011 environment=testservice' dist-rc1011/TESTVERSION.html
          grep -q 'ExportHUB RC1011 environment=demo' dist-rc1011/demo.html
          grep -q "version:'RC1011'" dist-rc1011/TESTVERSION.html
          grep -q "version:'RC1011'" dist-rc1011/demo.html
          grep -q 'assets/sop/rc1010-sop-release.js' dist-rc1011/TESTVERSION.html
          grep -q 'assets/sop/rc1010-sop-release.js' dist-rc1011/demo.html
      - name: TESTSERVICE-Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rc1011_testservice_app
          mkdir -p .rc1011_testservice_app
          cp pickup.html customer-avis.html location.html pod-notfall.html production-version.js .rc1011_testservice_app/
          cp -R assets .rc1011_testservice_app/assets
          cp staticwebapp.testservice.config.json .rc1011_testservice_app/staticwebapp.config.json
          cp dist-rc1011/TESTVERSION.html .rc1011_testservice_app/index.html
          cp dist-rc1011/TESTVERSION.html .rc1011_testservice_app/TESTVERSION.html
          cp dist-rc1011/demo.html .rc1011_testservice_app/demo.html
          cp dist-rc1011/assets/exporthub-environment-hub.js .rc1011_testservice_app/assets/exporthub-environment-hub.js
          cp dist-rc1011/assets/exporthub-demo-bootstrap.js .rc1011_testservice_app/assets/exporthub-demo-bootstrap.js
      - name: Deploy TESTSERVICE explicit only
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1011_testservice_app
          api_location: api
          output_location: ''
          skip_app_build: true
          deployment_environment: testservice
