name: SOPMaster Training Browser Verify

on:
  push:
    branches:
      - design/sopmaster-training-tour-2026-10-12
    paths:
      - 'assets/sop/rc1503-sop-*'
      - 'assets/sop/rc1501-sop-tour-ui.js'
      - 'assets/sop/rc1501-sop-tour-runtime.js'
      - 'e2e/specs/sopmaster-training-exam.spec.mjs'
      - 'e2e/helpers/exporthub-browser.mjs'
      - '.github/rc1503/**'
      - '.github/workflows/sopmaster-training-browser-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sopmaster-training-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-exam-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Build RC1503 three-environment package
        run: node .github/rc1503/build-three-env.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium
      - name: Verify training exam and progress on desktop and mobile
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_ENTRY: '/demo.html'
        run: npx playwright test e2e/specs/sopmaster-training-exam.spec.mjs --project=desktop --project=mobile-standard
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sopmaster-rc1503-training-exam-debug
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
