name: RC1083 Autofix Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc1083-autofix-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AUTOFIX_SECRET: ${{ secrets.EXPORTHUB_AUTOFIX_CALLBACK_SECRET }}
    steps:
      - name: GitHub-Secrets vorhanden
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo 'OPENAI_API_KEY fehlt.' >&2; exit 1; }
          test -n "${AUTOFIX_SECRET:-}" || { echo 'EXPORTHUB_AUTOFIX_CALLBACK_SECRET fehlt.' >&2; exit 1; }

      - name: OpenAI-Key read-only validieren
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H 'Accept: application/json' \
            https://api.openai.com/v1/models || true)
          if [[ "$code" != '200' ]]; then
            echo "OpenAI-Key konnte nicht validiert werden (HTTP $code)." >&2
            head -c 400 "$body" | tr '\n' ' ' >&2 || true
            echo >&2
            exit 1
          fi
          echo 'OPENAI_API_KEY ist für einen read-only API-Aufruf gültig.'

      - name: ExportHUB Callback-Rückkanal validieren
        shell: bash
        run: |
          set -euo pipefail
          prod='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          testservice='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          for entry in "production|$prod" "testservice|$testservice"; do
            envName="${entry%%|*}"
            base="${entry#*|}"
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 \
              -X POST "$base/api/diagnostic-autofix" \
              -H 'Content-Type: application/json' \
              -H "X-ExportHUB-Autofix-Secret: $AUTOFIX_SECRET" \
              --data "$(jq -nc --arg e "$envName" '{action:"claim",jobId:"RC1083-PREFLIGHT-NONEXISTENT",environment:$e}')" || true)
            if [[ "$code" != '404' ]] || ! grep -q 'AUTOFIX_JOB_NOT_FOUND' "$body"; then
              echo "Callback-Vorflug fehlgeschlagen: $envName HTTP $code" >&2
              head -c 500 "$body" | tr '\n' ' ' >&2 || true
              echo >&2
              exit 1
            fi
            echo "Callback-Rückkanal $envName ist authentifiziert und erreicht den Diagnosespeicher."
            rm -f "$body"
          done
