name: ExportHUB PRODUCTION Deploy

# Produktion darf ausschließlich durch ein vollständiges Release-Center-Paket
# gestartet werden. Das Release-Center erzeugt/ändert bei jeder Freigabe
# production-version.js. Testservice-Uploads besitzen diese Datei nicht.
on:
  push:
    branches:
      - main
    paths:
      - 'production-version.js'

permissions:
  contents: read

concurrency:
  group: exporthub-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy ExportHUB production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
          fetch-depth: 2

      - name: Verify Release-Center production package
        shell: bash
        run: |
          set -euo pipefail

          echo "Prüfe Produktionsfreigabe ..."

          # Der Trigger darf nur von der Release-Center-Markierungsdatei kommen.
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" || true)"
          echo "$changed"
          echo "$changed" | grep -Fxq 'production-version.js' || {
            echo "FEHLER: production-version.js wurde in diesem Commit nicht geändert."
            exit 1
          }

          # Verbindliche Produktionsdateien.
          test -f index.html
          test -f production-version.js
          test -f staticwebapp.config.json
          test -f api/package.json
          test -f api/exporthub-state/index.js
          test -f api/exporthub-state/function.json
          test -f api/exporthub-health/index.js
          test -f api/exporthub-health/function.json
          test -f api/shared/merge.js

          node --check api/exporthub-state/index.js
          node --check api/exporthub-health/index.js
          node --check api/shared/merge.js
          node -e "JSON.parse(require('fs').readFileSync('api/exporthub-state/function.json','utf8'));JSON.parse(require('fs').readFileSync('api/exporthub-health/function.json','utf8'));JSON.parse(require('fs').readFileSync('staticwebapp.config.json','utf8'));"

          # Release-Center-Marker und die kanonische Build-Version müssen identisch sein.
          versions="$(python3 - <<'PY'
          import re
          from pathlib import Path

          marker = Path('production-version.js').read_text(encoding='utf-8', errors='ignore')
          index = Path('index.html').read_text(encoding='utf-8', errors='ignore')

          m_marker = re.search(r"__EXPORTHUB_PRODUCTION_VERSION_PROBE__\s*=\s*['\"](RC\d+)['\"]", marker)
          m_block = re.search(r'<script\s+id=["\']exporthub-canonical-build-source["\'][^>]*>(.*?)</script>', index, re.S | re.I)
          m_index = re.search(r"\bversion\s*:\s*['\"](RC\d+)['\"]", m_block.group(1) if m_block else '')

          if not m_marker:
              raise SystemExit('FEHLER: production-version.js enthält keine gültige RC-Version.')
          if not m_index:
              raise SystemExit('FEHLER: index.html enthält keine kanonische ExportHUB-Build-Version.')

          print(m_marker.group(1), m_index.group(1))
          PY
          )"

          marker_version="${versions%% *}"
          index_version="${versions##* }"
          echo "Release-Center Marker: $marker_version"
          echo "index.html Build:       $index_version"

          if [[ "$marker_version" != "$index_version" ]]; then
            echo "FEHLER: Produktionsmarker und index.html gehören nicht zur selben RC-Version."
            exit 1
          fi

          echo "OK: Release-Center Produktionspaket $index_version ist konsistent."

      - name: Deploy ExportHUB production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: ""
          skip_app_build: true

      - name: Verify live production API
        shell: bash
        run: |
          set -euo pipefail
          base="https://wonderful-forest-0f315e310.7.azurestaticapps.net"
          health="$base/api/exporthub-health"
          state="$base/api/exporthub-state"

          for attempt in {1..18}; do
            hcode=$(curl -sS -o /tmp/eh-health -w "%{http_code}" --max-time 15 "$health" || true)
            scode=$(curl -sS -o /tmp/eh-state -w "%{http_code}" -X OPTIONS --max-time 15 "$state" || true)
            echo "Live-Check $attempt/18: health=$hcode state-options=$scode"
            if [[ "$hcode" == "200" && "$scode" == "204" ]]; then
              echo "ExportHUB Produktion und State-API sind live."
              exit 0
            fi
            sleep 10
          done

          echo "FEHLER: Produktions-API wurde nach dem Deploy nicht vollständig bestätigt."
          echo "Health Antwort:"; cat /tmp/eh-health 2>/dev/null || true
          echo
          echo "State Antwort:"; cat /tmp/eh-state 2>/dev/null || true
          exit 1
