name: RC942 Verbleibende Standortquelle Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc942-targeted-source-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exakte Reststellen auf RC941 ausgeben
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC941',cache:'941',loginReturn:'/TESTVERSION.html?v=941'" in text

          needles=[
            "ls.push(Object.assign({},previous,{id:id,locationId:id,siteId:id,name:lname,address:address",
            "if(q(sh.locationId||sh.selectedLocationId||sh.siteId)||sh.locationData||sh.siteData)score+=6"
          ]
          for needle in needles:
              hits=[];p=0
              while True:
                  i=text.find(needle,p)
                  if i<0:break
                  hits.append(i);p=i+1
              print('\n=== NEEDLE ===')
              print(needle)
              print('COUNT=',len(hits))
              for i in hits:
                  before=text[max(0,i-9000):i]
                  funcs=list(re.finditer(r'function\s+([A-Za-z0-9_$]+)\s*\([^)]*\)\s*\{',before))
                  print('FUNCTION=',funcs[-1].group(1) if funcs else 'unbekannt','POS=',i)
                  print(text[max(0,i-3500):min(len(text),i+len(needle)+3500)].replace('\r',''))

          # Zeige alle Aufrufer der Funktion, in der der zweite Standort-Schreiber sitzt.
          pos=text.find(needles[0])
          if pos>=0:
              before=text[max(0,pos-12000):pos]
              funcs=list(re.finditer(r'function\s+([A-Za-z0-9_$]+)\s*\([^)]*\)\s*\{',before))
              if funcs:
                  name=funcs[-1].group(1)
                  print('\n=== CALLS OF',name,'===')
                  for m in re.finditer(re.escape(name)+r'\s*\(',text):
                      j=m.start(); print(text[max(0,j-1200):min(len(text),j+1800)].replace('\r',''))
          PY
      - name: Audit-Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc942-targeted-source-audit.yml
          git commit -m "RC942 temporären gezielten Audit entfernen"
          git push origin HEAD:main
