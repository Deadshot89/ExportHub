name: RC1557 clean no-op save fix

on:
  push:
    branches:
      - fix/rc1557-storage-noop-saves-clean

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: TDD red - regression must fail before implementation
        shell: bash
        run: |
          if node --test test/rc1557-storage-noop-save.test.mjs; then
            echo 'RC1557 regression unexpectedly passed before the fix.' >&2
            exit 1
          fi
          echo 'Expected failing regression confirmed.'

      - name: Apply minimal no-op guard
        run: node scripts/rc1557-apply-noop-guard.mjs

      - name: TDD green - targeted regression
        run: node --test test/rc1557-storage-noop-save.test.mjs

      - name: Syntax check State API
        run: node --check api/exporthub-state/index.js

      - name: Relevant state-save regressions
        run: >-
          node --test --test-concurrency=1
          test/p0-state-conditional-write-conflict.test.mjs
          test/rc1026-state-save-payload-performance.test.mjs
          test/rc1059-document-blob-store.test.mjs

      - name: Verify patch scope and whitespace
        shell: bash
        run: |
          git diff --check
          files=$(git diff --name-only origin/main | sort)
          printf '%s\n' "$files"
          unexpected=$(printf '%s\n' "$files" | grep -v -E '^(api/exporthub-state/index\.js|test/rc1557-storage-noop-save\.test\.mjs|scripts/rc1557-apply-noop-guard\.mjs|\.github/workflows/rc1557-clean-noop\.yml)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected RC1557 diff:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Remove one-shot helpers and verify final diff
        shell: bash
        run: |
          rm scripts/rc1557-apply-noop-guard.mjs
          rm .github/workflows/rc1557-clean-noop.yml
          final_files=$(git diff --name-only origin/main | sort)
          printf '%s\n' "$final_files"
          unexpected=$(printf '%s\n' "$final_files" | grep -v -E '^(api/exporthub-state/index\.js|test/rc1557-storage-noop-save\.test\.mjs)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected final RC1557 diff:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Commit clean implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/exporthub-state/index.js test/rc1557-storage-noop-save.test.mjs scripts/rc1557-apply-noop-guard.mjs .github/workflows/rc1557-clean-noop.yml
          git commit -m 'fix: skip unchanged ExportHUB team-state uploads'
          git push origin HEAD:fix/rc1557-storage-noop-saves-clean
