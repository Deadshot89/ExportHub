name: RC963 Render Performance Regression

on:
  push:
    branches:
      - main
    paths:
      - 'TESTVERSION.html'
      - 'tests/rc963-render-performance.test.cjs'
      - '.github/workflows/rc963-render-performance-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'TESTVERSION.html'
      - 'tests/rc963-render-performance.test.cjs'

permissions:
  contents: read

jobs:
  rc963_render_performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run RC963 render regression
        run: node tests/rc963-render-performance.test.cjs
