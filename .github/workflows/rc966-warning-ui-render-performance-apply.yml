name: RC966 Warning UI Render Performance Apply

on:
  push:
    paths:
      - '.github/workflows/rc966-warning-ui-render-performance-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: RED Test bestätigen
        shell: bash
        run: |
          set +e
          node tests/rc966-warning-ui-render-performance.test.cjs
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'RC966-Test war vor dem Patch bereits grün; Abbruch zum Schutz vor Doppelpatch.'
            exit 1
          fi
          echo 'RED bestätigt: Warncenter schreibt unverändertes HTML noch erneut.'

      - name: RC966 minimal patchen
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'TESTVERSION.html';
          let s = fs.readFileSync(file, 'utf8');

          const oldBuild = "var BUILD=Object.freeze({version:'RC965',cache:'965',loginReturn:'/TESTVERSION.html?v=965'});";
          const newBuild = "var BUILD=Object.freeze({version:'RC966',cache:'966',loginReturn:'/TESTVERSION.html?v=966'});";
          const ensureNeedle = '  function ensureWarningUi(){';
          const helper = "  /* exporthub-rc966-warning-ui-diff */ function rc966PatchHtml(node,html){if(!node)return false;html=String(html==null?'':html);if(node.getAttribute('data-rc966-html')===html)return false;node.innerHTML=html;node.setAttribute('data-rc966-html',html);return true}\n\n";
          const oldButton = "btn.innerHTML='Warncenter <span class=\"rc885-warning-count\">'+d.total+'</span>';";
          const newButton = "rc966PatchHtml(btn,'Warncenter <span class=\"rc885-warning-count\">'+d.total+'</span>');";

          function count(text, needle) { return text.split(needle).length - 1; }
          if (count(s, oldBuild) !== 1) throw new Error('RC965 Build-Kennung nicht exakt einmal gefunden.');
          if (count(s, ensureNeedle) !== 1) throw new Error('ensureWarningUi nicht exakt einmal gefunden.');
          if (count(s, oldButton) !== 1) throw new Error('Warncenter-Button-DOM-Write nicht exakt einmal gefunden.');
          if (s.includes('exporthub-rc966-warning-ui-diff')) throw new Error('RC966 Patch ist bereits vorhanden.');

          s = s.replace(oldBuild, newBuild);
          const ensurePos = s.indexOf(ensureNeedle);
          s = s.slice(0, ensurePos) + helper + s.slice(ensurePos);
          s = s.replace(oldButton, newButton);

          const ensureAfter = s.indexOf('function ensureWarningUi(){');
          const drawerPos = s.indexOf('drawer.innerHTML=', ensureAfter);
          const mountPos = s.indexOf('function mountWorkspace(){', ensureAfter);
          if (drawerPos < 0 || mountPos < 0 || drawerPos > mountPos) throw new Error('Warncenter-Drawer-Pfad nicht eindeutig gefunden.');
          if (s.indexOf('drawer.innerHTML=', drawerPos + 1) >= 0 && s.indexOf('drawer.innerHTML=', drawerPos + 1) < mountPos) throw new Error('Mehr als ein Drawer-DOM-Write im Warncenter gefunden.');

          s = s.slice(0, drawerPos) + 'rc966PatchHtml(drawer,' + s.slice(drawerPos + 'drawer.innerHTML='.length);
          const mountAfter = s.indexOf('function mountWorkspace(){', ensureAfter);
          const closePos = s.lastIndexOf('}', mountAfter);
          if (closePos < drawerPos) throw new Error('Ende von ensureWarningUi nicht gefunden.');
          s = s.slice(0, closePos) + ')\n            ' + s.slice(closePos);

          fs.writeFileSync(file, s);
          const after = fs.readFileSync(file, 'utf8');
          if (count(after, newBuild) !== 1) throw new Error('RC966 Build-Kennung wurde nicht sauber gesetzt.');
          if (count(after, 'exporthub-rc966-warning-ui-diff') !== 1) throw new Error('RC966 Marker fehlt oder ist doppelt.');
          if (after.includes(oldButton)) throw new Error('Alter Button-DOM-Write ist noch vorhanden.');
          console.log('RC966 Minimalpatch geschrieben.');
          NODE

      - name: GREEN Regressionen
        run: |
          node tests/rc963-render-performance.test.cjs
          node tests/rc964-render-metrics.test.cjs
          node tests/rc965-avis-retry-performance.test.cjs
          node tests/rc966-warning-ui-render-performance.test.cjs
          git diff --check

      - name: Produktänderung committen
        shell: bash
        run: |
          if git diff --quiet -- TESTVERSION.html; then
            echo 'Keine Produktänderung vorhanden.'
            exit 1
          fi
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add TESTVERSION.html
          git commit -m 'RC966: unveränderte Warncenter-DOM-Writes überspringen'
          git push origin HEAD:main
