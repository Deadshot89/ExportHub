name: RC974 Render Leak Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc974-render-leak-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc974-render-leak-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: RC973-Blöcke aus printStow entfernen und strukturell sicher neu einsetzen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          path=Path('TESTVERSION.html')
          text=path.read_text(encoding='utf-8')

          build_rx=re.compile(r"(var BUILD=Object\.freeze\(\{version:')RC(\d+)(',cache:')(\d+)(')")
          m=build_rx.search(text)
          if not m:
              raise SystemExit('BUILD-Marker nicht gefunden.')
          version=int(m.group(2)); cache=int(m.group(4))
          if version != 973:
              raise SystemExit(f'Erwartet wurde RC973 als Ausgangsstand, gefunden RC{version}.')
          if cache < 973:
              raise SystemExit(f'Unerwarteter Cache-Stand {cache}.')

          style_rx=re.compile(
              r'<!--\s*RC973 LONG TEXT AUTO-GROW START\s*-->\s*'
              r'<style id="rc973-autogrow-long-text">[\s\S]*?</style>\s*'
              r'<!--\s*RC973 LONG TEXT AUTO-GROW STYLE END\s*-->\s*',
              re.I
          )
          script_rx=re.compile(
              r'<script id="exporthub-rc973-autogrow-long-text">[\s\S]*?</script>\s*'
              r'<!--\s*RC973 LONG TEXT AUTO-GROW END\s*-->\s*',
              re.I
          )

          sm=style_rx.search(text)
          jm=script_rx.search(text)
          if not sm or not jm:
              raise SystemExit('Die beiden RC973-Auto-Grow-Blöcke wurden nicht eindeutig gefunden.')
          if len(style_rx.findall(text)) != 1 or len(script_rx.findall(text)) != 1:
              raise SystemExit('RC973-Auto-Grow-Blöcke sind nicht eindeutig; Abbruch statt Mehrfachreparatur.')

          style=sm.group(0).strip()
          script=jm.group(0).strip()

          text=style_rx.sub('',text,count=1)
          text=script_rx.sub('',text,count=1)

          start=text.find('function printStow(){')
          end=text.find('function normalizeActionButtons',start)
          if start < 0 or end <= start:
              raise SystemExit('printStow-Bereich nicht eindeutig gefunden.')
          if re.search(r'RC973 LONG TEXT AUTO-GROW|rc973-autogrow-long-text|exporthub-rc973-autogrow-long-text',text[start:end],re.I):
              raise SystemExit('RC973-Marker befinden sich nach dem Entfernen weiterhin in printStow.')

          class Locator(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.head_end=None
                  self.body_start=None
                  self.body_raw=''
              def handle_endtag(self,tag):
                  if tag.lower()=='head' and self.head_end is None:
                      self.head_end=self.getpos()
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='body' and self.body_start is None:
                      self.body_start=self.getpos()
                      self.body_raw=self.get_starttag_text() or '<body>'

          loc=Locator()
          loc.feed(text)
          if not loc.head_end or not loc.body_start:
              raise SystemExit('Echter Dokument-Head/Body konnte mit HTMLParser nicht bestimmt werden.')

          lines=text.splitlines(keepends=True)
          offsets=[0]
          total=0
          for line in lines:
              total+=len(line)
              offsets.append(total)

          def absolute(pos):
              line,col=pos
              if line < 1 or line > len(lines):
                  raise SystemExit(f'Ungültige Parserposition: {pos}')
              return offsets[line-1]+col

          head_pos=absolute(loc.head_end)
          body_tag_start=absolute(loc.body_start)
          body_pos=body_tag_start+len(loc.body_raw)

          if head_pos <= 0 or body_pos <= head_pos:
              raise SystemExit('Unplausible Head-/Body-Positionen; keine Änderung geschrieben.')

          text=text[:head_pos]+style+'\n'+text[head_pos:]

          # Nach der Head-Einfügung verschiebt sich die Body-Position um die Länge des Styleblocks.
          body_pos += len(style)+1
          text=text[:body_pos]+'\n'+script+text[body_pos:]

          text=build_rx.sub(r"\1RC974\g<3>974\5",text,count=1)

          if text.count('id="rc973-autogrow-long-text"') != 1:
              raise SystemExit('RC973 Style ist nach der Reparatur nicht genau einmal vorhanden.')
          if text.count('id="exporthub-rc973-autogrow-long-text"') != 1:
              raise SystemExit('RC973 Script ist nach der Reparatur nicht genau einmal vorhanden.')

          start=text.find('function printStow(){')
          end=text.find('function normalizeActionButtons',start)
          if start < 0 or end <= start:
              raise SystemExit('printStow-Bereich nach Reparatur nicht eindeutig gefunden.')
          if re.search(r'RC973 LONG TEXT AUTO-GROW|rc973-autogrow-long-text|exporthub-rc973-autogrow-long-text',text[start:end],re.I):
              raise SystemExit('RC973 steckt nach der Reparatur weiterhin in printStow.')

          # Der Auto-Grow-Style muss vor dem echten Head-Ende stehen; das Script direkt im echten Body.
          style_pos=text.find('id="rc973-autogrow-long-text"')
          script_pos=text.find('id="exporthub-rc973-autogrow-long-text"')
          print_pos=text.find('function printStow(){')
          if not (0 < style_pos < script_pos < print_pos):
              raise SystemExit('RC973-Blöcke stehen nicht in der erwarteten sicheren Dokumentreihenfolge.')

          path.write_text(text,encoding='utf-8')
          print('RC974: RC973-Auto-Grow aus dem Stauplan-Druckstring entfernt und sicher im Dokument verankert.')
          PY

      - name: Vollständige RC971-RC974 Regression vor Commit
        run: node --test test/rc971-global-form-field-standard.test.mjs test/rc972-field-exception-audit.test.mjs test/rc973-long-text-autogrow.test.mjs

      - name: Änderungen committen
        shell: bash
        run: |
          if git diff --quiet -- TESTVERSION.html; then
            echo "Keine Änderung an TESTVERSION.html vorhanden."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          git commit -m "RC974: Render-Leak beheben und Stauplan-Funktionen wiederherstellen"
          git push origin HEAD:main
