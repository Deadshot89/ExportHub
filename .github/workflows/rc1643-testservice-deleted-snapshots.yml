name: RC1643 TESTSERVICE Soft-Deleted Snapshot Safety

on:
  pull_request:
    paths:
      - api/shared/testservice-team-inventory.js
      - test/rc1627-testservice-team-metadata-inventory.test.mjs
      - test/rc1643-testservice-deleted-snapshot-subtypes.test.mjs
      - .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml
      - .github/workflows/rc1643-testservice-deleted-snapshots.yml
  push:
    branches: [main]
    paths:
      - api/shared/testservice-team-inventory.js
      - test/rc1627-testservice-team-metadata-inventory.test.mjs
      - test/rc1643-testservice-deleted-snapshot-subtypes.test.mjs
      - .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml
      - .github/workflows/rc1643-testservice-deleted-snapshots.yml

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1643 safe snapshot/deleted subtype verification
        run: |
          node --check api/shared/testservice-team-inventory.js
          node --test --test-concurrency=1 test/rc1627-testservice-team-metadata-inventory.test.mjs test/rc1643-testservice-deleted-snapshot-subtypes.test.mjs
