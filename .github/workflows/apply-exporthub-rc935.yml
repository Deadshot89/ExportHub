name: Apply ExportHUB RC935

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exporthub-rc935.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply_rc935:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified RC934 to RC935 delta
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('TESTVERSION.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("var BUILD=Object.freeze({version:'RC934',cache:'934',loginReturn:'/TESTVERSION.html?v=934'});",
               "var BUILD=Object.freeze({version:'RC935',cache:'935',loginReturn:'/TESTVERSION.html?v=935'});"),
              ("changes:Object.freeze([\n    'RC934 hält",
               "changes:Object.freeze([\n    'RC935 beseitigt den letzten Standort-Alias-Drift beim Speichern und Synchronisieren: locationId, selectedLocationId, siteId und destinationId sowie Empfänger-, Liefer- und Zieladresse werden in allen Wiederherstellungspfaden gemeinsam gesetzt.',\n    'RC935 entfernt beim Zurücksetzen eines Standorts auch destinationId sowie Empfänger- und Zielland, damit kein alter Zielstandort unsichtbar in CMR, Ladeliste oder Mailbereich erhalten bleibt.',\n    'RC934 hält"),
              ("var location=q(saved.locationId||saved.selectedLocationId||saved.siteId),address=q(saved.recipientAddress);",
               "var location=q(saved.locationId||saved.selectedLocationId||saved.siteId||saved.destinationId),address=q(saved.recipientAddress||saved.deliveryAddress||saved.destinationAddress),country=q(saved.recipientCountry||saved.destinationCountry);"),
              ("if(location){sh.locationId=location;sh.selectedLocationId=location;sh.siteId=location}if(address)sh.recipientAddress=address;if(saved.locationData)",
               "if(location){sh.locationId=location;sh.selectedLocationId=location;sh.siteId=location;sh.destinationId=location}if(address){sh.recipientAddress=address;sh.deliveryAddress=address;sh.destinationAddress=address}if(country){sh.recipientCountry=country;sh.destinationCountry=country}if(saved.locationData)"),
              ("location=q(sh.locationId||sh.selectedLocationId||sh.siteId||saved.locationId||saved.selectedLocationId||saved.siteId||nested.id||nested.locationId||nested.siteId);",
               "location=q(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId||saved.locationId||saved.selectedLocationId||saved.siteId||saved.destinationId||nested.id||nested.locationId||nested.siteId),country=q(sh.recipientCountry||sh.destinationCountry||saved.recipientCountry||saved.destinationCountry||nested.country||nested.land||customer.country||customer.land);"),
              ("if(address){sh.recipientAddress=address;sh.destinationAddress=address}if(location){sh.locationId=location;sh.selectedLocationId=location;sh.siteId=location}if(saved.addressConfirmed",
               "if(address){sh.recipientAddress=address;sh.deliveryAddress=address;sh.destinationAddress=address}if(location){sh.locationId=location;sh.selectedLocationId=location;sh.siteId=location;sh.destinationId=location}if(country){sh.recipientCountry=country;sh.destinationCountry=country}if(saved.addressConfirmed"),
              ("['locationId','selectedLocationId','siteId','locationName','site','standort','recipientAddress','deliveryAddress','destinationAddress','destinationName','recipientName']",
               "['locationId','selectedLocationId','siteId','destinationId','locationName','site','standort','recipientAddress','deliveryAddress','destinationAddress','destinationName','recipientName','recipientCountry','destinationCountry']"),
          ]

          for index, (old, new) in enumerate(replacements, 1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'RC935 replacement {index}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          data = text.encode('utf-8')
          digest = hashlib.sha256(data).hexdigest()
          expected = '6143e186d439283ba0f9cb6a6ae3d42e57fb3a95dcb08588631b0a4dbc847f34'
          if digest != expected:
              raise SystemExit(f'RC935 SHA256 mismatch: {digest} != {expected}')
          if "version:'RC935',cache:'935'" not in text or "version:'RC934',cache:'934'" in text:
              raise SystemExit('RC935 BUILD verification failed')
          path.write_bytes(data)
          print('RC935 verified:', digest, len(data), 'bytes')
          PY

      - name: Verify TESTVERSION syntax markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "version:'RC935',cache:'935'" TESTVERSION.html
          grep -q "RC935 beseitigt den letzten Standort-Alias-Drift" TESTVERSION.html
          test "$(sha256sum TESTVERSION.html | awk '{print $1}')" = "6143e186d439283ba0f9cb6a6ae3d42e57fb3a95dcb08588631b0a4dbc847f34"

      - name: Commit RC935 and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-exporthub-rc935.yml
          git config user.name 'ExportHUB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TESTVERSION.html .github/workflows/apply-exporthub-rc935.yml
          git commit -m 'fix: update ExportHUB testversion to RC935'
          git push origin HEAD:main

      - name: Start TESTSERVICE deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail-with-body -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/exporthub-testservice.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'TESTSERVICE deploy dispatched.'
