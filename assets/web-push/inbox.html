<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08275c">
<title>ExportHUB Benachrichtigungen</title>
<link rel="icon" href="/assets/exporthub360-favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/assets/web-push/manifest.json">
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#2563eb;--brand-dark:#08275c;--ok:#15803d;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--text:#e2e8f0;--muted:#94a3b8;--line:#1e293b;--brand:#60a5fa;--ok:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
header{background:var(--brand-dark);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px}
header img{width:36px;height:36px;border-radius:9px}
header h1{font-size:18px;margin:0}
header p{margin:0;font-size:13px;opacity:.8}
.language-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 12px}
.language-bar label{font-size:13px;color:var(--muted)}
.language-bar select{font:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.is-current{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 25%,transparent)}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
h2{font-size:17px;margin:4px 0 6px}
.time{font-size:13px;color:var(--muted)}
.body{white-space:pre-line;margin:6px 0 0}
ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
li{border-top:1px solid var(--line);padding-top:8px}
li b{display:block}
li span{font-size:14px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
a.btn,button{appearance:none;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn,.primary{background:var(--brand);color:#fff}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.device{font-size:14px;color:var(--muted)}
.device strong{color:var(--text)}
.device .on{color:var(--ok)}
.device .off{color:var(--warn)}
</style>
</head>
<body>
<header><img src="/assets/web-push/icon-192.png" alt=""><div><h1 data-wp-text="inboxTitle">Benachrichtigungen</h1><p data-wp-text="inboxSubtitle">Auf diesem Gerät empfangen · ohne Anmeldung lesbar</p></div></header>
<main>
  <div class="language-bar"><label for="language" data-wp-text="languageLabel">Sprache</label><select id="language" name="language" aria-label="Sprache"><option value="de">Deutsch</option><option value="en">English</option><option value="pl">Polski</option><option value="es">Español</option><option value="fr">Français</option><option value="it">Italiano</option></select></div>
  <div id="list" aria-live="polite"><p class="empty" data-wp-text="inboxLoading">Wird geladen …</p></div>
  <section class="card device" id="device">
    <p><span data-wp-text="deviceStatusLabel">Status auf diesem Gerät:</span> <strong id="deviceStatus">wird geprüft …</strong></p>
    <div class="actions">
      <a class="btn" href="/" id="openApp" data-wp-text="openApp">In ExportHUB öffnen</a>
      <button type="button" class="ghost" id="disable" data-wp-text="inboxDisable" hidden>Benachrichtigungen auf diesem Gerät ausschalten</button>
    </div>
  </section>
</main>
<script src="/assets/i18n/web-push.js?v=1701"></script>
<script src="/assets/web-push/inbox.js"></script>
</body>
</html>
