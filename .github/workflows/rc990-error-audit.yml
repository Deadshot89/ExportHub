name: RC990 Error Audit

on:
  push:
    branches:
      - rc990-large-ux
    paths:
      - '.github/rc990_error_audit.py'
      - '.github/workflows/rc990-error-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc990-large-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize active RC990 error paths
        run: python .github/rc990_error_audit.py
      - name: Commit audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rc990_error_audit_result.txt
          git commit -m "diag: RC990 aktive Fehlerpfade materialisieren"
          git push origin HEAD:rc990-large-ux
