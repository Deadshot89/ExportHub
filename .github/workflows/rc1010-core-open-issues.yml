name: RC1010 Kernfehler prüfen

on:
  push:
    branches:
      - rc1010-core-open-issues
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aktuelle Paletten- und Rechtepfade diagnostizieren
        run: node .github/rc1010/diagnose.mjs
