name: ExportHUB RC1112 Main Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'demo.html'
      - 'production-version.js'
      - 'release-version.json'
      - 'pickup.html'
      - 'customer-avis.html'
      - 'location.html'
      - 'pod-notfall.html'
      - 'migration-recovery.html'
      - 'assets/**'
      - 'api/**'
      - 'android-app/**'
      - 'staticwebapp.config.json'
      - 'staticwebapp.testservice.config.json'
      - '.github/rc*/**'
      - '.github/workflows/**'
      - 'test/**'
      - 'e2e/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: exporthub-rc1112-three-env-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify_and_deploy_testservice:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GITHUB_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: RC1112 Freigabevertrag prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'" production-version.js
          node --check api/exporthub-state/index.js
          node --check .github/rc1505/verify-build-contract.mjs
          node --check .github/rc1505/verify-production-live.mjs
          node --test test/p0-state-conditional-write-conflict.test.mjs
          node .github/rc1018/apply-public-language.mjs
          node .github/rc1018/fix-mail-wording.mjs
          node --test --test-concurrency=1 test/rc1018-mail-language-standard.test.mjs test/rc1018-production-deploy.test.mjs
          node --test test/rc1017-three-env-release.test.mjs
          node --test --test-concurrency=1 test/rc1016-production-deploy.test.mjs test/rc1016-release-sync.test.mjs test/rc1016-sop-consolidation.test.mjs test/rc1016-demo-tasks.test.mjs
          node --test --test-concurrency=1 test/rc1014-task-lifecycle.test.mjs test/rc1014-task-runtime-integration.test.mjs test/rc1014-task-design.test.mjs test/rc1014-shipment-overview-meta.test.mjs test/rc1014-fixed-pickup-seed.test.mjs test/rc1014-demo-environment.test.mjs test/rc1014-demo-session-calendar.test.mjs
          node --test --test-concurrency=1 test/rc1015-lieferavis-mail-flow.test.mjs test/rc1013-restpunkte.test.mjs test/rc1013-three-env-sync.test.mjs test/rc1011-core-open-issues.test.mjs test/rc1011-project-isolation.test.mjs
          node --test test/rc1013-pickup-readonly-flow.test.mjs
          node --test --test-name-pattern='RC995 Pickup-PIN' .github/rc995/rc995-flow.test.cjs
          node --test --test-concurrency=1 .github/rc998/partial-pickup-avis-contract.test.mjs .github/rc1000/rc1000-production-pickup.test.mjs
          npm test

      - name: RC1112 Produktion TESTSERVICE und Demo gemeinsam bauen
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1112/build-three-env.mjs
          node .github/rc1121/verify-final-html.mjs
          node .github/rc1505/verify-build-contract.mjs
          grep -q 'ExportHUB RC1112 environment=production-candidate' dist-rc1112/index.html
          grep -q 'ExportHUB RC1112 environment=testservice' dist-rc1112/TESTVERSION.html
          grep -q 'ExportHUB RC1112 environment=demo' dist-rc1112/demo.html
          grep -q "version:'RC1112'" dist-rc1112/index.html
          grep -q "version:'RC1112'" dist-rc1112/TESTVERSION.html
          grep -q "version:'RC1112'" dist-rc1112/demo.html
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'" dist-rc1112/production-version.js
          grep -q 'assets/rc1015-lieferavis-mail-flow.js?v=1383' dist-rc1112/index.html
          grep -q 'assets/rc1018-mail-language-standard.js?v=1018' dist-rc1112/index.html
          grep -q 'assets/rc1065-registration-cc.js?v=1093' dist-rc1112/index.html
          grep -q 'assets/rc1014-shipment-overview.js?v=1370' dist-rc1112/index.html
          grep -q 'assets/rc1014-shipment-overview.css?v=1370' dist-rc1112/index.html
          test -s dist-rc1112/assets/rc1016-mobile-navigation.js
          test -s dist-rc1112/assets/rc1017-multi-truck.js
          test -s dist-rc1112/assets/rc1018-mail-language-standard.js
          test -s dist-rc1112/assets/rc1018-public-language.js
          test -s dist-rc1112/assets/abholkalender.js
          test -s dist-rc1112/assets/rc1012-abholkalender-runtime.js
          test -s dist-rc1112/assets/rc1027-lieferavis-immediate.js
          test -s dist-rc1112/assets/rc1037-lieferavis-timing-diagnostics.js
          test -s dist-rc1112/assets/rc1049-abd-avis-policy.js

      - name: RC1112 TESTSERVICE-Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rc1112_testservice_app
          mkdir -p .rc1112_testservice_app
          cp dist-rc1112/pickup.html dist-rc1112/customer-avis.html dist-rc1112/location.html dist-rc1112/pod-notfall.html dist-rc1112/migration-recovery.html .rc1112_testservice_app/
          cp dist-rc1112/production-version.js .rc1112_testservice_app/production-version.js
          cp -R assets .rc1112_testservice_app/assets
          cp -R dist-rc1112/assets/. .rc1112_testservice_app/assets/
          cp staticwebapp.testservice.config.json .rc1112_testservice_app/staticwebapp.config.json
          cp dist-rc1112/TESTVERSION.html .rc1112_testservice_app/index.html
          cp dist-rc1112/TESTVERSION.html .rc1112_testservice_app/TESTVERSION.html
          cp dist-rc1112/demo.html .rc1112_testservice_app/demo.html
          test -s .rc1112_testservice_app/index.html
          test -s .rc1112_testservice_app/demo.html
          test -s .rc1112_testservice_app/assets/rc1016-mobile-navigation.js
          test -s .rc1112_testservice_app/assets/rc1017-multi-truck.js
          test -s .rc1112_testservice_app/assets/rc1018-mail-language-standard.js
          test -s .rc1112_testservice_app/assets/rc1018-public-language.js

      - name: RC1124 Playwright installieren
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: RC1124 Lokales Browser-Gate
        id: rc1124_local_browser_gate
        shell: bash
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_ENTRY: /demo.html
          EXPORTHUB_E2E_PUBLIC_ENV: testservice
        run: |
          set -euo pipefail
          node --test test/rc1124-browser-release-gate.test.mjs test/rc1190-print-browser-gate.test.mjs test/rc1193-visible-release-version.test.mjs
          npx playwright test e2e/specs/navigation.spec.mjs e2e/specs/notifications.spec.mjs e2e/specs/public-smoke.spec.mjs e2e/specs/avis-reminder-outlook.spec.mjs
          npx playwright test e2e/specs/print-documents.spec.mjs --project=laptop
          EXPORTHUB_E2E_ENTRY=/index.html npx playwright test e2e/specs/version-display.spec.mjs --project=laptop
          EXPORTHUB_E2E_ENTRY=/TESTVERSION.html npx playwright test e2e/specs/version-display.spec.mjs --project=laptop

      - name: RC1124 Lokale Browser-Artefakte
        if: ${{ failure() && steps.rc1124_local_browser_gate.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: rc1124-local-browser-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: RC1381 TESTSERVICE stale-deploy guard
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -n "$remote_sha" ] && [ "$remote_sha" != "$GITHUB_SHA" ]; then
            git fetch --no-tags --depth=200 origin main
            changed="$(git diff --name-only "$GITHUB_SHA" "$remote_sha" || true)"
            deploy_relevant="$(printf '%s\n' "$changed" | grep -E '^(index\.html|TESTVERSION\.html|demo\.html|production-version\.js|release-version\.json|pickup\.html|customer-avis\.html|location\.html|pod-notfall\.html|migration-recovery\.html|assets/|api/|android-app/|staticwebapp\.config\.json|staticwebapp\.testservice\.config\.json|\.github/rc[0-9]+/|\.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310\.yml$|test/|e2e/|tests/|playwright\.config\.mjs$)' || true)"
            if [ -n "$deploy_relevant" ]; then
              echo "RC1381: veralteter Workflow darf TESTSERVICE nicht deployen. run=$GITHUB_SHA main=$remote_sha" >&2
              printf '%s\n' "$deploy_relevant" >&2
              exit 1
            fi
            echo "RC1396: neuerer main-Head enthält nur nicht-deploy-relevante Änderungen; TESTSERVICE-Deploy bleibt gültig. run=$GITHUB_SHA main=$remote_sha"
          fi

      - name: RC1553 deployment metadata - TESTSERVICE
        shell: bash
        run: |
          set -euo pipefail
          build_id="$(git rev-parse HEAD)"
          BUILD_ID="$build_id" DEPLOY_ENVIRONMENT='testservice' node -e "
            const fs=require('fs');
            const release=JSON.parse(fs.readFileSync('release-version.json','utf8'));
            const metadata={
              buildId:process.env.BUILD_ID,
              visibleRelease:String(release.visibleRelease||'').trim(),
              technicalBuild:String(release.technicalBuild||'').trim(),
              builtAt:new Date().toISOString(),
              environment:process.env.DEPLOY_ENVIRONMENT
            };
            if(!/^[0-9a-f]{40}$/i.test(metadata.buildId)||!metadata.visibleRelease||!metadata.technicalBuild)throw new Error('RC1553: unvollstaendige TESTSERVICE Deployment-Metadaten');
            fs.writeFileSync('api/release-metadata.json',JSON.stringify(metadata,null,2)+'\n');
          "
          test -s api/release-metadata.json
          node -e "const v=require('./api/release-metadata.json'); console.log('RC1553 TESTSERVICE deployment metadata',JSON.stringify({buildId:v.buildId,visibleRelease:v.visibleRelease,technicalBuild:v.technicalBuild,builtAt:v.builtAt,environment:v.environment}))"

      - name: Deploy ExportHUB TESTSERVICE
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EXPORT_HUB_EUROPE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1112_testservice_app
          api_location: api
          output_location: ''
          skip_app_build: true
          deployment_environment: testservice

      - name: RC1553 TESTSERVICE deployment identity prüfen
        shell: bash
        run: |
          set -euo pipefail
          base='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          expected="$(git rev-parse HEAD)"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          for attempt in {1..24}; do
            code="$(curl -sS -L -o "$body" -w '%{http_code}' --max-time 20 "$base/api/exporthub-health?rc1553=${expected}-${attempt}" || true)"
            if [ "$code" = '200' ] && EXPECTED_BUILD_ID="$expected" BODY="$body" node -e "const fs=require('fs'),v=JSON.parse(fs.readFileSync(process.env.BODY,'utf8')||'{}');if(v.deployment&&v.deployment.verified===true&&v.deployment.buildId===process.env.EXPECTED_BUILD_ID&&v.deployment.environment==='testservice')process.exit(0);process.exit(1)"; then
              echo "RC1553 TESTSERVICE deployment.buildId=$expected deployment.verified=true"
              exit 0
            fi
            sleep 5
          done
          cat "$body" >&2 || true
          echo "RC1553: TESTSERVICE deployment identity stimmt nicht mit $expected ueberein." >&2
          exit 1

      - name: RC1598 POD-Audit-API Live-Routing TESTSERVICE
        shell: bash
        run: |
          set -euo pipefail
          base='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          # RC1598: GET is explicitly routed to the real function, which must reject it
          # with its own JSON error before requiring any session or Azure Storage.
          status="$(curl -sS -L --max-time 20 -o "$response" -w '%{http_code}' \
            "$base/api/pod-quality-audit?rc1598=${GITHUB_SHA}" || true)"
          if [ "$status" != "405" ] || ! BODY="$response" node -e "
            const fs=require('fs');let data={};
            try{data=JSON.parse(fs.readFileSync(process.env.BODY,'utf8'))}catch(_){}
            if(data.ok!==false||data.code!=='METHOD_NOT_ALLOWED'||data.version!=='RC1577')process.exit(1);
          "; then
            echo "POD_AUDIT_ROUTE_MISSING/POD_AUDIT_ROUTE_FAILURE: TESTSERVICE /api/pod-quality-audit GET HTTP $status (erwartet 405 JSON METHOD_NOT_ALLOWED RC1577)."
            exit 1
          fi
          # Authentication must continue to block unauthenticated real reports.
          status="$(curl -sS -L --max-time 20 -o "$response" -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"action":"report"}' \
            "$base/api/pod-quality-audit?rc1598=${GITHUB_SHA}" || true)"
          if [ "$status" != "401" ]; then
            echo "POD_AUDIT_ROUTE_FAILURE: TESTSERVICE POST ohne Sitzung HTTP $status (erwartet 401)."
            exit 1
          fi
          echo "RC1598 TESTSERVICE POD Route liefert Funktions-405 und POST-Auth-401."

      - name: RC1591 Registrierungs-Automatik TESTSERVICE live nachweisen
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1591/verify-registration-live.mjs testservice

      - name: Release-Center aktive Testversion auf deployten Stand setzen
        shell: bash
        run: |
          set -euo pipefail
          base='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          ready=0
          page="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$page" "$response"' EXIT
          for attempt in {1..24}; do
            code="$(curl -sS -L -o "$page" -w '%{http_code}' --max-time 20 "$base/TESTVERSION.html?rc1153=${GITHUB_SHA}-${attempt}" || true)"
            if [ "$code" = "200" ] && grep -q "version:'RC1112'" "$page"; then
              ready=1
              break
            fi
            sleep 5
          done
          [ "$ready" = "1" ] || { echo 'RC1153: deploytes TESTVERSION.html meldet RC1112 nicht.' >&2; exit 1; }

          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-release-activate-test" \
            | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"
          echo "::add-mask::$oidc_token"

          payload='{"version":"RC1112","sha":"'"$GITHUB_SHA"'","title":"RC1112 TESTSERVICE Deploy"}'
          status="$(
            curl -sS \
              -o "$response" \
              -w '%{http_code}' \
              -X POST \
              -H 'Content-Type: application/json' \
              -H "x-exporthub-github-oidc: $oidc_token" \
              -d "$payload" \
              "$base/api/exporthub-release?action=activate-deployed-test"
          )"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat "$response" >&2
            echo "RC1153: Release-Center-Aktivierung HTTP $status" >&2
            exit 1
          fi
          node -e "const fs=require('fs'),v=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(v.ok!==true||v.test!=='RC1112')process.exit(2)" "$response"

          active="$(curl -fsS "$base/api/exporthub-release?action=active&channel=test&_=${GITHUB_SHA}")"
          ACTIVE="$active" node -e "const v=JSON.parse(process.env.ACTIVE);if(v.ok!==true||v.version!=='RC1112')throw new Error('Aktive Testversion ist '+String(v.version||'leer')+' statt RC1112')"
          echo 'RC1153: Release-Center aktive Testversion = RC1112'

      - name: RC1124 TESTSERVICE Browser Gate
        id: rc1124_testservice_browser_gate
        shell: bash
        env:
          EXPORTHUB_E2E_LIVE: '1'
          EXPORTHUB_E2E_BASE_URL: https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net
          EXPORTHUB_E2E_ENTRY: /
          EXPORTHUB_E2E_PUBLIC_ENV: testservice
        run: |
          set -euo pipefail
          set +x
          base='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          ready=0
          for attempt in {1..24}; do
            if curl -fsS -L --max-time 20 "$base/?rc1505=${GITHUB_SHA}-${attempt}" >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          [ "$ready" = '1' ] || { echo 'TESTSERVICE ist nach Deploy nicht erreichbar.' >&2; exit 1; }

          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-e2e-fixture" \
            | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"
          echo "::add-mask::$oidc_token"
          run_id="E2E-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          fixture() {
            local action="$1"
            local fixture_response fixture_status fixture_error
            local -a inventory_timeout=()
            case "$action" in
              inventory-team|inventory-scopes|inventory-blob-policy)
                # Fail bounded on stalled Azure LIST calls; diagnostic failures
                # must not suppress functional E2E checks or block release.
                inventory_timeout=(--connect-timeout 8 --max-time 35)
                ;;
            esac
            fixture_response="$(mktemp)"
            if ! fixture_status="$(curl -sS "${inventory_timeout[@]}" -o "$fixture_response" -w '%{http_code}' -H 'Content-Type: application/json' -H "x-exporthub-github-oidc: $oidc_token" -H 'x-exporthub-environment: testservice' -d "{\"action\":\"$action\",\"environment\":\"testservice\",\"runId\":\"$run_id\"}" "$base/api/e2e-test-fixture")"; then
              rm -f "$fixture_response"
              echo "RC1140 fixture transport failure action=$action; no inventory completed." >&2
              return 22
            fi
            if [ "$fixture_status" -lt 200 ] || [ "$fixture_status" -ge 300 ]; then
              fixture_error="$(node -e "const fs=require('fs');let v={};try{v=JSON.parse(fs.readFileSync(process.argv[1],'utf8')||'{}')}catch(_){};const code=String(v.code||'UNKNOWN').replace(/[^A-Za-z0-9_.-]/g,'').slice(0,80);const message=String(v.message||'Fixture request failed').replace(/[\\r\\n]+/g,' ').slice(0,300);process.stdout.write(code+': '+message)" "$fixture_response")"
              rm -f "$fixture_response"
              echo "RC1140 fixture_error action=$action HTTP=$fixture_status $fixture_error" >&2
              return 22
            fi
            cat "$fixture_response"
            rm -f "$fixture_response"
          }

          # RC1630: read-only TESTSERVICE-prefix inventory with the SAME
          # signed OIDC workflow identity; no new Azure secrets and no
          # additional scheduled jobs or full team-state downloads.
          # This is diagnostic only: incomplete inventory does not bypass,
          # weaken or incorrectly fail the functional release gates.
          # RC1639: inspect existing account-level Blob Soft Delete policy.
          # Signed OIDC only, one read-only GET; no storage configuration changes.
          if policy_payload="$(fixture inventory-blob-policy)"; then
            if ! printf '%s' "$policy_payload" | node -e '
              let raw="";process.stdin.on("data",c=>raw+=c).on("end",()=>{
                const v=JSON.parse(raw);
                const p=v.deleteRetention;
                if(v.ok!==true||v.action!=="inventory-blob-policy"||v.environment!=="testservice"||
                   v.scope!=="storage-account"||v.sharedOwnershipVerified!==false||
                   v.billingVerified!==false||v.changeApproved!==false||!p||
                   !["verified","unverified"].includes(p.status))process.exit(3);
                if(p.status==="verified"){
                  if(typeof p.enabled!=="boolean"||
                     (p.enabled===true&&(!Number.isSafeInteger(p.days)||p.days<1||p.days>365))||
                     (p.enabled===false&&p.days!==null))process.exit(4);
                }else if(p.enabled!==null||p.days!==null)process.exit(5);
                const report={scope:"storage-account",sharedOwnershipVerified:false,
                  status:p.status,softDeleteEnabled:p.enabled,retentionDays:p.days,
                  billingVerified:false,changeApproved:false};
                console.log("RC1639 Azure-Blob-SoftDelete-Richtlinie "+JSON.stringify(report));
                if(process.env.GITHUB_STEP_SUMMARY){
                  require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                    "\n## RC1639 · Azure Blob Soft Delete (read-only)\n\n"+
                    "Account-level property, shared PROD/TEST dependencies NOT ruled out.\n\n"+
                    "- Status: "+p.status+"\n- Enabled: "+p.enabled+
                    "\n- Days: "+p.days+"\n\nNo deletion approval or billing verification.\n");
                }
              });
            '; then
              echo "RC1639: Soft-Delete-Richtlinie nicht sicher verifiziert." >&2
            fi
          else
            echo "RC1639: Policy GET nicht verfügbar; Status unverified." >&2
          fi

          if inventory_payload="$(fixture inventory-team)"; then
            if ! printf '%s' "$inventory_payload" | node -e '
              let raw="";
              process.stdin.on("data",c=>raw+=c).on("end",()=>{
                const v=JSON.parse(raw);
                const safe=x=>Number.isSafeInteger(x)&&x>=0;
                const keys=["live","version","snapshot","deleted"];
                if(v.ok!==true||v.action!=="inventory-team"||v.complete!==true||
                   v.scope!=="team-prefix"||v.environment!=="testservice"||
                   v.billingVerified!==false||!safe(v.records)||!safe(v.logicalBytes)||
                   !safe(v.liveLogicalBytes)||!safe(v.historicalLogicalBytes)||
                   v.liveLogicalBytes+v.historicalLogicalBytes!==v.logicalBytes||
                   !keys.every(k=>v.kinds&&safe(v.kinds[k]?.records)&&safe(v.kinds[k]?.logicalBytes))||
                   keys.reduce((n,k)=>n+v.kinds[k].records,0)!==v.records)
                   process.exit(3);
                const rows=[
                  "## TESTSERVICE Team-Teilinventur (RC1630)",
                  "",
                  "Read-only und nur testservice/ im TEAM-Container; keine Dateinamen oder Kundendaten.",
                  "","| Speicherklasse | Einträge | Logische Bytes |","|---|---:|---:|"
                ];
                for(const k of keys)rows.push("| "+k+" | "+v.kinds[k].records+" | "+v.kinds[k].logicalBytes+" |");
                const names=["root-files","daily-backups","monthly-backups","yearly-backups","recovery-backups","recovery-drills","other"];
                if(v.areas){
                 if(!names.every(id=>v.areas[id]&&safe(v.areas[id].records)&&safe(v.areas[id].logicalBytes)&&
                     keys.every(k=>safe(v.areas[id].kinds?.[k]?.records)&&safe(v.areas[id].kinds?.[k]?.logicalBytes)))||
                     names.reduce((a,id)=>a+v.areas[id].records,0)!==v.records||
                     names.reduce((a,id)=>a+v.areas[id].logicalBytes,0)!==v.logicalBytes)process.exit(7);
                 rows.push("","### TESTSERVICE-Speicherbereiche (nur aggregierte Metadaten)","","| Bereich | Einträge | Logische Bytes |","|---|---:|---:|");
                 for(const id of names)rows.push("| "+id+" | "+v.areas[id].records+" | "+v.areas[id].logicalBytes+" |");
                 rows.push("","Speicherbereiche enthalten aktuelle und historische Daten. Keine Lösch- oder Kostenfreigabe.");
                }
                rows.push("","**Gesamt: "+v.records+" Einträge / "+v.logicalBytes+" logische Bytes**",
                  "","Keine abrechenbaren Bytes; weder sechs Speicherbereiche noch Production-Abhängigkeiten abschließend geprüft.");
                console.log("RC1630 TESTSERVICE-Team-Teilinventur "+JSON.stringify({
                  records:v.records,logicalBytes:v.logicalBytes,liveBytes:v.liveLogicalBytes,
                  historicalBytes:v.historicalLogicalBytes,kinds:v.kinds
                }));
                // RC1635: trusted category IDs only (no raw Azure payload or Blob names).
                if(v.areas)console.log("RC1635 TESTSERVICE-Team-Kategorien "+JSON.stringify(
                  names.map(id=>({id,records:v.areas[id].records,logicalBytes:v.areas[id].logicalBytes,
                    liveBytes:v.areas[id].kinds.live.logicalBytes,
                    historicalBytes:keys.filter(k=>k!=="live").reduce((n,k)=>n+v.areas[id].kinds[k].logicalBytes,0)}))
                ));
                if(process.env.GITHUB_STEP_SUMMARY){
                  require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,rows.join("\n")+"\n");
                }
              });
            '; then
              echo "RC1630: Inventurdaten unvollständig oder fehlerhaft; keine Speicherfreigabe." >&2
            fi
          else
            echo "RC1630: signierte TEAM-Teilinventur nicht verfügbar; keine Speicherfreigabe." >&2
          fi

          # RC1631: additional read-only inspection of six storage containers,
          # via the SAME signed OIDC TESTSERVICE-only fixture. No writes.
          # A listed empty prefix must NOT be confused with an inaccessible
          # container/account. PROD ownership and actual billing stay unverified.
          if scopes_payload="$(fixture inventory-scopes)"; then
            if ! printf '%s' "$scopes_payload" | node -e '
              let raw="";
              process.stdin.on("data",c=>raw+=c).on("end",()=>{
                const v=JSON.parse(raw);
                const validNumber=n=>Number.isSafeInteger(n)&&n>=0;
                const ids=["team","document-files","container-photos","pickup","pod","abd-quarantine","pod-backup"];
                const kinds=["live","version","snapshot","deleted"];
                if(v.ok!==true||v.action!=="inventory-scopes"||v.version!=="RC1631"||
                   v.environment!=="testservice"||v.resourceOwnershipVerified!==false||
                   v.billingVerified!==false||v.deletionApproved!==false||
                   v.scopeCount!==7||!Array.isArray(v.scopes)||v.scopes.length!==7||
                   !validNumber(v.verifiedScopes)||
                   !ids.every((id,i)=>v.scopes[i].id===id&&
                    (v.scopes[i].status==="listed"||v.scopes[i].status==="unverified")))
                     process.exitCode=4;
                if(process.exitCode)return;
                const rows=["## TESTSERVICE - erweiterte Blob-Teilinventur (RC1631)","","Nur Azure LIST, keine Inhalte, Dateinamen oder Löschungen.",
                 "","| TESTSERVICE-Bereich | Status | Datensätze | Logische Bytes |","|---|---|---:|---:|"];
                for(const x of v.scopes){
                  if(x.status==="listed"){
                    if(!validNumber(x.records)||!validNumber(x.logicalBytes)||
                       !kinds.every(k=>validNumber(x.kinds?.[k]?.records)&&validNumber(x.kinds?.[k]?.logicalBytes))){
                       process.exitCode=4;return;
                    }
                    rows.push("| "+x.id+" | gelistet | "+x.records+" | "+x.logicalBytes+" |");
                  }else{
                    if(x.records!==null||x.logicalBytes!==null||x.kinds!==null){process.exitCode=4;return;}
                    rows.push("| "+x.id+" | ungeprüft | – | – |");
                  }
                }
                if(v.complete!==true||v.resourceOwnershipVerified!==true){
                  rows.push("","**Keine Freigabe für Archivierung, Löschung oder Redundanzumstellung.**");
                }
                rows.push("","Auch erfolgreiche LIST-Werte belegen nicht die Ressourcenzuordnung, abrechenbare Bytes oder 0 EUR Kosten.");
                if(process.env.GITHUB_STEP_SUMMARY)
                  require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,rows.join("\n")+"\n");
                console.log("RC1631: geprüfte TESTSERVICE-Präfixe "+v.verifiedScopes+"/7, vollständige Kontenzuordnung weiterhin offen");
                // RC1635: unverified does not mean empty; only fixed scope IDs.
                console.log("RC1635 TESTSERVICE-Sechs-Container "+JSON.stringify(
                  v.scopes.map(x=>({id:x.id,status:x.status,
                    records:x.status==="listed"?x.records:null,
                    logicalBytes:x.status==="listed"?x.logicalBytes:null}))
                ));
              });
            '; then
              echo "RC1631: Aggregat fehlerhaft; kein belastbarer Bericht." >&2
            fi
          else
            echo "RC1631: Multi-Container-LIST nicht verfügbar; keine Speicherfreigabe." >&2
          fi

          cleanup() { fixture cleanup >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          prepared="$(fixture prepare)"
          session_token="$(printf '%s' "$prepared" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s);if(!v.ok||!v.token)process.exit(3);process.stdout.write(v.token)})")"
          user_b64="$(printf '%s' "$prepared" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s);if(!v.user)process.exit(4);process.stdout.write(Buffer.from(JSON.stringify(v.user),'utf8').toString('base64'))})")"
          nonadmin_session_token="$(printf '%s' "$prepared" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s);if(!v.nonAdminToken)process.exit(5);process.stdout.write(v.nonAdminToken)})")"
          nonadmin_user_b64="$(printf '%s' "$prepared" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s);if(!v.nonAdminUser)process.exit(6);process.stdout.write(Buffer.from(JSON.stringify(v.nonAdminUser),'utf8').toString('base64'))})")"
          pack_station_token="$(printf '%s' "$prepared" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s),token=v.user&&v.user._e2ePackStationToken;if(!token)process.exit(7);process.stdout.write(token)})")"
          echo "::add-mask::$session_token"
          echo "::add-mask::$nonadmin_session_token"
          echo "::add-mask::$pack_station_token"
          export EXPORTHUB_E2E_SESSION_TOKEN="$session_token"
          export EXPORTHUB_E2E_USER_B64="$user_b64"
          export EXPORTHUB_E2E_NONADMIN_SESSION_TOKEN="$nonadmin_session_token"
          export EXPORTHUB_E2E_NONADMIN_USER_B64="$nonadmin_user_b64"
          export EXPORTHUB_E2E_PACK_STATION_TOKEN="$pack_station_token"
          export EXPORTHUB_E2E_RUN_ID="$run_id"
          export EXPORTHUB_E2E_REFERENCE="E2E$(printf '%s' "$GITHUB_SHA" | cut -c1-3 | tr '[:lower:]' '[:upper:]')"
          export EXPORTHUB_E2E_MUTATION='1'

          npx playwright test e2e/specs/testservice-mutation.spec.mjs --project=laptop --grep 'RC1255 P2:'
          npx playwright test \
            e2e/specs/navigation.spec.mjs \
            e2e/specs/notifications.spec.mjs \
            e2e/specs/public-smoke.spec.mjs \
            e2e/specs/shipment-create.spec.mjs \
            e2e/specs/multi-truck-live.spec.mjs \
            e2e/specs/testservice-mutation.spec.mjs \
            e2e/specs/version-display.spec.mjs \
            --grep-invert 'RC1255 P2:'

          cleanup
          trap - EXIT

      - name: RC1124 TESTSERVICE Browser-Artefakte
        if: ${{ failure() && steps.rc1124_testservice_browser_gate.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: rc1124-testservice-browser-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: RC1170 TESTSERVICE Kundenportal-Verschlüsselung prüfen
        shell: bash
        run: |
          set -euo pipefail
          set +x
          base='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-customer-portal-readiness" \
            | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"
          echo "::add-mask::$oidc_token"
          code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 -X POST -H "x-exporthub-github-oidc: $oidc_token" -H 'x-exporthub-environment: testservice' "$base/api/customer-portal-readiness" || true)"
          STATUS="$code" BODY="$body" node -e "
            const fs=require('fs'),status=Number(process.env.STATUS||0);
            let v={};try{v=JSON.parse(fs.readFileSync(process.env.BODY,'utf8')||'{}')}catch(_){}
            console.log('RC1170 TESTSERVICE customer portal readiness',JSON.stringify({httpStatus:status,ok:v.ok===true,configured:v.configured===true,environment:v.environment,code:v.code,version:v.version}));
            if(status<200||status>=300||v.ok!==true||v.configured!==true||v.environment!=='testservice')process.exit(3);
          "

      - name: RC1249 TESTSERVICE AVIS-Mail-Konfiguration prüfen
        # Optionale automatische Upload-Mail; bekannte fehlende Mail.Send-Berechtigung bleibt P2.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          set +x
          base='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-avis-upload-mail-readiness" \
            | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"
          echo "::add-mask::$oidc_token"
          status="$(curl -sS -o "$response" -w '%{http_code}' --max-time 20 -X POST -H "x-exporthub-github-oidc: $oidc_token" -H 'x-exporthub-environment: testservice' "$base/api/avis-upload-mail-readiness" || true)"
          STATUS="$status" ENVIRONMENT='testservice' RESPONSE="$response" node -e "
            const fs=require('fs'),status=Number(process.env.STATUS||0),env=process.env.ENVIRONMENT,v=JSON.parse(fs.readFileSync(process.env.RESPONSE,'utf8')||'{}');
            const recipient='DespatchNettetal@essentra.com';
            const requirement=v.requiredPermission||{};
            const ready=status===200&&v.ok===true&&v.configured===true&&v.authenticated===true&&v.audienceOk===true&&v.mailSendGranted===true&&v.environment===env&&v.recipient===recipient;
            if(ready){console.log('RC1249 '+env+' automatische Upload-Mail bereit');process.exit(0)}
            const knownMailSendBlocker=status===503&&v.ok===false&&v.configured===true&&v.authenticated===true&&v.audienceOk===true&&v.mailSendGranted===false&&v.environment===env&&v.recipientConfigured===true&&v.code==='GRAPH_MAIL_PERMISSION_MISSING'&&requirement.resource==='Microsoft Graph'&&requirement.type==='Application'&&requirement.name==='Mail.Send'&&requirement.id==='b633e1c5-b582-4048-a93e-9f11b44c7e96'&&requirement.adminConsentRequired===true;
            if(knownMailSendBlocker){console.log('::warning title=RC1290 AVIS-Mail P2::Microsoft Graph > Application > Mail.Send (b633e1c5-b582-4048-a93e-9f11b44c7e96) fehlt in '+env+'. Admin Consent erforderlich; Release läuft weiter, Mailversand bleibt offen.');process.exit(0)}
            console.error('RC1249 '+env+' automatische Upload-Mail weiterhin nicht verfügbar',JSON.stringify({status,ok:v.ok,configured:v.configured,authenticated:v.authenticated,audienceOk:v.audienceOk,mailSendGranted:v.mailSendGranted,code:v.code}));
            process.exit(1);
          "

      - name: RC1505 TESTSERVICE Readiness prüfen
        shell: bash
        run: |
          set -euo pipefail
          base='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          ready=0
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS -L --max-time 20 "$base/?rc1505=${GITHUB_SHA}-${attempt}" || true)"
            version="$(curl -fsS -L --max-time 20 "$base/production-version.js?rc1505=${GITHUB_SHA}-${attempt}" || true)"
            if [[ "$body" == *ExportHUB* ]] \
              && [[ "$version" == *"__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'"* ]]; then
              ready=1
              break
            fi
            sleep 10
          done
          [ "$ready" = '1' ] || { echo 'RC1505 TESTSERVICE Readiness fehlgeschlagen.' >&2; exit 1; }
