name: RC1485 Apply Fix
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/pack-notification-internal.js'
      - 'assets/pack-notification-shipment.js'
      - 'test/rc1485-pack-persistence-confirmation.test.mjs'
      - '.github/workflows/rc1485-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1485 minimalen Persistenz-Fix anwenden
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              count=s.count(old)
              if count==0:
                  return False
              if count!=1:
                  raise SystemExit(f'{path}: erwartete Stelle {count}x gefunden')
              p.write_text(s.replace(old,new),encoding='utf-8')
              return True

          persist_old="""  async function persist(reason){
              try{
                const clean=root.ExportHUBClean;
                if(clean&&typeof clean.queueSave==='function')await Promise.resolve(clean.queueSave(reason||'Packmeldung geändert'));
                if(clean&&typeof clean.flushSave==='function')await Promise.resolve(clean.flushSave(reason||'Packmeldung geändert'));
                return true;
              }catch(_){return false;}
            }
          """
          persist_new="""  async function persist(reason){
              try{
                const clean=root.ExportHUBClean,text=reason||'Packmeldung geändert';
                if(clean&&typeof clean.queueSave==='function'){
                  const queued=await Promise.resolve(clean.queueSave(text));
                  if(queued===false)return false;
                }
                const runtime=clean&&clean.runtime||null,target=runtime?Number(runtime.changeGeneration||0):0;
                if(runtime&&target>0&&Number(runtime.lastSavedGeneration||0)>=target)return true;
                if(clean&&typeof clean.flushSave==='function'){
                  let flushed=await Promise.resolve(clean.flushSave(text));
                  if(flushed===false&&runtime&&target>0){
                    const timer=clean.native&&typeof clean.native.setTimeout==='function'?clean.native.setTimeout.bind(clean.native):(root.setTimeout||setTimeout);
                    for(let checks=0;checks<20&&Number(runtime.lastSavedGeneration||0)<target;checks+=1){
                      if(!runtime.saving&&checks>=2)break;
                      await new Promise(resolve=>timer(resolve,100));
                    }
                    flushed=Number(runtime.lastSavedGeneration||0)>=target;
                  }
                  if(flushed===false)return false;
                }
                return true;
              }catch(_){return false;}
            }
          """
          if not replace_once('assets/pack-notification-internal.js',persist_old,persist_new):
              pass

          opened_old="""  async function markNotificationOpened(notification){
              const state=sharedState(),now=new Date().toISOString(),id=q(notification&&notification.id);
              const live=notificationById(state,id);
              if(live&&q(live.status).toLowerCase()==='new'){live.status='in_review';live.updatedAt=now;}
              for(const task of packTasks(state)){if(q(task.sourceId)===id)markRead(state,q(task.id),now);}
              await persist('Packmeldung geöffnet');
              renderNavBadge();
            }
          """
          opened_new="""  async function markNotificationOpened(notification){
              const state=sharedState(),now=new Date().toISOString(),id=q(notification&&notification.id);
              const live=notificationById(state,id),liveBefore=live?{status:live.status,updatedAt:live.updatedAt}:null,taskBefore=[];
              if(live&&q(live.status).toLowerCase()==='new'){live.status='in_review';live.updatedAt=now;}
              for(const task of packTasks(state)){
                if(q(task.sourceId)!==id)continue;
                taskBefore.push({task,unread:task.unread,readAt:task.readAt,updatedAt:task.updatedAt});
                markRead(state,q(task.id),now);
              }
              const saved=await persist('Packmeldung geöffnet');
              if(!saved){
                if(live&&liveBefore){live.status=liveBefore.status;if(liveBefore.updatedAt===undefined)delete live.updatedAt;else live.updatedAt=liveBefore.updatedAt;}
                for(const before of taskBefore){before.task.unread=before.unread;if(before.readAt===undefined)delete before.task.readAt;else before.task.readAt=before.readAt;if(before.updatedAt===undefined)delete before.task.updatedAt;else before.task.updatedAt=before.updatedAt;}
              }
              renderNavBadge();
              return saved;
            }
          """
          replace_once('assets/pack-notification-internal.js',opened_old,opened_new)

          task_open_old="""  function openTaskDetail(task){const notification=findNotification(sharedState(),task);if(!notification)return false;markTaskOpened(task).catch(()=>{});return openNotificationDetail(notification);}
          """
          task_open_new="""  function openTaskDetail(task){const notification=findNotification(sharedState(),task);if(!notification)return false;return openNotificationDetail(notification);}
          """
          replace_once('assets/pack-notification-internal.js',task_open_old,task_open_new)

          shipment_persist_old="""  async function persist(reason){try{const clean=root.ExportHUBClean;if(clean&&typeof clean.queueSave==='function')await Promise.resolve(clean.queueSave(reason));if(clean&&typeof clean.flushSave==='function')await Promise.resolve(clean.flushSave(reason));return true;}catch(_){return false;}}
          """
          shipment_persist_new="""  async function persist(reason){
              try{
                const clean=root.ExportHUBClean;
                if(clean&&typeof clean.queueSave==='function'){
                  const queued=await Promise.resolve(clean.queueSave(reason));
                  if(queued===false)return false;
                }
                const runtime=clean&&clean.runtime||null,target=runtime?Number(runtime.changeGeneration||0):0;
                if(runtime&&target>0&&Number(runtime.lastSavedGeneration||0)>=target)return true;
                if(clean&&typeof clean.flushSave==='function'){
                  let flushed=await Promise.resolve(clean.flushSave(reason));
                  if(flushed===false&&runtime&&target>0){
                    const timer=clean.native&&typeof clean.native.setTimeout==='function'?clean.native.setTimeout.bind(clean.native):(root.setTimeout||setTimeout);
                    for(let checks=0;checks<20&&Number(runtime.lastSavedGeneration||0)<target;checks+=1){
                      if(!runtime.saving&&checks>=2)break;
                      await new Promise(resolve=>timer(resolve,100));
                    }
                    flushed=Number(runtime.lastSavedGeneration||0)>=target;
                  }
                  if(flushed===false)return false;
                }
                return true;
              }catch(_){return false;}
            }
          """
          replace_once('assets/pack-notification-shipment.js',shipment_persist_old,shipment_persist_new)

          saved_old="""    if(!saved||!shipmentId(saved))return;
              linkShipment(state,notification,saved,new Date().toISOString());pending=null;root.__EXPORTHUB_PACK_SHIPMENT_PREFILL__=null;await persist('Packmeldung mit Sendung verknüpft');
            }
          """
          saved_new="""    if(!saved||!shipmentId(saved))return false;
              const task=arr(state&&state.tasks).find(t=>q(t&&t.sourceType)==='pack_notification'&&q(t&&t.sourceId)===q(notification.id));
              const notificationBefore={shipmentId:notification.shipmentId,shipmentRef:notification.shipmentRef,status:notification.status,updatedAt:notification.updatedAt};
              const shipmentBefore={packNotificationId:saved.packNotificationId,packNotificationRef:saved.packNotificationRef,packNotificationLinkedAt:saved.packNotificationLinkedAt,deliveryFiles:saved.deliveryFiles};
              const taskBefore=task?{status:task.status,updatedAt:task.updatedAt}:null;
              linkShipment(state,notification,saved,new Date().toISOString());
              const persisted=await persist('Packmeldung mit Sendung verknüpft');
              if(!persisted){
                for(const [key,value] of Object.entries(notificationBefore)){if(value===undefined)delete notification[key];else notification[key]=value;}
                for(const [key,value] of Object.entries(shipmentBefore)){if(value===undefined)delete saved[key];else saved[key]=value;}
                if(task&&taskBefore){for(const [key,value] of Object.entries(taskBefore)){if(value===undefined)delete task[key];else task[key]=value;}}
                return false;
              }
              pending=null;root.__EXPORTHUB_PACK_SHIPMENT_PREFILL__=null;return true;
            }
          """
          replace_once('assets/pack-notification-shipment.js',saved_old,saved_new)
          PY
          node --check assets/pack-notification-internal.js
          node --check assets/pack-notification-shipment.js
          node --test test/rc1485-pack-persistence-confirmation.test.mjs
      - name: RC1485 Fix committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/pack-notification-internal.js assets/pack-notification-shipment.js; then
            echo 'RC1485: kein neuer Patch nötig.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pack-notification-internal.js assets/pack-notification-shipment.js
          git commit -m 'fix(RC1485): Packmeldungs-Persistenz transaktional absichern'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
