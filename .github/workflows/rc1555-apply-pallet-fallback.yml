name: RC1555 Apply Pallet Snapshot Fallback

on:
  push:
    branches: [fix/rc1555-pod-print-nested-legacy-fields]
    paths:
      - '.github/rc1555/apply-pallet-fallback.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rc1555-pod-print-nested-legacy-fields
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply exact RC1555 fallback patch
        run: node .github/rc1555/apply-pallet-fallback.mjs
      - name: Verify syntax and focused contracts
        run: |
          node --check assets/document-print-name.js
          node --test test/rc1550-pod-print-layout.test.mjs
      - name: Commit verified runtime fallback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ExportHUB RC1555'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add assets/document-print-name.js
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit.'
            exit 0
          fi
          git commit -m 'fix(RC1555): preserve pallet snapshot when live ledger has no match'
          git push origin HEAD:fix/rc1555-pod-print-nested-legacy-fields
