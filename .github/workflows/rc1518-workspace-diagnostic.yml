name: RC1518 Workspace Diagnostic
on:
  push:
    branches:
      - fix/rc1518-build-workspace-integrity
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Release-Vertrag mit RC1488-Integritätsproben
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"
            echo "===== RC1518 PROBE: $label ====="
            if [ -f .github/rc1488/finalize-auto-update.mjs ]; then
              echo 'RC1488_FINALIZER=present'
              sha256sum .github/rc1488/finalize-auto-update.mjs
            else
              echo 'RC1488_FINALIZER=MISSING'
              git status --short
              git diff --name-status || true
              git ls-files --deleted || true
              find .github -maxdepth 2 -type f -path '*rc1488*' -print || true
              exit 86
            fi
          }
          probe checkout
          node .github/rc1018/apply-public-language.mjs
          probe after-rc1018-language
          node .github/rc1018/fix-mail-wording.mjs
          probe after-rc1018-mail
          npm test
          probe after-npm-test
          node .github/rc1112/build-three-env.mjs
          probe after-rc1112-build
          node .github/rc1121/verify-final-html.mjs
          probe after-rc1121-verify
          git status --short
