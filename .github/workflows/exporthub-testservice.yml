name: ExportHUB TESTSERVICE Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'TESTVERSION.html'
      - 'staticwebapp.testservice.config.json'
      - '.github/workflows/exporthub-testservice.yml'

permissions:
  contents: read

concurrency:
  group: exporthub-testservice-deploy
  cancel-in-progress: true

jobs:
  deploy_testservice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy TESTSERVICE preview environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Validate TESTSERVICE files
        shell: bash
        run: |
          set -u
          failed=0

          require_file() {
            if [[ -f "$1" ]]; then
              echo "OK: $1"
            else
              echo "FEHLT: $1"
              failed=1
            fi
          }

          require_dir() {
            if [[ -d "$1" ]]; then
              echo "OK: $1/"
            else
              echo "FEHLT: $1/"
              failed=1
            fi
          }

          require_file TESTVERSION.html
          require_file staticwebapp.testservice.config.json
          require_dir api

          if [[ -f TESTVERSION.html ]]; then
            if grep -Fq "version:'RC661'" TESTVERSION.html; then
              echo "OK: TESTVERSION.html ist RC661"
            else
              echo "FEHLER: TESTVERSION.html enthält nicht die erwartete RC661-Version."
              grep -oE "version:'RC[0-9]+'" TESTVERSION.html | head -n 3 || true
              failed=1
            fi
          fi

          if [[ -f staticwebapp.testservice.config.json ]]; then
            if node -e "JSON.parse(require('fs').readFileSync('staticwebapp.testservice.config.json','utf8'));"; then
              echo "OK: staticwebapp.testservice.config.json ist gültiges JSON"
            else
              echo "FEHLER: staticwebapp.testservice.config.json ist ungültig."
              failed=1
            fi
          fi

          for js in api/exporthub-state/index.js api/shared/merge.js; do
            if [[ -f "$js" ]]; then
              if node --check "$js"; then
                echo "OK: Syntax $js"
              else
                echo "FEHLER: JavaScript-Syntax in $js"
                failed=1
              fi
            else
              echo "HINWEIS: $js nicht vorhanden; der Preflight blockiert deshalb nicht."
            fi
          done

          if [[ "$failed" != "0" ]]; then
            echo "TESTSERVICE-Preflight fehlgeschlagen. Oben steht die konkrete fehlende/fehlerhafte Datei."
            exit 1
          fi

          echo "TESTSERVICE-Preflight vollständig bestanden."

      - name: Prepare isolated TESTSERVICE payload
        shell: bash
        run: |
          set -eu
          cp TESTVERSION.html index.html
          cp staticwebapp.testservice.config.json staticwebapp.config.json
          cat > testservice-environment.json <<'EOF'
          {
            "environment": "testservice",
            "isolated": true,
            "data": "TEST-DATEN",
            "productionWritesAllowed": false,
            "expectedVersion": "RC661"
          }
          EOF
          echo "TESTSERVICE-Payload für RC661 vorbereitet."

      - name: Deploy TESTSERVICE named environment
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: ""
          deployment_environment: testservice

      - name: Verify live TESTSERVICE version
        shell: bash
        env:
          TESTSERVICE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          set -u
          if [[ -z "${TESTSERVICE_URL:-}" ]]; then
            echo "Azure hat keine Testservice-URL zurückgegeben."
            exit 1
          fi

          echo "TESTSERVICE URL: $TESTSERVICE_URL"
          ok=0
          tmp_direct="$(mktemp)"
          tmp_route="$(mktemp)"
          trap 'rm -f "$tmp_direct" "$tmp_route"' EXIT

          for attempt in $(seq 1 24); do
            direct_url="$TESTSERVICE_URL/TESTVERSION.html?verify=$GITHUB_SHA-$attempt"
            route_url="$TESTSERVICE_URL/test?verify=$GITHUB_SHA-$attempt"

            : > "$tmp_direct"
            : > "$tmp_route"
            direct_code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o "$tmp_direct" -w '%{http_code}' "$direct_url" || true)"
            route_code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o "$tmp_route" -w '%{http_code}' "$route_url" || true)"

            direct_version="$(grep -oE "version:'RC[0-9]+'" "$tmp_direct" | head -n 1 || true)"
            route_version="$(grep -oE "version:'RC[0-9]+'" "$tmp_route" | head -n 1 || true)"
            echo "Live-Check $attempt/24: direct HTTP=$direct_code ${direct_version:-keine-RC} | /test HTTP=$route_code ${route_version:-keine-RC}"

            direct_ok=0
            route_ok=0
            if [[ "$direct_code" == "200" ]] && grep -Fq "version:'RC661'" "$tmp_direct"; then direct_ok=1; fi
            if [[ "$route_code" == "200" ]] && grep -Fq "version:'RC661'" "$tmp_route"; then route_ok=1; fi

            if [[ "$direct_ok" == "1" && "$route_ok" == "1" ]]; then
              echo "RC661 ist im TESTSERVICE live. Direktdatei und /test liefern RC661."
              ok=1
              break
            fi
            sleep 10
          done

          if [[ "$ok" != "1" ]]; then
            echo "TESTSERVICE-Verifikation fehlgeschlagen: RC661 wurde nicht auf beiden Testservice-Routen ausgeliefert."
            exit 1
          fi

      - name: Publish TESTSERVICE address
        shell: bash
        env:
          TESTSERVICE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          {
            echo "## ExportHUB TESTSERVICE RC661"
            echo
            echo "**Diese Adresse zum Testen verwenden:**"
            echo
            echo "$TESTSERVICE_URL/test?v=661"
            echo
            echo "Direktprüfung: $TESTSERVICE_URL/TESTVERSION.html?v=661"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ÖFFNEN: $TESTSERVICE_URL/test?v=661"
          echo "DIREKT: $TESTSERVICE_URL/TESTVERSION.html?v=661"
