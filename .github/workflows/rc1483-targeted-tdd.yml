name: RC1483 Targeted TDD

on:
  push:
    branches: [rc1483-i18n-save-performance]

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: RC1483 targeted regression
        run: node --test tests/rc1483-i18n-save-performance.test.cjs
