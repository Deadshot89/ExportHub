name: RC1051 Fix Stale RC1031 Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc1051-fix-stale-test.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Veralteten RC1031-Vertrag auf RC1051 aktualisieren
        shell: python
        run: |
          from pathlib import Path
          p=Path('test/rc1031-diagnostics-lieferavis-storage.test.mjs')
          s=p.read_text(encoding='utf-8')
          old="assert.equal(containerCreates,1,'Der Container darf innerhalb einer warmen Function-Instanz nicht pro Zugriff erneut createIfNotExists ausführen.');"
          new="assert.equal(containerCreates,0,'RC1051: Der vorab bereitgestellte Public-Access-Container darf im Hotpath keinen createIfNotExists-Control-Plane-Aufruf mehr ausführen.');"
          if s.count(old)!=1:
              raise SystemExit('RC1031-Assertion nicht eindeutig gefunden')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Gezielte Regression
        run: |
          node --test test/rc1031-diagnostics-lieferavis-storage.test.mjs
          node --test test/rc1051-storage-hotpath-container.test.mjs
      - name: Testvertrag committen
        shell: bash
        run: |
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add test/rc1031-diagnostics-lieferavis-storage.test.mjs
          git commit -m 'RC1051: RC1031 Storage-Test auf control-plane-freien Hotpath aktualisieren'
          git push origin HEAD:main
