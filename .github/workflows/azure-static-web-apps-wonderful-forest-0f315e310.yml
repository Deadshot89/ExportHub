          testservice='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          for attempt in {1..18}; do
            ok=1
            for base in "$prod" "$testservice"; do
              page=$(mktemp); asset=$(mktemp); api=$(mktemp)
              pc=$(curl -sS -L -o "$page" -w '%{http_code}' --max-time 20 "$base/?rc1083=$GITHUB_SHA-$attempt" || true)
              ac=$(curl -sS -L -o "$asset" -w '%{http_code}' --max-time 20 "$base/assets/rc1013-diagnostics.js?rc1083=$GITHUB_SHA-$attempt" || true)
              apiCode=$(curl -sS -o "$api" -w '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' --data '{"action":"configuration"}' "$base/api/diagnostic-autofix?rc1083=$GITHUB_SHA-$attempt" || true)

              pageMarker=1; chatgptMarker=1; endpointMarker=1; titleMarker=1; authMarker=1
              grep -q 'assets/rc1013-diagnostics.js?v=1125' "$page" || pageMarker=0
              grep -q 'Mit ChatGPT beheben' "$asset" || chatgptMarker=0
              grep -q '__EXPORTHUB_RC1125_DIAGNOSTICS_VIEW_ISOLATION__' "$asset" || titleMarker=0
              grep -q '/api/diagnostic-autofix' "$asset" || endpointMarker=0
              grep -q 'Fehlerdiagnose & automatische Behebung' "$asset" || titleMarker=0
              grep -Eq 'AUTH_REQUIRED|SESSION_INVALID' "$api" || authMarker=0

              if [[ "$pc" != '200' || "$ac" != '200' || "$apiCode" != '401' || "$pageMarker" != '1' || "$chatgptMarker" != '1' || "$endpointMarker" != '1' || "$titleMarker" != '1' || "$authMarker" != '1' ]]; then
                ok=0
                echo "RC1083 Versuch $attempt · $base · page=$pc asset=$ac api=$apiCode · pageMarker=$pageMarker chatgpt=$chatgptMarker endpoint=$endpointMarker title=$titleMarker auth=$authMarker"
                printf 'RC1083 API-Antwort: '
                head -c 600 "$api" | tr '\n' ' ' || true
                echo
              fi
              rm -f "$page" "$asset" "$api"
            done
            if [[ "$ok" == '1' ]]; then
              echo 'RC1083 Diagnose-Autofix ist live und gegen anonymen Zugriff geschützt.'
              exit 0
            fi
            sleep 5
          done
          echo 'RC1083 Diagnose-Autofix-Liveprüfung nicht bestätigt.' >&2
          exit 1
