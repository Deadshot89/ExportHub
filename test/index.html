<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExportHUB Testportal</title>
<style>
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eef6fb;color:#0f172a}body{display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:#fff;border:1px solid #dbe4ef;border-radius:32px;padding:34px;box-shadow:0 20px 60px rgba(15,23,42,.12)}.mark{width:74px;height:74px;border-radius:24px;margin:auto;display:grid;place-items:center;background:linear-gradient(135deg,#22d3ee,#60a5fa);font-size:27px;font-weight:1000;color:#062033}h1{text-align:center;color:#08245d}.red{background:#fee2e2;border:1px solid #fecaca;color:#991b1b;border-radius:14px;padding:12px;font-weight:900;margin:18px 0}.field{display:grid;gap:7px;margin:14px 0;font-weight:900;color:#334155}input{border:1px solid #cbd5e1;border-radius:14px;padding:12px;font:inherit}.btn,.ghost{width:100%;min-height:46px;border-radius:14px;font-weight:950;cursor:pointer}.btn{border:0;background:linear-gradient(90deg,#dc2626,#ef4444);color:#fff}.ghost{margin-top:10px;border:1px solid #cbd5e1;background:#fff;color:#334155}.status{white-space:pre-wrap;margin-top:14px;font-weight:800}.bad{color:#b91c1c}.ok{color:#166534}.version{text-align:center;font-weight:900;color:#b91c1c;margin-top:10px}
</style></head><body><div class="card"><div class="mark">EH</div><h1>ExportHUB Testportal</h1><div class="red">TESTPORTAL · NUR GLOBAL ADMIN · LIVE-DATEN</div><div id="v" class="version">Aktive Testversion wird geprüft …</div><div id="login"><label class="field">Benutzername<input id="u" autocomplete="username"></label><label class="field">Passwort<input id="p" type="password" autocomplete="current-password"></label><button id="b" class="btn">Testportal anmelden</button></div><div id="s" class="status"></div><button class="ghost" onclick="location.href='/'">Zur Hauptseite</button></div>
<script>
(function(){'use strict';
var AUTH='/api/exporthub-auth',REL='/api/exporthub-release',TAB='exporthub_rc301_tab_session',KEY='exporthub_test_portal_requested';
function q(v){return String(v==null?'':v).trim()}function low(v){return q(v).toLowerCase()}function global(u){var r=low(u&&(u.role||u.rolle||u.level||u.type)),n=low(u&&(u.user||u.login||u.username||u.name||u.displayName)),p=Array.isArray(u&&u.permissions)?u.permissions:[];return !!u&&(u.globalAdmin===true||u.isAdmin===true||u.admin===true||n==='tobias'||/global.?admin|administrator|vollzugriff|admin/.test(r)||p.indexOf('*')>=0)}function st(t,k){var e=document.getElementById('s');e.textContent=t||'';e.className='status '+(k||'')}function vh(t){document.getElementById('v').textContent=t||''}function h(tok,extra){var x=Object.assign({Accept:'application/json'},extra||{});if(tok){x['X-ExportHUB-Token']=tok;x['X-ExportHUB-Session']=tok;x.Authorization='Bearer '+tok}return x}
async function response(url,opt){var r=await fetch(url,Object.assign({credentials:'same-origin',cache:'no-store'},opt||{}));var t=await r.text(),d={};try{d=t?JSON.parse(t):{}}catch(_){}return{r:r,t:t,d:d}}
async function json(url,opt){var x=await response(url,opt);if(!x.r.ok||x.d.ok===false)throw new Error(x.d.message||x.t||('HTTP '+x.r.status));return x.d}
function sanitize(x){
 x=String(x||'');
 x=x.replace(new RegExp('<script[^>]+id=["\']rc503-release-bootstrap["\'][^>]*>[\s\S]*?<\/script>','i'),'');
 // The loaded RC may contain its old Release-Center controller. Keep its UI/actions,
 // but prevent it from automatically loading a second test RC on exporthub:ready.
 x=x.replace(/if\(requested\(\)\)watchLogin\(\);enterTest\(\);maybeRender\(\)/g,'if(requested())watchLogin();ribbon(currentRelease());maybeRender()');
 x=x.replace(/loginUi\(\);ribbon\(\);enterTest\(\);maybeRender\(\)/g,'loginUi();ribbon(currentRelease());maybeRender()');
 return x
}
function marker(v){return '<script>window.__EXPORTHUB_RELEASE_STREAMED__=true;window.__EXPORTHUB_RELEASE_CHANNEL__="test";window.__EXPORTHUB_RELEASE_VERSION__='+JSON.stringify(v)+';try{sessionStorage.setItem("'+KEY+'","1")}catch(_){}<\\/script>'}
function bridge(){return '<script>(function(){"use strict";var API="/api/exporthub-release";function q(v){return String(v==null?"":v).trim()}function token(){try{return q(window.ExportHUBClean&&window.ExportHUBClean.runtime&&window.ExportHUBClean.runtime.authToken)}catch(_){return""}}function heads(){var t=token(),h={"Content-Type":"application/json",Accept:"application/json"};if(t){h["X-ExportHUB-Token"]=t;h["X-ExportHUB-Session"]=t;h.Authorization="Bearer "+t}return h}function version(){return q(window.__EXPORTHUB_RELEASE_VERSION__||(window.EXPORTHUB_BUILD&&window.EXPORTHUB_BUILD.version))}function paint(){var r=document.getElementById("rc503TestRibbon");if(r){var spans=r.querySelectorAll("span");if(spans.length>=3)spans[2].textContent=version()||"Testversion"}document.documentElement.setAttribute("data-exporthub-portal","test")}window.rc503OpenTestPortal=function(){location.href="/test/?_="+Date.now();return false};window.rc503SetTest=function(v){(async function(){var vv=q(v).toUpperCase(),r=await fetch(API+"?action=set-test&_="+Date.now(),{method:"POST",credentials:"same-origin",cache:"no-store",headers:heads(),body:JSON.stringify({version:vv})}),d={};try{d=await r.json()}catch(_){}if(!r.ok||d.ok===false)throw new Error(d.message||("HTTP "+r.status));location.replace("/test/?active="+encodeURIComponent(vv)+"&_="+Date.now())})().catch(function(e){alert("Testversion konnte nicht aktiviert werden: "+e.message)});return false};paint();window.addEventListener("exporthub:ready",function(){paint()});window.addEventListener("exporthub:rendered",function(){paint()});})();<\/script>'}
function inject(x,v){x=sanitize(x);if(!/<html[\s>]/i.test(x))throw new Error('Die aktive Test-RC enthält kein gültiges HTML.');x=x.replace(/<head(\s[^>]*)?>/i,function(m,a){return '<head'+(a||'')+'>'+marker(v)});x=x.replace(/<\/body>/i,bridge()+'</body>');document.open('text/html','replace');document.write(x);document.close()}
function save(tok,u){sessionStorage.setItem(KEY,'1');sessionStorage.setItem(TAB,JSON.stringify({token:tok,user:u,deviceId:'TEST-'+Date.now().toString(36),view:'dashboard',savedAt:Date.now(),version:'TEST-SHELL'}))}
async function active(tok){var m=await json(REL+'?action=active&channel=test&_='+Date.now(),{headers:h(tok)}),v=q(m.version).toUpperCase(),wanted='';try{wanted=q(new URL(location.href).searchParams.get('active')).toUpperCase()}catch(_){}if(wanted&&v&&wanted!==v)throw new Error('Testwechsel nicht übernommen: erwartet '+wanted+', aktiv ist '+v+'.');vh(v?'Aktive Testversion: '+v:'Keine aktive Testversion ausgewählt');return v}
async function load(tok,u){if(!global(u))throw new Error('Das Testportal ist ausschließlich für Global Admin freigegeben.');var v=await active(tok);if(!v)throw new Error('Im Release-Center ist keine aktive Testversion ausgewählt.');st(v+' wird geladen …','ok');var x=await response(REL+'?action=html&channel=test&_='+Date.now(),{headers:h(tok,{Accept:'text/html'})});if(!x.r.ok)throw new Error(x.t||('HTTP '+x.r.status));if(!x.t)throw new Error('Die Release-API hat für '+v+' keine HTML-Datei geliefert.');inject(x.t,v)}
async function restore(){try{var x=JSON.parse(sessionStorage.getItem(TAB)||'null');if(!x||!q(x.token)||!x.user)return false;var d=await json(AUTH,{method:'POST',headers:h(x.token,{'Content-Type':'application/json'}),body:JSON.stringify({action:'session',sessionToken:x.token})});var u=d.user||x.user;if(!global(u))return false;save(x.token,u);await load(x.token,u);return true}catch(e){st(e.message||'Gespeicherte Sitzung konnte nicht verwendet werden.','bad');return false}}
async function login(){var b=document.getElementById('b');b.disabled=true;st('Anmeldung wird geprüft …','');try{var username=q(document.getElementById('u').value),password=document.getElementById('p').value;if(!username||!password)throw new Error('Benutzername und Passwort sind erforderlich.');var d=await json(AUTH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:username,password:password,deviceId:'TEST-'+Date.now().toString(36),recoveryRequested:false})});if(d.mustChange)throw new Error('Das Passwort muss zuerst auf der Hauptseite geändert werden.');if(!q(d.token)||!d.user)throw new Error('Keine gültige Sitzung erhalten.');if(!global(d.user))throw new Error('Das Testportal ist ausschließlich für Global Admin freigegeben.');save(q(d.token),d.user);await load(q(d.token),d.user)}catch(e){st(e.message,'bad');b.disabled=false}}
document.getElementById('b').onclick=login;document.getElementById('p').addEventListener('keydown',function(e){if(e.key==='Enter')login()});sessionStorage.setItem(KEY,'1');restore();
})();
</script></body></html>
