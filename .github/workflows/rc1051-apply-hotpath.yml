name: RC1051 Apply Storage Hotpath

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc1051-apply-hotpath.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1051 Patch anwenden
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: erwartete Stelle nicht eindeutig gefunden ({count})')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          replace_once(
              'api/shared/auth-store.js',
              "  const container = service.getContainerClient(TEAM_CONTAINER);\n  await container.createIfNotExists();\n  return {",
              "  const container = service.getContainerClient(TEAM_CONTAINER);\n  return {"
          )

          replace_once(
              'api/customer-avis/index.js',
              "async function ensureTeamContainerReady(){if(teamContainerReadyPromise)return teamContainerReadyPromise;const cs=connectionString();if(!cs)throw error('STORAGE_NOT_CONFIGURED','Azure-Speicher ist nicht konfiguriert.',503);teamContainer=BlobServiceClient.fromConnectionString(cs).getContainerClient(TEAM_CONTAINER);teamContainerReadyPromise=teamContainer.createIfNotExists().then(()=>teamContainer).catch(e=>{teamContainer=null;teamContainerReadyPromise=null;throw e});return teamContainerReadyPromise}",
              "async function ensureTeamContainerReady(){if(teamContainerReadyPromise)return teamContainerReadyPromise;const cs=connectionString();if(!cs)throw error('STORAGE_NOT_CONFIGURED','Azure-Speicher ist nicht konfiguriert.',503);teamContainer=BlobServiceClient.fromConnectionString(cs).getContainerClient(TEAM_CONTAINER);teamContainerReadyPromise=Promise.resolve(teamContainer);return teamContainerReadyPromise}"
          )

          replace_once(
              'api/shared/public-access-store.js',
              "async function container(){ if(containerReadyPromise)return containerReadyPromise; const cs=connectionString(); if(!cs)throw error('STORAGE_NOT_CONFIGURED','Azure-Speicher ist nicht konfiguriert.',503); containerReadyPromise=(async()=>{const c=BlobServiceClient.fromConnectionString(cs).getContainerClient(CONTAINER);await c.createIfNotExists();return c})().catch(e=>{containerReadyPromise=null;throw e}); return containerReadyPromise; }",
              "async function container(){ if(containerReadyPromise)return containerReadyPromise; const cs=connectionString(); if(!cs)throw error('STORAGE_NOT_CONFIGURED','Azure-Speicher ist nicht konfiguriert.',503); const c=BlobServiceClient.fromConnectionString(cs).getContainerClient(CONTAINER);containerReadyPromise=Promise.resolve(c);return containerReadyPromise; }"
          )
      - name: RC1051 gezielte Regression
        run: |
          node --test test/rc1051-storage-hotpath-container.test.mjs
          node --test test/rc1036-lieferavis-server-timing.test.mjs
          node --test test/rc1040-lieferavis-reuse-auth-team-read.test.mjs
          node --test test/rc1014-reusable-public-links.test.mjs
          node --test test/rc1014-diagnostics-integration.test.mjs
      - name: Änderungen committen
        shell: bash
        run: |
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add api/shared/auth-store.js api/customer-avis/index.js api/shared/public-access-store.js
          if git diff --cached --quiet; then
            echo 'Keine Änderungen nötig.'
            exit 0
          fi
          git commit -m 'RC1051: Azure Container-Hotpath ohne createIfNotExists'
          git push origin HEAD:main
