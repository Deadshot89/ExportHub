name: RC940 Dokument-Standort-Konsistenz

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc940-document-location-consistency.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rc940-document-location-consistency
  cancel-in-progress: false

jobs:
  patch_verify_deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED – RC939 muss die zwei Dokument-Fallback-Lücken noch zeigen
        id: red
        continue-on-error: true
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC939',cache:'939',loginReturn:'/TESTVERSION.html?v=939'" in text, 'Basis ist nicht exakt RC939.'
          desired=[
            "nested.id||nested.locationId||nested.selectedLocationId||nested.siteId||nested.destinationId||''",
            "const locId=l=>String(l&&(l.id||l.locationId||l.selectedLocationId||l.siteId||l.destinationId||l.code||l.number)||'').trim();",
            "locationId=q(active.locationId||active.selectedLocationId||active.siteId||active.destinationId||saved.locationId||saved.selectedLocationId||saved.siteId||saved.destinationId);"
          ]
          for needle in desired:
              assert needle in text, needle
          PY

      - name: RED-Ergebnis verifizieren
        shell: bash
        env:
          RED_OUTCOME: ${{ steps.red.outcome }}
        run: |
          if [[ "$RED_OUTCOME" != "failure" ]]; then
            echo "RED ist nicht wie erwartet fehlgeschlagen. RC939 wird nicht verändert."
            exit 1
          fi
          echo "RED bestätigt: Dokument-Fallback und gespeicherte Standortanzeige sind auf RC939 noch unvollständig."

      - name: RC940 direkt in den bestehenden Lesern korrigieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('TESTVERSION.html')
          text=p.read_text(encoding='utf-8')

          def once(src,old,new,label):
              n=src.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: erwartet 1 Fundstelle, gefunden {n}')
              return src.replace(old,new,1)

          text=once(text,
              "version:'RC939',cache:'939',loginReturn:'/TESTVERSION.html?v=939'",
              "version:'RC940',cache:'940',loginReturn:'/TESTVERSION.html?v=940'",
              'BUILD-Version')

          marker="changes:Object.freeze([\n"
          if text.count(marker)!=1:
              raise SystemExit('Release-Anker nicht eindeutig')
          note="    'RC940 korrigiert die letzten dokumentrelevanten Standort-Fallbacks: Ladeliste/CMR/PDF erkennen historische Standortdaten auch über selectedLocationId/destinationId; beim Wiederöffnen wird eine nur über destinationId gespeicherte Standortauswahl wieder angezeigt.',\n"
          text=text.replace(marker,marker+note,1)

          # Eingebettete Dokumentroutine – nur die zwei ID-Leser direkt ändern.
          text=once(text,
              "nested.id||nested.locationId||nested.siteId||'').trim();const locations=",
              "nested.id||nested.locationId||nested.selectedLocationId||nested.siteId||nested.destinationId||'').trim();const locations=",
              'shipmentRecipientAddress nested id')
          text=once(text,
              "const locId=l=>String(l&&(l.id||l.locationId||l.siteId||l.code||l.number)||'').trim();",
              "const locId=l=>String(l&&(l.id||l.locationId||l.selectedLocationId||l.siteId||l.destinationId||l.code||l.number)||'').trim();",
              'shipmentRecipientAddress locId')

          # Wiederanzeige einer gespeicherten Sendung.
          text=once(text,
              "locationId=q(active.locationId||active.selectedLocationId||active.siteId||saved.locationId||saved.selectedLocationId||saved.siteId);",
              "locationId=q(active.locationId||active.selectedLocationId||active.siteId||active.destinationId||saved.locationId||saved.selectedLocationId||saved.siteId||saved.destinationId);",
              'gespeicherte Standortanzeige')

          p.write_text(text,encoding='utf-8')
          PY

      - name: GREEN – RC940 Dokument-Fallbacks prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC940',cache:'940',loginReturn:'/TESTVERSION.html?v=940'" in text
          assert "RC940 korrigiert die letzten dokumentrelevanten Standort-Fallbacks" in text
          required=[
            "nested.id||nested.locationId||nested.selectedLocationId||nested.siteId||nested.destinationId||'').trim();const locations=",
            "const locId=l=>String(l&&(l.id||l.locationId||l.selectedLocationId||l.siteId||l.destinationId||l.code||l.number)||'').trim();",
            "locationId=q(active.locationId||active.selectedLocationId||active.siteId||active.destinationId||saved.locationId||saved.selectedLocationId||saved.siteId||saved.destinationId);"
          ]
          for needle in required:
              assert needle in text, needle
          forbidden=[
            "nested.id||nested.locationId||nested.siteId||'').trim();const locations=",
            "const locId=l=>String(l&&(l.id||l.locationId||l.siteId||l.code||l.number)||'').trim();",
            "locationId=q(active.locationId||active.selectedLocationId||active.siteId||saved.locationId||saved.selectedLocationId||saved.siteId);"
          ]
          for needle in forbidden:
              assert needle not in text, needle
          # Dokumentroutine setzt bei Treffer weiterhin alle vier IDs und drei Adressen.
          assert "s.locationId=id;s.selectedLocationId=id;s.siteId=id;s.destinationId=id" in text
          assert "s.recipientAddress=address;s.deliveryAddress=address;s.destinationAddress=address" in text
          print('GREEN: RC940 Dokument-Fallbacks konsistent.')
          PY

      - name: Diff und Integrität prüfen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          grep -m1 -oE "version:'RC[0-9]+'" TESTVERSION.html

      - name: RC940 nach main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          if git diff --cached --quiet; then
            echo "Keine Änderung erzeugt – Abbruch."
            exit 1
          fi
          git commit -m "RC940 Dokument-Standort-Fallbacks vereinheitlichen"
          git push origin HEAD:main

      - name: Temporären RC940-Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm .github/workflows/rc940-document-location-consistency.yml
          git commit -m "RC940 temporären Patch-Workflow entfernen"
          git push origin HEAD:main

      - name: TESTSERVICE-Deploy für RC940 auslösen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/exporthub-testservice-final-artifact-fix.yml/dispatches" \
            -d '{"ref":"main"}')"
          cat /tmp/dispatch.out || true
          [[ "$code" == "204" ]] || { echo "Dispatch fehlgeschlagen: HTTP $code"; exit 1; }
          echo "TESTSERVICE-Deploy RC940 ausgelöst."
