name: RC1456 Release Gate Patch

on:
  push:
    branches:
      - rc1456-remove-customs-signature

permissions:
  contents: write

jobs:
  patch-release-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rc1456-remove-customs-signature
          fetch-depth: 0
      - name: Restore single-signature production gate
        shell: python
        run: |
          from pathlib import Path
          path=Path('.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml')
          text=path.read_text(encoding='utf-8')
          replacements={
            'RC1437 ABD-Drucklayout live verifizieren':'RC1379 Produktions-Drucklayout live verifizieren',
            '?rc1437=$GITHUB_SHA-$attempt':'?rc1379=$GITHUB_SHA-$attempt',
            '&& grep -Fq "rc1305-signature-customs" "$print_runtime" \\\n              && grep -Fq "data-rc1432-customs-signature" "$print_runtime" \\\n              && grep -Fq "customsDocumentsSignature" "$print_runtime" \\':'&& ! grep -Fq "rc1305-signature-customs" "$print_runtime" \\\n              && ! grep -Fq "data-rc1432-customs-signature" "$print_runtime" \\\n              && ! grep -Fq "customsDocumentsSignature" "$print_runtime" \\',
            'RC1437 Produktions-Live-Gate fehlgeschlagen':'RC1379 Produktions-Live-Gate fehlgeschlagen',
            'RC1437 POD-Ladeliste mit Verlader, Kennzeichen und beiden Fahrerunterschriften bei ABD sowie aktuelle Druck-Fixes live bestätigt.':'RC1379 POD-Ladeliste mit Verlader, Kennzeichen und einer Fahrerunterschrift; ABD nur mit Übergabebestätigung; aktuelle Druck-Fixes live bestätigt.'
          }
          for old,new in replacements.items():
            if old not in text:
              raise SystemExit(f'Erwarteter RC1437-Block fehlt: {old[:80]}')
            text=text.replace(old,new)
          if "-H 'Content-Type: application/json'" not in text:
            raise SystemExit('AVIS Content-Type Fix darf nicht verloren gehen')
          path.write_text(text,encoding='utf-8')
      - name: Verify only one signature is required
        shell: bash
        run: |
          set -euo pipefail
          flow='.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml'
          grep -Fq 'RC1379 Produktions-Drucklayout live verifizieren' "$flow"
          grep -Fq '! grep -Fq "rc1305-signature-customs" "$print_runtime"' "$flow"
          grep -Fq '! grep -Fq "data-rc1432-customs-signature" "$print_runtime"' "$flow"
          grep -Fq "-H 'Content-Type: application/json'" "$flow"
      - name: Commit release-gate correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'RC1456: restore single-signature production release gate'
          git push origin HEAD:rc1456-remove-customs-signature
