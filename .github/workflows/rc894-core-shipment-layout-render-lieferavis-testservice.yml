name: RC894 Core Shipment Layout Render Lieferavis TESTSERVICE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc894-core-shipment
  cancel-in-progress: false

jobs:
  repair-testservice:
    name: RC894 shipment core repair
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout clean RC892 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard clean RC892 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html

          grep -Fq "var BUILD=Object.freeze({version:'RC892',cache:'892',loginReturn:'/TESTVERSION.html?v=892'});" TESTVERSION.html
          grep -Fq 'id="exporthub-canonical-modules"' TESTVERSION.html
          grep -Fq "window.__EXPORTHUB_CANONICAL_MODULE_MANIFEST__" TESTVERSION.html
          grep -Fq "function applyFixedBlocks()" TESTVERSION.html
          grep -Fq "function safePatchDuringEdit()" TESTVERSION.html
          grep -Fq "function deferFullPatch(delay)" TESTVERSION.html
          grep -Fq "function schedulePatch()" TESTVERSION.html
          grep -Fq "function patch()" TESTVERSION.html

          if grep -Fq "/* exporthub-rc894-shipment-core */" TESTVERSION.html; then
            echo "::error::RC894 marker already exists. Do not run this workflow twice on the same RC894 state."
            exit 1
          fi

      - name: RED reproduce shipment root causes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          src=Path("TESTVERSION.html").read_text(encoding="utf-8",errors="strict")

          def script_blocks(source):
              pat=re.compile(r'<script\b([^>]*)>(.*?)</script>',re.I|re.S)
              for m in pat.finditer(source):
                  attrs=m.group(1) or ""
                  body=m.group(2)
                  if re.search(r'\bid=["\']exporthub-canonical-modules["\']',attrs,re.I):
                      continue
                  yield attrs,body

          def find_function(source,name):
              marker="function "+name+"("
              start=source.find(marker)
              if start<0:
                  return None
              brace=source.find("{",start)
              if brace<0:
                  return None
              depth=0; quote=""; esc=False; line=False; block=False; i=brace
              while i<len(source):
                  c=source[i]; n=source[i+1] if i+1<len(source) else ""
                  if line:
                      if c=="\n": line=False
                      i+=1; continue
                  if block:
                      if c=="*" and n=="/": block=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False; i+=1; continue
                      if c=="\\": esc=True; i+=1; continue
                      if c==quote: quote=""
                      i+=1; continue
                  if c=="/" and n=="/": line=True; i+=2; continue
                  if c=="/" and n=="*": block=True; i+=2; continue
                  if c in ("'",'"','`'): quote=c; i+=1; continue
                  if c=="{": depth+=1
                  elif c=="}":
                      depth-=1
                      if depth==0: return source[start:i+1]
                  i+=1
              return None

          target=None
          for _,body in script_blocks(src):
              fn=find_function(body,"applyFixedBlocks")
              if fn and "rc383LeftColumn" in fn and "rc383RightColumn" in fn:
                  target=body
                  break
          if not target:
              raise SystemExit("RED: executable shipment script with applyFixedBlocks not found")

          apply_fn=find_function(target,"applyFixedBlocks") or ""
          defer_fn=find_function(target,"deferFullPatch") or ""
          patch_fn=find_function(target,"patch") or ""

          problems=[]
          if "[customer,shipmentBlock].forEach(function(x){left.appendChild(x)})" in apply_fn and \
             "[colli,documents,abdDecisionBlock].forEach(function(x){right.appendChild(x)})" in apply_fn:
              problems.append("Sendung erstellen is still split into left/right columns")
          if "shipmentBody.appendChild(avisEditHost)" in apply_fn:
              problems.append("legacy Lieferavis host is still injected into Sendungsdaten")
          if "deferredPatchTimer=nt(retry,250)" in defer_fn:
              problems.append("250 ms recursive full-patch retry is still active")
          if "return deferFullPatch(250)" in patch_fn:
              problems.append("patch still schedules another full patch while busy/editing")

          if len(problems)<4:
              raise SystemExit("RED did not reproduce all four RC894 root causes: "+repr(problems))

          print("RED reproduced:")
          for p in problems:
              print(" -",p)
          PY

      - name: Snapshot canonical modules and HTML boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib,json

          src=Path("TESTVERSION.html").read_text(encoding="utf-8",errors="strict")
          m=re.search(r'<script\b[^>]*\bid=["\']exporthub-canonical-modules["\'][^>]*>(.*?)</script>',src,re.I|re.S)
          if not m:
              raise SystemExit("Canonical module script block not found")

          block=m.group(1)
          Path("/tmp/rc894-canonical.sha").write_text(hashlib.sha256(block.encode()).hexdigest(),encoding="utf-8")
          Path("/tmp/rc894-boundaries.json").write_text(json.dumps({
              "script_open":src.lower().count("<script"),
              "script_close":src.lower().count("</script>"),
              "style_open":src.lower().count("<style"),
              "style_close":src.lower().count("</style>")
          }),encoding="utf-8")
          print("Protected canonical hash and boundaries captured")
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC892 backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-before-rc894-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Backup tag already exists and will be reused: $TAG"
          else
            git tag -a "$TAG" -m "Backup before RC894 shipment core repair"
            git push origin "refs/tags/$TAG"
            echo "Backup tag created: $TAG"
          fi

      - name: Apply RC894 core repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path("TESTVERSION.html")
          src=path.read_text(encoding="utf-8",errors="strict")

          BUILD_OLD="var BUILD=Object.freeze({version:'RC892',cache:'892',loginReturn:'/TESTVERSION.html?v=892'});"
          BUILD_NEW="var BUILD=Object.freeze({version:'RC894',cache:'894',loginReturn:'/TESTVERSION.html?v=894'});"
          if src.count(BUILD_OLD)!=1:
              raise SystemExit("RC894: expected exactly one RC892 BUILD declaration")
          src=src.replace(BUILD_OLD,BUILD_NEW,1)

          script_re=re.compile(r'<script\b([^>]*)>(.*?)</script>',re.I|re.S)

          def find_function(source,name):
              marker="function "+name+"("
              start=source.find(marker)
              if start<0:
                  return None
              brace=source.find("{",start)
              if brace<0:
                  return None
              depth=0; quote=""; esc=False; line=False; block=False; i=brace
              while i<len(source):
                  c=source[i]; n=source[i+1] if i+1<len(source) else ""
                  if line:
                      if c=="\n": line=False
                      i+=1; continue
                  if block:
                      if c=="*" and n=="/": block=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False; i+=1; continue
                      if c=="\\": esc=True; i+=1; continue
                      if c==quote: quote=""
                      i+=1; continue
                  if c=="/" and n=="/": line=True; i+=2; continue
                  if c=="/" and n=="*": block=True; i+=2; continue
                  if c in ("'",'"','`'): quote=c; i+=1; continue
                  if c=="{": depth+=1
                  elif c=="}":
                      depth-=1
                      if depth==0:
                          return (start,i+1,source[start:i+1])
                  i+=1
              return None

          matches=list(script_re.finditer(src))
          chosen=None
          for m in matches:
              attrs=m.group(1) or ""
              if re.search(r'\bid=["\']exporthub-canonical-modules["\']',attrs,re.I):
                  continue
              body=m.group(2)
              fn=find_function(body,"applyFixedBlocks")
              if fn and "rc383LeftColumn" in fn[2] and "rc383RightColumn" in fn[2] and "rc363BlockShipment" in fn[2]:
                  chosen=m
                  break

          if not chosen:
              raise SystemExit("RC894: executable shipment core script not found")

          body=chosen.group(2)

          helpers=r'''/* exporthub-rc894-shipment-core */
          function ensureRC894Style(){
           var style=document.getElementById('rc894ShipmentCoreStyle');
           if(style)return style;
           style=document.createElement('style');style.id='rc894ShipmentCoreStyle';
           style.textContent='.rc894-full-stack{display:flex!important;flex-direction:column!important;gap:18px!important;width:100%!important;max-width:none!important;grid-template-columns:none!important}.rc894-full-stack>.rc363-process-block{width:100%!important;max-width:none!important}.rc894-full-stack #rc383LeftColumn,.rc894-full-stack #rc383RightColumn{display:none!important}#rc363BlockShipment .rc363-process-body[data-rc894-grid="1"]{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:16px 20px!important;align-items:start!important}#rc363BlockShipment .rc363-process-body[data-rc894-grid="1"]>*{min-width:0!important;grid-column:1/-1}#rc363BlockShipment [data-rc894-field="reference"]{grid-column:span 2!important;order:10}#rc363BlockShipment [data-rc894-field="pickup"]{grid-column:span 2!important;order:20}#rc363BlockShipment [data-rc894-field="carrier"]{grid-column:span 2!important;order:30}#rc363BlockShipment [data-rc894-field="description"]{grid-column:span 3!important;order:40}#rc363BlockShipment [data-rc894-field="remark"]{grid-column:span 3!important;order:50}#rc845AvisEditHost,#rc845AvisReadHost,#rc890LieferAvisBtn,#rc891LieferAvisBtn,#rc892LieferAvisBtn{display:none!important}#rc894LieferAvisBtn{display:inline-flex!important;align-items:center!important;justify-content:center!important;white-space:nowrap!important}@media(max-width:900px){#rc363BlockShipment .rc363-process-body[data-rc894-grid="1"]{grid-template-columns:1fr!important}#rc363BlockShipment [data-rc894-field]{grid-column:1/-1!important}}';
           (document.head||document.documentElement).appendChild(style);return style
          }
          function applyRC894ShipmentFieldGrid(body){
           if(!body)return false;ensureRC894Style();body.setAttribute('data-rc894-grid','1');
           var nodes=Array.prototype.slice.call(body.children||[]),used=[];
           nodes.forEach(function(node){if(node&&node.removeAttribute){node.removeAttribute('data-rc894-field')}});
           function textOf(node){var bits=[q(node&&node.textContent)];if(node&&node.querySelectorAll)Array.prototype.slice.call(node.querySelectorAll('input,select,textarea')).forEach(function(el){bits.push(q(el.id));bits.push(q(el.name));bits.push(q(el.placeholder));bits.push(q(el.getAttribute&&el.getAttribute('aria-label')))});return low(bits.join(' '))}
           function mark(kind,re){var node=nodes.find(function(n){return used.indexOf(n)<0&&re.test(textOf(n))});if(!node)return null;used.push(node);node.setAttribute('data-rc894-field',kind);node.removeAttribute('data-rc387-wide');return node}
           mark('reference',/(sendungsreferenz|referenznummer|shipment.?ref)/);
           mark('pickup',/(geplantes?\s+abholdatum|planned\s+(pickup|collection))/);
           mark('carrier',/(^|\s)(spedition|carrier)(\s|$)/);
           mark('description',/(warenbeschreibung|goods\s+description|cmr\s*(feld|field|box)\s*9)/);
           mark('remark',/(^|\s)(bemerkung|remark|note)(\s|$)/);
           return true
          }
          function ensureRC894LieferavisButton(){
           ensureRC894Style();
           ['rc890LieferAvisBtn','rc891LieferAvisBtn','rc892LieferAvisBtn'].forEach(function(id){var old=document.getElementById(id);if(old)old.remove()});
           ['rc845AvisEditHost','rc845AvisReadHost'].forEach(function(id){var old=document.getElementById(id);if(old)old.remove()});
           var button=document.getElementById('rc894LieferAvisBtn');
           var bars=Array.prototype.slice.call(document.querySelectorAll('.topbar,.toolbar,[class*="topbar"],[class*="toolbar"]'));
           var bar=bars.find(function(el){var t=low(el.textContent);return t.indexOf('pod-sicherung')>=0&&t.indexOf('abmelden')>=0})||bars.find(function(el){var t=low(el.textContent);return t.indexOf('backup')>=0&&t.indexOf('drucken')>=0});
           if(!bar){return !!button}
           if(!button){
             var sample=Array.prototype.slice.call(bar.querySelectorAll('button')).find(function(b){return /pod-sicherung|backup|import|drucken|abmelden/i.test(q(b.textContent))});
             button=document.createElement('button');button.id='rc894LieferAvisBtn';button.type='button';button.className=sample?q(sample.className):'ghost';button.textContent='Lieferavis';button.title='Kundenavis öffnen';button.setAttribute('aria-label','Lieferavis');
             button.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();window.location.href='/customer-avis.html?v=894'});
           }
           if(button.parentElement!==bar){var anchor=Array.prototype.slice.call(bar.querySelectorAll('button')).find(function(b){return /pod-sicherung/i.test(q(b.textContent))});if(anchor&&anchor.nextSibling)bar.insertBefore(button,anchor.nextSibling);else bar.appendChild(button)}
           return true
          }
          '''

          if "/* exporthub-rc894-shipment-core */" in body:
              raise SystemExit("RC894 helper marker already exists")
          apply_pos=body.find("function applyFixedBlocks()")
          if apply_pos<0:
              raise SystemExit("RC894 applyFixedBlocks insertion point missing")
          body=body[:apply_pos]+helpers+body[apply_pos:]

          def replace_function(source,name,new_source):
              fn=find_function(source,name)
              if not fn:
                  raise SystemExit("RC894: function "+name+" not found")
              return source[:fn[0]]+new_source+source[fn[1]:]

          # Patch the actual layout owner, not a later overlay.
          fn=find_function(body,"applyFixedBlocks")
          apply_src=fn[2]
          old_left="[customer,shipmentBlock].forEach(function(x){left.appendChild(x)});"
          old_right="[colli,documents,abdDecisionBlock].forEach(function(x){right.appendChild(x)});"
          if old_left not in apply_src or old_right not in apply_src:
              raise SystemExit("RC894: expected left/right append statements not found")
          apply_src=apply_src.replace(old_left,"[customer,shipmentBlock,colli,documents,abdDecisionBlock].forEach(function(x){top.appendChild(x)});",1)
          apply_src=apply_src.replace(old_right,"if(left&&left.parentNode)left.remove();if(right&&right.parentNode)right.remove();top.className='rc894-full-stack';",1)

          # Remove legacy in-form customer Avis host creation.
          avis_start=apply_src.find("var avisEditHost=document.getElementById('rc845AvisEditHost')")
          if avis_start<0:
              raise SystemExit("RC894: legacy rc845AvisEditHost block not found")
          loop_marker="[customerBody,shipmentBody,documentsBody].forEach(function(body)"
          avis_end=apply_src.find(loop_marker,avis_start)
          if avis_end<0:
              raise SystemExit("RC894: end of legacy Avis host block not found")
          apply_src=apply_src[:avis_start]+apply_src[avis_end:]

          # Apply exact Sendungsdaten field positions after legacy width tagging has run.
          saved_marker="var saved=document.getElementById('rc573SavedCard')"
          saved_pos=apply_src.find(saved_marker)
          if saved_pos<0:
              raise SystemExit("RC894: saved shipment marker not found")
          apply_src=apply_src[:saved_pos]+"applyRC894ShipmentFieldGrid(shipmentBody);ensureRC894LieferavisButton();\n "+apply_src[saved_pos:]

          # Do not render the customer public Avis inside shipmentBody anymore.
          apply_src=re.sub(
              r"try\{if\(window\.ExportHUBCustomerAvis706&&typeof window\.ExportHUBCustomerAvis706\.render==='function'\)window\.ExportHUBCustomerAvis706\.render\(\)\}catch\(e\)\{console\.error\('RC845 Lieferavis nach Sendungslayout',e\)\}",
              "ensureRC894LieferavisButton();",
              apply_src,
              count=1
          )
          body=body[:fn[0]]+apply_src+body[fn[1]:]

          safe_new="""function safePatchDuringEdit(){enforceEditingCustomerLock();var block=document.getElementById('rc363BlockShipment'),body=block&&block.querySelector('.rc363-process-body');applyRC894ShipmentFieldGrid(body);ensureRC894LieferavisButton();updateSummary();updateQr();updateConfirmationButtons();return true}"""
          defer_new="""function deferFullPatch(delay){if(!isShipmentView())return false;fullPatchPending=false;safePatchDuringEdit();return true}"""
          schedule_new="""function schedulePatch(){if(!isShipmentView())return false;var layout=document.getElementById('rc363FixedShipmentLayout');if(layout||editLockActive()){safePatchDuringEdit();return true}if(patchTimer)return true;var nt=window.ExportHUBClean&&window.ExportHUBClean.native&&window.ExportHUBClean.native.setTimeout||window.setTimeout;patchTimer=nt(function(){patchTimer=0;patch()},16);return true}"""

          body=replace_function(body,"safePatchDuringEdit",safe_new)
          body=replace_function(body,"deferFullPatch",defer_new)
          body=replace_function(body,"schedulePatch",schedule_new)

          patch_fn=find_function(body,"patch")
          patch_src=patch_fn[2]
          patch_src=patch_src.replace("if(busy){return deferFullPatch(250)}","if(busy){safePatchDuringEdit();return true}",1)
          patch_src=patch_src.replace("if(editLockActive()){safePatchDuringEdit();return deferFullPatch(250)}","if(editLockActive()){safePatchDuringEdit();return true}",1)
          if "return deferFullPatch(250)" in patch_src:
              raise SystemExit("RC894: patch still contains deferred full patch")
          body=body[:patch_fn[0]]+patch_src+body[patch_fn[1]:]

          # Ensure the toolbar entry survives normal application render events without a MutationObserver.
          api_marker="var api=Object.freeze("
          api_pos=body.find(api_marker)
          listener="""\n['exporthub:ready','exporthub:rendered','exporthub:viewchange'].forEach(function(name){window.addEventListener(name,function(){var nt=window.ExportHUBClean&&window.ExportHUBClean.native&&window.ExportHUBClean.native.setTimeout||window.setTimeout;nt(ensureRC894LieferavisButton,0)})});\n"""
          if api_pos>=0:
              body=body[:api_pos]+listener+body[api_pos:]
          else:
              body+=listener

          replacement=chosen.group(0).replace(chosen.group(2),body,1)
          src=src[:chosen.start()]+replacement+src[chosen.end():]
          path.write_text(src,encoding="utf-8")
          print("RC894 core shipment repair written")
          PY

      - name: GREEN verify RC894 source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "var BUILD=Object.freeze({version:'RC894',cache:'894',loginReturn:'/TESTVERSION.html?v=894'});" TESTVERSION.html
          grep -Fq "/* exporthub-rc894-shipment-core */" TESTVERSION.html
          grep -Fq "rc894LieferAvisBtn" TESTVERSION.html
          grep -Fq "/customer-avis.html?v=894" TESTVERSION.html
          grep -Fq "data-rc894-grid" TESTVERSION.html

          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib,json

          src=Path("TESTVERSION.html").read_text(encoding="utf-8",errors="strict")
          canonical=re.search(r'<script\b[^>]*\bid=["\']exporthub-canonical-modules["\'][^>]*>(.*?)</script>',src,re.I|re.S)
          if not canonical:
              raise SystemExit("Canonical module script missing after RC894")
          before=Path("/tmp/rc894-canonical.sha").read_text().strip()
          after=hashlib.sha256(canonical.group(1).encode()).hexdigest()
          if before!=after:
              raise SystemExit("Canonical module script changed during RC894")

          bounds_before=json.loads(Path("/tmp/rc894-boundaries.json").read_text())
          bounds_after={
              "script_open":src.lower().count("<script"),
              "script_close":src.lower().count("</script>"),
              "style_open":src.lower().count("<style"),
              "style_close":src.lower().count("</style>")
          }
          if bounds_before!=bounds_after:
              raise SystemExit("HTML script/style boundaries changed: "+repr({"before":bounds_before,"after":bounds_after}))

          def executable_scripts(source):
              for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>',source,re.I|re.S):
                  attrs=m.group(1) or ""
                  if re.search(r'\bid=["\']exporthub-canonical-modules["\']',attrs,re.I):
                      continue
                  yield m.group(2)

          target=next((b for b in executable_scripts(src) if "/* exporthub-rc894-shipment-core */" in b),None)
          if not target:
              raise SystemExit("RC894 executable target script missing")

          checks={
              "old left append":"[customer,shipmentBlock].forEach(function(x){left.appendChild(x)})" not in target,
              "old right append":"[colli,documents,abdDecisionBlock].forEach(function(x){right.appendChild(x)})" not in target,
              "legacy Avis host injection":"shipmentBody.appendChild(avisEditHost)" not in target,
              "recursive 250ms retry":"deferredPatchTimer=nt(retry,250)" not in target,
              "defer in patch":"return deferFullPatch(250)" not in target,
              "no observer":"new MutationObserver" not in target[target.find('/* exporthub-rc894-shipment-core */'):target.find('var api=Object.freeze(',target.find('/* exporthub-rc894-shipment-core */')) if 'var api=Object.freeze(' in target else len(target)],
              "no interval":"setInterval(" not in target[target.find('/* exporthub-rc894-shipment-core */'):target.find('var api=Object.freeze(',target.find('/* exporthub-rc894-shipment-core */')) if 'var api=Object.freeze(' in target else len(target)]
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit("RC894 GREEN failed: "+", ".join(failed))
          print("RC894 GREEN source verification passed")
          PY

      - name: Check modified executable shipment script syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path("TESTVERSION.html").read_text(encoding="utf-8")
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script>',src,re.I|re.S)):
              attrs=m.group(1) or ""
              body=m.group(2)
              if "/* exporthub-rc894-shipment-core */" in body:
                  Path("/tmp/rc894-target.js").write_text(body,encoding="utf-8")
                  print("Extracted target script",i,"length",len(body))
                  break
          else:
              raise SystemExit("Modified RC894 script not found")
          PY
          node --check /tmp/rc894-target.js

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "TESTVERSION.html" ]]; then
            echo "::error::RC894 may only change TESTVERSION.html"
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi
          git diff --check
          git diff --stat

          if ! git diff --quiet -- index.html api staticwebapp.config.json staticwebapp.testservice.config.json .github/workflows customer-avis.html; then
            echo "::error::Production/API/workflows/customer-avis were modified."
            exit 1
          fi

      - name: Commit RC894 TESTSERVICE
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC894: repair shipment layout render loop and Lieferavis entry"
          git push origin main

      - name: RC894 summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## ExportHUB RC894"
            echo ""
            echo "- Sendung erstellen: core layout uses full width"
            echo "- Sendungsdaten: reference / pickup date / carrier in row 1"
            echo "- Sendungsdaten: CMR description / remark in row 2"
            echo "- Recursive 250 ms full-render retry removed"
            echo "- Lieferavis: permanent toolbar entry, no in-form Avis host"
            echo "- Canonical module script protected by SHA-256"
            echo "- Scope: TESTVERSION.html only"
          } >> "$GITHUB_STEP_SUMMARY"
