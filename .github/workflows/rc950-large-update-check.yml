name: RC950 Large Update Check

on:
  push:
    branches:
      - rc950-large-update
    paths:
      - 'TESTVERSION.html'
      - '.github/rc950_audit.py'
      - '.github/rc950_regression.py'
      - '.github/workflows/rc950-large-update-check.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc950-large-update-check
  cancel-in-progress: true

jobs:
  audit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout RC950 branch
        uses: actions/checkout@v4
        with:
          ref: rc950-large-update
          fetch-depth: 1

      - name: Generate active-path audit
        run: python3 .github/rc950_audit.py

      - name: Verify RED or GREEN phase
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "version:'RC950',cache:'950',loginReturn:'/TESTVERSION.html?v=950'" TESTVERSION.html; then
            echo 'RC950 implementation detected: GREEN required.'
            python3 .github/rc950_regression.py
            npm test
          else
            echo 'Pre-implementation baseline detected: RED required.'
            if python3 .github/rc950_regression.py; then
              echo 'RC950 regression unexpectedly passed before implementation.'
              exit 1
            fi
            echo 'Expected RED baseline confirmed.'
          fi

      - name: Commit audit output when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/superpowers/rc950-audit.txt 2>/dev/null && git ls-files --error-unmatch docs/superpowers/rc950-audit.txt >/dev/null 2>&1; then
            echo 'Audit output unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/rc950-audit.txt
          git commit -m 'chore: capture RC950 active path audit'
          git push origin HEAD:rc950-large-update
