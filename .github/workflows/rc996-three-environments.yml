name: RC996 Three Environments + Android

on:
  push:
    branches:
      - rc996-three-environments-android
    paths:
      - 'test/rc996-environments.test.mjs'
      - 'assets/exporthub-environments.js'
      - 'assets/exporthub-demo.js'
      - 'demo.html'
      - 'index.html'
      - 'TESTVERSION.html'
      - 'production-version.js'
      - 'android-app/**'
      - '.github/workflows/rc996-three-environments.yml'
      - 'docs/superpowers/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc996-three-environments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: RC996 contract
        run: node --test test/rc996-environments.test.mjs

  android:
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build Android debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
