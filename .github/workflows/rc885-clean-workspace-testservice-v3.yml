      - name: RC885 source and syntax tests
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "version:'RC885',cache:'885',loginReturn:'/TESTVERSION.html?v=885'" TESTVERSION.html
          grep -Fq "<!-- exporthub-rc885-clean-workspace -->" TESTVERSION.html
          grep -Fq 'id="rc885Workspace"' TESTVERSION.html
          grep -Fq 'Meine Aufgaben' TESTVERSION.html
          grep -Fq 'Meine Sendungen' TESTVERSION.html
          grep -Fq 'Warncenter' TESTVERSION.html
          grep -Fq 'data-rc885-focus' TESTVERSION.html

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile

          src = Path("TESTVERSION.html").read_text(encoding="utf-8", errors="replace")

          class Visible(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script = 0
                  self.style = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  t = tag.lower()
                  if t == "script":
                      self.script += 1
                  elif t == "style":
                      self.style += 1
              def handle_endtag(self, tag):
                  t = tag.lower()
                  if t == "script" and self.script:
                      self.script -= 1
                  elif t == "style" and self.style:
                      self.style -= 1
              def handle_data(self, data):
                  if not self.script and not self.style:
                      self.parts.append(data)

          parser = Visible()
          parser.feed(src)
          parser.close()
          visible = "\n".join(parser.parts)

          bad = [
              "function applyFixedBlocks()",
              "function canonicalActionButtons(",
              "function createQr(",
              "window.open('about:blank'",
              'window.open("about:blank"',
              "function warningData()",
              "function mountWorkspace()",
          ]
          leaks = [x for x in bad if x in visible]
          if leaks:
              raise SystemExit("JavaScript als sichtbarer Seitentext: " + ", ".join(leaks))

          match = re.search(
              r'<script id="exporthub-rc885-clean-workspace-script">(.*?)</script>',
              src,
              re.S
          )
          if not match:
              raise SystemExit("RC885 Scriptblock fehlt.")

          with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as f:
              f.write(match.group(1))
              name = f.name

          result = subprocess.run(["node", "--check", name], capture_output=True, text=True)
          if result.returncode != 0:
              raise SystemExit("RC885 JavaScript-Syntaxfehler:\n" + result.stderr)

          if src.lower().count("</body>") != 1:
              raise SystemExit("HTML besitzt nicht genau einen </body>-Abschluss.")

          print("RC885 Source-/Syntax-Test PASS")
          PY

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet --             index.html             production-version.js             api             pickup.html             location.html             customer-avis.html             staticwebapp.config.json             staticwebapp.testservice.config.json
          then
            echo "::error::Produktions-/API-Dateien wurden verändert."
            exit 1
          fi

          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "TESTVERSION.html" ]]; then
            echo "::error::RC885 darf ausschließlich TESTVERSION.html ändern."
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi

      - name: Commit RC885 clean workspace
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC885: clean personal workspace"
          git push origin main

      - name: Snapshot TESTSERVICE deploy runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list             --workflow exporthub-testservice.yml             --limit 50             --json databaseId             --jq '.[].databaseId' > /tmp/testservice_runs_before.txt || true

      - name: Dispatch TESTSERVICE deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/exporthub-testservice.yml/dispatches"             -f ref=main

      - name: Wait for TESTSERVICE RC885 deploy
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""

          for attempt in $(seq 1 60); do
            mapfile -t IDS < <(
              gh run list                 --workflow exporthub-testservice.yml                 --event workflow_dispatch                 --branch main                 --limit 20                 --json databaseId                 --jq '.[].databaseId'
            )

            for id in "${IDS[@]}"; do
              if ! grep -qx "${id}" /tmp/testservice_runs_before.txt 2>/dev/null; then
                RUN_ID="${id}"
                break
              fi
            done

            [[ -n "${RUN_ID}" ]] && break
            sleep 5
          done

          if [[ -z "${RUN_ID}" ]]; then
            echo "::error::TESTSERVICE-Deploy wurde nicht gefunden."
            exit 1
          fi

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          gh run watch "${RUN_ID}" --exit-status

      - name: Verify deploy success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ steps.deploy.outputs.run_id }}
        run: |
          set -euo pipefail
          CONCLUSION="$(gh run view "${DEPLOY_RUN_ID}" --json conclusion --jq '.conclusion')"
          if [[ "${CONCLUSION}" != "success" ]]; then
            echo "::error::TESTSERVICE-Deploy endete mit ${CONCLUSION}."
            exit 1
          fi
          echo "RC885 TESTSERVICE Deploy erfolgreich."

      - name: RC885 summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RC885 Clean Workspace v3"
            echo
            echo "- Basis: RC884"
            echo "- Nur TESTVERSION.html"
            echo "- Meine Aufgaben und Meine Sendungen getrennt"
            echo "- Arbeitsfokus: Alles / Fällig / Dokumente / Abholung"
            echo "- Warncenter kompakt"
            echo "- Keine Arbeitsübergabe"
            echo "- Sendung erstellen bleibt in RC885 unangetastet"
          } >> "$GITHUB_STEP_SUMMARY"
