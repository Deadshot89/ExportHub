name: RC970 Auth ETag Cache Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc970-auth-etag-cache-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RC970 Patch anwenden
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re,base64,hashlib

          api_path=Path('api/exporthub-state/index.js')
          html_path=Path('TESTVERSION.html')
          api=api_path.read_text(encoding='utf-8')
          html=html_path.read_text(encoding='utf-8')

          assert "const API_VERSION = 'RC969';" in api
          api=api.replace("const API_VERSION = 'RC969';","const API_VERSION = 'RC970';",1)

          assert "const TEAM_WARM_CACHE = new Map();" in api
          api=api.replace("const TEAM_WARM_CACHE = new Map();","const TEAM_WARM_CACHE = new Map();\nconst AUTH_WARM_CACHE = new Map();",1)

          old="function timingHeaders(t={}){const h={'X-ExportHUB-Server-Ms':String(Math.max(0,Number(t.serverMs||0)||0)),'X-ExportHUB-Auth-Ms':String(Math.max(0,Number(t.authMs||0)||0)),'X-ExportHUB-Team-Ms':String(Math.max(0,Number(t.teamMs||0)||0)),'X-ExportHUB-Team-Cache':text(t.teamCache||'none')||'none'};"
          new="function timingHeaders(t={}){const h={'X-ExportHUB-Server-Ms':String(Math.max(0,Number(t.serverMs||0)||0)),'X-ExportHUB-Auth-Ms':String(Math.max(0,Number(t.authMs||0)||0)),'X-ExportHUB-Auth-Cache':text(t.authCache||'none')||'none','X-ExportHUB-Team-Ms':String(Math.max(0,Number(t.teamMs||0)||0)),'X-ExportHUB-Team-Cache':text(t.teamCache||'none')||'none'};"
          assert old in api
          api=api.replace(old,new,1)

          marker="function resolveSessionFromAuth(token,authDoc){"
          assert marker in api
          cache_code="""function authWarmCacheKey(c){return String(c&&c.auth&&c.auth.name||AUTH_BLOB)}
function rememberWarmAuth(c,value,etag){if(!c||!value||!etag)return false;AUTH_WARM_CACHE.set(authWarmCacheKey(c),{value:value,etag:String(etag),at:Date.now()});return true}
function forgetWarmAuth(c){AUTH_WARM_CACHE.delete(authWarmCacheKey(c))}
async function readAuthCached(c){
 const cached=AUTH_WARM_CACHE.get(authWarmCacheKey(c));
 if(cached&&cached.value&&cached.etag){
  try{const props=await c.auth.getProperties(),etag=props&&props.etag?String(props.etag):'';if(etag&&etag===String(cached.etag))return {value:cached.value,etag:etag,warmCache:true,cacheMode:'memory-etag'};forgetWarmAuth(c)}
  catch(e){forgetWarmAuth(c);if(Number(e&&e.statusCode||0)!==404)throw e}
 }
 const fresh=await readJson(c.auth,emptyAuth(),true);fresh.cacheMode='full-read';rememberWarmAuth(c,fresh&&fresh.value,fresh&&fresh.etag);return fresh
}
"""
          api=api.replace(marker,cache_code+marker,1)

          old_authonly="const authDoc=await readJson(c.auth,emptyAuth(),true),resolved=resolveSessionFromAuth(token,authDoc),session=resolved.session,username=text(session.username)||'Benutzer';"
          new_authonly="const authDoc=await readAuthCached(c),resolved=resolveSessionFromAuth(token,authDoc),session=resolved.session,username=text(session.username)||'Benutzer';"
          assert old_authonly in api
          api=api.replace(old_authonly,new_authonly,1)

          assert "let authMs=0,teamMs=0;" in api
          api=api.replace("let authMs=0,teamMs=0;","let authMs=0,teamMs=0,authCache='unknown';",1)

          old_promise="const authStarted=Date.now(),authPromise=readJson(c.auth,emptyAuth(),true).then(v=>{authMs=Date.now()-authStarted;return v},e=>{authMs=Date.now()-authStarted;throw e});"
          new_promise="const authStarted=Date.now(),authPromise=readAuthCached(c).then(v=>{authMs=Date.now()-authStarted;authCache=v&&v.cacheMode||'unknown';return v},e=>{authMs=Date.now()-authStarted;throw e});"
          assert old_promise in api
          api=api.replace(old_promise,new_promise,1)

          old_timing="timing:{authMs,teamMs,validationMs:Date.now()-validationStarted,teamCache:teamDoc.cacheMode||'unknown'}"
          new_timing="timing:{authMs,authCache,teamMs,validationMs:Date.now()-validationStarted,teamCache:teamDoc.cacheMode||'unknown'}"
          assert old_timing in api
          api=api.replace(old_timing,new_timing,1)

          response_fragment="authMs:Number(current.timing&&current.timing.authMs||0),teamMs:"
          response_replacement="authMs:Number(current.timing&&current.timing.authMs||0),authCache:text(current.timing&&current.timing.authCache||'unknown')||'unknown',teamMs:"
          count=api.count(response_fragment)
          assert count>=3, f'Erwartete mindestens 3 Timing-Antwortpfade, gefunden {count}'
          api=api.replace(response_fragment,response_replacement)
          api_path.write_text(api,encoding='utf-8')

          build_old="var BUILD=Object.freeze({version:'RC969',cache:'969'"
          assert build_old in html
          html=html.replace(build_old,"var BUILD=Object.freeze({version:'RC970',cache:'970'",1)

          marker_note="    'RC969"
          if marker_note in html:
            notes=("    'RC970 beschleunigt wiederholte Sessionprüfungen mit einem ETag-geprüften Auth-Warm-Cache. Bei unverändertem auth-sessions.json entfällt nur der erneute Inhaltsdownload; Azure getProperties prüft weiterhin bei jedem State-Aufruf das aktuelle ETag.',\n"
                   "    'RC970 lädt bei jeder ETag-Änderung den Auth-Stand sofort neu. Logout, Sitzungswiderruf, Kontosperren und authVersion-Änderungen bleiben damit unmittelbar wirksam; Merge- und Save-Logik wurden nicht verändert.',\n")
            html=html.replace(marker_note,notes+marker_note,1)

          api_bytes=api_path.read_bytes()
          sha=hashlib.sha256(api_bytes).hexdigest()
          b64=base64.b64encode(api_bytes).decode('ascii')
          pat=re.compile(r'<!--\s*EXPORTHUB_TESTSERVICE_FILE_BEGIN\s+path=api/exporthub-state/index\.js\s+encoding=base64\s+sha256=[a-f0-9]{64}\s*\r?\n[\s\S]*?\r?\nEXPORTHUB_TESTSERVICE_FILE_END\s*-->',re.I)
          repl='<!-- EXPORTHUB_TESTSERVICE_FILE_BEGIN path=api/exporthub-state/index.js encoding=base64 sha256='+sha+'\n'+b64+'\nEXPORTHUB_TESTSERVICE_FILE_END -->'
          html,n=pat.subn(repl,html,count=1)
          assert n==1,'Eingebetteter State-API-Fallback nicht gefunden'
          html_path.write_text(html,encoding='utf-8')
          PY

          node --check api/exporthub-state/index.js
          git diff --check

      - name: RC970 GREEN Verhalten prüfen
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const source=fs.readFileSync('api/exporthub-state/index.js','utf8');
          const html=fs.readFileSync('TESTVERSION.html','utf8');
          assert(/const API_VERSION = 'RC970';/.test(source));
          assert(/version:'RC970'/.test(html));
          assert(/X-ExportHUB-Auth-Cache/.test(source));
          assert(/timing:\{authMs,authCache,teamMs/.test(source));
          assert(/readAuthCached\(c\)/.test(source));

          const testSource=source+'\nmodule.exports.__rc970={readAuthCached,forgetWarmAuth};';
          const sandbox={module:{exports:{}},exports:{},Buffer,Date,console,process:{env:{}},require:(id)=>{
            if(id==='crypto')return require('crypto');
            if(id==='../shared/blob-rest')return {createBlobServiceClient:()=>{throw new Error('not used')}};
            if(id==='../shared/merge')return {mergeState:(a)=>a,sanitizeState:(a)=>a,pruneTombstones:(a)=>a,clone:(v)=>v===undefined?undefined:JSON.parse(JSON.stringify(v)),isLocalOnlyKey:()=>false};
            throw new Error('unexpected require '+id);
          }};
          vm.runInNewContext(testSource,sandbox,{filename:'index.js'});
          const {readAuthCached,forgetWarmAuth}=sandbox.module.exports.__rc970;
          let downloads=0,properties=0,currentEtag='"e1"';
          let currentDoc={schemaVersion:1,sessions:[{id:'s1',tokenHash:'h1'}]};
          const c={auth:{name:'auth-sessions.json',async getProperties(){properties++;return {etag:currentEtag}},async download(){downloads++;const raw=Buffer.from(JSON.stringify(currentDoc));return {etag:currentEtag,readableStreamBody:(async function*(){yield raw})()}}}};
          (async()=>{
            forgetWarmAuth(c);
            const a=await readAuthCached(c);assert.strictEqual(a.cacheMode,'full-read');assert.strictEqual(downloads,1);assert.strictEqual(properties,0);
            const b=await readAuthCached(c);assert.strictEqual(b.cacheMode,'memory-etag');assert.strictEqual(downloads,1);assert.strictEqual(properties,1);
            currentEtag='"e2"';currentDoc={schemaVersion:1,sessions:[{id:'s1',tokenHash:'h1',revokedAt:'now'}]};
            const d=await readAuthCached(c);assert.strictEqual(d.cacheMode,'full-read');assert.strictEqual(downloads,2);assert.strictEqual(properties,2);assert.strictEqual(d.value.sessions[0].revokedAt,'now');
            console.log('RC970 GREEN auth ETag cache');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit RC970 Produktpatch
        shell: bash
        run: |
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add TESTVERSION.html api/exporthub-state/index.js
          git commit -m 'RC970: Auth Session Reads per ETag cachen'
          git push origin main
