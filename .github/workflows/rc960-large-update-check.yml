name: RC960 Large Update Check

on:
  push:
    branches:
      - rc960-large-update
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc960-large-update-check
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc960-large-update
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Apply RC960 GREEN patch
        run: python .github/rc960_apply.py
      - name: RC960 static regression contract
        run: python .github/rc960_regression.py
      - name: RC960 pickup client behavior
        run: node .github/rc960_runtime.js
      - name: RC960 pickup server behavior
        run: node .github/rc960_api_tests.js
      - name: Syntax checks
        run: |
          node --check api/shared/pickup-store.js
          node --check api/pickup-init/index.js
          node --check api/pickup-confirm-v2/index.js
      - name: RC960 active-path audit
        run: python .github/rc960_audit.py | tee docs/superpowers/rc960-audit.txt
      - name: RC960 focused function extract
        run: python .github/rc960_focus.py
      - name: RC960 active runtime extract
        run: python .github/rc960_runtime_focus.py
      - name: RC960 grouped runtime extracts
        run: python .github/rc960_group_extract.py
      - name: RC960 target runtime extract
        run: python .github/rc960_target_extract.py
      - name: RC960 exact function extract
        run: python .github/rc960_exact_extract.py
      - name: RC960 release confirmation extract
        run: python .github/rc960_release_exact.py
      - name: Existing baseline tests
        run: npm test
      - name: Final RC960 reapply check
        run: python .github/rc960_apply.py
      - name: Final RC960 regression check
        run: python .github/rc960_regression.py
      - name: Final RC960 pickup client check
        run: node .github/rc960_runtime.js
      - name: Final RC960 pickup server check
        run: node .github/rc960_api_tests.js
      - name: Final RC960 product diff check
        run: git diff --check -- TESTVERSION.html pickup.html api/shared/pickup-store.js api/pickup-init/index.js api/pickup-confirm-v2/index.js
      - name: Commit verified RC960 changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html pickup.html api/shared/pickup-store.js api/pickup-init/index.js api/pickup-confirm-v2/index.js docs/superpowers/rc960-audit.txt docs/superpowers/rc960-focus.txt docs/superpowers/rc960-runtime-focus.txt docs/superpowers/rc960-shipping-focus.txt docs/superpowers/rc960-pickup-focus.txt docs/superpowers/rc960-release-focus.txt docs/superpowers/rc960-admin-focus.txt docs/superpowers/rc960-target-focus.txt docs/superpowers/rc960-exact-focus.txt docs/superpowers/rc960-release-exact.txt
          if git diff --cached --quiet; then
            echo "RC960 working tree already verified and unchanged."
            exit 0
          fi
          git commit -m "RC960 Großupdate Kernbetrieb Versand Abholung Admin"
          git push origin HEAD:rc960-large-update
