name: SOPMaster Visual Verify

on:
  push:
    branches:
      - design/sopmaster-training-tour-2026-10-12
    paths:
      - 'assets/sop/rc1007-sop-ui.js'
      - 'assets/sop/rc1007-sop.css'
      - 'assets/sop/rc1502-sop-*'
      - 'browser/rc1502-sop-screenshots.mjs'
      - 'test/rc1502-sop-*.test.mjs'
      - 'e2e/specs/sopmaster-target-picker.spec.mjs'
      - 'e2e/helpers/exporthub-browser.mjs'
      - '.github/rc1502/**'
      - '.github/workflows/sopmaster-visual-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sopmaster-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1502 visual and legacy SOP regression
        run: node --test test/rc1007-sop-workflow.test.mjs test/rc1502-sop-*.test.mjs

  browser-capture:
    needs: visual-contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Build current RC1502 demo package
        run: node .github/rc1502/build-three-env.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium
      - name: Capture RC1502 demo screenshots
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist-rc1112 >/tmp/rc1502-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/demo.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/demo.html >/dev/null
          RC1502_BROWSER_URL=http://127.0.0.1:4173/demo.html node browser/rc1502-sop-screenshots.mjs
      - name: Verify target picker on desktop and mobile
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_ENTRY: '/demo.html'
        run: npx playwright test e2e/specs/sopmaster-target-picker.spec.mjs --project=desktop --project=mobile-standard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sopmaster-rc1502-screenshots
          path: artifacts/rc1502-sop-screenshots
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sopmaster-rc1502-target-picker-debug
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
