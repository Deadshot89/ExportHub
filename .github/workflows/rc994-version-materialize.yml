name: RC994 Version Materialize

on:
  push:
    branches:
      - rc994-drag-performance
    paths:
      - '.github/workflows/rc994-version-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply RC994 build marker and Release Center entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('TESTVERSION.html')
          text=path.read_text(encoding='utf-8')

          build_pattern=re.compile(r"var\s+BUILD\s*=\s*Object\.freeze\(\{version:'RC993',cache:'993',loginReturn:'/TESTVERSION\.html\?v=993'\}\);?")
          build_new="var BUILD=Object.freeze({version:'RC994',cache:'994',loginReturn:'/TESTVERSION.html?v=994'});"
          text,n=build_pattern.subn(build_new,text,count=1)
          if n!=1:
            raise SystemExit(f'RC993 BUILD marker match count={n}')

          old_entry='RC993 berechnet die gefilterte und sortierte Sendungsübersicht pro ruhigem Patch nur einmal und verwendet dieselbe Reihenfolge für Kartenverschiebungen und Sortierung.'
          new_entry='RC994 hält Verschiebungen im Aufgabenplaner und Lager im lokalen DOM-Hotpath: Der Planer vermeidet den nachgelagerten Vollrender und das Lager aktualisiert nur das tatsächlich geänderte Drop-Ziel.'
          if new_entry in text:
            raise SystemExit('RC994 Release-Eintrag ist unerwartet bereits vorhanden')
          needle='changes:Object.freeze(["'+old_entry+'"'
          if text.count(needle)!=1:
            raise SystemExit(f'RC993 Release-Einstieg match count={text.count(needle)}')
          text=text.replace(needle,'changes:Object.freeze(["'+new_entry+'","'+old_entry+'"',1)

          path.write_text(text,encoding='utf-8')
          print('RC994 Buildmarker und Release-Center-Eintrag angewendet.')
          PY

      - name: RC994 targeted test
        run: node --test test/rc994-drag-performance.test.mjs

      - name: Full test suite
        run: npm test

      - name: Commit RC994 version bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TESTVERSION.html
          git diff --cached --check
          git commit -m 'RC994: TESTSERVICE-Build und Release-Center anheben'
          git push
