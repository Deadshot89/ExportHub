name: ExportHUB Diagnose Autofix

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Autofix-Auftrag
        required: true
        type: string
      environment:
        description: ExportHUB-Umgebung
        required: true
        type: choice
        options:
          - production
          - testservice

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: exporthub-diagnostic-autofix-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  diagnose_fix_test_prepare_pr:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # Claude Code: API key (console.anthropic.com) or a Claude subscription token (claude setup-token)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      JOB_ID: ${{ inputs.job_id }}
      TARGET_ENV: ${{ inputs.environment }}
      PROD_URL: https://wonderful-forest-0f315e310.7.azurestaticapps.net
      TEST_URL: https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      # before the prerequisites, so even an early abort (e.g. missing Claude secret) is reported to ExportHUB
      - name: Kurzlebige GitHub-OIDC-Identität abrufen
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=exporthub-diagnostic-autofix")
          token=$(printf '%s' "$response" | jq -r '.value // empty')
          test -n "$token" || { echo 'GitHub-OIDC-Token konnte nicht erstellt werden.' >&2; exit 1; }
          echo "::add-mask::$token"
          umask 077
          printf '%s' "$token" > "$RUNNER_TEMP/exporthub-autofix-oidc.jwt"

      - name: Autofix-Voraussetzungen prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JOB_ID"
          test "$TARGET_ENV" = "production" -o "$TARGET_ENV" = "testservice"
          if [[ -z "${ANTHROPIC_API_KEY:-}" && -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "ANTHROPIC_API_KEY oder CLAUDE_CODE_OAUTH_TOKEN fehlt als Repository-Secret." >&2
            # shown in "Meine KI-Aufträge" via the failure report below
            echo "Claude-Zugang fehlt: Repository-Secret CLAUDE_CODE_OAUTH_TOKEN oder ANTHROPIC_API_KEY ist nicht gesetzt." > /tmp/exporthub-autofix-final.txt
            exit 1
          fi

      - name: Diagnose-Prompt und Anhang abrufen
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .exporthub-autofix
          base="$PROD_URL"
          [[ "$TARGET_ENV" == "testservice" ]] && base="$TEST_URL"
          code=$(curl -sS -o .exporthub-autofix/claim.json -w '%{http_code}' \
            -X POST "$base/api/diagnostic-autofix" \
            -H 'Content-Type: application/json' \
            -H "X-ExportHUB-GitHub-OIDC: $(cat "$RUNNER_TEMP/exporthub-autofix-oidc.jwt")" \
            --data "$(jq -nc --arg j "$JOB_ID" --arg e "$TARGET_ENV" '{action:"claim",jobId:$j,environment:$e}')")
          if [[ "$code" != "200" ]]; then
            cat .exporthub-autofix/claim.json >&2 || true
            exit 1
          fi
          jq -e '.ok == true and .prompt and .attachment and .diagnosticId' .exporthub-autofix/claim.json >/dev/null
          jq -r '.prompt' .exporthub-autofix/claim.json > .exporthub-autofix/prompt.txt
          jq '.attachment' .exporthub-autofix/claim.json > .exporthub-autofix/diagnostic-attachment.json
          jq -r '.diagnosticId' .exporthub-autofix/claim.json > .exporthub-autofix/diagnostic-id.txt
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Diagnose als in Bearbeitung markieren
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.claim.outputs.base }}"
          curl -fsS -X POST "$base/api/diagnostic-autofix" \
            -H 'Content-Type: application/json' \
            -H "X-ExportHUB-GitHub-OIDC: $(cat "$RUNNER_TEMP/exporthub-autofix-oidc.jwt")" \
            --data "$(jq -nc --arg j "$JOB_ID" --arg e "$TARGET_ENV" --arg u "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{action:"workflow-status",jobId:$j,environment:$e,status:"running",message:"Claude Code analysiert den Diagnose-Anhang und den aktuellen Repository-Stand.",runUrl:$u}')" >/dev/null

      - name: Claude Code installieren
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Claude Code analysiert und behebt den Fehler
        shell: bash
        run: |
          set -euo pipefail
          # Headless Claude Code: only file tools plus tests and read-only git; no web access and no
          # free shell, so text from a diagnostic cannot make it run network commands with the key in env.
          claude -p "$(cat .exporthub-autofix/prompt.txt)" \
            --permission-mode acceptEdits \
            --allowedTools 'Read,Edit,MultiEdit,Write,Glob,Grep,TodoWrite,Bash(npm test),Bash(npm test:*),Bash(node --test:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*)' \
            --disallowedTools 'WebFetch,WebSearch' \
            --max-turns 120 \
            --output-format text \
            > .exporthub-autofix/final.txt || {
            rc=$?
            # Claude prints auth and quota errors to stdout; show them in the log and prefix a hint
            # so the failure callback tells the reporter why nothing happened.
            out=$(head -c 2000 .exporthub-autofix/final.txt 2>/dev/null || true)
            if grep -qiE '401|invalid.*(api key|token)|authenticat|oauth' <<<"$out"; then
              echo "Claude-Zugang ungültig: Secret CLAUDE_CODE_OAUTH_TOKEN prüfen (vollständiger Wert sk-ant-oat01-… aus claude setup-token). Ausgabe: $out" > .exporthub-autofix/final.txt
            else
              echo "Claude Code ist mit Code $rc abgebrochen. Ausgabe: ${out:-keine}" > .exporthub-autofix/final.txt
            fi
            cat .exporthub-autofix/final.txt
            exit "$rc"
          }
          test -s .exporthub-autofix/final.txt
          cat .exporthub-autofix/final.txt
          if grep -q '^BLOCKED:' .exporthub-autofix/final.txt; then
            # the reason goes first so ExportHUB shows it in "Meine KI-Aufträge"
            sed -n '/^BLOCKED:/,$p' .exporthub-autofix/final.txt > /tmp/exporthub-autofix-final.txt
            echo "Claude Code hat keine sicher belegbare Korrektur gefunden (BLOCKED, Begründung oben)." >&2
            exit 2
          fi

      - name: Änderungen gegen Schutzregeln prüfen
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if git diff --name-only -- .github/workflows/diagnostic-autofix.yml | grep -q .; then
            echo "Autofix darf seinen eigenen Workflow nicht verändern." >&2
            exit 1
          fi
          if git diff --name-only | grep -E '(^|/)(\.env|local\.settings|secrets?\.|credentials?\.)' >/dev/null; then
            echo "Autofix darf keine Secret-/Credential-Dateien verändern." >&2
            exit 1
          fi
          changed=$(git diff --name-only | wc -l | tr -d ' ')
          deleted=$(git diff --diff-filter=D --name-only | wc -l | tr -d ' ')
          if (( changed > 50 )); then
            echo "Autofix hat zu viele Dateien verändert: $changed" >&2
            exit 1
          fi
          if (( deleted > 10 )); then
            echo "Autofix würde zu viele Dateien löschen: $deleted" >&2
            exit 1
          fi

      - name: Diagnose als Testphase markieren
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.claim.outputs.base }}"
          msg=$(head -c 3000 .exporthub-autofix/final.txt)
          curl -fsS -X POST "$base/api/diagnostic-autofix" \
            -H 'Content-Type: application/json' \
            -H "X-ExportHUB-GitHub-OIDC: $(cat "$RUNNER_TEMP/exporthub-autofix-oidc.jwt")" \
            --data "$(jq -nc --arg j "$JOB_ID" --arg e "$TARGET_ENV" --arg m "$msg" '{action:"workflow-status",jobId:$j,environment:$e,status:"testing",message:$m}')" >/dev/null

      - name: Vollständige Regression ausführen
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Autofix committen und PR-Branch veröffentlichen
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_id=$(cat .exporthub-autofix/diagnostic-id.txt)
          echo "diagnostic_id=$diagnostic_id" >> "$GITHUB_OUTPUT"
          cp .exporthub-autofix/final.txt /tmp/exporthub-autofix-final.txt
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf .exporthub-autofix
          safe_job=$(printf '%s' "$JOB_ID" | tr -cd 'A-Za-z0-9._-' | cut -c1-48)
          test -n "$safe_job" || safe_job="job"
          branch="autofix/${TARGET_ENV}/${safe_job}-${GITHUB_RUN_ID}"
          git config user.name "ExportHUB Claude Autofix"
          git config user.email "exporthub-autofix@users.noreply.github.com"
          git add -A
          git commit -m "fix(autofix): $diagnostic_id · $JOB_ID"
          sha=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Pull Request für getesteten Autofix erstellen
        if: steps.commit.outputs.changed == 'true'
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_id="${{ steps.commit.outputs.diagnostic_id }}"
          final=$(head -c 2500 /tmp/exporthub-autofix-final.txt 2>/dev/null || true)
          cat > /tmp/autofix-pr.md <<EOF
          ## ExportHUB Diagnose-Autofix

          - Diagnose: \`${diagnostic_id}\`
          - Auftrag: \`${JOB_ID}\`
          - Zielumgebung: \`${TARGET_ENV}\`
          - Regression vor PR-Erstellung: **bestanden**
          - Direkter Push nach \`main\`: **nicht erlaubt**

          ### Ergebnis von Claude Code
          ${final}

          Dieser PR muss die normalen PR-/CI-Gates bestehen. Ein Live-Deployment erfolgt ausschließlich nach regulärem Merge nach \`main\`.
          EOF
          pr_url=$(gh pr create \
            --base main \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "Autofix: ${diagnostic_id} · ${JOB_ID}" \
            --body-file /tmp/autofix-pr.md)
          test -n "$pr_url"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Getesteten Autofix als PR bereit melden
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.claim.outputs.base }}"
          pr_url="${{ steps.pr.outputs.pr_url }}"
          sha="${{ steps.commit.outputs.sha }}"
          curl -fsS -X POST "$base/api/diagnostic-autofix" \
            -H 'Content-Type: application/json' \
            -H "X-ExportHUB-GitHub-OIDC: $(cat "$RUNNER_TEMP/exporthub-autofix-oidc.jwt")" \
            --data "$(jq -nc --arg j "$JOB_ID" --arg e "$TARGET_ENV" --arg c "$sha" --arg u "$pr_url" '{action:"workflow-status",jobId:$j,environment:$e,status:"testing",message:"Autofix wurde vollständig getestet und als Pull Request vorbereitet. Merge und Live-Deployment erfolgen nur über die regulären Release-Gates.",commit:$c,runUrl:$u}')" >/dev/null

      - name: Ohne Codeänderung als bereits behoben bestätigen
        if: steps.commit.outputs.changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.claim.outputs.base }}"
          final=$(cat .exporthub-autofix/final.txt 2>/dev/null || echo "ALREADY_FIXED: Aktueller Repository-Stand besteht die Regression.")
          curl -fsS -X POST "$base/api/diagnostic-autofix" \
            -H 'Content-Type: application/json' \
            -H "X-ExportHUB-GitHub-OIDC: $(cat "$RUNNER_TEMP/exporthub-autofix-oidc.jwt")" \
            --data "$(jq -nc --arg j "$JOB_ID" --arg e "$TARGET_ENV" --arg m "$final" --arg c "${{ steps.commit.outputs.sha }}" --arg u "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{action:"workflow-status",jobId:$j,environment:$e,status:"fixed",message:$m,commit:$c,runUrl:$u}')" >/dev/null

      - name: Fehlgeschlagenen Autofix in ExportHUB zurückmelden
        if: failure()
        shell: bash
        run: |
          set +e
          base="${{ steps.claim.outputs.base }}"
          if [[ -z "$base" ]]; then
            [[ "$TARGET_ENV" == "testservice" ]] && base="$TEST_URL" || base="$PROD_URL"
          fi
          msg="Automatische Behebung fehlgeschlagen. GitHub-Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [[ -f /tmp/exporthub-autofix-final.txt ]]; then
            msg="$msg · $(head -c 2500 /tmp/exporthub-autofix-final.txt)"
          elif [[ -f .exporthub-autofix/final.txt ]]; then
            msg="$msg · $(head -c 2500 .exporthub-autofix/final.txt)"
          fi
          curl -sS -X POST "$base/api/diagnostic-autofix" \
            -H 'Content-Type: application/json' \
            -H "X-ExportHUB-GitHub-OIDC: $(cat "$RUNNER_TEMP/exporthub-autofix-oidc.jwt")" \
            --data "$(jq -nc --arg j "$JOB_ID" --arg e "$TARGET_ENV" --arg m "$msg" --arg c "${{ steps.commit.outputs.sha }}" --arg u "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{action:"workflow-status",jobId:$j,environment:$e,status:"failed",message:$m,commit:$c,runUrl:$u}')" >/dev/null || true

      - name: Autofix-OIDC-Datei entfernen
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/exporthub-autofix-oidc.jwt"
