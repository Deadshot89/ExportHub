name: RC885 Clean Workspace TESTSERVICE

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: exporthub-rc885-clean-workspace
  cancel-in-progress: false

jobs:
  patch-testservice:
    name: RC885 clean workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout RC884 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard clean RC884 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f TESTVERSION.html
          grep -Fq "version:'RC884',cache:'884',loginReturn:'/TESTVERSION.html?v=884'" TESTVERSION.html

          if grep -Fq "exporthub-rc885-clean-workspace" TESTVERSION.html; then
            echo "::error::RC885 Clean Workspace ist bereits vorhanden."
            exit 1
          fi

          if grep -Eq "version:'RC(885|886|887|888|889|890|891|892)'" TESTVERSION.html; then
            echo "::error::TESTVERSION ist nicht mehr die erwartete RC884-Basis."
            exit 1
          fi

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          src = Path("TESTVERSION.html").read_text(encoding="utf-8", errors="replace")

          class V(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script = 0
                  self.style = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  t = tag.lower()
                  if t == "script": self.script += 1
                  elif t == "style": self.style += 1
              def handle_endtag(self, tag):
                  t = tag.lower()
                  if t == "script" and self.script: self.script -= 1
                  elif t == "style" and self.style: self.style -= 1
              def handle_data(self, data):
                  if not self.script and not self.style:
                      self.parts.append(data)

          p = V()
          p.feed(src)
          p.close()
          visible = "\n".join(p.parts)

          bad = [
              "function applyFixedBlocks()",
              "function canonicalActionButtons(",
              "function createQr(",
              "window.open('about:blank'",
              'window.open("about:blank"',
              "pickupQrActivating",
          ]
          leaks = [x for x in bad if x in visible]
          if leaks:
              raise SystemExit("RC884-Basis enthält sichtbaren JavaScript-Code: " + ", ".join(leaks))

          if src.lower().count("</body>") != 1:
              raise SystemExit("RC884 muss genau einen </body>-Abschluss besitzen.")

          print("OK: saubere RC884-Basis.")
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC884 backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-clean-rc884-before-rc885-${GITHUB_RUN_ID}"
          git tag -a "${TAG}" -m "Clean RC884 before RC885 workspace"
          git push origin "refs/tags/${TAG}"

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("TESTVERSION.html")
          src = p.read_text(encoding="utf-8")

          old_build = "var BUILD=Object.freeze({version:'RC884',cache:'884',loginReturn:'/TESTVERSION.html?v=884'});"
          new_build = "var BUILD=Object.freeze({version:'RC885',cache:'885',loginReturn:'/TESTVERSION.html?v=885'});"

          if src.count(old_build) != 1:
              raise SystemExit("RC884 BUILD nicht eindeutig gefunden.")
          src = src.replace(old_build, new_build, 1)

          old_release = (
              " version:'RC884',\n"
              " date:'30.08.2026',\n"
              " title:'Navigation, Suche und Sendung erstellen bereinigt',"
          )
          new_release = (
              " version:'RC885',\n"
              " date:'30.08.2026',\n"
              " title:'Persönlicher Arbeitsplatz und Warncenter neu aufgebaut',"
          )

          if old_release in src:
              src = src.replace(old_release, new_release, 1)

          marker = "<!-- exporthub-rc885-clean-workspace -->"
          if marker in src:
              raise SystemExit("RC885 Modul bereits vorhanden.")

          module = r'''
          <!-- exporthub-rc885-clean-workspace -->
          <style id="exporthub-rc885-clean-workspace-style">
            #rc885Workspace{
              margin:0 0 18px;
              border:1px solid #d9e4ee;
              border-radius:18px;
              background:#fff;
              box-shadow:0 8px 28px rgba(15,23,42,.06);
              overflow:hidden;
            }
            #rc885Workspace .rc885-head{
              display:flex;
              align-items:center;
              justify-content:space-between;
              gap:16px;
              padding:18px 20px 14px;
              border-bottom:1px solid #e8eef4;
            }
            #rc885Workspace .rc885-kicker{
              font-size:11px;
              font-weight:800;
              letter-spacing:.08em;
              text-transform:uppercase;
