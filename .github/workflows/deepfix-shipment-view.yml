name: Deepfix shipment view context

on:
  push:
    branches:
      - deepfix/shipment-view-context-20261008

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild minimal shipment-view fix from current main
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import subprocess
          history = Path('assets/rc1071-shipment-history.js')
          source = subprocess.check_output(['git','show','origin/main:assets/rc1071-shipment-history.js'], text=True)
          old_current = "function currentShipment(){\n var s=state(),direct=s.currentShipment||s.shipment||s.activeShipment||null;if(direct&&obj(direct))return direct;\n var id=q(s.currentShipmentId||s.selectedShipmentId||s.shipmentId),r=q(s.currentShipmentRef||s.selectedShipmentRef||s.reference);\n var all=[].concat(arr(s.shipments),arr(s.savedShipments),arr(s.shipmentArchive),arr(s.archivedShipments),arr(s.salesSharedShipments),arr(s.sharedShipments));\n return all.find(function(x){return x&&((id&&q(x.id||x.shipmentId)===id)||(r&&ref(x)===r))})||null\n}"
          new_current = "function currentShipment(){\n var s=state(),view=low(s.view||s.currentView||s.activeView||''),viewId=q(s.shipmentViewId||s.selectedShipmentId||s.activeShipmentId).toLocaleUpperCase('de-DE');\n var all=[].concat(arr(s.shipments),arr(s.savedShipments),arr(s.shipmentArchive),arr(s.archivedShipments),arr(s.salesSharedShipments),arr(s.sharedShipments));\n if(view==='shipmentview'&&viewId){var viewed=all.find(function(x){return x&&(q(x.id||x.shipmentId).toLocaleUpperCase('de-DE')===viewId||ref(x).toLocaleUpperCase('de-DE')===viewId)});if(viewed)return viewed}\n var direct=s.currentShipment||s.shipment||s.activeShipment||null;if(direct&&obj(direct))return direct;\n var id=q(s.currentShipmentId||s.selectedShipmentId||s.shipmentId),r=q(s.currentShipmentRef||s.selectedShipmentRef||s.reference);\n return all.find(function(x){return x&&((id&&q(x.id||x.shipmentId)===id)||(r&&ref(x)===r))})||null\n}"
          old_work = "function markWorkStarted(){\n var sh=currentShipment();if(!sh||!shipmentView())return false;"
          new_work = "function markWorkStarted(){\n if(viewName()==='shipmentview')return false;\n var sh=currentShipment();if(!sh||!shipmentView())return false;"
          if source.count(old_current) != 1: raise SystemExit('currentShipment base contract changed')
          if source.count(old_work) != 1: raise SystemExit('markWorkStarted base contract changed')
          history.write_text(source.replace(old_current,new_current,1).replace(old_work,new_work,1),encoding='utf-8')
          build = Path('.github/rc1112/build-three-env.mjs')
          build_source = subprocess.check_output(['git','show','origin/main:.github/rc1112/build-three-env.mjs'], text=True)
          old_replace = "html=html.replace(/assets\\/rc1071-shipment-history\\.js\\?v=(?:1095|1151|1178|1305)/g,'assets/rc1071-shipment-history.js?v=1434');"
          new_replace = "html=html.replace(/assets\\/rc1071-shipment-history\\.js\\?v=(?:1095|1151|1178|1305|1434)/g,'assets/rc1071-shipment-history.js?v=1468');"
          old_guard = "if(!html.includes('assets/rc1071-shipment-history.js?v=1434'))throw new Error(file+': RC1305 Dokument-History Cache-Key fehlt');"
          new_guard = "if(!html.includes('assets/rc1071-shipment-history.js?v=1468'))throw new Error(file+': RC1468 Dokument-History Cache-Key fehlt');"
          synthetic_status = " var current=status(sh),currentAt=q(sh&&(sh.statusChangedAt||sh.statusUpdatedAt||sh.updatedAt||sh._syncUpdatedAt));\n if(current&&!list.some(function(x){return low(x.label).indexOf(low(current))>=0}))add(currentAt,'Aktueller Status: '+current,'','current|'+low(current));\n"
          if build_source.count(old_replace) != 1: raise SystemExit('history cache replacement contract changed')
          if build_source.count(old_guard) != 1: raise SystemExit('history cache guard contract changed')
          if build_source.count(synthetic_status) != 1: raise SystemExit('synthetic status fallback contract changed')
          build_source = build_source.replace(old_replace,new_replace,1).replace(old_guard,new_guard,1).replace(synthetic_status,'',1)
          build.write_text(build_source,encoding='utf-8')
          PY
      - name: Restore POD archive and reconcile contract on current main runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          MAIN = subprocess.check_output(['git','show','origin/main:api/shared/pod-archive.js'], text=True)
          LEGACY = subprocess.check_output(['git','show','18fef7964926acb552ebac8faeb51e04da296fc8:api/shared/pod-archive.js'], text=True)

          def between(src, start, end):
            a = src.index(start)
            b = src.index(end, a)
            return src[a:b]

          # Keep the proven Azure archive/reconcile implementation, but preserve the
          # current structured POD PDF and layout-version invalidation from main.
          merged = LEGACY
          if "const POD_PDF_LAYOUT_VERSION" not in merged:
            merged = merged.replace(
              "const TEAM_POD_LINK_VERSION = 'RC1340';\n",
              "const TEAM_POD_LINK_VERSION = 'RC1340';\nconst POD_PDF_LAYOUT_VERSION = 'RC1361-STRUCTURED-V1';\n",
              1
            )

          main_is_current = between(MAIN, 'function isCurrentAutomaticPod(file) {', 'function fileNameFor(record) {')
          if 'function isCurrentAutomaticPod(file) {' not in merged:
            merged = merged.replace('function fileNameFor(record) {', main_is_current + 'function fileNameFor(record) {', 1)

          main_pdf = between(MAIN, 'async function createPodPdf(record, signatureBuffer, signatureType) {', 'async function readAutomaticPodBuffer(accessKey, environment, record) {')
          old_pdf = between(merged, 'async function createPodPdf(record, signatureBuffer, signatureType) {', 'async function readAutomaticPodBuffer(accessKey, environment, record) {')
          merged = merged.replace(old_pdf, main_pdf, 1)

          persist = between(merged, 'async function persistBackupState(accessKey, environment, patch, podFile) {', 'async function saveAzurePod(accessKey, environment, record, pdf, requestedName) {')
          persist = persist.replace('  return store.mutateRecord(accessKey, environment, function(record) {', '  const updated = await store.mutateRecord(accessKey, environment, function(record) {', 1)
          persist = persist.rsplit('  });\n}', 1)[0] + '  });\n  return updated && updated.record ? updated.record : updated;\n}\n'
          old_persist = between(merged, 'async function persistBackupState(accessKey, environment, patch, podFile) {', 'async function saveAzurePod(accessKey, environment, record, pdf, requestedName) {')
          merged = merged.replace(old_persist, persist, 1)

          main_save = between(MAIN, 'async function saveAzurePod(accessKey, environment, record, pdf, requestedName) {', 'async function queueGraphPodBackup(accessKey, environment, record, pdf, file) {')
          main_save = main_save.replace('return { file, record: next.record, clients: next.clients };', 'return { record: next, file, hash, pdf, clients: got.clients };')
          old_save = between(merged, 'async function saveAzurePod(accessKey, environment, record, pdf, requestedName) {', 'async function verifyAzureArchiveBlob(blob, expectedHash, expectedSize, fullRead) {')
          merged = merged.replace(old_save, main_save, 1)

          ensure = between(merged, 'async function ensureAutomaticPod(accessKey, environment, options) {', 'async function saveSuppliedPod(accessKey, environment, record, pdf, requestedName) {')
          ensure = ensure.replace('  if (file) {', '  if (file && isCurrentAutomaticPod(file)) {', 1)
          old_ensure = between(merged, 'async function ensureAutomaticPod(accessKey, environment, options) {', 'async function saveSuppliedPod(accessKey, environment, record, pdf, requestedName) {')
          merged = merged.replace(old_ensure, ensure, 1)

          main_share = between(MAIN, 'async function createShareLink(accessKey, environment) {', 'async function getPodDownload(accessKey, environment, fileId) {')
          main_download = between(MAIN, 'async function getPodDownload(accessKey, environment, fileId) {', 'module.exports = {')
          insertion = main_share + main_download
          export_pos = merged.index('module.exports = {')
          merged = merged[:export_pos] + insertion + merged[export_pos:]

          old_exports = merged[merged.index('module.exports = {'):]
          new_exports = """module.exports = {
  automaticPod,
  isCurrentAutomaticPod,
  fileNameFor,
  createPodPdf,
  ensureAutomaticPod,
  createShareLink,
  getPodDownload,
  readAutomaticPodBuffer,
  retryArchiveBackup,
  retryDriveBackup,
  saveAzureArchive,
  verifyAzureArchiveBlob,
  checkAzureArchive,
  saveSuppliedPod,
  reconcilePendingBackups,
  POD_PDF_LAYOUT_VERSION,
  TEAM_POD_LINK_VERSION
};
"""
          merged = merged[:merged.index('module.exports = {')] + new_exports

          required = [
            'await saveAzurePod(accessKey, environment, record, pdf)',
            'await saveAzureArchive(accessKey, environment, record, pdf, file)',
            'async function reconcilePendingBackups(',
            'candidates.sort(',
            'listBlobsFlat({ prefix }).byPage({',
            'POD_PDF_LAYOUT_VERSION',
            'function isCurrentAutomaticPod(file)'
          ]
          for marker in required:
            if marker not in merged:
              raise SystemExit('merged POD contract missing: ' + marker)
          Path('api/shared/pod-archive.js').write_text(merged, encoding='utf-8')
          PY
      - name: Verify focused regressions before commit
        run: |
          node --check assets/rc1071-shipment-history.js
          node --check .github/rc1112/build-three-env.mjs
          node --check api/shared/pod-archive.js
          node --test --test-concurrency=1 test/rc1468-shipment-view-context-regression.test.mjs
          node --test --test-concurrency=1 test/rc1071-shipment-history.test.mjs
          node --test --test-concurrency=1 --test-name-pattern='RC1305:' test/rc1305-shipment-view-documents-history.test.mjs
          node --test --test-concurrency=1 test/rc1114-pod-reliability.test.mjs
      - name: Commit normalized fixes
        run: |
          git config user.name "Deadshot89"
          git config user.email "86518220+Deadshot89@users.noreply.github.com"
          git add assets/rc1071-shipment-history.js .github/rc1112/build-three-env.mjs api/shared/pod-archive.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: restore POD archive reliability without losing structured PDF [deepfix-clean]"
          git push origin HEAD:deepfix/shipment-view-context-20261008
      - name: Full repository test suite with compact failure diagnostics
        shell: bash
        run: |
          set +e
          npm test > /tmp/npm-test.log 2>&1
          code=$?
          echo '=== FAILURES ==='
          grep -nE '(^not ok|FAIL|AssertionError|ERR_|Error:|Expected|Actual|✗|⨯)' /tmp/npm-test.log | tail -n 300 || true
          echo '=== FINAL 260 LINES ==='
          tail -n 260 /tmp/npm-test.log
          exit "$code"
