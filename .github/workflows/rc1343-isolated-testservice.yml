name: RC1343 Isolated TESTSERVICE Preview (synthetic only)

on:
  push:
    branches:
      - fix/rc1903-remove-legacy-fields-all-internal-20261110

permissions:
  contents: read

concurrency:
  group: exporthub-rc1343-isolated-testservice-preview
  cancel-in-progress: true

jobs:
  isolated_preview:
    if: github.repository == 'Deadshot89/ExportHub' && github.ref == 'refs/heads/fix/rc1903-remove-legacy-fields-all-internal-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR branch, never main
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Verify branch and availability of isolated preview credential
        shell: bash
        env:
          RC1343_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EXPORT_HUB_EUROPE }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Deadshot89/ExportHub'
          test "$GITHUB_REF" = 'refs/heads/fix/rc1903-remove-legacy-fields-all-internal-20261110'
          test -n "$RC1343_DEPLOY_TOKEN" || { echo 'Missing Azure preview deploy credential. No deployment.'; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f scripts/rc1343-preview-package.mjs
          test -f scripts/rc1343-preview-live.mjs

      - name: Prepare only guest documentation API and isolated preview site
        shell: bash
        env:
          RC1343_EXPECTED_SHA: ${{ github.sha }}
          RC1343_PREVIEW_KEY_FILE: ${{ runner.temp }}/rc1343-private-test-token
        run: |
          set -euo pipefail
          node --check scripts/rc1343-preview-package.mjs
          node --check scripts/rc1343-preview-live.mjs
          node scripts/rc1343-preview-package.mjs
          test -f .rc1343_preview_api/rc1343-preview.json
          test -f .rc1343_preview_api/shipment-evidence/index.js
          test -f .rc1343_preview_api/exporthub-health/index.js
          test ! -e .rc1343_preview_api/urgent-orders
          test ! -e .rc1343_preview_api/customer-avis
          test ! -e .rc1343_preview_api/exporthub-state
          node --check .rc1343_preview_api/shipment-evidence/index.js
          node --check .rc1343_preview_api/exporthub-health/index.js
          node -e "const f=require('fs'),s=f.readFileSync('.rc1343_preview_api/shipment-evidence/index.js','utf8');if(!s.includes('RC1343_ISOLATED_STORAGE_REQUIRED')||!s.includes('RC1343_PREVIEW_DENIED')||!s.includes('RC1343_NO_CUSTOMER_MASTER'))process.exit(1)"

      - name: Deploy named Azure preview rc1343ts only, never production or main TESTSERVICE
        id: isolated_preview_deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EXPORT_HUB_EUROPE }}
          action: upload
          app_location: .rc1343_preview_app
          api_location: .rc1343_preview_api
          output_location: ''
          skip_app_build: true
          deployment_environment: rc1343ts
          production_branch: main

      - name: Verify exact preview host and synthetic JPEG/PDF binary readback
        shell: bash
        env:
          RC1343_EXPECTED_SHA: ${{ github.sha }}
          RC1343_PREVIEW_KEY_FILE: ${{ runner.temp }}/rc1343-private-test-token
          RC1343_ACTUAL_PREVIEW_URL: ${{ steps.isolated_preview_deploy.outputs.static_web_app_url }}
        run: |
          set -euo pipefail
          if [ -n "$RC1343_ACTUAL_PREVIEW_URL" ]; then
            node -e "const u=new URL(process.env.RC1343_ACTUAL_PREVIEW_URL);if(u.hostname!=='ashy-grass-065b7b803-rc1343ts.westeurope.6.azurestaticapps.net')throw Error('Wrong Azure preview URL: refuse all remote writes')"
          fi
          node scripts/rc1343-preview-live.mjs

      - name: Remove ephemeral preview key and runner copies
        if: always()
        shell: bash
        run: |
          rm -f "${{ runner.temp }}/rc1343-private-test-token"
          # The Azure deploy action writes root-owned node_modules in these two generated runner-only paths.
          sudo rm -rf -- .rc1343_preview_app .rc1343_preview_api
