          assets/rc1283-loading-list-search.js?v=1305
          assets/rc1027-lieferavis-immediate.js?v=20261005
          assets/rc1177-release-notes.js?v=
          EOF

      - name: RC1505 admin markers production
        shell: bash
        run: |
          set -euo pipefail
          file=dist-rc1112/index.html
          grep -Fq 'assets/rc1061-document-migration-admin.js?v=1073' "$file"
          grep -Fq 'assets/rc1067-startup-recovery.js?v=1067' "$file"
          grep -Fq 'assets/rc1075-loader-pin-admin.js?v=1075' "$file"
          grep -Fq 'assets/rc1126-customer-delete.js?v=1387' "$file"
          grep -Fq 'assets/rc1013-diagnostics.js?v=1364' "$file"
          grep -Fq "view:'history',label:'Historie',right:'history'" "$file"

      - name: RC1505 admin markers TESTVERSION
        shell: bash
        run: |
          set -euo pipefail
          file=dist-rc1112/TESTVERSION.html
          grep -Fq 'assets/rc1061-document-migration-admin.js?v=1073' "$file"
          grep -Fq 'assets/rc1067-startup-recovery.js?v=1067' "$file"
          grep -Fq 'assets/rc1075-loader-pin-admin.js?v=1075' "$file"
          grep -Fq 'assets/rc1126-customer-delete.js?v=1387' "$file"
          grep -Fq 'assets/rc1013-diagnostics.js?v=1364' "$file"
          grep -Fq "view:'history',label:'Historie',right:'history'" "$file"

      - name: RC1505 demo admin exclusions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'assets/rc1061-document-migration-admin.js' dist-rc1112/demo.html
          ! grep -Fq 'assets/rc1067-startup-recovery.js' dist-rc1112/demo.html
          ! grep -Fq 'assets/rc1075-loader-pin-admin.js' dist-rc1112/demo.html

      - name: RC1505 public-page markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'assets/rc1018-public-language.js?v=1231' dist-rc1112/customer-avis.html
          grep -Fq 'customerPdfUpload' dist-rc1112/customer-avis.html
          grep -Fq 'document-upload-status' dist-rc1112/customer-avis.html
          grep -Fq 'assets/rc1018-public-language.js?v=1018' dist-rc1112/pickup.html
          grep -Fq 'assets/rc1018-public-language.js?v=1018' dist-rc1112/location.html
          grep -Fq 'assets/rc1016-demo-task-seed.js?v=1016' dist-rc1112/demo.html

      - name: RC1505 required build files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do test -s "$file"; done <<'EOF'
          dist-rc1112/assets/rc1016-mobile-navigation.js
          dist-rc1112/assets/rc1017-multi-truck.js
          dist-rc1112/assets/rc1018-mail-language-standard.js
          dist-rc1112/assets/rc1018-public-language.js
          dist-rc1112/assets/rc1065-registration-cc.js
          dist-rc1112/assets/rc1061-document-migration-admin.js
          dist-rc1112/assets/rc1067-startup-recovery.js
          dist-rc1112/assets/rc1069-performance.js
          dist-rc1112/assets/rc1075-loader-pin-admin.js
          dist-rc1112/assets/rc1077-customer-labels.js
          dist-rc1112/assets/rc1079-profile-settings.js
          dist-rc1112/assets/rc1080-customer-history.js
          dist-rc1112/assets/rc1081-audit-history.js
          dist-rc1112/assets/rc1092-customer-mail-contacts.js
          dist-rc1112/assets/rc1096-packaging-groups.js
          dist-rc1112/assets/rc1126-customer-delete.js
