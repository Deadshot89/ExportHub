name: RC1495 Legacy QR Persistence Diagnose

on:
  push:
    branches:
      - fix/rc1495-legacy-qr-persistence

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Legacy-QR-Persistenz reproduzieren
        run: node --test test/rc1495-legacy-qr-persistence.test.mjs
