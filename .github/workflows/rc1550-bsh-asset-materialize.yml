name: RC1550 BSH Asset Materialize

on:
  push:
    branches:
      - feature/rc1550-sop-rebuild-main-20261017
    paths:
      - '.github/rc1550/bsh-seed/**'
      - '.github/workflows/rc1550-bsh-asset-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc1550-bsh-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Reconstruct exact verified BSH archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64, hashlib, itertools, tarfile, zlib

          root=Path('.github/rc1550/bsh-seed')
          expected={
            '01-portaluebersicht.png':'6fdec5e15218a9ba6d8699321945f0a588b7b3b1dd7de14475ab94cb1626339e',
            '02-funktion-auswaehlen.png':'0d5c0181ab90462aa32e4cd97b0f569a0a9e9d4ab4ba468600ab2eb2ff251e5e',
            '03-kunde-werk.png':'1a557e45e51bf73d21f31843364c8198ba01606b472025d0d4aacbc0cb02947a',
            '04-hinzufuegen.png':'f49e15a6e6779378ff7cf7cc6717121d225d16d58a8ebc3acd1168825295c1d6',
            '05-werk-termin.png':'9d72159ad8e63890b2039ec2e7f6dee5dee9260207bf70ea166e296201cb4efe',
            '06-verpackungsdaten.png':'94b359a2b07b6436d21920b25b735e93a0b3adff27613214484e60d16fba1526',
            '07-exporthub-referenz.png':'b4f2773414e2c4f82a44bd6644f1904140c299499b65899a74b865d69bfdd212',
            '08-lieferavis-anlegen.png':'c4a48c6d2ab3cd94a4c9177cba263937cfe06d71f7913edf0b8fd4d8acd2843d',
            '09-lieferscheine-mengen.png':'a20eee5ad86b10999ceef780dbda02ff091a176e46969c606a9dfe2db22835db',
            '10-sendungsnummer-erstellen.png':'155e2f1eed9152bd9eb327d1714ce8090642eb2f020df489d466cab22dfdcc58',
            '11-erfolgsbestaetigung.png':'3866303fb45a7551b25634d16f4382e9a284026c90821f6b90697380fdc47ab6',
          }

          def txt(name):
              p=root/name
              if not p.is_file(): raise SystemExit(f'Seed fehlt: {name}')
              return ''.join(p.read_text('utf-8').split())

          def windows(strings, wanted=10000):
              seen=set()
              for s in strings:
                  if len(s)<wanted: continue
                  for off in range(0,len(s)-wanted+1):
                      c=s[off:off+wanted]
                      if c not in seen:
                          seen.add(c); yield c

          exact={
            0:txt('clean-00'),2:txt('clean-02'),3:txt('clean-03'),5:txt('clean-05'),
            6:txt('clean-06'),7:txt('clean-07'),8:txt('clean-08'),9:txt('clean-09'),
            11:txt('clean-11'),14:txt('clean-14')
          }
          groups={
            1:[txt('clean-01a'),txt('clean-01b'),txt('clean-01a')+txt('clean-01b'),txt('clean-01b')+txt('clean-01a')],
            4:[txt('clean-04'),txt('clean-04a')+txt('clean-04b'),txt('clean-04b')+txt('clean-04a')],
            10:[txt('clean-10a')+txt('clean-10b'),txt('clean-10b')+txt('clean-10a'),txt('clean-10b')],
            12:[txt('clean-12'),txt('clean-12a'),txt('clean-12a')+txt('clean-12b'),txt('clean-12b')+txt('clean-12a')],
            13:[txt('clean-13'),txt('clean-13a'),txt('clean-13')+txt('clean-13a'),txt('clean-13a')+txt('clean-13')],
          }

          def candidates(idx):
              if idx in exact:
                  s=exact[idx]
                  if idx==14:
                      yield s
                  elif len(s)==10000:
                      yield s
                  else:
                      yield from windows([s])
              else:
                  yield from windows(groups[idx])

          states=[(zlib.decompressobj(31),b'',[])]
          for idx in range(15):
              next_states=[]
              tested=0
              for cand in candidates(idx):
                  tested+=1
                  try:
                      raw=base64.b64decode(cand,validate=True)
                  except Exception:
                      continue
                  for decomp,out,choices in states:
                      try:
                          d=decomp.copy()
                          piece=d.decompress(raw)
                      except zlib.error:
                          continue
                      next_states.append((d,out+piece,choices+[hashlib.sha1(cand.encode()).hexdigest()[:10]]))
              if not next_states:
                  raise SystemExit(f'Keine gültige Rekonstruktion nach Chunk {idx}; getestet={tested}')
              # DEFLATE rejects almost all wrong candidates. Keep unique output/state paths only.
              dedup={}
              for st in next_states:
                  key=(len(st[1]),hashlib.sha256(st[1][-32768:]).digest(),st[0].eof)
                  dedup.setdefault(key,st)
              states=list(dedup.values())
              print(f'chunk {idx}: tested={tested} surviving={len(states)}')
              if len(states)>2000:
                  raise SystemExit(f'Zu viele mehrdeutige Rekonstruktionen nach Chunk {idx}: {len(states)}')

          valid=[]
          for d,out,choices in states:
              try:
                  out=out+d.flush()
              except zlib.error:
                  continue
              if not d.eof or d.unused_data:
                  continue
              try:
                  tf=tarfile.open(fileobj=BytesIO(out),mode='r:')
                  bybase={Path(m.name).name:m for m in tf.getmembers() if m.isfile()}
                  files={}
                  for name,sha in expected.items():
                      member=bybase.get(name)
                      if not member: raise KeyError(name)
                      data=tf.extractfile(member).read()
                      if hashlib.sha256(data).hexdigest()!=sha: raise ValueError(name)
                      if not data.startswith(b'\x89PNG\r\n\x1a\n') or len(data)<10000: raise ValueError(name)
                      files[name]=data
                  valid.append((files,choices))
              except Exception:
                  continue
          if len(valid)!=1:
              raise SystemExit(f'Erwartet genau eine SHA-verifizierte Rekonstruktion, gefunden: {len(valid)}')
          files,choices=valid[0]
          target=Path('assets/sop/screenshots/bsh')
          target.mkdir(parents=True,exist_ok=True)
          for old in target.iterdir():
              if old.is_file(): old.unlink()
          for name,data in files.items():
              (target/name).write_bytes(data)
              print(name,len(data),hashlib.sha256(data).hexdigest())
          print('choices:',','.join(choices))
          PY
      - name: Verify RC1550 targeted suite
        run: >-
          node --test --test-concurrency=1
          test/rc1550-sop-model.test.mjs
          test/rc1550-sop-catalog.test.mjs
          test/rc1550-sop-assets.test.mjs
          test/rc1550-sop-runtime-isolation.test.mjs
          test/rc1550-sop-ui.test.mjs
          test/rc1550-sop-responsive.test.mjs
          test/rc1550-sop-build.test.mjs
      - name: Full Node regression
        run: npm test
      - name: Commit only verified final assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/rc1550/bsh-seed
          rm -f .github/workflows/rc1550-bsh-asset-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/sop/screenshots/bsh .github/rc1550/bsh-seed .github/workflows/rc1550-bsh-asset-materialize.yml
          git diff --cached --check
          git commit -m 'assets: add verified BSH SOP screenshots'
          git push origin "HEAD:${GITHUB_REF_NAME}"
