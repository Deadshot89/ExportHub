name: RC1003 Main Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'demo.html'
      - 'production-version.js'
      - 'api/**'
      - 'assets/**'
      - 'android-app/**'
      - 'test/**'
      - '.github/rc1000/**'
      - '.github/rc1001/**'
      - '.github/rc1002/**'
      - '.github/rc1003/**'
      - '.github/rc997/diagnostic-notifications-contract.test.mjs'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: rc1003-main-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: RC1003 Release-Vertrag
        run: node --test test/rc1003-android-native-direct-open.test.mjs test/rc1003-three-env-sync.test.mjs
      - name: Aufgaben-Verträge
        run: node --test test/rc1002-task-groups.test.mjs test/rc1001-task-tiles-cleanup.test.mjs
      - name: QR-Abholung Regression
        run: node --test .github/rc1000/rc1000-production-pickup.test.mjs
      - name: Diagnose- und Android-Regression
        run: node --test .github/rc997/diagnostic-notifications-contract.test.mjs
      - name: Gesamte Node-Regression
        run: npm test
      - name: Drei-Umgebungen-Build
        run: node .github/rc1003/build-three-env.mjs
      - name: RC1003 Build-Ergebnis prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ExportHUB RC1003 environment=production-candidate' dist-rc1003/index.html
          grep -q 'ExportHUB RC1003 environment=testservice' dist-rc1003/TESTVERSION.html
          grep -q 'ExportHUB RC1003 environment=demo' dist-rc1003/demo.html
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1003'" production-version.js
          git diff --check
