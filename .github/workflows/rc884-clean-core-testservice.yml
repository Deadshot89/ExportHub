name: RC884 Clean Core TESTSERVICE

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: exporthub-rc884-clean-core
  cancel-in-progress: false

jobs:
  patch-testservice:
    name: RC884 clean core
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout clean RC883 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact RC883 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f TESTVERSION.html

          grep -Fq "version:'RC883',cache:'883',loginReturn:'/TESTVERSION.html?v=883'" TESTVERSION.html
          grep -Fq "function rc843EnsureView()" TESTVERSION.html
          grep -Fq "__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__=rc843ReleaseViewGuard" TESTVERSION.html
          grep -Fq "function route(view,source){view=canonical(view);window.__EXPORTHUB_NAVIGATION_ACTIVE_UNTIL__=Date.now()+1800;" TESTVERSION.html
          grep -Fq "rc807ShipmentSearch" TESTVERSION.html
          grep -Fq "function placeWorkflowButtons(customerBody,shipmentBody,documentsBody)" TESTVERSION.html
          grep -Fq "rc386AddressConfirmed" TESTVERSION.html
          grep -Fq "KUNDEN-AVIS / LIEFERAVIS" TESTVERSION.html
          grep -Fq "function avisHost(view)" TESTVERSION.html

          if grep -Eq "version:'RC(884|885|886|887|888|889|890|891|892)'" TESTVERSION.html; then
            echo "::error::TESTVERSION ist nicht mehr die saubere RC883-Basis."
            exit 1
          fi

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          src = Path("TESTVERSION.html").read_text(encoding="utf-8", errors="replace")

          class Visible(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script = 0
                  self.style = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  t = tag.lower()
                  if t == "script":
                      self.script += 1
                  elif t == "style":
                      self.style += 1
              def handle_endtag(self, tag):
                  t = tag.lower()
                  if t == "script" and self.script:
                      self.script -= 1
                  elif t == "style" and self.style:
                      self.style -= 1
              def handle_data(self, data):
                  if not self.script and not self.style:
                      self.parts.append(data)

          p = Visible()
          p.feed(src)
          p.close()
          visible = "\n".join(p.parts)

          bad = [
              "function applyFixedBlocks()",
              "function canonicalActionButtons(",
              "function createQr(",
              "window.open('about:blank'",
              'window.open("about:blank"',
              "pickupQrActivating",
          ]
          leaks = [x for x in bad if x in visible]
          if leaks:
              raise SystemExit("RC883-Basis enthält sichtbaren JavaScript-Code: " + ", ".join(leaks))

          print("OK: Saubere RC883-Basis bestätigt.")
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable pre-RC884 backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-clean-rc883-before-rc884-${GITHUB_RUN_ID}"
          git tag -a "${TAG}" -m "Clean RC883 before controlled RC884 core"
          git push origin "refs/tags/${TAG}"
          echo "Backup erstellt: ${TAG}"

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const path = 'TESTVERSION.html';
          let text = fs.readFileSync(path, 'utf8');
          const original = text;

          function replaceOnce(oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0) throw new Error(label + ': Ausgangsblock nicht gefunden');
            if (text.indexOf(oldText, first + oldText.length) >= 0) {
              throw new Error(label + ': Ausgangsblock mehrfach gefunden');
            }
            text = text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          function findFunctionRange(source, name, fromIndex) {
            const marker = 'function ' + name + '(';
            const start = source.indexOf(marker, fromIndex || 0);
            if (start < 0) throw new Error(name + ': Funktion nicht gefunden');
            const brace = source.indexOf('{', start);
            if (brace < 0) throw new Error(name + ': öffnende Klammer fehlt');

            let depth = 0, quote = '', escape = false, lineComment = false, blockComment = false;
            for (let i = brace; i < source.length; i++) {
              const c = source[i], n = source[i + 1] || '';

              if (lineComment) {
                if (c === '\n') lineComment = false;
                continue;
              }
              if (blockComment) {
                if (c === '*' && n === '/') {
                  blockComment = false;
                  i++;
                }
                continue;
              }
              if (quote) {
                if (escape) {
                  escape = false;
                  continue;
                }
                if (c === '\\') {
                  escape = true;
                  continue;
                }
                if (c === quote) quote = '';
                continue;
              }

              if (c === '/' && n === '/') {
                lineComment = true;
                i++;
                continue;
              }
              if (c === '/' && n === '*') {
                blockComment = true;
                i++;
                continue;
              }
              if (c === "'" || c === '"' || c === '`') {
                quote = c;
                continue;
              }

              if (c === '{') depth++;
              if (c === '}') {
                depth--;
                if (depth === 0) {
                  return {
                    start,
                    end: i + 1,
                    source: source.slice(start, i + 1)
                  };
                }
              }
            }
            throw new Error(name + ': Funktionsende nicht gefunden');
          }

          function replaceFunctionAfter(anchor, name, newSource, label) {
            const anchorIndex = text.indexOf(anchor);
            if (anchorIndex < 0) throw new Error(label + ': Anker nicht gefunden');
            const range = findFunctionRange(text, name, anchorIndex);
            text = text.slice(0, range.start) + newSource + text.slice(range.end);
          }

          // 1) Navigation: Shipment-View-Guard vor einer echten Navigation freigeben.
          const oldRouteAfterPermission =
            "}var now=Date.now();if(routeBusy||(view===lastRoute&&now-lastRouteAt<120)){duplicateRoutesBlocked++;return false}var previous=current();routeBusy=true;";
          const newRouteAfterPermission =
            "}var now=Date.now();if(routeBusy||(view===lastRoute&&now-lastRouteAt<120)){duplicateRoutesBlocked++;return false}var previous=current();if(view!=='shipmentview'&&typeof window.__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__==='function'){try{window.__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__('route-'+view)}catch(_){}}routeBusy=true;";
          replaceOnce(oldRouteAfterPermission, newRouteAfterPermission, 'Navigation Guard Release');

          // 2) Ein alter RC843-Timer darf eine explizite Navigation nicht zurück auf shipmentview zwingen.
          const oldGuard =
            "function rc843EnsureView(){if(rc843ViewGuardBusy||!rc843ViewGuard)return false;var g=rc843ViewGuard,sh=find(g.id||g.ref);if(!sh){rc843ReleaseViewGuard('shipment-missing');return false}var s=state(),wanted=idOf(sh)||refOf(sh),currentId=q(s.shipmentViewId);if(low(s.view)==='shipmentview'&&currentId===wanted&&rc843ViewDomOk())return true;rc843ViewGuardBusy=true;try{s.shipmentViewId=wanted;if(!q(s.shipmentViewReturnView))s.shipmentViewReturnView=g.source||'shipmentoverview';s.view='shipmentview';try{if(typeof window.__EXPORTHUB_BIND_STATE__==='function')window.__EXPORTHUB_BIND_STATE__(s)}catch(_){}try{document.body.setAttribute('data-exporthub-view','shipmentview');document.body.setAttribute('data-current-view','shipmentview')}catch(_){}render();return true}finally{rc843ViewGuardBusy=false}}";
          const newGuard =
            "function rc843EnsureView(){if(rc843ViewGuardBusy||!rc843ViewGuard)return false;var g=rc843ViewGuard,sh=find(g.id||g.ref);if(!sh){rc843ReleaseViewGuard('shipment-missing');return false}var s=state(),wanted=idOf(sh)||refOf(sh),currentId=q(s.shipmentViewId);if(low(s.view)!=='shipmentview'&&Date.now()<Number(window.__EXPORTHUB_NAVIGATION_ACTIVE_UNTIL__||0)){rc843ReleaseViewGuard('explicit-navigation');return false}if(low(s.view)==='shipmentview'&&currentId===wanted&&rc843ViewDomOk())return true;rc843ViewGuardBusy=true;try{s.shipmentViewId=wanted;if(!q(s.shipmentViewReturnView))s.shipmentViewReturnView=g.source||'shipmentoverview';s.view='shipmentview';try{if(typeof window.__EXPORTHUB_BIND_STATE__==='function')window.__EXPORTHUB_BIND_STATE__(s)}catch(_){}try{document.body.setAttribute('data-exporthub-view','shipmentview');document.body.setAttribute('data-current-view','shipmentview')}catch(_){}render();return true}finally{rc843ViewGuardBusy=false}}";
          replaceOnce(oldGuard, newGuard, 'RC843 Shipment View Guard');

          // 3) KundenAvis bleibt ausschließlich auf der separaten KundenAvis-Seite.
          const avisCleanupRender =
            "function render(){['rc705AvisMountRead','rc705AvisMountEdit','rc845AvisReadHost','rc845AvisEditHost','rc844AvisHost','rc849AvisReadCard','rc363BlockAvis'].forEach(function(id){var node=document.getElementById(id);if(node)node.remove()});lastSig='';return false}";
          replaceFunctionAfter(
            'function avisHost(view)',
            'render',
            avisCleanupRender,
            'Interner KundenAvis Renderer'
          );

          // 4) Manuelle Adressbestätigung entfernen.
          const addressCleanup =
            "function updateConfirmationButtons(){var address=document.getElementById('rc386AddressConfirmed');if(address)address.remove();var hidden=document.getElementById('rc386AddressState');if(hidden)hidden.remove();return false}";
          replaceFunctionAfter(
            'function addressSelectionValid()',
            'updateConfirmationButtons',
            addressCleanup,
            'Adressbestätigung'
          );

          const confirmationCall =
            " confirmationButton(customerActions,'rc386AddressConfirmed','Adresse geprüft und bestätigt','addressConfirmed',[]);";
          replaceOnce(confirmationCall, '', 'Adressbestätigungs-Button');

          // 5) Redundanten "Kunde übernehmen"-Button entfernen.
          const oldCustomerDecl =
            "     customerBtn=workflowButton(/^kunde ubernehmen$/);";
          const newCustomerDecl =
            "     customerBtn=workflowButton(/^kunde ubernehmen$/);if(customerBtn){customerBtn.remove();customerBtn=null}";
          replaceOnce(oldCustomerDecl, newCustomerDecl, 'Kunde übernehmen Button');

          // 6) Version / Release.
          replaceOnce(
            "var BUILD=Object.freeze({version:'RC883',cache:'883',loginReturn:'/TESTVERSION.html?v=883'});",
            "var BUILD=Object.freeze({version:'RC884',cache:'884',loginReturn:'/TESTVERSION.html?v=884'});",
            'Canonical BUILD'
          );

          replaceOnce(
            " version:'RC883',\n date:'30.08.2026',\n title:'Azure-Speicherung und Sendungsübersicht stabilisiert',",
            " version:'RC884',\n date:'30.08.2026',\n title:'Navigation, Suche und Sendung erstellen bereinigt',",
            'Release metadata'
          );

          const changesAnchor = " changes:Object.freeze([\n";
          const changesPos = text.indexOf(changesAnchor);
          if (changesPos < 0) throw new Error('Release changes: Anker fehlt');

          const newChanges =
            '    "RC884 gibt die Sendungsansicht bei echter Navigation zuverlässig frei; Aufgaben, Dashboard, Kunden und andere Bereiche bleiben nach dem Anklicken geöffnet.",\n' +
            '    "RC884 hält die bestehende Sendungssuche aktiv und verhindert, dass der Sendungsansicht-Guard die Suche verdrängt.",\n' +
            '    "RC884 entfernt KundenAvis/Lieferavis aus der internen Sendungserstellung und Sendungsansicht. Die separate KundenAvis-Seite bleibt unverändert.",\n' +
            '    "RC884 entfernt die manuellen Schaltflächen Kunde übernehmen und Adresse geprüft und bestätigt. Die bestehende automatische Kundenauswahl bleibt erhalten.",\n' +
            '    "RC884 ist ein kontrollierter Core-Schritt auf der sauberen RC883-Testbasis; keine RC885-RC892-Module werden übernommen.",\n';

          text =
            text.slice(0, changesPos + changesAnchor.length) +
            newChanges +
            text.slice(changesPos + changesAnchor.length);

          if (text === original) throw new Error('RC884 hat keine Änderung erzeugt');

          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: RC884 core safety tests
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('TESTVERSION.html', 'utf8');

          function functionSource(name, fromText) {
            const source = fromText || text;
            const marker = 'function ' + name + '(';
            const start = source.indexOf(marker);
            if (start < 0) throw new Error(name + ' fehlt');
            const brace = source.indexOf('{', start);
            if (brace < 0) throw new Error(name + ': öffnende Klammer fehlt');

            let depth = 0, quote = '', escape = false, lineComment = false, blockComment = false;

            for (let i = brace; i < source.length; i++) {
              const c = source[i], n = source[i + 1] || '';

              if (lineComment) {
                if (c === '\n') lineComment = false;
                continue;
              }
              if (blockComment) {
                if (c === '*' && n === '/') {
                  blockComment = false;
                  i++;
                }
                continue;
              }
              if (quote) {
                if (escape) {
                  escape = false;
                  continue;
                }
                if (c === '\\') {
                  escape = true;
                  continue;
                }
                if (c === quote) quote = '';
                continue;
              }

              if (c === '/' && n === '/') {
                lineComment = true;
                i++;
                continue;
              }
              if (c === '/' && n === '*') {
                blockComment = true;
                i++;
                continue;
              }
              if (c === "'" || c === '"' || c === '`') {
                quote = c;
                continue;
              }

              if (c === '{') depth++;
              if (c === '}') {
                depth--;
                if (depth === 0) return source.slice(start, i + 1);
              }
            }
            throw new Error(name + ': Ende nicht gefunden');
          }

          if (!text.includes("version:'RC884',cache:'884',loginReturn:'/TESTVERSION.html?v=884'")) {
            throw new Error('RC884 BUILD fehlt');
          }

          if (!text.includes("__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__('route-'+view)")) {
            throw new Error('Navigation gibt Shipment-View-Guard nicht frei');
          }

          const guard = functionSource('rc843EnsureView');
          if (!guard.includes('__EXPORTHUB_NAVIGATION_ACTIVE_UNTIL__') ||
              !guard.includes('explicit-navigation')) {
            throw new Error('RC843 Guard schützt explizite Navigation nicht');
          }

          if (!text.includes("input.id==='rc807ShipmentSearch'") ||
              !text.includes('renderSearchResults(input.value)')) {
            throw new Error('Sendungssuche / Live-Handler fehlt');
          }

          if (!text.includes("view==='shipmentsearch'") ||
              !text.includes('renderSearch')) {
            throw new Error('shipmentsearch Route fehlt');
          }

          const avisAnchor = text.indexOf('function avisHost(view)');
          if (avisAnchor < 0) throw new Error('Avis-Controller-Anker fehlt');

          const avisRender = functionSource('render', text.slice(avisAnchor));
          if (!avisRender.includes('rc845AvisReadHost') ||
              !avisRender.includes('rc845AvisEditHost') ||
              !avisRender.includes('return false')) {
            throw new Error('Interner KundenAvis-Cleanup unvollständig');
          }

          if (avisRender.includes('panel.innerHTML') ||
              avisRender.includes('KUNDEN-AVIS / LIEFERAVIS')) {
            throw new Error('Interner KundenAvis rendert weiterhin Inhalt');
          }

          const addrAnchor = text.indexOf('function addressSelectionValid()');
          if (addrAnchor < 0) throw new Error('Adresslogik-Anker fehlt');

          const updateAddress = functionSource(
            'updateConfirmationButtons',
            text.slice(addrAnchor)
          );

          if (!updateAddress.includes('rc386AddressConfirmed') ||
              !updateAddress.includes('.remove()')) {
            throw new Error('Adressbestätigungs-Cleanup fehlt');
          }

          if (text.includes(
            "confirmationButton(customerActions,'rc386AddressConfirmed','Adresse geprüft und bestätigt'"
          )) {
            throw new Error('Adressbestätigungs-Button wird noch erzeugt');
          }

          if (!text.includes(
            "customerBtn=workflowButton(/^kunde ubernehmen$/);if(customerBtn){customerBtn.remove();customerBtn=null}"
          )) {
            throw new Error('Kunde-übernehmen-Button wird nicht entfernt');
          }

          if (!text.includes('function setShipmentCustomerSearchAuto(v)') ||
              !text.includes('findCustomerBySearch(v)')) {
            throw new Error('Automatische Kundenauswahl wurde beschädigt');
          }

          // Keine fehlerhaften Produktivitätsmodule aus dem verworfenen Zweig übernehmen.
          const forbidden = [
            'exporthub-rc885-productivity',
            'exporthub-rc886-shipment-progress',
            'exporthub-rc887-quickwork',
            'exporthub-rc888-professional',
            'exporthub-rc889-actionbar',
            'exporthub-rc890-workspace',
            'exporthub-rc891-overview',
            'exporthub-rc892-professional-cleanup'
          ];

          for (const marker of forbidden) {
            if (text.includes(marker)) {
              throw new Error('Verworfener alter Modulblock gefunden: ' + marker);
            }
          }

          new Function('"use strict";return (' + guard + ');');
          new Function('"use strict";return (' + updateAddress + ');');
          new Function('"use strict";return (' + avisRender + ');');

          console.log('RC884 core safety tests: PASS');
          NODE

      - name: Browser-visible source safety test
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          src = Path("TESTVERSION.html").read_text(encoding="utf-8", errors="replace")

          class Visible(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script = 0
                  self.style = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  t = tag.lower()
                  if t == "script":
                      self.script += 1
                  elif t == "style":
                      self.style += 1
              def handle_endtag(self, tag):
                  t = tag.lower()
                  if t == "script" and self.script:
                      self.script -= 1
                  elif t == "style" and self.style:
                      self.style -= 1
              def handle_data(self, data):
                  if not self.script and not self.style:
                      self.parts.append(data)

          p = Visible()
          p.feed(src)
          p.close()
          visible = "\n".join(p.parts)

          bad = [
              "function applyFixedBlocks()",
              "function canonicalActionButtons(",
              "function createQr(",
              "window.open('about:blank'",
              'window.open("about:blank"',
              "pickupQrActivating",
          ]

          leaks = [x for x in bad if x in visible]
          if leaks:
              raise SystemExit(
                  "RC884 würde JavaScript als sichtbaren Seitentext ausgeben: " +
                  ", ".join(leaks)
              )

          print("OK: Kein bekannter JavaScript-Quelltext ist außerhalb von Scriptbereichen sichtbar.")
          PY

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- \
            index.html \
            production-version.js \
            api \
            pickup.html \
            location.html \
            customer-avis.html \
            staticwebapp.config.json \
            staticwebapp.testservice.config.json
          then
            echo "::error::Produktions-/API-Dateien wurden verändert."
            git diff -- \
              index.html \
              production-version.js \
              api \
              pickup.html \
              location.html \
              customer-avis.html \
              staticwebapp.config.json \
              staticwebapp.testservice.config.json
            exit 1
          fi

          mapfile -t CHANGED < <(git diff --name-only)
          printf 'Geänderte Dateien:\n'
          printf ' - %s\n' "${CHANGED[@]}"

          [[ "${#CHANGED[@]}" -eq 1 && "${CHANGED[0]}" == "TESTVERSION.html" ]] || {
            echo "::error::RC884 darf ausschließlich TESTVERSION.html ändern."
            exit 1
          }

      - name: Commit RC884 clean core
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC884: clean navigation and shipment core"
          git push origin main

      - name: Snapshot existing TESTSERVICE deploy runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --workflow exporthub-testservice.yml \
            --limit 50 \
            --json databaseId \
            --jq '.[].databaseId' > /tmp/testservice_runs_before.txt || true

      - name: Dispatch TESTSERVICE deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/exporthub-testservice.yml/dispatches" \
            -f ref=main
          echo "TESTSERVICE Deploy wurde explizit gestartet."

      - name: Find and wait for RC884 TESTSERVICE deployment
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID=""

          for attempt in $(seq 1 60); do
            mapfile -t IDS < <(
              gh run list \
                --workflow exporthub-testservice.yml \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId \
                --jq '.[].databaseId'
            )

            for id in "${IDS[@]}"; do
              if ! grep -qx "${id}" /tmp/testservice_runs_before.txt 2>/dev/null; then
                RUN_ID="${id}"
                break
              fi
            done

            [[ -n "${RUN_ID}" ]] && break

            echo "Warte auf neuen TESTSERVICE-Run... (${attempt}/60)"
            sleep 5
          done

          if [[ -z "${RUN_ID}" ]]; then
            echo "::error::Der gestartete TESTSERVICE-Deploy wurde nicht gefunden."
            exit 1
          fi

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Gefundener TESTSERVICE-Run: ${RUN_ID}"

          gh run watch "${RUN_ID}" --exit-status

      - name: Verify RC884 deploy result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ steps.deploy.outputs.run_id }}
        run: |
          set -euo pipefail

          CONCLUSION="$(
            gh run view "${DEPLOY_RUN_ID}" \
              --json conclusion \
              --jq '.conclusion'
          )"

          [[ "${CONCLUSION}" == "success" ]] || {
            echo "::error::TESTSERVICE-Deploy endete mit ${CONCLUSION}."
            exit 1
          }

          grep -Fq "version:'RC884',cache:'884',loginReturn:'/TESTVERSION.html?v=884'" TESTVERSION.html

          echo "OK: RC884 wurde erfolgreich für den TESTSERVICE deployed."

      - name: RC884 summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ExportHUB RC884 – kontrollierter Neustart"
            echo
            echo "- Basis: **sauberer RC883-Testservice**"
            echo "- Geänderte Projektdatei: **nur TESTVERSION.html**"
            echo "- Produktion / APIs: **unverändert**"
            echo "- Navigation aus Sendungsansicht: **korrigiert**"
            echo "- Sendungssuche: **bestehender Handler geschützt**"
            echo "- KundenAvis intern: **entfernt**"
            echo "- Kunde übernehmen: **entfernt**"
            echo "- Adresse geprüft und bestätigt: **entfernt**"
            echo "- Alte RC885–RC892-Module: **nicht übernommen**"
            echo
            echo "### Live-Test nach grünem Workflow"
            echo "1. Testseite mit **Strg + F5** laden."
            echo "2. Sendung öffnen → Dashboard / Aufgaben / Kunden wechseln."
            echo "3. Sendungssuche testen."
            echo "4. Sendung erstellen öffnen."
            echo "5. Prüfen: kein KundenAvis, kein Kunde-übernehmen-Button, keine Adressbestätigung."
            echo "6. Prüfen: kein JavaScript-Quelltext sichtbar."
          } >> "$GITHUB_STEP_SUMMARY"
