name: RC1350 AVIS Refresh Performance Gate

on:
  pull_request:
    paths:
      - 'customer-avis.html'
      - '.github/rc1018/build-three-env.mjs'
      - 'e2e/specs/rc1350-performance.spec.mjs'
      - 'test/rc1350-performance-lossless.test.mjs'
      - '.github/workflows/rc1350-performance-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: RC1350 contract tests
        run: node --test test/rc1350-performance-lossless.test.mjs
      - name: Build ExportHUB
        run: node .github/rc1112/build-three-env.mjs
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium
      - name: Verify duplicate refresh requests are coalesced
        env:
          EXPORTHUB_E2E_STATIC: '1'
        run: npx playwright test e2e/specs/rc1350-performance.spec.mjs --project=laptop
