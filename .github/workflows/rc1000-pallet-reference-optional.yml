name: RC1000 Palettenkonto Referenz optional

on:
  push:
    branches:
      - rc1000-clean-navigation-search
    paths:
      - '.github/workflows/rc1000-pallet-reference-optional.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: rc1000-clean-navigation-search
          fetch-depth: 0

      - name: Node 20 bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baseline Regressionen vor Änderung
        run: npm test

      - name: Bestehende RC1000 Navigation-Baseline erfassen
        shell: bash
        run: |
          set +e
          node --test .github/rc1000/rc1000-navigation-search.test.mjs > rc1000-nav-before.log 2>&1
          status=$?
          set -e
          cat rc1000-nav-before.log
          echo "NAV_BEFORE_STATUS=$status" >> "$GITHUB_ENV"
          grep '^not ok ' rc1000-nav-before.log | sed -E 's/^[[:space:]]*//' > rc1000-nav-before-failures.txt || true
          echo "Navigation-Baseline Exit-Code: $status"

      - name: RED - Referenzpflicht reproduzieren
        shell: bash
        run: |
          set +e
          node --test .github/rc1000/rc1000-pallet-reference-optional.test.mjs > rc1000-pallet-red.log 2>&1
          status=$?
          set -e
          cat rc1000-pallet-red.log
          if [ "$status" -eq 0 ]; then
            echo 'RED-Phase ist unerwartet grün; Abbruch ohne Materialisierung.'
            exit 1
          fi
          echo 'RED bestätigt: die alte Ausgang-Referenzpflicht ist reproduziert.'

      - name: Materialisierer Syntax prüfen
        run: node --check .github/rc1000/apply-pallet-reference-optional.mjs

      - name: Referenzpflicht im Palettenkonto entfernen
        run: node .github/rc1000/apply-pallet-reference-optional.mjs

      - name: GREEN - Eingang und Ausgang ohne Referenz
        run: node --test .github/rc1000/rc1000-pallet-reference-optional.test.mjs

      - name: RC1000 Navigation auf unveränderte Baseline prüfen
        shell: bash
        run: |
          set +e
          node --test .github/rc1000/rc1000-navigation-search.test.mjs > rc1000-nav-after.log 2>&1
          status=$?
          set -e
          cat rc1000-nav-after.log
          grep '^not ok ' rc1000-nav-after.log | sed -E 's/^[[:space:]]*//' > rc1000-nav-after-failures.txt || true
          if [ "$status" -ne "$NAV_BEFORE_STATUS" ]; then
            echo "Navigation hat ihren Status verändert: vorher=$NAV_BEFORE_STATUS nachher=$status"
            exit 1
          fi
          if ! diff -u rc1000-nav-before-failures.txt rc1000-nav-after-failures.txt; then
            echo 'Die Menge der fehlgeschlagenen Navigationstests hat sich verändert.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            grep -F 'TESTVERSION.html: sendungssuche selects first gated hit' rc1000-nav-before.log
            grep -F 'expected 3 candidate buttons, got 0' rc1000-nav-before.log
            grep -F 'TESTVERSION.html: sendungssuche selects first gated hit' rc1000-nav-after.log
            grep -F 'expected 3 candidate buttons, got 0' rc1000-nav-after.log
            echo 'Bekannte TESTVERSION-Navigationsabweichung war bereits vor der Palettenänderung vorhanden und ist unverändert.'
          fi

      - name: Baseline Regressionen nach Änderung
        run: npm test

      - name: Produktionsmarker schützen
        shell: bash
        run: |
          grep -F "window.__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC997';" production-version.js
          if grep -q 'RC1000' production-version.js; then
            echo 'RC1000 darf production-version.js nicht verändern.'
            exit 1
          fi

      - name: Diff auf Palettenkonto begrenzen
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected=$'TESTVERSION.html\nindex.html'
          if [ "$changed" != "$expected" ]; then
            echo 'Unerwartete Dateien im Materialisierungs-Diff.'
            exit 1
          fi
          for file in index.html TESTVERSION.html; do
            git diff -- "$file" | grep -F 'Sendungsreferenz optional'
            git diff -- "$file" | grep -F "Für einen Ausgang ist die Sendungsreferenz Pflicht."
          done

      - name: Palettenänderung materialisieren
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html TESTVERSION.html
          git commit -m 'RC1000: Palettenbuchungen ohne Referenz erlauben'
          git push origin HEAD:rc1000-clean-navigation-search
