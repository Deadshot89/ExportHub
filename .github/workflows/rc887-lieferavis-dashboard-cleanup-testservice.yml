name: RC887 Lieferavis and Dashboard Cleanup TESTSERVICE

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: exporthub-rc887-lieferavis-dashboard-cleanup
  cancel-in-progress: false

jobs:
  patch-testservice:
    name: RC887 Lieferavis + Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout RC886 main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard clean RC886 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html
          grep -Fq "version:'RC886',cache:'886',loginReturn:'/TESTVERSION.html?v=886'" TESTVERSION.html
          grep -Fq "/* exporthub-rc885-clean-workspace-v4 */" TESTVERSION.html
          grep -Fq "/* exporthub-rc886-testservice-api-hotfix */" TESTVERSION.html
          grep -Fq "function avisHost(view)" TESTVERSION.html

          git fetch --tags --force
          TAG="backup-rc883-before-rc884-navigation-search-ux"
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null
          git show "${TAG}:TESTVERSION.html" > /tmp/rc883-original.html

          grep -Fq "KUNDEN-AVIS / LIEFERAVIS" /tmp/rc883-original.html
          grep -Fq "function avisHost(view)" /tmp/rc883-original.html

      - name: RED regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("TESTVERSION.html").read_text(encoding="utf-8")

          marker=src.find("/* exporthub-rc885-clean-workspace-v4 */")
          if marker < 0:
              raise SystemExit("RC885 Workspace fehlt")

          window=src[marker:marker+60000]
          if "panelHtml('task')" not in window or "panelHtml('shipment')" not in window:
              raise SystemExit("RED-Test Dashboard-Dublette nicht reproduziert")

          avis=src.find("function avisHost(view)")
          if avis < 0:
              raise SystemExit("Avis-Anker fehlt")

          fragment=src[avis:avis+12000]
          if "rc845AvisReadHost" not in fragment or "lastSig='';return false" not in fragment:
              raise SystemExit("RED-Test Avis-Cleanup nicht reproduziert")

          print("RED bestätigt: Dashboard-Dublette + global deaktivierter Avis-Renderer.")
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC886 backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-clean-rc886-before-rc887-${GITHUB_RUN_ID}"
          git tag -a "${TAG}" -m "Clean RC886 before RC887"
          git push origin "refs/tags/${TAG}"

      - name: Snapshot HTML script and style boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("TESTVERSION.html").read_text(encoding="utf-8")
          Path("/tmp/rc887_script_open").write_text(str(src.lower().count("<script")))
          Path("/tmp/rc887_script_close").write_text(str(src.lower().count("</script>")))
          Path("/tmp/rc887_style_open").write_text(str(src.lower().count("<style")))
          Path("/tmp/rc887_style_close").write_text(str(src.lower().count("</style>")))
          PY

