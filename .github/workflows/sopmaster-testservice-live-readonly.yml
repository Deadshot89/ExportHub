name: SOPMaster TESTSERVICE Live Readonly

on:
  push:
    branches:
      - design/sopmaster-training-tour-2026-10-12
    paths:
      - 'e2e/specs/sopmaster-testservice-package.spec.mjs'
      - '.github/workflows/sopmaster-testservice-live-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sopmaster-testservice-live-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium
      - name: Read-only proof against current TESTSERVICE
        env:
          EXPORTHUB_E2E_LIVE: '1'
          EXPORTHUB_E2E_BASE_URL: https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net
          EXPORTHUB_E2E_ENTRY: '/'
          EXPORTHUB_E2E_PUBLIC_ENV: testservice
        run: >-
          npx playwright test
          e2e/specs/sopmaster-testservice-package.spec.mjs
          --project=laptop
          --project=mobile-standard
      - name: Upload read-only live artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc1507-testservice-live-readonly-debug
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
