name: ONE-TIME Clean Professional from ExportHUB Internal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Zum Bereinigen exakt CLEAN_INTERNAL_RC882 eingeben'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: exporthub-internal-professional-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify RC882 and prepare cleanup
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          FIRST_PROFESSIONAL_COMMIT: ced6b59
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "CLEAN_INTERNAL_RC882" ]] || { echo "ABBRUCH: Bestätigung muss CLEAN_INTERNAL_RC882 lauten."; exit 1; }

          SOURCE_HEAD="$(git rev-parse HEAD)"
          git cat-file -e "${FIRST_PROFESSIONAL_COMMIT}^{commit}"
          CLEAN_BASE="$(git rev-parse "${FIRST_PROFESSIONAL_COMMIT}^")"

          test_rc="$(grep -oE "var BUILD=Object\.freeze\(\{version:'RC[0-9]+'" TESTVERSION.html | head -n1 | grep -oE 'RC[0-9]+' || true)"
          prod_rc="$(grep -oE "var BUILD=Object\.freeze\(\{version:'RC[0-9]+'" index.html | head -n1 | grep -oE 'RC[0-9]+' || true)"
          marker_rc="$(node -e "try{const fs=require('fs');const s=fs.readFileSync('production-version.js','utf8');const m=s.match(/RC[0-9]+/);process.stdout.write(m?m[0]:'')}catch(e){}")"

          [[ "$test_rc" == "RC882" ]] || { echo "ABBRUCH: TESTVERSION ist nicht RC882 (gefunden: ${test_rc:-nichts})."; exit 1; }
          [[ "$prod_rc" == "RC882" ]] || { echo "ABBRUCH: index.html ist nicht RC882 (gefunden: ${prod_rc:-nichts})."; exit 1; }
          [[ "$marker_rc" == "RC882" ]] || { echo "ABBRUCH: production-version.js ist nicht RC882 (gefunden: ${marker_rc:-nichts})."; exit 1; }
          node -e "const p=require('./api/package.json'); if(p.dependencies?.['@azure/storage-blob']!=='12.27.0') process.exit(1);"

          echo "SOURCE_HEAD=$SOURCE_HEAD" >> "$GITHUB_ENV"
          echo "CLEAN_BASE=$CLEAN_BASE" >> "$GITHUB_ENV"
          echo "OK: RC882 Test + Produktion bestätigt."

      - name: Create safety branch
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          branch="backup-before-professional-cleanup-$stamp"
          git branch "$branch" HEAD
          git push origin "$branch"
          echo "Sicherungsbranch erstellt: $branch"

      - name: Remove only Professional pollution and keep RC882
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          restore_or_remove() {
            p="$1"
            if git cat-file -e "$CLEAN_BASE:$p" 2>/dev/null; then
              git checkout "$CLEAN_BASE" -- "$p"
            else
              git rm -rf --ignore-unmatch -- "$p" >/dev/null 2>&1 || true
              rm -rf -- "$p" 2>/dev/null || true
            fi
          }

          # Dateien/Ordner, die durch das Professional-Paket in Internal geraten sein können.
          restore_or_remove ".github/workflows/professional-ci.yml"
          restore_or_remove "professional-project.json"
          restore_or_remove "UPLOAD_ONLY_TO_NEW_REPOSITORY.txt"
          restore_or_remove "PROFESSIONAL_0.4_PRUEFBERICHT.txt"
          restore_or_remove "README.md"
          restore_or_remove "package.json"
          restore_or_remove ".gitignore"
          restore_or_remove "staticwebapp.config.json"
          restore_or_remove "assets/js/app.js"
          restore_or_remove "assets/css/app.css"
          restore_or_remove "docs/MIGRATION_SAFETY.md"
          restore_or_remove "docs/MIGRATION_REPORT_TEMPLATE.md"
          restore_or_remove "docs/ARCHITECTURE.md"
          restore_or_remove "docs/CURRENT_SOURCE_BASELINE.md"
          restore_or_remove "docs/ROADMAP.md"
          restore_or_remove "migration/verify-source-profile.mjs"
          restore_or_remove "migration/analyze-exporthub-backup.mjs"
          restore_or_remove "migration/verify-migration-package.mjs"
          restore_or_remove "migration/source-profile-rc826.json"
          restore_or_remove "migration/sample-backup.json"
          restore_or_remove "test/migration.test.mjs"
          restore_or_remove "api/health/function.json"
          restore_or_remove "api/health/index.js"
          restore_or_remove "shared/migration-core.js"
          restore_or_remove "schema/postgres.sql"
          restore_or_remove "tools/migration-checker.html"

          # Den aktuell erfolgreichen RC882-Kern ausdrücklich wieder aus SOURCE_HEAD übernehmen.
          for p in \
            index.html \
            TESTVERSION.html \
            production-version.js \
            api/package.json \
            api/shared/user-policy.js \
            api/exporthub-auth-probe/index.js \
            api/exporthub-auth-probe/function.json \
            .github/workflows/exporthub-testservice.yml \
            .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml
          do
            if git cat-file -e "$SOURCE_HEAD:$p" 2>/dev/null; then
              git checkout "$SOURCE_HEAD" -- "$p"
            fi
          done

          # Alte/temporäre Bereinigungs-Workflows danach ebenfalls entfernen.
          git rm -f --ignore-unmatch ".github/workflows/restore-exporthub-internal-rc882.yml" >/dev/null 2>&1 || true
          git rm -f --ignore-unmatch ".github/workflows/cleanup-professional-from-internal.yml" >/dev/null 2>&1 || true

          git add -A

          # Harte Abschlussprüfungen.
          test ! -f .github/workflows/professional-ci.yml
          test ! -f professional-project.json
          test ! -f UPLOAD_ONLY_TO_NEW_REPOSITORY.txt

          test_rc="$(grep -oE "var BUILD=Object\.freeze\(\{version:'RC[0-9]+'" TESTVERSION.html | head -n1 | grep -oE 'RC[0-9]+' || true)"
          prod_rc="$(grep -oE "var BUILD=Object\.freeze\(\{version:'RC[0-9]+'" index.html | head -n1 | grep -oE 'RC[0-9]+' || true)"
          marker_rc="$(node -e "const fs=require('fs');const s=fs.readFileSync('production-version.js','utf8');const m=s.match(/RC[0-9]+/);process.stdout.write(m?m[0]:'')")"
          [[ "$test_rc" == "RC882" && "$prod_rc" == "RC882" && "$marker_rc" == "RC882" ]]
          node -e "const p=require('./api/package.json'); if(p.dependencies?.['@azure/storage-blob']!=='12.27.0') process.exit(1);"

          if git diff --cached --quiet; then
            echo "Keine Bereinigung mehr nötig. Internal ist bereits sauber."
            exit 0
          fi

          git commit -m "Remove Professional files from ExportHUB Internal and keep RC882"
          git push origin HEAD:main
          echo "OK: Professional aus Internal entfernt; RC882 Test und Produktion beibehalten."
