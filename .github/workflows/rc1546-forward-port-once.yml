name: RC1546 Performance Forward Port Once

on:
  push:
    branches:
      - perf/rc1546-no-rerender-current-main
    paths:
      - .github/workflows/rc1546-forward-port-once.yml

permissions:
  contents: write

jobs:
  forward_port:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1546 Forward-Port ausführen
        run: node scripts/rc1546-forward-port-once.mjs
