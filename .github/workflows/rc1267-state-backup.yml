name: RC1267 State Backup Lifecycle

on:
  workflow_run:
    workflows:
      - ExportHUB RC1112 Drei-Umgebungen Deploy
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: Backup-Stufe; auto nutzt Tages-/Monats-/Jahresregel.
        required: true
        type: choice
        default: auto
        options:
          - auto
          - daily
          - monthly
          - yearly
          - all

permissions:
  contents: read
  id-token: write

concurrency:
  group: rc1267-state-backup-lifecycle
  cancel-in-progress: false

jobs:
  backup:
    name: Verifizierte State-Backups
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUESTED_TIER: ${{ inputs.tier || 'auto' }}
    steps:
      - name: Daily / Monthly / Yearly Snapshots erstellen und zurücklesen
        shell: bash
        run: |
          set -euo pipefail
          set +x

          oidc_token="$(
            curl -fsSL               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-state-compaction"             | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"

          requested="${REQUESTED_TIER:-auto}"
          day="$(date -u +%d)"
          month="$(date -u +%m)"
          tiers=()

          case "$requested" in
            daily|monthly|yearly) tiers=("$requested") ;;
            all) tiers=(daily monthly yearly) ;;
            auto)
              tiers=(daily)
              if [ "$day" = "01" ]; then tiers+=(monthly); fi
              if [ "$day" = "01" ] && [ "$month" = "01" ]; then tiers+=(yearly); fi
              ;;
            *) echo "Unbekannte Backup-Stufe: $requested" >&2; exit 2 ;;
          esac

          call_backup() {
            local base="$1"
            local env="$2"
            local tier="$3"
            local payload
            payload="$(node -e 'process.stdout.write(JSON.stringify({action:"scheduled-backup",environment:process.argv[1],tier:process.argv[2]}))' "$env" "$tier")"
            curl -fsSL               -H "Content-Type: application/json"               -H "x-exporthub-github-oidc: $oidc_token"               -H "x-exporthub-environment: $env"               --data "$payload"               "$base/api/state-maintenance"
          }

          verify_backup() {
            local env="$1"
            local tier="$2"
            node -e "
              let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
                const v=JSON.parse(s);
                if(!v.ok||v.scheduledBackup!==true||v.environment!==process.argv[1]||v.tier!==process.argv[2])process.exit(3);
                if(v.backupVerified!==true||v.backupReadBackVerified!==true||!v.backupBlob||!v.sha256||Number(v.bytes||0)<=0)process.exit(4);
                if(!v.retention||v.retention.automaticDeletion!==false||Number(v.retention.minimumRetentionDays||0)<=0)process.exit(5);
                console.log(process.argv[1]+' '+process.argv[2]+' backup',JSON.stringify({blob:v.backupBlob,bytes:v.bytes,sha256:v.sha256,retention:v.retention}));
              })" "$env" "$tier"
          }

          for tier in "${tiers[@]}"; do
            prod="$(call_backup 'https://wonderful-forest-0f315e310.7.azurestaticapps.net' production "$tier")"
            printf '%s\n' "$prod" | verify_backup production "$tier"

            testservice="$(call_backup 'https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net' testservice "$tier")"
            printf '%s\n' "$testservice" | verify_backup testservice "$tier"
          done

          echo "RC1267: verifizierte State-Backups abgeschlossen: ${tiers[*]}"
