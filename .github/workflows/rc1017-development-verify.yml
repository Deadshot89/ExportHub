name: RC1017 Development Verify

on:
  push:
    branches: [rc1017-multi-truck-subshipments]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc1017-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect active stow anchors
        run: node .github/rc1017/inspect-stow.cjs
      - name: Apply RC1017 pending patches
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1017/apply-pending.cjs
          node .github/rc1017/apply-task4.cjs
          node .github/rc1017/apply-task5.cjs
          node .github/rc1017/apply-task6.cjs
          node .github/rc1017/fix-task7-script.cjs
          node .github/rc1017/apply-task7.cjs
          node .github/rc1017/apply-task8.cjs
      - name: Commit pending RC1017 patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No pending production patch.'
            exit 0
          fi
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add index.html .github/rc1013/build-three-env.mjs .github/rc1016/build-three-env.mjs .github/workflows/rc1002-main-contract.yml .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml .github/workflows/exporthub-testservice.yml assets/abholkalender.js assets/abholkalender.css api/shared/merge.js api/pickup-init/index.js api/shared/pickup-store.js .github/rc1017/apply-task7.cjs .github/rc1017/apply-task8.cjs
          git commit -m 'RC1017: Drei-Umgebungen-Releasevertrag absichern'
          git push origin HEAD:rc1017-multi-truck-subshipments
      - name: RC1017 targeted tests
        shell: bash
        run: |
          set -euo pipefail
          for file in test/rc1017-*.test.mjs; do
            [ -f "$file" ] || continue
            node --test "$file"
          done
      - name: Pickup readonly regression
        run: node --test test/rc1013-pickup-readonly-flow.test.mjs
      - name: Calendar regression
        run: node --test test/rc1012-abholkalender-runtime-integration.test.mjs
      - name: Avis persistence regression
        run: node --test test/rc1016-lieferavis-persistence.test.mjs
      - name: Full regression
        run: npm test
      - name: RC1017 Drei-Umgebungen-Build verifizieren
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1016/build-three-env.mjs
          grep -q 'assets/rc1017-multi-truck.js?v=1017' dist-rc1016/index.html
          grep -q 'assets/rc1017-multi-truck.js?v=1017' dist-rc1016/TESTVERSION.html
          grep -q 'assets/rc1017-multi-truck.js?v=1017' dist-rc1016/demo.html
          test -s dist-rc1016/assets/rc1017-multi-truck.js
          grep -q 'ExportHubMultiTruck' dist-rc1016/assets/rc1017-multi-truck.js
          git diff --check
