name: RC1031 State Render Inspect
on:
  push:
    branches:
      - fix/rc1031-diagnostics-lieferavis-storage
    paths:
      - .github/workflows/rc1031-inspect-pickup-status.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: State-Save, Pickup-Init und Overview-Render untersuchen
        run: |
          node - <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('TESTVERSION.html','utf8');
          const needles=['exporthub-state?mode=save','mode=save&ack=1','__EXPORTHUB_SAVE_STATE__','function save(','renderOverview(true)','function rc640PatchOverviewQuietly(','function overviewReorderExistingCards(','pickup-init'];
          for(const needle of needles){let at=0,n=0;while((at=s.indexOf(needle,at))>=0){n++;if(n>12)break;console.log('\n### '+needle+' '+n+' @ '+at+' ###');console.log(s.slice(Math.max(0,at-1800),Math.min(s.length,at+4200)).replace(/\n/g,' '));at+=needle.length}}
          NODE
