name: RC889 Compact Warncenter TESTSERVICE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc889-compact-warncenter
  cancel-in-progress: false

jobs:
  patch-testservice:
    name: RC889 Compact Warncenter
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout RC888 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard RC888 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f TESTVERSION.html
          grep -Fq "version:'RC888',cache:'888',loginReturn:'/TESTVERSION.html?v=888'" TESTVERSION.html
          grep -Fq "/* exporthub-rc885-clean-workspace-v4 */" TESTVERSION.html
          grep -Fq "/* exporthub-rc886-testservice-api-hotfix */" TESTVERSION.html
          grep -Fq "__rc887AvisAllowed" TESTVERSION.html
          grep -Fq "/* exporthub-rc888-shipment-create-professional */" TESTVERSION.html

      - name: RED regression - old Warncenter is still flat
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "items:items.slice(0,8)" TESTVERSION.html
          grep -Fq "rc885-warning-list" TESTVERSION.html

          if grep -Fq "rc889-group" TESTVERSION.html; then
            echo "::error::RED-Test ungültig: RC889 Gruppierung existiert bereits."
            exit 1
          fi

          echo "RED bestätigt: Warncenter verwendet noch die alte flache Liste."

      - name: Snapshot source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("TESTVERSION.html").read_text(encoding="utf-8")
          for k,v in {
              "script_open":src.lower().count("<script"),
              "script_close":src.lower().count("</script>"),
              "style_open":src.lower().count("<style"),
              "style_close":src.lower().count("</style>")
          }.items():
              Path("/tmp/rc889_"+k).write_text(str(v))
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC888 backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-clean-rc888-before-rc889-${GITHUB_RUN_ID}"
          git tag -a "$TAG" -m "Clean RC888 before compact Warncenter RC889"
          git push origin "refs/tags/$TAG"

