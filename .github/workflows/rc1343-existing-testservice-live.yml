name: RC1343 Existing TESTSERVICE One-Shot Live Verification

on:
  push:
    branches:
      - fix/rc1903-remove-legacy-fields-all-internal-20261110
    paths:
      - .github/workflows/rc1343-existing-testservice-live.yml

permissions:
  contents: read

concurrency:
  group: exporthub-rc1343-existing-testservice-one-shot
  cancel-in-progress: false

jobs:
  live_verify_existing_testservice:
    if: github.repository == 'Deadshot89/ExportHub' && github.ref == 'refs/heads/fix/rc1903-remove-legacy-fields-all-internal-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout test-only script, no production deploy
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Fail closed if main has changed since verified TESTSERVICE deploy
        shell: bash
        env:
          EXPECTED_MAIN_SHA: c39e3b7623810da10cd8e25615c3d3bb544eed92
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Deadshot89/ExportHub'
          test "$GITHUB_REF" = 'refs/heads/fix/rc1903-remove-legacy-fields-all-internal-20261110'
          actual="$(git ls-remote https://github.com/Deadshot89/ExportHub.git refs/heads/main | cut -f1)"
          test "$actual" = "$EXPECTED_MAIN_SHA" || { echo 'MAIN_SHA_CHANGED: refuse test writes'; exit 1; }
          node --check scripts/rc1343-existing-testservice-live.mjs
      - name: Synthetic JPG and PDF upload, binary readback, and security gates on existing TESTSERVICE
        env:
          RC1903_EXPECTED_SHA: c39e3b7623810da10cd8e25615c3d3bb544eed92
        run: node scripts/rc1343-existing-testservice-live.mjs
