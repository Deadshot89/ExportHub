name: RC1553 Apply Production Evidence Once
# retry: stage patched workflow blobs without workflow write permission

on:
  push:
    branches:
      - rc1553-it-control-production-evidence
    paths:
      - '.github/workflows/rc1553-apply-production-evidence-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rc1553-it-control-production-evidence
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1553 Release-Workflows patchen
        run: node .github/rc1553/apply-production-evidence.mjs
      - name: RC1553 Vertrag nach Patch prüfen
        run: node --test test/rc1553-it-control-production-evidence.test.mjs
      - name: RC1553 geprüfte Workflow-Blobs bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml .github/rc1553/staged-testservice.yml.txt
          cp .github/workflows/exporthub-production-release.yml .github/rc1553/staged-production.yml.txt
          git checkout -- .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml .github/workflows/exporthub-production-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc1553/staged-testservice.yml.txt .github/rc1553/staged-production.yml.txt
          git diff --cached --check
          git commit -m 'build(RC1553): stage verified deployment workflows'
          git push origin HEAD:rc1553-it-control-production-evidence
