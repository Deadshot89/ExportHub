name: RC999 Export Search Owner

on:
  push:
    branches:
      - rc999-navigation-search-final
    paths:
      - '.github/rc999/export-search-owner.mjs'
      - '.github/workflows/rc999-export-search-owner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Suchindex extrahieren
        run: node .github/rc999/export-search-owner.mjs
      - name: Diagnose-Snapshot committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc999/search-owner-snapshot.txt
          if git diff --cached --quiet; then
            echo 'Snapshot unverändert.'
            exit 0
          fi
          git commit -m 'RC999: aktiven Suchindex diagnostisch erfassen'
          git push origin HEAD:rc999-navigation-search-final
