name: RC947 Notification Center Audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc947-notification-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Locate warning and notification UIs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          needles=[
            'Warncenter','Benachrichtigung','Benachrichtigungscenter','Notification','notification','notify',
            'alertCenterOverlay','indexAlertPreviewBox','indexAlertPreviewCount','btnIndexAlertPreviewRefresh',
            'alertBadge','alert-badge','bell','Bell','Meldungen','Hinweise','Warnungen'
          ]
          out=[]
          for needle in needles:
            positions=[]; start=0
            while True:
              p=text.find(needle,start)
              if p<0: break
              positions.append(p); start=p+len(needle)
            out.append(f'\n### {needle} COUNT={len(positions)} POS={positions[:80]}\n')
            for p in positions[:30]:
              out.append('\n--- context ---\n'+text[max(0,p-1400):min(len(text),p+2600)]+'\n')
          # IDs/classes around likely header controls
          for m in re.finditer(r'<button[^>]+(?:id|class)="[^"]*(?:alert|notif|warn|bell)[^"]*"[^>]*>', text, re.I):
            p=m.start(); out.append(f'\n### BUTTON @ {p}\n{text[max(0,p-900):min(len(text),p+2200)]}\n')
          report=''.join(out)
          if len(report)>250000: report=report[:250000]
          Path('rc947-notification-audit.txt').write_text(report,encoding='utf-8')
          print(f'wrote {len(report)} chars')
          PY
      - name: Commit audit output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rc947-notification-audit.txt
          git commit -m 'Capture RC947 notification audit'
          git push
