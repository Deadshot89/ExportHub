name: RC886 TESTSERVICE Deploy Action Repair

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: exporthub-rc886-testservice-deploy-action-repair
  cancel-in-progress: false

jobs:
  repair-deploy:
    name: Repair TESTSERVICE Azure deploy action
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard committed RC886 state
        shell: bash
        run: |
          set -euo pipefail

          test -f TESTVERSION.html
          test -f .github/workflows/exporthub-testservice.yml

          grep -Fq "version:'RC886',cache:'886',loginReturn:'/TESTVERSION.html?v=886'" TESTVERSION.html
          grep -Fq "/* exporthub-rc886-testservice-api-hotfix */" TESTVERSION.html

          echo "OK: RC886 ist bereits in TESTVERSION.html committed."
          echo "TESTVERSION.html wird von diesem Reparatur-Workflow nicht geändert."

      - name: Diagnose Azure Static Web Apps action reference
        id: diagnose
        shell: bash
        run: |
          set -euo pipefail

          FILE=".github/workflows/exporthub-testservice.yml"

          echo "=== Azure deploy action references ==="
          grep -nE 'uses:[[:space:]]*Azure/static-web-apps-deploy@' "$FILE" || true

          echo "=== deployment_environment references ==="
          grep -n 'deployment_environment:' "$FILE" || true

          if ! grep -q 'deployment_environment:' "$FILE"; then
            echo "::error::Der TESTSERVICE-Workflow verwendet kein deployment_environment. Dieser Reparaturfall passt dann nicht zum Screenshot."
            exit 1
          fi

          if ! grep -Eq 'uses:[[:space:]]*Azure/static-web-apps-deploy@[0-9a-fA-F]{7,40}' "$FILE"; then
            if grep -Eq 'uses:[[:space:]]*Azure/static-web-apps-deploy@v1' "$FILE"; then
              echo "::error::Der TESTSERVICE-Workflow verwendet bereits Azure/static-web-apps-deploy@v1. Dann ist die alte Action-Referenz nicht mehr die Ursache und es wird nichts verändert."
              exit 1
            fi

            echo "::error::Es wurde keine erwartete alte Azure/static-web-apps-deploy SHA-Referenz gefunden."
            exit 1
          fi

          echo "OK: Alter gepinnter Azure-Action-Stand plus deployment_environment bestätigt."

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Backup TESTSERVICE deploy workflow
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-testservice-deploy-before-rc886-action-fix-${GITHUB_RUN_ID}"
          git tag -a "${TAG}" -m "Backup before RC886 TESTSERVICE Azure action fix"
          git push origin "refs/tags/${TAG}"
          echo "Backup erstellt: ${TAG}"

      - name: Replace obsolete pinned Azure action with current v1
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(".github/workflows/exporthub-testservice.yml")
          src = p.read_text(encoding="utf-8")
          original = src

          pattern = re.compile(
              r'(?m)(uses:\s*Azure/static-web-apps-deploy@)[0-9a-fA-F]{7,40}'
          )

          refs = pattern.findall(src)
          if not refs:
              raise SystemExit("Keine alte gepinnte Azure Static Web Apps Action gefunden.")

          src, count = pattern.subn(r'\1v1', src)

          if count < 1:
              raise SystemExit("Keine Azure Action Referenz ersetzt.")

          if "deployment_environment:" not in src:
              raise SystemExit("deployment_environment ging beim Patch verloren.")

          if src == original:
              raise SystemExit("Patch hat keine Änderung erzeugt.")

          p.write_text(src, encoding="utf-8")
          print(f"{count} alte Azure Action Referenz(en) auf @v1 aktualisiert.")
          PY

      - name: Validate TESTSERVICE deploy workflow after repair
        shell: bash
        run: |
          set -euo pipefail

          FILE=".github/workflows/exporthub-testservice.yml"

          if grep -Eq 'uses:[[:space:]]*Azure/static-web-apps-deploy@[0-9a-fA-F]{7,40}' "$FILE"; then
            echo "::error::Mindestens eine alte gepinnte Azure Action ist noch vorhanden."
            grep -nE 'uses:[[:space:]]*Azure/static-web-apps-deploy@' "$FILE" || true
            exit 1
          fi

          grep -Eq 'uses:[[:space:]]*Azure/static-web-apps-deploy@v1' "$FILE"
          grep -q 'deployment_environment:' "$FILE"

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          p = Path(".github/workflows/exporthub-testservice.yml")
          data = yaml.safe_load(p.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit("TESTSERVICE Workflow ist kein gültiges YAML-Objekt.")

          text = p.read_text(encoding="utf-8")
          if "Azure/static-web-apps-deploy@v1" not in text:
              raise SystemExit("@v1 Referenz fehlt.")
          if "deployment_environment:" not in text:
              raise SystemExit("deployment_environment fehlt.")

          print("YAML und Azure Action Referenz: PASS")
          PY

      - name: Verify repair scope
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t CHANGED < <(git diff --name-only)

          echo "Geänderte Dateien:"
          printf ' - %s\n' "${CHANGED[@]}"

          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != ".github/workflows/exporthub-testservice.yml" ]]; then
            echo "::error::Die Reparatur darf ausschließlich .github/workflows/exporthub-testservice.yml ändern."
            exit 1
          fi

          if ! git diff --quiet -- TESTVERSION.html; then
            echo "::error::TESTVERSION.html wurde unerwartet verändert."
            exit 1
          fi

      - name: Commit TESTSERVICE deploy action repair
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/exporthub-testservice.yml
          git commit -m "TESTSERVICE: update Azure deploy action for named environment"
          git push origin main

      - name: Snapshot existing TESTSERVICE deploy runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run list \
            --workflow exporthub-testservice.yml \
            --limit 50 \
            --json databaseId \
            --jq '.[].databaseId' > /tmp/testservice_runs_before.txt || true

      - name: Dispatch repaired TESTSERVICE deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/exporthub-testservice.yml/dispatches" \
            -f ref=main

          echo "Reparierter TESTSERVICE Deploy wurde gestartet."

      - name: Find repaired TESTSERVICE deploy run
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID=""

          for attempt in $(seq 1 60); do
            mapfile -t IDS < <(
              gh run list \
                --workflow exporthub-testservice.yml \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId \
                --jq '.[].databaseId'
            )

            for id in "${IDS[@]}"; do
              if ! grep -qx "${id}" /tmp/testservice_runs_before.txt 2>/dev/null; then
                RUN_ID="${id}"
                break
              fi
            done

            if [[ -n "${RUN_ID}" ]]; then
              break
            fi

            sleep 5
          done

          if [[ -z "${RUN_ID}" ]]; then
            echo "::error::Der neue TESTSERVICE Deploy konnte nicht gefunden werden."
            exit 1
          fi

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Neuer TESTSERVICE Run: ${RUN_ID}"

      - name: Wait for repaired TESTSERVICE deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.deploy.outputs.run_id }}
        run: |
          set -euo pipefail

          gh run watch "${RUN_ID}" || true

          CONCLUSION="$(
            gh run view "${RUN_ID}" \
              --json conclusion \
              --jq '.conclusion'
          )"

          echo "TESTSERVICE Deploy Ergebnis: ${CONCLUSION}"

          if [[ "${CONCLUSION}" != "success" ]]; then
            {
              echo "## TESTSERVICE Deploy weiterhin fehlgeschlagen"
              echo
              echo "Der alte Azure-Action-Pin wurde entfernt. Der verbleibende Fehler liegt daher in einem späteren Deploy-/Live-Prüfschritt."
              echo
              echo '```text'
              gh run view "${RUN_ID}" --log-failed 2>&1 | tail -n 220 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Der reparierte TESTSERVICE Deploy ist weiterhin fehlgeschlagen. Die fehlgeschlagenen Logs stehen jetzt direkt in dieser Workflow-Zusammenfassung."
            exit 1
          fi

          echo "RC886 TESTSERVICE Deploy erfolgreich."

      - name: Repair summary
        if: success()
        shell: bash
        run: |
          {
            echo "## RC886 TESTSERVICE Deploy Action Repair"
            echo
            echo "- RC886 TESTVERSION wurde nicht erneut verändert"
            echo "- Nur .github/workflows/exporthub-testservice.yml geändert"
            echo "- Alte gepinnte Azure Static Web Apps Action -> Azure/static-web-apps-deploy@v1"
            echo "- deployment_environment bleibt aktiv"
            echo "- TESTSERVICE Deploy wurde anschließend automatisch neu gestartet"
            echo "- Ergebnis: erfolgreich"
            echo
            echo "Jetzt die Testseite mit Strg+F5 neu laden und Teamdaten erneut laden."
          } >> "$GITHUB_STEP_SUMMARY"
