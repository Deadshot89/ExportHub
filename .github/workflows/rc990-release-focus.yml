name: RC990 Release Focus

on:
  push:
    branches:
      - rc990-large-ux
    paths:
      - '.github/rc990_release_focus.py'
      - '.github/workflows/rc990-release-focus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect focused release paths
        run: python .github/rc990_release_focus.py
