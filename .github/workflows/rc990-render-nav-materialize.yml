name: RC990 Render Navigation Materialize

on:
  push:
    branches:
      - rc990-large-ux
    paths:
      - '.github/rc990_render_nav_materialize.py'
      - '.github/workflows/rc990-render-nav-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref == 'refs/heads/rc990-large-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc990-large-ux
          fetch-depth: 0
      - name: Materialize focused render/navigation audits
        run: python .github/rc990_render_nav_materialize.py
      - name: Commit audit results
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/rc990_render_focus_audit.txt
            .github/rc990_render_scheduler_audit.txt
            .github/rc990_render_view_audit.txt
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo 'Audit results unchanged.'
            exit 0
          fi
          git commit -m 'chore: record focused RC990 render navigation audits'
          git push origin HEAD:rc990-large-ux
