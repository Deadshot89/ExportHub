name: RC1137 State Compaction

on:
  workflow_run:
    workflows:
      - ExportHUB RC1112 Drei-Umgebungen Deploy
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: rc1137-state-compaction
  cancel-in-progress: false

jobs:
  testservice:
    name: TESTSERVICE State kompaktieren
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: TESTSERVICE Vorschau, Backup, Apply und Live-Größe
        shell: bash
        env:
          BASE_URL: https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net
          TARGET_ENV: testservice
        run: |
          set -euo pipefail
          set +x

          oidc_token="$(
            curl -fsSL               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-state-compaction"             | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"

          call_maintenance() {
            local action="$1"
            curl -fsSL               -H "Content-Type: application/json"               -H "x-exporthub-github-oidc: $oidc_token"               -H "x-exporthub-environment: $TARGET_ENV"               -d "{\"action\":\"$action\",\"environment\":\"$TARGET_ENV\"}"               "$BASE_URL/api/state-maintenance"
          }

          preview="$(call_maintenance preview)"
          printf '%s\n' "$preview" | node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const v=JSON.parse(s);
              if(!v.ok||!v.preview)process.exit(2);
              if(!(Number(v.beforeBytes)>0)&&!(Number(v.afterBytes)>0))process.exit(3);
              console.log('TESTSERVICE preview',JSON.stringify({changed:v.changed,beforeBytes:v.beforeBytes,afterBytes:v.afterBytes,savedBytes:v.savedBytes,savedPercent:v.savedPercent}));
            })"

          changed="$(printf '%s' "$preview" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(JSON.parse(s).changed?'1':'0'))")"
          before="$(printf '%s' "$preview" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(String(JSON.parse(s).beforeBytes||0)))")"

          verify_before="0"
          if [ "$changed" = "1" ]; then
            verify_before="$before"
            applied="$(call_maintenance apply)"
            printf '%s\n' "$applied" | node -e "
              let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
                const v=JSON.parse(s);
                if(!v.ok||!v.applied||v.backupVerified!==true||!v.backupBlob)process.exit(4);
                if(!(Number(v.afterBytes)<Number(v.beforeBytes)))process.exit(5);
                console.log('TESTSERVICE apply',JSON.stringify({beforeBytes:v.beforeBytes,afterBytes:v.afterBytes,savedBytes:v.savedBytes,backupBlob:v.backupBlob,backupVerified:v.backupVerified}));
              })"
          else
            echo "TESTSERVICE: keine weitere RC1137-Kompaktierung erforderlich."
          fi

          migration_health_before="$(curl -fsSL "$BASE_URL/api/exporthub-state?mode=health")"
          blob_before="$(printf '%s' "$migration_health_before" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(String(Number(JSON.parse(s).stateDiagnostics?.blobDocumentEntries||0))))")"

          migration="$(call_maintenance migrate-testservice-documents)"
          printf '%s\n' "$migration" | node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const v=JSON.parse(s);
              if(!v.ok||Number(v.remaining||0)!==0)process.exit(8);
              if(Number(v.found||0)>0&&(!v.migrated||v.backupVerified!==true||!v.backupBlob))process.exit(9);
              console.log('TESTSERVICE document migration',JSON.stringify({found:v.found,migrated:v.migratedCount,remaining:v.remaining,bytesMoved:v.bytesMoved,batches:v.batches,beforeBytes:v.beforeBytes,afterBytes:v.afterBytes,backupBlob:v.backupBlob||null,backupVerified:v.backupVerified}));
            })"

          health="$(curl -fsSL "$BASE_URL/api/exporthub-state?mode=health")"
          printf '%s\n' "$health" | RC1137_BEFORE="$verify_before" RC1138_BLOB_BEFORE="$blob_before" node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const v=JSON.parse(s),bytes=Number(v.teamStateBytes||0),diag=v.stateDiagnostics||{};
              if(!v.ok||!v.teamStateReadable||bytes<=0)process.exit(6);
              console.log('TESTSERVICE teamStateBytes='+bytes);
              console.log('TESTSERVICE documents',JSON.stringify({inlinePayloadCount:diag.inlinePayloadCount,documentPayloadBytes:diag.documentPayloadBytes,blobDocumentEntries:diag.blobDocumentEntries}));
              const before=Number(process.env.RC1137_BEFORE||0);
              if(before>0&&bytes>=before)process.exit(7);
              if(Number(diag.inlinePayloadCount||0)!==0)process.exit(10);
              if(Number(diag.documentPayloadBytes||0)!==0)process.exit(11);
              const blobBefore=Number(process.env.RC1138_BLOB_BEFORE||0);
              if(Number(diag.blobDocumentEntries||0)<blobBefore)process.exit(12);
            })"
          restore_drill="$(call_maintenance restore-drill)"
          printf '%s\n' "$restore_drill" | node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const v=JSON.parse(s);
              if(!v.ok||v.restoreDrill!==true||v.verified!==true||v.backupReadBackVerified!==true)process.exit(15);
              if(!v.backupBlob||!v.restoreBlob||!v.sha256||Number(v.bytes||0)<=0)process.exit(16);
              if(v.shipmentReferencesVerified!==true)process.exit(17);
              console.log('TESTSERVICE restore drill',JSON.stringify({verified:v.verified,bytes:v.bytes,revision:v.revision,shipmentReferenceCount:v.shipmentReferenceCount,backupReadBackVerified:v.backupReadBackVerified}));
            })"


  production:
    name: PRODUCTION State kompaktieren
    needs:
      - testservice
    if: ${{ needs.testservice.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: PRODUCTION Vorschau, Backup, Apply und Live-Größe
        shell: bash
        env:
          BASE_URL: https://wonderful-forest-0f315e310.7.azurestaticapps.net
          TARGET_ENV: production
        run: |
          set -euo pipefail
          set +x

          oidc_token="$(
            curl -fsSL               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-state-compaction"             | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"

          call_maintenance() {
            local action="$1"
            curl -fsSL               -H "Content-Type: application/json"               -H "x-exporthub-github-oidc: $oidc_token"               -H "x-exporthub-environment: $TARGET_ENV"               -d "{\"action\":\"$action\",\"environment\":\"$TARGET_ENV\"}"               "$BASE_URL/api/state-maintenance"
          }

          preview="$(call_maintenance preview)"
          printf '%s\n' "$preview" | node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const v=JSON.parse(s);
              if(!v.ok||!v.preview)process.exit(2);
              if(!(Number(v.beforeBytes)>0)&&!(Number(v.afterBytes)>0))process.exit(3);
              console.log('PRODUCTION preview',JSON.stringify({changed:v.changed,beforeBytes:v.beforeBytes,afterBytes:v.afterBytes,savedBytes:v.savedBytes,savedPercent:v.savedPercent}));
            })"

          changed="$(printf '%s' "$preview" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(JSON.parse(s).changed?'1':'0'))")"
          before="$(printf '%s' "$preview" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(String(JSON.parse(s).beforeBytes||0)))")"

          verify_before="0"
          if [ "$changed" = "1" ]; then
            verify_before="$before"
            applied="$(call_maintenance apply)"
            printf '%s\n' "$applied" | node -e "
              let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
                const v=JSON.parse(s);
                if(!v.ok||!v.applied||v.backupVerified!==true||!v.backupBlob)process.exit(4);
                if(!(Number(v.afterBytes)<Number(v.beforeBytes)))process.exit(5);
                console.log('PRODUCTION apply',JSON.stringify({beforeBytes:v.beforeBytes,afterBytes:v.afterBytes,savedBytes:v.savedBytes,backupBlob:v.backupBlob,backupVerified:v.backupVerified}));
              })"
          else
            echo "PRODUCTION: keine weitere RC1137-Kompaktierung erforderlich."
          fi

          pallet_cleanup="$(call_maintenance cleanup-pallet-20260921)"
          printf '%s\n' "$pallet_cleanup" | node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const v=JSON.parse(s);
              if(!v.ok||v.environment!=='production'||v.verified!==true||Number(v.remaining||0)!==0)process.exit(13);
              if(v.applied===true&&v.backupVerified!==true)process.exit(14);
              console.log('PRODUCTION RC1208 Palettenkonto',JSON.stringify({date:v.date,deletedCount:v.deletedCount,totalDeleted:v.totalDeleted,remaining:v.remaining,verified:v.verified,backupBlob:v.backupBlob||null,revision:v.revision}));
            })"

          health="$(curl -fsSL "$BASE_URL/api/exporthub-state?mode=health")"
          printf '%s\n' "$health" | RC1137_BEFORE="$verify_before" node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const v=JSON.parse(s),bytes=Number(v.teamStateBytes||0);
              if(!v.ok||!v.teamStateReadable||bytes<=0)process.exit(6);
              console.log('PRODUCTION teamStateBytes='+bytes);
              const before=Number(process.env.RC1137_BEFORE||0);
              if(before>0&&bytes>=before)process.exit(7);
            })"
