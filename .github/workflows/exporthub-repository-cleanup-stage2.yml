name: ExportHUB Repository Cleanup Stage 2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-repository-cleanup-stage-2
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove obsolete RC reports
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard current ExportHUB state
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f TESTVERSION.html
          test -d .github/workflows
          test -d api

          grep -Fq "version:'RC888',cache:'888',loginReturn:'/TESTVERSION.html?v=888'" TESTVERSION.html

          echo "OK: RC888 ist die aktuelle TESTVERSION."

      - name: RED audit current obsolete root reports
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t REPORTS < <(
            find . -maxdepth 1 -type f \
              -regextype posix-extended \
              -regex './RC[0-9]+_PRUEFBERICHT\.txt' \
              -printf '%f\n' \
              | sort -V
          )

          if [[ "${#REPORTS[@]}" -eq 0 ]]; then
            echo "::error::Keine RC*_PRUEFBERICHT.txt im Repository-Root gefunden. Stage 2 ist vermutlich bereits erledigt."
            exit 1
          fi

          echo "Zu entfernende alte RC-Prüfberichte:"
          printf ' - %s\n' "${REPORTS[@]}"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Cleanup Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-before-repository-cleanup-stage2-${GITHUB_RUN_ID}"
          git tag -a "$TAG" -m "Backup before ExportHUB repository cleanup stage 2"
          git push origin "refs/tags/$TAG"
          echo "Backup erstellt: $TAG"

      - name: Remove all root RC review reports
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t REPORTS < <(
            find . -maxdepth 1 -type f \
              -regextype posix-extended \
              -regex './RC[0-9]+_PRUEFBERICHT\.txt' \
              -printf '%f\n' \
              | sort -V
          )

          for file in "${REPORTS[@]}"; do
            git rm -- "$file"
          done

      - name: GREEN audit protected files and deletion scope
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t CHANGED < <(git diff --cached --name-only)
          mapfile -t DELETED < <(git diff --cached --diff-filter=D --name-only)

          if [[ "${#DELETED[@]}" -eq 0 ]]; then
            echo "::error::Keine RC-Prüfberichte zur Löschung vorgemerkt."
            exit 1
          fi

          if [[ "${#CHANGED[@]}" -ne "${#DELETED[@]}" ]]; then
            echo "::error::Stage 2 enthält außer Löschungen weitere Änderungen."
            git diff --cached --name-status
            exit 1
          fi

          for file in "${DELETED[@]}"; do
            if ! [[ "$file" =~ ^RC[0-9]+_PRUEFBERICHT\.txt$ ]]; then
              echo "::error::Nicht freigegebene Löschung: $file"
              exit 1
            fi
          done

          test -f index.html
          test -f TESTVERSION.html
          test -f README.md
          test -f RELEASE_MANIFEST.txt
          test -f customer-avis.html
          test -f location.html
          test -f pickup.html
          test -f pod-notfall.html
          test -f production-version.js
          test -f staticwebapp.config.json
          test -f staticwebapp.testservice.config.json
          test -d .github/workflows
          test -d android-app
          test -d api
          test -d assets
          test -d docs
          test -d migration
          test -d releases
          test -d schema
          test -d shared
          test -d test
          test -d tools

          if ! git diff --quiet -- \
            index.html \
            TESTVERSION.html \
            README.md \
            RELEASE_MANIFEST.txt \
            customer-avis.html \
            location.html \
            pickup.html \
            pod-notfall.html \
            production-version.js \
            staticwebapp.config.json \
            staticwebapp.testservice.config.json \
            .github/workflows \
            android-app \
            api \
            assets \
            docs \
            infra \
            migration \
            releases \
            schema \
            shared \
            test \
            tools
          then
            echo "::error::Geschützter Projektbestand wurde verändert."
            exit 1
          fi

          echo "Freigegebene Löschungen:"
          printf ' - %s\n' "${DELETED[@]}"

      - name: Commit Stage 2 cleanup
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Repository cleanup: remove obsolete RC review reports"
          git push origin main

      - name: Summary
        shell: bash
        run: |
          {
            echo "## ExportHUB Repository Cleanup Stage 2"
            echo
            echo "Alle RC*_PRUEFBERICHT.txt im Repository-Root wurden entfernt."
            echo
            echo "RC888, Produktion, API, Android, Deploy-Konfigurationen und Projektordner blieben unverändert."
            echo
            echo "Nächster Schritt: alte Workflow-Dateien unter .github/workflows manuell auf drei aktive Workflows reduzieren."
          } >> "$GITHUB_STEP_SUMMARY"
