name: RC946 Immediate Drag Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc946-drag-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply RC946 patch
        run: python3 .github/rc946_drag_patch.py
      - name: Verify RC946 patch
        run: |
          grep -F "version:'RC946',cache:'946',loginReturn:'/TESTVERSION.html?v=946'" TESTVERSION.html
          grep -F "function rc946TaskPointerDayAt(" TESTVERSION.html
          grep -F "function rc946WarehousePointerZone(" TESTVERSION.html
          ! grep -F 'draggable="true" data-i218-drag=' TESTVERSION.html
          ! grep -F 'draggable="true" data-warehouse-drag-key=' TESTVERSION.html
      - name: Commit RC946
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TESTVERSION.html
          git commit -m 'RC946 Kachelverschiebung sofort reagieren lassen'
          git push
