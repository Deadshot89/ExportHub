name: RC969 State Performance Diagnose

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc969-state-performance-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kunden Save ACK Bestätigungspfad analysieren
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('TESTVERSION.html','utf8');
          const needle='const waits=[0,250,700,1400]';
          const pos=s.indexOf(needle);
          console.log('BUILD', (s.match(/var BUILD=Object\.freeze\(\{version:'(RC\d+)'/)||[])[1]||'unbekannt');
          console.log('wait-loop-pos',pos);
          if(pos<0)throw new Error('Kunden-Save-Bestätigungsschleife nicht gefunden');

          function findContainingFunction(at){
            const re=/\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\([^)]*\)\s*\{/g;
            let m,last=null;
            while((m=re.exec(s))&&m.index<at)last={name:m[1],index:m.index};
            return last;
          }
          const fn=findContainingFunction(pos);
          console.log('containing-function',fn);
          console.log('\n=== Funktionskontext ===\n'+s.slice(Math.max(0,fn.index-1200),Math.min(s.length,pos+9000)));

          for(const helper of ['criticalSaveDeltaConfirmed','persistentStateShapeComplete','stateCall','flushSave']){
            const p=s.lastIndexOf('function '+helper+'(',pos);
            const pa=s.lastIndexOf('async function '+helper+'(',pos);
            const start=Math.max(p,pa);
            console.log('\n=== '+helper+' @ '+start+' ===');
            if(start>=0)console.log(s.slice(start,Math.min(s.length,start+8500)));
          }

          if(fn&&fn.name){
            console.log('\n=== Aufrufer von '+fn.name+' ===');
            const token=fn.name+'(';
            let p=0,n=0;
            while((p=s.indexOf(token,p))>=0&&n<20){
              n++;
              console.log('\n--- CALL '+n+' @ '+p+' ---\n'+s.slice(Math.max(0,p-1600),Math.min(s.length,p+3500)));
              p+=token.length;
            }
            console.log('caller-count',n);
          }
          NODE
