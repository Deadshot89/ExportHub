          from pathlib import Path
          from html.parser import HTMLParser

          src = Path("TESTVERSION.html").read_text(encoding="utf-8", errors="replace")
          before = {
            "script_open": int(Path("/tmp/rc891_script_open").read_text()),
            "script_close": int(Path("/tmp/rc891_script_close").read_text()),
            "style_open": int(Path("/tmp/rc891_style_open").read_text()),
            "style_close": int(Path("/tmp/rc891_style_close").read_text())
          }
          after = {
            "script_open": src.lower().count("<script"),
            "script_close": src.lower().count("</script>"),
            "style_open": src.lower().count("<style"),
            "style_close": src.lower().count("</style>")
          }
          if before != after:
            raise SystemExit("HTML-Grenzen verändert: " + repr({"vorher": before, "nachher": after}))

          class V(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script = 0
                  self.style = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.script += 1
                  elif tag.lower() == "style":
                      self.style += 1
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.script:
                      self.script -= 1
                  elif tag.lower() == "style" and self.style:
                      self.style -= 1
              def handle_data(self, data):
                  if not self.script and not self.style:
                      self.parts.append(data)

          p = V()
          p.feed(src)
          p.close()
          visible = "\n".join(p.parts)
          leaks = [x for x in [
              "exporthub-rc891-layout-avis-render-fix",
              "function stabilizeSendungsdatenLayout()",
              "function ensureLieferAvis()"
          ] if x in visible]
          if leaks:
              raise SystemExit("JavaScript als Seitentext sichtbar: " + ", ".join(leaks))

          print("GREEN: RC891 korrekt eingebettet, keine sichtbaren Script-Leaks.")
          PY

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "TESTVERSION.html" ]]; then
            echo "::error::RC891 darf nur TESTVERSION.html ändern."
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi
          if ! git diff --quiet -- index.html api staticwebapp.config.json .github/workflows; then
            echo "::error::Produktion/API/Workflow-Dateien wurden verändert."
            exit 1
          fi

      - name: Commit RC891 TESTSERVICE
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC891: align Sendungsdaten layout, calm rerender, restore Lieferavis"
          git push origin main

      - name: RC891 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## ExportHUB RC891"
            echo
            echo "- Sendungsdaten-Felder neu ausgerichtet"
            echo "- Lieferavis-Button in der oberen Aktionsleiste ergänzt"
            echo "- Vollbreite für zentrale Dashboard-Kacheln beibehalten"
            echo "- Arbeitsfokus hinter 'Heute geplante Sendungen' eingeordnet"
            echo "- Re-Render-Schleifen aus dem vorherigen Patch ersetzt durch limitierte Initialisierung"
            echo "- Nur TESTVERSION.html geändert"
          } >> "$GITHUB_STEP_SUMMARY"
