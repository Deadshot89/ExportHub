name: RC990 Build Probe

on:
  push:
    branches:
      - rc990-large-ux
    paths:
      - '.github/rc990_build_probe.py'
      - '.github/workflows/rc990-build-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/rc990_build_probe.py
