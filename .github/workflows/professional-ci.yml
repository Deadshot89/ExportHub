name: ExportHUB Professional CI
on:
  push:
    paths:
      - 'ExportHUB_Professional/**'
      - '.github/workflows/professional-ci.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check api/health/index.js
