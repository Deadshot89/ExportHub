name: RC1624 TESTSERVICE Backup Reuse

on:
  pull_request:
    paths:
      - 'api/shared/state-backup-lifecycle.js'
      - 'test/rc1267-state-backup-lifecycle.test.mjs'
      - '.github/workflows/rc1624-testservice-backup-reuse.yml'
  push:
    branches: [main]
    paths:
      - 'api/shared/state-backup-lifecycle.js'
      - 'test/rc1267-state-backup-lifecycle.test.mjs'
      - '.github/workflows/rc1624-testservice-backup-reuse.yml'

permissions:
  contents: read

jobs:
  verified-backup-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Test unchanged daily, cross-day, changed, corruption, no-list and production safety
        run: node --test test/rc1267-state-backup-lifecycle.test.mjs
