name: RC1000 Diagnostics Repair

on:
  push:
    branches:
      - rc1000-clean-navigation-search
    paths:
      - '.github/workflows/rc1000-diagnostics-repair.yml'
      - '.github/rc1000/apply-diagnostics-repair.mjs'
      - '.github/rc1000/rc1000-diagnostics-repair.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc1000-diagnostics-repair
  cancel-in-progress: true

jobs:
  repair_verify_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: rc1000-clean-navigation-search
          fetch-depth: 0

      - name: Node 20 bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Baseline vor Reparatur
        run: npm test

      - name: Diagnose-Reparatur Syntax prüfen
        run: |
          node --check .github/rc1000/apply-diagnostics-repair.mjs
          node --check .github/rc1000/rc1000-diagnostics-repair.test.mjs

      - name: Diagnose-Reparatur anwenden
        run: node .github/rc1000/apply-diagnostics-repair.mjs

      - name: Diagnose-Vertrag prüfen
        run: node --test .github/rc1000/rc1000-diagnostics-repair.test.mjs

      - name: QR-Sicherheitsverträge prüfen
        run: |
          node --test .github/rc1000/rc1000-pickup-token-race.test.mjs
          node --test .github/rc995/rc995-contract.test.mjs
          node --test .github/rc995/rc995-flow.test.cjs

      - name: API Syntax prüfen
        run: |
          node --check api/shared/loader-pin-store.js
          node --check api/exporthub-state/index.js
          node --check api/shared/public-access-store.js
          node --check api/pickup-init/index.js
          node --check api/pickup-status/index.js
          node --check api/pickup-confirm-v2/index.js

      - name: Baseline nach Reparatur
        run: npm test

      - name: Produktionsschutz prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -F "window.__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC997';" production-version.js
          if git diff -- production-version.js | grep -q .; then
            echo 'Produktion wurde verändert.'
            exit 1
          fi

      - name: Reparatur materialisieren
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          if git diff --quiet -- index.html TESTVERSION.html api/shared/loader-pin-store.js api/exporthub-state/index.js; then
            echo 'Keine Diagnose-Reparatur erzeugt.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html TESTVERSION.html api/shared/loader-pin-store.js api/exporthub-state/index.js
          git commit -m 'RC1000: QR Status State und PIN Diagnosefehler beheben'
          git push origin HEAD:rc1000-clean-navigation-search

      - name: TESTSERVICE Paket bauen
        shell: bash
        run: |
          set -euo pipefail
          out='.rc1000_diagnostics_testservice'
          rm -rf "$out"
          mkdir -p "$out"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),out='.rc1000_diagnostics_testservice';
          const allowed=/\.(?:html|json|js|css|svg|png|jpe?g|gif|ico|webp|woff2?|txt)$/i;
          for(const entry of fs.readdirSync('.',{withFileTypes:true})){
            if(!entry.isFile()||!allowed.test(entry.name))continue;
            if(['index.html','TESTVERSION.html','staticwebapp.config.json','staticwebapp.testservice.config.json'].includes(entry.name))continue;
            fs.copyFileSync(entry.name,path.join(out,entry.name));
          }
          if(fs.existsSync('assets'))fs.cpSync('assets',path.join(out,'assets'),{recursive:true});
          fs.copyFileSync('TESTVERSION.html',path.join(out,'index.html'));
          fs.copyFileSync('TESTVERSION.html',path.join(out,'TESTVERSION.html'));
          for(const page of ['pickup.html','customer-avis.html','location.html','pod-notfall.html']){
            if(!fs.existsSync(page))throw new Error(`Pflichtseite fehlt: ${page}`);
            fs.copyFileSync(page,path.join(out,page));
          }
          const config=fs.existsSync('staticwebapp.testservice.config.json')?'staticwebapp.testservice.config.json':'staticwebapp.config.json';
          fs.copyFileSync(config,path.join(out,'staticwebapp.config.json'));
          NODE
          grep -q 'exporthub-rc1000-diagnostics-guard' "$out/index.html"
          grep -q 'Abholung bestätigen' "$out/pickup.html"

      - name: Azure Static Web Apps CLI
        run: npm install --global @azure/static-web-apps-cli@2.0.10

      - name: Auf TESTSERVICE deployen
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
        run: |
          set -euo pipefail
          test -n "${SWA_CLI_DEPLOYMENT_TOKEN:-}"
          swa deploy ./.rc1000_diagnostics_testservice \
            --api-location ./api \
            --swa-config-location ./.rc1000_diagnostics_testservice \
            --api-language node \
            --api-version 20 \
            --env testservice

      - name: TESTSERVICE live verifizieren
        shell: bash
        env:
          TEST_URL: https://wonderful-forest-0f315e310-testservice.centralus.7.azurestaticapps.net
        run: |
          set -euo pipefail
          root_file="$(mktemp)"; pickup_file="$(mktemp)"; api_file="$(mktemp)"
          trap 'rm -f "$root_file" "$pickup_file" "$api_file"' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            root_code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o "$root_file" -w '%{http_code}' "$TEST_URL/?rc1000diag=$GITHUB_SHA-$attempt" || true)"
            pickup_code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o "$pickup_file" -w '%{http_code}' "$TEST_URL/pickup.html?rc1000diag=$GITHUB_SHA-$attempt" || true)"
            api_code="$(curl -sS --connect-timeout 5 --max-time 20 -H 'Accept: application/json' -o "$api_file" -w '%{http_code}' "$TEST_URL/api/exporthub-auth-probe?rc1000diag=$GITHUB_SHA-$attempt" || true)"
            echo "Versuch $attempt: root=$root_code pickup=$pickup_code api=$api_code"
            if [[ "$root_code" == 200 && "$pickup_code" == 200 && "$api_code" == 200 ]] \
              && grep -q 'exporthub-rc1000-diagnostics-guard' "$root_file" \
              && grep -q 'Abholung bestätigen' "$pickup_file"; then
              node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(d.ok!==true)process.exit(1)' "$api_file"
              ready=1
              break
            fi
            sleep 10
          done
          [[ "$ready" == 1 ]]
          echo 'RC1000 Diagnose-Reparatur auf TESTSERVICE live verifiziert.'
