name: RC1007 Main Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'demo.html'
      - 'production-version.js'
      - 'api/**'
      - 'assets/**'
      - 'android-app/**'
      - 'test/**'
      - '.github/rc1000/**'
      - '.github/rc1001/**'
      - '.github/rc1002/**'
      - '.github/rc1003/**'
      - '.github/rc1005/**'
      - '.github/rc1007/**'
      - '.github/rc997/diagnostic-notifications-contract.test.mjs'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: rc1007-main-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: RC1007 Release-Vertrag
        run: node --test test/rc1007-three-env-sync.test.mjs test/rc1007-iso-sop-contract.test.mjs test/rc1007-sop-model.test.mjs test/rc1007-sop-catalog.test.mjs test/rc1007-sop-visuals.test.mjs test/rc1007-sop-ui.test.mjs test/rc1007-sop-workflow.test.mjs test/rc1007-sop-print-mobile.test.mjs test/rc1005-e3-packaging-dimensions.test.mjs test/rc1005-e3-packaging-precedence.test.mjs
      - name: RC1003 Android-Regression
        run: node --test test/rc1003-android-native-direct-open.test.mjs test/rc1003-three-env-sync.test.mjs
      - name: Aufgaben-Verträge
        run: node --test test/rc1002-task-groups.test.mjs test/rc1001-task-tiles-cleanup.test.mjs
      - name: QR-Abholung Regression
        run: node --test .github/rc1000/rc1000-production-pickup.test.mjs
      - name: Diagnose- und Android-Regression
        shell: bash
        run: |
          node --test --test-name-pattern='Fehlerdiagnose besitzt|Website-App-Brücke|Tipp auf Diagnose-Benachrichtigung|veraltete MainActivity' .github/rc997/diagnostic-notifications-contract.test.mjs
      - name: Gesamte Node-Regression
        run: npm test
      - name: Drei-Umgebungen-Build
        run: node .github/rc1007/build-three-env.mjs
      - name: RC1007 Build-Ergebnis prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ExportHUB RC1007 environment=production-candidate' dist-rc1007/index.html
          grep -q 'ExportHUB RC1007 environment=testservice' dist-rc1007/TESTVERSION.html
          grep -q 'ExportHUB RC1007 environment=demo' dist-rc1007/demo.html
          grep -q "version:'RC1007'" dist-rc1007/index.html
          grep -q "version:'RC1007'" dist-rc1007/TESTVERSION.html
          grep -q "version:'RC1007'" dist-rc1007/demo.html
          grep -q 'assets/sop/rc1007-sop-catalog.js' dist-rc1007/index.html
          grep -q 'assets/sop/rc1007-sop-catalog.js' dist-rc1007/TESTVERSION.html
          grep -q 'assets/sop/rc1007-sop-catalog.js' dist-rc1007/demo.html
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1007'" production-version.js
          git diff --check
