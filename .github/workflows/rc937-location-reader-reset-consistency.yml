name: RC937 Standort-Leser und Kundenwechsel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc937-location-reader-reset-consistency.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rc937-location-reader-reset-consistency
  cancel-in-progress: false

jobs:
  patch_verify_deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED – RC936 muss die letzten Alias-Lücken noch zeigen
        id: red
        continue-on-error: true
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text = Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC936',cache:'936',loginReturn:'/TESTVERSION.html?v=936'" in text, 'Basis ist nicht exakt RC936.'
          assert "direct=q(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId||nested&&" in text
          assert "var address=cleanAddress(sh&&(sh.recipientAddress||sh.deliveryAddress||sh.destinationAddress)),selected=q(sh&&(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId)),needsSelection=" in text
          assert "var previousLocation=q(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId||sh.location)," in text
          assert "sh.locationId='';sh.selectedLocationId='';sh.siteId='';sh.destinationId='';sh.location='';sh.site='';sh.standort='';sh.locationName='';sh.destinationName='';" in text
          assert "sh.recipientAddress=q(c.address||c.recipientAddress||c.deliveryAddress);sh.deliveryAddress=sh.recipientAddress;sh.destinationAddress=sh.recipientAddress;" in text
          PY

      - name: RED-Ergebnis verifizieren
        shell: bash
        env:
          RED_OUTCOME: ${{ steps.red.outcome }}
        run: |
          if [[ "$RED_OUTCOME" != "failure" ]]; then
            echo "Der RED-Test ist nicht wie erwartet fehlgeschlagen. RC936 wird nicht verändert."
            exit 1
          fi
          echo "RED bestätigt: Die bekannten Leser-/Reset-Lücken sind im aktuellen RC936 reproduzierbar."

      - name: RC937 direkt in den bestehenden Funktionen korrigieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('TESTVERSION.html')
          text = p.read_text(encoding='utf-8')

          def replace_once(src, old, new, label):
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: erwartete genau 1 Fundstelle, gefunden {count}. Abbruch ohne unsicheren Patch.')
              return src.replace(old, new, 1)

          text = replace_once(
              text,
              "version:'RC936',cache:'936',loginReturn:'/TESTVERSION.html?v=936'",
              "version:'RC937',cache:'937',loginReturn:'/TESTVERSION.html?v=937'",
              'BUILD-Version'
          )

          marker = "changes:Object.freeze([\n"
          if text.count(marker) != 1:
              raise SystemExit('Release-Changes-Anker ist nicht eindeutig.')
          note = "    'RC937 vereinheitlicht die letzten Standort-Leser und den Kundenwechsel: destinationId wird bei Erkennung und Anzeige berücksichtigt; beim Kundenwechsel werden selectedLocationId sowie Liefer- und Zieladresse ohne Altlasten zurückgesetzt.',\n"
          text = text.replace(marker, marker + note, 1)

          # savedLocationId direkt reparieren.
          start = text.find('function savedLocationId(sh,list){')
          end = text.find('function restoreSavedLocation(', start)
          if start < 0 or end < 0:
              raise SystemExit('savedLocationId-Block wurde nicht eindeutig gefunden.')
          block = text[start:end]
          block2 = replace_once(
              block,
              "direct=q(sh.locationId||sh.selectedLocationId||sh.siteId||nested&&",
              "direct=q(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId||nested&&",
              'savedLocationId destinationId'
          )
          text = text[:start] + block2 + text[end:]

          # Empfängeranzeige direkt reparieren.
          start = text.find('function renderRecipientAddress(')
          end = text.find('function applyLocation(id)', start)
          if start < 0 or end < 0:
              raise SystemExit('renderRecipientAddress-Block wurde nicht eindeutig gefunden.')
          block = text[start:end]
          block2 = replace_once(
              block,
              "var address=cleanAddress(sh&&sh.recipientAddress),selected=q(sh&&(sh.locationId||sh.selectedLocationId||sh.siteId)),needsSelection=",
              "var address=cleanAddress(sh&&(sh.recipientAddress||sh.deliveryAddress||sh.destinationAddress)),selected=q(sh&&(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId)),needsSelection=",
              'renderRecipientAddress Alias-Leser'
          )
          text = text[:start] + block2 + text[end:]

          # Den bestehenden RC565-Kundenwechsel anhand seiner eindeutigen bisherigen Standortzeile isolieren.
          old_prev = "cancelFresh(sh);var previousLocation=q(sh.locationId||sh.siteId||sh.destinationId||sh.location),"
          anchor = text.find(old_prev)
          if anchor < 0 or text.find(old_prev, anchor + 1) >= 0:
              raise SystemExit('applyCustomer-Kundenwechsel ist nicht eindeutig auffindbar.')
          start = text.rfind('function applyCustomer(sh,c){', 0, anchor + 1)
          end = text.find('function define(name,fn)', anchor)
          if start < 0 or end < 0 or not (start < anchor < end):
              raise SystemExit('applyCustomer-Blockgrenzen konnten nicht sicher bestimmt werden.')
          block = text[start:end]
          block = replace_once(
              block,
              "var previousLocation=q(sh.locationId||sh.siteId||sh.destinationId||sh.location),",
              "var previousLocation=q(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId||sh.location),",
              'applyCustomer previousLocation'
          )
          block = replace_once(
              block,
              "sh.locationId='';sh.siteId='';sh.destinationId='';sh.location='';sh.site='';sh.standort='';sh.destinationName='';",
              "sh.locationId='';sh.selectedLocationId='';sh.siteId='';sh.destinationId='';sh.location='';sh.site='';sh.standort='';sh.locationName='';sh.destinationName='';",
              'applyCustomer Standort-Reset'
          )
          block = replace_once(
              block,
              "sh.recipientAddress=q(c.address||c.recipientAddress||c.deliveryAddress);",
              "sh.recipientAddress=q(c.address||c.recipientAddress||c.deliveryAddress);sh.deliveryAddress=sh.recipientAddress;sh.destinationAddress=sh.recipientAddress;",
              'applyCustomer Adress-Reset'
          )
          text = text[:start] + block + text[end:]

          p.write_text(text, encoding='utf-8')
          PY

      - name: GREEN – RC937 Alias-Konsistenz vollständig prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text = Path('TESTVERSION.html').read_text(encoding='utf-8')

          assert "version:'RC937',cache:'937',loginReturn:'/TESTVERSION.html?v=937'" in text
          assert "version:'RC936',cache:'936',loginReturn:'/TESTVERSION.html?v=936'" not in text
          assert "RC937 vereinheitlicht die letzten Standort-Leser und den Kundenwechsel" in text

          assert "direct=q(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId||nested&&" in text
          assert "var address=cleanAddress(sh&&(sh.recipientAddress||sh.deliveryAddress||sh.destinationAddress)),selected=q(sh&&(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId)),needsSelection=" in text
          assert "var previousLocation=q(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId||sh.location)," in text
          assert "sh.locationId='';sh.selectedLocationId='';sh.siteId='';sh.destinationId='';sh.location='';sh.site='';sh.standort='';sh.locationName='';sh.destinationName='';" in text
          assert "sh.recipientAddress=q(c.address||c.recipientAddress||c.deliveryAddress);sh.deliveryAddress=sh.recipientAddress;sh.destinationAddress=sh.recipientAddress;" in text

          # Der bereits korrekte zentrale Schreiber darf nicht regressieren.
          assert "function applyLocation(sh,l){if(!sh||!l)return;sh.locationId=l.id;sh.selectedLocationId=l.id;sh.siteId=l.id;sh.destinationId=l.id;" in text
          assert "if(address){sh.recipientAddress=address;sh.deliveryAddress=address;sh.destinationAddress=address}" in text

          # Die drei alten Muster müssen aus den betroffenen Funktionen verschwunden sein.
          assert "direct=q(sh.locationId||sh.selectedLocationId||sh.siteId||nested&&" not in text
          assert "var address=cleanAddress(sh&&sh.recipientAddress),selected=q(sh&&(sh.locationId||sh.selectedLocationId||sh.siteId)),needsSelection=" not in text
          assert "cancelFresh(sh);var previousLocation=q(sh.locationId||sh.siteId||sh.destinationId||sh.location)," not in text
          print('GREEN: RC937 Standort-Leser und Kundenwechsel konsistent.')
          PY

      - name: Diff und Dateiintegrität prüfen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          grep -m1 -oE "version:'RC[0-9]+'" TESTVERSION.html

      - name: RC937 nach main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          if git diff --cached --quiet; then
            echo "Keine Änderung erzeugt – Abbruch."
            exit 1
          fi
          git commit -m "RC937 Standort-Leser und Kundenwechsel vereinheitlichen"
          git push origin HEAD:main

      - name: Temporären RC937-Workflow wieder entfernen
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm .github/workflows/rc937-location-reader-reset-consistency.yml
          git commit -m "RC937 temporären Patch-Workflow entfernen"
          git push origin HEAD:main

      - name: Bestehenden TESTSERVICE-Deploy für RC937 auslösen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload='{"ref":"main"}'
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/exporthub-testservice-final-artifact-fix.yml/dispatches" \
            -d "$payload")"
          cat /tmp/dispatch.out || true
          if [[ "$code" != "204" ]]; then
            echo "Workflow-Dispatch fehlgeschlagen: HTTP $code"
            exit 1
          fi
          echo "TESTSERVICE-Deploy für RC937 wurde ausgelöst."
