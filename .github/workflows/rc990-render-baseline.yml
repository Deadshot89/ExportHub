name: RC990 Render Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - rc990-large-ux
    paths:
      - .github/workflows/rc990-render-baseline.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated RC990 branch
        uses: actions/checkout@v4
        with:
          ref: rc990-large-ux

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Record untouched TESTVERSION identity
        shell: bash
        run: |
          node --version
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TESTVERSION_BLOB=$(git hash-object TESTVERSION.html)"
          git status --short

      - name: Verify RC973 and RC975 on untouched branch
        run: node --test test/rc973-long-text-autogrow.test.mjs test/rc975-global-render-integrity.test.mjs

      - name: Print script-integrity context on failure
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import re
          html = Path('TESTVERSION.html').read_text(encoding='utf-8')
          for token in ['NO_PALLET', 'BULK_PALLET', 'printStow']:
              positions = [m.start() for m in re.finditer(token, html)]
              print(f'{token}: {len(positions)} occurrence(s), first={positions[:10]}')
              for pos in positions[:5]:
                  lo=max(0,pos-700); hi=min(len(html),pos+1200)
                  print(f'--- {token} at {pos} ---')
                  print(repr(html[lo:hi]))
