name: RC975 Global Render Integrity

on:
  push:
    branches: [main]
    paths:
      - 'TESTVERSION.html'
      - 'test/rc971-global-form-field-standard.test.mjs'
      - 'test/rc972-field-exception-audit.test.mjs'
      - 'test/rc973-long-text-autogrow.test.mjs'
      - 'test/rc975-global-render-integrity.test.mjs'
      - '.github/workflows/rc975-global-render-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: RC971 bis RC975 komplette Feld- und Renderintegrität
        run: node --test test/rc971-global-form-field-standard.test.mjs test/rc972-field-exception-audit.test.mjs test/rc973-long-text-autogrow.test.mjs test/rc975-global-render-integrity.test.mjs
