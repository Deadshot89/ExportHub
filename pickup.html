<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Abholbestätigung</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#0f172a;background:#eef6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(5,184,255,.20),transparent 35%),#eef6fb;padding:18px}.wrap{min-height:calc(100vh - 36px);display:grid;place-items:center}.card{width:min(680px,100%);background:#fff;border:1px solid #dbe4ef;border-radius:28px;box-shadow:0 22px 60px rgba(15,23,42,.17);padding:24px}.brand{font-size:13px;font-weight:1000;letter-spacing:.08em;color:#075985}.card h1{font-size:28px;color:#08245d;margin:8px 0 18px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid #bfdbfe;background:#eff6ff;border-radius:16px;padding:12px}.box span{display:block;font-size:11px;font-weight:900;color:#475569;text-transform:uppercase}.box strong{display:block;font-size:18px;margin-top:4px;word-break:break-word}.msg{border-radius:15px;padding:12px;margin:13px 0;font-weight:800;line-height:1.45}.info{background:#eff6ff;border-left:5px solid #2563eb}.ok{background:#dcfce7;border-left:5px solid #16a34a;color:#166534}.bad{background:#fee2e2;border-left:5px solid #dc2626;color:#991b1b}label{display:block;font-weight:900;margin:16px 0 8px}input[type=text],input[type=number],input[type=file]{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:13px;font:inherit;background:#fff}.pin{font-size:28px;letter-spacing:.22em;text-align:center}.pallet-box{border:1px solid #fdba74;background:#fff7ed;border-radius:16px;padding:13px;margin:14px 0}.pallet-box strong{display:block;color:#7c2d12;font-size:19px}.pallet-box label{margin:12px 0 6px}.pallet-box input{font-size:22px;font-weight:900;text-align:center}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:14px;padding:12px 16px;font:900 16px Segoe UI,Arial,sans-serif;cursor:pointer}.primary{background:linear-gradient(135deg,#2563eb,#05b8ff);color:#fff}.ghost{background:#fff;border:1px solid #cbd5e1;color:#334155}.pod{border:1px solid #dbeafe;background:#f8fbff;border-radius:13px;padding:9px;margin:7px 0;font-weight:800}.small{font-size:12px;color:#64748b;line-height:1.4}.hidden{display:none!important}@media(max-width:620px){body{padding:10px}.card{padding:17px;border-radius:20px}.meta{grid-template-columns:1fr}.card h1{font-size:23px}}
</style>
</head>
<body><main class="wrap"><section class="card" id="app"><div class="brand">ESSENTRA · Sichere Abholbestätigung</div><h1>Abholbestätigung</h1><div class="msg info">Sichere Verbindung wird geprüft …</div></section></main>
<script>
(function(){
'use strict';
var API='/api';
function Q(v){return String(v==null?'':v).trim()}
function H(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function token(){try{return Q(new URLSearchParams(location.search).get('token'))}catch(e){return ''}}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Content-Type':'application/json','Accept':'application/json'},opt.headers||{});return fetch(API+path,opt).then(async function(r){var b={};try{b=await r.json()}catch(e){}if(!r.ok){var er=new Error(b.message||b.error||('HTTP '+r.status));er.status=r.status;er.code=Q(b.code);er.body=b;throw er}return b})}
function shell(inner){return '<div class="brand">ESSENTRA · Sichere Abholbestätigung</div><h1>Abholbestätigung</h1>'+inner}
function palletFields(st){var out=Math.max(0,Number(st.palletOutgoingCount||0));if(!out)return '';return '<div class="pallet-box"><span class="small">Palettentausch · Konto '+H((st.palletAccountType||'')+': '+(st.palletAccountName||''))+'</span><strong>Ausgehende Europaletten: '+out+'</strong><label for="returnedPallets">Beim Tausch zurückerhaltene Europaletten</label><input id="returnedPallets" type="number" inputmode="numeric" min="0" step="1" value="0"></div>'}
function renderOpen(st,msg,kind){var app=document.getElementById('app');app.innerHTML=shell('<div class="meta"><div class="box"><span>Referenz</span><strong>'+H(st.reference||'')+'</strong></div><div class="box"><span>Kunde / Empfänger</span><strong>'+H(st.customer||st.recipient||'')+'</strong></div></div>'+palletFields(st)+(msg?'<div class="msg '+(kind||'info')+'">'+H(msg)+'</div>':'')+'<label for="pin">PIN eingeben</label><input id="pin" class="pin" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]*" placeholder="••••"><div class="actions"><button class="primary" data-action="confirm">Abholung bestätigen</button></div>');app._st=st}
function renderConfirmedSession(st,msg){var app=document.getElementById('app');app.innerHTML=shell('<div class="msg ok">'+H(msg||'Abholung wurde erfolgreich bestätigt.')+'<br>Der QR-Code ist ab jetzt dauerhaft gesperrt.</div><h2>Optional: POD-Fotos hochladen</h2><p class="small">Dieser Upload ist nur in dieser bereits geöffneten Sitzung möglich. Nach Aktualisieren oder erneutem Scan bleibt der QR-Code gesperrt.</p><input id="files" type="file" accept="image/*" capture="environment" multiple><div class="actions"><button class="primary" data-action="upload">POD als PDF speichern</button></div>');app._st=st;app._confirmedSession=true}
function renderLocked(message){var app=document.getElementById('app');app.innerHTML=shell('<div class="msg bad">'+H(message||'Dieser QR-Code wurde bereits verwendet und ist dauerhaft gesperrt.')+'</div><p class="small">Es werden keine Sendungs-, Kunden- oder POD-Daten angezeigt.</p>');app._st=null;app._confirmedSession=false}
var activationRetries=0;
function load(msg,kind){var t=token(),app=document.getElementById('app');if(!t){renderLocked('Der QR-Code ist ungültig.');return}api('/pickup-status?token='+encodeURIComponent(t),{method:'GET',headers:{'Accept':'application/json'}}).then(function(st){activationRetries=0;st.token=t;renderOpen(st,msg,kind)}).catch(function(e){if(e.status===404&&activationRetries<10){activationRetries++;app.innerHTML=shell('<div class="msg info">Der QR-Code wird noch aktiviert. Neuer Versuch '+activationRetries+' / 10 …</div>');setTimeout(function(){load(msg,kind)},2000);return}if(e.status===410&&e.code==='USED'){renderLocked('Dieser QR-Code wurde bereits verwendet und ist dauerhaft gesperrt.');return}if(e.status===410&&e.code==='CANCELLED'){renderLocked('Diese Sendung ist storniert. Der QR-Code ist derzeit gesperrt.');return}if(e.status===410){renderLocked('Dieser QR-Code ist abgelaufen und nicht mehr verwendbar.');return}if(e.status===404){renderLocked('Dieser QR-Code ist noch nicht aktiviert.');return}renderLocked('Der Abholdienst ist derzeit nicht erreichbar.')})}
function confirm(){var app=document.getElementById('app'),st=app._st||{},pin=Q((document.getElementById('pin')||{}).value),out=Math.max(0,Number(st.palletOutgoingCount||0)),retEl=document.getElementById('returnedPallets'),returned=retEl?Number(retEl.value||0):0;if(!/^\d{4}$/.test(pin)){renderOpen(st,'Bitte die vierstellige PIN eingeben.','bad');return}if(!Number.isInteger(returned)||returned<0){renderOpen(st,'Bitte bei den zurückerhaltenen Europaletten eine ganze Zahl ab 0 eingeben.','bad');return}if(returned>out&&out>0&&!window.confirm('Die Rückgabemenge ist höher als die Ausgangsmenge. Trotzdem bestätigen?')){return}api('/pickup-confirm',{method:'POST',body:JSON.stringify({token:st.token,pin:pin,returnedPallets:returned})}).then(function(r){try{sessionStorage.setItem('ehPickupKey:'+st.token,r.uploadKey||'')}catch(e){}st.confirmedAt=r.confirmedAt||new Date().toISOString();var text='Abholung wurde mit Datum und Uhrzeit gespeichert. Der Scan wurde als POD-Nachweis angelegt.';if(Number(r.palletOutgoingCount||0)>0)text+=' Paletten: '+r.palletOutgoingCount+' Ausgang, '+Number(r.palletReturnedCount||0)+' Eingang.';renderConfirmedSession(st,text)}).catch(function(e){if(e.status===409){renderLocked('Dieser QR-Code wurde bereits verwendet und ist dauerhaft gesperrt.');return}renderOpen(st,e.status===423?'Zu viele falsche Eingaben. Bitte später erneut versuchen.':e.status===401?'Die PIN ist nicht korrekt.':'Die Bestätigung konnte nicht gespeichert werden.','bad')})}
function fileData(file){return new Promise(function(resolve,reject){var img=new Image(),url=URL.createObjectURL(file);img.onload=function(){try{var max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);var raw=c.toDataURL('image/jpeg',.82).split(',')[1];URL.revokeObjectURL(url);resolve({name:file.name.replace(/\.[^.]+$/,'.jpg'),type:'image/jpeg',dataBase64:raw,size:Math.ceil(raw.length*.75)})}catch(e){reject(e)}};img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('Bild konnte nicht gelesen werden'))};img.src=url})}
function upload(){var app=document.getElementById('app'),st=app._st||{},input=document.getElementById('files'),files=input&&input.files?Array.from(input.files).slice(0,6):[],key='';try{key=sessionStorage.getItem('ehPickupKey:'+st.token)||''}catch(e){}if(!files.length){renderConfirmedSession(st,'Bitte mindestens ein Foto auswählen.');return}if(!key){renderLocked('Die einmalige Upload-Freigabe ist abgelaufen.');return}Promise.all(files.map(fileData)).then(function(images){return api('/pickup-pod',{method:'POST',body:JSON.stringify({token:st.token,uploadKey:key,images:images})})}).then(function(){renderConfirmedSession(st,'POD-Fotos wurden als PDF gespeichert. Der QR-Code bleibt dauerhaft gesperrt.')}).catch(function(e){if(e.status===401){renderLocked('Die einmalige Upload-Freigabe ist abgelaufen.');return}renderConfirmedSession(st,'Der POD-Upload ist fehlgeschlagen.')})}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-action]');if(!b)return;e.preventDefault();b.disabled=true;if(b.dataset.action==='confirm')confirm();else upload()});
load();
})();
</script></body></html>
