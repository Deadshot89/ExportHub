name: RC973 Layout Audit Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc973-layout-audit-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Relevante Layoutregeln extrahieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          targets=[
            'index218Planner','rc363BlockColli','rc573ColliCard','rc363BlockDocuments','rc899-doc-main',
            'rc896','workspace','dashboard','customer','kunden','documents'
          ]
          print('BUILD:', re.search(r"var BUILD=Object\.freeze\(\{version:'(RC\d+)'", text).group(1))
          print('\n=== TARGET OCCURRENCES / CONTEXT ===')
          lower=text.lower()
          seen=set()
          for target in targets:
            start=0
            count=0
            while True:
              pos=lower.find(target.lower(),start)
              if pos<0: break
              key=(target,pos//400)
              start=pos+len(target)
              if key in seen: continue
              seen.add(key); count+=1
              a=max(0,pos-350); b=min(len(text),pos+700)
              snippet=text[a:b].replace('\n',' ')
              print(f'\n--- {target} #{count} @ {pos} ---')
              print(snippet[:1050])
              if count>=12: break

          print('\n=== CSS RULES WITH TARGET + LAYOUT PROPERTIES ===')
          for m in re.finditer(r'([^{}]{1,500})\{([^{}]{0,1400})\}', text):
            sel=m.group(1).strip(); body=m.group(2).strip()
            hay=(sel+' '+body).lower()
            if any(t.lower() in hay for t in targets) and any(p in body.lower() for p in ['min-height','height:','gap:','padding:','grid-auto-rows','align-items','margin:']):
              print('\n'+sel[-500:]+' {'+body[:1400]+'}')
          PY
