name: TaskPlannerPro V2 Branch Verification

on:
  push:
    branches:
      - taskplannerpro/v2-design
      - taskplannerpro/v2-task5
      - taskplannerpro/v2-task6
      - taskplannerpro/v2-task7
      - taskplannerpro/v2-task8
      - taskplannerpro/v2-task9
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskplanner-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Install root dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prepare TaskPlanner V2 branch artifacts
        run: |
          node scripts/taskplanner-v2-pretest.mjs
          node scripts/taskplanner-v2-cutover-pretest.mjs
          node scripts/taskplanner-v2-i18n-pretest.mjs
          node scripts/taskplanner-v2-planner-i18n-pretest.mjs
          node scripts/taskplanner-v2-workflow-i18n-pretest.mjs
          node scripts/taskplanner-v2-projection-i18n-pretest.mjs
      - name: TaskPlanner V2 RED-GREEN contracts
        run: |
          node --test --test-concurrency=1 \
            test/taskplanner-v2-core.test.mjs \
            test/taskplanner-v2-migration.test.mjs \
            test/taskplanner-v2-compat.test.mjs \
            test/taskplanner-v2-state-rights.test.mjs \
            test/taskplanner-v2-build-wiring.test.mjs \
            test/taskplanner-v2-api-backup-wiring.test.mjs \
            test/taskplanner-v2-pretest-orchestration.test.mjs \
            test/taskplanner-v2-recurrence.test.mjs \
            test/taskplanner-v2-calendar.test.mjs \
            test/taskplanner-v2-lifecycle-recurrence.test.mjs \
            test/taskplanner-v2-lifecycle-workflow-owner.test.mjs \
            test/taskplanner-v2-planner.test.mjs \
            test/taskplanner-v2-runtime-bridge.test.mjs \
            test/taskplanner-v2-task-ui.test.mjs \
            test/taskplanner-v2-reminders.test.mjs \
            test/taskplanner-v2-i18n.test.mjs \
            test/taskplanner-v2-planner-ui.test.mjs \
            test/taskplanner-v2-planner-i18n.test.mjs \
            test/taskplanner-v2-workflow.test.mjs \
            test/taskplanner-v2-workflow-bindings.test.mjs \
            test/taskplanner-v2-public-link.test.mjs \
            test/taskplanner-v2-public-link-ui.test.mjs \
            test/taskplanner-v2-dnd-runtime-owner.test.mjs \
            test/taskplanner-v2-projections.test.mjs \
            test/taskplanner-v2-performance.test.mjs \
            test/taskplanner-v2-projection-integration.test.mjs \
            test/taskplanner-v2-projection-i18n.test.mjs \
            test/taskplanner-v2-release.test.mjs
      - name: Existing task regressions
        run: |
          node --test --test-concurrency=1 \
            test/rc1014-task-lifecycle.test.mjs \
            test/rc1014-task-runtime-integration.test.mjs \
            test/rc1054-task-shared-source.test.mjs
      - name: Planner drag hotpath regressions
        run: |
          node --test --test-concurrency=1 \
            test/rc994-drag-performance.test.mjs \
            .github/rc996/tasks-contract.test.mjs
      - name: State write guard regression
        run: node --test --test-concurrency=1 test/rc1490-state-module-write-guard.test.mjs
      - name: TaskPlanner V2 locale audit
        run: npm run i18n:audit:strict
      - name: Public link release-hardening contracts
        run: |
          node --test --test-concurrency=1 \
            test/taskplanner-v2-public-link.test.mjs \
            test/taskplanner-v2-public-link-ui.test.mjs \
            test/rc1088-release-hardening.test.mjs
      - name: Full repository regression
        run: npm test
