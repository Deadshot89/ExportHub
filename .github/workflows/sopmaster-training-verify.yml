name: SOPMaster Training Verify

on:
  push:
    branches:
      - design/sopmaster-training-tour-2026-10-12
    paths:
      - 'assets/sop/rc1503-sop-*'
      - 'assets/sop/rc1501-sop-tour-ui.js'
      - 'assets/sop/rc1501-sop-tour-runtime.js'
      - 'api/shared/merge.js'
      - 'test/rc1503-sop-*.test.mjs'
      - 'e2e/specs/sopmaster-training-exam.spec.mjs'
      - 'e2e/helpers/exporthub-browser.mjs'
      - 'playwright.config.mjs'
      - '.github/rc1503/**'
      - '.github/workflows/sopmaster-training-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sopmaster-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1503 training contracts
        run: node --test test/rc1503-sop-*.test.mjs
      - name: Accessibility regression
        run: npm run test:accessibility

  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Full Node regression
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-regression.log
      - name: Upload Node regression log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc1503-node-regression-log
          path: node-regression.log
          if-no-files-found: error

  browser-e2e:
    needs: training-contract
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Build RC1503 demo package
        run: node .github/rc1503/build-three-env.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium
      - name: Verify isolated training and exam flows on desktop and mobile
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_ENTRY: '/demo.html'
        run: npx playwright test e2e/specs/sopmaster-training-exam.spec.mjs --project=desktop --project=mobile-standard
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sopmaster-rc1503-browser-debug
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
