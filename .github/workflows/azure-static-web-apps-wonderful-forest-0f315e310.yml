name: ExportHUB RC1007 Drei-Umgebungen Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'demo.html'
      - 'production-version.js'
      - 'pickup.html'
      - 'customer-avis.html'
      - 'location.html'
      - 'pod-notfall.html'
      - 'assets/**'
      - 'api/**'
      - 'staticwebapp.config.json'
      - 'staticwebapp.testservice.config.json'
      - '.github/rc1007/**'
      - 'test/rc1007-*.test.mjs'
      - '.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml'
permissions:
  contents: read
concurrency:
  group: exporthub-rc1007-three-env-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: RC1007 Freigabevertrag prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1007'" production-version.js
          node --test test/rc1007-three-env-sync.test.mjs test/rc1007-iso-sop-contract.test.mjs test/rc1007-sop-model.test.mjs test/rc1007-sop-catalog.test.mjs test/rc1007-sop-visuals.test.mjs test/rc1007-sop-ui.test.mjs test/rc1007-sop-workflow.test.mjs test/rc1007-sop-print-mobile.test.mjs
          npm test
      - name: RC1007 Produktion TESTSERVICE und Demo gemeinsam bauen
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1007/build-three-env.mjs
          grep -q 'ExportHUB RC1007 environment=production-candidate' dist-rc1007/index.html
          grep -q 'ExportHUB RC1007 environment=testservice' dist-rc1007/TESTVERSION.html
          grep -q 'ExportHUB RC1007 environment=demo' dist-rc1007/demo.html
          grep -q "version:'RC1007'" dist-rc1007/index.html
          grep -q "version:'RC1007'" dist-rc1007/TESTVERSION.html
          grep -q "version:'RC1007'" dist-rc1007/demo.html
          grep -q 'assets/sop/rc1007-sop-catalog.js' dist-rc1007/index.html
          grep -q 'assets/sop/rc1007-sop-catalog.js' dist-rc1007/TESTVERSION.html
          grep -q 'assets/sop/rc1007-sop-catalog.js' dist-rc1007/demo.html
      - name: Gemeinsame Deploy-Pakete vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rc1007_production_app .rc1007_testservice_app
          mkdir -p .rc1007_production_app .rc1007_testservice_app

          for dir in .rc1007_production_app .rc1007_testservice_app; do
            cp pickup.html customer-avis.html location.html pod-notfall.html production-version.js "$dir/"
            cp -R assets "$dir/assets"
          done

          cp staticwebapp.config.json .rc1007_production_app/staticwebapp.config.json
          cp dist-rc1007/index.html .rc1007_production_app/index.html
          cp dist-rc1007/assets/exporthub-environment-hub.js .rc1007_production_app/assets/exporthub-environment-hub.js
          cp dist-rc1007/assets/exporthub-demo-bootstrap.js .rc1007_production_app/assets/exporthub-demo-bootstrap.js

          cp staticwebapp.testservice.config.json .rc1007_testservice_app/staticwebapp.config.json
          cp dist-rc1007/TESTVERSION.html .rc1007_testservice_app/index.html
          cp dist-rc1007/TESTVERSION.html .rc1007_testservice_app/TESTVERSION.html
          cp dist-rc1007/demo.html .rc1007_testservice_app/demo.html
          cp dist-rc1007/assets/exporthub-environment-hub.js .rc1007_testservice_app/assets/exporthub-environment-hub.js
          cp dist-rc1007/assets/exporthub-demo-bootstrap.js .rc1007_testservice_app/assets/exporthub-demo-bootstrap.js
      - name: Deploy ExportHUB production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1007_production_app
          api_location: api
          output_location: ''
          skip_app_build: true
      - name: Deploy ExportHUB TESTSERVICE
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1007_testservice_app
          api_location: api
          output_location: ''
          skip_app_build: true
          deployment_environment: testservice
      - name: Live RC1007 Produktion TESTSERVICE und Demo prüfen
        shell: bash
        run: |
          set -euo pipefail
          prod='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          testservice='https://wonderful-forest-0f315e310-testservice.centralus.7.azurestaticapps.net'
          p=$(mktemp); t=$(mktemp); d=$(mktemp); ph=$(mktemp); th=$(mktemp)
          trap 'rm -f "$p" "$t" "$d" "$ph" "$th"' EXIT
          for attempt in {1..24}; do
            pc=$(curl -sS -L -o "$p" -w '%{http_code}' --max-time 20 "$prod/?rc1007=$GITHUB_SHA-$attempt" || true)
            tc=$(curl -sS -L -o "$t" -w '%{http_code}' --max-time 20 "$testservice/TESTVERSION.html?rc1007=$GITHUB_SHA-$attempt" || true)
            dc=$(curl -sS -L -o "$d" -w '%{http_code}' --max-time 20 "$testservice/demo.html?rc1007=$GITHUB_SHA-$attempt" || true)
            phc=$(curl -sS -o "$ph" -w '%{http_code}' --max-time 20 "$prod/api/exporthub-health" || true)
            thc=$(curl -sS -o "$th" -w '%{http_code}' --max-time 20 "$testservice/api/exporthub-health" || true)
            if [[ "$pc" == '200' && "$tc" == '200' && "$dc" == '200' && "$phc" == '200' && "$thc" == '200' ]] \
              && grep -q 'ExportHUB RC1007 environment=production-candidate' "$p" \
              && grep -q 'ExportHUB RC1007 environment=testservice' "$t" \
              && grep -q 'ExportHUB RC1007 environment=demo' "$d" \
              && grep -q "version:'RC1007'" "$p" \
              && grep -q "version:'RC1007'" "$t" \
              && grep -q "version:'RC1007'" "$d" \
              && grep -q 'assets/sop/rc1007-sop-catalog.js' "$p" \
              && grep -q 'assets/sop/rc1007-sop-catalog.js' "$t" \
              && grep -q 'assets/sop/rc1007-sop-catalog.js' "$d"; then
              echo 'RC1007 Produktion, TESTSERVICE und Demo live auf gemeinsamem Stand bestätigt.'
              exit 0
            fi
            sleep 10
          done
          echo 'RC1007 Drei-Umgebungen-Liveprüfung nicht bestätigt.'
          exit 1
