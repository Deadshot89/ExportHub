<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExportHUB Testportal</title>
<style>
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eef6fb;color:#0f172a}body{min-height:100vh;display:grid;place-items:center}.box{width:min(620px,calc(100% - 36px));background:#fff;border:1px solid #d9e6f1;border-radius:28px;box-shadow:0 24px 70px rgba(15,44,80,.16);padding:34px;text-align:center}.mark{width:68px;height:68px;border-radius:22px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-weight:1000;font-size:25px}.bar{height:12px;border-radius:999px;background:#e7eef5;overflow:hidden;margin:24px 0 10px}.fill{height:100%;width:12%;background:linear-gradient(90deg,#dc2626,#f97316);transition:width .2s}.err{display:none;margin-top:16px;background:#fee2e2;color:#991b1b;border-radius:12px;padding:12px;white-space:pre-wrap}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}.actions button{border:0;border-radius:12px;padding:10px 16px;font-weight:900;cursor:pointer}.retry{background:#dc2626;color:#fff}.main{background:#fff;color:#334155;border:1px solid #cbd5e1!important}
</style></head>
<body><div class="box"><div class="mark">EH</div><h1>ExportHUB Testportal</h1><p id="msg">Aktive GitHub-Testversion wird ermittelt …</p><div class="bar"><div id="fill" class="fill"></div></div><strong id="pct">12 %</strong><div id="err" class="err"></div><div class="actions"><button id="retry" class="retry" style="display:none" onclick="location.reload()">Erneut versuchen</button><button class="main" onclick="location.href='/'">Zur Hauptseite</button></div></div>
<script>(function(){'use strict';var API='/api/exporthub-release',done=false;
function p(n,t){document.getElementById('fill').style.width=n+'%';document.getElementById('pct').textContent=n+' %';if(t)document.getElementById('msg').textContent=t}
function fail(t){p(100,'Testversion konnte nicht geladen werden');var e=document.getElementById('err');e.style.display='block';e.textContent=t||'Release-API nicht erreichbar.';document.getElementById('retry').style.display='inline-block'}
function removeScriptById(h,id){var re=new RegExp('<script[^>]+id=["\']'+id+'["\'][^>]*>[\s\S]*?<\/script>','ig');return h.replace(re,'')}
function sanitize(h){h=String(h||'');h=removeScriptById(h,'rc503-release-bootstrap');h=removeScriptById(h,'rc503-release-portal-controller');h=removeScriptById(h,'rc504-static-test-channel');return h}
function marker(v){return '<script>window.__EXPORTHUB_RELEASE_STREAMED__=true;window.__EXPORTHUB_RELEASE_CHANNEL__="test";window.__EXPORTHUB_RELEASE_VERSION__='+JSON.stringify(v)+';window.__EXPORTHUB_EXTERNAL_RELEASE_LOADER__=true;try{sessionStorage.setItem("exporthub_test_portal_requested","1")}catch(_){}<\/script>'}
function bridge(v){return '<style id="eh-external-test-style">html{scroll-padding-top:44px}body{padding-top:44px!important}#ehExternalTestRibbon{position:fixed;left:0;right:0;top:0;height:44px;z-index:3000;background:#dc2626;color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:950;box-shadow:0 2px 12px rgba(0,0,0,.18)}#ehExternalTestRibbon button{border:0;background:#fff;color:#991b1b;border-radius:10px;padding:7px 12px;font-weight:900;cursor:pointer}</style><script>(function(){"use strict";var V='+JSON.stringify(v)+';function q(x){return String(x==null?"":x).trim()}function low(x){return q(x).toLowerCase()}function current(){try{return (typeof window.__EXPORTHUB_GET_CURRENT_USER__==="function"&&window.__EXPORTHUB_GET_CURRENT_USER__())||(window.ExportHUBClean&&window.ExportHUBClean.runtime&&window.ExportHUBClean.runtime.user)||{}}catch(_){return{}}}function admin(u){var r=low(u&&(u.role||u.rolle||u.level||u.type)),n=low(u&&(u.user||u.login||u.username||u.name||u.displayName)),p=Array.isArray(u&&u.permissions)?u.permissions:[];return !!u&&(u.globalAdmin===true||u.isAdmin===true||u.admin===true||n==="tobias"||/global.?admin|administrator|vollzugriff|admin/.test(r)||p.indexOf("*")>=0)}function ribbon(){var r=document.getElementById("ehExternalTestRibbon");if(!r){r=document.createElement("div");r.id="ehExternalTestRibbon";r.innerHTML="<span>TESTPORTAL · LIVE-DATEN · "+V+"</span><button type=button>Zur Hauptseite</button>";document.body.appendChild(r);r.querySelector("button").onclick=function(){try{sessionStorage.removeItem("exporthub_test_portal_requested")}catch(_){}location.href="/"}}var old=document.getElementById("rc503TestRibbon");if(old)old.remove();var rel=document.querySelector("#nav button[data-index321-view=releasecenter]");if(rel&&admin(current())){rel.hidden=false;rel.style.removeProperty("display");rel.disabled=false;rel.setAttribute("aria-hidden","false")}var testBtn=document.getElementById("releaseTestPortalBtn");if(testBtn){testBtn.hidden=true;testBtn.style.display="none"}}function guard(){ribbon();var u=current(),name=q(u&&(u.user||u.login||u.username||u.name));if(!name)return;if(!admin(u)){alert("Das Testportal ist ausschließlich für Global Admin freigegeben.");location.replace("/")}}ribbon();window.addEventListener("exporthub:ready",guard);window.addEventListener("exporthub:rendered",ribbon);window.addEventListener("exporthub:viewchange",ribbon);setInterval(function(){if(document.visibilityState!=="hidden")guard()},5000)})();<\/script>'}
function inject(h,v){if(done)return;if(!/<html[\s>]/i.test(h))throw new Error('Ungültige GitHub-Testdatei.');done=true;h=sanitize(h);h=h.replace(/<head(\s[^>]*)?>/i,function(m,a){return '<head'+(a||'')+'>'+marker(v)});h=h.replace(/<\/body>/i,bridge(v)+'</body>');p(100,'Testversion '+v+' wird gestartet …');setTimeout(function(){document.open('text/html','replace');document.write(h);document.close()},10)}
async function get(url,accept){var r=await fetch(url,{credentials:'same-origin',cache:'no-store',headers:{Accept:accept||'application/json'}}),t=await r.text();if(!r.ok)throw new Error(t||('HTTP '+r.status));return t}
(async function(){try{p(30,'Teststatus wird geprüft …');var m=JSON.parse(await get(API+'?action=active&channel=test&_='+Date.now())),v=String(m.version||'').trim().toUpperCase();if(!v)throw new Error('Im Release-Center ist keine Testversion aktiviert.');p(58,'GitHub-Testversion '+v+' wird geladen …');var h=await get(API+'?action=html&channel=test&_='+Date.now(),'text/html');p(86,'Testoberfläche wird vorbereitet …');inject(h,v)}catch(e){fail(e.message)}})();})();</script></body></html>
