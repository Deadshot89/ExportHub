name: RC1000 TESTSERVICE Auth Diagnose

on:
  push:
    branches:
      - rc1000-clean-navigation-search
    paths:
      - '.github/workflows/rc1000-testservice-auth-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: TESTSERVICE Auth-Pfade prüfen
        shell: bash
        env:
          TEST_URL: https://wonderful-forest-0f315e310-testservice.centralus.7.azurestaticapps.net
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          probe_code="$(curl -sS --connect-timeout 5 --max-time 30 -o "$tmp/probe.json" -w '%{http_code}' "$TEST_URL/api/exporthub-auth-probe?diag=$GITHUB_SHA" || true)"
          echo "PROBE_HTTP=$probe_code"
          node - "$tmp/probe.json" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2];
          let d={};try{d=JSON.parse(fs.readFileSync(p,'utf8'))}catch(e){console.log('PROBE_JSON_INVALID');process.exit(0)}
          console.log(JSON.stringify({ok:d.ok,runtimeReady:d.runtimeReady,configuration:d.configuration,modules:Object.fromEntries(Object.entries(d.modules||{}).map(([k,v])=>[k,{ok:v&&v.ok,code:v&&v.code}]))},null,2));
          NODE

          bootstrap_code="$(curl -sS --connect-timeout 5 --max-time 30 -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST --data '{"action":"bootstrap-status"}' -o "$tmp/bootstrap.json" -w '%{http_code}' "$TEST_URL/api/exporthub-auth" || true)"
          echo "BOOTSTRAP_HTTP=$bootstrap_code"
          cat "$tmp/bootstrap.json" || true
          echo

          login_code="$(curl -sS --connect-timeout 5 --max-time 30 -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST --data '{"action":"login","username":"__rc1000_diagnostic_missing_user__","password":"diagnostic-only"}' -o "$tmp/login.json" -w '%{http_code}' "$TEST_URL/api/exporthub-auth" || true)"
          echo "LOGIN_HTTP=$login_code"
          cat "$tmp/login.json" || true
          echo

          # Diagnoseworkflow ist absichtlich read-only und schlägt nicht wegen des erwarteten Fehlers fehl.
          exit 0
