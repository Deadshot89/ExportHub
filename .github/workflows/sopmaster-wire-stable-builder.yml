name: SOPMaster RC1522 Stable Builder Wiring

on:
  push:
    branches:
      - integration/sopmaster-rc1519-validation
    paths:
      - 'scripts/rc1522-wire-stable-builder.mjs'
      - 'test/rc1521-sop-release-wiring.test.mjs'
      - '.github/workflows/sopmaster-wire-stable-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sopmaster-rc1522-stable-builder
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: integration/sopmaster-rc1519-validation
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Confirm new release-wiring contract is red before migration
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --test --test-concurrency=1 test/rc1521-sop-release-wiring.test.mjs > rc1522-before.log 2>&1
          code=$?
          set -e
          if [ "$code" = '0' ]; then
            cat rc1522-before.log
            echo 'RC1522 expected the pre-migration contract to be red.' >&2
            exit 1
          fi
          grep -Eq 'RC1521 SOPMaster-Hook fehlt|integrateTour.*rc1501' rc1522-before.log
      - name: Apply fail-closed stable-builder migration
        run: node scripts/rc1522-wire-stable-builder.mjs
      - name: Verify release-wiring contract turns green
        run: node --test --test-concurrency=1 test/rc1521-sop-release-wiring.test.mjs test/rc1521-sop-current-main-builder.test.mjs
      - name: Build stable RC1112 path with SOPMaster and verify current main contract
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1018/apply-public-language.mjs
          node .github/rc1018/fix-mail-wording.mjs
          node .github/rc1112/build-three-env.mjs
          node .github/rc1505/verify-build-contract.mjs
          for file in index.html TESTVERSION.html demo.html; do
            grep -q 'id="exporthub-rc1501-sop-tour-runtime"' "dist-rc1112/$file"
            grep -q 'id="exporthub-rc1502-sop-editor"' "dist-rc1112/$file"
            grep -q 'id="exporthub-rc1503-sop-training"' "dist-rc1112/$file"
            grep -q 'id="exporthub-rc1505-sop-function-registry"' "dist-rc1112/$file"
            grep -q 'id="exporthub-rc1506-sop-coverage-runtime"' "dist-rc1112/$file"
          done
      - name: Restrict diff to stable builder only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          [ "$changed" = '.github/rc1112/build-three-env.mjs' ] || { echo 'RC1522 produced an unexpected diff.' >&2; exit 1; }
      - name: Commit stable builder wiring only to isolated integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc1112/build-three-env.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'build(sop): wire SOPMaster into stable RC1112 release path'
          git push origin HEAD:integration/sopmaster-rc1519-validation
