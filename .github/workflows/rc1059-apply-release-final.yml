name: RC1059 Apply Release Final

on:
  push:
    branches:
      - rc1059-document-blob-storage
    paths:
      - '.github/rc1059/apply-release-final.cjs'
      - '.github/workflows/rc1059-apply-release-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rc1059-document-blob-storage
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1059 finale Patches anwenden
        run: node .github/rc1059/apply-release-final.cjs
      - name: RC1059 Regressionen
        run: node --test test/rc1059-*.test.mjs
      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- api/shared/blob-rest.js api/exporthub-state/index.js; then
            echo 'Keine Änderung notwendig.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/shared/blob-rest.js api/exporthub-state/index.js
          git commit -m 'RC1059: Dokument-Storage und Diagnose finalisieren'
          git push origin HEAD:rc1059-document-blob-storage
