name: RC1531 Targeted Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rc1531_targeted_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1531 gezielte Production-Livecheck-Regression
        run: node --test test/rc1531-production-livecheck-pipefail.test.mjs test/rc1505-production-promotion.test.mjs
