name: RC1031 Pickup 410 Apply
on:
  push:
    branches:
      - fix/rc1031-diagnostics-lieferavis-storage
    paths:
      - .github/rc1031/apply-410.cjs
      - .github/workflows/rc1031-apply-410.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: RC1031 410-Backoff anwenden
        run: node .github/rc1031/apply-410.cjs
      - name: RC1031 410-Zieltest
        run: node --test test/rc1031-pickup-status-410-backoff.test.mjs
      - name: Gesamte Node-Regression
        run: npm test
      - name: Geprüften 410-Fix committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          if git diff --cached --quiet; then
            echo "Keine Änderung erforderlich."
            exit 0
          fi
          git commit -m "RC1031: tote Pickup-Tokens nach 410 nicht erneut pollen"
          git push origin HEAD:fix/rc1031-diagnostics-lieferavis-storage
