name: RC886 TESTSERVICE Auth Runtime Fix v2

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: exporthub-rc886-testservice-auth-runtime-fix-v2
  cancel-in-progress: false

jobs:
  repair-testservice:
    name: Repair live TESTSERVICE auth verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard committed RC886 state
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html
          test -f .github/workflows/exporthub-testservice.yml
          grep -Fq "version:'RC886',cache:'886',loginReturn:'/TESTVERSION.html?v=886'" TESTVERSION.html
          grep -Fq "/* exporthub-rc886-testservice-api-hotfix */" TESTVERSION.html
          grep -Fq "name: Verify live TESTSERVICE authentication runtime" .github/workflows/exporthub-testservice.yml
          grep -Fq "deployment_environment: testservice" .github/workflows/exporthub-testservice.yml
          echo "OK: RC886 ist committed. TESTVERSION.html wird nicht geändert."

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Backup current TESTSERVICE workflow
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-testservice-before-auth-runtime-fix-v2-${GITHUB_RUN_ID}"
          git tag -a "${TAG}" -m "Backup before TESTSERVICE auth runtime fix v2"
          git push origin "refs/tags/${TAG}"

