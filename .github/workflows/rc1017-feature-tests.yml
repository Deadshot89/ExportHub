name: RC1017 Feature Tests

on:
  push:
    branches:
      - feature/multi-truck-shipment-split
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run RC1017 domain tests
        run: node --test test/rc1017-multi-truck-domain.test.mjs test/rc1017-multi-truck-core.test.mjs test/rc1017-multi-truck-merge.test.mjs test/rc1017-multi-truck-pickup.test.mjs
      - name: Run repository Node tests
        run: npm test
      - name: Run shipment regression contracts
        run: node --test .github/rc997/rc997-shipment-contract.test.mjs test/rc973-long-text-autogrow.test.mjs test/rc975-global-render-integrity.test.mjs test/rc978-shipment-fluid-layout.test.mjs
