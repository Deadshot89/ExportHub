name: RC964 Render Metrics Apply

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc964-render-metrics-apply.yml'

permissions:
  contents: write

jobs:
  apply_rc964:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: RED - RC963 darf RC964 Messwerte noch nicht erfüllen
        id: red
        continue-on-error: true
        run: node tests/rc964-render-metrics.test.cjs

      - name: RED bestätigen
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.red.outcome }}" != "failure" ]]; then
            echo 'Der RC964-Test war vor dem Patch nicht rot. Patch wird aus Sicherheitsgründen abgebrochen.'
            exit 1
          fi
          echo 'RED bestätigt: aktueller Stand erfüllt RC964 noch nicht.'

      - name: RC964 exakt in bestehenden Render- und Diagnosepfad integrieren
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'TESTVERSION.html';
          let source = fs.readFileSync(file, 'utf8');

          function replaceOnce(label, before, after) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: erwartet exakt 1 Treffer, gefunden ${count}`);
            source = source.replace(before, after);
          }

          replaceOnce(
            'RC963 Build-Kennung',
            "var BUILD=Object.freeze({version:'RC963',cache:'963',loginReturn:'/TESTVERSION.html?v=963'});",
            "var BUILD=Object.freeze({version:'RC964',cache:'964',loginReturn:'/TESTVERSION.html?v=964'});"
          );

          const oldStable = "function stableRender(){var context=this,args=arguments,v=currentView(),domMatches=viewDomMatches(v);if(rc963NeedsImmediateRender(lastView,v,domMatches,navigationTransition)){rc963RenderCoordinator.cancel();return performStableRender.apply(context,args)}return rc963RenderCoordinator.request(function(){performStableRender.apply(context,args)})}";
          const newStable = "/* exporthub-rc964-render-metrics */\nfunction rc964CreateRenderMetrics(){var byView=Object.create(null);function row(view){var key=String(view||'unbekannt');return byView[key]||(byView[key]={view:key,requests:0,runs:0,totalMs:0,maxMs:0})}function snapshotRow(r){var coalesced=Math.max(0,r.requests-r.runs);return{view:r.view,requests:r.requests,runs:r.runs,coalesced:coalesced,coalesceRatePct:r.requests?Math.round(coalesced*1000/r.requests)/10:0,totalRenderMs:Math.round(r.totalMs*10)/10,avgRenderMs:r.runs?Math.round(r.totalMs*10/r.runs)/10:0,maxRenderMs:Math.round(r.maxMs*10)/10}}return{request:function(view){row(view).requests++;return true},run:function(view,ms){var r=row(view),n=Math.max(0,Number(ms)||0);r.runs++;r.totalMs+=n;if(n>r.maxMs)r.maxMs=n;return snapshotRow(r)},snapshot:function(view){return snapshotRow(row(view))},snapshotAll:function(){var out={};Object.keys(byView).forEach(function(key){out[key]=snapshotRow(byView[key])});return out}}}\nvar rc964RenderMetrics=rc964CreateRenderMetrics();window.__EXPORTHUB_RC964_RENDER_METRICS__={snapshot:function(view){return rc964RenderMetrics.snapshot(view)},snapshotAll:function(){return rc964RenderMetrics.snapshotAll()}};\nfunction rc964RunMeasured(context,args,v){var started=typeof performance!=='undefined'&&performance.now?performance.now():Date.now();try{return performStableRender.apply(context,args)}finally{var ended=typeof performance!=='undefined'&&performance.now?performance.now():Date.now();rc964RenderMetrics.run(v,Math.max(0,ended-started))}}\nfunction stableRender(){var context=this,args=arguments,v=currentView(),domMatches=viewDomMatches(v);rc964RenderMetrics.request(v);if(rc963NeedsImmediateRender(lastView,v,domMatches,navigationTransition)){rc963RenderCoordinator.cancel();return rc964RunMeasured(context,args,v)}return rc963RenderCoordinator.request(function(){rc964RunMeasured(context,args,v)})}";
          replaceOnce('RC963 stableRender', oldStable, newStable);

          replaceOnce(
            'Fehlerdiagnose JSON Payload',
            'records:sourceRecords()},blob=',
            "records:sourceRecords(),renderMetrics:window.__EXPORTHUB_RC964_RENDER_METRICS__&&typeof window.__EXPORTHUB_RC964_RENDER_METRICS__.snapshotAll==='function'?window.__EXPORTHUB_RC964_RENDER_METRICS__.snapshotAll():{}},blob="
          );

          fs.writeFileSync(file, source);
          NODE

          grep -q "version:'RC964',cache:'964'" TESTVERSION.html
          test "$(grep -c 'exporthub-rc964-render-metrics' TESTVERSION.html)" -eq 1
          test "$(grep -c 'renderMetrics:window.__EXPORTHUB_RC964_RENDER_METRICS__' TESTVERSION.html)" -eq 1
          git diff --check

      - name: GREEN - RC963 und RC964 Regressionen
        run: |
          node tests/rc963-render-performance.test.cjs
          node tests/rc964-render-metrics.test.cjs

      - name: Commit RC964
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add TESTVERSION.html
          if git diff --cached --quiet; then
            echo 'Keine RC964-Änderung erzeugt.'
            exit 1
          fi
          git commit -m 'RC964: Render-Metriken in Fehlerdiagnose aufnehmen'
          git push origin HEAD:main
