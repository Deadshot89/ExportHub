name: RC1014 Development

on:
  push:
    branches: [rc1014-tasks-final]
    paths:
      - 'assets/rc1014-**'
      - 'test/rc1014-**'
      - 'browser/rc1014-**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'android-app/**'
      - '.github/rc1014/**'
      - '.github/workflows/rc1014-development.yml'

permissions:
  contents: read

concurrency:
  group: rc1014-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: RC1014 Lifecycle-Vertrag
        run: node --test test/rc1014-task-lifecycle.test.mjs
      - name: RC1014 Runtime-Integration
        run: node --test test/rc1014-task-runtime-integration.test.mjs
      - name: RC1014 Aufgaben-Design und Direktöffnung
        run: node --test test/rc1014-task-design.test.mjs
      - name: RC1014 Android Aufgaben-Erinnerungen
        run: node --test test/rc1014-task-android.test.mjs
