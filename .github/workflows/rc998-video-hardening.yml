name: RC998 Video Hardening

on:
  push:
    branches:
      - rc998-video-hardening
    paths:
      - '.github/rc998/**'
      - '.github/workflows/rc998-video-hardening.yml'
      - 'TESTVERSION.html'
      - 'index.html'
      - 'assets/**'
      - 'api/**'
      - 'production-version.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc998-video-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Baseline Regressionen
        run: npm test
      - name: RC998 RED/GREEN Vertrag
        run: node --test .github/rc998/rc998-video-hardening.test.mjs
      - name: RC998 Diagnose
        run: node .github/rc998/diagnose-video-regressions.mjs
