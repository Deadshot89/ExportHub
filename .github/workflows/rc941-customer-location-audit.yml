name: RC941 Kundenstandort-Restpfade Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc941-customer-location-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: RC940 verbliebene Standort-Rohdatenpfade klassifizieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC940',cache:'940',loginReturn:'/TESTVERSION.html?v=940'" in text
          print('=== RC941 CUSTOMER LOCATION AUDIT BASIS RC940 ===')

          patterns=[
            "locId=Q(loc.id||loc.locationId||loc.siteId||loc.code||loc.number)",
            "locId=q(loc.id||loc.locationId||loc.siteId||loc.code||loc.number)",
            "old=c&&locationList(c).find(function(l){return q(l.id||l.locationId||l.siteId)===id})",
            "var list=locationList(c),loc=list.find(function(l){return q(l.id||l.locationId||l.siteId)===q(id)})",
            "q(l.id||l.locationId||l.siteId),q(l.name||l.locationName||l.siteName)",
            "var option=document.createElement('option'),id=q(l.id||l.locationId||l.siteId)",
            "list.some(function(l){return q(l.id||l.locationId||l.siteId)===selected})",
            "var only=q(list[0].id||list[0].locationId||list[0].siteId)",
            "Object.assign({},old,{id:id,locationId:id,siteId:id,name:name,address:address",
          ]

          def fn_before(pos):
              chunk=text[max(0,pos-5000):pos]
              ms=list(re.finditer(r'function\s+([A-Za-z0-9_$]+)\s*\([^)]*\)\s*\{',chunk))
              return ms[-1].group(1) if ms else 'unbekannt'

          for pat in patterns:
              hits=[]; p=0
              while True:
                  i=text.find(pat,p)
                  if i<0: break
                  hits.append(i); p=i+1
              print(f'\n## PATTERN {pat}\nCOUNT={len(hits)}')
              for n,i in enumerate(hits,1):
                  print(f'--- {n} @ {i} function={fn_before(i)} ---')
                  print(text[max(0,i-1800):min(len(text),i+len(pat)+1800)].replace('\r',''))

          # Alle Funktionen nennen, die rohe Customer-Locations direkt zusammensetzen.
          print('\n## FUNCTIONS WITH RAW CUSTOMER LOCATION ARRAYS')
          seen=[]
          for m in re.finditer(r'\[\]\.concat\([^\n]{0,500}(?:\.locations|c\.locations)[^\n]{0,700}',text):
              name=fn_before(m.start())
              s=m.group(0)
              if (name,s[:240]) not in seen:
                  seen.append((name,s[:240]))
          for i,(name,s) in enumerate(seen[:40],1): print(f'{i:02d} {name}: {s}')
          PY
      - name: Audit-Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc941-customer-location-audit.yml
          git commit -m "RC941 temporären Audit-Workflow entfernen"
          git push origin HEAD:main
