name: RC990 Render Navigation Materialize

on:
  push:
    branches:
      - rc990-large-ux
    paths:
      - '.github/rc990_render_nav_materialize.py'
      - '.github/workflows/rc990-render-nav-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref == 'refs/heads/rc990-large-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc990-large-ux
          fetch-depth: 0
      - name: Materialize concise render/navigation audit
        run: python .github/rc990_render_nav_materialize.py
      - name: Commit audit result
        shell: bash
        run: |
          if git diff --quiet -- .github/rc990_render_nav_audit_result.txt; then
            echo 'Audit result unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc990_render_nav_audit_result.txt
          git commit -m 'chore: record RC990 render navigation audit result'
          git push origin HEAD:rc990-large-ux
