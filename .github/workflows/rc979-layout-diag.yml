name: RC979 Shipment Inner Density Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc979-layout-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Relevante Sendungsstruktur extrahieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          print('BUILD:', re.search(r"var BUILD=Object\.freeze\(\{version:'(RC\d+)'", text).group(1))
          targets=['rc363BlockCustomer','rc363BlockShipment','rc896ShipmentFieldGrid','rc363BlockColli','rc363BlockDocuments','rc899-doc-main','rc363BlockAbdDecision']
          for target in targets:
            print('\n===',target,'===')
            pos=0
            seen=0
            while True:
              pos=text.find(target,pos)
              if pos<0 or seen>=10: break
              a=max(0,pos-700); b=min(len(text),pos+1800)
              print(text[a:b].replace('\n',' ')[:2500])
              pos+=len(target); seen+=1
          print('\n=== LAYOUT CSS ===')
          for m in re.finditer(r'([^{}]{1,450})\{([^{}]{0,1800})\}', text):
            sel=m.group(1).strip(); body=m.group(2).strip()
            hay=(sel+' '+body)
            if any(t in hay for t in targets) and any(p in body for p in ['grid-template-columns','height:','min-height','gap:','padding:','align-items','align-self','margin:']):
              print(sel[-450:]+' {'+body[:1800]+'}')
          PY
