name: RC1259 AVIS Proxy Host

on:
  push:
    branches: [rc1259-avis-proxy-host]
  pull_request:
    branches: [main]
    paths:
      - 'api/avis-reminder-mail/index.js'
      - 'test/rc1207-avis-reminder-mail.test.mjs'
      - 'test/rc1259-avis-environment-host.test.mjs'
      - '.github/workflows/rc1259-avis-proxy-host.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1259 AVIS environment regression
        run: node --test --test-concurrency=1 test/rc1259-avis-environment-host.test.mjs test/rc1207-avis-reminder-mail.test.mjs
      - name: Full Node regression
        run: npm test
      - name: Three-environment build
        run: |
          node .github/rc1112/build-three-env.mjs
          node .github/rc1121/verify-final-html.mjs
