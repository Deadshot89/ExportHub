name: RC1537 Apply Fix Once

on:
  push:
    branches:
      - fix/rc1537-testservice-save-cache-etag
    paths:
      - '.github/workflows/rc1537-apply-fix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rc1537-testservice-save-cache-etag
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1537 TESTSERVICE Save-Cache absichern
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='api/exporthub-state/index.js';
          const from="if(requestedMode==='save')return {value:cached.value,etag:String(cached.etag),warmCache:true,optimisticSave:true,cacheMode:'memory-save'};";
          const to="if(requestedMode==='save'&&c&&c.environment!=='testservice')return {value:cached.value,etag:String(cached.etag),warmCache:true,optimisticSave:true,cacheMode:'memory-save'};";
          const source=fs.readFileSync(path,'utf8');
          const first=source.indexOf(from);
          if(first<0)throw new Error('RC1537: erwarteter Save-Cache-Quelltext fehlt');
          if(source.indexOf(from,first+from.length)>=0)throw new Error('RC1537: Save-Cache-Quelltext ist nicht eindeutig');
          fs.writeFileSync(path,source.slice(0,first)+to+source.slice(first+from.length));
          NODE
          node tests/rc962-state-performance.test.cjs
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add api/exporthub-state/index.js
          git commit -m 'fix(RC1537): validate TESTSERVICE save cache by etag'
          git push origin HEAD:refs/heads/fix/rc1537-testservice-save-cache-etag