name: RC1053 RED

on:
  push:
    branches: [rc1053-avis-issue-no-team-read]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test test/rc1053-lieferavis-issue-no-team-read.test.mjs
