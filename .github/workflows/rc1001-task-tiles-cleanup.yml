name: RC1001 Aufgaben-Kacheln aufraeumen

on:
  push:
    branches: [rc1001-task-tiles-cleanup]
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'test/rc1001-task-tiles-cleanup.test.mjs'
      - '.github/rc996/tasks-contract.test.mjs'
      - '.github/rc1001/apply-task-tiles-cleanup.mjs'
      - '.github/workflows/rc1001-task-tiles-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1001-task-tiles-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Aufgaben-Kacheln bereinigen
        run: node .github/rc1001/apply-task-tiles-cleanup.mjs
      - name: RC1001 Vertrag
        run: node --test test/rc1001-task-tiles-cleanup.test.mjs
      - name: Bestehender Aufgaben-Vertrag
        run: node --test .github/rc996/tasks-contract.test.mjs
      - name: Gesamte Node-Regression
        run: npm test
      - name: Diff prüfen
        run: git diff --check
      - name: Bereinigten Stand committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html TESTVERSION.html; then
            echo 'Aufgaben-Kacheln bereits materialisiert und frisch geprüft.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html TESTVERSION.html
          git commit -m 'RC1001: durchgestrichene Aufgaben-Kacheln entfernen'
          git push origin HEAD:rc1001-task-tiles-cleanup
