name: SOPMaster RC1521 Wire Release Paths

on:
  push:
    branches:
      - integration/sopmaster-rc1519-validation
    paths:
      - 'scripts/rc1521-wire-release.mjs'
      - '.github/workflows/sopmaster-wire-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sopmaster-rc1521-wire-release
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: integration/sopmaster-rc1519-validation
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Apply fail-closed RC1521 wiring migration
        run: node scripts/rc1521-wire-release.mjs
      - name: Verify patched workflow contracts
        run: >-
          node --test --test-concurrency=1
          test/rc1521-sop-release-wiring.test.mjs
          test/rc1521-sop-current-main-builder.test.mjs
          test/rc1520-sop-release-candidate.test.mjs
          test/rc1018-production-deploy.test.mjs
          test/pack-notification-production.test.mjs
      - name: Validate YAML diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -qx '.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml'
          printf '%s\n' "$changed" | grep -qx '.github/workflows/exporthub-production-release.yml'
          printf '%s\n' "$changed" | grep -qx '.github/workflows/exporthub-testservice.yml'
          printf '%s\n' "$changed" | grep -qx '.github/workflows/sopmaster-release-candidate.yml'
          printf '%s\n' "$changed" | grep -qx 'test/rc1018-production-deploy.test.mjs'
          printf '%s\n' "$changed" | grep -qx 'test/pack-notification-production.test.mjs'
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
          [ "$count" = '6' ] || { echo "Unerwartete Patch-Dateien: $count" >&2; exit 1; }
      - name: Commit wiring only to isolated integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml \
            .github/workflows/exporthub-production-release.yml \
            .github/workflows/exporthub-testservice.yml \
            .github/workflows/sopmaster-release-candidate.yml \
            test/rc1018-production-deploy.test.mjs \
            test/pack-notification-production.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'build(sop): wire RC1521 into release paths'
          git push origin HEAD:integration/sopmaster-rc1519-validation
