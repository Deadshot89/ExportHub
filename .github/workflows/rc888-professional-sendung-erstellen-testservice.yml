name: RC888 Professional Sendung erstellen TESTSERVICE

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: exporthub-rc888-shipment-create-professional
  cancel-in-progress: false

jobs:
  patch-testservice:
    name: RC888 Sendung erstellen
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout RC887 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard RC887 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f TESTVERSION.html
          grep -Fq "version:'RC887',cache:'887',loginReturn:'/TESTVERSION.html?v=887'" TESTVERSION.html
          grep -Fq "/* exporthub-rc885-clean-workspace-v4 */" TESTVERSION.html
          grep -Fq "/* exporthub-rc886-testservice-api-hotfix */" TESTVERSION.html
          grep -Fq "__rc887AvisAllowed" TESTVERSION.html
          grep -Fq "function avisHost(view)" TESTVERSION.html
          grep -Fq "rc573ShipmentShell" TESTVERSION.html
          grep -Fq "rc363BlockCustomer" TESTVERSION.html
          grep -Fq "rc363BlockActions" TESTVERSION.html

          if grep -Fq "exporthub-rc888-shipment-create-professional" TESTVERSION.html; then
            echo "::error::RC888 ist bereits vorhanden."
            exit 1
          fi

      - name: RED regression - current shipment create has no RC888 professional layer
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "rc888ShipmentHeader" TESTVERSION.html; then
            echo "::error::RED-Test ungültig: RC888 Header existiert bereits."
            exit 1
          fi
          echo "RED bestätigt: professionelle RC888-Schicht fehlt noch."

      - name: Snapshot source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("TESTVERSION.html").read_text(encoding="utf-8")
          for name,value in {
              "script_open":src.lower().count("<script"),
              "script_close":src.lower().count("</script>"),
              "style_open":src.lower().count("<style"),
              "style_close":src.lower().count("</style>")
          }.items():
              Path("/tmp/rc888_"+name).write_text(str(value))
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC887 backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-clean-rc887-before-rc888-${GITHUB_RUN_ID}"
          git tag -a "$TAG" -m "Clean RC887 before professional shipment create RC888"
          git push origin "refs/tags/$TAG"

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          p=Path("TESTVERSION.html")
          src=p.read_text(encoding="utf-8")

          old_build="var BUILD=Object.freeze({version:'RC887',cache:'887',loginReturn:'/TESTVERSION.html?v=887'});"
          new_build="var BUILD=Object.freeze({version:'RC888',cache:'888',loginReturn:'/TESTVERSION.html?v=888'});"

          if src.count(old_build)!=1:
              raise SystemExit("RC887 BUILD nicht eindeutig gefunden")
          src=src.replace(old_build,new_build,1)

          old_release=(
              " version:'RC887',\n"
              " date:'31.08.2026',\n"
              " title:'Lieferavis wiederhergestellt und Dashboard-Dubletten entfernt',"
          )
          new_release=(
              " version:'RC888',\n"
              " date:'31.08.2026',\n"
              " title:'Sendung erstellen kompakter und professioneller gestaltet',"
