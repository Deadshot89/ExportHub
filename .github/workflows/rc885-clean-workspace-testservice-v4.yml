name: RC885 Clean Workspace TESTSERVICE v4

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: exporthub-rc885-clean-workspace-v4
  cancel-in-progress: false

jobs:
  patch-testservice:
    name: RC885 clean workspace v4
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout RC884 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Prove RC884 baseline clean before change
        shell: bash
        run: |
          set -euo pipefail

          test -f TESTVERSION.html
          grep -Fq "version:'RC884',cache:'884',loginReturn:'/TESTVERSION.html?v=884'" TESTVERSION.html
          grep -Fq "function avisHost(view)" TESTVERSION.html

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          src=Path("TESTVERSION.html").read_text(encoding="utf-8",errors="replace")

          class V(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script=0
                  self.style=0
                  self.parts=[]
              def handle_starttag(self,tag,attrs):
                  t=tag.lower()
                  if t=="script": self.script+=1
                  elif t=="style": self.style+=1
              def handle_endtag(self,tag):
                  t=tag.lower()
                  if t=="script" and self.script: self.script-=1
                  elif t=="style" and self.style: self.style-=1
              def handle_data(self,data):
                  if not self.script and not self.style:
                      self.parts.append(data)

          p=V()
          p.feed(src)
          p.close()
          visible="\n".join(p.parts)

          bad=[
              "function applyFixedBlocks()",
              "window.open('about:blank'",
              'window.open("about:blank"',
              "function avisHost(view)"
          ]
          leaks=[x for x in bad if x in visible]
          if leaks:
              raise SystemExit("RC884 ist VOR RC885 bereits beschädigt: "+", ".join(leaks))

          Path("/tmp/rc885_script_open_count").write_text(str(src.lower().count("<script")))
          Path("/tmp/rc885_script_close_count").write_text(str(src.lower().count("</script>")))
          Path("/tmp/rc885_style_open_count").write_text(str(src.lower().count("<style")))
          Path("/tmp/rc885_style_close_count").write_text(str(src.lower().count("</style>")))

          print("OK: RC884 ist vor dem Patch sauber.")
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC884 backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-clean-rc884-before-rc885-v4-${GITHUB_RUN_ID}"
          git tag -a "${TAG}" -m "Clean RC884 before safe RC885 workspace v4"
          git push origin "refs/tags/${TAG}"

      - name: Patch RC885 without adding HTML script or style tags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
