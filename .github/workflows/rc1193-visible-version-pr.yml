name: Visible Version PR Browser Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/rc1193-visible-release.js'
      - 'assets/rc1177-release-notes.js'
      - 'release-version.json'
      - 'e2e/specs/version-display.spec.mjs'
      - 'test/rc1193-*'
      - 'test/rc1314-explicit-visible-release.test.mjs'
      - '.github/rc1112/build-three-env.mjs'
      - '.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml'
      - '.github/workflows/rc1193-visible-version-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: RC1265 Versionsvertrag prüfen
        run: node --test test/rc1193-visible-release-version.test.mjs test/rc1314-explicit-visible-release.test.mjs
      - name: Drei-Umgebungen-Paket bauen
        run: node .github/rc1112/build-three-env.mjs
      - name: Playwright installieren
        run: |
          npm install --no-save @playwright/test@1.63.0
          node -e "const fs=require('node:fs'),{chromium}=require('@playwright/test');if(!fs.existsSync(chromium.executablePath()))throw new Error('Expected pinned Chromium executable missing');"
          node -e "const {chromium}=require('@playwright/test');chromium.launch().then(b=>b.close()).catch(e=>{console.error(e);process.exit(1)})"
      - name: Produktion lokal prüfen
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_ENTRY: /index.html
          EXPORTHUB_E2E_PUBLIC_ENV: production
        run: npx playwright test e2e/specs/version-display.spec.mjs --project=laptop
      - name: TESTSERVICE lokal prüfen
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_ENTRY: /TESTVERSION.html
          EXPORTHUB_E2E_PUBLIC_ENV: testservice
        run: npx playwright test e2e/specs/version-display.spec.mjs --project=laptop
