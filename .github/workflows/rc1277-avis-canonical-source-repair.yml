name: RC1277 AVIS Canonical Source Repair

on:
  push:
    branches:
      - fix/rc1277-avis-14day-source-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rc1277-avis-14day-source-clean
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Normalize only AVIS 14-day source drift
        run: node scripts/rc1277-fix-avis-14day-source-drift.mjs
      - name: Verify original regression
        run: node --test test/rc1277-avis-14day-source-drift.test.mjs test/rc1089-avis-post-pickup-downloads.test.mjs .github/rc998/partial-pickup-avis-contract.test.mjs
      - name: Commit only intended canonical source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html TESTVERSION.html api/customer-avis/index.js
          if git diff --cached --quiet; then
            echo "No canonical source changes required."
            exit 0
          fi
          git commit -m "RC1277: normalize AVIS 14-day canonical sources"
          git push origin HEAD:fix/rc1277-avis-14day-source-clean
