name: RC936 Standort-Alias-Konsistenz

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc936-location-alias-consistency.yml'

permissions:
  contents: write

concurrency:
  group: rc936-location-alias-consistency
  cancel-in-progress: false

jobs:
  patch_rc936:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED – RC935 muss die beiden Alias-Lücken noch zeigen
        id: red
        continue-on-error: true
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('TESTVERSION.html')
          text = p.read_text(encoding='utf-8')
          assert "version:'RC935',cache:'935',loginReturn:'/TESTVERSION.html?v=935'" in text, 'Basis ist nicht exakt RC935.'

          m = re.search(r"function enforceFreshDraft\(\)\{.*?empty=\[(.*?)\];empty\.forEach", text, re.S)
          assert m, 'enforceFreshDraft wurde nicht gefunden.'
          fresh = m.group(1)
          for field in ['selectedLocationId', 'locationName', 'deliveryAddress', 'destinationAddress']:
              assert ("'" + field + "'") in fresh, f'enforceFreshDraft enthält {field} noch nicht.'

          assert "persistedAddress=q(existingSavedBefore.recipientAddress||existingSavedBefore.deliveryAddress||existingSavedBefore.destinationAddress)" in text
          assert "persistedLocation=q(existingSavedBefore.locationId||existingSavedBefore.selectedLocationId||existingSavedBefore.siteId||existingSavedBefore.destinationId)" in text
          assert "if(!q(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId)&&persistedLocation)" in text
          assert "sh.deliveryAddress=addressBefore;sh.destinationAddress=addressBefore" in text
          assert "sh.destinationId=locationBefore" in text
          PY

      - name: RED-Ergebnis verifizieren
        shell: bash
        env:
          RED_OUTCOME: ${{ steps.red.outcome }}
        run: |
          if [[ "$RED_OUTCOME" != "failure" ]]; then
            echo "Der RED-Test ist nicht wie erwartet fehlgeschlagen. RC935 wird nicht verändert."
            exit 1
          fi
          echo "RED bestätigt: Die beiden bekannten Alias-Lücken sind im aktuellen RC935 reproduzierbar."

      - name: RC936 direkt in den bestehenden Pfaden korrigieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('TESTVERSION.html')
          text = p.read_text(encoding='utf-8')

          def replace_once(src, old, new, label):
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: erwartete genau 1 Fundstelle, gefunden {count}. Abbruch ohne unsicheren Patch.')
              return src.replace(old, new, 1)

          # Harte Basis-Sicherung: nur RC935 darf zu RC936 werden.
          text = replace_once(
              text,
              "version:'RC935',cache:'935',loginReturn:'/TESTVERSION.html?v=935'",
              "version:'RC936',cache:'936',loginReturn:'/TESTVERSION.html?v=936'",
              'BUILD-Version'
          )

          # Release-Historie ergänzen, bestehende Historie nicht überschreiben.
          marker = "changes:Object.freeze([\n"
          if text.count(marker) != 1:
              raise SystemExit('Release-Changes-Anker ist nicht eindeutig.')
          notes = (
              "    'RC936 vereinheitlicht den Neu-Sendungs-Reset: selectedLocationId, locationName sowie Empfänger-, Liefer- und Zieladresse werden gemeinsam mit den übrigen Standortfeldern zurückgesetzt.',\n"
              "    'RC936 vereinheitlicht den bestehenden Speicher-/Wiederherstellungspfad: destinationId sowie Empfänger-, Liefer- und Zieladresse werden gemeinsam gelesen und wiederhergestellt, damit kein Standort-Alias mehr auseinanderläuft.',\n"
          )
          text = text.replace(marker, marker + notes, 1)

          # 1) Bestehenden enforceFreshDraft-Block direkt reparieren – kein Overlay.
          m = re.search(r"function enforceFreshDraft\(\)\{.*?empty=\[(.*?)\];empty\.forEach", text, re.S)
          if not m:
              raise SystemExit('enforceFreshDraft wurde nicht gefunden.')
          fresh = m.group(1)
          for field in ['selectedLocationId', 'locationName', 'deliveryAddress', 'destinationAddress']:
              if ("'" + field + "'") in fresh:
                  raise SystemExit(f'enforceFreshDraft enthält {field} unerwartet bereits; Patch wird nicht geraten.')
          fresh2 = fresh
          fresh2 = fresh2.replace("'locationId','siteId'", "'locationId','selectedLocationId','siteId'", 1)
          fresh2 = fresh2.replace("'location','site','standort','destinationId'", "'location','site','standort','locationName','destinationId'", 1)
          fresh2 = fresh2.replace("'recipientName','recipientAddress','recipientCountry'", "'recipientName','recipientAddress','deliveryAddress','destinationAddress','recipientCountry'", 1)
          if fresh2 == fresh:
              raise SystemExit('enforceFreshDraft konnte nicht eindeutig erweitert werden.')
          text = text[:m.start(1)] + fresh2 + text[m.end(1):]

          # 2) Bestehenden Speicher-/Wiederherstellungspfad direkt kanonisch machen.
          text = replace_once(
              text,
              "persistedAddress=q(existingSavedBefore.recipientAddress),persistedLocation=q(existingSavedBefore.locationId||existingSavedBefore.selectedLocationId||existingSavedBefore.siteId);",
              "persistedAddress=q(existingSavedBefore.recipientAddress||existingSavedBefore.deliveryAddress||existingSavedBefore.destinationAddress),persistedLocation=q(existingSavedBefore.locationId||existingSavedBefore.selectedLocationId||existingSavedBefore.siteId||existingSavedBefore.destinationId);",
              'Persistierte Standortdaten'
          )
          text = replace_once(
              text,
              "if(!q(sh.recipientAddress)&&persistedAddress)sh.recipientAddress=persistedAddress;",
              "if(persistedAddress){if(!q(sh.recipientAddress))sh.recipientAddress=persistedAddress;if(!q(sh.deliveryAddress))sh.deliveryAddress=persistedAddress;if(!q(sh.destinationAddress))sh.destinationAddress=persistedAddress}",
              'Persistierte Adresse anwenden'
          )
          text = replace_once(
              text,
              "if(!q(sh.locationId||sh.selectedLocationId||sh.siteId)&&persistedLocation){sh.locationId=persistedLocation;sh.selectedLocationId=persistedLocation;sh.siteId=persistedLocation}",
              "if(!q(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId)&&persistedLocation){sh.locationId=persistedLocation;sh.selectedLocationId=persistedLocation;sh.siteId=persistedLocation;sh.destinationId=persistedLocation}",
              'Persistierte Standort-ID anwenden'
          )
          text = replace_once(
              text,
              "addressBefore=q(sh.recipientAddress||existingSavedBefore&&existingSavedBefore.recipientAddress),locationBefore=q(sh.locationId||sh.selectedLocationId||sh.siteId||existingSavedBefore&&(existingSavedBefore.locationId||existingSavedBefore.selectedLocationId||existingSavedBefore.siteId)),",
              "addressBefore=q(sh.recipientAddress||sh.deliveryAddress||sh.destinationAddress||existingSavedBefore&&(existingSavedBefore.recipientAddress||existingSavedBefore.deliveryAddress||existingSavedBefore.destinationAddress)),locationBefore=q(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId||existingSavedBefore&&(existingSavedBefore.locationId||existingSavedBefore.selectedLocationId||existingSavedBefore.siteId||existingSavedBefore.destinationId)),",
              'Zwischengespeicherte Standortdaten'
          )
          text = replace_once(
              text,
              "sh.recipientAddress=addressBefore;if(locationBefore){sh.locationId=locationBefore;sh.selectedLocationId=locationBefore;sh.siteId=locationBefore}",
              "sh.recipientAddress=addressBefore;sh.deliveryAddress=addressBefore;sh.destinationAddress=addressBefore;if(locationBefore){sh.locationId=locationBefore;sh.selectedLocationId=locationBefore;sh.siteId=locationBefore;sh.destinationId=locationBefore}",
              'Bestätigten Standort wiederherstellen'
          )

          p.write_text(text, encoding='utf-8')
          PY

      - name: GREEN – RC936 Standort-Aliase vollständig prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          text = Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC936',cache:'936',loginReturn:'/TESTVERSION.html?v=936'" in text
          assert "version:'RC935',cache:'935',loginReturn:'/TESTVERSION.html?v=935'" not in text

          m = re.search(r"function enforceFreshDraft\(\)\{.*?empty=\[(.*?)\];empty\.forEach", text, re.S)
          assert m
          fresh = m.group(1)
          for field in ['locationId','selectedLocationId','siteId','destinationId','locationName','recipientAddress','deliveryAddress','destinationAddress']:
              assert ("'" + field + "'") in fresh, field

          required = [
              "persistedAddress=q(existingSavedBefore.recipientAddress||existingSavedBefore.deliveryAddress||existingSavedBefore.destinationAddress)",
              "persistedLocation=q(existingSavedBefore.locationId||existingSavedBefore.selectedLocationId||existingSavedBefore.siteId||existingSavedBefore.destinationId)",
              "if(!q(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId)&&persistedLocation)",
              "addressBefore=q(sh.recipientAddress||sh.deliveryAddress||sh.destinationAddress||existingSavedBefore&&(existingSavedBefore.recipientAddress||existingSavedBefore.deliveryAddress||existingSavedBefore.destinationAddress))",
              "locationBefore=q(sh.locationId||sh.selectedLocationId||sh.siteId||sh.destinationId||existingSavedBefore&&(existingSavedBefore.locationId||existingSavedBefore.selectedLocationId||existingSavedBefore.siteId||existingSavedBefore.destinationId))",
              "sh.recipientAddress=addressBefore;sh.deliveryAddress=addressBefore;sh.destinationAddress=addressBefore",
              "sh.locationId=locationBefore;sh.selectedLocationId=locationBefore;sh.siteId=locationBefore;sh.destinationId=locationBefore",
              "RC936 vereinheitlicht den Neu-Sendungs-Reset",
              "RC936 vereinheitlicht den bestehenden Speicher-/Wiederherstellungspfad"
          ]
          for needle in required:
              assert needle in text, needle

          forbidden = [
              "persistedAddress=q(existingSavedBefore.recipientAddress),persistedLocation=q(existingSavedBefore.locationId||existingSavedBefore.selectedLocationId||existingSavedBefore.siteId);",
              "if(!q(sh.recipientAddress)&&persistedAddress)sh.recipientAddress=persistedAddress;",
              "if(!q(sh.locationId||sh.selectedLocationId||sh.siteId)&&persistedLocation)",
              "sh.recipientAddress=addressBefore;if(locationBefore){sh.locationId=locationBefore;sh.selectedLocationId=locationBefore;sh.siteId=locationBefore}"
          ]
          for needle in forbidden:
              assert needle not in text, needle

          print('GREEN: RC936 Alias-Konsistenzprüfung bestanden.')
          PY

      - name: Diff und Dateiintegrität prüfen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          grep -m1 -oE "version:'RC[0-9]+'" TESTVERSION.html

      - name: RC936 nach main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          if git diff --cached --quiet; then
            echo "Keine Änderung erzeugt – Abbruch."
            exit 1
          fi
          git commit -m "RC936 Standort-Alias-Pfade vereinheitlichen"
          git push origin HEAD:main
