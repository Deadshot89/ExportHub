name: RC1011 Abholkalender Verify

on:
  push:
    branches:
      - rc1011-abholkalender-completion
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: State- und Legacy-Renderer diagnostizieren
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['index.html','TESTVERSION.html']){
            const html=fs.readFileSync(file,'utf8');
            console.log(`=== ${file} STATE + RENDER ===`);
            for(const term of ['function legacyView(','function S(','function state(','function stableRender(','function viewDomMatches(']){
              const at=html.indexOf(term);
              if(at<0){console.log(`MISSING ${term}`);continue;}
              console.log(`TERM ${term} @${at}: ${html.slice(Math.max(0,at-700),Math.min(html.length,at+7000)).replace(/\s+/g,' ')}`);
            }
            for(const term of ['__EXPORTHUB_BIND_STATE__','__EXPORTHUB_GET_STATE__','window.STATE','window.state','window.appState','shipments:']){
              const at=html.indexOf(term);
              console.log(`GLOBAL ${term}: ${at}`);
              if(at>=0) console.log(html.slice(Math.max(0,at-500),Math.min(html.length,at+1800)).replace(/\s+/g,' '));
            }
          }
          NODE
      - name: RC1011 Kalender-Abschlussvertrag
        run: node --test test/rc1011-abholkalender-completion.test.mjs
      - name: RC1011 Drei-Umgebungen-Releasevertrag
        run: node --test test/rc1011-three-env-sync.test.mjs
      - name: RC1004 Kalender-Regression
        run: node --test test/rc1004-company-context.test.mjs test/rc1004-fixed-pickup-store.test.mjs test/rc1004-fixed-pickups-api.test.mjs test/rc1004-abholkalender-model.test.mjs test/rc1004-abholkalender-ui.test.mjs
      - name: Android Release-Regression
        run: node --test test/rc1003-android-native-direct-open.test.mjs test/rc1003-three-env-sync.test.mjs
      - name: Gesamte Node-Regression
        run: npm test
      - name: RC1011 Drei-Umgebungen-Build
        run: node .github/rc1011/build-three-env.mjs
      - name: RC1011 Build und Diff prüfen
        shell: bash
        run: |
          set -euo pipefail
          check(){ local label="$1" pattern="$2" file="$3"; if grep -q "$pattern" "$file"; then echo "OK: $label"; else echo "FEHLT: $label ($pattern in $file)"; exit 1; fi; }
          check 'Produktion Umgebung' 'ExportHUB RC1011 environment=production-candidate' dist-rc1011/index.html
          check 'TESTSERVICE Umgebung' 'ExportHUB RC1011 environment=testservice' dist-rc1011/TESTVERSION.html
          check 'Demo Umgebung' 'ExportHUB RC1011 environment=demo' dist-rc1011/demo.html
          check 'Produktion Version' "version:'RC1011'" dist-rc1011/index.html
          check 'TESTSERVICE Version' "version:'RC1011'" dist-rc1011/TESTVERSION.html
          check 'Demo Version' "version:'RC1011'" dist-rc1011/demo.html
          check 'Produktion Kalenderbindung' 'assets/abholkalender.js' dist-rc1011/index.html
          check 'TESTSERVICE Kalenderbindung' 'assets/abholkalender.js' dist-rc1011/TESTVERSION.html
          check 'Demo Kalenderbindung' 'assets/abholkalender.js' dist-rc1011/demo.html
          check 'SOP Freigabelayer' 'assets/sop/rc1010-sop-release.js' dist-rc1011/index.html
          git diff --check
