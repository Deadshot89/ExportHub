name: RC1903 TESTSERVICE Real Guest Smoke

on:
  workflow_run:
    workflows:
      - ExportHUB RC1112 Main Verification
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rc1903-testservice-real-guest
  cancel-in-progress: false

jobs:
  testservice_guest:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Validate exact deployed TESTSERVICE SHA before any test write
        env:
          RC1903_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/rc1903-testservice-guest-live.mjs
