name: RC941 Kundenstandort-Konsistenz

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc941-customer-location-consistency.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rc941-customer-location-consistency
  cancel-in-progress: false

jobs:
  patch_verify_deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED – RC940 muss die drei Rohdaten-Lücken noch zeigen
        id: red
        continue-on-error: true
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC940',cache:'940',loginReturn:'/TESTVERSION.html?v=940'" in text, 'Basis ist nicht exakt RC940.'
          desired=[
            "locId=Q(loc.id||loc.locationId||loc.selectedLocationId||loc.siteId||loc.destinationId||loc.code||loc.number)",
            "locId=q(loc.id||loc.locationId||loc.selectedLocationId||loc.siteId||loc.destinationId||loc.code||loc.number)",
            "old=c&&locationList(c).find(function(l){return q(l.id||l.locationId||l.selectedLocationId||l.siteId||l.destinationId)===id})||{}",
            "Object.assign({},old,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id,name:name,address:address"
          ]
          for needle in desired:
              assert needle in text, needle
          PY

      - name: RED-Ergebnis verifizieren
        shell: bash
        env:
          RED_OUTCOME: ${{ steps.red.outcome }}
        run: |
          if [[ "$RED_OUTCOME" != "failure" ]]; then
            echo "RED ist nicht wie erwartet fehlgeschlagen. RC940 wird nicht verändert."
            exit 1
          fi
          echo "RED bestätigt: Länder-Fallbacks und Kundenstandort-Speicherung sind auf RC940 noch unvollständig."

      - name: RC941 direkt in den drei Rohdatenpfaden korrigieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('TESTVERSION.html')
          text=p.read_text(encoding='utf-8')

          def once(src,old,new,label):
              n=src.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: erwartet 1 Fundstelle, gefunden {n}')
              return src.replace(old,new,1)

          text=once(text,
              "version:'RC940',cache:'940',loginReturn:'/TESTVERSION.html?v=940'",
              "version:'RC941',cache:'941',loginReturn:'/TESTVERSION.html?v=941'",
              'BUILD-Version')

          marker="changes:Object.freeze([\n"
          if text.count(marker)!=1:
              raise SystemExit('Release-Anker nicht eindeutig')
          note="    'RC941 vereinheitlicht Kundenstandort-Rohdaten und Länder-Fallbacks: Der Kundenordner speichert jede Standort-ID unter locationId, selectedLocationId, siteId und destinationId; Mail-/Versandland-Ermittlung erkennt historische Standorte auch über selectedLocationId/destinationId.',\n"
          text=text.replace(marker,marker+note,1)

          # 1) Mail-/Prozess-Länderermittlung aus rohen Kundenstandorten.
          text=once(text,
              "locId=Q(loc.id||loc.locationId||loc.siteId||loc.code||loc.number)",
              "locId=Q(loc.id||loc.locationId||loc.selectedLocationId||loc.siteId||loc.destinationId||loc.code||loc.number)",
              'recipientCountryFor Roh-ID')

          # 2) Versand-/Dokument-Länderermittlung aus rohen Kundenstandorten.
          text=once(text,
              "locId=q(loc.id||loc.locationId||loc.siteId||loc.code||loc.number)",
              "locId=q(loc.id||loc.locationId||loc.selectedLocationId||loc.siteId||loc.destinationId||loc.code||loc.number)",
              'shipmentRecipientCountry Roh-ID')

          # 3) Kundenordner-Standorteditor: Altstandort vollständig erkennen und alle Aliase persistieren.
          text=once(text,
              "old=c&&locationList(c).find(function(l){return q(l.id||l.locationId||l.siteId)===id})||{}",
              "old=c&&locationList(c).find(function(l){return q(l.id||l.locationId||l.selectedLocationId||l.siteId||l.destinationId)===id})||{}",
              'readLocationRows Altstandort')
          text=once(text,
              "Object.assign({},old,{id:id,locationId:id,siteId:id,name:name,address:address",
              "Object.assign({},old,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id,name:name,address:address",
              'readLocationRows Alias-Persistenz')

          p.write_text(text,encoding='utf-8')
          PY

      - name: GREEN – RC941 Kundenstandort-Konsistenz prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC941',cache:'941',loginReturn:'/TESTVERSION.html?v=941'" in text
          assert "RC941 vereinheitlicht Kundenstandort-Rohdaten und Länder-Fallbacks" in text

          required=[
            "locId=Q(loc.id||loc.locationId||loc.selectedLocationId||loc.siteId||loc.destinationId||loc.code||loc.number)",
            "locId=q(loc.id||loc.locationId||loc.selectedLocationId||loc.siteId||loc.destinationId||loc.code||loc.number)",
            "old=c&&locationList(c).find(function(l){return q(l.id||l.locationId||l.selectedLocationId||l.siteId||l.destinationId)===id})||{}",
            "Object.assign({},old,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id,name:name,address:address",
            "x.locations=clone(list);x.sites=clone(list);x.standorte=clone(list);",
            "Object.assign({},l,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id})"
          ]
          for needle in required:
              assert needle in text, needle

          forbidden=[
            "locId=Q(loc.id||loc.locationId||loc.siteId||loc.code||loc.number)",
            "locId=q(loc.id||loc.locationId||loc.siteId||loc.code||loc.number)",
            "old=c&&locationList(c).find(function(l){return q(l.id||l.locationId||l.siteId)===id})||{}",
            "Object.assign({},old,{id:id,locationId:id,siteId:id,name:name,address:address"
          ]
          for needle in forbidden:
              assert needle not in text, needle

          # Die bereits normalisierte Auswahl-/Sendungslogik aus RC938-940 muss erhalten bleiben.
          assert "function applyLocation(sh,l){if(!sh||!l)return;sh.locationId=l.id;sh.selectedLocationId=l.id;sh.siteId=l.id;sh.destinationId=l.id;" in text
          assert "s.locationId=id;s.selectedLocationId=id;s.siteId=id;s.destinationId=id" in text
          print('GREEN: RC941 Kundenstandort-Rohdaten und Länder-Fallbacks konsistent.')
          PY

      - name: Diff und Integrität prüfen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          grep -m1 -oE "version:'RC[0-9]+'" TESTVERSION.html

      - name: RC941 nach main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          if git diff --cached --quiet; then
            echo "Keine Änderung erzeugt – Abbruch."
            exit 1
          fi
          git commit -m "RC941 Kundenstandort-Rohdaten vereinheitlichen"
          git push origin HEAD:main

      - name: Temporären RC941-Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm .github/workflows/rc941-customer-location-consistency.yml
          git commit -m "RC941 temporären Patch-Workflow entfernen"
          git push origin HEAD:main

      - name: TESTSERVICE-Deploy für RC941 auslösen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/exporthub-testservice-final-artifact-fix.yml/dispatches" \
            -d '{"ref":"main"}')"
          cat /tmp/dispatch.out || true
          [[ "$code" == "204" ]] || { echo "Dispatch fehlgeschlagen: HTTP $code"; exit 1; }
          echo "TESTSERVICE-Deploy RC941 ausgelöst."
