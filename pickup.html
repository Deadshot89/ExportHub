<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>ExportHUB Abholbestätigung RC545</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#0f172a;background:#eef6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(5,184,255,.20),transparent 35%),#eef6fb;padding:18px}.wrap{min-height:calc(100vh - 36px);display:grid;place-items:center}.card{width:min(680px,100%);background:#fff;border:1px solid #dbe4ef;border-radius:28px;box-shadow:0 22px 60px rgba(15,23,42,.17);padding:24px}.brand{font-size:13px;font-weight:1000;letter-spacing:.08em;color:#075985}.card h1{font-size:28px;color:#08245d;margin:8px 0 18px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid #bfdbfe;background:#eff6ff;border-radius:16px;padding:12px}.box span{display:block;font-size:11px;font-weight:900;color:#475569;text-transform:uppercase}.box strong{display:block;font-size:18px;margin-top:4px;word-break:break-word}.msg{border-radius:15px;padding:12px;margin:13px 0;font-weight:800;line-height:1.45}.info{background:#eff6ff;border-left:5px solid #2563eb}.ok{background:#dcfce7;border-left:5px solid #16a34a;color:#166534}.bad{background:#fee2e2;border-left:5px solid #dc2626;color:#991b1b}label{display:block;font-weight:900;margin:16px 0 8px}input[type=text],input[type=file]{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:13px;font:inherit;background:#fff}.pin{font-size:28px;letter-spacing:.22em;text-align:center}.pallets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.pallets .box input{margin-top:8px;font-size:22px;text-align:center}.pallets .box strong{font-size:25px}@media(max-width:620px){.pallets{grid-template-columns:1fr}}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:14px;padding:12px 16px;font:900 16px Segoe UI,Arial,sans-serif;cursor:pointer}.primary{background:linear-gradient(135deg,#2563eb,#05b8ff);color:#fff}.ghost{background:#fff;border:1px solid #cbd5e1;color:#334155}.pod{border:1px solid #dbeafe;background:#f8fbff;border-radius:13px;padding:9px;margin:7px 0;font-weight:800}.small{font-size:12px;color:#64748b;line-height:1.4}.hidden{display:none!important}@media(max-width:620px){body{padding:10px}.card{padding:17px;border-radius:20px}.meta{grid-template-columns:1fr}.card h1{font-size:23px}}
</style>
</head>
<body><main class="wrap"><section class="card" id="app"><div class="brand">ESSENTRA · ExportHUB</div><h1>Abholbestätigung</h1><div class="msg info">Sichere Verbindung wird geprüft …</div></section></main>
<script>
(function(){
'use strict';
var API='/api';
function Q(v){return String(v==null?'':v).trim()}
function H(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]})}
function token(){try{return Q(new URLSearchParams(location.search).get('token'))}catch(e){return ''}}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Content-Type':'application/json','Accept':'application/json'},opt.headers||{});return fetch(API+path,opt).then(async function(r){var b={};try{b=await r.json()}catch(e){}if(!r.ok){var er=new Error(b.message||b.error||('HTTP '+r.status));er.status=r.status;throw er}return b})}
function fmt(v){var d=new Date(v);if(isNaN(d))return Q(v);return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function render(st,msg,kind){
 var app=document.getElementById('app'),used=!!st.confirmedAt,key='';try{key=sessionStorage.getItem('ehPickupKey:'+st.token)||''}catch(e){}
 var pods=(Array.isArray(st.podFiles)?st.podFiles:[]).filter(function(f){return Q(f.kind)!=='scan-confirmation'}),out=Math.max(0,Number(st.palletOut||0)),ret=Math.max(0,Number(st.palletReturned||0));
 app.innerHTML='<div class="brand">ESSENTRA · ExportHUB RC545</div><h1>Abholbestätigung</h1><div class="meta"><div class="box"><span>Referenz</span><strong>'+H(st.reference||'')+'</strong></div><div class="box"><span>Kunde / Empfänger</span><strong>'+H(st.customer||st.recipient||'')+'</strong></div></div>'+
 (out>0?'<div class="pallets"><div class="box"><span>Ausgehende Europaletten</span><strong>'+out+'</strong></div><div class="box"><span>Beim Tausch zurückerhalten</span>'+(used?'<strong>'+ret+'</strong>':'<input id="palletReturned" type="number" min="0" step="1" value="0" inputmode="numeric">')+'</div></div>':'')+
 (msg?'<div class="msg '+(kind||'info')+'">'+H(msg)+'</div>':'')+
 (used?'<div class="msg ok">Abholung bestätigt am <b>'+H(fmt(st.confirmedAt))+'</b>.<br>Der QR-Code ist dauerhaft gesperrt und kann keine zweite Buchung auslösen.</div>':'<label for="pin">Vierstellige PIN eingeben</label><input id="pin" class="pin" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]*" placeholder="••••"><div class="actions"><button class="primary" data-action="confirm">Abholung bestätigen</button></div>')+
 (used&&key?'<hr><h2>POD-Fotos hochladen</h2><p class="small">Bis zu 6 Fotos. Sie werden ausschließlich als PDF gespeichert. Die Upload-Freigabe ist zwei Stunden gültig.</p><input id="files" type="file" accept="image/*" capture="environment" multiple><div class="actions"><button class="primary" data-action="upload">POD als PDF speichern</button></div>':'')+
 (pods.length?'<h2>Gespeicherte POD-PDFs</h2>'+pods.map(function(f){return '<div class="pod"><b>'+H(f.name||'POD.pdf')+'</b> · '+H(fmt(f.uploadedAt||''))+'<br><a class="ghost" style="display:inline-flex;text-decoration:none;margin-top:6px" href="'+H(f.url||'#')+'" target="_blank" rel="noopener">POD-PDF herunterladen</a></div>'}).join(''):'');
 app._st=st
}
var activationRetries=0;
function load(msg,kind){var t=token(),app=document.getElementById('app');if(!t){app.innerHTML='<div class="brand">ESSENTRA · ExportHUB</div><h1>Abholbestätigung</h1><div class="msg bad">Der QR-Code enthält kein gültiges Token.</div>';return}api('/pickup-status?token='+encodeURIComponent(t),{method:'GET',headers:{'Accept':'application/json'}}).then(function(st){activationRetries=0;st.token=t;render(st,msg,kind)}).catch(function(e){if(e.status===404&&activationRetries<10){activationRetries++;app.innerHTML='<div class="brand">ESSENTRA · ExportHUB</div><h1>Abholbestätigung</h1><div class="msg info">Der QR-Code wird noch aktiviert. Neuer Versuch '+activationRetries+' / 10 …</div>';setTimeout(function(){load(msg,kind)},2000);return}app.innerHTML='<div class="brand">ESSENTRA · ExportHUB</div><h1>Abholbestätigung</h1><div class="msg bad">'+H(e.status===404?'Dieser QR-Code ist noch nicht aktiviert. Bitte die Sendung in ExportHUB erneut speichern.':e.status===410?'Dieser QR-Code ist abgelaufen.':'Der Abholdienst ist derzeit nicht erreichbar.')+'</div>'})}
function confirmPickup(){var app=document.getElementById('app'),st=app._st||{},pin=Q((document.getElementById('pin')||{}).value),returned=Math.max(0,Math.round(Number((document.getElementById('palletReturned')||{}).value||0)));if(!/^\d{4}$/.test(pin)){render(st,'Bitte die vierstellige PIN eingeben.','bad');return}api('/pickup-confirm',{method:'POST',body:JSON.stringify({token:st.token,pin:pin,palletReturned:returned})}).then(function(r){try{sessionStorage.setItem('ehPickupKey:'+st.token,r.uploadKey||'')}catch(e){}load('Abholung, Palettenausgang und Rückgabe wurden gemeinsam gespeichert.','ok')}).catch(function(e){load(e.status===409?'Die Abholung wurde bereits bestätigt.':e.status===423?'Zu viele falsche Eingaben. Bitte nach der Sperrzeit erneut versuchen.':e.status===401?'Die PIN ist nicht korrekt.':'Die Bestätigung konnte nicht gespeichert werden.','bad')})}
function fileData(file){return new Promise(function(resolve,reject){var img=new Image(),url=URL.createObjectURL(file);img.onload=function(){try{var max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);var raw=c.toDataURL('image/jpeg',.82).split(',')[1];URL.revokeObjectURL(url);resolve({name:file.name.replace(/\.[^.]+$/,'.jpg'),type:'image/jpeg',dataBase64:raw,size:Math.ceil(raw.length*.75)})}catch(e){reject(e)}};img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('Bild konnte nicht gelesen werden'))};img.src=url})}
function upload(){var app=document.getElementById('app'),st=app._st||{},input=document.getElementById('files'),files=input&&input.files?Array.from(input.files).slice(0,6):[],key='';try{key=sessionStorage.getItem('ehPickupKey:'+st.token)||''}catch(e){}if(!files.length){render(st,'Bitte mindestens ein Foto auswählen.','bad');return}if(!key){render(st,'Die Upload-Freigabe ist abgelaufen.','bad');return}Promise.all(files.map(fileData)).then(function(images){return api('/pickup-pod',{method:'POST',body:JSON.stringify({token:st.token,uploadKey:key,images:images})})}).then(function(){load('POD-Fotos wurden ausschließlich als PDF gespeichert.','ok')}).catch(function(e){load(e.status===401?'Die Upload-Freigabe ist ungültig oder abgelaufen.':'Der POD-Upload ist fehlgeschlagen.','bad')})}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-action]');if(!b)return;e.preventDefault();b.disabled=true;if(b.dataset.action==='confirm')confirmPickup();else upload()});
load();
})();
</script></body></html>
