name: RC969 State Performance Diagnose

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc969-state-performance-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: State Read Save Antwortpfade analysieren
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('api/exporthub-state/index.js','utf8');

          function contexts(label,needles,before=1800,after=5000,limit=12){
            console.log('\n=== '+label+' ===');
            let shown=0;
            for(const needle of needles){
              let pos=0;
              while((pos=s.indexOf(needle,pos))>=0&&shown<limit){
                shown++;
                console.log('\n--- '+needle+' @ '+pos+' ---\n'+s.slice(Math.max(0,pos-before),Math.min(s.length,pos+after)));
                pos+=needle.length;
              }
            }
            console.log('COUNT',shown);
          }

          contexts('Mode READ',['mode===\'read\'','mode === \'read\'','case \'read\'','case "read"'],2200,8000,8);
          contexts('Mode SAVE',['mode===\'save\'','mode === \'save\'','case \'save\'','case "save"'],2200,9000,8);
          contexts('sanitizeForClient Aufrufe',['sanitizeForClient('],1400,4500,20);
          contexts('Timing Headers',['timingHeaders('],1200,5000,20);
          contexts('Server Ms',['serverMs'],1000,4500,20);

          console.log('\n=== JSON stringify / response calls ===');
          const lines=s.split('\n');
          lines.forEach((line,i)=>{
            if(/JSON\.stringify|json\(|sanitizeForClient|timingHeaders/.test(line))console.log(String(i+1).padStart(5),line.trim().slice(0,1200));
          });
          NODE
