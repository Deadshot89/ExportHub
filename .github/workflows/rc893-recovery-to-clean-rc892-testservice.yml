name: RC893 Recovery to Clean RC892 TESTSERVICE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc893-recovery-rc892
  cancel-in-progress: false

jobs:
  recover-testservice:
    name: Recover clean RC892 TESTVERSION
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnose current broken TESTVERSION
        shell: bash
        run: |
          set -euo pipefail

          test -f TESTVERSION.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          src=Path("TESTVERSION.html").read_text(encoding="utf-8",errors="replace")

          version="unknown"
          m=re.search(r"var BUILD=Object\.freeze\(\{version:'([^']+)'",src)
          if m:
              version=m.group(1)

          print("Current TESTVERSION build:",version)
          print("Canonical module script id present:", 'id="exporthub-canonical-modules"' in src)
          print("Canonical manifest assignment present:", "window.__EXPORTHUB_CANONICAL_MODULE_MANIFEST__" in src)
          print("RC893 task marker present:", "exporthub-rc893-canonical-task-source" in src)

          if version=="RC892" and \
             'id="exporthub-canonical-modules"' in src and \
             "window.__EXPORTHUB_CANONICAL_MODULE_MANIFEST__" in src and \
             "exporthub-rc893-canonical-task-source" not in src:
              raise SystemExit("Recovery ist bereits abgeschlossen: sauberer RC892-Stand erkannt.")

          print("Recovery erforderlich.")
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Recovery Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Backup current broken state
        shell: bash
        run: |
          set -euo pipefail

          TAG="backup-broken-before-rc893-recovery-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Broken-state backup already exists: $TAG"
          else
            git tag -a "$TAG" -m "Broken TESTVERSION before RC893 recovery"
            git push origin "refs/tags/$TAG"
            echo "Created broken-state backup: $TAG"
          fi

      - name: Locate latest valid RC892 backup
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re, sys

          def sh(*args):
              return subprocess.check_output(args,text=True).strip()

          refs=sh(
              "git","for-each-ref",
              "--sort=-creatordate",
              "--format=%(refname:short)",
              "refs/tags/backup-before-rc893*"
          ).splitlines()

          # Fallback: include any recent backup tag if naming changed.
          if not refs:
              refs=sh(
                  "git","for-each-ref",
                  "--sort=-creatordate",
                  "--format=%(refname:short)",
                  "refs/tags/backup-*"
              ).splitlines()

          print("Backup candidates:",len(refs))

          selected=None
          reasons=[]

          for tag in refs:
              if not tag.strip():
                  continue
              try:
                  html=subprocess.check_output(
                      ["git","show",f"{tag}:TESTVERSION.html"],
                      text=True,
                      stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  continue

              checks={
                  "RC892 build":"var BUILD=Object.freeze({version:'RC892',cache:'892',loginReturn:'/TESTVERSION.html?v=892'});" in html,
                  "canonical script id":'id="exporthub-canonical-modules"' in html,
                  "canonical manifest":"window.__EXPORTHUB_CANONICAL_MODULE_MANIFEST__" in html,
                  "RC892 render fix":"/* exporthub-rc892-render-rootfix */" in html,
                  "RC892 Lieferavis":"rc892LieferAvisBtn" in html,
                  "RC892 shipment grid":"rc892-shipment-grid" in html,
                  "no RC893 task marker":"exporthub-rc893-canonical-task-source" not in html
              }

              print(tag,checks)

              if all(checks.values()):
                  selected=tag
                  Path("/tmp/rc892-recovery.html").write_text(html,encoding="utf-8")
                  break
              else:
                  reasons.append((tag,[k for k,v in checks.items() if not v]))

          if not selected:
              print("No valid RC892 backup tag found.")
              for tag,missing in reasons[:15]:
                  print(" -",tag,"missing:",", ".join(missing))
              sys.exit(1)

          Path("/tmp/rc892-selected-tag.txt").write_text(selected,encoding="utf-8")
          print("Selected RC892 backup:",selected)
          PY

      - name: Validate canonical module block before restore
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          src=Path("/tmp/rc892-recovery.html").read_text(encoding="utf-8",errors="replace")

          m=re.search(
              r'<script\b[^>]*\bid=["\']exporthub-canonical-modules["\'][^>]*>(.*?)</script>',
              src,
              flags=re.I|re.S
          )
          if not m:
              raise SystemExit("Canonical module script block not found in RC892 backup.")

          block=m.group(1).strip()
          if "window.__EXPORTHUB_CANONICAL_MODULE_MANIFEST__" not in block:
              raise SystemExit("Canonical manifest assignment missing inside script block.")

          Path("/tmp/rc892-canonical-block.js").write_text(block,encoding="utf-8")
          print("Canonical block length:",len(block))
          PY

          node --check /tmp/rc892-canonical-block.js

          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');

          const code=fs.readFileSync('/tmp/rc892-canonical-block.js','utf8');
          const context={window:{}};
          vm.createContext(context);
          vm.runInContext(code,context,{timeout:5000});

          const manifest=context.window.__EXPORTHUB_CANONICAL_MODULE_MANIFEST__;

          if(!Array.isArray(manifest)){
            throw new Error('Canonical module manifest is not an array');
          }
          if(manifest.length===0){
            throw new Error('Canonical module manifest is empty');
          }

          console.log('Canonical manifest entries:',manifest.length);
          console.log('Canonical manifest runtime validation: PASS');
          NODE

      - name: Snapshot protected files before restore
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          git diff --quiet || {
            echo "::error::Working tree is not clean before recovery."
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          protected=[
              "index.html",
              "customer-avis.html",
              "location.html",
              "pickup.html",
              "pod-notfall.html",
              "staticwebapp.config.json",
              "staticwebapp.testservice.config.json"
          ]

          for file in protected:
              p=Path(file)
              if p.exists():
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  Path("/tmp/protected-"+file.replace("/","_")+".sha").write_text(h)

          print("Protected file hashes captured.")
          PY

      - name: Restore TESTVERSION from validated RC892 backup
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/rc892-recovery.html TESTVERSION.html

          echo "Restored TESTVERSION.html from:"
          cat /tmp/rc892-selected-tag.txt

      - name: GREEN validate recovered RC892
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "var BUILD=Object.freeze({version:'RC892',cache:'892',loginReturn:'/TESTVERSION.html?v=892'});" TESTVERSION.html
          grep -Fq 'id="exporthub-canonical-modules"' TESTVERSION.html
          grep -Fq "window.__EXPORTHUB_CANONICAL_MODULE_MANIFEST__" TESTVERSION.html
          grep -Fq "/* exporthub-rc892-render-rootfix */" TESTVERSION.html
          grep -Fq "rc892LieferAvisBtn" TESTVERSION.html
          grep -Fq "rc892-shipment-grid" TESTVERSION.html

          if grep -Fq "exporthub-rc893-canonical-task-source" TESTVERSION.html; then
            echo "::error::RC893 task marker still present after recovery."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          src=Path("TESTVERSION.html").read_text(encoding="utf-8",errors="replace")

          # Exact recovery file equality.
          expected=Path("/tmp/rc892-recovery.html").read_bytes()
          actual=Path("TESTVERSION.html").read_bytes()
          if expected!=actual:
              raise SystemExit("Recovered TESTVERSION differs from validated RC892 backup.")

          # Confirm protected files are unchanged.
          protected=[
              "index.html",
              "customer-avis.html",
              "location.html",
              "pickup.html",
              "pod-notfall.html",
              "staticwebapp.config.json",
              "staticwebapp.testservice.config.json"
          ]

          for file in protected:
              p=Path(file)
              sha_file=Path("/tmp/protected-"+file.replace("/","_")+".sha")
              if not p.exists() or not sha_file.exists():
                  continue
              before=sha_file.read_text().strip()
              after=hashlib.sha256(p.read_bytes()).hexdigest()
              if before!=after:
                  raise SystemExit("Protected file changed: "+file)

          # Validate only one canonical module script id.
          count=len(re.findall(
              r'<script\b[^>]*\bid=["\']exporthub-canonical-modules["\']',
              src,
              flags=re.I
          ))
          if count!=1:
              raise SystemExit(f"Expected exactly 1 canonical module script block, found {count}")

          print("Recovered RC892 validation: PASS")
          PY

      - name: Verify recovery scope
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t CHANGED < <(git diff --name-only)

          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "TESTVERSION.html" ]]; then
            echo "::error::Recovery may only modify TESTVERSION.html."
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi

          if ! git diff --quiet -- \
            index.html \
            api \
            customer-avis.html \
            location.html \
            pickup.html \
            pod-notfall.html \
            staticwebapp.config.json \
            staticwebapp.testservice.config.json \
            .github/workflows
          then
            echo "::error::Protected production/API/deploy files were modified."
            exit 1
          fi

      - name: Commit clean RC892 recovery
        shell: bash
        run: |
          set -euo pipefail

          git add TESTVERSION.html
          git commit -m "TESTSERVICE recovery: restore validated clean RC892 canonical modules"
          git push origin main

      - name: Recovery summary
        if: success()
        shell: bash
        run: |
          {
            echo "## ExportHUB RC893 Recovery"
            echo
            echo "- TESTVERSION restored to validated clean RC892"
            echo "- canonical module script found exactly once"
            echo "- canonical manifest executed in Node VM and verified as a non-empty array"
            echo "- RC892 render root fix retained"
            echo "- RC892 Lieferavis retained"
            echo "- RC892 shipment grid retained"
            echo "- RC893 task-source marker removed"
            echo "- production, APIs and deploy configuration unchanged"
            echo
            echo "Recovered from backup tag:"
            echo "\`$(cat /tmp/rc892-selected-tag.txt)\`"
            echo
            echo "Next: run the normal ExportHUB TESTSERVICE Deploy."
          } >> "$GITHUB_STEP_SUMMARY"
