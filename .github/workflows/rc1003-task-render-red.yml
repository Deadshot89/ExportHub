name: RC1003 Aufgaben Syntax

on:
  workflow_dispatch:
  push:
    branches:
      - rc1003-task-render-fix-pickup-prep
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'test/rc1003-task-render-syntax.test.mjs'
      - '.github/workflows/rc1003-task-render-red.yml'

permissions:
  contents: read

concurrency:
  group: rc1003-task-render-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: RC874-Helfer vor RC1002 extrahieren
        shell: bash
        run: |
          set -euo pipefail
          git show 9e0817070134434ef997a0f0d04b04f5de3eb3cb:TESTVERSION.html > rc1003-before-rc1002.html
          node <<'NODE'
          const fs=require('fs');
          const old=fs.readFileSync('rc1003-before-rc1002.html','utf8');
          const start=old.indexOf('function taskGroupNameRC874(t){');
          const end=old.indexOf('function taskGroupOpenRC874',start);
          if(start<0||end<=start)throw new Error('historischer RC874-Block nicht gefunden');
          const block=old.slice(start,end);
          fs.writeFileSync('rc1003-old-rc874-block.txt',block);
          for(const name of ['taskDisplayKeyRC874','taskDedupeScoreRC874','dedupeVisibleTasksRC874','taskGroupStateRC874','TASK_GROUP_STORE_RC874']){
            console.log(`${name}=${block.includes(name)}`);
          }
          console.log(block);
          NODE
      - name: Historischen Block hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rc1003-old-rc874-block
          path: rc1003-old-rc874-block.txt
          retention-days: 1
      - name: Aktuellen Aufgabenvertrag prüfen
        run: |
          node --test .github/rc996/tasks-contract.test.mjs
          node --test test/rc1003-task-render-syntax.test.mjs
