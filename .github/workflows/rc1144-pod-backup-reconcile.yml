name: RC1144 POD Backup Reconcile

on:
  workflow_run:
    workflows:
      - ExportHUB RC1112 Drei-Umgebungen Deploy
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      reference:
        description: 'Optional: gezielt eine Sendungsreferenz prüfen/nachholen'
        required: false
        type: string
      environment:
        description: 'Umgebung für einen manuellen Nachweis'
        required: true
        default: production
        type: choice
        options:
          - production
          - testservice
          - both

permissions:
  contents: read
  id-token: write

concurrency:
  group: rc1144-pod-backup-reconcile
  cancel-in-progress: false

jobs:
  testservice:
    name: POD-Backup-Nachholung TESTSERVICE
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') && (github.event_name != 'workflow_dispatch' || inputs.environment == 'testservice' || inputs.environment == 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Offene TESTSERVICE POD-Backups nachholen
        shell: bash
        env:
          BASE_URL: https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net
          TARGET_ENV: testservice
          TARGET_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.reference || '' }}
        run: |
          set -euo pipefail
          set +x

          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-pod-backup-reconcile" \
              | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"

          continuation_token=''
          for batch in $(seq 1 200); do
            previous_continuation_token="$continuation_token"
            payload="$(CONTINUATION_TOKEN="$continuation_token" node -e "const reference=String(process.env.TARGET_REFERENCE||'').trim().toUpperCase();process.stdout.write(JSON.stringify({environment:process.env.TARGET_ENV,limit:25,scanPageSize:10,reference,drainAll:!reference,continuationToken:String(process.env.CONTINUATION_TOKEN||'')}))")"
            response_file="$(mktemp)"
            http_code="$(
              curl -sS -L -o "$response_file" -w '%{http_code}' \
                -H "Content-Type: application/json" \
                -H "x-exporthub-github-oidc: $oidc_token" \
                -H "x-exporthub-environment: $TARGET_ENV" \
                -d "$payload" \
                "$BASE_URL/api/pod-backup-reconcile" || true
            )"
            result="$(cat "$response_file")"
            rm -f "$response_file"

            verdict="$(printf '%s\n' "$result" | node -e "
              let s='';const status=Number(process.argv[1]||0);process.stdin.on('data',c=>s+=c).on('end',()=>{
                let v={};try{v=JSON.parse(s||'{}')}catch(_){}
                const pendingCodes=Array.from(new Set((Array.isArray(v.pending)?v.pending:[]).map(x=>String(x&&x.error||'').split(':',1)[0].trim()).filter(Boolean))).slice(0,10);
                const drivePendingCodes=Array.from(new Set((Array.isArray(v.drivePending)?v.drivePending:[]).map(x=>String(x&&x.error||'').split(':',1)[0].trim()).filter(Boolean))).slice(0,10);
                const driveProviderCodes=Array.from(new Set((Array.isArray(v.drivePending)?v.drivePending:[]).map(x=>String(x&&x.providerCode||'').replace(/[^A-Za-z0-9_.-]/g,'').slice(0,80)).filter(Boolean))).slice(0,10);
                const errorCodes=Array.from(new Set((Array.isArray(v.errors)?v.errors:[]).map(x=>String(x&&x.code||'').trim()).filter(Boolean))).slice(0,10);
                const safe={batch:Number(process.argv[2]||0),httpStatus:status,code:v.code,message:v.message,environment:v.environment,reference:v.reference,backupMode:v.backupMode,drainAll:v.drainAll,graphConfigured:v.graphConfigured,missing:Array.isArray(v.missing)?v.missing:[],targetFolder:v.targetFolder,scanned:v.scanned,scanPageSize:v.scanPageSize,scanComplete:v.scanComplete,eligible:v.eligible,selected:v.selected,skippedRecent:v.skippedRecent,driveBackfillEligible:v.driveBackfillEligible,driveBackfillSelected:v.driveBackfillSelected,driveBackfillSkippedRecent:v.driveBackfillSkippedRecent,savedCount:v.savedCount,alreadySavedCount:v.alreadySavedCount,pendingCount:v.pendingCount,driveSavedCount:v.driveSavedCount,drivePendingCount:v.drivePendingCount,errorCount:v.errorCount,verifiedCount:v.verifiedCount,repairedStateCount:v.repairedStateCount,integrityChecks:v.integrityChecks,remoteWorkBudget:v.remoteWorkBudget,pageWorkDeferred:v.pageWorkDeferred,requiredWorkDeferred:v.requiredWorkDeferred,optionalDriveWorkDeferred:v.optionalDriveWorkDeferred,pendingCodes,drivePendingCodes,driveProviderCodes,errorCodes,target:v.target&&{reference:v.target.reference,status:v.target.status,matchedCount:v.target.matchedCount,podReadyCount:v.target.podReadyCount,alreadySavedCount:v.target.alreadySavedCount,savedNowCount:v.target.savedNowCount,pendingCount:v.target.pendingCount,errorCount:v.target.errorCount}};
                console.error('TESTSERVICE POD reconcile',JSON.stringify(safe));
                if(status<200||status>=300||!v.ok||Number(v.errorCount||0)>0||Number(v.pendingCount||0)>0)process.exit(3);
                if(v.reference){if(!v.target||!['already-saved','saved-now'].includes(v.target.status))process.exit(5);process.stdout.write('done');return}
                const eligible=Math.max(0,Number(v.eligible||0)),selected=Math.max(0,Number(v.selected||0)),skipped=Math.max(0,Number(v.skippedRecent||0));
                const requiredDone=eligible===0&&selected===0&&skipped===0&&!v.nextContinuationToken&&!v.requiredWorkDeferred;
                if(requiredDone){process.stdout.write('done');return}
                if(selected<=0&&!v.nextContinuationToken&&!v.requiredWorkDeferred)process.exit(7);
                process.stdout.write('again');
              })" "$http_code" "$batch")"
            continuation_token="$(printf '%s\n' "$result" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{let v={};try{v=JSON.parse(s||'{}')}catch(_){};process.stdout.write(String(v.nextContinuationToken||''))})")"
            progress_count="$(printf '%s\n' "$result" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{let v={};try{v=JSON.parse(s||'{}')}catch(_){};const n=x=>Math.max(0,Number(x||0));process.stdout.write(String(n(v.integrityChecks)+n(v.repairedStateCount)+n(v.savedCount)+n(v.teamRelinkedCount)+n(v.teamRelinkSkippedCount)))})")"

            if [ "$verdict" = "done" ]; then
              exit 0
            fi
            if [ -n "$continuation_token" ] && [ "$continuation_token" = "$previous_continuation_token" ] && [ "$progress_count" -le 0 ]; then
              echo 'TESTSERVICE POD reconcile: Continuation-Token bewegt sich ohne Fortschritt nicht weiter.' >&2
              exit 9
            fi
          done

          echo 'TESTSERVICE POD reconcile: Backlog nach 200 Batches noch nicht vollständig geleert.' >&2
          exit 8
  production:
    name: POD-Backup-Nachholung PRODUCTION
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') && (github.event_name != 'workflow_dispatch' || inputs.environment == 'production' || inputs.environment == 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Offene PRODUCTION POD-Backups nachholen
        shell: bash
        env:
          BASE_URL: https://wonderful-forest-0f315e310.7.azurestaticapps.net
          TARGET_ENV: production
          TARGET_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.reference || (github.event_name == 'workflow_run' || github.event_name == 'schedule') && 'XG4YNN' || '' }}
        run: |
          set -euo pipefail
          set +x

          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-pod-backup-reconcile" \
              | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"

          continuation_token=''
          for batch in $(seq 1 200); do
            previous_continuation_token="$continuation_token"
            payload="$(CONTINUATION_TOKEN="$continuation_token" node -e "const reference=String(process.env.TARGET_REFERENCE||'').trim().toUpperCase();process.stdout.write(JSON.stringify({environment:process.env.TARGET_ENV,limit:25,scanPageSize:10,reference,drainAll:!reference,continuationToken:String(process.env.CONTINUATION_TOKEN||'')}))")"
            response_file="$(mktemp)"
            http_code="$(
              curl -sS -L -o "$response_file" -w '%{http_code}' \
                -H "Content-Type: application/json" \
                -H "x-exporthub-github-oidc: $oidc_token" \
                -H "x-exporthub-environment: $TARGET_ENV" \
                -d "$payload" \
                "$BASE_URL/api/pod-backup-reconcile" || true
            )"
            result="$(cat "$response_file")"
            rm -f "$response_file"

            verdict="$(printf '%s\n' "$result" | node -e "
              let s='';const status=Number(process.argv[1]||0);process.stdin.on('data',c=>s+=c).on('end',()=>{
                let v={};try{v=JSON.parse(s||'{}')}catch(_){}
                const pendingCodes=Array.from(new Set((Array.isArray(v.pending)?v.pending:[]).map(x=>String(x&&x.error||'').split(':',1)[0].trim()).filter(Boolean))).slice(0,10);
                const drivePendingCodes=Array.from(new Set((Array.isArray(v.drivePending)?v.drivePending:[]).map(x=>String(x&&x.error||'').split(':',1)[0].trim()).filter(Boolean))).slice(0,10);
                const driveProviderCodes=Array.from(new Set((Array.isArray(v.drivePending)?v.drivePending:[]).map(x=>String(x&&x.providerCode||'').replace(/[^A-Za-z0-9_.-]/g,'').slice(0,80)).filter(Boolean))).slice(0,10);
                const errorCodes=Array.from(new Set((Array.isArray(v.errors)?v.errors:[]).map(x=>String(x&&x.code||'').trim()).filter(Boolean))).slice(0,10);
                const safe={batch:Number(process.argv[2]||0),httpStatus:status,code:v.code,message:v.message,environment:v.environment,reference:v.reference,backupMode:v.backupMode,drainAll:v.drainAll,graphConfigured:v.graphConfigured,missing:Array.isArray(v.missing)?v.missing:[],targetFolder:v.targetFolder,scanned:v.scanned,scanPageSize:v.scanPageSize,scanComplete:v.scanComplete,eligible:v.eligible,selected:v.selected,skippedRecent:v.skippedRecent,driveBackfillEligible:v.driveBackfillEligible,driveBackfillSelected:v.driveBackfillSelected,driveBackfillSkippedRecent:v.driveBackfillSkippedRecent,savedCount:v.savedCount,alreadySavedCount:v.alreadySavedCount,pendingCount:v.pendingCount,driveSavedCount:v.driveSavedCount,drivePendingCount:v.drivePendingCount,errorCount:v.errorCount,verifiedCount:v.verifiedCount,repairedStateCount:v.repairedStateCount,integrityChecks:v.integrityChecks,remoteWorkBudget:v.remoteWorkBudget,pageWorkDeferred:v.pageWorkDeferred,requiredWorkDeferred:v.requiredWorkDeferred,optionalDriveWorkDeferred:v.optionalDriveWorkDeferred,pendingCodes,drivePendingCodes,driveProviderCodes,errorCodes,target:v.target&&{reference:v.target.reference,status:v.target.status,matchedCount:v.target.matchedCount,podReadyCount:v.target.podReadyCount,alreadySavedCount:v.target.alreadySavedCount,savedNowCount:v.target.savedNowCount,pendingCount:v.target.pendingCount,errorCount:v.target.errorCount}};
                console.error('PRODUCTION POD reconcile',JSON.stringify(safe));
                if(status<200||status>=300||!v.ok||Number(v.errorCount||0)>0||Number(v.pendingCount||0)>0)process.exit(4);
                if(v.reference){if(!v.target||!['already-saved','saved-now'].includes(v.target.status))process.exit(6);process.stdout.write('done');return}
                const eligible=Math.max(0,Number(v.eligible||0)),selected=Math.max(0,Number(v.selected||0)),skipped=Math.max(0,Number(v.skippedRecent||0));
                const requiredDone=eligible===0&&selected===0&&skipped===0&&!v.nextContinuationToken&&!v.requiredWorkDeferred;
                if(requiredDone){process.stdout.write('done');return}
                if(selected<=0&&!v.nextContinuationToken&&!v.requiredWorkDeferred)process.exit(7);
                process.stdout.write('again');
              })" "$http_code" "$batch")"
            continuation_token="$(printf '%s\n' "$result" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{let v={};try{v=JSON.parse(s||'{}')}catch(_){};process.stdout.write(String(v.nextContinuationToken||''))})")"
            progress_count="$(printf '%s\n' "$result" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{let v={};try{v=JSON.parse(s||'{}')}catch(_){};const n=x=>Math.max(0,Number(x||0));process.stdout.write(String(n(v.integrityChecks)+n(v.repairedStateCount)+n(v.savedCount)+n(v.teamRelinkedCount)+n(v.teamRelinkSkippedCount)))})")"

            if [ "$verdict" = "done" ]; then
              exit 0
            fi
            if [ -n "$continuation_token" ] && [ "$continuation_token" = "$previous_continuation_token" ] && [ "$progress_count" -le 0 ]; then
