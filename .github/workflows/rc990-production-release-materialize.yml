name: RC990 Production Release Materialize

on:
  push:
    branches:
      - rc990-production-release
    paths:
      - '.github/workflows/rc990-production-release-materialize.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc990-production-release
          fetch-depth: 4
      - name: Print exact prepareProduction transform
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('TESTVERSION.html','utf8');
          function functionSource(name){
            const re=new RegExp(`function\\s+${name}\\s*\\([^)]*\\)\\s*\\{`);
            const m=re.exec(source); if(!m) throw new Error(name+' fehlt');
            let i=m.index+m[0].length-1,depth=0,quote='',esc=false,regex=false,cls=false;
            for(;i<source.length;i++){
              const ch=source[i],prev=source[i-1];
              if(quote){ if(esc)esc=false; else if(ch==='\\\\')esc=true; else if(ch===quote)quote=''; continue; }
              if(regex){ if(esc)esc=false; else if(ch==='\\\\')esc=true; else if(ch==='[')cls=true; else if(ch===']')cls=false; else if(ch==='/'&&!cls)regex=false; continue; }
              if(ch==='"'||ch==="'"||ch==='`'){quote=ch;continue;}
              if(ch==='/' && prev!=='/' && prev!=='*'){
                let j=i-1; while(j>=0&&/\s/.test(source[j]))j--; const p=source[j];
                if(!p||'([=,:;!&|?{}\n'.includes(p)){regex=true;continue;}
              }
              if(ch==='{')depth++; else if(ch==='}'&&--depth===0){console.log(source.slice(m.index,i+1));return;}
            }
            throw new Error('unvollständig');
          }
          functionSource('prepareProduction');
          NODE
