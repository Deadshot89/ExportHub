<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Task</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;background:#f4f7fb;color:#172033}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef5ff 0,#f8fafc 45%,#f4f7fb 100%);padding:32px 18px}main{width:min(760px,100%);margin:0 auto}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px;font-weight:800;letter-spacing:.02em}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#1d4ed8;color:white;box-shadow:0 10px 28px rgba(29,78,216,.22)}
    #status{min-height:24px;margin:0 0 14px;color:#475569}#status[data-kind="error"]{padding:14px 16px;border:1px solid #fecaca;border-radius:14px;background:#fff1f2;color:#9f1239}
    .card{background:rgba(255,255,255,.94);border:1px solid #dbe4ef;border-radius:22px;padding:28px;box-shadow:0 18px 50px rgba(15,23,42,.09)}h1{font-size:clamp(1.6rem,4vw,2.25rem);line-height:1.15;margin:0 0 12px}p{line-height:1.6;color:#475569}dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:24px 0 0}dl div{padding:12px 0;border-top:1px solid #e2e8f0}dt{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:700}dd{margin:4px 0 0;font-weight:650;overflow-wrap:anywhere}section{margin-top:24px}ul{padding-left:20px;line-height:1.7}
    @media(max-width:640px){body{padding:18px 12px}.card{border-radius:18px;padding:20px}dl{grid-template-columns:1fr}.brand{margin-bottom:14px}}
    @media(prefers-color-scheme:dark){:root{background:#08111f;color:#e5eefc}body{background:linear-gradient(180deg,#0b1b35,#08111f)}.card{background:rgba(15,23,42,.96);border-color:#26364d}.card p,#status{color:#b7c4d8}dl div{border-color:#26364d}dt{color:#94a3b8}#status[data-kind="error"]{background:#3b111b;border-color:#7f1d1d;color:#fecdd3}}
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="ExportHUB360"><span class="mark" aria-hidden="true">EH</span><span>ExportHUB360</span></div>
    <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
    <article id="taskCard" class="card" hidden>
      <h1 id="taskTitle"></h1>
      <p id="taskDescription" hidden></p>
      <dl id="taskMeta"></dl>
      <section id="taskChecklist" hidden><h2 id="taskChecklistTitle"></h2><ul id="taskChecklistList"></ul></section>
    </article>
  </main>
  <script defer src="/assets/task-public-read.js?v=2000"></script>
</body>
</html>
