name: ExportHUB Actions Cleanup Stage 3 Recovery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: exporthub-actions-cleanup-stage-3-recovery
  cancel-in-progress: false

jobs:
  cleanup-actions:
    name: Resume Actions cleanup safely
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fresh inventory of remaining workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id,.workflow_id,.name,.status,(.conclusion // ""),.created_at] | @tsv' \
            > /tmp/all-runs.tsv

          TOTAL="$(wc -l < /tmp/all-runs.tsv | tr -d ' ')"
          echo "Aktuell noch vorhandene Workflow-Runs: $TOTAL"

          echo "Statusverteilung:"
          awk -F '\t' '{count[$4]++} END {for (s in count) print " - " s ": " count[s]}' /tmp/all-runs.tsv | sort

      - name: Select runs and workflow definitions to preserve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          CURRENT_RUN="$GITHUB_RUN_ID"

          CURRENT_WORKFLOW_ID="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/actions/runs/$CURRENT_RUN" \
              --jq '.workflow_id'
          )"

          : > /tmp/keep-runs.txt
          : > /tmp/keep-workflows.txt

          echo "$CURRENT_RUN" >> /tmp/keep-runs.txt
          echo "$CURRENT_WORKFLOW_ID" >> /tmp/keep-workflows.txt

          # Never attempt to delete a queued or in-progress run.
          awk -F '\t' '$4!="completed" {print $1}' /tmp/all-runs.tsv >> /tmp/keep-runs.txt
          awk -F '\t' '$4!="completed" {print $2}' /tmp/all-runs.tsv >> /tmp/keep-workflows.txt

          choose_latest() {
            local mode="$1"
            local pattern="$2"
            local line=""

            if [[ "$mode" == "exact" ]]; then
              line="$(
                awk -F '\t' -v p="$pattern" \
                  '$3==p && $4=="completed" && $5=="success" {print; exit}' \
                  /tmp/all-runs.tsv
              )"
              if [[ -z "$line" ]]; then
                line="$(
                  awk -F '\t' -v p="$pattern" \
                    '$3==p && $4=="completed" {print; exit}' \
                    /tmp/all-runs.tsv
                )"
              fi
            else
              line="$(
                awk -F '\t' -v p="$pattern" \
                  'index($3,p)==1 && $4=="completed" && $5=="success" {print; exit}' \
                  /tmp/all-runs.tsv
              )"
              if [[ -z "$line" ]]; then
                line="$(
                  awk -F '\t' -v p="$pattern" \
                    'index($3,p)==1 && $4=="completed" {print; exit}' \
                    /tmp/all-runs.tsv
                )"
              fi
            fi

            if [[ -n "$line" ]]; then
              local run_id workflow_id name status conclusion created
              IFS=$'\t' read -r run_id workflow_id name status conclusion created <<< "$line"
              echo "$run_id" >> /tmp/keep-runs.txt
              echo "$workflow_id" >> /tmp/keep-workflows.txt
              echo "BEHALTEN: $name | run=$run_id | workflow=$workflow_id | $conclusion"
            else
              echo "HINWEIS: Kein abgeschlossener Run gefunden für '$pattern'."
            fi
          }

          choose_latest exact "ExportHUB PRODUCTION Deploy"
          choose_latest exact "ExportHUB TESTSERVICE Deploy"
          choose_latest exact "Build ExportHUB Android Test APK"
          choose_latest prefix "RC888"

          sort -u /tmp/keep-runs.txt -o /tmp/keep-runs.txt
          sort -u /tmp/keep-workflows.txt -o /tmp/keep-workflows.txt

          echo
          echo "Geschützte Run-IDs:"
          cat /tmp/keep-runs.txt

      - name: RED audit remaining obsolete completed runs
        shell: bash
        run: |
          set -euo pipefail

          awk -F '\t' '$4=="completed" {print $1}' /tmp/all-runs.tsv | sort -u > /tmp/completed-run-ids.txt
          grep -vxFf /tmp/keep-runs.txt /tmp/completed-run-ids.txt > /tmp/delete-runs.txt || true

          DELETE_COUNT="$(wc -l < /tmp/delete-runs.txt | tr -d ' ')"
          echo "Noch zu löschende abgeschlossene Runs: $DELETE_COUNT"

          if [[ "$DELETE_COUNT" -eq 0 ]]; then
            echo "Keine alten abgeschlossenen Runs mehr vorhanden."
          fi

      - name: Delete obsolete completed runs with retry and diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          API="https://api.github.com/repos/$REPO/actions/runs"
          : > /tmp/delete-failures.tsv
          : > /tmp/delete-success.txt

          delete_one() {
            local id="$1"
            local body code attempt

            body="$(mktemp)"

            for attempt in 1 2 3 4; do
              code="$(
                curl -sS \
                  --connect-timeout 10 \
                  --max-time 30 \
                  -o "$body" \
                  -w '%{http_code}' \
                  -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "$API/$id" || echo "000"
              )"

              case "$code" in
                204)
                  echo "$id" >> /tmp/delete-success.txt
                  echo "gelöscht: $id"
                  rm -f "$body"
                  return 0
                  ;;
                404)
                  # It may have been removed by the previous Stage 3 run.
                  echo "$id" >> /tmp/delete-success.txt
                  echo "bereits gelöscht: $id"
                  rm -f "$body"
                  return 0
                  ;;
                403|429)
                  echo "Rate-/Berechtigungsantwort HTTP $code für $id, Versuch $attempt/4."
                  if [[ "$attempt" -lt 4 ]]; then
                    sleep $((attempt * 15))
                    continue
                  fi
                  ;;
                409|422)
                  echo "Run $id ist momentan nicht löschbar (HTTP $code)."
                  ;;
                500|502|503|504|000)
                  echo "Temporärer HTTP-Fehler $code für $id, Versuch $attempt/4."
                  if [[ "$attempt" -lt 4 ]]; then
                    sleep $((attempt * 10))
                    continue
                  fi
                  ;;
              esac

              message="$(tr '\n' ' ' < "$body" | tr '\t' ' ' | cut -c1-500)"
              printf '%s\t%s\t%s\n' "$id" "$code" "$message" >> /tmp/delete-failures.tsv
              echo "NICHT GELÖSCHT: $id | HTTP $code | $message"
              rm -f "$body"
              return 0
            done

            message="$(tr '\n' ' ' < "$body" | tr '\t' ' ' | cut -c1-500)"
            printf '%s\t%s\t%s\n' "$id" "${code:-000}" "$message" >> /tmp/delete-failures.tsv
            rm -f "$body"
            return 0
          }

          TOTAL="$(wc -l < /tmp/delete-runs.txt | tr -d ' ')"
          CURRENT=0

          while IFS= read -r id; do
            [[ -z "$id" ]] && continue
            CURRENT=$((CURRENT+1))
            echo "[$CURRENT/$TOTAL] Run $id"
            delete_one "$id"

            # Small delay avoids GitHub secondary rate limiting.
            sleep 0.35
          done < /tmp/delete-runs.txt

          SUCCESS="$(wc -l < /tmp/delete-success.txt | tr -d ' ')"
          FAILURES="$(wc -l < /tmp/delete-failures.tsv | tr -d ' ')"

          echo
          echo "Löschung abgeschlossen: $SUCCESS erfolgreich/bereits weg, $FAILURES nicht gelöscht."

          if [[ "$FAILURES" -gt 0 ]]; then
            echo "Nicht gelöschte Runs:"
            column -t -s $'\t' /tmp/delete-failures.tsv || cat /tmp/delete-failures.tsv
          fi

      - name: Disable obsolete workflow definitions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPO/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id,.name,.path,.state] | @tsv' \
            > /tmp/all-workflows.tsv

          : > /tmp/workflows-to-delete-manually.tsv

          while IFS=$'\t' read -r workflow_id name path state; do
            if grep -qxF "$workflow_id" /tmp/keep-workflows.txt; then
              echo "AKTIV BEHALTEN: $name | $path"
              continue
            fi

            printf '%s\t%s\t%s\t%s\n' "$workflow_id" "$name" "$path" "$state" \
              >> /tmp/workflows-to-delete-manually.tsv

            if [[ "$state" == "active" ]]; then
              if gh api \
                --method PUT \
                -H "Accept: application/vnd.github+json" \
                "repos/$REPO/actions/workflows/$workflow_id/disable" >/dev/null 2>&1
              then
                echo "DEAKTIVIERT: $name | $path"
              else
                echo "KONNTE NICHT DEAKTIVIERT WERDEN: $name | $path"
              fi
            else
              echo "BEREITS INAKTIV: $name | $path"
            fi
          done < /tmp/all-workflows.tsv

      - name: GREEN verify remaining history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id,.name,.status,(.conclusion // ""),.created_at] | @tsv' \
            > /tmp/runs-after.tsv

          REMAINING="$(wc -l < /tmp/runs-after.tsv | tr -d ' ')"
          COMPLETED_OBSOLETE=0

          while IFS=$'\t' read -r id name status conclusion created; do
            if [[ "$status" == "completed" ]] && ! grep -qxF "$id" /tmp/keep-runs.txt; then
              COMPLETED_OBSOLETE=$((COMPLETED_OBSOLETE+1))
            fi
          done < /tmp/runs-after.tsv

          echo "Verbleibende Runs insgesamt: $REMAINING"
          echo "Davon noch alte abgeschlossene Runs: $COMPLETED_OBSOLETE"

          cat /tmp/runs-after.tsv

          if [[ "$COMPLETED_OBSOLETE" -gt 0 ]]; then
            echo "::warning::$COMPLETED_OBSOLETE alte abgeschlossene Runs konnten noch nicht gelöscht werden. Die HTTP-Ursachen stehen in der Summary."
          else
            echo "GREEN: Keine alten abgeschlossenen Runs mehr vorhanden."
          fi

      - name: Publish cleanup result and exact manual workflow deletion list
        if: always()
        shell: bash
        run: |
          {
            echo "## ExportHUB Actions Cleanup Stage 3 Recovery"
            echo
            echo "### Alte Runs"
            if [[ -f /tmp/runs-after.tsv ]]; then
              echo "Verbleibende Runs insgesamt: $(wc -l < /tmp/runs-after.tsv | tr -d ' ')"
            fi
            if [[ -s /tmp/delete-failures.tsv ]]; then
              echo
              echo "Folgende Runs konnten nicht gelöscht werden:"
              echo
              echo "| Run-ID | HTTP | GitHub-Antwort |"
              echo "|---:|---:|---|"
              while IFS=$'\t' read -r id code message; do
                safe="${message//|/\\|}"
                echo "| $id | $code | $safe |"
              done < /tmp/delete-failures.tsv
            else
              echo "Alle vorgesehenen alten abgeschlossenen Runs wurden gelöscht oder waren bereits weg."
            fi
            echo
            echo "### Alte Workflow-Dateien unter .github/workflows"
            echo "Diese Definitionen wurden soweit möglich deaktiviert. Die Pfade können anschließend im Code-Bereich gelöscht werden:"
            echo
            if [[ -s /tmp/workflows-to-delete-manually.tsv ]]; then
              while IFS=$'\t' read -r id name path state; do
                echo "- \`$path\` — $name"
              done < /tmp/workflows-to-delete-manually.tsv
            else
              echo "- Keine"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
