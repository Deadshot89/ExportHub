name: RC1057 State Size Legacy Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1057 gezielte Regression
        run: |
          node --test test/rc1057-team-state-size-health.test.mjs
          node --test test/rc1050-storage-timeout-regression.test.mjs
          node --test test/rc1051-storage-hotpath-container.test.mjs
      - name: Historischen Apply-Stand nur lokal prüfen
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1057/apply-state-size.mjs
          if ! git diff --quiet; then
            echo 'RC1057 würde den aktuellen Stand verändern. Änderung muss über einen normalen Pull Request erfolgen.' >&2
            git diff --stat >&2
            exit 1
          fi
          echo 'RC1057 ist bereits vollständig im Repository enthalten.'
