name: Build ExportHUB Android RC1009 APK
on:
  workflow_dispatch:
  push:
    branches: [main, rc1009-android-notification-sync]
    paths:
      - 'android-app/**'
      - 'test/rc1003-android-native-direct-open.test.mjs'
      - 'test/rc1003-three-env-sync.test.mjs'
      - 'production-version.js'
      - '.github/workflows/exporthub-android-test-app.yml'
permissions:
  contents: read
concurrency:
  group: exporthub-android-rc1009-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: RC1009 Release-Vertrag
        run: node --test test/rc1003-android-native-direct-open.test.mjs test/rc1003-three-env-sync.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ExportHUB-RC1009-Android-debug.apk
          sha256sum out/ExportHUB-RC1009-Android-debug.apk > out/ExportHUB-RC1009-Android-debug.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ExportHUB-RC1009-Android
          path: android-app/out/*
          if-no-files-found: error
          retention-days: 30
