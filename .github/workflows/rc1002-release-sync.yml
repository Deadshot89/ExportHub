name: RC1002 Release Sync
on:
  push:
    branches: [rc1002-release-sync]
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'production-version.js'
      - 'android-app/**'
      - '.github/rc1002/**'
      - 'test/rc1002-release-sync.test.mjs'
      - '.github/workflows/rc1002-release-sync.yml'
      - '.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml'
      - '.github/workflows/exporthub-android-test-app.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1002-release-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Website-Versionen materialisieren
        run: node .github/rc1002/apply-release-sync.mjs
      - name: RC1002 Release-Vertrag
        run: node --test test/rc1002-release-sync.test.mjs
      - name: Gesamte Node-Regression
        run: npm test
      - name: Drei-Umgebungen-Build prüfen
        run: |
          node .github/rc1002/build-three-env.mjs
          grep -q 'ExportHUB RC1002 environment=production-candidate' dist-rc1002/index.html
          grep -q 'ExportHUB RC1002 environment=testservice' dist-rc1002/TESTVERSION.html
          grep -q 'ExportHUB RC1002 environment=demo' dist-rc1002/demo.html
      - name: Diff prüfen
        run: git diff --check
      - name: Materialisierten Website-Stand committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html TESTVERSION.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html TESTVERSION.html
          git commit -m 'RC1002: Website und TESTSERVICE auf gemeinsame Version setzen'
          git push origin HEAD:rc1002-release-sync
