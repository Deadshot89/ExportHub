name: RC1543 Fix Pre-Pickup Pallet Balance

on:
  push:
    branches: [fix/rc1543-loading-list-pallet-balance]
    paths:
      - 'scripts/rc1543-fix-prepickup-pallet-balance.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rc1543-loading-list-pallet-balance
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1543 Vorabholungs-Kontostand anwenden
        run: node scripts/rc1543-fix-prepickup-pallet-balance.mjs
      - name: Gezielte Tests
        run: |
          node --test test/rc1543-loading-list-pallet-balance.test.mjs
          node --test test/rc1190-print-browser-gate.test.mjs
      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add assets/document-print-name.js e2e/specs/print-documents.spec.mjs test/rc1543-loading-list-pallet-balance.test.mjs
          if git diff --cached --quiet; then
            echo 'Keine Änderungen erforderlich.'
            exit 0
          fi
          git commit -m 'fix(rc1543): apply pallet balance before pickup and print caching'
          git push origin HEAD:fix/rc1543-loading-list-pallet-balance
