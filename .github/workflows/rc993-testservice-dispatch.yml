name: RC993 TESTSERVICE Live Verify

on:
  push:
    branches:
      - rc993-render-performance
    paths:
      - '.github/workflows/rc993-testservice-dispatch.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC993 branch
        uses: actions/checkout@v4

      - name: Verify live RC993 TESTSERVICE after Azure redirect
        shell: bash
        env:
          TEST_URL: https://wonderful-forest-0f315e310-testservice.centralus.7.azurestaticapps.net
        run: |
          set -euo pipefail
          page="$(mktemp)"; headers="$(mktemp)"; body="$(mktemp)"
          trap 'rm -f "$page" "$headers" "$body"' EXIT

          page_code="$(curl -sS -L --connect-timeout 5 --max-time 30 -D "$headers" -o "$page" -w '%{http_code}' "$TEST_URL/TESTVERSION.html?verify=${GITHUB_SHA}")"
          version="$(grep -oE "var BUILD=Object\.freeze\(\{version:'RC[0-9]+'" "$page" | head -n1 | grep -oE 'RC[0-9]+' || true)"
          probe_code="$(curl -sS --connect-timeout 5 --max-time 30 -H 'Accept: application/json' -o "$body" -w '%{http_code}' "$TEST_URL/api/exporthub-auth-probe?verify=${GITHUB_SHA}")"

          echo "Frontend HTTP=$page_code Version=${version:-keine}"
          echo "API-Probe HTTP=$probe_code"
          echo "Redirect-Kette:"
          grep -Ei '^(HTTP/|location:)' "$headers" || true

          test "$page_code" = "200"
          test "$version" = "RC993"
          test "$probe_code" = "200"
          grep -q '"ok":true' "$body"
          echo "RC993 TESTSERVICE ist live und verifiziert: $TEST_URL/test?v=993"

      - name: Remove temporary live verification workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rc993-testservice-dispatch.yml
          git commit -m 'RC993: temporäre Live-Prüfung entfernen'
          git push
