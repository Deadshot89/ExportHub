name: RC990 Task Grid Promote

on:
  push:
    branches:
      - rc990-large-ux
    paths:
      - .github/rc990_task_grid_promote.py
      - .github/workflows/rc990-task-grid-promote.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc990-task-grid-promote
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/rc990-large-ux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated RC990 branch
        uses: actions/checkout@v4
        with:
          ref: rc990-large-ux
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair canonical RC990 selectors
        run: python .github/rc990_task_grid_promote.py

      - name: Materialize canonical RC990 design into preview source
        run: python .github/rc990_design_apply.py

      - name: Verify focused RC990 design contract
        run: node --test test/rc990-design-system.test.mjs

      - name: Diagnose full regression assertion
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          npm test > .github/rc990_task_grid_regression_result.txt 2>&1
          status=$?
          end=$(date +%s)
          bytes=$(wc -c < .github/rc990_task_grid_regression_result.txt || echo 0)
          {
            echo "exit_status=$status"
            echo "duration_seconds=$((end-start))"
            echo "output_bytes=$bytes"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "--- failing-test-summary ---"
            grep -E -n '^(# Subtest:|not ok|# fail |# pass |# tests |# suites )|failureType:|AssertionError|ERR_ASSERTION|error:' .github/rc990_task_grid_regression_result.txt | tail -n 160 || true
          } > .github/rc990_task_grid_regression_diag.txt
          cat .github/rc990_task_grid_regression_diag.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/rc990_task_grid_regression_diag.txt
            git commit -m "diag: materialize RC990 failing regression assertion"
            git push origin HEAD:rc990-large-ux
            exit "$status"
          fi
          rm -f .github/rc990_task_grid_regression_result.txt .github/rc990_task_grid_regression_diag.txt

      - name: Remove one-time promotion helpers
        shell: bash
        run: |
          git rm .github/rc990_task_grid_promote.py .github/workflows/rc990-task-grid-promote.yml
          git rm -f --ignore-unmatch .github/rc990_task_grid_test_result.txt .github/rc990_task_grid_regression_result.txt .github/rc990_task_grid_regression_diag.txt

      - name: Commit canonical result only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rc990_design_apply.py TESTVERSION.html
          git commit -m "RC990: Aufgabenraster sichtbar und direkt wirksam machen"
          git push origin HEAD:rc990-large-ux
