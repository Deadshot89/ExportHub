name: RC1469 Mobile Autofix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'releasefix/p0-clean-shipment-print-mobile-20261009'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: releasefix/p0-clean-shipment-print-mobile-20261009
      - name: Repair classic phone document flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/rc1306-layout-engine.css')
          s=p.read_text()
          old='''  #rc383TopPair.rc894-full-stack{\n    grid-template-columns:minmax(0,1fr)!important;\n    grid-auto-flow:row!important;\n  }\n  #rc383TopPair.rc894-full-stack > :is(\n    #rc363BlockCustomer,#rc363BlockShipment,#rc363BlockColli,#rc573ColliCard,#rc363BlockDocuments\n  ){\n    grid-column:1/-1!important;\n    grid-row:auto!important;\n    width:100%!important;\n    max-width:none!important;\n    min-width:0!important;\n  }'''
          new='''  #rc383TopPair.rc894-full-stack{\n    display:block!important;\n    width:100%!important;\n    min-width:0!important;\n  }\n  #rc383TopPair.rc894-full-stack > :is(\n    #rc363BlockCustomer,#rc363BlockShipment,#rc363BlockColli,#rc573ColliCard,#rc363BlockDocuments\n  ){\n    position:relative!important;\n    inset:auto!important;\n    transform:none!important;\n    display:block!important;\n    width:100%!important;\n    max-width:none!important;\n    min-width:0!important;\n    margin-left:0!important;\n    margin-right:0!important;\n  }'''
          if old not in s:
              print('RC1469 mobile flow repair already applied')
          else:
              p.write_text(s.replace(old,new,1))
              print('RC1469 mobile flow repair applied')
          PY
      - name: Verify static RC1469 contract
        run: node --test test/rc1469-new-shipment-clean-slate.test.mjs
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rc1306-layout-engine.css
          git commit -m 'fix(rc1469): restore classic mobile document flow'
          git push origin HEAD:releasefix/p0-clean-shipment-print-mobile-20261009
