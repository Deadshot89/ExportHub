name: RC1509 Targeted Loader Cache Safety Regression

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'infra/production-loader.html'
      - 'test/rc1509-production-loader-cache-safety.test.mjs'
      - '.github/workflows/rc1509-targeted-regression.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: RC1509 targeted regression
        run: node --test test/rc1509-production-loader-cache-safety.test.mjs
