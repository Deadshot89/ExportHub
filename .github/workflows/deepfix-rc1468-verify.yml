name: Deepfix RC1468 verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'test/rc1468-shipment-view-context-regression.test.mjs'
      - 'assets/rc1071-shipment-history.js'
      - '.github/rc1112/build-three-env.mjs'
      - '.github/workflows/deepfix-rc1468-verify.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RC1468 focused regression
        run: node --test --test-concurrency=1 test/rc1468-shipment-view-context-regression.test.mjs
