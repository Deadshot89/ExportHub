name: RC1525 Customer Email Red Green

on:
  push:
    branches:
      - fix/customer-email-delete-persist-20261014
    paths:
      - '.github/workflows/rc1525-customer-email-red-green.yml'

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: RED – Regressionsfehler muss reproduzierbar sein
        shell: bash
        run: |
          set +e
          node --test test/rc1525-customer-email-delete-persist.test.mjs > rc1525-red.log 2>&1
          status=$?
          cat rc1525-red.log
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RC1525 RED fehlgeschlagen: Der Regressionstest war bereits grün.' >&2
            exit 1
          fi
          grep -q "bewusst entfernte Kunden-Mailadressen" rc1525-red.log
          grep -q "kunde@example.com" rc1525-red.log
          echo 'RC1525 RED bestätigt: Die alte Server-Merge-Logik stellt gelöschte Mailadressen wieder her.'

      - name: Minimalen Merge-Fix anwenden
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('api/shared/merge.js')
          source = path.read_text(encoding='utf-8')
          indent = '  '
          marker = '// Customer master data is loss-protected: an empty/missing value from a newer partial client'
          loop = indent + 'for (const [key, value] of Object.entries(older)) {'
          old_body = indent + indent + 'if (!meaningfulValue(out[key]) && meaningfulValue(value)) out[key] = clone(value);'

          marker_pos = source.find(marker)
          if marker_pos < 0:
              raise SystemExit('Customer loss-protection marker not found')
          loop_pos = source.find(loop, marker_pos)
          if loop_pos < 0:
              raise SystemExit('Customer loss-protection loop not found')
          body_pos = source.find(old_body, loop_pos)
          if body_pos < 0:
              raise SystemExit('Customer loss-protection body not found')

          set_block = '\n'.join([
              indent + 'const explicitlyClearableCustomerFields = new Set([',
              indent + indent + "'email', 'customerEmail', 'customerMail', 'mail', 'carrierEmail',",
              indent + indent + "'salesMail', 'salesEmail', 'salesPersonMail', 'salesPersonEmail',",
              indent + indent + "'salesContactMail', 'salesContactEmail', 'rc385SalesMail', 'salesCc',",
              indent + indent + "'salesPersonName', 'salesContactName', 'salesName',",
              indent + indent + "'salesContacts', 'customerSalesContacts',",
              indent + indent + "'cc', 'mailCc', 'rc385Cc', 'ccContacts', 'customerCcContacts'",
              indent + ']);',
              ''
          ])
          source = source[:loop_pos] + set_block + source[loop_pos:]

          body_pos = source.find(old_body, loop_pos + len(set_block))
          if body_pos < 0:
              raise SystemExit('Customer loss-protection body disappeared after insertion')
          new_body = '\n'.join([
              indent + indent + 'const explicitlyCleared = explicitlyClearableCustomerFields.has(key)',
              indent + indent + indent + '&& Object.prototype.hasOwnProperty.call(newer, key)',
              indent + indent + indent + '&& !meaningfulValue(newer[key]);',
              indent + indent + 'if (!explicitlyCleared && !meaningfulValue(out[key]) && meaningfulValue(value)) out[key] = clone(value);'
          ])
          source = source[:body_pos] + new_body + source[body_pos + len(old_body):]

          old_comment = (
              indent + '// Customer master data is loss-protected: an empty/missing value from a newer partial client\n'
              + indent + '// may not erase a previously persisted non-empty value.'
          )
          new_comment = (
              indent + '// Customer master data stays loss-protected when a field is absent. For mail/contact\n'
              + indent + '// fields, an explicitly present empty value is a deliberate deletion and must not\n'
              + indent + '// resurrect an older address on the next reload.'
          )
          if old_comment not in source:
              raise SystemExit('Customer loss-protection comment not found')
          source = source.replace(old_comment, new_comment, 1)

          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
          git diff -- api/shared/merge.js

      - name: GREEN – gezielte Regression
        run: node --test test/rc1525-customer-email-delete-persist.test.mjs

      - name: Fix auf Branch committen
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/shared/merge.js
          git commit -m 'fix: persist customer email deletions'
          git push origin HEAD:fix/customer-email-delete-persist-20261014
