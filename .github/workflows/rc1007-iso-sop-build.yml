name: RC1007 ISO SOP Build

on:
  push:
    branches:
      - rc1007-iso-sop-handbook
    paths:
      - '.github/rc1007/**'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rc1007-iso-sop-handbook
      - name: Node 20 bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: RC1007 Patch anwenden
        run: node .github/rc1007/apply-rc1007.mjs
      - name: Vorhandene RC1007 Teiltests ausführen
        shell: bash
        run: |
          for file in \
            test/rc1007-sop-model.test.mjs \
            test/rc1007-sop-catalog.test.mjs \
            test/rc1007-sop-visuals.test.mjs \
            test/rc1007-sop-ui.test.mjs; do
            if [ -f "$file" ]; then
              node --test "$file"
            fi
          done
      - name: Bestehende Regression ohne noch roten RC1007 Gesamtvertrag
        shell: bash
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.mjs' \
            ! -name 'rc1007-iso-sop-contract.test.mjs' \
            ! -name 'rc1007-sop-*.test.mjs' | sort)
          node --test "${files[@]}"
      - name: RC1007 Gesamtvertrag prüfen sobald Integration vorhanden ist
        shell: bash
        run: |
          if [ -f assets/sop/rc1007-sop-ui.js ] \
            && grep -q 'assets/sop/rc1007-sop-catalog.js' index.html \
            && grep -q 'assets/sop/rc1007-sop-catalog.js' TESTVERSION.html; then
            node --test test/rc1007-iso-sop-contract.test.mjs
          else
            echo 'RC1007 Gesamtvertrag bleibt bis zur Integrations-Task bewusst RED.'
          fi
      - name: Änderungen committen
        run: |
          if git diff --quiet; then
            echo "Keine erzeugten Änderungen."
            exit 0
          fi
          git config user.name "ExportHUB RC1007 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/shared/merge.js index.html TESTVERSION.html assets/sop test/rc1007*.test.mjs docs/superpowers/specs/2026-09-08-iso-sop-handbook-design.md docs/superpowers/plans/2026-09-08-iso-sop-handbook.md
          git commit -m "RC1007: SOP-Bausteine aus geprüftem Patch anwenden"
          git push origin HEAD:rc1007-iso-sop-handbook
