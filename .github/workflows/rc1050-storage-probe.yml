name: RC1050 Storage Probe

on:
  workflow_run:
    workflows: ['ExportHUB RC1048 Drei-Umgebungen Deploy']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1050 Storage-Timeout Regression
        run: node --test test/rc1050-storage-timeout-regression.test.mjs
      - name: RC1051 Storage-Hotpath Regression
        run: node --test test/rc1051-storage-hotpath-container.test.mjs
      - name: RC1052 Lieferavis Fast-Path Regression
        run: node --test test/rc1052-lieferavis-fast-disable.test.mjs
      - name: RC1059 Dokument-Blob-Storage Regression
        run: node --test test/rc1059-document-blob-store.test.mjs test/rc1059-document-container.test.mjs test/rc1059-document-download.test.mjs test/rc1059-document-dual-read.test.mjs test/rc1059-state-diagnostics.test.mjs
      - name: ExportHUB Azure API Diagnose
        shell: bash
        run: |
          set -euo pipefail
          prod='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          testservice='https://wonderful-forest-0f315e310-testservice.centralus.7.azurestaticapps.net'
          sample_blob='rc1059/production/aa/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'

          check_json() {
            local label="$1"
            local url="$2"
            local predicate="$3"
            local body code
            body=$(mktemp)
            code=$(curl -sS -L -o "$body" -w '%{http_code}' --max-time 20 "$url")
            echo "===== $label ====="
            cat "$body"
            echo
            if [[ "$code" != '200' ]]; then
              echo "HTTP $code für $url" >&2
              rm -f "$body"
              return 1
            fi
            node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!($predicate)){console.error('Live-Prüfung fehlgeschlagen:',v);process.exit(1)}" "$body"
            rm -f "$body"
          }

          check_status() {
            local label="$1"
            local url="$2"
            local expected="$3"
            local body code
            body=$(mktemp)
            code=$(curl -sS -L -o "$body" -w '%{http_code}' --max-time 20 "$url")
            echo "===== $label ====="
            cat "$body"
            echo
            if [[ "$code" != "$expected" ]]; then
              echo "HTTP $code statt $expected für $url" >&2
              rm -f "$body"
              return 1
            fi
            rm -f "$body"
          }

          for base in "$prod" "$testservice"; do
            check_json "$base /api/exporthub-health" "$base/api/exporthub-health" "v.ok===true&&v.version==='RC1059'&&v.release==='document-blob-storage'"
            check_json "$base /api/exporthub-auth-probe" "$base/api/exporthub-auth-probe" "v.ok===true&&v.runtimeReady===true"
            check_json "$base /api/exporthub-state?mode=ping" "$base/api/exporthub-state?mode=ping" "v.ok===true&&v.routeReachable===true"
            check_json "$base /api/exporthub-state?mode=health" "$base/api/exporthub-state?mode=health" "v.ok===true&&v.storageReachable===true&&v.teamStateReadable===true&&Number(v.stateDiagnostics&&v.stateDiagnostics.blobDocumentEntries)>=0"
          done

          check_status 'Production Dokumentroute ohne Session' "$prod/api/exporthub-document?blob=$sample_blob&environment=production" '401'
          check_status 'TESTSERVICE Dokumentroute ohne Session' "$testservice/api/exporthub-document?blob=rc1059%2Ftestservice%2Faa%2Faaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa&environment=testservice" '401'
