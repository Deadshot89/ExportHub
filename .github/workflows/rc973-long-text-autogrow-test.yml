name: RC973 Long Text Auto-Grow Test

on:
  push:
    branches: [main]
    paths:
      - 'TESTVERSION.html'
      - 'test/rc971-global-form-field-standard.test.mjs'
      - 'test/rc972-field-exception-audit.test.mjs'
      - 'test/rc973-long-text-autogrow.test.mjs'
      - '.github/workflows/rc973-long-text-autogrow-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: RC971 bis RC974 vollständige Feld- und Renderregression
        run: node --test test/rc971-global-form-field-standard.test.mjs test/rc972-field-exception-audit.test.mjs test/rc973-long-text-autogrow.test.mjs

# RC974 post-fix field/render verification trigger
