          grep -Fq "/customer-avis.html?v=892" TESTVERSION.html
          grep -Fq "rc892-shipment-grid" TESTVERSION.html

          python3 - <<'PY'
          from pathlib import Path
          src=Path("TESTVERSION.html").read_text(encoding="utf-8")

          if "document.body.getAttribute('data-exporthub-view')" in src:
            raise SystemExit("Ungeschützter body.getAttribute(data-exporthub-view) noch vorhanden")
          if "document.body.getAttribute('data-current-view')" in src:
            raise SystemExit("Ungeschützter body.getAttribute(data-current-view) noch vorhanden")

          marker="/* exporthub-rc888-shipment-create-professional */"
          start=src.find(marker)
          next_marker=src.find("/* exporthub-",start+len(marker))
          avis=src.find("function avisHost(view)",start)
          ends=[x for x in (next_marker,avis) if x>=0]
          end=min(ends) if ends else -1
          mod=src[start:end]

          if "new MutationObserver(schedule)" in mod:
            raise SystemExit("RC888 self MutationObserver still active")
          if "setInterval(schedule,2500)" in mod:
            raise SystemExit("RC888 permanent 2.5s refresh still active")

          before={
            "script_open":int(Path("/tmp/rc892_script_open").read_text()),
            "script_close":int(Path("/tmp/rc892_script_close").read_text()),
            "style_open":int(Path("/tmp/rc892_style_open").read_text()),
            "style_close":int(Path("/tmp/rc892_style_close").read_text())
          }
          after={
            "script_open":src.lower().count("<script"),
            "script_close":src.lower().count("</script>"),
            "style_open":src.lower().count("<style"),
            "style_close":src.lower().count("</style>")
          }
          if before!=after:
            raise SystemExit("HTML script/style boundaries changed: "+repr({"before":before,"after":after}))

          print("GREEN source verification passed.")
          PY

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "TESTVERSION.html" ]]; then
            echo "::error::RC892 may only change TESTVERSION.html"
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi

          if ! git diff --quiet -- index.html api staticwebapp.config.json .github/workflows customer-avis.html; then
            echo "::error::Production/API/workflows/customer-avis were modified."
            exit 1
          fi

      - name: Commit RC892 TESTSERVICE
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC892: remove render feedback loop and stabilize Lieferavis layout"
          git push origin main

      - name: RC892 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## ExportHUB RC892"
            echo
            echo "- RC888 self-observing MutationObserver removed"
            echo "- permanent RC888 2.5-second refresh removed"
            echo "- currentView body-null crash guarded"
            echo "- Lieferavis event-driven and persistent"
            echo "- Sendungsdaten fixed grid: reference/date side-by-side, remaining fields full width"
            echo "- dashboard full-width/order retained"
            echo "- URL version normalized to v=892 without reload"
            echo "- tasks/task planner untouched"
            echo "- only TESTVERSION.html changed"
          } >> "$GITHUB_STEP_SUMMARY"
