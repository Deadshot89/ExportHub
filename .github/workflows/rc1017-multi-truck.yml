name: RC1017 Mehr-LKW

on:
  push:
    branches:
      - feature/multi-truck-shipment-split
    paths:
      - 'assets/rc1017-multi-truck.js'
      - 'api/shared/multi-truck.js'
      - 'api/shared/multi-truck-pickup.js'
      - 'api/shared/merge.js'
      - 'api/shared/pickup-store.js'
      - 'api/pickup-init/index.js'
      - 'api/pickup-status/index.js'
      - 'api/pickup-confirm-v2/index.js'
      - 'test/rc1017-*.test.mjs'
      - '.github/rc1017/**'
      - '.github/workflows/rc1017-multi-truck.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc1017-multi-truck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: RC1017 Mehr-LKW Vertrag
        run: node --test test/rc1017-*.test.mjs
      - name: Vollständige Node-Regression deterministisch
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 test/*.test.mjs
      - name: RC1016 Drei-Umgebungen-Build bleibt intakt
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1016/build-three-env.mjs
          grep -q 'ExportHUB RC1016 environment=production-candidate' dist-rc1016/index.html
          grep -q 'ExportHUB RC1016 environment=testservice' dist-rc1016/TESTVERSION.html
          grep -q 'ExportHUB RC1016 environment=demo' dist-rc1016/demo.html
          git diff --check
