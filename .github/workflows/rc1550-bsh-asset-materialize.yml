name: RC1550 BSH Asset Materialize

on:
  push:
    branches:
      - feature/rc1550-sop-rebuild-main-20261017
    paths:
      - '.github/rc1550/bsh-seed/**'
      - '.github/workflows/rc1550-bsh-asset-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc1550-bsh-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Assemble and verify BSH screenshot archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64, gzip, hashlib, tarfile

          root=Path('.github/rc1550/bsh-seed')
          groups=[
            ['clean-00'],
            ['exact-01'],
            ['clean-02'],
            ['clean-03'],
            ['exact-04'],
            ['clean-05'],
            ['clean-06'],
            ['clean-07'],
            ['clean-08'],
            ['clean-09'],
            ['exact-10'],
            ['clean-11'],
            ['exact-12-0','exact-12-1','exact-12-2','exact-12-3'],
            ['exact-13-0','exact-13-1','exact-13-2','exact-13-3'],
            ['clean-14'],
          ]
          expected=[
            '01-portaluebersicht.png',
            '02-funktion-auswaehlen.png',
            '03-kunde-werk.png',
            '04-hinzufuegen.png',
            '05-werk-termin.png',
            '06-verpackungsdaten.png',
            '07-exporthub-referenz.png',
            '08-lieferavis-anlegen.png',
            '09-lieferscheine-mengen.png',
            '10-sendungsnummer-erstellen.png',
            '11-erfolgsbestaetigung.png',
          ]

          def read_piece(name):
              p=root/name
              if not p.is_file():
                  raise SystemExit(f'Seed fehlt: {name}')
              return ''.join(p.read_text('utf-8').split())

          chunks=[]
          for index,names in enumerate(groups):
              chunk=''.join(read_piece(name) for name in names)
              if not chunk:
                  raise SystemExit(f'Chunk {index:02d} ist leer')
              chunks.append(chunk)
              print(f'chunk {index:02d}: OK len={len(chunk)} sha1={hashlib.sha1(chunk.encode()).hexdigest()}')

          encoded=''.join(chunks)
          archive=base64.b64decode(encoded,validate=True)
          tar_bytes=gzip.decompress(archive)
          tf=tarfile.open(fileobj=BytesIO(tar_bytes),mode='r:')
          bybase={Path(member.name).name:member for member in tf.getmembers() if member.isfile()}

          target=Path('assets/sop/screenshots/bsh')
          target.mkdir(parents=True,exist_ok=True)
          for old in target.iterdir():
              if old.is_file():
                  old.unlink()

          for name in expected:
              member=bybase.get(name)
              if not member:
                  raise SystemExit(f'Pflichtbild fehlt im Archiv: {name}')
              data=tf.extractfile(member).read()
              if len(data)<10000:
                  raise SystemExit(f'{name}: Datei zu klein ({len(data)} Bytes)')
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit(f'{name}: keine gültige PNG-Signatur')
              if len(data)<24:
                  raise SystemExit(f'{name}: PNG-Header unvollständig')
              width=int.from_bytes(data[16:20],'big')
              height=int.from_bytes(data[20:24],'big')
              if width<=0 or height<=0:
                  raise SystemExit(f'{name}: ungültige Abmessungen {width}x{height}')
              (target/name).write_bytes(data)
              print(f'{name}: OK bytes={len(data)} size={width}x{height} sha256={hashlib.sha256(data).hexdigest()}')

          actual=sorted(p.name for p in target.glob('*.png'))
          if actual!=sorted(expected):
              raise SystemExit(f'Finaler BSH-Ordner falsch: {actual}')
          PY

      - name: Verify RC1550 targeted suite
        run: >-
          node --test --test-concurrency=1
          test/rc1550-sop-model.test.mjs
          test/rc1550-sop-catalog.test.mjs
          test/rc1550-sop-assets.test.mjs
          test/rc1550-sop-runtime-isolation.test.mjs
          test/rc1550-sop-ui.test.mjs
          test/rc1550-sop-responsive.test.mjs
          test/rc1550-sop-build.test.mjs

      - name: Full Node regression
        run: npm test

      - name: Commit verified final assets and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/rc1550/bsh-seed
          rm -f .github/workflows/rc1550-bsh-asset-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/sop/screenshots/bsh .github/rc1550/bsh-seed .github/workflows/rc1550-bsh-asset-materialize.yml
          git diff --cached --check
          git commit -m 'assets: add verified BSH SOP screenshots'
          git push origin "HEAD:${GITHUB_REF_NAME}"
