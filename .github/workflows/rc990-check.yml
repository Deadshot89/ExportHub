name: RC990 Branch Check

# RC990 Design audit + regression
on:
  push:
    branches:
      - rc990-large-ux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: RC990 design audit
        run: python .github/rc990_design_audit.py
      - run: npm test
