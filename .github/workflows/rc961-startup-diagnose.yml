name: RC961 Startup Diagnose

on:
  push:
    branches:
      - rc961-startup-teamdata-timeout
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc961-startup-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc961-startup-teamdata-timeout
          fetch-depth: 0
      - name: RED - startup total-timeout regression before repair
        run: node .github/rc961_statecall_test.cjs
