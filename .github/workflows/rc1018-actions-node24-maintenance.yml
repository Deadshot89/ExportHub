name: RC1018 Active Actions Node24 Maintenance

on:
  push:
    branches: [rc1018-actions-node24-maintenance]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc1018-actions-node24-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch_and_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Aktive Workflows auf Node 24 aktualisieren
        run: node .github/rc1018/update-active-actions-node24.mjs
      - name: Node24-Workflowvertrag prüfen
        run: node --test test/rc1018-actions-node24.test.mjs
      - name: Vollständige Node-Regression
        run: npm test
      - name: Diff prüfen
        run: git diff --check
      - name: Verifizierte Workflowänderungen versionieren
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Keine Workflowänderungen erforderlich.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml \
            .github/workflows/rc1002-main-contract.yml \
            .github/workflows/exporthub-android-test-app.yml \
            .github/workflows/exporthub-testservice.yml \
            .github/workflows/rc1007-release-verify.yml \
            .github/workflows/rc1012-abholkalender-verify.yml
          git commit -m 'chore: aktive GitHub Actions auf Node 24 aktualisieren [skip ci]'
          git push
