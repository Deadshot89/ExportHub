name: RC969 State Performance Diagnose

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc969-state-performance-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Frontend Read Sync Auslöser analysieren
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('TESTVERSION.html','utf8');
          const build=s.match(/var BUILD=Object\.freeze\(\{version:'(RC\d+)'/);
          console.log('BUILD',build?build[1]:'unbekannt');

          function context(label,token,before=1800,after=6500,limit=30){
            console.log('\n=== '+label+' ===');
            let pos=0,count=0;
            while((pos=s.indexOf(token,pos))>=0&&count<limit){
              count++;
              console.log('\n--- '+count+' @ '+pos+' ---\n'+s.slice(Math.max(0,pos-before),Math.min(s.length,pos+after)));
              pos+=token.length;
            }
            console.log('COUNT',count);
          }

          for(const token of ['mode=read','mode%3Dread','exporthub-state','readRemote','loadRemote','syncRemote','pullRemote','cloudRead','teamRead']) context(token,token,1400,5200,18);

          console.log('\n=== Timer / Visibility / Focus Kontexte mit State-Sync ===');
          const lines=s.split('\n');
          lines.forEach((line,i)=>{
            if(/setInterval|setTimeout|visibilitychange|focus|online|BroadcastChannel/.test(line) && /sync|cloud|state|azure|remote|read|pull/i.test(line)){
              console.log(String(i+1).padStart(5),line.trim().slice(0,2200));
            }
          });

          console.log('\n=== fetch/POST Zeilen mit exporthub-state ===');
          lines.forEach((line,i)=>{
            if(/exporthub-state/.test(line))console.log(String(i+1).padStart(5),line.trim().slice(0,3000));
          });
          NODE
