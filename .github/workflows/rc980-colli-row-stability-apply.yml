name: RC980 Apply Colli Row Stability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc980-colli-row-stability-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: RC980 Colli-Raster isoliert anwenden
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          p=Path('TESTVERSION.html')
          text=p.read_text(encoding='utf-8')
          old="var BUILD=Object.freeze({version:'RC979',cache:'979'"
          new="var BUILD=Object.freeze({version:'RC980',cache:'980'"
          if text.count(old)!=1:
              raise SystemExit(f'BUILD-Anker RC979 nicht eindeutig: {text.count(old)}')
          if 'id="rc980-colli-row-stability"' in text:
              raise SystemExit('RC980-Style ist bereits vorhanden')

          marker='<style id="rc979-shipment-inner-density">'
          start=text.find(marker)
          if start<0:
              raise SystemExit('RC979-Style-Anker fehlt')
          end=text.find('</style>',start)
          if end<0:
              raise SystemExit('RC979-Style ist nicht sauber geschlossen')
          end+=len('</style>')

          css=dedent('''
          
          <style id="rc980-colli-row-stability">
          #rc363BlockColli #rc573ColliCard #rowsBox{display:grid!important;grid-template-columns:minmax(0,1fr)!important;grid-auto-flow:row!important;grid-auto-rows:max-content!important;align-content:start!important;width:100%!important;min-width:0!important}
          #rc363BlockColli #rc573ColliCard .rc363-owned-row{width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important}
          #rc363BlockColli #rc573ColliCard .rc363-colli-grid{display:grid!important;grid-template-columns:repeat(12,minmax(0,1fr))!important;grid-template-rows:repeat(3,max-content)!important;grid-auto-flow:row!important;align-items:end!important;width:100%!important;min-width:0!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="type"]{grid-area:1 / 1 / 2 / 10!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="action"]{grid-area:1 / 10 / 2 / 13!important;align-self:end!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="count"]{grid-area:2 / 1 / 3 / 4!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="weight"]{grid-area:2 / 4 / 3 / 9!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="ldm"]{grid-area:2 / 9 / 3 / 13!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="l"]{grid-area:3 / 1 / 4 / 5!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="w"]{grid-area:3 / 5 / 4 / 9!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="h"]{grid-area:3 / 9 / 4 / 13!important}
          @container rc978ShipmentLayout (max-width:760px){
          #rc363BlockColli #rc573ColliCard .rc363-colli-grid{grid-template-columns:repeat(6,minmax(0,1fr))!important;grid-template-rows:repeat(4,max-content)!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="type"]{grid-area:1 / 1 / 2 / 5!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="action"]{grid-area:1 / 5 / 2 / 7!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="count"]{grid-area:2 / 1 / 3 / 3!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="weight"]{grid-area:2 / 3 / 3 / 7!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="ldm"]{grid-area:3 / 1 / 4 / 7!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="l"]{grid-area:4 / 1 / 5 / 3!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="w"]{grid-area:4 / 3 / 5 / 5!important}
          #rc363BlockColli #rc573ColliCard [data-rc363-field="h"]{grid-area:4 / 5 / 5 / 7!important}
          }
          @container rc978ShipmentLayout (max-width:520px){
          #rc363BlockColli #rc573ColliCard .rc363-colli-grid{grid-template-columns:1fr!important;grid-template-rows:none!important}
          #rc363BlockColli #rc573ColliCard .rc363-colli-grid>[data-rc363-field]{grid-column:1!important;grid-row:auto!important}
          }
          </style>''')

          text=text.replace(old,new,1)
          text=text[:end]+css+text[end:]
          p.write_text(text,encoding='utf-8')
          PY
      - name: RC971 bis RC980 komplette Regression
        run: node --test test/rc971-global-form-field-standard.test.mjs test/rc972-field-exception-audit.test.mjs test/rc973-long-text-autogrow.test.mjs test/rc975-global-render-integrity.test.mjs test/rc976-render-fallback-recovery.test.mjs test/rc977-colli-typography.test.mjs test/rc978-shipment-fluid-layout.test.mjs test/rc979-shipment-inner-density.test.mjs test/rc980-colli-row-stability.test.mjs
      - name: RC980 committen
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TESTVERSION.html
          git diff --cached --check
          git commit -m 'RC980: Colli-Zeilen ohne horizontales Verschieben stabilisieren'
          git push origin HEAD:main
