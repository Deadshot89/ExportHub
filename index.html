<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExportHUB</title>
<style>
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eaf4fb;color:#0b2b5e}body{min-height:100vh;display:grid;place-items:center}.box{width:min(620px,calc(100% - 36px));background:#fff;border:1px solid #d9e6f1;border-radius:28px;box-shadow:0 24px 70px rgba(15,44,80,.16);padding:34px;text-align:center}.mark{width:68px;height:68px;border-radius:22px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#fff;font-weight:1000;font-size:25px}.bar{height:12px;border-radius:999px;background:#e7eef5;overflow:hidden;margin:24px 0 10px}.fill{height:100%;width:10%;background:linear-gradient(90deg,#2563eb,#13b9ea);transition:width .2s}.err{display:none;margin-top:16px;background:#fee2e2;color:#991b1b;border-radius:12px;padding:12px}.retry{display:none;margin:15px auto 0;border:0;background:#2563eb;color:#fff;font-weight:900;border-radius:12px;padding:10px 18px;cursor:pointer}
</style></head><body><div class="box"><div class="mark">EH</div><h1>ExportHUB wird geladen</h1><p id="msg">Freigegebene Produktionsversion wird ermittelt …</p><div class="bar"><div id="fill" class="fill"></div></div><strong id="pct">10 %</strong><div id="err" class="err"></div><button id="retry" class="retry" onclick="location.reload()">Erneut versuchen</button></div>
<script>
(function(){'use strict';
var API='/api/exporthub-release',done=false;
try{var u=new URL(location.href);if(u.searchParams.get('portal')==='test'||/\/test(?:\/|$)/i.test(u.pathname)){location.replace('/test/?_='+Date.now());return}sessionStorage.removeItem('exporthub_test_portal_requested')}catch(_){}
function p(n,t){document.getElementById('fill').style.width=n+'%';document.getElementById('pct').textContent=n+' %';if(t)document.getElementById('msg').textContent=t}
function fail(t){p(100,'Produktionsversion konnte nicht geladen werden');var e=document.getElementById('err');e.style.display='block';e.textContent=t||'Release-API nicht erreichbar.';document.getElementById('retry').style.display='block'}
function sanitize(h){h=String(h||'');h=h.replace(new RegExp('<script[^>]+id=["\\\']rc503-release-bootstrap["\\\'][^>]*>[\\s\\S]*?<\\/script>','i'),'');return h}
function marker(v){return '<script>window.__EXPORTHUB_RELEASE_STREAMED__=true;window.__EXPORTHUB_RELEASE_CHANNEL__="production";window.__EXPORTHUB_RELEASE_VERSION__='+JSON.stringify(v)+';<\\/script>'}
function bridge(){return '<script>(function(){"use strict";var API="/api/exporthub-release";function q(v){return String(v==null?"":v).trim()}function token(){try{return q(window.ExportHUBClean&&window.ExportHUBClean.runtime&&window.ExportHUBClean.runtime.authToken)}catch(_){return""}}function heads(){var t=token(),h={"Content-Type":"application/json",Accept:"application/json"};if(t){h["X-ExportHUB-Token"]=t;h["X-ExportHUB-Session"]=t;h.Authorization="Bearer "+t}return h}async function activate(v){v=q(v).toUpperCase();if(!v)return false;var r=await fetch(API+"?action=set-test&_="+Date.now(),{method:"POST",credentials:"same-origin",cache:"no-store",headers:heads(),body:JSON.stringify({version:v})}),d={};try{d=await r.json()}catch(_){}if(!r.ok||d.ok===false)throw new Error(d.message||("HTTP "+r.status));try{sessionStorage.setItem("exporthub_test_portal_requested","1")}catch(_){}location.href="/test/?active="+encodeURIComponent(v)+"&_="+Date.now();return false}function install(){window.rc503OpenTestPortal=function(){try{sessionStorage.setItem("exporthub_test_portal_requested","1")}catch(_){}location.href="/test/?_="+Date.now();return false};window.rc503SetTest=function(v){activate(v).catch(function(e){alert("Testversion konnte nicht aktiviert werden: "+e.message)});return false};}install();window.addEventListener("exporthub:ready",install);window.addEventListener("exporthub:rendered",install);document.addEventListener("click",function(e){var b=e.target&&e.target.closest&&e.target.closest("#releaseTestPortalBtn");if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();try{sessionStorage.setItem("exporthub_test_portal_requested","1")}catch(_){}location.href="/test/?_="+Date.now()},true)})();<\\/script>'}
function inject(h,v){if(done)return;if(!/<html[\s>]/i.test(h))throw new Error('Ungültige ExportHUB-Produktionsdatei.');done=true;h=sanitize(h);h=h.replace(/<head(\s[^>]*)?>/i,function(m,a){return '<head'+(a||'')+'>'+marker(v)});h=h.replace(/<\/body>/i,bridge()+'</body>');p(100,'Produktion '+v+' wird gestartet …');setTimeout(function(){document.open('text/html','replace');document.write(h);document.close()},20)}
async function text(url,opt){var r=await fetch(url,Object.assign({credentials:'same-origin',cache:'no-store'},opt||{}));var body=await r.text();if(!r.ok)throw new Error(body||('HTTP '+r.status));return body}
async function boot(){try{p(30,'Produktionsstatus wird geprüft …');var raw=await text(API+'?action=active&channel=production&_='+Date.now(),{headers:{Accept:'application/json'}}),m=JSON.parse(raw),v=String(m&&m.version||'').trim().toUpperCase();if(!v)throw new Error('Im Release-Center ist keine Produktionsversion freigegeben.');p(55,'Produktion '+v+' wird geladen …');var h=await text(API+'?action=html&channel=production&_='+Date.now(),{headers:{Accept:'text/html'}});p(85,'Oberfläche wird vorbereitet …');inject(h,v)}catch(e){fail(e.message)}}
boot();
})();
</script></body></html>
