name: RC1564 Language Switch Verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/rc1079-profile-settings.js'
      - 'assets/rc1018-mail-language-standard.js'
      - 'assets/rc1267-i18n.js'
      - 'index.html'
      - 'TESTVERSION.html'
      - 'test/rc1564-language-switch.test.mjs'
      - 'e2e/specs/rc1564-language-switch.spec.mjs'
      - 'e2e/helpers/**'
      - '.github/rc1112/**'
      - '.github/workflows/rc1564-language-verify.yml'
  push:
    branches: [main]
    paths:
      - 'assets/rc1079-profile-settings.js'
      - 'assets/rc1018-mail-language-standard.js'
      - 'assets/rc1267-i18n.js'
      - 'index.html'
      - 'TESTVERSION.html'
      - 'test/rc1564-language-switch.test.mjs'
      - 'e2e/specs/rc1564-language-switch.spec.mjs'
      - 'e2e/helpers/**'
      - '.github/rc1112/**'
      - '.github/workflows/rc1564-language-verify.yml'

permissions:
  contents: read

concurrency:
  group: rc1564-language-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Sprachwechsel-Vertrag prüfen
        run: node --test test/rc1564-language-switch.test.mjs

      - name: Drei-Umgebungen-Paket bauen
        run: node .github/rc1112/build-three-env.mjs

      - name: Playwright installieren
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: Sprachwechsel im echten Browser prüfen
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_ENTRY: /demo.html
        run: npx playwright test e2e/specs/rc1564-language-switch.spec.mjs --project=laptop

      - name: Browser-Fehlerartefakte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rc1564-language
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
