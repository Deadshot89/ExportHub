name: RC1003 Aufgaben Syntax

on:
  workflow_dispatch:
  push:
    branches:
      - rc1003-task-render-fix-pickup-prep
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'test/rc1003-task-render-syntax.test.mjs'
      - '.github/workflows/rc1003-task-render-red.yml'

permissions:
  contents: read

concurrency:
  group: rc1003-task-render-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Aufgaben-Gruppenblock Diagnose
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const lines=[];
          for(const file of ['TESTVERSION.html','index.html']){
            const html=fs.readFileSync(file,'utf8');
            const start=html.indexOf('function taskGroupNameRC874(t){');
            const end=html.indexOf('function taskGroupOpenRC874',start);
            const src=html.slice(start,end>start?end:start+2500);
            lines.push(`--- ${file} start=${start} end=${end} ---`);
            lines.push(JSON.stringify(src.slice(0,2200)));
            try{new Function(`"use strict";\n${src}\nreturn taskGroupNameRC874;`);lines.push('compile=OK')}
            catch(e){lines.push(`compile=FAIL ${e.name}: ${e.message}`)}
          }
          fs.writeFileSync('rc1003-diagnostic.txt',lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          NODE
      - name: Diagnose-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rc1003-task-render-diagnostic
          path: rc1003-diagnostic.txt
          retention-days: 1
      - name: Aufgaben-Gruppenblock kompilieren
        run: node --test test/rc1003-task-render-syntax.test.mjs
