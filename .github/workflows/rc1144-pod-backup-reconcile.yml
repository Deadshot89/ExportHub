          set +x
          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-pod-backup-reconcile" \
              | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(
