name: RC1031 Pickup Status Inspect
on:
  push:
    branches:
      - fix/rc1031-diagnostics-lieferavis-storage
    paths:
      - .github/workflows/rc1031-inspect-pickup-status.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Hauptclient und Quellen nach pickup-status durchsuchen
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          function scan(file){
            const s=fs.readFileSync(file,'utf8');let at=0,n=0;
            while((at=s.indexOf('pickup-status',at))>=0){
              n++;console.log('\n### '+file+' Treffer '+n+' @ '+at+' ###');
              console.log(s.slice(Math.max(0,at-900),Math.min(s.length,at+1300)).replace(/\n/g,' '));
              at+=13;
            }
          }
          scan('TESTVERSION.html');
          for(const dir of ['assets','.github']){
            const walk=d=>fs.readdirSync(d,{withFileTypes:true}).forEach(e=>{const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(/\.(?:js|mjs|cjs|html|py|yml)$/.test(e.name)){const s=fs.readFileSync(p,'utf8');if(s.includes('pickup-status'))scan(p)}});walk(dir);
          }
          NODE
