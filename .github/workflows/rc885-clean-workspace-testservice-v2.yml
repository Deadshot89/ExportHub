            #rc885Workspace h2{
              margin:0;
              font-size:22px;
              line-height:1.2;
              color:#102a43;
            }
            #rc885Workspace .rc885-sub{
              margin-top:4px;
              font-size:13px;
              color:#64748b;
            }
            #rc885Workspace .rc885-focus{
              display:flex;
              flex-wrap:wrap;
              gap:8px;
            }
            #rc885Workspace .rc885-focus button{
              border:1px solid #cbd9e7;
              background:#f8fbfe;
              color:#334155;
              border-radius:999px;
              padding:8px 13px;
              font-weight:750;
              cursor:pointer;
            }
            #rc885Workspace .rc885-focus button[aria-pressed="true"]{
              border-color:#2563eb;
              background:#eaf2ff;
              color:#1d4ed8;
              box-shadow:0 0 0 2px rgba(37,99,235,.08);
            }
            #rc885Workspace .rc885-grid{
              display:grid;
              grid-template-columns:minmax(0,1fr) minmax(0,1fr);
              gap:14px;
              padding:16px 20px 20px;
            }
            #rc885Workspace .rc885-panel{
              border:1px solid #e2e8f0;
              border-radius:15px;
              background:#fbfdff;
              padding:15px;
              min-height:164px;
            }
            #rc885Workspace .rc885-panel-head{
              display:flex;
              align-items:center;
              justify-content:space-between;
              gap:10px;
              margin-bottom:12px;
            }
            #rc885Workspace .rc885-panel-title{
              display:flex;
              align-items:center;
              gap:9px;
              font-size:16px;
              font-weight:850;
              color:#17324d;
            }
            #rc885Workspace .rc885-badge{
              display:inline-flex;
              min-width:27px;
              height:27px;
              align-items:center;
              justify-content:center;
              padding:0 7px;
              border-radius:999px;
              background:#e9f2ff;
              color:#1d4ed8;
              font-size:12px;
              font-weight:850;
            }
            #rc885Workspace .rc885-open{
              border:1px solid #bdd3e7;
              border-radius:10px;
