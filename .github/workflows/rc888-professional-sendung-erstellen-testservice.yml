      - name: GREEN regression and source safety
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "version:'RC888',cache:'888',loginReturn:'/TESTVERSION.html?v=888'" TESTVERSION.html
          grep -Fq "/* exporthub-rc888-shipment-create-professional */" TESTVERSION.html
          grep -Fq "rc888ShipmentHeader" TESTVERSION.html
          grep -Fq "Fällige Aufgaben" TESTVERSION.html
          grep -Fq "Speichern & Ausgabe" TESTVERSION.html
          grep -Fq "Kunde & Empfänger" TESTVERSION.html
          grep -Fq "Colli & LDM" TESTVERSION.html
          grep -Fq "/* exporthub-rc886-testservice-api-hotfix */" TESTVERSION.html
          grep -Fq "__rc887AvisAllowed" TESTVERSION.html

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          src=Path("TESTVERSION.html").read_text(encoding="utf-8",errors="replace")

          expected={
              "script_open":int(Path("/tmp/rc888_script_open").read_text()),
              "script_close":int(Path("/tmp/rc888_script_close").read_text()),
              "style_open":int(Path("/tmp/rc888_style_open").read_text()),
              "style_close":int(Path("/tmp/rc888_style_close").read_text())
          }
          actual={
              "script_open":src.lower().count("<script"),
              "script_close":src.lower().count("</script>"),
              "style_open":src.lower().count("<style"),
              "style_close":src.lower().count("</style>")
          }

          if expected!=actual:
              raise SystemExit("RC888 hat HTML Script-/Style-Grenzen verändert: "+repr({"vorher":expected,"nachher":actual}))

          class V(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script=0; self.style=0; self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=="script": self.script+=1
                  elif tag.lower()=="style": self.style+=1
              def handle_endtag(self,tag):
                  if tag.lower()=="script" and self.script: self.script-=1
                  elif tag.lower()=="style" and self.style: self.style-=1
              def handle_data(self,data):
                  if not self.script and not self.style: self.parts.append(data)

          p=V(); p.feed(src); p.close()
          visible="\n".join(p.parts)
          bad=[
              "function applyFixedBlocks()",
              "window.open('about:blank'",
              'window.open("about:blank"',
              "exporthub-rc888-shipment-create-professional",
              "function makeHeader()"
          ]
          leaks=[x for x in bad if x in visible]
          if leaks:
              raise SystemExit("JavaScript als sichtbarer Seitentext: "+", ".join(leaks))

          print("GREEN: RC888 vorhanden, HTML-Grenzen unverändert, keine bekannten JS-Leaks.")
          PY

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet --             index.html             production-version.js             api             pickup.html             location.html             customer-avis.html             staticwebapp.config.json             staticwebapp.testservice.config.json             .github/workflows
          then
            echo "::error::Produktion/API/Deploy wurde verändert."
            exit 1
          fi

          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "TESTVERSION.html" ]]; then
            echo "::error::RC888 darf ausschließlich TESTVERSION.html ändern."
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi

      - name: Commit RC888 TESTSERVICE
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC888: professional shipment create layout"
          git push origin main

