name: Build ExportHUB Android RC1043 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'test/rc1003-android-native-direct-open.test.mjs'
      - 'test/rc1003-three-env-sync.test.mjs'
      - 'test/rc1011-three-env-sync.test.mjs'
      - 'test/rc1012-three-env-sync.test.mjs'
      - 'test/rc1013-restpunkte.test.mjs'
      - 'test/rc1013-three-env-sync.test.mjs'
      - 'test/rc1016-release-sync.test.mjs'
      - 'test/rc1018-mail-language-standard.test.mjs'
      - 'test/rc1018-production-deploy.test.mjs'
      - '.github/rc997/diagnostic-notifications-contract.test.mjs'
      - 'production-version.js'
      - '.github/rc1016/**'
      - '.github/rc1018/**'
      - '.github/rc1043/**'
      - '.github/workflows/rc1002-main-contract.yml'
      - '.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml'
      - '.github/workflows/exporthub-testservice.yml'
      - '.github/workflows/exporthub-android-test-app.yml'
permissions:
  contents: read
concurrency:
  group: exporthub-android-rc1043-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1043 Release-Vertrag
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 1043' android-app/app/build.gradle.kts
          grep -q 'versionName = "1.0-rc1043"' android-app/app/build.gradle.kts
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1043'" production-version.js
          for test_file in \
            test/rc1003-android-native-direct-open.test.mjs \
            test/rc1003-three-env-sync.test.mjs \
            test/rc1011-three-env-sync.test.mjs \
            test/rc1012-three-env-sync.test.mjs \
            test/rc1013-restpunkte.test.mjs \
            test/rc1013-three-env-sync.test.mjs \
            test/rc1016-release-sync.test.mjs \
            test/rc1018-mail-language-standard.test.mjs \
            test/rc1018-production-deploy.test.mjs
          do
            node --test "$test_file"
          done
      - name: Diagnose-Benachrichtigungen Regression
        shell: bash
        run: node --test --test-name-pattern='Fehlerdiagnose besitzt|Website-App-Brücke|Tipp auf Diagnose-Benachrichtigung|veraltete MainActivity' .github/rc997/diagnostic-notifications-contract.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ExportHUB-RC1043-Android-debug.apk
          sha256sum out/ExportHUB-RC1043-Android-debug.apk > out/ExportHUB-RC1043-Android-debug.sha256.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ExportHUB-RC1043-Android
          path: android-app/out/*
          if-no-files-found: error
          retention-days: 30
