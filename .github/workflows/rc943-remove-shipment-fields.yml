name: RC943 Sendung erstellen Felder entfernen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc943-remove-shipment-fields.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rc943-remove-shipment-fields
  cancel-in-progress: false

jobs:
  patch_verify_deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED – beide Felder müssen in RC942 noch sichtbar sein
        id: red
        continue-on-error: true
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'" in text, 'Basis ist nicht exakt RC942.'
          planned='''<label class="field">Geplantes Abholdatum<input type="date" value="${esc(s.plannedPickupDate||s.pickupDate||'')}" onchange="setShipmentPickupDate(this.value)"></label>'''
          carrier='''<label class="field">Spedition<input value="${esc(s.carrier||c.carrier||'')}" onchange="state.shipment.carrier=this.value" placeholder="z. B. Paul Langen, DHL, Dachser..."></label>'''
          assert planned not in text, 'Geplantes Abholdatum ist noch sichtbar.'
          assert carrier not in text, 'Spedition ist noch sichtbar.'
          PY

      - name: RED-Ergebnis verifizieren
        shell: bash
        env:
          RED_OUTCOME: ${{ steps.red.outcome }}
        run: |
          if [[ "$RED_OUTCOME" != "failure" ]]; then
            echo "RED ist nicht wie erwartet fehlgeschlagen. RC942 wird nicht verändert."
            exit 1
          fi
          echo "RED bestätigt: Mindestens eines der beiden unerwünschten Felder ist in Sendung erstellen noch sichtbar."

      - name: RC943 – nur die zwei Eingabefelder aus Sendung erstellen entfernen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('TESTVERSION.html')
          text=p.read_text(encoding='utf-8')

          def once(src,old,new,label):
              n=src.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: erwartet 1 Fundstelle, gefunden {n}')
              return src.replace(old,new,1)

          text=once(text,
              "version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'",
              "version:'RC943',cache:'943',loginReturn:'/TESTVERSION.html?v=943'",
              'BUILD-Version')

          marker="changes:Object.freeze([\n"
          if text.count(marker)!=1:
              raise SystemExit('Release-Anker nicht eindeutig')
          note="    'RC943 entfernt in Sendung erstellen die sichtbaren Eingabefelder Geplantes Abholdatum und Spedition. Die vorhandenen Abhol-, Aufgaben-, QR-, Speditions- und Dokumentdatenpfade bleiben unverändert erhalten.',\n"
          text=text.replace(marker,marker+note,1)

          planned='''<label class="field">Geplantes Abholdatum<input type="date" value="${esc(s.plannedPickupDate||s.pickupDate||'')}" onchange="setShipmentPickupDate(this.value)"></label>'''
          carrier='''<label class="field">Spedition<input value="${esc(s.carrier||c.carrier||'')}" onchange="state.shipment.carrier=this.value" placeholder="z. B. Paul Langen, DHL, Dachser..."></label>'''
          text=once(text,planned,'','Geplantes Abholdatum UI')
          text=once(text,carrier,'','Spedition UI')

          p.write_text(text,encoding='utf-8')
          PY

      - name: GREEN – RC943 Anforderungen und Datenpfade prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          planned='''<label class="field">Geplantes Abholdatum<input type="date" value="${esc(s.plannedPickupDate||s.pickupDate||'')}" onchange="setShipmentPickupDate(this.value)"></label>'''
          carrier='''<label class="field">Spedition<input value="${esc(s.carrier||c.carrier||'')}" onchange="state.shipment.carrier=this.value" placeholder="z. B. Paul Langen, DHL, Dachser..."></label>'''

          assert "version:'RC943',cache:'943',loginReturn:'/TESTVERSION.html?v=943'" in text
          assert 'RC943 entfernt in Sendung erstellen die sichtbaren Eingabefelder Geplantes Abholdatum und Spedition' in text
          assert planned not in text
          assert carrier not in text

          # Bestehende Logik bleibt absichtlich vorhanden; entfernt wird nur die UI in Sendung erstellen.
          assert 'function setShipmentPickupDate(v)' in text
          assert 'function updateSavedShipmentPickupDate(id,v)' in text
          assert 'function createOrUpdateShipmentCreatedTask(s,c)' in text
          assert 'actualPickupDate' in text
          assert 'carrier' in text
          assert 'pickup-status' in text
          assert 'shipmentRecipientAddress' in text
          assert 'Ladeliste/CMR' in text
          assert '<label class="field">Verlader<input value="${esc(s.loader||'')}"' in text
          print('GREEN: Beide Felder aus Sendung erstellen entfernt; bestehende Daten-/QR-/Aufgabenpfade vorhanden.')
          PY

      - name: Diff und Integrität prüfen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          grep -m1 -oE "version:'RC[0-9]+'" TESTVERSION.html
          git diff -- TESTVERSION.html

      - name: RC943 nach main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          if git diff --cached --quiet; then
            echo "Keine Änderung erzeugt – Abbruch."
            exit 1
          fi
          git commit -m "RC943 Sendung erstellen Felder entfernen"
          git push origin HEAD:main

      - name: Temporären RC943-Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm .github/workflows/rc943-remove-shipment-fields.yml
          git commit -m "RC943 temporären Patch-Workflow entfernen"
          git push origin HEAD:main

      - name: TESTSERVICE-Deploy für RC943 auslösen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/exporthub-testservice-final-artifact-fix.yml/dispatches" \
            -d '{"ref":"main"}')"
          cat /tmp/dispatch.out || true
          [[ "$code" == "204" ]] || { echo "Dispatch fehlgeschlagen: HTTP $code"; exit 1; }
          echo "TESTSERVICE-Deploy RC943 ausgelöst."
