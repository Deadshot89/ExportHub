name: RC1111 Deckblatt Contrast

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rc1111-deckblatt-contrast
    paths:
      - '.github/rc1048/build-three-env.mjs'
      - 'test/rc1111-deckblatt-contrast.test.mjs'
      - '.github/workflows/rc1111-deckblatt-contrast.yml'

permissions:
  contents: read

concurrency:
  group: exporthub-rc1111-deckblatt-contrast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: RC1111 targeted regression
        run: node --test test/rc1111-deckblatt-contrast.test.mjs

      - name: Build canonical three environments
        run: node .github/rc1048/build-three-env.mjs

      - name: Verify built Deckblatt contrast
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html TESTVERSION.html demo.html; do
            grep -Fq 'linear-gradient(180deg,#dbeafe 0,#dbeafe 52mm,#eef6ff 52mm,#eef6ff 100%)' "dist-rc1048/$file"
            grep -Fq 'border:4mm solid #08245d!important' "dist-rc1048/$file"
            grep -Fq 'background:#08245d' "dist-rc1048/$file"
            grep -Fq 'print-color-adjust:exact!important' "dist-rc1048/$file"
            grep -Fq '.rc352-cover .rc352-qr-slot{background:#fff!important' "dist-rc1048/$file"
          done

      - name: Prepare production and TESTSERVICE
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rc1111_production .rc1111_testservice
          mkdir -p .rc1111_production .rc1111_testservice
          for dir in .rc1111_production .rc1111_testservice; do
            cp dist-rc1048/pickup.html dist-rc1048/customer-avis.html dist-rc1048/location.html dist-rc1048/pod-notfall.html dist-rc1048/migration-recovery.html "$dir/"
            cp dist-rc1048/production-version.js "$dir/production-version.js"
            cp -R assets "$dir/assets"
            cp -R dist-rc1048/assets/. "$dir/assets/"
          done
          cp staticwebapp.config.json .rc1111_production/staticwebapp.config.json
          cp dist-rc1048/index.html .rc1111_production/index.html
          cp staticwebapp.testservice.config.json .rc1111_testservice/staticwebapp.config.json
          cp dist-rc1048/TESTVERSION.html .rc1111_testservice/index.html
          cp dist-rc1048/TESTVERSION.html .rc1111_testservice/TESTVERSION.html
          cp dist-rc1048/demo.html .rc1111_testservice/demo.html

      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1111_production
          api_location: api
          output_location: ''
          skip_app_build: true

      - name: Deploy TESTSERVICE
        if: github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EXPORT_HUB_EUROPE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1111_testservice
          api_location: api
          output_location: ''
          skip_app_build: true
          deployment_environment: testservice

      - name: Verify RC1111 live
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          prod='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          testservice='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          for attempt in {1..24}; do
            ok=1
            for page in "$prod/" "$testservice/TESTVERSION.html"; do
              body=$(mktemp)
              code=$(curl -sS -L -o "$body" -w '%{http_code}' --max-time 20 "$page?rc1111=$GITHUB_SHA-$attempt" || true)
              [[ "$code" == '200' ]] || ok=0
              grep -Fq 'linear-gradient(180deg,#dbeafe 0,#dbeafe 52mm,#eef6ff 52mm,#eef6ff 100%)' "$body" || ok=0
              grep -Fq 'border:4mm solid #08245d!important' "$body" || ok=0
              grep -Fq 'print-color-adjust:exact!important' "$body" || ok=0
              grep -Fq '.rc352-cover .rc352-qr-slot{background:#fff!important' "$body" || ok=0
              rm -f "$body"
            done
            if [[ "$ok" == '1' ]]; then
              echo 'RC1111 Deckblatt-Kontrast live in production and TESTSERVICE.'
              exit 0
            fi
            sleep 5
          done
          echo 'RC1111 live verification failed.' >&2
          exit 1
