              start=source.find(marker,start_at)
              if start<0: raise SystemExit(name+" fehlt")
              brace=source.find("{",start)
              depth=0; quote=""; esc=False; line=False; block=False
              i=brace
              while i<len(source):
                  c=source[i]
                  n=source[i+1] if i+1<len(source) else ""
                  if line:
                      if c=="\n": line=False
                      i+=1; continue
                  if block:
                      if c=="*" and n=="/": block=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False; i+=1; continue
                      if c=="\\": esc=True; i+=1; continue
                      if c==quote: quote=""
                      i+=1; continue
                  if c=="/" and n=="/": line=True; i+=2; continue
                  if c=="/" and n=="*": block=True; i+=2; continue
                  if c in ("'",'"',"`"): quote=c; i+=1; continue
                  if c=="{": depth+=1
                  elif c=="}":
                      depth-=1
                      if depth==0: return source[start:i+1]
                  i+=1
              raise SystemExit(name+" Ende fehlt")

          marker=src.find("/* exporthub-rc885-clean-workspace-v4 */")
          workspace=find_function(src,"workspaceHtml",marker)
          if "panelHtml('task')" in workspace or "panelHtml('shipment')" in workspace:
              raise SystemExit("Dashboard-Dublette weiterhin aktiv")
          for label in ("Fällige Aufgaben","Offene Sendungen","Dokumente prüfen","Abholung offen"):
              if label not in workspace:
                  raise SystemExit("Arbeitsfokus fehlt: "+label)

          avis=src.find("function avisHost(view)")
          render=find_function(src,"render",avis)
          if "__rc887AvisAllowed" not in render:
              raise SystemExit("Avis View-Guard fehlt")
          if "!/shipment/.test(__rc887AvisView)" not in render:
              raise SystemExit("Shipment-Ausschluss für Avis fehlt")
          if len(render)<1200:
              raise SystemExit("Lieferavis-Renderer wurde nicht vollständig wiederhergestellt")

          expected={
              "so":int(Path("/tmp/rc887_script_open").read_text()),
              "sc":int(Path("/tmp/rc887_script_close").read_text()),
              "to":int(Path("/tmp/rc887_style_open").read_text()),
              "tc":int(Path("/tmp/rc887_style_close").read_text())
          }
          actual={
              "so":src.lower().count("<script"),
              "sc":src.lower().count("</script>"),
              "to":src.lower().count("<style"),
              "tc":src.lower().count("</style>")
          }
          if actual!=expected:
              raise SystemExit("Script-/Style-Grenzen verändert: "+repr({"vorher":expected,"nachher":actual}))

          class V(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script=0; self.style=0; self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=="script": self.script+=1
                  elif tag.lower()=="style": self.style+=1
              def handle_endtag(self,tag):
                  if tag.lower()=="script" and self.script: self.script-=1
                  elif tag.lower()=="style" and self.style: self.style-=1
              def handle_data(self,data):
                  if not self.script and not self.style: self.parts.append(data)

          p=V(); p.feed(src); p.close()
          visible="\n".join(p.parts)
          bad=[
              "function applyFixedBlocks()",
              "window.open('about:blank'",
              'window.open("about:blank"',
              "__rc887AvisAllowed",
              "function workspaceHtml()"
          ]
          leaks=[x for x in bad if x in visible]
          if leaks:
              raise SystemExit("JavaScript als sichtbarer Seitentext: "+", ".join(leaks))

          print("GREEN PASS: Lieferavis + Dashboard-Dublette repariert.")
          PY

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet --             index.html             production-version.js             api             pickup.html             location.html             customer-avis.html             staticwebapp.config.json             staticwebapp.testservice.config.json             .github/workflows/exporthub-testservice.yml
          then
            echo "::error::Produktions-/API-/Deploy-Dateien wurden verändert."
            exit 1
          fi

          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "TESTVERSION.html" ]]; then
            echo "::error::RC887 darf ausschließlich TESTVERSION.html ändern."
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi

      - name: Commit RC887 TESTSERVICE
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC887: restore Lieferavis and remove dashboard duplicates"
          git push origin main

      - name: Snapshot TESTSERVICE deploy runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list             --workflow exporthub-testservice.yml             --limit 50             --json databaseId             --jq '.[].databaseId' > /tmp/rc887_runs_before.txt || true

      - name: Dispatch TESTSERVICE deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/exporthub-testservice.yml/dispatches"             -f ref=main

      - name: Wait for RC887 TESTSERVICE deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""

          for attempt in $(seq 1 60); do
            mapfile -t IDS < <(
              gh run list                 --workflow exporthub-testservice.yml                 --event workflow_dispatch                 --branch main                 --limit 20                 --json databaseId                 --jq '.[].databaseId'
            )

            for id in "${IDS[@]}"; do
              if ! grep -qx "$id" /tmp/rc887_runs_before.txt 2>/dev/null; then
                RUN_ID="$id"
                break
              fi
            done

            [[ -n "$RUN_ID" ]] && break
            sleep 5
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::RC887 TESTSERVICE Deploy wurde nicht gefunden."
            exit 1
          fi

          gh run watch "$RUN_ID" --exit-status

      - name: RC887 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## ExportHUB RC887"
            echo
            echo "- Lieferavis/KundenAvis auf dedizierten Avis-Ansichten wiederhergestellt"
            echo "- Lieferavis bleibt aus Sendung erstellen / Sendungsansicht entfernt"
            echo "- Doppelte Meine-Aufgaben-/Meine-Sendungen-Darstellung entfernt"
            echo "- Persönlicher Arbeitsplatz zeigt nur noch kompakten Arbeitsfokus"
            echo "- Bestehende Dashboard-Aufgaben und -Sendungen bleiben die einzigen Detailbereiche"
            echo "- RC886 API-Hotfix unverändert"
            echo "- Nur TESTVERSION.html geändert"
            echo "- Produktion unverändert"
          } >> "$GITHUB_STEP_SUMMARY"
