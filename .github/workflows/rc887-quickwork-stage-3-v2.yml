name: RC887 Quick Work Stage 3 v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc887-quickwork-v2
  cancel-in-progress: false

jobs:
  patch-testservice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Internal main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard RC886 baseline
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f TESTVERSION.html ]; then
            echo "::error title=TESTVERSION fehlt::TESTVERSION.html wurde im Repository nicht gefunden."
            exit 1
          fi
          VERSION="$(grep -o "version:'RC[0-9]*',cache:'[0-9]*',loginReturn:'/TESTVERSION.html?v=[0-9]*'" TESTVERSION.html | head -n1 | sed -E "s/version:'(RC[0-9]+)'.*/\1/")"
          echo "Detected TESTVERSION baseline: ${VERSION:-unbekannt}"
          if [ "$VERSION" != "RC886" ]; then
            echo "::error title=RC886 Voraussetzung fehlt::Erkannt wurde ${VERSION:-keine Version}. Bitte zuerst 'RC886 Shipment Progress Stage 2 v2' erfolgreich ausführen. RC887 verändert in diesem Zustand nichts."
            exit 1
          fi
          required_marker() {
            local marker="$1"
            local label="$2"
            if ! grep -Fq "$marker" TESTVERSION.html; then
              echo "::error title=RC886 unvollständig::$label fehlt. RC887 wird aus Sicherheitsgründen nicht installiert."
              exit 1
            fi
          }
          required_marker "Produktivitätsstufe 2: Sendungsfortschritt und Dokumenten-Ampel" "RC886 Release-Metadaten"
          required_marker 'id="exporthub-rc885-productivity"' "RC885 Produktivitätsmodul"
          required_marker 'ExportHUBProductivity885=Object.freeze' "RC885 Diagnose-API"
          required_marker 'id="exporthub-rc886-shipment-progress"' "RC886 Fortschrittsmodul"
          required_marker 'ExportHUBShipmentProgress886=Object.freeze' "RC886 Diagnose-API"
          required_marker '__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__' "RC884 Navigationsschutz"
          required_marker 'rc807ShipmentSearch' "RC884 Sendungssuche"
          required_marker 'function setShipmentCustomerSearchAuto(v)' "bestehende Kundensuche"
          if grep -Fq 'id="exporthub-rc887-quickwork"' TESTVERSION.html; then
            echo "::error title=RC887 bereits vorhanden::Der RC887-Modulmarker ist bereits vorhanden. Workflow beendet sicher, statt doppelt zu installieren."
            exit 1
          fi

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC886 backup tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-rc886-before-rc887-quickwork"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Backup tag already exists: $TAG"
          else
            git tag -a "$TAG" -m "Last known RC886 baseline before RC887 quick work"
            git push origin "$TAG"
          fi

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'TESTVERSION.html';
          let text = fs.readFileSync(path, 'utf8');
          const original = text;

          function replaceOnce(oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0) throw new Error(label + ': Ausgangsblock nicht gefunden');
            if (text.indexOf(oldText, first + oldText.length) >= 0) throw new Error(label + ': Ausgangsblock mehrfach gefunden');
            text = text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          replaceOnce(
            "var BUILD=Object.freeze({version:'RC886',cache:'886',loginReturn:'/TESTVERSION.html?v=886'});",
            "var BUILD=Object.freeze({version:'RC887',cache:'887',loginReturn:'/TESTVERSION.html?v=887'});",
            'Canonical BUILD'
          );

          replaceOnce(
            " version:'RC886',\n date:'30.08.2026',\n title:'Produktivitätsstufe 2: Sendungsfortschritt und Dokumenten-Ampel',",
            " version:'RC887',\n date:'30.08.2026',\n title:'Produktivitätsstufe 3: Favoriten, Vorlagen und Schnellerfassung',",
            'Release metadata'
          );

          const moduleBase64 = '';
          const moduleHtml = Buffer.from(moduleBase64, 'base64').toString('utf8');
          if (!moduleHtml.includes('exporthub-rc887-quickwork') || !moduleHtml.includes('ExportHUBQuickWork887')) throw new Error('RC887 Modul beschädigt');
          const bodyClose = text.lastIndexOf('</body>');
          if (bodyClose < 0) throw new Error('HTML body-Ende fehlt');
          text = text.slice(0, bodyClose) + '\n' + moduleHtml + '\n' + text.slice(bodyClose);

          const changesAnchor = " changes:Object.freeze([\n";
          const changesPos = text.indexOf(changesAnchor);
          if (changesPos < 0) throw new Error('Release changes: Anker fehlt');
          const newChanges =
            '    "RC887 ergänzt persönliche Schnellzugriffe auf häufig verwendete Bereiche und Kunden. Gespeichert werden nur UI-Favoriten im Browser; Kundenstamm und Sendungsdaten werden nicht dupliziert.",\n' +
            '    "RC887 ergänzt Sendungsvorlagen für wiederkehrende Grundstrukturen. Referenz, Datum, Dokumente, Status, ABD, POD, Anzahl und Gewicht werden bewusst nicht aus Vorlagen übernommen.",\n' +
            '    "RC887 ergänzt in Sendung erstellen eine Schnellerfassung mit Kundenfavoriten und Vorlagen. Die Anwendung füllt nur den aktuellen Entwurf und verwendet weiterhin die vorhandene ExportHUB-Kundenauswahl und Renderlogik.",\n' +
            '    "RC887 ändert ausschließlich TESTVERSION.html. Produktion, APIs, Pickup, Location, Customer-Avis und Produktionskonfiguration bleiben unverändert.",\n';
          text = text.slice(0, changesPos + changesAnchor.length) + newChanges + text.slice(changesPos + changesAnchor.length);

          if (text === original) throw new Error('Keine Änderung erzeugt');
          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: Static RC887 safety tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('TESTVERSION.html', 'utf8');
          function required(rx, message) { if (!rx.test(text)) throw new Error(message); }

          required(/version:'RC887',cache:'887',loginReturn:'\/TESTVERSION\.html\?v=887'/, 'RC887 BUILD fehlt');
          required(/Produktivitätsstufe 3: Favoriten, Vorlagen und Schnellerfassung/, 'RC887 Release-Metadaten fehlen');

          // Vorherige stabile Stufen bleiben erhalten.
          required(/__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__/, 'RC884 Navigation-Guard fehlt');
          required(/rc807ShipmentSearch/, 'RC884 Sendungssuche fehlt');
          required(/id="exporthub-rc885-productivity"/, 'RC885 Produktivitätsmodul fehlt');
          required(/ExportHUBProductivity885=Object\.freeze/, 'RC885 Diagnose-API fehlt');
          required(/id="exporthub-rc886-shipment-progress"/, 'RC886 Fortschrittsmodul fehlt');
          required(/ExportHUBShipmentProgress886=Object\.freeze/, 'RC886 Diagnose-API fehlt');

          // Neue RC887 Oberfläche.
          required(/id="exporthub-rc887-quickwork-style"/, 'RC887 CSS fehlt');
          required(/id="exporthub-rc887-quickwork"/, 'RC887 Modul fehlt');
          required(/__EXPORTHUB_RC887_QUICKWORK__/, 'RC887 Single-Install-Guard fehlt');
          required(/ExportHUBQuickWork887=Object\.freeze/, 'RC887 Diagnose-API fehlt');
          required(/Favoriten & Vorlagen/, 'Dashboard-Schnellzugriff fehlt');
          required(/SCHNELLERFASSUNG/, 'Schnellerfassung fehlt');
          required(/Vorlage speichern/, 'Vorlagenfunktion fehlt');
          required(/Kundenfavoriten/, 'Kundenfavoriten fehlen');

          const scriptStart = text.indexOf('<script id="exporthub-rc887-quickwork">');
          const bodyStart = text.indexOf('\n', scriptStart) + 1;
          const scriptEnd = text.indexOf('</script>', bodyStart);
          if (scriptStart < 0 || bodyStart <= 0 || scriptEnd < 0) throw new Error('RC887 Script kann nicht extrahiert werden');
          const js = text.slice(bodyStart, scriptEnd);
          new Function(js);

          // RC887 darf keine eigenen Team-/Netzwerk-Speicherwege einführen.
          if (/fetch\s*\(|XMLHttpRequest|queueSave\s*\(|saveShipment\s*\(/.test(js)) throw new Error('RC887 enthält unerlaubten Netzwerk- oder Team-Speicherweg');
          if (/state\(\)\.shipments\s*=|\.shipments\.push\s*\(/.test(js)) throw new Error('RC887 schreibt direkt in gespeicherte Sendungen');

          // Vorlagen dürfen keine transaktionsbezogenen Felder übernehmen.
          const capture = js.match(/copyPresent\(sh,\[([^\]]+)\]\)/);
          if (!capture) throw new Error('RC887 Template-Whitelist fehlt');
          const list = capture[1];
          ['ref','reference','status','processStatus','plannedPickupDate','actualPickupDate','deliveryFiles','podFiles','abdFiles','generatedDocuments'].forEach(function(forbidden) {
            if (new RegExp("['\"]" + forbidden + "['\"]").test(list)) throw new Error('Unerlaubtes Vorlagenfeld: ' + forbidden);
          });
          required(/out\.count='';out\.quantity='';out\.weight=''/, 'Anzahl/Gewicht werden in Verpackungsvorlagen nicht zurückgesetzt');
          console.log('RC887 static safety tests: PASS');
          NODE

      - name: Verify production scope untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json; then
            echo "ERROR: Production/API/public files changed."
            git diff -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json
            exit 1
          fi
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "TESTVERSION.html"

      - name: Write RC887 test report
        shell: bash
        run: |
          cat > RC887_PRUEFBERICHT.txt <<'EOF'
          TESTBERICHT RC887 – PRODUKTIVITÄTSSTUFE 3

          Scope:
          - Ausschließlich TESTSERVICE / TESTVERSION.html
          - Keine Produktionsdatei und keine API geändert
          - RC884 Navigation/Suche, RC885 Arbeitsfokus und RC886 Sendungsfortschritt bleiben erhalten

          Neue Funktionen:
          1. Bereichsfavoriten
             - Aktuellen Hauptbereich mit ★ anheften/entfernen
             - Favoriten erscheinen auf dem Dashboard als Schnellzugriff
             - Nur persönliche Browser-Präferenz, keine Änderung an Team-/Fachdaten

          2. Kundenfavoriten
             - Aktuell gewählten Kunden in Sendung erstellen merken
             - Favoriten auf Dashboard und in der Schnellerfassung
             - Auswahl verwendet die bestehende ExportHUB-Kundenauswahl

          3. Sendungsvorlagen
             - Vorlage aus dem aktuellen Entwurf speichern
             - Übernommen werden nur wiederkehrende Grunddaten wie Kunde, Standort/Empfänger, Spedition und Verpackungsstruktur
             - Referenz, Datum, Status, Dokumente, ABD, POD, Anzahl und Gewicht werden NICHT kopiert
             - Anwendung verändert nur den aktuellen Entwurf und speichert ihn nicht automatisch

          4. Schnellerfassung
             - Direkt unter dem RC886-Sendungsfortschritt
             - Kundenfavoriten und Vorlagen ohne Umweg erreichbar
             - Keine zusätzliche Bestätigung für normale Kundenauswahl

          Verbindlicher Live-Test im Testservice:
          A. Testservice öffnen.
             Erwartung: Version RC887.

          B. Dashboard prüfen.
             Erwartung: Unter "Meine Arbeit heute" erscheint "Favoriten & Vorlagen".

          C. Einen Hauptbereich öffnen, z. B. Aufgaben oder Versandkosten.
             Erwartung: Oben erscheint ☆ Anheften. Anklicken -> ★ Favorit.

          D. Dashboard öffnen.
             Erwartung: Der angeheftete Bereich erscheint unter Bereiche und öffnet mit einem Klick den korrekten Bereich.

          E. Sendung erstellen öffnen und Kunden auswählen.
             Erwartung: Unter dem RC886-Fortschritt erscheint "Schnellerfassung".

          F. "Kunde merken" anklicken.
             Erwartung: Kunde erscheint sofort als Kundenfavorit und bleibt nach F5 auf diesem Browser erhalten.

          G. Einen anderen Kunden wählen und danach den Favoriten anklicken.
             Erwartung: ExportHUB übernimmt den Favoriten über die bestehende Kundenauswahl. Kein zusätzlicher "Kunde übernehmen"-Schritt.

          H. Eine Verpackungsstruktur erfassen und "Vorlage speichern" wählen.
             Erwartung: Vorlage erscheint in der Liste.

          I. Vorlage auf einer neuen/leeren Sendung anwenden.
             Erwartung: Kunde/Grundstruktur/Verpackungsart werden übernommen. Anzahl und Gewicht bleiben leer.

          J. Nach Anwendung der Vorlage prüfen:
             Erwartung: Neue Referenz bleibt die Referenz der aktuellen Sendung; Abholdatum, Status, Lieferscheine, ABD, CMR, POD und erzeugte Dokumente wurden nicht aus der Vorlage übernommen.

          K. Sendung normal weiter erfassen und speichern.
             Erwartung: Bestehender Speicherweg funktioniert unverändert; RC887 führt keine eigene Speicherung aus.

          L. Strg+K globale Suche testen.
             Erwartung: RC885 Suche funktioniert unverändert.

          M. Sendungs-Fortschritt und Dokumenten-Ampel prüfen.
             Erwartung: RC886 bleibt sichtbar und reagiert auf die aktuellen Sendungsdaten.

          N. Aus Sendungsansicht Dashboard, Aufgaben, Kunden und Versandkosten öffnen.
             Erwartung: Navigation bleibt stabil; keine Sendungsansicht blockiert andere Bereiche.

          O. Fehlerdiagnose exportieren.
             Erwartung: version = RC887 und keine neue RC887 JavaScript-Exception.
          EOF

      - name: Commit RC887 testservice
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html RC887_PRUEFBERICHT.txt
          git commit -m "RC887: add favourites templates and quick shipment entry"
          git push origin main
