name: RC1508 Targeted Multi-Truck Performance Regression

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'assets/rc1328-multi-truck-ui-refresh.js'
      - 'test/rc1508-multi-truck-save-watch-gate.test.mjs'
      - '.github/workflows/rc1508-targeted-regression.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: RC1508 targeted regression
        run: node --test test/rc1508-multi-truck-save-watch-gate.test.mjs
