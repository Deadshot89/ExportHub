name: RC972 Field Exception Audit Test

on:
  push:
    branches: [main]
    paths:
      - 'TESTVERSION.html'
      - 'customer-avis.html'
      - 'pickup.html'
      - 'location.html'
      - 'test/rc972-field-exception-audit.test.mjs'
      - '.github/workflows/rc972-field-exception-audit-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: RC972 Field Exception Regression
        run: node --test test/rc972-field-exception-audit.test.mjs
