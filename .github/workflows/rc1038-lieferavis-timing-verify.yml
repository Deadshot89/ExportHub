name: RC1038 Lieferavis Timing Verify

on:
  push:
    branches:
      - rc1038-lieferavis-timing-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1038 Timing-Abdeckung
        run: node --test test/rc1038-lieferavis-timing-coverage.test.mjs
