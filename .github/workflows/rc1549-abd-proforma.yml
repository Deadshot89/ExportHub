name: RC1549 ABD Proforma

on:
  pull_request:
    paths:
      - 'api/shared/abd-analysis.js'
      - 'api/shared/abd-analysis-model.js'
      - 'api/shared/abd-grouping.js'
      - 'api/shared/abd-analysis-export.js'
      - 'api/abd-analysis/**'
      - 'api/abd-analysis-export/**'
      - 'assets/rc1549-abd-proforma.js'
      - 'assets/rc1499-abd-export.js'
      - 'assets/rc1499-exportexperte-handoff.js'
      - '.github/rc1549/**'
      - '.github/rc1521/build-three-env.mjs'
      - 'test/rc1549-abd-proforma.test.mjs'
      - 'test/rc1601-abd-invoice-editor.test.mjs'
      - 'e2e/specs/rc1601-abd-invoice-editor.spec.mjs'
      - '.github/workflows/rc1549-abd-proforma.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install API runtime dependencies
        run: npm install --prefix api --ignore-scripts --no-audit --no-fund
      - name: RC1549 browser runtime syntax
        run: node --check assets/rc1549-abd-proforma.js
      - name: RC1549 ABD Proforma and A4 print-layout contracts
        env:
          EXPORTHUB_PDF_SAMPLE_DIR: pdf-proof/rc1603
        run: node --test test/rc1549-abd-proforma.test.mjs test/rc1601-abd-invoice-editor.test.mjs

      - name: Preserve real PDF samples for layout review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc1603-invoice-pdf-layout
          path: pdf-proof/rc1603/*.pdf
          if-no-files-found: ignore
          retention-days: 14

      - name: Build static ExportHUB package
        run: node .github/rc1112/build-three-env.mjs

      - name: Install Chromium for ABD browser regression
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: RC1601 upload and manual PDF end-to-end
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_PUBLIC_ENV: testservice
        run: npx playwright test e2e/specs/rc1601-abd-invoice-editor.spec.mjs --project=laptop

      - name: Preserve ABD browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rc1601-abd-editor-browser
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
