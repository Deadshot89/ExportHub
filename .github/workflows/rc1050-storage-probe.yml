name: RC1050 Storage Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc1050-storage-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ExportHUB Azure API Diagnose
        shell: bash
        run: |
          set -u
          prod='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          testservice='https://wonderful-forest-0f315e310-testservice.centralus.7.azurestaticapps.net'
          for base in "$prod" "$testservice"; do
            echo "===== $base /api/exporthub-health ====="
            curl -sS -i --max-time 20 "$base/api/exporthub-health" || true
            echo
            echo "===== $base /api/exporthub-auth-probe ====="
            curl -sS -i --max-time 20 "$base/api/exporthub-auth-probe" || true
            echo
            echo "===== $base /api/exporthub-state?mode=ping ====="
            curl -sS -i --max-time 20 "$base/api/exporthub-state?mode=ping" || true
            echo
          done
