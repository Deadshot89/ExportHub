<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExportHUB</title>
<style>
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eaf4fb;color:#0b2b5e}body{min-height:100vh;display:grid;place-items:center}.box{width:min(620px,calc(100% - 36px));background:#fff;border:1px solid #d9e6f1;border-radius:28px;box-shadow:0 24px 70px rgba(15,44,80,.16);padding:34px;text-align:center}.mark{width:68px;height:68px;border-radius:22px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#fff;font-weight:1000;font-size:25px}.box h1{margin:0 0 8px;font-size:30px}.box p{margin:0;color:#64748b;font-weight:700}.bar{height:12px;border-radius:999px;background:#e7eef5;overflow:hidden;margin:24px 0 10px}.fill{height:100%;width:8%;background:linear-gradient(90deg,#2563eb,#13b9ea);transition:width .25s ease}.pct{font-weight:900}.err{display:none;margin-top:18px;background:#fee2e2;color:#991b1b;border-radius:14px;padding:12px;text-align:left;font-weight:700}.retry{display:none;margin:14px auto 0;border:0;border-radius:12px;padding:10px 16px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="box"><div class="mark">EH</div><h1>ExportHUB wird geladen</h1><p id="msg">Freigegebene Produktionsversion wird ermittelt …</p><div class="bar"><div class="fill" id="fill"></div></div><div class="pct" id="pct">8 %</div><div class="err" id="err"></div><button class="retry" id="retry" onclick="location.reload()">Erneut laden</button></div>
<script>
(function(){
'use strict';
var API='/api/exporthub-release',KEY='exporthub_test_portal_requested',FALLBACK='/fallback/RC503.html',wantTest=false,done=false;
try{var u=new URL(location.href);wantTest=u.searchParams.get('portal')==='test'||/\/test(?:\/|$)/i.test(u.pathname);if(wantTest)sessionStorage.setItem(KEY,'1');else sessionStorage.removeItem(KEY)}catch(_){}
function progress(n,t){var f=document.getElementById('fill'),p=document.getElementById('pct'),m=document.getElementById('msg');if(f)f.style.width=n+'%';if(p)p.textContent=n+' %';if(m&&t)m.textContent=t}
function bridgeTag(){return '<script src="/release-bridge.js?v=2"><\\/script>'}
function marker(ver){return '<script>window.__EXPORTHUB_RELEASE_STREAMED__=true;window.__EXPORTHUB_RELEASE_CHANNEL__="production";window.__EXPORTHUB_RELEASE_VERSION__='+JSON.stringify(ver)+';<\\/script>'}
function sanitize(html){html=String(html||'');if(wantTest){html=html.replace(/<script[^>]+id=["']rc504-static-test-channel["'][^>]*>[\s\S]*?<\/script>/i,'');html=html.replace(/<script[^>]+id=["']rc503-release-portal-controller["'][^>]*>[\s\S]*?<\/script>/i,'')}return html}
function inject(html,ver){if(done)return;html=sanitize(html);if(!/<html[\s>]/i.test(html)||html.indexOf('exporthub-canonical-build-source')<0)throw new Error('Geladene Version ist kein gültiges ExportHUB-Dokument.');done=true;progress(100,wantTest?'Anmeldung für das Testportal wird geöffnet …':'ExportHUB wird gestartet …');html=/<head(?:\s[^>]*)?>/i.test(html)?html.replace(/<head(\s[^>]*)?>/i,function(x,a){return '<head'+(a||'')+'>'+marker(ver)}):marker(ver)+html;if(html.indexOf('/release-bridge.js')<0)html=/<\/body>/i.test(html)?html.replace(/<\/body>/i,bridgeTag()+'</body>'):html+bridgeTag();setTimeout(function(){document.open('text/html','replace');document.write(html);document.close()},80)}
async function getText(url,opt){var r=await fetch(url,Object.assign({credentials:'same-origin',cache:'no-store'},opt||{}));if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}
async function fallback(reason){try{progress(72,'Notfallversion wird gestartet …');var html=await getText(FALLBACK+'?_='+Date.now(),{headers:{Accept:'text/html'}});inject(html,'RC503')}catch(e){showError('ExportHUB konnte weder die freigegebene Version noch die Notfallversion laden. '+(reason&&reason.message?reason.message:'')+' '+e.message)}}
function showError(t){var e=document.getElementById('err'),b=document.getElementById('retry');if(e){e.style.display='block';e.textContent=t}if(b)b.style.display='block';progress(100,'Start fehlgeschlagen')}
async function boot(){try{progress(24,'Produktionsstatus wird geprüft …');var meta=JSON.parse(await getText(API+'?action=active&channel=production&_='+Date.now(),{headers:{Accept:'application/json'}})),ver=String(meta&&meta.version||'').trim().toUpperCase();if(!ver)return fallback(new Error('Keine Produktionsversion registriert.'));progress(52,'Produktion '+ver+' wird geladen …');var html=await getText(API+'?action=html&channel=production&_='+Date.now(),{headers:{Accept:'text/html'}});progress(86,'Oberfläche wird vorbereitet …');inject(html,ver)}catch(e){fallback(e)}}
var timer=setTimeout(function(){if(!done)fallback(new Error('Zeitüberschreitung beim Laden der Produktionsversion.'))},9000);boot().finally(function(){if(done)clearTimeout(timer)});
})();
</script>
</body>
</html>
