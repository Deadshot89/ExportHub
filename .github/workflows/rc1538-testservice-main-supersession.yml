name: RC1538 TESTSERVICE Main Supersession

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'demo.html'
      - 'production-version.js'
      - 'release-version.json'
      - 'pickup.html'
      - 'customer-avis.html'
      - 'location.html'
      - 'pod-notfall.html'
      - 'migration-recovery.html'
      - 'assets/**'
      - 'api/**'
      - 'android-app/**'
      - 'staticwebapp.config.json'
      - 'staticwebapp.testservice.config.json'
      - '.github/rc*/**'
      - '.github/workflows/**'
      - 'test/**'
      - 'e2e/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  actions: write

jobs:
  supersede_old_testservice_runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: RC1538 ältere Main-Verifications für TESTSERVICE beenden
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.GITHUB_TOKEN;
          const repo=process.env.REPOSITORY;
          const currentSha=process.env.CURRENT_SHA;
          const headers={
            authorization:`Bearer ${token}`,
            accept:'application/vnd.github+json',
            'x-github-api-version':'2022-11-28'
          };
          async function request(url,options={}){
            const response=await fetch(url,{...options,headers:{...headers,...(options.headers||{})}});
            if(!response.ok){
              const body=await response.text();
              // Ein älterer Run kann zwischen LIST und CANCEL regulär enden.
              // Ausschließlich diesen belegten 409-Rennfall als erledigt werten.
              if(response.status===409&&options.method==='POST'&&
                 /^\/repos\/[^/]+\/[^/]+\/actions\/runs\/\d+\/(?:cancel|force-cancel)$/.test(new URL(url).pathname)){
                let message='';
                try{message=JSON.parse(body).message||''}catch(_){}
                if(message==='Cannot cancel a workflow run that is completed.')
                  return {alreadyCompleted:true};
                // GitHub kann einen Run bereits als queued listen, bevor CANCEL erlaubt ist.
                // Nicht als Erfolg werten: nur eng begrenzt wiederholen.
                if(message==='Cannot cancel a workflow run that has not been queued yet.')
                  return {notQueuedYet:true};
              }
              throw new Error(`GitHub API ${response.status}: ${body.slice(0,500)}`);
            }
            if(response.status===202||response.status===204)return null;
            return response.json();
          }
          const main=await request(`https://api.github.com/repos/${repo}/branches/main`);
          const liveMain=main&&main.commit&&main.commit.sha;
          if(liveMain!==currentSha){
            console.log(`RC1538: ${currentSha} ist nicht mehr aktueller main (${liveMain}); kein Supersession-Eingriff.`);
            process.exit(0);
          }
          const workflow='azure-static-web-apps-wonderful-forest-0f315e310.yml';
          const payload=await request(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/runs?branch=main&per_page=100`);
          const runs=Array.isArray(payload&&payload.workflow_runs)?payload.workflow_runs:[];
          const older=runs.filter(run=>run&&run.head_sha!==currentSha&&(run.status==='queued'||run.status==='in_progress'));
          let supersededDuringCancel=false;
          for(const run of older){
            let outcome;
            for(let attempt=0;attempt<5;attempt++){
              // Revalidate main before every cancel, including 409 retries.
              const latestMain=await request(`https://api.github.com/repos/${repo}/branches/main`);
              if(!latestMain?.commit||latestMain.commit.sha!==currentSha){
                supersededDuringCancel=true;
                console.log(`RC1538: main changed before cancel; stop stale job ${currentSha}.`);
                break;
              }
              outcome=await request(`https://api.github.com/repos/${repo}/actions/runs/${run.id}/cancel`,{method:'POST'});
              if(!outcome||!outcome.notQueuedYet)break;
              // Recheck before retry: der alte Run könnte inzwischen beendet sein.
              const latest=await request(`https://api.github.com/repos/${repo}/actions/runs/${run.id}`);
              if(latest.head_sha!==run.head_sha)
                throw new Error(`RC1538: Run ${run.id} SHA hat sich unerwartet geändert.`);
              if(latest.status==='completed'){
                outcome={alreadyCompleted:true};
                break;
              }
              if(attempt===4){
                // Only a genuinely old, still-queued run may use GitHub's
                // documented force-cancel fallback. Never mask a recent race.
                const ageMs=Date.now()-Date.parse(latest.created_at||'');
                if(latest.status!=='queued'||!Number.isFinite(ageMs)||ageMs<30*60*1000)
                  throw new Error(`RC1538: Run ${run.id} nach 5 Versuchen noch nicht abbrechbar (GitHub 409).`);
                // Guard again against a newer main before attempting any force.
                const stillMain=await request(`https://api.github.com/repos/${repo}/branches/main`);
                if(stillMain?.commit?.sha!==currentSha)
                  throw new Error('RC1538: main changed during force-cancel guard; refuse stale intervention.');
                const forceOutcome=await request(`https://api.github.com/repos/${repo}/actions/runs/${run.id}/force-cancel`,{method:'POST'});
                // GitHub 409 may race with the old run completing. Only a
                // same-SHA readback with completed status resolves this race.
                // An unresolved queued or running old job must remain RED.
                if(forceOutcome&&(forceOutcome.notQueuedYet||forceOutcome.alreadyCompleted)){
                  const after409=await request(`https://api.github.com/repos/${repo}/actions/runs/${run.id}`);
                  if(after409.head_sha!==run.head_sha)
                    throw new Error(`RC1538: Run ${run.id} SHA changed after force-cancel 409.`);
                  if(after409.status==='completed'){
                    outcome={alreadyCompleted:true};
                    break;
                  }
                  throw new Error(`RC1538: force-cancel 409 for ${run.id}; old run remains ${after409.status}, cancellation unconfirmed.`);
                }
                // A 202 is only an accepted request, NOT proof of cancellation.
                // Do not mark the gate green until GitHub reports completion.
                let confirmed=false;
                for(let poll=0;poll<20;poll++){
                  await new Promise(resolve=>setTimeout(resolve,1000));
                  const after=await request(`https://api.github.com/repos/${repo}/actions/runs/${run.id}`);
                  if(after.head_sha!==run.head_sha)
                    throw new Error(`RC1538: Run ${run.id} SHA changed after force-cancel.`);
                  if(after.status==='completed'){confirmed=true;break;}
                }
                if(!confirmed)
                  throw new Error(`RC1538: force-cancel for ${run.id} not confirmed by GitHub; gate remains blocked.`);
                outcome={forceCancelled:true};
                break;
              }
              await new Promise(resolve=>setTimeout(resolve,250*(2**attempt)));
            }
            if(supersededDuringCancel)break;
            if(outcome&&outcome.forceCancelled)
              console.log(`RC1538: ältere Main Verification ${run.id} force-cancel durch GitHub abgeschlossen bestätigt.`);
            else if(outcome&&outcome.alreadyCompleted)
              console.log(`RC1538: ältere Main Verification ${run.id} inzwischen abgeschlossen; kein Abbruch nötig.`);
            else
              console.log(`RC1538: ältere Main Verification ${run.id} (${run.head_sha}) Cancel-Annahme erhalten.`);
          }
          if(!supersededDuringCancel)
            console.log(`RC1538: ${older.length} ältere TESTSERVICE-Main-Verifications verarbeitet; aktueller SHA ${currentSha}.`);
          NODE
