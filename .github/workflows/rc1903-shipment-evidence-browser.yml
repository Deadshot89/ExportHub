name: RC1903 Anonymous Shipment Documentation Browser Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/shipment-evidence/**'
      - 'assets/shipment-evidence*'
      - 'assets/sendungsdokumentation.html'
      - 'staticwebapp.config.json'
      - 'staticwebapp.testservice.config.json'
      - 'assets/i18n/shipment-evidence.js'
      - 'assets/rc1579-menu-redesign.js'
      - 'test/rc1903-standalone-evidence.test.mjs'
      - 'test/rc1934-evidence-recovery.test.mjs'
      - 'e2e/specs/rc1903-guest-shipment-documentation.spec.mjs'
      - 'e2e/specs/rc1903-testservice-visual-proof.spec.mjs'
      - 'playwright.rc1903-testservice-visual.config.mjs'
      - '.github/rc1112/build-three-env.mjs'
      - '.github/workflows/rc1903-shipment-evidence-browser.yml'
      - '.github/workflows/rc1538-testservice-main-supersession.yml'
      - 'scripts/rc1903-testservice-guest-live.mjs'
      - 'test/rc1538-testservice-supersession-race.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc1903-shipment-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guest_browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install API runtime dependencies
        run: npm install --prefix api --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: RC1538 supersession race and RC1903 live authorization contract
        run: node --test test/rc1538-testservice-supersession-race.test.mjs

      - name: RC1903 API and rights regression
        run: node --test --test-concurrency=1 test/rc1903-standalone-evidence.test.mjs test/rc1934-evidence-recovery.test.mjs

      - name: Build ExportHUB RC1112 environments
        run: |
          node .github/rc1112/build-three-env.mjs
          node .github/packmeldungen/build-three-env.mjs
          node .github/rc1121/verify-final-html.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.63.0
          node -e "const fs=require('node:fs'),{chromium}=require('@playwright/test');if(!fs.existsSync(chromium.executablePath()))throw new Error('Expected pinned Chromium executable missing');"
          node -e "const {chromium}=require('@playwright/test');chromium.launch().then(b=>b.close()).catch(e=>{console.error(e);process.exit(1)})"

      - name: Verify public link, own read-only records and upload on desktop and mobile
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_PUBLIC_ENV: production
        run: npx playwright test e2e/specs/rc1903-guest-shipment-documentation.spec.mjs --project=laptop --project=mobile-small

      - name: Verify real TESTSERVICE frontend with mocked customer and photo APIs
        shell: bash
        run: |
          set -euo pipefail
          # The browser downloads actual deployed HTML/JS/CSS, but all /api requests are intercepted.
          # No customer search or shipment upload ever reaches the Azure backend.
          npx playwright test e2e/specs/rc1903-testservice-visual-proof.spec.mjs --config playwright.rc1903-testservice-visual.config.mjs

      - name: Store TESTSERVICE proof screenshots (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc1903-testservice-visual-proof
          path: test-results/**/rc1903-testservice-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Store browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rc1903-anonymous-browser
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
