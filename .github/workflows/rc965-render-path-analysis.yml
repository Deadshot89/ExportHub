name: RC965 Render Path Analysis

on:
  push:
    paths:
      - '.github/workflows/rc965-render-path-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse render paths
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('TESTVERSION.html','utf8');
          const needles = [
            'stableRender(',
            'performStableRender(',
            'render();',
            'render()',
            'renderDashboard(',
            'renderShipment(',
            'requestAnimationFrame(',
            'setTimeout(()=>render',
            'setTimeout(() => render'
          ];
          console.log('FILE_BYTES=' + Buffer.byteLength(s));
          for (const needle of needles) {
            let n=0, p=0;
            while ((p=s.indexOf(needle,p)) !== -1) { n++; p += needle.length; }
            console.log(`COUNT ${JSON.stringify(needle)} = ${n}`);
          }

          function allIndices(needle){
            const out=[]; let p=0;
            while((p=s.indexOf(needle,p))!==-1){ out.push(p); p+=needle.length; }
            return out;
          }
          function clip(i, radius=340){
            return s.slice(Math.max(0,i-radius), Math.min(s.length,i+radius))
              .replace(/\s+/g,' ')
              .replace(/::/g,':');
          }

          const direct = allIndices('render()');
          console.log('DIRECT_RENDER_OCCURRENCES=' + direct.length);
          direct.slice(0,120).forEach((i,k)=>{
            const c=clip(i);
            console.log(`\n--- DIRECT_RENDER_${k+1} OFFSET=${i} ---\n${c}`);
          });

          const stable = allIndices('stableRender(');
          console.log('\nSTABLE_RENDER_OCCURRENCES=' + stable.length);
          stable.slice(0,120).forEach((i,k)=>{
            console.log(`\n--- STABLE_RENDER_${k+1} OFFSET=${i} ---\n${clip(i)}`);
          });

          const perfMarker = s.indexOf('exporthub-rc963-render-coordinator');
          console.log('\nRC963_MARKER_OFFSET=' + perfMarker);
          if(perfMarker>=0) console.log(clip(perfMarker,1600));

          const metricMarker = s.indexOf('renderMetrics');
          console.log('\nRENDER_METRICS_FIRST_OFFSET=' + metricMarker);
          if(metricMarker>=0) console.log(clip(metricMarker,1200));
          NODE
