name: ExportHUB Production Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exakter 40-stelliger Commit-SHA aus main, der nach Production freigegeben wird'
        required: true
        type: string
      confirm_production:
        description: 'Zur Freigabe exakt eingeben: PRODUCTION FREIGEBEN'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: exporthub-production-release
  cancel-in-progress: false

jobs:
  production_release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: RC1505 Production-Freigabe bestätigen
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_production }}" != 'PRODUCTION FREIGEBEN' ]; then
            echo 'Production-Freigabe abgelehnt: Bestätigungstext stimmt nicht exakt.'
            exit 1
          fi
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo 'Production-Freigabe abgelehnt: release_sha muss exakt 40 hexadezimale Zeichen enthalten.'
            exit 1
          fi

      - name: RC1505 Release-SHA aus Repository laden
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}

      - name: RC1505 Release-SHA und main-Herkunft verifizieren
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git rev-parse "${RELEASE_SHA}^{commit}" >/dev/null
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo 'Production-Freigabe abgelehnt: release_sha ist kein Commit aus main.'
            exit 1
          fi
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$RELEASE_SHA" ]; then
            echo "Production-Freigabe abgelehnt: Checkout-SHA $checked_out entspricht nicht $RELEASE_SHA."
            exit 1
          fi

      - name: RC1505 Erfolgreiche Main Verification für Release-SHA verlangen
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(mktemp)"
          trap 'rm -f "$runs"' EXIT
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o "$runs" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml/runs?branch=main&event=push&status=success&head_sha=${RELEASE_SHA}&per_page=10"
          RUNS_FILE="$runs" RELEASE_SHA="$RELEASE_SHA" node -e "
            const fs=require('fs');
            const releaseSha=process.env.RELEASE_SHA;
            const payload=JSON.parse(fs.readFileSync(process.env.RUNS_FILE,'utf8')||'{}');
            const runs=Array.isArray(payload.workflow_runs)?payload.workflow_runs:[];
            const verified=runs.some(run=>run&&run.head_sha===releaseSha&&run.event==='push'&&run.conclusion==='success');
            if(!verified){console.error('RC1505: Für release_sha '+releaseSha+' existiert keine erfolgreiche ExportHUB RC1112 Main Verification auf main.');process.exit(1)}
            console.log('RC1505: Erfolgreiche Main Verification für '+releaseSha+' bestätigt.');
          "

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: RC1505 Release-Verträge und Regression auf freigegebenem SHA prüfen
        shell: bash
        run: |
          set -euo pipefail
          node --check api/exporthub-state/index.js
          node --check api/avis-upload-mail-readiness/index.js
          node --check api/customer-portal-readiness/index.js
          node --test test/rc1505-production-promotion.test.mjs test/rc1505-production-html-integrity.test.mjs test/rc1005-three-env-sync.test.mjs test/rc1018-production-deploy.test.mjs test/rc1381-stale-deploy-guard.test.mjs test/pack-notification-production.test.mjs test/rc1249-avis-upload-mail-readiness.test.mjs test/rc1124-browser-release-gate.test.mjs test/rc1193-visible-release-version.test.mjs test/rc1170-customer-portal-release-readiness.test.mjs test/rc1172-testservice-gate-order.test.mjs test/rc1233-pickup-live-gate.test.mjs test/rc1228-customer-avis-slot-live-gate.test.mjs
          npm test

      - name: RC1112 Production-Kandidat aus freigegebenem SHA bauen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node .github/rc1018/apply-public-language.mjs
          node .github/rc1018/fix-mail-wording.mjs
          node .github/rc1112/build-three-env.mjs
          node .github/packmeldungen/build-three-env.mjs
          node .github/rc1121/verify-final-html.mjs
          node .github/rc1505/verify-build-contract.mjs
          grep -q 'ExportHUB RC1112 environment=production-candidate' dist-rc1112/index.html
          grep -q 'ExportHUB RC1112 environment=testservice' dist-rc1112/TESTVERSION.html
          grep -q 'ExportHUB RC1112 environment=demo' dist-rc1112/demo.html
          grep -q "version:'RC1112'" dist-rc1112/index.html
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'" dist-rc1112/production-version.js
          grep -q 'pack-notification-nav.js?v=1' dist-rc1112/index.html
          test -s dist-rc1112/pack.html
          test -s dist-rc1112/assets/pack-notification-nav.js
          test -s dist-rc1112/assets/pack-notification-internal.js

      - name: RC1112 Production-Paket aus freigegebenem SHA vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rc1112_production_app
          mkdir -p .rc1112_production_app
          cp dist-rc1112/pickup.html dist-rc1112/customer-avis.html dist-rc1112/location.html dist-rc1112/pod-notfall.html dist-rc1112/migration-recovery.html dist-rc1112/pack.html .rc1112_production_app/
          cp dist-rc1112/production-version.js .rc1112_production_app/production-version.js
          cp -R assets .rc1112_production_app/assets
          cp -R dist-rc1112/assets/. .rc1112_production_app/assets/
          cp staticwebapp.config.json .rc1112_production_app/staticwebapp.config.json
          cp dist-rc1112/index.html .rc1112_production_app/index.html
          test -s .rc1112_production_app/index.html
          test -s .rc1112_production_app/production-version.js
          test -s .rc1112_production_app/pack.html
          test -s .rc1112_production_app/assets/rc1016-mobile-navigation.js
          test -s .rc1112_production_app/assets/rc1017-multi-truck.js
          test -s .rc1112_production_app/assets/rc1018-mail-language-standard.js
          test -s .rc1112_production_app/assets/rc1018-public-language.js
          test -s .rc1112_production_app/assets/rc1113-stowplan-persist.js
          test -s .rc1112_production_app/assets/abholkalender.js
          test -s .rc1112_production_app/assets/rc1012-abholkalender-runtime.js
          test -s .rc1112_production_app/assets/pack-notification-nav.js
          test -s .rc1112_production_app/assets/pack-notification-internal.js
          test -s .rc1112_production_app/assets/packaging-admin.js

      - name: RC1124 Playwright für Production-Smoke installieren
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: RC1381 PRODUCTION stale-deploy guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo 'RC1381: freigegebener SHA ist nicht mehr aus main erreichbar; Production-Deploy wird blockiert.'
            exit 1
          fi
          echo "RC1505: Production-Promotion bleibt SHA-fest auf $RELEASE_SHA."

      - name: RC1505 SHA unmittelbar vor Production-Upload erneut prüfen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -s .rc1112_production_app/index.html
          test -s .rc1112_production_app/pack.html
          test -s .rc1112_production_app/assets/packaging-admin.js
          test -s api/exporthub-health/index.js

      - name: RC1553 deployment metadata - PRODUCTION
        shell: bash
        run: |
          set -euo pipefail
          build_id="$(git rev-parse HEAD)"
          test "$build_id" = "$RELEASE_SHA"
          BUILD_ID="$build_id" DEPLOY_ENVIRONMENT='production' node -e "
            const fs=require('fs');
            const release=JSON.parse(fs.readFileSync('release-version.json','utf8'));
            const metadata={
              buildId:process.env.BUILD_ID,
              visibleRelease:String(release.visibleRelease||'').trim(),
              technicalBuild:String(release.technicalBuild||'').trim(),
              builtAt:new Date().toISOString(),
              environment:process.env.DEPLOY_ENVIRONMENT
            };
            if(!/^[0-9a-f]{40}$/i.test(metadata.buildId)||!metadata.visibleRelease||!metadata.technicalBuild)throw new Error('RC1553: unvollstaendige PRODUCTION Deployment-Metadaten');
            fs.writeFileSync('api/release-metadata.json',JSON.stringify(metadata,null,2)+'\n');
          "
          test -s api/release-metadata.json
          node -e "const v=require('./api/release-metadata.json'); console.log('RC1553 PRODUCTION deployment metadata',JSON.stringify({buildId:v.buildId,visibleRelease:v.visibleRelease,technicalBuild:v.technicalBuild,builtAt:v.builtAt,environment:v.environment}))"

      - name: Deploy ExportHUB production
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1112_production_app
          api_location: api
          output_location: ''
          skip_app_build: true

      - name: RC1553 PRODUCTION deployment identity prüfen
        shell: bash
        run: |
          set -euo pipefail
          base='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          for attempt in {1..24}; do
            code="$(curl -sS -L -o "$body" -w '%{http_code}' --max-time 20 "$base/api/exporthub-health?rc1553=${RELEASE_SHA}-${attempt}" || true)"
            if [ "$code" = '200' ] && EXPECTED_BUILD_ID="$RELEASE_SHA" BODY="$body" node -e "const fs=require('fs'),v=JSON.parse(fs.readFileSync(process.env.BODY,'utf8')||'{}');if(v.deployment&&v.deployment.verified===true&&v.deployment.buildId===process.env.EXPECTED_BUILD_ID&&v.deployment.environment==='production')process.exit(0);process.exit(1)"; then
              echo "RC1553 PRODUCTION deployment.buildId=$RELEASE_SHA deployment.verified=true"
              exit 0
            fi
            sleep 5
          done
          cat "$body" >&2 || true
          echo "RC1553: PRODUCTION deployment identity stimmt nicht mit RELEASE_SHA=$RELEASE_SHA ueberein." >&2
          exit 1

      - name: RC1170 PRODUCTION Kundenportal-Verschlüsselung prüfen
        shell: bash
        run: |
          set -euo pipefail
          set +x
          base='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-customer-portal-readiness" \
            | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"
          echo "::add-mask::$oidc_token"
          code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 -X POST -H "x-exporthub-github-oidc: $oidc_token" -H 'x-exporthub-environment: production' "$base/api/customer-portal-readiness" || true)"
          STATUS="$code" BODY="$body" node -e "
            const fs=require('fs'),status=Number(process.env.STATUS||0);
            let v={};try{v=JSON.parse(fs.readFileSync(process.env.BODY,'utf8')||'{}')}catch(_){}
            console.log('RC1170 PRODUCTION customer portal readiness',JSON.stringify({httpStatus:status,ok:v.ok===true,configured:v.configured===true,environment:v.environment,code:v.code,version:v.version}));
            if(status<200||status>=300||v.ok!==true||v.configured!==true||v.environment!=='production')process.exit(4);
          "

      - name: RC1249 PRODUCTION AVIS-Mail-Konfiguration prüfen
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          set +x
          base='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-avis-upload-mail-readiness" \
            | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"
          echo "::add-mask::$oidc_token"
          status="$(curl -sS -o "$response" -w '%{http_code}' --max-time 20 -X POST -H "x-exporthub-github-oidc: $oidc_token" -H 'x-exporthub-environment: production' "$base/api/avis-upload-mail-readiness" || true)"
          STATUS="$status" ENVIRONMENT='production' RESPONSE="$response" node -e "
            const fs=require('fs'),status=Number(process.env.STATUS||0),env=process.env.ENVIRONMENT,v=JSON.parse(fs.readFileSync(process.env.RESPONSE,'utf8')||'{}');
            const recipient='DespatchNettetal@essentra.com';
            const requirement=v.requiredPermission||{};
            const ready=status===200&&v.ok===true&&v.configured===true&&v.authenticated===true&&v.audienceOk===true&&v.mailSendGranted===true&&v.environment===env&&v.recipient===recipient;
            if(ready){console.log('RC1249 '+env+' automatische Upload-Mail bereit');process.exit(0)}
            const knownMailSendBlocker=status===503&&v.ok===false&&v.configured===true&&v.authenticated===true&&v.audienceOk===true&&v.mailSendGranted===false&&v.environment===env&&v.recipientConfigured===true&&v.code==='GRAPH_MAIL_PERMISSION_MISSING'&&requirement.resource==='Microsoft Graph'&&requirement.type==='Application'&&requirement.name==='Mail.Send'&&requirement.id==='b633e1c5-b582-4048-a93e-9f11b44c7e96'&&requirement.adminConsentRequired===true;
            if(knownMailSendBlocker){console.log('::warning title=RC1290 AVIS-Mail P2::Microsoft Graph > Application > Mail.Send (b633e1c5-b582-4048-a93e-9f11b44c7e96) fehlt in '+env+'. Admin Consent erforderlich; Release läuft weiter, Mailversand bleibt offen.');process.exit(0)}
            console.error('RC1249 '+env+' automatische Upload-Mail weiterhin nicht verfügbar',JSON.stringify({status,ok:v.ok,configured:v.configured,authenticated:v.authenticated,audienceOk:v.audienceOk,mailSendGranted:v.mailSendGranted,code:v.code}));
            process.exit(1);
          "

      - name: RC1233 QR-Abholung und POD-Ladelisten-Viewer live prüfen
        shell: bash
        run: |
          set -euo pipefail
          prod='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          testservice='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          for env in production testservice; do
            if [ "$env" = "production" ]; then base="$prod"; else base="$testservice"; fi
            pickup="$(mktemp)"; viewer="$(mktemp)"; health="$(mktemp)"; protected="$(mktemp)"
            trap 'rm -f "$pickup" "$viewer" "$health" "$protected"' EXIT
            ready=0
            for attempt in {1..18}; do
              pc=$(curl -sS -L -o "$pickup" -w '%{http_code}' --max-time 20 "$base/pickup.html?rc1233=$RELEASE_SHA-$attempt" || true)
              vc=$(curl -sS -L -o "$viewer" -w '%{http_code}' --max-time 20 "$base/assets/rc1059-document-blob.js?rc1233=$RELEASE_SHA-$attempt" || true)
              hc=$(curl -sS -L -o "$health" -w '%{http_code}' --max-time 20 "$base/api/pickup-health?rc1233=$RELEASE_SHA-$attempt" || true)
              key='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
              blob="rc995/$env/$key/automatic/POD_RC1233.pdf"
              dc=$(curl -sS -L -o "$protected" -w '%{http_code}' --max-time 20 "$base/api/exporthub-document?blob=$(node -p "encodeURIComponent(process.argv[1])" "$blob")&environment=$env&rc1233=$RELEASE_SHA-$attempt" || true)
              if [ "$pc" = "200" ] \
                && [ "$vc" = "200" ] \
                && [ "$hc" = "200" ] \
                && [ "$dc" = "401" ] \
                && grep -Fq "fetch('/api/'" "$pickup" \
                && grep -Fq "request('pickup-status?token='" "$pickup" \
                && grep -Fq "request('pickup-confirm-v2'" "$pickup" \
                && grep -Fq "storage==='azure'||storage==='pod'" "$viewer" \
                && grep -Fq 'automatic' "$viewer" \
                && grep -Fq '/api/exporthub-document?blob=' "$viewer" \
                && grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$health" \
                && grep -Eq 'AUTH_REQUIRED|SESSION_INVALID' "$protected"; then
                ready=1
                break
              fi
              sleep 5
            done
            if [ "$ready" != "1" ]; then
              echo "RC1233 Pickup/POD-Live-Gate fehlgeschlagen: env=$env pickup=$pc viewer=$vc health=$hc protected=$dc" >&2
              exit 1
            fi
            rm -f "$pickup" "$viewer" "$health" "$protected"
            trap - EXIT
          done
          echo 'RC1233 QR-Abholung und geschützter POD-Ladelisten-Viewer live in Produktion und TESTSERVICE bestätigt.'

      - name: RC1228 Lieferavis-Slotlogik live prüfen
        shell: bash
        run: |
          set -euo pipefail
          prod='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          testservice='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          for base in "$prod" "$testservice"; do
            body="$(mktemp)"
            trap 'rm -f "$body"' EXIT
            code='000'
            for attempt in {1..12}; do
              code=$(curl -sS -L -o "$body" -w '%{http_code}' --max-time 20 "$base/customer-avis.html?rc1228=$RELEASE_SHA-$attempt" || true)
              if [ "$code" = "200" ] \
                && grep -Fq 'Buchbar sind ausschließlich 2-Stunden-Zeitfenster innerhalb von 08:30–16:00 Uhr.' "$body" \
                && grep -Fq "Noch '+esc(x.remaining)+' von 3 gleichzeitig frei" "$body" \
                && grep -Fq "action:'availability'" "$body" \
                && grep -Fq "err.code==='PICKUP_SLOT_FULL'" "$body"; then
                break
              fi
              if [ "$attempt" = "12" ]; then
                echo "RC1228 Lieferavis-Slotlogik fehlt live: base=$base http=$code" >&2
                exit 1
              fi
              sleep 5
            done
            rm -f "$body"
            trap - EXIT
          done
          echo 'RC1228 Lieferavis-Slotlogik live in Produktion und TESTSERVICE bestätigt.'

      - name: Live RC1122 HTML-Integrität prüfen
        shell: bash
        run: |
          set -euo pipefail
          prod='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          testservice='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          p=$(mktemp); t=$(mktemp); d=$(mktemp)
          trap 'rm -f "$p" "$t" "$d"' EXIT
          for attempt in {1..24}; do
            pc=$(curl -sS -L -o "$p" -w '%{http_code}' --max-time 20 "$prod/?rc1122=$RELEASE_SHA-$attempt" || true)
            tc=$(curl -sS -L -o "$t" -w '%{http_code}' --max-time 20 "$testservice/?rc1122=$RELEASE_SHA-$attempt" || true)
            dc=$(curl -sS -L -o "$d" -w '%{http_code}' --max-time 20 "$testservice/demo.html?rc1122=$RELEASE_SHA-$attempt" || true)
            if [ "$pc" = "200" ] && [ "$tc" = "200" ] && [ "$dc" = "200" ] \
              && grep -q 'ExportHUB RC1112 environment=production-candidate' "$p" \
              && grep -q 'ExportHUB RC1112 environment=testservice' "$t" \
              && grep -q 'ExportHUB RC1112 environment=demo' "$d" \
              && grep -q "version:'RC1112'" "$p" \
              && grep -q "version:'RC1112'" "$t" \
              && grep -q "version:'RC1112'" "$d"; then
              node .github/rc1121/verify-final-html.mjs "$p" "$t" "$d"
              break
            fi
            if [ "$attempt" = "24" ]; then
              echo "RC1122 Live-HTML konnte nicht verifiziert werden: prod=$pc test=$tc demo=$dc" >&2
              exit 1
            fi
            sleep 5
          done

      - name: RC1505 Production Release Basis-Liveprüfung
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            version="$(curl -fsS --max-time 20 "https://www.exporthub360.de/production-version.js?rc1505=${RELEASE_SHA}-${attempt}" || true)"
            home="$(curl -fsS --max-time 20 "https://www.exporthub360.de/?rc1505=${RELEASE_SHA}-${attempt}" || true)"
            pack="$(curl -fsS --max-time 20 "https://www.exporthub360.de/pack/production-smoke?rc1505=${RELEASE_SHA}-${attempt}" || true)"
            if [[ "$version" == *"__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'"* ]] \
              && [[ "$home" == *ExportHUB* ]] \
              && [[ "$pack" == *Packmeldung* ]]; then
              echo "RC1505 Production-Basisprüfung erfolgreich für $RELEASE_SHA."
              break
            fi
            if [ "$attempt" = '5' ]; then
              echo 'RC1505 Production-Basisprüfung fehlgeschlagen.'
              exit 1
            fi
            sleep 12
          done

      - name: RC1505 Historische Production-Live-Verträge prüfen
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1505/verify-production-live.mjs

      - name: RC1124 Produktion Read-only Browser Smoke
        id: rc1124_production_browser_smoke
        shell: bash
        env:
          EXPORTHUB_E2E_LIVE: '1'
          EXPORTHUB_E2E_BASE_URL: https://wonderful-forest-0f315e310.7.azurestaticapps.net
          EXPORTHUB_E2E_PUBLIC_ENV: production
        run: |
          set -euo pipefail
          npx playwright test e2e/specs/public-smoke.spec.mjs e2e/specs/version-display.spec.mjs --project=laptop

      - name: RC1547 TaskPlanner V2 Production Read-only Liveprüfung
        id: rc1547_taskplanner_v2_production
        shell: bash
        env:
          EXPORTHUB_E2E_LIVE: '1'
          EXPORTHUB_E2E_BASE_URL: https://wonderful-forest-0f315e310.7.azurestaticapps.net
          EXPORTHUB_E2E_PUBLIC_ENV: production
        run: |
          set -euo pipefail
          source_spec='e2e/specs/taskplanner-v2-production.spec.mjs'
          gate_spec='e2e/specs/rc1547-workflow-production.spec.mjs'
          git show "$GITHUB_SHA:$source_spec" > "$gate_spec"
          trap 'rm -f "$gate_spec"' EXIT
          npx playwright test "$gate_spec" --project=laptop
      - name: RC1530 Dashboard-Personalisierung Production-Liveprüfung
        id: rc1530_dashboard_personalization_production
        shell: bash
        env:
          EXPORTHUB_E2E_LIVE: '1'
          EXPORTHUB_E2E_BASE_URL: https://wonderful-forest-0f315e310.7.azurestaticapps.net
          EXPORTHUB_E2E_PUBLIC_ENV: production
        run: |
          set -euo pipefail
          npx playwright test e2e/specs/dashboard-personalization-production.spec.mjs --project=laptop

