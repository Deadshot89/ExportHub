var token='',session='',sessionExpiresAt='',dataEnvironment=/-testservice\./i.test(String(location.hostname||''))?'testservice':'production';

function showGate(message){session='';sessionExpiresAt='';setStatus(message||'Bitte die Sendungsreferenz bestätigen.','info');var host=document.getElementById('content');host.innerHTML='<section class="card access"><h2>Zugriff bestätigen</h2><p>Über dieses sichere Portal können Sie jederzeit die aktuellen Sendungsdaten, freigegebenen Dokumente und den POD einsehen sowie Ihren geplanten Abholtermin mitteilen. Bitte bestätigen Sie zuerst die Sendungsreferenz.</p><div class="site-rules"><strong>⚠ Sicherheitsvorschriften für die Abholung</strong><span>• Zutritt zum Gelände nur mit Sicherheitsschuhen.</span><span>• Das Tragen einer Sicherheitsweste ist verpflichtend.</span><span>• Die Sendungsreferenz / Referenznummer muss bei der Abholung angegeben werden.</span></div><div class="security"><span>✓ Sicherer persönlicher Avis-Link</span><span>✓ Bleibt 14 Tage nach Abholung verfügbar</span><span>✓ Keine ExportHUB-Anmeldung erforderlich</span></div><form id="accessForm"><label>Referenznummer<input name="reference" autocomplete="off" maxlength="40" required></label><button type="submit">Sendungsdaten öffnen</button></form></section>';document.getElementById('accessForm').addEventListener('submit',authorize)}

function rowsHtml(rows){if(!rows||!rows.length)return'<div class="empty">Keine Colli-Positionen hinterlegt.</div>';return'<div class="table-wrap"><table><thead><tr><th>Pos.</th><th>Verpackung</th><th>Anzahl</th><th>Gewicht</th><th>LDM je Colli</th><th>L × B × H</th></tr></thead><tbody>'+rows.map(function(r){return'<tr><td>'+esc(r.position)+'</td><td><b>'+esc(r.type||'–')+'</b></td><td>'+esc(r.count)+'</td><td>'+fmtNum(r.weight,2)+' kg</td><td>'+fmtNum(r.ldm,2)+'</td><td>'+fmtNum(r.length,0)+' × '+fmtNum(r.width,0)+' × '+fmtNum(r.height,0)+' cm</td></tr>'}).join('')+'</tbody></table></div>'}
function fileSize(v){var n=Number(v||0);if(!(n>0))return'';if(n>=1048576)return(n/1048576).toLocaleString('de-DE',{maximumFractionDigits:1})+' MB';if(n>=1024)return Math.round(n/1024).toLocaleString('de-DE')+' KB';return Math.round(n).toLocaleString('de-DE')+' B'}
function docHtml(d){d=d||{};var url=q(d.downloadUrl),meta=[q(d.category),fileSize(d.size)].filter(Boolean).join(' · '),isPod=q(d.category).toUpperCase()==='POD';if(!url)return'<div class="doc"><span><b>'+esc(d.name||'Dokument')+'</b><small>'+esc(meta||'Dokument')+'</small></span><strong>Nicht verfügbar</strong></div>';return'<a class="doc" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer"><span><b>'+esc(d.name||'Dokument')+'</b><small>'+esc(meta||'Dokument')+'</small></span><strong>'+(isPod?'Abliefernachweis herunterladen':'Dokument herunterladen')+'</strong></a>'}
function customerUploadStateHtml(items){items=(items||[]).slice(-6).reverse();if(!items.length)return'<div class="empty">Noch kein Kundendokument hochgeladen.</div>';return items.map(function(x){var status=q(x.status)||'scanning',label=status==='saved'?'Viren- & Fachprüfung bestanden':status==='blocked'?'Blockiert · nicht gespeichert':'Virenprüfung / Fachprüfung läuft',meta=[fileSize(x.size),q(x.documentType),x.message].filter(Boolean).join(' · ');return'<div class="upload-row '+esc(status)+'" data-upload-id="'+esc(x.id||'')+'"><span><strong>'+esc(x.name||'Kunden-Dokument.pdf')+'</strong>'+(meta?'<small>'+esc(meta)+'</small>':'')+'</span><b>'+esc(label)+'</b></div>'}).join('')}
function uploadPanelHtml(items){return'<div class="upload-box"><h3>PDF-Dokumente hochladen</h3><p>Sie können PDF-Dokumente zur Sendung hochladen. Jede Datei wird zuerst technisch und mit Microsoft Defender for Storage auf Schadsoftware geprüft. Danach werden Sendungsreferenz und weitere Sendungsmerkmale automatisch mit dem PDF-Inhalt abgeglichen. Erst wenn beide Prüfungen erfolgreich sind, wird die Datei gespeichert.</p><div class="upload-actions"><label>Dokumentart<select id="customerPdfDocumentType"><option value="">Bitte auswählen</option><option value="cmr">CMR / Frachtbrief</option><option value="delivery_note">Lieferschein</option><option value="invoice">Rechnung / Commercial Invoice</option><option value="packing_list">Packliste / Packing List</option><option value="other">Sonstiges</option></select></label><label>PDF auswählen · max. 10 MB<input id="customerPdfUpload" type="file" accept=".pdf,application/pdf" multiple></label><button id="customerPdfUploadBtn" type="button">PDF prüfen & hochladen</button></div><div class="upload-security"><span>✓ Viren-/Malwareprüfung in Quarantäne</span><span>✓ Abgleich mit Sendungsreferenz und Sendungsdaten</span><span>✓ Prüfung der ausgewählten Dokumentart</span><span>✓ Speicherung nur nach bestandener Viren- und Fachprüfung</span></div><div id="customerUploadState" class="upload-state">'+customerUploadStateHtml(items)+'</div></div>'}
function fileBase64(file){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){var raw=String(r.result||''),p=raw.indexOf(',');if(p<0)return reject(new Error('PDF konnte nicht gelesen werden.'));resolve(raw.slice(p+1))};r.onerror=function(){reject(new Error('PDF konnte nicht gelesen werden.'))};r.readAsDataURL(file)})}

function startUploadPolling(id,name){id=q(id).toLowerCase();if(!/^[a-f0-9]{64}$/.test(id)||uploadPollers[id])return;uploadPollers[id]=true;var attempts=0;function poll(){if(!uploadPollers[id]||!session)return;attempts++;api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'document-upload-status',uploadId:id,environment:dataEnvironment})}).then(function(result){if(result.status==='saved'){delete uploadPollers[id];setStatus('Viren- und Fachprüfung bestanden · PDF gespeichert: '+q(name),'ok');uploadStatusText('Viren- und Fachprüfung bestanden: '+q(name),'saved');setTimeout(refresh,250);return}if(result.status==='blocked'||result.ok===false){delete uploadPollers[id];setStatus(q(result.message)||'PDF wurde nicht gespeichert.','bad');uploadStatusText(q(result.message)||'PDF wurde nicht gespeichert.','blocked');setTimeout(refresh,250);return}uploadStatusText('Virenprüfung / Fachprüfung läuft: '+q(name),'scanning');setTimeout(poll,attempts<30?2000:5000)}).catch(function(err){if(err&&err.status===401){delete uploadPollers[id];return showGate('Die sichere Sitzung ist abgelaufen. Bitte erneut bestätigen.')}if(attempts<60)return setTimeout(poll,5000);delete uploadPollers[id];setStatus(q(err.message)||'Dokumentenprüfung konnte nicht abgeschlossen werden.','bad')})}poll()}

async function uploadCustomerPdfFiles(){var input=document.getElementById('customerPdfUpload'),typeInput=document.getElementById('customerPdfDocumentType'),button=document.getElementById('customerPdfUploadBtn'),documentType=q(typeInput&&typeInput.value),files=Array.from(input&&input.files||[]);if(!documentType){setStatus('Bitte zuerst die Dokumentart auswählen.','bad');return}if(!files.length){setStatus('Bitte mindestens eine PDF-Datei auswählen.','bad');return}if(files.length>3){setStatus('Bitte höchstens 3 PDF-Dateien gleichzeitig auswählen.','bad');return}customerUploadInteraction=true;button.disabled=true;button.textContent='PDF wird vorbereitet …';try{for(var i=0;i<files.length;i++){var file=files[i],name=q(file.name);if(!/\.pdf$/i.test(name)){throw new Error('Es sind ausschließlich PDF-Dateien zulässig: '+name)}if(file.size>10*1024*1024){throw new Error('PDF ist größer als 10 MB: '+name)}if(file.type&&file.type!=='application/pdf'&&file.type!=='application/x-pdf'){throw new Error('Ungültiger Dateityp: '+name)}setStatus('PDF wird sicher hochgeladen und geprüft: '+name,'info');var base64=await fileBase64(file),result=await api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'upload-document',environment:dataEnvironment,documentType:documentType,file:{name:name,type:file.type||'application/pdf',size:file.size,base64:base64}})});if(result.status==='saved'){setStatus('PDF bereits vollständig geprüft und gespeichert: '+name,'ok')}else{setStatus('PDF hochgeladen · Viren- und Fachprüfung läuft: '+name,'info');startUploadPolling(result.upload&&result.upload.id,name)}}input.value=''}catch(err){setStatus(q(err&&err.message)||'PDF konnte nicht sicher geprüft und hochgeladen werden.','bad')}finally{customerUploadInteraction=false;button.disabled=false;button.textContent='PDF prüfen & hochladen'}}
