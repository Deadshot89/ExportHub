name: RC1005 SOP Nav Diagnose
on:
  push:
    branches: [rc1005-hide-sop-nav]
    paths:
      - '.github/workflows/rc1005-sop-nav-diagnose.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1005-hide-sop-nav
          fetch-depth: 0
      - name: Exakte SOP-Navigation finden
        run: |
          mkdir -p .github/rc1005
          node - <<'NODE'
          const fs=require('fs'),out=[];
          const pats=[/data-view\s*=\s*["']sop["']/ig,/setView\s*\(\s*["']sop["']/ig,/(?:view|id|key|module)\s*[:=]\s*["']sop["']/ig,/<(?:button|a)\b[^>]{0,800}>[^<]{0,100}SOP[^<]{0,100}<\/(?:button|a)>/ig];
          for(const file of ['index.html','TESTVERSION.html']){
            const text=fs.readFileSync(file,'utf8'); out.push('--- '+file+' ---');
            const seen=new Set(); let n=0;
            for(const p of pats){ let m; while((m=p.exec(text))&&n<30){ const a=Math.max(0,m.index-250),b=Math.min(text.length,m.index+m[0].length+350); const s=text.slice(a,b).replace(/\r?\n/g,'\\n'); if(!seen.has(s)){seen.add(s);out.push('MATCH '+(++n)+': '+s);} } }
            out.push('COUNT '+n);
          }
          fs.writeFileSync('.github/rc1005/sop-nav-exact.txt',out.join('\n'));
          NODE
          cat .github/rc1005/sop-nav-exact.txt
      - name: Diagnose committen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc1005/sop-nav-exact.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: RC1005 exakte SOP-Navigation sichern'
          git push origin HEAD:rc1005-hide-sop-nav
