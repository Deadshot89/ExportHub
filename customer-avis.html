<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>ExportHUB · Kunden-Avis</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef6fb;font-family:Segoe UI,Arial,sans-serif;color:#0f172a}body{padding:18px}.portal{width:min(1180px,100%);margin:2vh auto;display:grid;gap:14px}.brand{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid #bfdbfe;border-radius:24px;padding:18px 20px;box-shadow:0 14px 38px rgba(15,23,42,.10)}.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#05b8ff);color:#fff;display:grid;place-items:center;font-weight:1000;font-size:21px}.brand h1{margin:0;color:#08245d;font-size:27px}.brand p{margin:3px 0 0;color:#64748b;font-weight:750}.status{border-radius:14px;padding:11px 14px;font-weight:850}.status.info{background:#eff6ff;border-left:5px solid #2563eb}.status.ok{background:#f0fdf4;border-left:5px solid #16a34a;color:#166534}.status.bad{background:#fee2e2;border-left:5px solid #dc2626;color:#991b1b}.card{background:#fff;border:1px solid #cbddeb;border-radius:22px;padding:18px;box-shadow:0 12px 30px rgba(15,23,42,.07)}.card h2{margin:0 0 12px;color:#08245d}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.summary>div,.totals>div{background:#fff;border:1px solid #dbeafe;border-radius:16px;padding:12px 14px}.summary span,.totals span,.grid span{display:block;color:#64748b;font-size:11px;font-weight:900;text-transform:uppercase;margin-bottom:4px}.summary b,.totals b{font-size:18px;color:#08245d;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid>div{border:1px solid #e2e8f0;border-radius:14px;padding:11px}.grid p{margin:5px 0 0;color:#475569;white-space:pre-line}.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.table-wrap{overflow:auto;border:1px solid #dbeafe;border-radius:14px}.table-wrap table{width:100%;border-collapse:collapse;min-width:760px}.table-wrap th,.table-wrap td{text-align:left;padding:9px 10px;border-bottom:1px solid #e2e8f0;font-size:13px}.table-wrap th{background:#eff6ff;color:#334155;font-size:11px;text-transform:uppercase}.table-wrap tr:last-child td{border-bottom:0}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.section-head p{margin:3px 0 0;color:#64748b}.docs{display:grid;gap:8px;margin-top:12px}.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;border:1px solid #dbeafe;background:#f8fbff;border-radius:13px;padding:10px 12px;color:#0f172a}.doc span{min-width:0}.doc b{display:block;overflow-wrap:anywhere}.doc small{display:block;color:#64748b;margin-top:2px}.doc strong{white-space:nowrap;color:#1d4ed8}.empty{border:1px dashed #cbd5e1;border-radius:13px;padding:13px;color:#64748b;background:#f8fafc}.picked{margin-top:12px;border:1px solid #86efac;background:#f0fdf4;color:#166534;border-radius:13px;padding:12px;font-weight:900}.pod{display:grid;gap:3px;border-radius:13px;padding:12px}.pod.ok{border:1px solid #86efac;background:#f0fdf4;color:#166534}.pod.pending{border:1px solid #fde68a;background:#fffbeb;color:#92400e}.pod span{font-size:13px}button{border:0;border-radius:12px;background:linear-gradient(135deg,#1769e0,#07aee8);color:#fff;padding:10px 14px;font-weight:900;cursor:pointer}button:disabled{opacity:.55;cursor:wait}form{display:grid;gap:11px;margin-top:14px}label{display:grid;gap:5px;font-size:12px;font-weight:900;color:#334155}input,textarea{width:100%;border:1px solid #bdd0e4;border-radius:11px;padding:10px 11px;background:#fff;font:inherit;color:#0f172a}textarea{min-height:90px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.access{width:min(600px,100%);margin:4vh auto}.access h2{margin:0 0 8px;color:#08245d}.access p{color:#64748b;line-height:1.45}.security{display:grid;gap:8px;margin:12px 0;padding:12px;border-radius:14px;border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;font-size:12px;font-weight:800}.expires{font-size:12px;color:#64748b;font-weight:800}@media(max-width:760px){body{padding:10px}.summary,.grid,.totals,.form-grid{grid-template-columns:1fr}.section-head{display:grid}.portal{margin:0}.brand{border-radius:18px;padding:14px}.brand h1{font-size:23px}}
</style>
</head>
<body>
<main class="portal">
  <div class="brand"><div class="logo">EH</div><div><h1>Kunden-Avis</h1><p>Essentra · sicheres Abholavis &amp; Sendungsportal</p></div></div>
  <div id="status" class="status info">Sicherer Zugang wird vorbereitet …</div>
  <div id="content"></div>
</main>
<script>
(function(){
'use strict';
var token='',session='',sessionExpiresAt='';
try{var u=new URL(location.href);token=String(u.searchParams.get('token')||u.searchParams.get('avis')||'').trim()}catch(_){token=''}
function q(v){return String(v==null?'':v).trim()}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmtDate(v){if(!v)return'–';try{var d=/^\d{4}-\d{2}-\d{2}$/.test(v)?new Date(v+'T12:00:00'):new Date(v);if(!isFinite(d))return q(v);return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})+(String(v).indexOf('T')>=0?' · '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'')}catch(_){return q(v)}}
function fmtNum(v,d){var n=Number(v||0);return Number.isFinite(n)?n.toLocaleString('de-DE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}):'0'}
function setStatus(text,kind){var n=document.getElementById('status');n.className='status '+(kind||'info');n.textContent=text}
function api(path,opt){opt=opt||{};var ctl=new AbortController(),timer=setTimeout(function(){ctl.abort()},20000),headers=Object.assign({Accept:'application/json','Cache-Control':'no-cache'},opt.headers||{});if(session)headers['X-ExportHUB-Avis-Session']=session;return fetch('/api/customer-avis'+path,Object.assign({},opt,{cache:'no-store',credentials:'omit',headers:headers,signal:ctl.signal})).then(async function(r){clearTimeout(timer);var ct=String(r.headers.get('content-type')||'').toLowerCase(),data=ct.indexOf('application/json')>=0?await r.json().catch(function(){return{}}):{};if(!r.ok){var e=new Error(q(data.message)||('HTTP '+r.status));e.code=data.code;e.status=r.status;throw e}return data}).catch(function(e){clearTimeout(timer);if(e&&e.name==='AbortError'){var x=new Error('Der Kunden-Avis-Service antwortet momentan nicht.');x.code='TIMEOUT';throw x}throw e})}
function showGate(message){session='';sessionExpiresAt='';setStatus(message||'Bitte die Sendungsreferenz bestätigen.','info');var host=document.getElementById('content');host.innerHTML='<section class="card access"><h2>Zugriff bestätigen</h2><p>Über dieses sichere Portal können Sie die Sendungsdaten und freigegebenen Dokumente einsehen und Ihren geplanten Abholtermin mitteilen. Bitte bestätigen Sie zuerst die Sendungsreferenz.</p><div class="security"><span>✓ Sicherer Einmal-Link</span><span>✓ Wird erst nach korrekter Referenzbestätigung verbraucht</span><span>✓ Keine ExportHUB-Anmeldung erforderlich</span></div><form id="accessForm"><label>Referenznummer<input name="reference" autocomplete="off" maxlength="40" required></label><button type="submit">Sendungsdaten öffnen</button></form></section>';document.getElementById('accessForm').addEventListener('submit',authorize)}
function authorize(e){e.preventDefault();var f=e.currentTarget,b=f.querySelector('button'),fd=new FormData(f),payload={action:'authorize',token:token,reference:q(fd.get('reference'))};b.disabled=true;b.textContent='Wird geprüft …';setStatus('Referenz wird geprüft …','info');api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(data){session=q(data.session);sessionExpiresAt=q(data.sessionExpiresAt);if(!session)throw new Error('Sichere Sitzung konnte nicht erstellt werden.');render(data)}).catch(function(err){b.disabled=false;b.textContent='Sendungsdaten öffnen';setStatus(q(err.message)||'Zugriff konnte nicht bestätigt werden.','bad')})}
function rowsHtml(rows){if(!rows||!rows.length)return'<div class="empty">Keine Colli-Positionen hinterlegt.</div>';return'<div class="table-wrap"><table><thead><tr><th>Pos.</th><th>Verpackung</th><th>Anzahl</th><th>Gewicht</th><th>LDM je Colli</th><th>L × B × H</th></tr></thead><tbody>'+rows.map(function(r){return'<tr><td>'+esc(r.position)+'</td><td><b>'+esc(r.type||'–')+'</b></td><td>'+esc(r.count)+'</td><td>'+fmtNum(r.weight,2)+' kg</td><td>'+fmtNum(r.ldm,2)+'</td><td>'+fmtNum(r.length,0)+' × '+fmtNum(r.width,0)+' × '+fmtNum(r.height,0)+' cm</td></tr>'}).join('')+'</tbody></table></div>'}
function fileSize(v){var n=Number(v||0);if(!(n>0))return'';if(n>=1048576)return(n/1048576).toLocaleString('de-DE',{maximumFractionDigits:1})+' MB';if(n>=1024)return Math.round(n/1024).toLocaleString('de-DE')+' KB';return Math.round(n).toLocaleString('de-DE')+' B'}
function docHtml(d){d=d||{};var url=q(d.downloadUrl),meta=[q(d.category),fileSize(d.size)].filter(Boolean).join(' · ');if(!url)return'<div class="doc"><span><b>'+esc(d.name||'Dokument')+'</b><small>'+esc(meta||'Dokument')+'</small></span><strong>Nicht verfügbar</strong></div>';return'<a class="doc" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer"><span><b>'+esc(d.name||'Dokument')+'</b><small>'+esc(meta||'Dokument')+'</small></span><strong>Öffnen / herunterladen</strong></a>'}
function appointmentText(a){if(!a||!a.date)return'Noch keine Abholzeit gemeldet.';var time=[q(a.timeFrom),q(a.timeTo)].filter(Boolean).join(' – ');return fmtDate(a.date)+(time?' · '+time+' Uhr':'')+(a.submittedAt?' · gemeldet '+fmtDate(a.submittedAt):'')}
function render(data){if(data.session)session=q(data.session);if(data.sessionExpiresAt)sessionExpiresAt=q(data.sessionExpiresAt);setStatus('Zugriff bestätigt · Referenz '+q(data.reference),'ok');var host=document.getElementById('content'),docs=data.documents||[],podDocs=data.pod&&data.pod.documents||[],actual=q(data.actualPickupAt),a=data.appointment||{};host.innerHTML='<section class="summary"><div><span>Referenz</span><b>'+esc(data.reference||'–')+'</b></div><div><span>Status</span><b>'+esc(data.status||'–')+'</b></div><div><span>Empfänger</span><b>'+esc(data.customerName||data.recipientName||'–')+'</b></div><div><span>Zielland</span><b>'+esc(data.country||'–')+'</b></div></section><div class="expires">Einmal-Link erfolgreich bestätigt · sichere Sitzung bis '+esc(fmtDate(sessionExpiresAt))+'</div>'+ '<section class="card"><h2>Sendung</h2><div class="grid"><div><span>Absender</span><b>'+esc(data.sender&&data.sender.name||'–')+'</b><p>'+esc(data.sender&&data.sender.address||'–')+'</p></div><div><span>Empfänger / Lieferadresse</span><b>'+esc(data.recipientName||data.customerName||'–')+'</b><p>'+esc(data.recipientAddress||'–')+'</p></div><div><span>Kundendaten</span><b>'+esc(data.customerName||'–')+'</b><p>'+esc([data.customerNumber?('Kundennr. '+data.customerNumber):'',data.customerReference?('Kundenreferenz '+data.customerReference):'',data.salesOrder?('Sales Order '+data.salesOrder):''].filter(Boolean).join(' · ')||'–')+'</p></div><div><span>Versanddaten</span><b>'+esc(data.carrier||'–')+'</b><p>'+esc([data.shipDate?('Versanddatum '+fmtDate(data.shipDate)):'',data.incoterm?('Incoterm '+data.incoterm):'',data.goodsDescription||''].filter(Boolean).join(' · ')||'–')+'</p></div></div><div class="totals"><div><span>Collis</span><b>'+fmtNum(data.totals&&data.totals.count,0)+'</b></div><div><span>Gesamtgewicht</span><b>'+fmtNum(data.totals&&data.totals.weight,2)+' kg</b></div><div><span>Lademeter</span><b>'+fmtNum(data.totals&&data.totals.ldm,2)+'</b></div></div>'+rowsHtml(data.rows)+'</section>'+ '<section class="card"><div class="section-head"><div><h2>Dokumente</h2><p>Freigegebene Dokumente dieser Sendung.</p></div></div><div class="docs">'+(docs.length?docs.map(docHtml).join(''):'<div class="empty">Aktuell sind keine herunterladbaren Dokumente hinterlegt.</div>')+'</div></section>'+ '<section class="card"><h2>Abholung</h2><div class="grid"><div><span>Gemeldeter Abholtermin</span><b>'+esc(appointmentText(a))+'</b></div><div><span>Tatsächlich abgeholt</span><b>'+(actual?esc(fmtDate(actual)):'Noch nicht abgeholt')+'</b></div></div>'+(actual?'<div class="picked">✓ Die Sendung wurde am '+esc(fmtDate(actual))+' abgeholt.</div>':'<form id="avisForm"><h3>Abholtermin mitteilen</h3><div class="form-grid"><label>Abholdatum<input name="pickupDate" type="date" required value="'+esc(a.date||'')+'"></label><label>Zeit von<input name="timeFrom" type="time" value="'+esc(a.timeFrom||'')+'"></label><label>Zeit bis<input name="timeTo" type="time" value="'+esc(a.timeTo||'')+'"></label></div><label>Ansprechpartner / Abholer (optional)<input name="contact" maxlength="160" value="'+esc(a.contact||'')+'"></label><label>Hinweis (optional)<textarea name="note" maxlength="1000">'+esc(a.note||'')+'</textarea></label><button type="submit">Abholtermin verbindlich übermitteln</button></form>')+'</section>'+ '<section class="card"><h2>POD / Abliefernachweis</h2><div class="pod '+(data.pod&&data.pod.available?'ok':'pending')+'"><b>'+esc(data.pod&&data.pod.status||'Noch nicht vorhanden')+'</b><span>'+(data.pod&&data.pod.available?'Der POD ist der Sendung zugeordnet.':'Der POD wird nach der tatsächlichen Abholung hier verfügbar.')+'</span></div>'+(podDocs.length?'<div class="docs">'+podDocs.map(docHtml).join('')+'</div>':'')+'</section>';var f=document.getElementById('avisForm');if(f)f.addEventListener('submit',submit)}
function submit(e){e.preventDefault();var f=e.currentTarget,b=f.querySelector('button'),fd=new FormData(f),payload={action:'appointment',pickupDate:q(fd.get('pickupDate')),timeFrom:q(fd.get('timeFrom')),timeTo:q(fd.get('timeTo')),contact:q(fd.get('contact')),note:q(fd.get('note'))};b.disabled=true;b.textContent='Wird gespeichert …';api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(render).catch(function(err){if(err&&err.status===401)return showGate('Die sichere Sitzung ist abgelaufen. Bitte erneut bestätigen.');b.disabled=false;b.textContent='Abholtermin verbindlich übermitteln';setStatus(q(err.message)||'Abholtermin konnte nicht gespeichert werden.','bad')})}
function refresh(){if(!session)return;api('?_='+Date.now()).then(render).catch(function(err){if(err&&err.status===401)return showGate('Die sichere Sitzung ist abgelaufen. Bitte erneut bestätigen.');if(err&&err.status===410){setStatus(q(err.message)||'Dieser Avis-Link ist nicht mehr gültig.','bad');document.getElementById('content').innerHTML='<section class="card">Bitte wenden Sie sich an Ihren Ansprechpartner bei Essentra.</section>'}})}
function boot(){if(!token||!/^[A-Za-z0-9_-]{32,160}$/.test(token)){setStatus('Dieser Kunden-Avis-Link ist ungültig.','bad');document.getElementById('content').innerHTML='<section class="card">Bitte wenden Sie sich an Ihren Ansprechpartner bei Essentra.</section>';return}showGate();setInterval(function(){if(!document.hidden&&session)refresh()},60000)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
</body>
</html>
