name: RC990 Production Release Materialize

on:
  push:
    branches:
      - rc990-production-release
    paths:
      - '.github/workflows/rc990-production-release-materialize.yml'

permissions:
  contents: write

concurrency:
  group: rc990-production-release-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: rc990-production-release
          fetch-depth: 20

      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          base='cd5e1ceada201966dad68dbfb3492a434c351e8b'
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          unexpected="$(git diff --name-only "$base" HEAD | grep -v '^\.github/workflows/rc990-production-release-materialize.yml$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unerwartete Branch-Änderungen vor Materialisierung:"
            echo "$unexpected"
            exit 1
          fi
          echo "Release-Quelle ist exakt auf main $base verankert."

      - name: Verify uploaded snapshot files against RC990 ZIP hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rc990-uploaded.sha256 <<'EOF'
          5f108972dd9c6bcd69440d26cf9653cfc300d70aee654d9656d2944c491a2878  .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml
