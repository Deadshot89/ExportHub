name: ONE-TIME Restore Clean RC882 Internal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Exakt RESTORE_CLEAN_RC882 eingeben'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: exporthub-restore-clean-rc882
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find last successful clean Internal RC882 commit
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "RESTORE_CLEAN_RC882" ]] || { echo "ABBRUCH: Bestätigung muss RESTORE_CLEAN_RC882 lauten."; exit 1; }

          CLEAN_COMMIT="$(git log --all --grep='Remove Professional files from ExportHUB Internal and keep RC882' --format='%H' -1)"
          [[ -n "$CLEAN_COMMIT" ]] || { echo "ABBRUCH: Der vorherige grüne Cleanup-Commit wurde nicht gefunden."; exit 1; }

          test_rc="$(git show "$CLEAN_COMMIT:TESTVERSION.html" | grep -oE "var BUILD=Object\.freeze\(\{version:'RC[0-9]+'" | head -n1 | grep -oE 'RC[0-9]+' || true)"
          prod_rc="$(git show "$CLEAN_COMMIT:index.html" | grep -oE "var BUILD=Object\.freeze\(\{version:'RC[0-9]+'" | head -n1 | grep -oE 'RC[0-9]+' || true)"
          marker_rc="$(git show "$CLEAN_COMMIT:production-version.js" | grep -oE 'RC[0-9]+' | head -n1 || true)"

          [[ "$test_rc" == "RC882" ]] || { echo "ABBRUCH: Clean-Commit TESTVERSION ist nicht RC882."; exit 1; }
          [[ "$prod_rc" == "RC882" ]] || { echo "ABBRUCH: Clean-Commit index.html ist nicht RC882."; exit 1; }
          [[ "$marker_rc" == "RC882" ]] || { echo "ABBRUCH: Clean-Commit production-version.js ist nicht RC882."; exit 1; }

          if git ls-tree -r --name-only "$CLEAN_COMMIT" | grep -qx '.github/workflows/professional-ci.yml'; then
            echo "ABBRUCH: Gefundener Clean-Commit enthält noch Professional CI."
            exit 1
          fi
          if git ls-tree -r --name-only "$CLEAN_COMMIT" | grep -qx 'professional-project.json'; then
            echo "ABBRUCH: Gefundener Clean-Commit enthält noch Professional-Projektdateien."
            exit 1
          fi

          echo "CLEAN_COMMIT=$CLEAN_COMMIT" >> "$GITHUB_ENV"
          echo "OK: letzter sauberer RC882-Internal-Commit = $CLEAN_COMMIT"

      - name: Create safety branch
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          branch="backup-before-rc882-clean-restore-$stamp"
          git branch "$branch" HEAD
          git push origin "$branch"
          echo "Sicherungsbranch erstellt: $branch"

      - name: Restore exact clean Internal tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Exakt den bereits erfolgreich bereinigten Internal-Baum übernehmen.
          git read-tree --reset -u "$CLEAN_COMMIT"

          # Dieser temporäre Workflow darf nicht im Ziel verbleiben.
          git rm -f --ignore-unmatch '.github/workflows/cleanup-professional-from-internal-v2.yml' >/dev/null 2>&1 || true
          git add -A

          test ! -f .github/workflows/professional-ci.yml
          test ! -f professional-project.json
          test ! -f UPLOAD_ONLY_TO_NEW_REPOSITORY.txt
          test -f TESTVERSION.html
          test -f index.html
          test -f production-version.js

          test_rc="$(grep -oE "var BUILD=Object\.freeze\(\{version:'RC[0-9]+'" TESTVERSION.html | head -n1 | grep -oE 'RC[0-9]+' || true)"
          prod_rc="$(grep -oE "var BUILD=Object\.freeze\(\{version:'RC[0-9]+'" index.html | head -n1 | grep -oE 'RC[0-9]+' || true)"
          marker_rc="$(grep -oE 'RC[0-9]+' production-version.js | head -n1 || true)"
          [[ "$test_rc" == "RC882" && "$prod_rc" == "RC882" && "$marker_rc" == "RC882" ]]

          if git diff --cached --quiet; then
            echo "Internal ist bereits exakt auf dem sauberen RC882-Stand."
            exit 0
          fi

          git commit -m "Restore clean ExportHUB Internal RC882 after Professional upload"
          git push origin HEAD:main
          echo "OK: ExportHUB Internal wieder exakt sauber auf RC882."
