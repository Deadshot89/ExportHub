name: RC1555 Apply POD Card Fix

on:
  push:
    branches: [fix/rc1555-pod-production-card-container]
    paths:
      - '.github/rc1555/apply-pod-card-fix.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rc1555-pod-production-card-container
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply exact RC1555 patch
        run: node .github/rc1555/apply-pod-card-fix.mjs
      - name: Verify syntax and static POD contracts
        run: |
          node --check assets/rc1305-loading-list-print.js
          node --check assets/document-print-name.js
          node --test test/rc1550-pod-print-layout.test.mjs test/rc1547-loading-list-single-page.test.mjs
      - name: Commit verified runtime and cache-bust fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ExportHUB RC1555'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add assets/rc1305-loading-list-print.js assets/document-print-name.js \
            .github/rc1112/build-three-env.mjs .github/rc1048/build-three-env.mjs \
            .github/rc1505/verify-production-live.mjs .github/rc1505/verify-build-contract.mjs
          if git diff --cached --quiet; then
            echo 'No RC1555 runtime changes to commit.'
            exit 0
          fi
          git commit -m 'fix(RC1555): target outer POD cards and remove legacy duplicates'
          git push origin HEAD:fix/rc1555-pod-production-card-container
