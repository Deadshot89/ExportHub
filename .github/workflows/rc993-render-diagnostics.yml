name: RC993 Render Diagnostics

on:
  push:
    branches:
      - rc993-render-performance
    paths:
      - '.github/workflows/rc993-render-diagnostics.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect shipment render hot paths
        run: |
          mkdir -p diagnostics
          python3 - <<'PY' > diagnostics/rc993-render-hotpaths.txt
          from pathlib import Path
          import re

          s=Path('TESTVERSION.html').read_text(encoding='utf-8')
          print('bytes', len(s))
          print('shipmentoverview occurrences', len(re.findall('shipmentoverview', s, re.I)))
          print('exporthub:rendered occurrences', len(re.findall(r'exporthub:rendered', s, re.I)))
          print('innerHTML assignments', len(re.findall(r'\.innerHTML\s*=', s)))
          print('replaceChildren calls', len(re.findall(r'\.replaceChildren\s*\(', s)))
          print('insertAdjacentHTML calls', len(re.findall(r'\.insertAdjacentHTML\s*\(', s)))

          def nearest_function(idx):
            start=max(0, idx-12000)
            chunk=s[start:idx]
            matches=list(re.finditer(r'function\s+([A-Za-z0-9_$]+)\s*\(', chunk))
            return matches[-1].group(1) if matches else '(anonymous/other)'

          def line_no(idx):
            return s.count('\n', 0, idx) + 1

          seen=set()
          print('\n=== shipment-adjacent DOM writes ===')
          for pat in [r'\.innerHTML\s*=', r'\.replaceChildren\s*\(', r'\.insertAdjacentHTML\s*\(']:
            for m in re.finditer(pat, s):
              a=max(0,m.start()-3000); b=min(len(s),m.start()+3000)
              window=s[a:b]
              if not re.search(r'shipment|sendung|shipmentoverview|shipmentview', window, re.I):
                continue
              fn=nearest_function(m.start())
              key=(fn,m.start())
              if key in seen: continue
              seen.add(key)
              excerpt=' '.join(s[max(0,m.start()-900):min(len(s),m.start()+1500)].split())
              print(f'IDX={m.start()} LINE={line_no(m.start())} FN={fn} OP={m.group(0)}')
              print(excerpt[:2600])
              print('---')

          print('\n=== shipment-related named functions ===')
          names=[]
          for m in re.finditer(r'function\s+([A-Za-z0-9_$]+)\s*\(', s):
            name=m.group(1)
            if re.search(r'ship|send|render|overview|list', name, re.I):
              names.append((m.start(),name))
          for idx,name in names[:240]:
            excerpt=' '.join(s[idx:min(len(s),idx+2000)].split())
            print(f'IDX={idx} LINE={line_no(idx)} FN={name}: {excerpt[:2000]}')

          print('\n=== rendered event handlers with shipment context ===')
          for m in re.finditer(r'exporthub:rendered', s):
            a=max(0,m.start()-1800); b=min(len(s),m.start()+2400)
            window=s[a:b]
            if re.search(r'shipment|sendung|render', window, re.I):
              print(f'IDX={m.start()} LINE={line_no(m.start())} FN={nearest_function(m.start())}')
              print(' '.join(window.split())[:3600])
              print('---')

          print('\n=== direct render()/requestRender()/view calls near shipment code ===')
          for pat in [r'\brender\s*\(', r'\brequestRender\s*\(', r'\bscheduleRender\s*\(', r'\bshowView\s*\(', r'\bsetView\s*\(']:
            for m in re.finditer(pat, s):
              a=max(0,m.start()-1600); b=min(len(s),m.start()+1800)
              window=s[a:b]
              if re.search(r'shipment|sendung|shipmentoverview|shipmentview', window, re.I):
                print(f'LINE={line_no(m.start())} FN={nearest_function(m.start())} CALL={m.group(0)}')
                print(' '.join(window.split())[:2800])
                print('---')
          PY
          cat diagnostics/rc993-render-hotpaths.txt
      - name: Commit diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/rc993-render-hotpaths.txt
          if git diff --cached --quiet; then
            echo 'No diagnostic changes.'
            exit 0
          fi
          git commit -m 'RC993: Render-Diagnosebericht sichern'
          git push
