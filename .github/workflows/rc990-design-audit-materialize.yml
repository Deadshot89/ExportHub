name: RC990 Design Audit Materialize

on:
  push:
    branches:
      - rc990-large-ux
    paths:
      - '.github/rc990_design_audit_materialize.py'
      - '.github/workflows/rc990-design-audit-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc990-large-ux
      - run: python .github/rc990_design_audit_materialize.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc990_design_audit_result.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'RC990 Audit: Designselektoren erfassen'
          git push origin HEAD:rc990-large-ux
