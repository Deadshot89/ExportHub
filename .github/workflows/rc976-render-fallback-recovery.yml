name: RC976 Render Fallback Recovery

on:
  push:
    branches: [main]
    paths:
      - 'TESTVERSION.html'
      - 'test/rc971-global-form-field-standard.test.mjs'
      - 'test/rc972-field-exception-audit.test.mjs'
      - 'test/rc973-long-text-autogrow.test.mjs'
      - 'test/rc975-global-render-integrity.test.mjs'
      - 'test/rc976-render-fallback-recovery.test.mjs'
      - '.github/workflows/rc976-render-fallback-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: RC971 bis RC976 komplette Render-Regression
        run: node --test test/rc971-global-form-field-standard.test.mjs test/rc972-field-exception-audit.test.mjs test/rc973-long-text-autogrow.test.mjs test/rc975-global-render-integrity.test.mjs test/rc976-render-fallback-recovery.test.mjs

# RC976 post-promotion verification trigger
