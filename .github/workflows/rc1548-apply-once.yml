name: RC1548 Apply Pickup Host Fix Once

on:
  push:
    branches:
      - fix/rc1548-pickup-detail-host-reference
    paths:
      - '.github/workflows/rc1548-apply-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rc1548-pickup-detail-host-reference
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: RC1548 minimalen Scope-Fix anwenden
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/rc1546-pickup-control.js')
          s = p.read_text(encoding='utf-8')
          old = "function mountDetail(){var d=root.document;if(!d||!d.body)return false,host=d.getElementById('rc1546PickupDetail');"
          new = "function mountDetail(){var d=root.document;if(!d||!d.body)return false;var host=d.getElementById('rc1546PickupDetail');"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected broken mountDetail exactly once, found {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check assets/rc1546-pickup-control.js
          node --test test/rc1548-pickup-detail-host-reference.test.mjs
      - name: RC1548 Fix committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rc1546-pickup-control.js
          git diff --cached --check
          git commit -m 'fix(rc1548): declare pickup detail host'
          git push origin HEAD:fix/rc1548-pickup-detail-host-reference
