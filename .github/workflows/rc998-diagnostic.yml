name: RC998 Diagnose

on:
  push:
    branches:
      - rc998-video-hardening
    paths:
      - '.github/workflows/rc998-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Extract RC998 owner snippets
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('TESTVERSION.html','utf8');
          const needles=[
            'fastViewCache','stashFastView','restoreFastView','dropFastView','fastCacheable',
            'async function loadStateAfterLogin(){','var BUILD=Object.freeze({','var RELEASE=Object.freeze({'
          ];
          function printAround(needle){
            let from=0,count=0;
            while(count<12){
              const i=src.indexOf(needle,from); if(i<0)break;
              const a=Math.max(0,i-1200),b=Math.min(src.length,i+needle.length+2200);
              console.log(`\n===== ${needle} @ ${i} =====\n${src.slice(a,b)}\n`);
              from=i+needle.length; count++;
            }
            if(count===0)console.log(`\n===== ${needle}: no literal match =====`);
          }
          needles.forEach(printAround);
          NODE
