name: RC889 Professional UX Stage 5 v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc889-professional-ux-v2
  cancel-in-progress: false

jobs:
  patch-testservice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Internal main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard RC888 baseline
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f TESTVERSION.html ]; then
            echo "::error title=TESTVERSION fehlt::TESTVERSION.html wurde im Repository nicht gefunden."
            exit 1
          fi
          VERSION="$(grep -o "version:'RC[0-9]*',cache:'[0-9]*',loginReturn:'/TESTVERSION.html?v=[0-9]*'" TESTVERSION.html | head -n1 | sed -E "s/version:'(RC[0-9]+)'.*/\1/")"
          echo "Detected TESTVERSION baseline: ${VERSION:-unbekannt}"
          if [ "$VERSION" != "RC888" ]; then
            echo "::error title=RC888 Voraussetzung fehlt::Erkannt wurde ${VERSION:-keine Version}. Bitte zuerst 'RC888 Professional Workflow Stage 4 v2' erfolgreich ausführen. RC889 verändert in diesem Zustand nichts."
            exit 1
          fi
          required_marker() {
            local marker="$1"
            local label="$2"
            if ! grep -Fq "$marker" TESTVERSION.html; then
              echo "::error title=RC888 unvollständig::$label fehlt. RC889 wird aus Sicherheitsgründen nicht installiert."
              exit 1
            fi
          }
          required_marker "Produktivitätsstufe 4: Arbeitsübergabe, Prozess-Timeline und Performance-Monitor" "RC888 Release-Metadaten"
          required_marker 'id="exporthub-rc885-productivity"' "RC885 Produktivitätsmodul"
          required_marker 'ExportHUBProductivity885=Object.freeze' "RC885 Diagnose-API"
          required_marker 'id="exporthub-rc886-shipment-progress"' "RC886 Fortschrittsmodul"
          required_marker 'ExportHUBShipmentProgress886=Object.freeze' "RC886 Diagnose-API"
          required_marker 'id="exporthub-rc887-quickwork"' "RC887 Schnellarbeitsmodul"
          required_marker 'ExportHUBQuickWork887=Object.freeze' "RC887 Diagnose-API"
          required_marker 'id="exporthub-rc888-professional"' "RC888 Professional-Modul"
          required_marker 'ExportHUBProfessional888=Object.freeze' "RC888 Diagnose-API"
          if grep -Fq 'id="exporthub-rc889-actionbar"' TESTVERSION.html; then
            echo "::error title=RC889 bereits vorhanden::Der RC889-Modulmarker ist bereits vorhanden. Workflow beendet sicher, statt doppelt zu installieren."
            exit 1
          fi

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC888 backup tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-rc888-before-rc889-professional-ux"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Backup tag already exists: $TAG"
          else
            git tag -a "$TAG" -m "Last known RC888 baseline before RC889 professional UX"
            git push origin "$TAG"
          fi

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'TESTVERSION.html';
          let text = fs.readFileSync(path, 'utf8');
          const original = text;

          function replaceOnce(oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0) throw new Error(label + ': Ausgangsblock nicht gefunden');
            if (text.indexOf(oldText, first + oldText.length) >= 0) throw new Error(label + ': Ausgangsblock mehrfach gefunden');
            text = text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          replaceOnce(
            "var BUILD=Object.freeze({version:'RC888',cache:'888',loginReturn:'/TESTVERSION.html?v=888'});",
            "var BUILD=Object.freeze({version:'RC889',cache:'889',loginReturn:'/TESTVERSION.html?v=889'});",
            'Canonical BUILD'
          );

          replaceOnce(
            " version:'RC888',\n date:'30.08.2026',\n title:'Produktivitätsstufe 4: Arbeitsübergabe, Prozess-Timeline und Performance-Monitor',",
            " version:'RC889',\n date:'30.08.2026',\n title:'Produktivitätsstufe 5: Intelligente Aktionsleiste, Sperrgründe und Arbeitszustände',",
            'Release metadata'
          );

          const moduleBase64 = '';
          const moduleHtml = Buffer.from(moduleBase64, 'base64').toString('utf8');
          if (!moduleHtml.includes('exporthub-rc889-actionbar') || !moduleHtml.includes('ExportHUBUX889')) throw new Error('RC889 Modul beschädigt');
          const bodyClose = text.lastIndexOf('</body>');
          if (bodyClose < 0) throw new Error('HTML body-Ende fehlt');
          text = text.slice(0, bodyClose) + '\n' + moduleHtml + '\n' + text.slice(bodyClose);

          const changesAnchor = " changes:Object.freeze([\n";
          const changesPos = text.indexOf(changesAnchor);
          if (changesPos < 0) throw new Error('Release changes: Anker fehlt');
          const newChanges =
            '    "RC889 ergänzt in Sendung erstellen und Sendungsansicht eine intelligente Aktionsleiste. Sie zeigt Status, nächsten Prüfschritt, Onlinezustand und einen verständlichen Sperrgrund, ohne den Sendungsstatus selbst zu verändern.",\n' +
            '    "RC889 kennzeichnet bestehende Speicher-, Druck-, Download-, Ladelisten-, CMR-, POD-, ABD- und Mailaktionen während der Verarbeitung sichtbar als beschäftigt. Bestehende Klickhandler werden nicht ersetzt und keine neue Speicherlogik wird eingeführt.",\n' +
            '    "RC889 übersetzt ausschließlich bekannte unbehandelte technische Fehler wie Netzwerk-, Timeout-, HTTP-500-, Azure- und JavaScript-Ladefehler in verständliche Hinweise. Die technische Ursache wird nicht überschrieben und es werden keine Daten automatisch erneut gesendet.",\n' +
            '    "RC889 ändert ausschließlich TESTVERSION.html. Produktion, APIs, Pickup, Location, Customer-Avis und Produktionskonfiguration bleiben unverändert.",\n';
          text = text.slice(0, changesPos + changesAnchor.length) + newChanges + text.slice(changesPos + changesAnchor.length);

          if (text === original) throw new Error('Keine Änderung erzeugt');
          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: Static RC889 safety tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('TESTVERSION.html', 'utf8');
          function required(rx, message) { if (!rx.test(text)) throw new Error(message); }

          required(/version:'RC889',cache:'889',loginReturn:'\/TESTVERSION\.html\?v=889'/, 'RC889 BUILD fehlt');
          required(/Produktivitätsstufe 5: Intelligente Aktionsleiste, Sperrgründe und Arbeitszustände/, 'RC889 Release-Metadaten fehlen');

          required(/id="exporthub-rc885-productivity"/, 'RC885 Produktivitätsmodul fehlt');
          required(/id="exporthub-rc886-shipment-progress"/, 'RC886 Fortschrittsmodul fehlt');
          required(/id="exporthub-rc887-quickwork"/, 'RC887 Schnellarbeitsmodul fehlt');
          required(/id="exporthub-rc888-professional"/, 'RC888 Professional-Modul fehlt');
          required(/ExportHUBProfessional888=Object\.freeze/, 'RC888 Diagnose-API fehlt');

          required(/id="exporthub-rc889-actionbar-style"/, 'RC889 CSS fehlt');
          required(/id="exporthub-rc889-actionbar"/, 'RC889 Modul fehlt');
          required(/__EXPORTHUB_RC889_ACTIONBAR__/, 'RC889 Single-Install-Guard fehlt');
          required(/ExportHUBUX889=Object\.freeze/, 'RC889 Diagnose-API fehlt');
          required(/Intelligente Aktionsleiste/, 'RC889 Aktionsleiste fehlt');
          required(/Warum\?/, 'RC889 Sperrgrund-Anzeige fehlt');
          required(/rc889-busy/, 'RC889 Arbeitszustand fehlt');
          required(/explainError/, 'RC889 Fehlerübersetzung fehlt');

          const scriptStart = text.indexOf('<script id="exporthub-rc889-actionbar">');
          const bodyStart = text.indexOf('\n', scriptStart) + 1;
          const scriptEnd = text.indexOf('</script>', bodyStart);
          if (scriptStart < 0 || bodyStart <= 0 || scriptEnd < 0) throw new Error('RC889 Script kann nicht extrahiert werden');
          const js = text.slice(bodyStart, scriptEnd);
          new Function(js);

          if (/fetch\s*\(|XMLHttpRequest|sendBeacon\s*\(|WebSocket\s*\(/.test(js)) throw new Error('RC889 enthält unerlaubten Netzwerkweg');
          if (/localStorage|sessionStorage/.test(js)) throw new Error('RC889 führt unerwartete Browser-Datenspeicherung ein');
          if (/queueSave\s*\(|saveShipment\s*\(|saveTeam|azureSave|teamSave/.test(js)) throw new Error('RC889 enthält unerlaubten Speicherweg');
          if (/state\(\)\.shipments\s*=|\.shipments\.push\s*\(/.test(js)) throw new Error('RC889 schreibt direkt in gespeicherte Sendungen');
          if (!/ExportHUBShipmentProgress886/.test(js)) throw new Error('RC889 nutzt den bestehenden RC886-Prüfpfad nicht');
          if (!/unhandledrejection/.test(js) || !/window\.addEventListener\('error'/.test(js)) throw new Error('RC889 Fehlerbehandlung unvollständig');
          console.log('RC889 static safety tests: PASS');
          NODE

      - name: Verify production scope untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json; then
            echo "ERROR: Production/API/public files changed."
            git diff -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json
            exit 1
          fi
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "TESTVERSION.html"

      - name: Write RC889 test report
        shell: bash
        run: |
          cat > RC889_PRUEFBERICHT.txt <<'EOF'
          TESTBERICHT RC889 – PRODUKTIVITÄTSSTUFE 5

          Scope:
          - Ausschließlich TESTSERVICE / TESTVERSION.html
          - Keine Produktionsdatei und keine API geändert
          - RC884 bis RC888 bleiben erhalten

          Neue Funktionen:
          1. Intelligente Aktionsleiste
             - Sichtbar in Sendung erstellen und Sendungsansicht
             - Zeigt Referenz, Status, Online/Offline und den aktuellen fachlichen Sperrgrund
             - Nutzt den bestehenden RC886-Fortschritt für die nächste sinnvolle Aktion
             - Verändert keinen Status und speichert keine Sendung selbst

          2. Warum gesperrt?
             - Nach Abholung/POD wird die bestehende Bearbeitungssperre verständlich erklärt
             - Bei wartendem ABD wird die Versandblockade erklärt
             - Bei fehlenden Pflichtpunkten wird der nächste offene Prüfschritt angezeigt

          3. Einheitliche Arbeitszustände
             - Bestehende Buttons für Speichern, Druck, Download, Ladeliste, CMR, POD, ABD, Mail und Synchronisation erhalten beim Klick einen sichtbaren Beschäftigt-Zustand
             - Bestehende Eventhandler bleiben unverändert
             - Kein automatischer Retry und kein zusätzlicher Netzwerkaufruf
             - Arbeitszustand wird bei Abschlussereignissen oder spätestens nach Sicherheits-Timeout entfernt

          4. Verständlichere technische Fehler
             - Nur bekannte unbehandelte Netzwerk-, Timeout-, HTTP-500-, Azure-/Storage- und JavaScript-Modulfehler werden zusätzlich verständlich erklärt
             - Technische Fehler werden nicht unterdrückt
             - Keine automatische Wiederholung einer Speicherung

          Wo sichtbar:
          A. Testservice öffnen und Version RC889 prüfen.
          B. Dashboard: RC885 Meine Arbeit heute, RC887 Favoriten/Vorlagen, RC888 Arbeitsübergabe und bei Admin Performance-Monitor.
          C. Strg+K: globale RC885-Suche von jeder Hauptansicht.
          D. Sendung erstellen: oben RC889 intelligente Aktionsleiste; darunter RC886 Sendungs-Fortschritt/Dokumenten-Ampel und RC887 Schnellarbeit/Vorlagen.
          E. Gespeicherte Sendung öffnen: RC889 Aktionsleiste, RC886 Fortschritt und RC888 Sendungs-Timeline.
          F. Eine abgeholte/POD-Sendung öffnen: RC889 erklärt die Bearbeitungssperre, ohne sie aufzuheben.
          G. Einen Speicher-/Druck-/Dokumentbutton anklicken: Button zeigt unmittelbar einen Arbeitszustand.
          H. Einen bekannten technischen Testfehler auslösen: RC889 zeigt zusätzlich eine verständliche Meldung, ohne den Fehler technisch zu verschlucken.

          Regression:
          - Navigation, Suche, KundenAvis-Trennung und Sendungsansicht aus RC884 prüfen
          - Strg+K und Meine Arbeit heute aus RC885 prüfen
          - Fortschritt/Dokumenten-Ampel aus RC886 prüfen
          - Favoriten/Vorlagen/Schnellerfassung aus RC887 prüfen
          - Übergabe/Timeline/Performance aus RC888 prüfen
          - Produktion unverändert
          EOF

      - name: Commit RC889 testservice
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html RC889_PRUEFBERICHT.txt
          git commit -m "RC889: add intelligent action bar and professional action states"
          git push origin main
