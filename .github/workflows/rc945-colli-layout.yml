name: RC945 Colli Layout stabilisieren

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc945-colli-layout.yml'

permissions:
  contents: write

concurrency:
  group: rc945-colli-layout
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RC944 Ausgangszustand schützen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          version="version:'RC944',cache:'944',loginReturn:'/TESTVERSION.html?v=944'"
          assert text.count(version)==1, 'Basis ist nicht eindeutig RC944'
          assert text.count('/* exporthub-rc900-stable-colli-layout */')==1, 'Aktiver RC900-Colli-Block fehlt oder ist doppelt'
          assert text.count('/* exporthub-rc904-colli-summary-typography */')==1, 'Colli-Summary-Marker fehlt oder ist doppelt'
          assert '#rc363BlockColli #rc573ColliCard .rc363-colli-grid{grid-template-columns:repeat(6,minmax(0,1fr))!important;grid-template-rows:auto auto auto!important;' in text, 'Bisheriges 6-Spalten/3-Reihen-Raster fehlt'
          assert text.count('@media(max-width:1500px){.rc894-full-stack')==1, 'Bisheriger 1500px-Layoutwechsel ist nicht eindeutig'
          assert text.count('function ownedRow(index,row)')==1, 'Colli-Zeilenlogik nicht eindeutig'
          assert text.count('function addRow()')==1, 'Colli-Hinzufügen-Logik nicht eindeutig'
          assert 'first.focus({preventScroll:true})' in text and 'window.scrollTo(rc922ScrollX,rc922ScrollY)' in text, 'RC922 Scrollschutz fehlt'
          print('BASIS OK: RC944 + aktiver Colli-Block + Scrollschutz unverändert vorhanden.')
          PY

      - name: RC945 RED - kompakte stabile Anordnung fehlt noch
        id: red
        continue-on-error: true
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert '/* exporthub-rc945-compact-stable-colli-layout */' in text
          assert 'grid-template-columns:repeat(12,minmax(0,1fr))!important;grid-template-rows:auto auto!important' in text
          assert '@media(max-width:1380px){.rc894-full-stack' in text
          assert 'overflow-anchor:none!important' in text
          PY

      - name: RED Ergebnis bestätigen
        if: always()
        shell: bash
        run: |
          test "${{ steps.red.outcome }}" = "failure"
          echo "RED OK: RC944 besitzt die RC945-Stabilitätsregeln noch nicht."

      - name: RC945 aktiven Colli-Block direkt reparieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('TESTVERSION.html')
          text=p.read_text(encoding='utf-8')

          old_version="version:'RC944',cache:'944',loginReturn:'/TESTVERSION.html?v=944'"
          new_version="version:'RC945',cache:'945',loginReturn:'/TESTVERSION.html?v=945'"
          assert text.count(old_version)==1
          assert new_version not in text

          start_marker='/* exporthub-rc900-stable-colli-layout */'
          end_marker='/* exporthub-rc904-colli-summary-typography */'
          assert text.count(start_marker)==1
          assert text.count(end_marker)==1
          start=text.index(start_marker)
          end=text.index(end_marker,start)
          old_block=text[start:end]
          assert 'grid-template-columns:repeat(6,minmax(0,1fr))!important' in old_block
          assert 'grid-template-rows:auto auto auto!important' in old_block
          assert 'min-height:36px!important;height:36px!important' in old_block

          new_block='''/* exporthub-rc945-compact-stable-colli-layout */#rc363BlockColli{align-self:start!important;height:auto!important;min-width:0!important}#rc363BlockColli #rc573ColliCard{height:auto!important;min-width:0!important}#rc363BlockColli #rc573ColliCard #rowsBox{display:grid!important;gap:6px!important;align-content:start!important;overflow-anchor:none!important}#rc363BlockColli #rc573ColliCard .rc363-owned-row{padding:6px 7px!important;border-radius:12px!important;height:auto!important;min-height:0!important;overflow-anchor:none!important}#rc363BlockColli #rc573ColliCard .rc363-colli-grid{display:grid!important;grid-template-columns:repeat(12,minmax(0,1fr))!important;grid-template-rows:auto auto!important;gap:5px 6px!important;align-items:end!important}#rc363BlockColli #rc573ColliCard .rc363-colli-grid>[data-rc363-field]{padding:0!important;gap:3px!important;min-width:0!important;align-self:end!important;font-size:10px!important;line-height:1.15!important}#rc363BlockColli #rc573ColliCard [data-rc363-field="type"]{grid-area:1 / 1 / 2 / 5!important}#rc363BlockColli #rc573ColliCard [data-rc363-field="count"]{grid-area:1 / 5 / 2 / 7!important}#rc363BlockColli #rc573ColliCard [data-rc363-field="weight"]{grid-area:1 / 7 / 2 / 10!important}#rc363BlockColli #rc573ColliCard [data-rc363-field="ldm"]{grid-area:1 / 10 / 2 / 13!important}#rc363BlockColli #rc573ColliCard [data-rc363-field="l"]{grid-area:2 / 1 / 3 / 4!important}#rc363BlockColli #rc573ColliCard [data-rc363-field="w"]{grid-area:2 / 4 / 3 / 7!important}#rc363BlockColli #rc573ColliCard [data-rc363-field="h"]{grid-area:2 / 7 / 3 / 10!important}#rc363BlockColli #rc573ColliCard [data-rc363-field="action"]{grid-area:2 / 10 / 3 / 13!important;align-self:end!important}#rc363BlockColli #rc573ColliCard [data-rc363-field="action"]>span{display:none!important}#rc363BlockColli #rc573ColliCard .rc363-colli-grid input,#rc363BlockColli #rc573ColliCard .rc363-colli-grid select,#rc363BlockColli #rc573ColliCard .rc363-colli-grid button,#rc363BlockColli #rc573ColliCard .rc682-packaging-toggle{width:100%!important;min-width:0!important;min-height:32px!important;height:32px!important;padding:5px 7px!important;box-sizing:border-box!important;font-size:11px!important}#rc363BlockColli #rc573ColliCard [data-rc363-field="action"] button{font-size:10px!important;padding:4px 6px!important;white-space:nowrap!important}#rc363BlockColli #rc573ColliCard [data-rc363-add-row]{margin-top:6px!important;min-height:32px!important;padding:5px 9px!important;font-size:10px!important}'''

          text=text[:start]+new_block+text[end:]

          old_break='@media(max-width:1500px){.rc894-full-stack'
          new_break='@media(max-width:1380px){.rc894-full-stack'
          assert text.count(old_break)==1
          assert new_break not in text
          text=text.replace(old_break,new_break,1)
          text=text.replace(old_version,new_version,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: RC945 GREEN - Layout und Schutzregeln prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          version="version:'RC945',cache:'945',loginReturn:'/TESTVERSION.html?v=945'"
          assert text.count(version)==1, 'RC945 Versionsmarker fehlt oder ist doppelt'
          assert text.count('/* exporthub-rc945-compact-stable-colli-layout */')==1, 'RC945 Colli-Block fehlt oder ist doppelt'
          assert '/* exporthub-rc900-stable-colli-layout */' not in text, 'Alter aktiver RC900-Colli-Block wurde nicht ersetzt'
          assert 'grid-template-columns:repeat(12,minmax(0,1fr))!important;grid-template-rows:auto auto!important' in text, 'Zweireihiges 12-Spalten-Raster fehlt'
          for rule in [
              '[data-rc363-field="type"]{grid-area:1 / 1 / 2 / 5!important}',
              '[data-rc363-field="count"]{grid-area:1 / 5 / 2 / 7!important}',
              '[data-rc363-field="weight"]{grid-area:1 / 7 / 2 / 10!important}',
              '[data-rc363-field="ldm"]{grid-area:1 / 10 / 2 / 13!important}',
              '[data-rc363-field="l"]{grid-area:2 / 1 / 3 / 4!important}',
              '[data-rc363-field="w"]{grid-area:2 / 4 / 3 / 7!important}',
              '[data-rc363-field="h"]{grid-area:2 / 7 / 3 / 10!important}',
              '[data-rc363-field="action"]{grid-area:2 / 10 / 3 / 13!important'
          ]:
              assert rule in text, 'Feldposition fehlt: '+rule
          assert 'font-size:10px!important;line-height:1.15!important' in text, 'Kompakte Beschriftung fehlt'
          assert 'min-height:32px!important;height:32px!important' in text, 'Kompakte Feldhöhe fehlt'
          assert text.count('overflow-anchor:none!important')>=2, 'Scroll-Anker-Schutz fehlt'
          assert text.count('@media(max-width:1380px){.rc894-full-stack')==1, 'Stabiler Desktop-Breakpoint fehlt'
          assert '@media(max-width:1500px){.rc894-full-stack' not in text, 'Instabiler 1500px-Breakpoint ist noch aktiv'

          # Mobile und Funktionslogik müssen unangetastet bleiben.
          assert '@media(max-width:620px){#rc363BlockColli #rc573ColliCard .rc344-summary' in text, 'Mobile Colli-Regel fehlt'
          assert '#rc363BlockColli #rc573ColliCard .rc363-colli-grid{grid-template-columns:1fr!important;grid-template-rows:none!important}' in text, 'Mobile Einspaltenregel fehlt'
          assert text.count('function ownedRow(index,row)')==1
          assert text.count('function addRow()')==1
          assert 'first.focus({preventScroll:true})' in text
          assert 'window.scrollTo(rc922ScrollX,rc922ScrollY)' in text
          assert "scheduleEditSave('Colli-Zeile hinzugefügt',5200)" in text
          assert '/* exporthub-rc904-colli-summary-typography */' in text
          print('GREEN OK: Colli zweireihig, kompakter, scrollstabil; Daten-/Speicherlogik und Mobile-Regeln erhalten.')
          PY
          git diff --check

      - name: RC945 committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          git rm -f .github/workflows/rc945-colli-audit.yml || true
          git commit -m "RC945 Colli Layout stabilisieren"
          git push origin HEAD:main
