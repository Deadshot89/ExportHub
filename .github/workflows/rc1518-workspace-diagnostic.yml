name: RC1518 Workspace Diagnostic
on:
  push:
    branches:
      - fix/rc1518-build-workspace-integrity
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Pretest mit RC1488-Integritätsprobe
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/rc1488/finalize-auto-update.mjs
          npm run pretest
          test -f .github/rc1488/finalize-auto-update.mjs || { echo 'RC1518: Finalizer bereits nach pretest verschwunden' >&2; git status --short; exit 86; }
      - name: Jede Testdatei einzeln auf Workspace-Schaden prüfen
        shell: bash
        run: |
          set -euo pipefail
          for f in test/*.test.mjs tests/*.test.cjs; do
            echo "===== RC1518 TEST: $f ====="
            node --test --test-concurrency=1 "$f"
            if [ ! -f .github/rc1488/finalize-auto-update.mjs ]; then
              echo "RC1518_CULPRIT=$f" >&2
              git status --short >&2 || true
              git diff --name-status >&2 || true
              git ls-files --deleted >&2 || true
              exit 86
            fi
          done
          echo 'RC1518: alle Einzeltests lassen RC1488 bestehen'
      - name: Zweiten Build nach allen Tests prüfen
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1112/build-three-env.mjs
          test -f .github/rc1488/finalize-auto-update.mjs
          node .github/rc1121/verify-final-html.mjs
          git status --short
