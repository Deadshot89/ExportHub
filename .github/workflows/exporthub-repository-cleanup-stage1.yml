name: ExportHUB Repository Cleanup Stage 1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-repository-cleanup-stage-1
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove obsolete root artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard current ExportHUB state
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f TESTVERSION.html
          test -f staticwebapp.config.json
          test -f staticwebapp.testservice.config.json
          test -d api
          test -d .github/workflows
          test -d android-app

          grep -Fq "version:'RC887',cache:'887',loginReturn:'/TESTVERSION.html?v=887'" TESTVERSION.html

          echo "OK: RC887 und Kernstruktur vorhanden."

      - name: RED audit - prove obsolete root artifacts exist
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATES=(
            "RC513_TESTVERSION.html"
            "RC653_TESTERGEBNISSE.json"
            "RC654_BROWSER_TESTS.json"
            "RC654_TESTERGEBNISSE.json"
            "RC883_PRUEFBERICHT.txt"
            "azure-static-web-apps-wonderful-forest-0f315e310.yml"
            "exporthub-testservice.yml"
          )

          found=0
          echo "Eindeutig entbehrliche Root-Dateien:"
          for file in "${CANDIDATES[@]}"; do
            if [[ -e "$file" ]]; then
              echo " - $file"
              found=$((found+1))
            fi
          done

          if [[ "$found" -eq 0 ]]; then
            echo "::error::Keine Stage-1-Aufräumdatei mehr vorhanden. Cleanup ist vermutlich bereits durchgeführt."
            exit 1
          fi

          # Both root workflow copies are redundant because GitHub Actions reads
          # workflow definitions from .github/workflows/.
          test -f .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml

          echo "RED bestätigt: $found obsolete/duplizierte Root-Artefakte vorhanden."

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Cleanup Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable pre-cleanup backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-before-repository-cleanup-stage1-${GITHUB_RUN_ID}"
          git tag -a "$TAG" -m "Backup before ExportHUB repository cleanup stage 1"
          git push origin "refs/tags/$TAG"
          echo "Backup erstellt: $TAG"

      - name: Remove obsolete root artifacts only
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATES=(
            "RC513_TESTVERSION.html"
            "RC653_TESTERGEBNISSE.json"
            "RC654_BROWSER_TESTS.json"
            "RC654_TESTERGEBNISSE.json"
            "RC883_PRUEFBERICHT.txt"
            "azure-static-web-apps-wonderful-forest-0f315e310.yml"
            "exporthub-testservice.yml"
          )

          for file in "${CANDIDATES[@]}"; do
            if [[ -e "$file" ]]; then
              git rm -- "$file"
            fi
          done

      - name: GREEN audit - verify only approved files are deleted
        shell: bash
        run: |
          set -euo pipefail

          ALLOWED='^(RC513_TESTVERSION\.html|RC653_TESTERGEBNISSE\.json|RC654_BROWSER_TESTS\.json|RC654_TESTERGEBNISSE\.json|RC883_PRUEFBERICHT\.txt|azure-static-web-apps-wonderful-forest-0f315e310\.yml|exporthub-testservice\.yml)$'

          mapfile -t CHANGED < <(git diff --cached --name-only)
          mapfile -t DELETED < <(git diff --cached --diff-filter=D --name-only)

          if [[ "${#DELETED[@]}" -eq 0 ]]; then
            echo "::error::Keine Datei wurde gelöscht."
            exit 1
          fi

          if [[ "${#CHANGED[@]}" -ne "${#DELETED[@]}" ]]; then
            echo "::error::Cleanup enthält Änderungen, die keine Löschungen sind."
            git diff --cached --name-status
            exit 1
          fi

          for file in "${DELETED[@]}"; do
            if ! [[ "$file" =~ $ALLOWED ]]; then
              echo "::error::Nicht freigegebene Löschung: $file"
              exit 1
            fi
          done

          # Protected core must remain untouched and present.
          test -f index.html
          test -f TESTVERSION.html
          test -f customer-avis.html
          test -f location.html
          test -f pickup.html
          test -f pod-notfall.html
          test -f staticwebapp.config.json
          test -f staticwebapp.testservice.config.json
          test -f .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml
          test -d api
          test -d android-app
          test -d assets
          test -d docs
          test -d migration
          test -d releases
          test -d schema
          test -d shared
          test -d test
          test -d tools

          if ! git diff --quiet -- \
            index.html \
            TESTVERSION.html \
            customer-avis.html \
            location.html \
            pickup.html \
            pod-notfall.html \
            staticwebapp.config.json \
            staticwebapp.testservice.config.json \
            api \
            android-app \
            assets \
            docs \
            infra \
            migration \
            releases \
            schema \
            shared \
            test \
            tools \
            .github/workflows
          then
            echo "::error::Geschützter Projektbestand wurde verändert."
            exit 1
          fi

          echo "GREEN bestätigt. Entfernt werden ausschließlich:"
          printf ' - %s\n' "${DELETED[@]}"

      - name: Commit repository cleanup
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Repository cleanup: remove obsolete root artifacts"
          git push origin main

      - name: Cleanup summary
        shell: bash
        run: |
          {
            echo "## ExportHUB Repository Cleanup Stage 1"
            echo
            echo "Entfernt wurden ausschließlich alte RC-Prüfdateien und doppelte Workflow-Kopien im Repository-Root."
            echo
            echo "Geschützt und unverändert:"
            echo "- Produktion"
            echo "- TESTVERSION / RC887"
            echo "- API"
            echo "- Azure-Konfiguration"
            echo "- .github/workflows"
            echo "- Android-App"
            echo "- assets/docs/infra/migration/releases/schema/shared/test/tools"
            echo
            echo "Vor der Löschung wurde ein unveränderlicher Backup-Tag angelegt."
          } >> "$GITHUB_STEP_SUMMARY"
