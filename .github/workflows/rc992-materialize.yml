name: RC992 Materialize TESTSERVICE Build

on:
  push:
    branches:
      - rc992-state-save-performance
    paths:
      - '.github/workflows/rc992-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc992-state-save-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Raise TESTSERVICE build to RC992
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('TESTVERSION.html')
          s=p.read_text(encoding='utf-8')

          old="var BUILD=Object.freeze({version:'RC991',cache:'991',loginReturn:'/TESTVERSION.html?v=991'})"
          new="var BUILD=Object.freeze({version:'RC992',cache:'992',loginReturn:'/TESTVERSION.html?v=992'})"
          if s.count(old) != 1:
              raise SystemExit(f'BUILD anchor count unexpected: {s.count(old)}')
          s=s.replace(old,new,1)

          change_anchor='changes:Object.freeze(['
          test_anchor='tests:Object.freeze(['
          if s.count(change_anchor) != 1:
              raise SystemExit(f'changes anchor count unexpected: {s.count(change_anchor)}')
          if s.count(test_anchor) != 1:
              raise SystemExit(f'tests anchor count unexpected: {s.count(test_anchor)}')

          change='"RC992 reduziert beim Azure-State-Speichern unnötige Tiefkopien unveränderter State-Bereiche und Datensätze.",'
          if change not in s:
              s=s.replace(change_anchor,change_anchor+change,1)

          release_tests=(
            '"RC992 Delta-Save-Test: Eine kleine Aufgabenänderung darf unveränderte große State-Bereiche beim Server-Merge nicht mehr tief kopieren.",'
            '"RC992 Sendungs-Merge-Test: Wird genau eine Sendung geändert, dürfen andere unveränderte Sendungen derselben Sammlung ohne Tiefkopie wiederverwendet werden.",'
            '"RC992 Regressionstest: Kunden- und Sendungsschutz, Tombstones, Parallel-Merge und Small-ACK bleiben unverändert funktionsfähig.",'
          )
          insertion=''.join(item for item in release_tests if item not in s)
          if insertion:
              s=s.replace(test_anchor,test_anchor+insertion,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify RC992 build markers
        run: |
          grep -F "var BUILD=Object.freeze({version:'RC992',cache:'992',loginReturn:'/TESTVERSION.html?v=992'})" TESTVERSION.html
          grep -F "RC992 reduziert beim Azure-State-Speichern unnötige Tiefkopien unveränderter State-Bereiche und Datensätze." TESTVERSION.html
      - name: Run full regression suite
        run: npm test
      - name: Commit RC992 TESTSERVICE build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          git diff --cached --check || true
          git commit -m "RC992: TESTSERVICE-Build und Release-Center anheben"
          git push origin HEAD:rc992-state-save-performance
