name: RC944 Sendungsdaten Raster gezielt umsetzen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc944-shipment-data-layout.yml'

permissions:
  contents: write

concurrency:
  group: rc944-shipment-data-layout
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RC943 Ausgangszustand testen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          version="version:'RC943',cache:'943',loginReturn:'/TESTVERSION.html?v=943'"
          old='#rc896ShipmentFieldGrid [data-rc896-field="reference"]{grid-column:span 2!important;order:10}#rc896ShipmentFieldGrid [data-rc896-field="pickup"]{grid-column:span 2!important;order:20}#rc896ShipmentFieldGrid [data-rc896-field="carrier"]{grid-column:span 2!important;order:30}#rc896ShipmentFieldGrid [data-rc896-field="description"]{grid-column:span 3!important;order:40}#rc896ShipmentFieldGrid [data-rc896-field="remark"]{grid-column:span 3!important;order:50}'
          new='#rc896ShipmentFieldGrid [data-rc896-field="reference"]{grid-column:span 2!important;order:10}#rc896ShipmentFieldGrid [data-rc896-field="pickup"]{grid-column:span 2!important;order:20}#rc896ShipmentFieldGrid [data-rc896-field="carrier"]{grid-column:span 2!important;order:30}#rc896ShipmentFieldGrid [data-rc896-field="description"]{grid-column:span 4!important;order:40}#rc896ShipmentFieldGrid [data-rc896-field="remark"]{grid-column:1/-1!important;order:50}'
          assert text.count(version)==1, 'RC943 Versionsbasis nicht eindeutig'
          assert text.count(old)==1, 'Aktives RC896 Raster nicht eindeutig gefunden'
          assert new not in text, 'RC944 Raster ist unerwartet bereits vorhanden'
          assert 'state.shipment.goodsDescription=this.value' in text, 'Warenbeschreibungs-Handler fehlt'
          assert 'state.shipment.comments=this.value' in text, 'Bemerkungs-Handler fehlt'
          assert 'applyRC894ShipmentFieldGrid(body)' in text, 'Aktiver Layout-Controller fehlt'
          print('RED OK: RC943 hat noch 3/6 Warenbeschreibung und 3/6 Bemerkung.')
          PY

      - name: RC944 Raster direkt korrigieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('TESTVERSION.html')
          text=p.read_text(encoding='utf-8')
          old_version="version:'RC943',cache:'943',loginReturn:'/TESTVERSION.html?v=943'"
          new_version="version:'RC944',cache:'944',loginReturn:'/TESTVERSION.html?v=944'"
          old='#rc896ShipmentFieldGrid [data-rc896-field="reference"]{grid-column:span 2!important;order:10}#rc896ShipmentFieldGrid [data-rc896-field="pickup"]{grid-column:span 2!important;order:20}#rc896ShipmentFieldGrid [data-rc896-field="carrier"]{grid-column:span 2!important;order:30}#rc896ShipmentFieldGrid [data-rc896-field="description"]{grid-column:span 3!important;order:40}#rc896ShipmentFieldGrid [data-rc896-field="remark"]{grid-column:span 3!important;order:50}'
          new='#rc896ShipmentFieldGrid [data-rc896-field="reference"]{grid-column:span 2!important;order:10}#rc896ShipmentFieldGrid [data-rc896-field="pickup"]{grid-column:span 2!important;order:20}#rc896ShipmentFieldGrid [data-rc896-field="carrier"]{grid-column:span 2!important;order:30}#rc896ShipmentFieldGrid [data-rc896-field="description"]{grid-column:span 4!important;order:40}#rc896ShipmentFieldGrid [data-rc896-field="remark"]{grid-column:1/-1!important;order:50}'
          assert text.count(old_version)==1
          assert text.count(old)==1
          text=text.replace(old_version,new_version,1).replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: RC944 Schutzprüfung
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          version="version:'RC944',cache:'944',loginReturn:'/TESTVERSION.html?v=944'"
          new='#rc896ShipmentFieldGrid [data-rc896-field="reference"]{grid-column:span 2!important;order:10}#rc896ShipmentFieldGrid [data-rc896-field="pickup"]{grid-column:span 2!important;order:20}#rc896ShipmentFieldGrid [data-rc896-field="carrier"]{grid-column:span 2!important;order:30}#rc896ShipmentFieldGrid [data-rc896-field="description"]{grid-column:span 4!important;order:40}#rc896ShipmentFieldGrid [data-rc896-field="remark"]{grid-column:1/-1!important;order:50}'
          assert text.count(version)==1, 'RC944 Versionsmarker fehlt'
          assert text.count(new)==1, 'RC944 Raster fehlt oder ist doppelt'
          assert 'state.shipment.goodsDescription=this.value' in text
          assert 'state.shipment.comments=this.value' in text
          assert 'applyRC894ShipmentFieldGrid(body)' in text
          assert '#rc363BlockShipment #rc573ShipmentStatus{margin-left:auto!important;min-width:0!important}' in text, 'Statuskopf wurde verändert'
          assert '@media(max-width:900px){#rc896ShipmentFieldGrid{grid-template-columns:1fr!important}' in text, 'Mobile Einspaltenregel fehlt'
          print('GREEN OK: Referenz 2/6, Warenbeschreibung 4/6, Bemerkung 6/6; Handler und Mobile-Regel erhalten.')
          PY
          git diff --check

      - name: RC944 committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          git rm -f _rc944_active_snippet.txt
          git commit -m "RC944 Sendungsdaten Layout abschließen"
          git push origin HEAD:main
