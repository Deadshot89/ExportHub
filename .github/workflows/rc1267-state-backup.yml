name: RC1267 State Backup Lifecycle

on:
  workflow_run:
    workflows:
      - ExportHUB Production Release
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: Backup-Stufe; auto nutzt Tages-/Monats-/Jahresregel.
        required: true
        type: choice
        default: auto
        options:
          - auto
          - daily
          - monthly
          - yearly
          - all

permissions:
  contents: read
  id-token: write

concurrency:
  group: rc1267-state-backup-lifecycle
  cancel-in-progress: false

jobs:
  backup:
    name: Verifizierte State-Backups
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUESTED_TIER: ${{ inputs.tier || 'auto' }}
    steps:
      - name: Daily / Monthly / Yearly Snapshots erstellen und zurücklesen
        shell: bash
        run: |
          set -euo pipefail
          set +x

          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-state-compaction" \
            | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"

          requested="${REQUESTED_TIER:-auto}"
          day="$(date -u +%d)"
          month="$(date -u +%m)"
          tiers=()

          case "$requested" in
            daily|monthly|yearly) tiers=("$requested") ;;
            all) tiers=(daily monthly yearly) ;;
            auto)
              tiers=(daily)
              if [ "$day" = "01" ]; then tiers+=(monthly); fi
              if [ "$day" = "01" ] && [ "$month" = "01" ]; then tiers+=(yearly); fi
              ;;
            *) echo "Unbekannte Backup-Stufe: $requested" >&2; exit 2 ;;
          esac

          call_backup() {
            local base="$1"
            local env="$2"
            local tier="$3"
            local payload
            payload="$(node -e 'process.stdout.write(JSON.stringify({action:"scheduled-backup",environment:process.argv[1],tier:process.argv[2]}))' "$env" "$tier")"
            curl -fsSL \
              -H "Content-Type: application/json" \
              -H "x-exporthub-github-oidc: $oidc_token" \
              -H "x-exporthub-environment: $env" \
              --data "$payload" \
              "$base/api/state-maintenance"
          }

          verify_backup() {
            local env="$1"
            local tier="$2"
            node -e "
              let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
                const v=JSON.parse(s);
                if(!v.ok||v.scheduledBackup!==true||v.environment!==process.argv[1]||v.tier!==process.argv[2])process.exit(3);
                if(v.backupVerified!==true||v.backupReadBackVerified!==true||!v.backupBlob||!v.sha256||Number(v.bytes||0)<=0)process.exit(4);
                if(!v.retention||v.retention.automaticDeletion!==false||Number(v.retention.minimumRetentionDays||0)<=0)process.exit(5);
                console.log(process.argv[1]+' '+process.argv[2]+' backup',JSON.stringify({blob:v.backupBlob,bytes:v.bytes,sha256:v.sha256,retention:v.retention}));
              })" "$env" "$tier"
          }

          for tier in "${tiers[@]}"; do
            prod="$(call_backup 'https://wonderful-forest-0f315e310.7.azurestaticapps.net' production "$tier")"
            printf '%s\n' "$prod" | verify_backup production "$tier"

            testservice="$(call_backup 'https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net' testservice "$tier")"
            printf '%s\n' "$testservice" | verify_backup testservice "$tier"
          done

          # RC1627: On the existing scheduled backup only, collect TESTSERVICE
          # metadata using the already verified GitHub OIDC token. This requires
          # no new Azure secrets, storage account keys or additional scheduler.
          # Failure must never turn a successful verified backup into a failure.
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
            inventory_payload='{"action":"inventory-testservice-team","environment":"testservice"}'
            inventory_file="$(mktemp)"
            inventory_status="$(curl -sS -o "$inventory_file" -w '%{http_code}' --max-time 28 \
              -H 'Content-Type: application/json' \
              -H "x-exporthub-github-oidc: $oidc_token" \
              -H 'x-exporthub-environment: testservice' \
              --data "$inventory_payload" \
              'https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net/api/state-maintenance' || true)"
            if [ "$inventory_status" = "200" ] && INVENTORY_FILE="$inventory_file" node -e '
              const fs=require("fs");
              const v=JSON.parse(fs.readFileSync(process.env.INVENTORY_FILE,"utf8"));
              const n=x=>Number.isSafeInteger(x)&&x>=0;
              const keys=["live","version","snapshot","deleted"];
              if(v.ok===false||v.complete!==true||v.environment!=="testservice"||v.scope!=="team-prefix"||
                  v.billingVerified!==false||!n(v.records)||!n(v.logicalBytes)||
                  !n(v.liveLogicalBytes)||!n(v.historicalLogicalBytes)||
                  !keys.every(k=>v.kinds&&n(v.kinds[k]?.records)&&n(v.kinds[k]?.logicalBytes))||
                  v.liveLogicalBytes+v.historicalLogicalBytes!==v.logicalBytes||
                  keys.reduce((a,k)=>a+v.kinds[k].records,0)!==v.records)process.exit(3);
              const rows=["## TESTSERVICE Team-Blob-Metadaten (RC1627)","","Nur Testservice-Prefix; keine Dateinamen, Inhalte oder Rechnungsbeträge.","",
                "| Typ | Datensätze | Logische Bytes |","|---|---:|---:|"];
              for(const k of keys)rows.push("| "+k+" | "+v.kinds[k].records+" | "+v.kinds[k].logicalBytes+" |");
              const names=["root-files","daily-backups","monthly-backups","yearly-backups","recovery-backups","recovery-drills","other"];
              if(v.areas){
               if(!names.every(id=>v.areas[id]&&n(v.areas[id].records)&&n(v.areas[id].logicalBytes)&&
                   keys.every(k=>n(v.areas[id].kinds?.[k]?.records)&&n(v.areas[id].kinds?.[k]?.logicalBytes)))||
                   names.reduce((a,id)=>a+v.areas[id].records,0)!==v.records||
                   names.reduce((a,id)=>a+v.areas[id].logicalBytes,0)!==v.logicalBytes)process.exit(7);
               rows.push("","### TESTSERVICE-Speicherbereiche (nur aggregierte Metadaten)","","| Bereich | Einträge | Logische Bytes |","|---|---:|---:|");
               for(const id of names)rows.push("| "+id+" | "+v.areas[id].records+" | "+v.areas[id].logicalBytes+" |");
               rows.push("","Speicherbereiche enthalten aktuelle und historische Daten. Keine Lösch- oder Kostenfreigabe.");
              }
              rows.push("","**Gesamt: "+v.records+" Einträge, "+v.logicalBytes+" logische Bytes**","",
                "Es handelt sich nicht um abrechenbare Speicher-Bytes und nicht um eine vollständige sechs-Scope-Inventur.",
                "Produktions- und geteilte Auth-Abhängigkeiten bleiben ungeklärt; nichts löschen.");
              if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,rows.join("\n")+"\n");
              console.log("RC1627: vollständige anonymisierte TESTSERVICE-Team-Inventur: "+v.records+" Einträge");
            '; then
              echo "RC1627: TESTSERVICE Team-Inventur erfolgreich (aggregierte Angaben nur in Actions Summary)."
            else
              echo "RC1627: Team-Inventur nicht verifiziert; bestehende Backups bleiben erfolgreich. Keine vollständige Bestandsfreigabe." >&2
            fi
            rm -f "$inventory_file"
          fi

          echo "RC1267: verifizierte State-Backups abgeschlossen: ${tiers[*]}"
