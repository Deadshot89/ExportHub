name: RC1547 one-time rendered-fit patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rc1547-one-time-rendered-fit-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/rc1548-loading-list-single-page-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Add exact rendered-height print fit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/rc1305-loading-list-print.js')
          s=p.read_text()
          if 'function rc1547FitRenderedRoot(' not in s:
              anchor='function enhanceDocuments(root,sh){'
              if anchor not in s:
                  raise SystemExit('RC1547 enhanceDocuments anchor missing')
              block=r'''function rc1547RenderedContentHeight(root){
 if(!root)return 0;
 var rr=root.getBoundingClientRect(),top=rr.top,bottom=top;
 Array.from(root.querySelectorAll('*')).forEach(function(node){
  try{var cs=w.getComputedStyle?w.getComputedStyle(node):null;if(cs&&cs.display==='none')return;var r=node.getBoundingClientRect();if(r.width>0&&r.height>0)bottom=Math.max(bottom,r.bottom)}catch(_){}
 });
 return Math.max(Number(root.scrollHeight)||0,bottom-top)
}
function rc1547FitRenderedRoot(root){
 if(!root)return 1;
 var hinted=Number(root.getAttribute('data-rc1547-fit-scale')||1);if(!(hinted>0&&hinted<=1))hinted=1;
 root.style.setProperty('zoom','1','important');
 var rr=root.getBoundingClientRect(),available=Math.max(Number(root.clientHeight)||0,rr.height||0,1),needed=rc1547RenderedContentHeight(root);
 var exact=needed>available?available/needed:1,scale=Math.max(.08,Math.min(1,hinted,exact));
 root.style.setProperty('zoom',String(scale),'important');
 root.setAttribute('data-rc1547-rendered-fit','1');
 root.setAttribute('data-rc1547-rendered-height',String(Math.round(needed*10)/10));
 root.setAttribute('data-rc1547-available-height',String(Math.round(available*10)/10));
 root.setAttribute('data-rc1547-fit-scale',String(Math.round(scale*1000)/1000));
 return scale
}
function rc1547FitAllRendered(){
 var roots=Array.from(d.querySelectorAll('.rc390-load[data-rc1305-loading-list],.rc352-load[data-rc1305-loading-list]'));
 roots.forEach(rc1547FitRenderedRoot);return roots.length
}
function rc1547InstallPrintFit(){
 if(w.__EXPORTHUB_RC1547_SINGLE_PAGE_PRINT_FIT__)return;
 w.__EXPORTHUB_RC1547_SINGLE_PAGE_PRINT_FIT__=true;
 if(w.addEventListener)w.addEventListener('beforeprint',rc1547FitAllRendered)
}
'''
              s=s.replace(anchor,block+anchor,1)
          old="style();\nw.ExportHUBRC1305LoadingListPrint=Object.freeze({version:'RC1517',singlePageVersion:'RC1547',"
          new="style();\nrc1547InstallPrintFit();\nw.ExportHUBRC1305LoadingListPrint=Object.freeze({version:'RC1517',singlePageVersion:'RC1547',"
          if old in s:
              s=s.replace(old,new,1)
          if 'fitRenderedRoot:rc1547FitRenderedRoot' not in s:
              old_api='applySinglePageFit:rc1547ApplySinglePageFit,style:style'
              new_api='applySinglePageFit:rc1547ApplySinglePageFit,fitRenderedRoot:rc1547FitRenderedRoot,fitAllRendered:rc1547FitAllRendered,style:style'
              if old_api not in s:
                  raise SystemExit('RC1547 export anchor missing')
              s=s.replace(old_api,new_api,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rc1305-loading-list-print.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(RC1547): fit rendered loading-list height before print"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
