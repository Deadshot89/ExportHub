name: RC962 Apply State Performance Fix

on:
  push:
    branches:
      - rc962-state-performance
    paths:
      - '.github/workflows/rc962-apply-state-performance.yml'

permissions:
  contents: write

jobs:
  apply_rc962:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rc962-state-performance
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply exact RC962 state performance patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'api/exporthub-state/index.js';
          let source = fs.readFileSync(file, 'utf8');

          function replaceOnce(label, before, after) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: erwartet exakt 1 Treffer, gefunden ${count}`);
            source = source.replace(before, after);
          }

          replaceOnce(
            'merge import',
            "const { mergeState, sanitizeState, pruneTombstones, clone } = require('../shared/merge');",
            "const { mergeState, sanitizeState, pruneTombstones, clone, isLocalOnlyKey } = require('../shared/merge');"
          );

          replaceOnce(
            'warm cache store',
            "function rememberWarmTeam(c,value,etag){if(!c||!value||!etag)return false;TEAM_WARM_CACHE.set(teamWarmCacheKey(c),{value:clone(value),etag:String(etag),at:Date.now()});return true}",
            "function rememberWarmTeam(c,value,etag){if(!c||!value||!etag)return false;TEAM_WARM_CACHE.set(teamWarmCacheKey(c),{value:value,etag:String(etag),at:Date.now()});return true}"
          );

          replaceOnce(
            'warm cache save read',
            "if(requestedMode==='save')return {value:clone(cached.value),etag:String(cached.etag),warmCache:true,optimisticSave:true,cacheMode:'memory-save'};",
            "if(requestedMode==='save')return {value:cached.value,etag:String(cached.etag),warmCache:true,optimisticSave:true,cacheMode:'memory-save'};"
          );

          replaceOnce(
            'warm cache etag read',
            "try{const props=await c.team.getProperties(),etag=props&&props.etag?String(props.etag):'';if(etag&&etag===String(cached.etag))return {value:clone(cached.value),etag:etag,warmCache:true,cacheMode:'memory-etag'};forgetWarmTeam(c)}",
            "try{const props=await c.team.getProperties(),etag=props&&props.etag?String(props.etag):'';if(etag&&etag===String(cached.etag))return {value:cached.value,etag:etag,warmCache:true,cacheMode:'memory-etag'};forgetWarmTeam(c)}"
          );

          replaceOnce(
            'client sanitizer',
            "function sanitizeForClient(document,adminView){\n const out=clone(document||emptyTeam());delete out.authBootstrap;delete out.recentOperations;out.users=publicUsers(out.users,adminView);out.state=out.state&&typeof out.state==='object'?mergeState({},out.state):{};out.state.users=clone(out.users);return out;\n}",
            "function clientStateForRead(state){\n const source=state&&typeof state==='object'&&!Array.isArray(state)?state:{},out={};\n for(const [key,value] of Object.entries(source)){if(key==='users'||isLocalOnlyKey(key))continue;out[key]=value}\n return out;\n}\nfunction sanitizeForClient(document,adminView){\n const source=document&&typeof document==='object'&&!Array.isArray(document)?document:emptyTeam(),out=Object.assign({},source);delete out.authBootstrap;delete out.recentOperations;out.users=publicUsers(source.users,adminView);out.state=clientStateForRead(source.state);out.state.users=clone(out.users);return out;\n}"
          );

          fs.writeFileSync(file, source);
          NODE

          node --check api/exporthub-state/index.js
          node tests/rc962-state-performance.test.cjs
          git diff --check

      - name: Commit RC962 production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add api/exporthub-state/index.js
          git diff --cached --exit-code && { echo 'Keine Änderung erzeugt'; exit 1; } || true
          git commit -m 'RC962 State-API – unnötige Vollkopien entfernen'
          git push origin HEAD:rc962-state-performance
