name: RC1469 P0 New Shipment Clean Slate

on:
  pull_request:
    paths:
      - 'test/rc1469-new-shipment-clean-slate.test.mjs'
      - 'e2e/specs/rc1469-new-shipment-clean-slate.spec.mjs'
      - 'scripts/rc1469-new-shipment-clean-slate.mjs'
      - 'scripts/rc1462-pretest.mjs'
      - '.github/rc1112/build-three-env.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/rc1469-new-shipment-clean-slate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Clean-slate contract prüfen
        run: node --test test/rc1469-new-shipment-clean-slate.test.mjs
      - name: Druck- und Pickup-Verträge prüfen
        run: node --test test/rc1190-print-browser-gate.test.mjs test/rc1305-loading-list-redesign.test.mjs test/rc1259-container-documentation.test.mjs
      - name: Gesamte Node-Regression diagnostizieren
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee rc1469-full-node.log
          code=${PIPESTATUS[0]}
          printf 'exit_code=%s\n' "$code" > rc1469-node-exit.txt
          exit "$code"
      - name: Node-Regressionslog hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1469-full-node-regression
          path: |
            rc1469-full-node.log
            rc1469-node-exit.txt
          if-no-files-found: error
          retention-days: 1
      - name: Drei-Umgebungen-Paket bauen
        run: node .github/rc1112/build-three-env.mjs
      - name: Playwright Chromium installieren
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium
      - name: Clean-slate im echten Browser prüfen
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_ENTRY: /demo.html
          EXPORTHUB_E2E_PUBLIC_ENV: testservice
        run: npx playwright test e2e/specs/rc1469-new-shipment-clean-slate.spec.mjs --project=mobile-small --project=mobile-standard --project=laptop
      - name: Mobile Pickup und Avis prüfen
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_PUBLIC_ENV: testservice
        run: npx playwright test e2e/specs/public-smoke.spec.mjs --project=mobile-small --project=mobile-standard
      - name: Gesamtdruck im echten Chromium-Druckkontext prüfen
        env:
          EXPORTHUB_E2E_STATIC: '1'
          EXPORTHUB_E2E_ENTRY: /demo.html
          EXPORTHUB_E2E_PUBLIC_ENV: testservice
        run: npx playwright test e2e/specs/print-documents.spec.mjs --project=laptop
