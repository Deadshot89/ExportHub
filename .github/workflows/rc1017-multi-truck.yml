name: RC1017 Mehr-LKW

on:
  push:
    branches:
      - feature/multi-truck-shipment-split
    paths:
      - 'assets/rc1017-multi-truck.js'
      - 'assets/rc1017-multi-truck.css'
      - 'api/shared/merge.js'
      - 'api/shared/public-access-store.js'
      - 'api/shared/pickup-store.js'
      - 'api/pickup-init/index.js'
      - 'api/pickup-status/index.js'
      - 'api/pickup-confirm-v2/index.js'
      - 'api/pickup-pod/index.js'
      - 'pickup.html'
      - 'test/rc1017-*.test.mjs'
      - '.github/rc1013/build-three-env.mjs'
      - '.github/workflows/rc1017-multi-truck.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install API dependencies
        run: npm --prefix api install --ignore-scripts
      - name: RC1017 tests
        run: node --test test/rc1017-*.test.mjs
      - name: Build current shared environments for baseline tests
        run: node .github/rc1013/build-three-env.mjs
      - name: Existing regression suite
        run: npm test
