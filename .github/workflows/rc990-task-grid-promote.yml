name: RC990 Task Grid Promote

on:
  push:
    branches:
      - rc990-large-ux
    paths:
      - .github/rc990_task_grid_promote.py
      - .github/workflows/rc990-task-grid-promote.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc990-task-grid-promote
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/rc990-large-ux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated RC990 branch
        uses: actions/checkout@v4
        with:
          ref: rc990-large-ux
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair canonical RC990 selectors
        run: python .github/rc990_task_grid_promote.py

      - name: Materialize canonical RC990 design into preview source
        run: python .github/rc990_design_apply.py

      - name: Verify focused RC990 design contract
        run: node --test test/rc990-design-system.test.mjs

      - name: Verify full regression suite and capture exact failure
        shell: bash
        run: |
          set +e
          npm test > .github/rc990_task_grid_regression_result.txt 2>&1
          status=$?
          tail -n 500 .github/rc990_task_grid_regression_result.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/rc990_task_grid_regression_result.txt
            git commit -m "diag: materialize RC990 task-grid regression failure"
            git push origin HEAD:rc990-large-ux
            exit "$status"
          fi
          rm -f .github/rc990_task_grid_regression_result.txt

      - name: Remove one-time promotion helpers
        shell: bash
        run: |
          git rm .github/rc990_task_grid_promote.py .github/workflows/rc990-task-grid-promote.yml
          git rm -f --ignore-unmatch .github/rc990_task_grid_test_result.txt .github/rc990_task_grid_regression_result.txt

      - name: Commit canonical result only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rc990_design_apply.py TESTVERSION.html
          git commit -m "RC990: Aufgabenraster sichtbar und direkt wirksam machen"
          git push origin HEAD:rc990-large-ux
