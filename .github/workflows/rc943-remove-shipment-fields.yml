name: RC943 Sendung erstellen Felder diagnostizieren

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc943-remove-shipment-fields.yml'

permissions:
  contents: read

concurrency:
  group: rc943-remove-shipment-fields
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rohdarstellung der zwei Felder ermitteln
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'" in text, 'Basis ist nicht RC942'
          for needle in ['Geplantes Abholdatum','Spedition','setShipmentPickupDate(this.value)','state.shipment.carrier=this.value']:
              positions=[]
              pos=0
              while True:
                  i=text.find(needle,pos)
                  if i<0: break
                  positions.append(i)
                  pos=i+1
              print('\n===',needle,'Treffer',len(positions),'===')
              for i in positions[:12]:
                  print('INDEX',i)
                  print(repr(text[max(0,i-220):i+420]))
          PY
