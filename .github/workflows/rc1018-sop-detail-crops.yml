name: RC1018 SOP Detailbilder erzeugen

on:
  push:
    branches: [rc1018-sop-multi-image-depth]
    paths:
      - 'browser/rc1018-sop-detail-crops.py'
      - 'assets/sop/rc1018-sop-system-images.js'
      - 'test/rc1018-sop-multi-image-depth.test.mjs'
      - '.github/workflows/rc1018-sop-detail-crops.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc1018-sop-detail-crops
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pillow bereitstellen
        run: python -m pip install Pillow==11.3.0
      - name: Detailbilder aus echten RC1018-Demo-Screenshots erzeugen
        run: python browser/rc1018-sop-detail-crops.py
      - name: SOP-Bildverträge prüfen
        run: node --test test/rc1018-sop-system-images.test.mjs test/rc1018-sop-image-coverage-complete.test.mjs test/rc1018-sop-multi-image-depth.test.mjs
      - name: Diff prüfen
        run: git diff --check
      - name: Detailbilder versionieren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add \
            assets/sop/screenshots/rc1018-customers-masterdata-detail.png \
            assets/sop/screenshots/rc1018-customers-mailcontacts-detail.png \
            assets/sop/screenshots/rc1018-shipping-route-inputs-detail.png \
            assets/sop/screenshots/rc1018-shipping-result-detail.png \
            assets/sop/screenshots/rc1018-pallet-booking-detail.png \
            assets/sop/screenshots/rc1018-pallet-reconciliation-detail.png \
            assets/sop/screenshots/rc1018-sop-controlled-document-detail.png \
            assets/sop/screenshots/rc1018-sop-editor-detail.png \
            assets/sop/screenshots/rc1018-academy-overview-detail.png \
            assets/sop/screenshots/rc1018-academy-test-detail.png \
            assets/sop/screenshots/rc1018-release-status-detail.png \
            assets/sop/screenshots/rc1018-release-checklist-detail.png
          if git diff --cached --quiet; then
            echo 'RC1018 SOP-Detailbilder bereits aktuell.'
            exit 0
          fi
          git commit -m 'chore: zwölf RC1018 SOP-Detailbilder versionieren'
          git push origin HEAD:rc1018-sop-multi-image-depth
