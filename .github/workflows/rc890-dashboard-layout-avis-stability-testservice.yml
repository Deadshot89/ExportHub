      - name: GREEN verify RC890 patch
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "var BUILD=Object.freeze({version:'RC890',cache:'890',loginReturn:'/TESTVERSION.html?v=890'});" TESTVERSION.html
          grep -Fq "/* exporthub-rc890-dashboard-avis-stability */" TESTVERSION.html
          grep -Fq "Lieferavis" TESTVERSION.html
          grep -Fq "/customer-avis.html?v=890" TESTVERSION.html
          grep -Fq "__rc887AvisAllowed" TESTVERSION.html

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          src=Path("TESTVERSION.html").read_text(encoding="utf-8",errors="replace")
          before={
            "script_open":int(Path("/tmp/rc890_script_open").read_text()),
            "script_close":int(Path("/tmp/rc890_script_close").read_text()),
            "style_open":int(Path("/tmp/rc890_style_open").read_text()),
            "style_close":int(Path("/tmp/rc890_style_close").read_text())
          }
          after={
            "script_open":src.lower().count("<script"),
            "script_close":src.lower().count("</script>"),
            "style_open":src.lower().count("<style"),
            "style_close":src.lower().count("</style>")
          }
          if before!=after:
            raise SystemExit("HTML-Grenzen verändert: "+repr({"vorher":before,"nachher":after}))

          class V(HTMLParser):
            def __init__(self):
              super().__init__(convert_charrefs=False)
              self.script=0; self.style=0; self.parts=[]
            def handle_starttag(self,tag,attrs):
              if tag.lower()=="script": self.script+=1
              elif tag.lower()=="style": self.style+=1
            def handle_endtag(self,tag):
              if tag.lower()=="script" and self.script: self.script-=1
              elif tag.lower()=="style" and self.style: self.style-=1
            def handle_data(self,data):
              if not self.script and not self.style: self.parts.append(data)

          p=V(); p.feed(src); p.close()
          visible="\n".join(p.parts)
          leaks=[x for x in [
            "exporthub-rc890-dashboard-avis-stability",
            "function applyFullWidthCards()",
            "function stabilizeSendungsdaten()"
          ] if x in visible]
          if leaks:
            raise SystemExit("JavaScript als Seitentext sichtbar: "+", ".join(leaks))

          print("GREEN: RC890 Modul korrekt eingebettet, keine Script-Leaks.")
          PY

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "TESTVERSION.html" ]]; then
            echo "::error::RC890 darf nur TESTVERSION.html ändern."
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi

          if ! git diff --quiet -- index.html api staticwebapp.config.json .github/workflows; then
            echo "::error::Produktion/API/Workflow-Dateien wurden verändert."
            exit 1
          fi

      - name: Commit RC890 TESTSERVICE
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC890: full-width dashboard, move Arbeitsfokus, restore Lieferavis, stabilize Sendungsdaten"
          git push origin main

      - name: RC890 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## ExportHUB RC890"
            echo
            echo "- Arbeitsfokus wird unter 'Heute geplante Sendungen' einsortiert"
            echo "- Dashboard-Kacheln werden auf volle Breite gestreckt"
            echo "- Lieferavis-Button wird in der oberen Aktionsleiste ergänzt"
            echo "- Sendungsdaten werden visuell stabilisiert, um Flackern zu reduzieren"
            echo "- Nur TESTVERSION.html geändert"
          } >> "$GITHUB_STEP_SUMMARY"
