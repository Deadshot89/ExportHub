name: RC938 Standort-Quelllogik

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc938-location-source-consistency.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rc938-location-source-consistency
  cancel-in-progress: false

jobs:
  patch_verify_deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED – RC937 muss die Quell-Alias-Lücken noch zeigen
        id: red
        continue-on-error: true
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC937',cache:'937',loginReturn:'/TESTVERSION.html?v=937'" in text
          # Gewünschter RC938-Stand: diese Assertions müssen auf RC937 noch scheitern.
          assert "delete sh.destinationId;delete sh.location;delete sh.site;delete sh.standort;" in text
          assert "l.id||l.locationId||l.selectedLocationId||l.siteId||l.destinationId||l.code||l.number" in text
          assert "Object.assign({},l,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id" in text
          assert "function findLocation(c,v){var x=n(v);return locations(c).find(function(l){return [l.id,l.locationId,l.selectedLocationId,l.siteId,l.destinationId,l.name,l.address]" in text
          assert "sh.locationId='';sh.selectedLocationId='';sh.siteId='';sh.destinationId='';sh.location='';sh.site='';sh.standort='';sh.locationName='';sh.destinationName='';sh.recipientName='';sh.recipientAddress='';sh.deliveryAddress='';sh.destinationAddress=''" in text
          assert "if(identity.id){sh.locationId=identity.id;sh.selectedLocationId=identity.id;sh.siteId=identity.id;sh.destinationId=identity.id}" in text
          PY

      - name: RED-Ergebnis verifizieren
        shell: bash
        env:
          RED_OUTCOME: ${{ steps.red.outcome }}
        run: |
          if [[ "$RED_OUTCOME" != "failure" ]]; then
            echo "RED ist nicht wie erwartet fehlgeschlagen. RC937 wird nicht verändert."
            exit 1
          fi
          echo "RED bestätigt: RC937 enthält noch die Quell-Alias-Lücken."

      - name: RC938 direkt in bestehenden Quellpfaden korrigieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('TESTVERSION.html')
          text=p.read_text(encoding='utf-8')

          def once(src,old,new,label):
              n=src.count(old)
              if n!=1: raise SystemExit(f'{label}: erwartet 1 Fundstelle, gefunden {n}')
              return src.replace(old,new,1)

          text=once(text,
              "version:'RC937',cache:'937',loginReturn:'/TESTVERSION.html?v=937'",
              "version:'RC938',cache:'938',loginReturn:'/TESTVERSION.html?v=938'",
              'BUILD-Version')

          marker="changes:Object.freeze([\n"
          if text.count(marker)!=1: raise SystemExit('Release-Anker nicht eindeutig')
          note=("    'RC938 vereinheitlicht die Standort-Quelllogik: Kundenwechsel, Standort-Normalisierung, Auswahl-Reset und Adressbestätigung schreiben locationId, selectedLocationId, siteId und destinationId sowie Empfänger-, Liefer- und Zieladresse gemeinsam.',\n")
          text=text.replace(marker,marker+note,1)

          # A) Älterer Kunden-/Standort-Handler direkt reparieren.
          old="if(!locationId&&customerChanged){delete sh.locationId;delete sh.selectedLocationId;delete sh.siteId;delete sh.location;delete sh.locationName;delete sh.locationData;delete sh.siteData;sh.addressConfirmed=false;sh.addressChecked=false;sh.recipientAddress='';sh.destinationName='';sh.recipientName=''}"
          new="if(!locationId&&customerChanged){delete sh.locationId;delete sh.selectedLocationId;delete sh.siteId;delete sh.destinationId;delete sh.location;delete sh.site;delete sh.standort;delete sh.locationName;delete sh.locationData;delete sh.siteData;sh.addressConfirmed=false;sh.addressChecked=false;sh.recipientAddress='';sh.deliveryAddress='';sh.destinationAddress='';sh.destinationName='';sh.recipientName=''}"
          text=once(text,old,new,'Kundenwechsel-Reset')

          # Den zugehörigen Handler über seinen eindeutigen Kern isolieren.
          anchor=text.find('core.applyCustomer(sh,customer,false);')
          if anchor<0 or text.find('core.applyCustomer(sh,customer,false);',anchor+1)>=0:
              raise SystemExit('Kunden-/Standort-Handler nicht eindeutig')
          start=text.rfind('function ',0,anchor)
          end=text.find('\nfunction ',anchor)
          if start<0 or end<0: raise SystemExit('Handler-Grenzen nicht gefunden')
          block=text[start:end]
          block=block.replace("l.id||l.locationId||l.siteId||l.code||l.name","l.id||l.locationId||l.selectedLocationId||l.siteId||l.destinationId||l.code||l.name")
          block=once(block,
              "sh.locationId=locationId;sh.selectedLocationId=locationId;sh.siteId=locationId;sh.location=JSON.parse(JSON.stringify(location));",
              "sh.locationId=locationId;sh.selectedLocationId=locationId;sh.siteId=locationId;sh.destinationId=locationId;sh.location=JSON.parse(JSON.stringify(location));",
              'Handler Standort-ID schreiben')
          block=once(block,
              "sh.recipientAddress=address||sh.recipientAddress;",
              "if(address){sh.recipientAddress=address;sh.deliveryAddress=address;sh.destinationAddress=address}",
              'Handler Adresse schreiben')
          text=text[:start]+block+text[end:]

          # B) Zentrale RC565 Standort-Normalisierung direkt reparieren.
          start=text.find('function locations(c){')
          end=text.find('function findLocation(c,v){',start)
          if start<0 or end<0: raise SystemExit('locations(c) nicht gefunden')
          block=text[start:end]
          block=once(block,
              "var id=q(l.id||l.locationId||l.siteId||l.code||l.number)||",
              "var id=q(l.id||l.locationId||l.selectedLocationId||l.siteId||l.destinationId||l.code||l.number)||",
              'locations Roh-ID')
          block=once(block,
              "Object.assign({},l,{id:id,locationId:id,siteId:id,name:name",
              "Object.assign({},l,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id,name:name",
              'locations Alias-Normalisierung')
          text=text[:start]+block+text[end:]
          text=once(text,
              "function findLocation(c,v){var x=n(v);return locations(c).find(function(l){return [l.id,l.locationId,l.siteId,l.name,l.address].some(function(y){return n(y)===x})})||null}",
              "function findLocation(c,v){var x=n(v);return locations(c).find(function(l){return [l.id,l.locationId,l.selectedLocationId,l.siteId,l.destinationId,l.name,l.address].some(function(y){return n(y)===x})})||null}",
              'findLocation Alias-Leser')

          # C) Aktiven locationSelect-Reset direkt reparieren.
          old="if(!l){sh.locationId='';sh.siteId='';sh.location='';sh.destinationName='';patchShipment();"
          new="if(!l){sh.locationId='';sh.selectedLocationId='';sh.siteId='';sh.destinationId='';sh.location='';sh.site='';sh.standort='';sh.locationName='';sh.destinationName='';sh.recipientName='';sh.recipientAddress='';sh.deliveryAddress='';sh.destinationAddress='';sh.locationData={};sh.siteData={};sh.addressConfirmed=false;sh.addressChecked=false;patchShipment();"
          text=once(text,old,new,'locationSelect Reset')

          # D) Index289-Liste als zweite Quelle auf dieselben ID-Aliase bringen.
          start=text.find('function locationList(c){var map={},out=[];')
          end=text.find('function savedLocationId(sh,list){',start)
          if start<0 or end<0: raise SystemExit('Index289 locationList nicht gefunden')
          block=text[start:end]
          block=once(block,
              "explicit=q(l.id||l.locationId||l.siteId||l.code||l.number)",
              "explicit=q(l.id||l.locationId||l.selectedLocationId||l.siteId||l.destinationId||l.code||l.number)",
              'Index289 Roh-ID')
          block=once(block,
              "Object.assign({},l,{id:id,locationId:id,siteId:id})",
              "Object.assign({},l,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id})",
              'Index289 Normalisierung')
          block=once(block,
              "out.push({id:id,locationId:id,siteId:id,name:q(c.locationName||c.siteName)||'Hauptadresse'",
              "out.push({id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id,name:q(c.locationName||c.siteName)||'Hauptadresse'",
              'Index289 Hauptadresse')
          text=text[:start]+block+text[end:]

          # E) Adressbestätigung darf destinationId nicht wieder auslassen.
          text=once(text,
              "if(identity.id){sh.locationId=identity.id;sh.selectedLocationId=identity.id;sh.siteId=identity.id}if(identity.data)",
              "if(identity.id){sh.locationId=identity.id;sh.selectedLocationId=identity.id;sh.siteId=identity.id;sh.destinationId=identity.id}if(identity.data)",
              'Adressbestätigung destinationId')

          p.write_text(text,encoding='utf-8')
          PY

      - name: GREEN – RC938 Quellpfade prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC938',cache:'938',loginReturn:'/TESTVERSION.html?v=938'" in text
          assert "RC938 vereinheitlicht die Standort-Quelllogik" in text

          required=[
            "delete sh.destinationId;delete sh.location;delete sh.site;delete sh.standort;",
            "sh.recipientAddress='';sh.deliveryAddress='';sh.destinationAddress='';sh.destinationName=''",
            "l.id||l.locationId||l.selectedLocationId||l.siteId||l.destinationId||l.code||l.number",
            "Object.assign({},l,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id,name:name",
            "function findLocation(c,v){var x=n(v);return locations(c).find(function(l){return [l.id,l.locationId,l.selectedLocationId,l.siteId,l.destinationId,l.name,l.address]",
            "sh.locationId=locationId;sh.selectedLocationId=locationId;sh.siteId=locationId;sh.destinationId=locationId;sh.location=JSON.parse(JSON.stringify(location));",
            "if(address){sh.recipientAddress=address;sh.deliveryAddress=address;sh.destinationAddress=address}",
            "if(!l){sh.locationId='';sh.selectedLocationId='';sh.siteId='';sh.destinationId='';sh.location='';sh.site='';sh.standort='';sh.locationName='';sh.destinationName='';sh.recipientName='';sh.recipientAddress='';sh.deliveryAddress='';sh.destinationAddress='';",
            "Object.assign({},l,{id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id})",
            "out.push({id:id,locationId:id,selectedLocationId:id,siteId:id,destinationId:id,name:q(c.locationName||c.siteName)||'Hauptadresse'",
            "if(identity.id){sh.locationId=identity.id;sh.selectedLocationId=identity.id;sh.siteId=identity.id;sh.destinationId=identity.id}if(identity.data)"
          ]
          for needle in required: assert needle in text, needle

          forbidden=[
            "if(!locationId&&customerChanged){delete sh.locationId;delete sh.selectedLocationId;delete sh.siteId;delete sh.location;",
            "var id=q(l.id||l.locationId||l.siteId||l.code||l.number)||",
            "function findLocation(c,v){var x=n(v);return locations(c).find(function(l){return [l.id,l.locationId,l.siteId,l.name,l.address]",
            "if(!l){sh.locationId='';sh.siteId='';sh.location='';sh.destinationName='';patchShipment();",
            "explicit=q(l.id||l.locationId||l.siteId||l.code||l.number)"
          ]
          for needle in forbidden: assert needle not in text, needle
          print('GREEN: RC938 Standort-Quelllogik konsistent.')
          PY

      - name: Diff und Integrität prüfen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          grep -m1 -oE "version:'RC[0-9]+'" TESTVERSION.html

      - name: RC938 nach main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          git commit -m "RC938 Standort-Quelllogik vereinheitlichen"
          git push origin HEAD:main

      - name: Temporären RC938-Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm .github/workflows/rc938-location-source-consistency.yml
          git commit -m "RC938 temporären Patch-Workflow entfernen"
          git push origin HEAD:main

      - name: TESTSERVICE-Deploy für RC938 auslösen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/exporthub-testservice-final-artifact-fix.yml/dispatches" \
            -d '{"ref":"main"}')"
          cat /tmp/dispatch.out || true
          [[ "$code" == "204" ]] || { echo "Dispatch fehlgeschlagen: HTTP $code"; exit 1; }
          echo "TESTSERVICE-Deploy RC938 ausgelöst."
