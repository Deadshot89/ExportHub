name: RC1003 Main Integration
on:
  workflow_dispatch:
  push:
    branches: [rc1003-main-integration]
    paths:
      - 'android-app/**'
      - 'test/rc1003-android-native-direct-open.test.mjs'
      - '.github/rc997/diagnostic-notifications-contract.test.mjs'
      - '.github/rc997/android-contract.test.mjs'
      - '.github/workflows/rc1003-main-integration.yml'
permissions:
  contents: read
concurrency:
  group: rc1003-main-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: RC1003 Direktzugriff Vertrag
        run: node --test test/rc1003-android-native-direct-open.test.mjs
      - name: RC1002 Website- und Produktionsbaseline
        run: node --test --test-name-pattern='Website, TESTSERVICE|Produktionsworkflow|Buildskript' test/rc1002-release-sync.test.mjs
      - name: RC997 Diagnose Regression ohne historische Versions-Pins
        shell: bash
        run: |
          node --test --test-name-pattern='Fehlerdiagnose besitzt|Website-App-Brücke|Tipp auf Diagnose-Benachrichtigung|veraltete MainActivity' .github/rc997/diagnostic-notifications-contract.test.mjs
          node --test --test-name-pattern='gemeinsame Drei-Umgebungen-Hülle|Benachrichtigungen und 09-12-15' .github/rc997/android-contract.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Android Debug Build
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: APK vorbereiten
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ExportHUB-RC1003-Android-debug.apk
          sha256sum out/ExportHUB-RC1003-Android-debug.apk > out/ExportHUB-RC1003-Android-debug.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ExportHUB-RC1003-Android-Integration
          path: android-app/out/*
          if-no-files-found: error
          retention-days: 30
