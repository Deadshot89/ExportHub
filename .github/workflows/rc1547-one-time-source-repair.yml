name: RC1547 one-time source repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/rc1305-loading-list-print.js'
      - '.github/workflows/rc1547-one-time-source-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/rc1548-loading-list-single-page-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Restore exact HTML quote escaping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/rc1305-loading-list-print.js')
          s = p.read_text()
          old = """'"':'&quot',"""
          new = """'"':'&quot;',"""
          if old not in s:
              raise SystemExit('RC1547 repair anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rc1305-loading-list-print.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(RC1547): restore exact HTML quote escaping"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
