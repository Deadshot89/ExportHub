name: RC1144 POD Backup Reconcile

on:
  workflow_run:
    workflows:
      - ExportHUB Production Release
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      reference:
        description: 'Optional: gezielt eine Sendungsreferenz prüfen/nachholen'
        required: false
        type: string
      environment:
        description: 'Umgebung für einen manuellen Nachweis'
        required: true
        default: production
        type: choice
        options:
          - production
          - testservice
          - both
      graphTargetDiagnostic:
        description: 'Nur lesende Graph-Zielprüfung (ohne POD-Änderungen)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: rc1144-pod-backup-reconcile
  cancel-in-progress: false

jobs:
  testservice:
    name: POD-Backup-Nachholung TESTSERVICE
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') && (github.event_name != 'workflow_dispatch' || inputs.environment == 'testservice' || inputs.environment == 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: RC1687 Microsoft-365 Graph-Ziel sicher diagnostizieren (testservice)
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 2 * * *') || (github.event_name == 'workflow_dispatch' && inputs.graphTargetDiagnostic == true) }}
        continue-on-error: true
        shell: bash
        env:
          BASE_URL: https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net
          TARGET_ENV: testservice
        run: |
          set -euo pipefail
          set +x
          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-pod-backup-reconcile" \
              | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(
            curl -sS -L --max-time 45 -o "$response_file" -w '%{http_code}' \
              -H "Content-Type: application/json" \
              -H "x-exporthub-github-oidc: $oidc_token" \
              -H "x-exporthub-environment: $TARGET_ENV" \
              -d "{\"environment\":\"$TARGET_ENV\",\"graphTargetDiagnostic\":true}" \
              "$BASE_URL/api/pod-backup-reconcile" || true
          )"
          node - "$http_code" "$response_file" "$TARGET_ENV" <<'NODE'
          const fs=require('fs');
          const [status,file,environment]=process.argv.slice(2);
          let data={};
          try {data=JSON.parse(fs.readFileSync(file,'utf8'))}catch(_){}
          const clean=x=>String(x||'').replace(/[^A-Za-z0-9_.-]/g,'').slice(0,70);
          const checks=(Array.isArray(data.checks)?data.checks:[]).slice(0,12).map(x=>({
            stage:clean(x.stage),status:clean(x.status),
            httpStatus:Math.max(0,Math.min(599,Number(x.httpStatus)||0)),
            providerCode:clean(x.providerCode)
          }));
          const summary={environment,httpsStatus:Math.max(0,Number(status)||0),
            ok:data.diagnosticOnly===true&&data.ok===true,
            code:clean(data.code),mode:clean(data.targetMode),
            configured:data.configured===true,missing:(Array.isArray(data.missing)?data.missing:[]).map(clean).slice(0,8),
            checks};
          console.log('RC1687 Graph target diagnostic',JSON.stringify(summary));
          if(!summary.ok)console.log('::warning title=Graph POD target diagnostic::Read-only Graph target verification is pending; see redacted stages in this job.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '\n### RC1687 '+environment+' Graph target (read-only)\n\n' +
            'Result: '+(summary.ok?'TARGET READABLE':'NOT VERIFIED')+'; code '+summary.code+'\n\n' +
            checks.map(c=>'- '+c.stage+': '+c.status+' / HTTP '+c.httpStatus+' / '+c.providerCode).join('\n')+'\n');
          NODE
      - name: Offene TESTSERVICE POD-Backups nachholen
        # RC1688: manual diagnostic-only dispatch must never enter mutating reconciliation.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.graphTargetDiagnostic != true }}
        shell: bash
        env:
          BASE_URL: https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net
          TARGET_ENV: testservice
          TARGET_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.reference || '' }}
        run: |
          set -euo pipefail
          set +x

          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-pod-backup-reconcile" \
              | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"

          continuation_token=''
          relink_skip_count=0
          optional_drive_pending_batches=0
          blocked_ambiguous_relink_batches=0
          for batch in $(seq 1 200); do
            previous_continuation_token="$continuation_token"
            previous_relink_skip_count="$relink_skip_count"
            payload="$(CONTINUATION_TOKEN="$continuation_token" RELINK_SKIP_COUNT="$relink_skip_count" node -e "const reference=String(process.env.TARGET_REFERENCE||'').trim().toUpperCase();process.stdout.write(JSON.stringify({environment:process.env.TARGET_ENV,limit:25,scanPageSize:10,reference,drainAll:!reference,continuationToken:String(process.env.CONTINUATION_TOKEN||''),relinkSkipCount:Math.max(0,Math.min(10,Math.floor(Number(process.env.RELINK_SKIP_COUNT)||0)))}))")"
            response_file="$(mktemp)"
            http_code="$(
              curl -sS -L -o "$response_file" -w '%{http_code}' \
                -H "Content-Type: application/json" \
                -H "x-exporthub-github-oidc: $oidc_token" \
                -H "x-exporthub-environment: $TARGET_ENV" \
                -d "$payload" \
                "$BASE_URL/api/pod-backup-reconcile" || true
            )"
            result="$(cat "$response_file")"
            rm -f "$response_file"

            verdict="$(printf '%s\n' "$result" | node -e "
              let s='';const status=Number(process.argv[1]||0);process.stdin.on('data',c=>s+=c).on('end',()=>{
                let v={};try{v=JSON.parse(s||'{}')}catch(_){}
                const pendingCodes=Array.from(new Set((Array.isArray(v.pending)?v.pending:[]).map(x=>String(x&&x.error||'').split(':',1)[0].trim()).filter(Boolean))).slice(0,10);
                const drivePendingCodes=Array.from(new Set((Array.isArray(v.drivePending)?v.drivePending:[]).map(x=>String(x&&x.error||'').split(':',1)[0].trim()).filter(Boolean))).slice(0,10);
                const driveProviderCodes=Array.from(new Set((Array.isArray(v.drivePending)?v.drivePending:[]).map(x=>String(x&&x.providerCode||'').replace(/[^A-Za-z0-9_.-]/g,'').slice(0,80)).filter(Boolean))).slice(0,10);
                const errorCodes=Array.from(new Set((Array.isArray(v.errors)?v.errors:[]).map(x=>String(x&&x.code||'').trim()).filter(Boolean))).slice(0,10);
                const safe={batch:Number(process.argv[2]||0),httpStatus:status,code:v.code,message:v.message,environment:v.environment,reference:v.reference,backupMode:v.backupMode,drainAll:v.drainAll,graphConfigured:v.graphConfigured,missing:Array.isArray(v.missing)?v.missing:[],targetFolder:v.targetFolder,scanned:v.scanned,scanPageSize:v.scanPageSize,scanComplete:v.scanComplete,eligible:v.eligible,selected:v.selected,skippedRecent:v.skippedRecent,driveBackfillEligible:v.driveBackfillEligible,driveBackfillSelected:v.driveBackfillSelected,driveBackfillSkippedRecent:v.driveBackfillSkippedRecent,teamRelinkBlockedCount:v.teamRelinkBlockedCount,teamRelinkBlockedCodes:v.teamRelinkBlockedCodes,needsManualReview:v.needsManualReview,savedCount:v.savedCount,alreadySavedCount:v.alreadySavedCount,pendingCount:v.pendingCount,driveSavedCount:v.driveSavedCount,drivePendingCount:v.drivePendingCount,errorCount:v.errorCount,verifiedCount:v.verifiedCount,repairedStateCount:v.repairedStateCount,integrityChecks:v.integrityChecks,remoteWorkBudget:v.remoteWorkBudget,pageWorkDeferred:v.pageWorkDeferred,requiredWorkDeferred:v.requiredWorkDeferred,optionalDriveWorkDeferred:v.optionalDriveWorkDeferred,pendingCodes,drivePendingCodes,driveProviderCodes,errorCodes,target:v.target&&{reference:v.target.reference,status:v.target.status,matchedCount:v.target.matchedCount,podReadyCount:v.target.podReadyCount,alreadySavedCount:v.target.alreadySavedCount,savedNowCount:v.target.savedNowCount,pendingCount:v.target.pendingCount,errorCount:v.target.errorCount}};
                console.error('TESTSERVICE POD reconcile',JSON.stringify(safe));
                if(status<200||status>=300||!v.ok||Number(v.errorCount||0)>0||Number(v.pendingCount||0)>0)process.exit(3);
                if(v.reference){if(!v.target||!['already-saved','saved-now'].includes(v.target.status))process.exit(5);process.stdout.write('done');return}
                const eligible=Math.max(0,Number(v.eligible||0)),selected=Math.max(0,Number(v.selected||0)),skipped=Math.max(0,Number(v.skippedRecent||0));
                const requiredDone=eligible===0&&selected===0&&skipped===0&&!v.nextContinuationToken&&!v.requiredWorkDeferred;
                if(requiredDone){process.stdout.write('done');return}
                if(selected<=0&&!v.nextContinuationToken&&!v.requiredWorkDeferred)process.exit(7);
                process.stdout.write('again');
              })" "$http_code" "$batch")"
            continuation_token="$(printf '%s\n' "$result" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{let v={};try{v=JSON.parse(s||'{}')}catch(_){};process.stdout.write(String(v.nextContinuationToken||''))})")"
            relink_skip_count="$(printf '%s\n' "$result" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{let v={};try{v=JSON.parse(s||'{}')}catch(_){};process.stdout.write(String(Math.max(0,Math.min(10,Math.floor(Number(v.nextRelinkSkipCount)||0)))))})")"
            if [ "$continuation_token" != "$previous_continuation_token" ]; then
              relink_skip_count=0
            fi
            progress_count="$(printf '%s\n' "$result" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{let v={};try{v=JSON.parse(s||'{}')}catch(_){};const n=x=>Math.max(0,Number(x||0));process.stdout.write(String(n(v.integrityChecks)+n(v.repairedStateCount)+n(v.savedCount)+n(v.teamRelinkedCount)+n(v.teamRelinkSkippedCount)))})")"
            drive_pending_count="$(printf '%s\n' "$result" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{let v={};try{v=JSON.parse(s||'{}')}catch(_){};const count=Number(v.drivePendingCount||0);process.stdout.write(String(Number.isFinite(count)&&count>0?Math.floor(count):0))})")"
            if [ "$drive_pending_count" -gt 0 ]; then
              optional_drive_pending_batches=$((optional_drive_pending_batches + 1))
            fi
            blocked_relink_count="$(printf '%s\n' "$result" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{let v={};try{v=JSON.parse(s||'{}')}catch(_){};const n=Number(v.teamRelinkBlockedCount||0);process.stdout.write(String(Number.isFinite(n)&&n>0?Math.floor(n):0))})")"
            if [ "$blocked_relink_count" -gt 0 ]; then
              blocked_ambiguous_relink_batches=$((blocked_ambiguous_relink_batches + 1))
            fi

            if [ "$verdict" = "done" ]; then
              if [ "$optional_drive_pending_batches" -gt 0 ]; then
                echo "::warning title=POD Microsoft-365 optional archive::Optional Graph copies remain pending in $optional_drive_pending_batches scanned batches; required Azure archive drain succeeded. See issue #999."
                {
                  echo '### RC1658 – POD-Backup (Azure / Microsoft 365)'
                  echo '- Erforderlicher Azure-Archiv-Backlog: erfolgreich abgearbeitet.'
                  echo "- Optionale Microsoft-365-Kopie in $optional_drive_pending_batches Batch-Antworten noch offen."
                  echo '- Fehlercodes ohne Sendungsdaten: siehe drivePendingCodes / driveProviderCodes im Joblog, Issue #999.'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              if [ "$blocked_ambiguous_relink_batches" -gt 0 ]; then
                echo "::warning title=TESTSERVICE POD team link manual review::Ambiguous team-state shipment; $blocked_ambiguous_relink_batches batch(es) require manual review. No link was rewritten."
                {
                  echo '### RC1689 – TESTSERVICE POD team links: manual review required'
                  echo "- $blocked_ambiguous_relink_batches batch(es) contained TEAM_SHIPMENT_AMBIGUOUS."
                  echo '- No ambiguous shipment was selected, linked or marked as repaired.'
                  echo '- Other verified Azure-POD backups may finish independently; blocked team links are NOT resolved.'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
            if [ -n "$continuation_token" ] && [ "$continuation_token" = "$previous_continuation_token" ] && [ "$progress_count" -le 0 ] && [ "$relink_skip_count" -le "$previous_relink_skip_count" ]; then
              echo 'TESTSERVICE POD reconcile: Continuation-Token bewegt sich ohne Fortschritt nicht weiter; unbekannte Zuordnungen bleiben manuell zu prüfen.' >&2
              exit 9
            fi
          done

          echo 'TESTSERVICE POD reconcile: Backlog nach 200 Batches noch nicht vollständig geleert.' >&2
          exit 8

  production:
    name: POD-Backup-Nachholung PRODUCTION
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') && (github.event_name != 'workflow_dispatch' || inputs.environment == 'production' || inputs.environment == 'both') }}
