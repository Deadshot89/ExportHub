name: RC890 Personal Workspace Stage 6 v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc890-personal-workspace-v2
  cancel-in-progress: false

jobs:
  patch-testservice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Internal main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard RC889 baseline
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f TESTVERSION.html ]; then
            echo "::error title=TESTVERSION fehlt::TESTVERSION.html wurde im Repository nicht gefunden."
            exit 1
          fi
          VERSION="$(grep -o "version:'RC[0-9]*',cache:'[0-9]*',loginReturn:'/TESTVERSION.html?v=[0-9]*'" TESTVERSION.html | head -n1 | sed -E "s/version:'(RC[0-9]+)'.*/\1/")"
          echo "Detected TESTVERSION baseline: ${VERSION:-unbekannt}"
          if [ "$VERSION" != "RC889" ]; then
            echo "::error title=RC889 Voraussetzung fehlt::Erkannt wurde ${VERSION:-keine Version}. Bitte zuerst 'RC889 Professional UX Stage 5 v2' erfolgreich ausführen. RC890 verändert in diesem Zustand nichts."
            exit 1
          fi
          required_marker() {
            local marker="$1"
            local label="$2"
            if ! grep -Fq "$marker" TESTVERSION.html; then
              echo "::error title=RC889 unvollständig::$label fehlt. RC890 wird aus Sicherheitsgründen nicht installiert."
              exit 1
            fi
          }
          required_marker "Produktivitätsstufe 5: Intelligente Aktionsleiste, Sperrgründe und Arbeitszustände" "RC889 Release-Metadaten"
          required_marker 'id="exporthub-rc885-productivity"' "RC885 Produktivitätsmodul"
          required_marker 'ExportHUBProductivity885=Object.freeze' "RC885 Diagnose-API"
          required_marker 'id="exporthub-rc886-shipment-progress"' "RC886 Fortschrittsmodul"
          required_marker 'ExportHUBShipmentProgress886=Object.freeze' "RC886 Diagnose-API"
          required_marker 'id="exporthub-rc887-quickwork"' "RC887 Schnellarbeitsmodul"
          required_marker 'ExportHUBQuickWork887=Object.freeze' "RC887 Diagnose-API"
          required_marker 'id="exporthub-rc888-professional"' "RC888 Professional-Modul"
          required_marker 'ExportHUBProfessional888=Object.freeze' "RC888 Diagnose-API"
          required_marker 'id="exporthub-rc889-actionbar"' "RC889 Aktionsleisten-Modul"
          required_marker 'ExportHUBUX889=Object.freeze' "RC889 Diagnose-API"
          if grep -Fq 'id="exporthub-rc890-workspace"' TESTVERSION.html; then
            echo "::error title=RC890 bereits vorhanden::Der RC890-Modulmarker ist bereits vorhanden. Workflow beendet sicher, statt doppelt zu installieren."
            exit 1
          fi

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC889 backup tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-rc889-before-rc890-personal-workspace"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Backup tag already exists: $TAG"
          else
            git tag -a "$TAG" -m "Last known RC889 baseline before RC890 personal workspace"
            git push origin "$TAG"
          fi

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'TESTVERSION.html';
          let text = fs.readFileSync(path, 'utf8');
          const original = text;

          function replaceOnce(oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0) throw new Error(label + ': Ausgangsblock nicht gefunden');
            if (text.indexOf(oldText, first + oldText.length) >= 0) throw new Error(label + ': Ausgangsblock mehrfach gefunden');
            text = text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          replaceOnce(
            "var BUILD=Object.freeze({version:'RC889',cache:'889',loginReturn:'/TESTVERSION.html?v=889'});",
            "var BUILD=Object.freeze({version:'RC890',cache:'890',loginReturn:'/TESTVERSION.html?v=890'});",
            'Canonical BUILD'
          );

          replaceOnce(
            " version:'RC889',\n date:'30.08.2026',\n title:'Produktivitätsstufe 5: Intelligente Aktionsleiste, Sperrgründe und Arbeitszustände',",
            " version:'RC890',\n date:'30.08.2026',\n title:'Produktivitätsstufe 6: Persönlicher Arbeitsplatz, Warncenter und Übersicht-Schnellaktionen',",
            'Release metadata'
          );

          const module = Buffer.from('', 'base64').toString('utf8');
          if (!module.includes('id="exporthub-rc890-workspace"')) throw new Error('RC890 Modulmarker fehlt im eingebetteten Modul');
          const bodyClose = text.lastIndexOf('</body>');
          if (bodyClose < 0) throw new Error('</body> nicht gefunden');
          text = text.slice(0, bodyClose) + '\n' + module + '\n' + text.slice(bodyClose);

          if (text === original) throw new Error('RC890 hat keine Änderung erzeugt');
          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: RC890 static safety tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('TESTVERSION.html', 'utf8');
          function required(re, msg) { if (!re.test(text)) throw new Error(msg); }
          function count(s) { return text.split(s).length - 1; }

          required(/version:'RC890',cache:'890',loginReturn:'\/TESTVERSION\.html\?v=890'/, 'RC890 BUILD fehlt');
          if (count('id="exporthub-rc890-workspace"') !== 1) throw new Error('RC890 Scriptmarker nicht genau einmal vorhanden');
          if (count('id="exporthub-rc890-workspace-style"') !== 1) throw new Error('RC890 Stylemarker nicht genau einmal vorhanden');
          required(/ExportHUBWorkspace890=Object\.freeze/, 'RC890 Diagnose-API fehlt');
          required(/Mein Arbeitsplatz/, 'Persönlicher Arbeitsplatz fehlt');
          required(/Warncenter/, 'Warncenter fehlt');
          required(/Schnellaktionen & kritische Sendungen/, 'Übersicht-Schnellaktionen fehlen');
          required(/Zuletzt bearbeitet/, 'Intelligente letzte Sendungen fehlen');
          required(/PREF_KEY='exporthub:rc890:workspace:v1'/, 'RC890 lokale Arbeitsplatz-Präferenz fehlt');
          required(/RECENT_KEY='exporthub:rc885:recent:v1'/, 'RC890 nutzt RC885-Verlauf nicht');
          required(/FAV_VIEW_KEY='exporthub:rc887:favourite-views:v1'/, 'RC890 nutzt RC887-Favoriten nicht');

          const scriptStart = text.indexOf('<script id="exporthub-rc890-workspace">');
          const bodyStart = text.indexOf('\n', scriptStart) + 1;
          const scriptEnd = text.indexOf('</script>', bodyStart);
          if (scriptStart < 0 || bodyStart <= 0 || scriptEnd < 0) throw new Error('RC890 Script kann nicht extrahiert werden');
          const js = text.slice(bodyStart, scriptEnd);
          new Function(js);

          if (/fetch\s*\(|XMLHttpRequest|sendBeacon\s*\(|WebSocket\s*\(/.test(js)) throw new Error('RC890 enthält unerlaubten Netzwerkweg');
          if (/queueSave\s*\(|saveShipment\s*\(|saveTeam|azureSave|teamSave/.test(js)) throw new Error('RC890 enthält unerlaubten Speicherweg');
          if (/state\(\)\.shipments\s*=|\.shipments\.push\s*\(/.test(js)) throw new Error('RC890 schreibt direkt in gespeicherte Sendungen');
          if (/\.done\s*=|\.completed\s*=|taskDone\s*=/.test(js)) throw new Error('RC890 verändert Aufgabenstatus direkt');
          if (!/ExportHUBShipmentView/.test(js)) throw new Error('RC890 nutzt nicht den bestehenden Sendungs-Öffnen-Pfad');
          if (!/localStorage/.test(js)) throw new Error('RC890 Arbeitsplatz-Präferenz wird nicht lokal gespeichert');
          console.log('RC890 static safety tests: PASS');
          NODE

      - name: Verify production scope untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json; then
            echo "ERROR: Production/API/public files changed."
            git diff -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json
            exit 1
          fi
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "TESTVERSION.html"

      - name: Write RC890 test report
        shell: bash
        run: |
          cat > RC890_PRUEFBERICHT.txt <<'EOF'
          TESTBERICHT RC890 – PRODUKTIVITÄTSSTUFE 6

          Scope:
          - Ausschließlich TESTSERVICE / TESTVERSION.html
          - Keine Produktionsdatei und keine API geändert
          - RC884 bis RC889 bleiben erhalten

          Neue Funktionen:
          1. Persönlicher Arbeitsplatz
             - Sichtbar auf dem Dashboard
             - Arbeitsfokus umschaltbar: Alles / Heute / Dokumente / Abholung
             - Auswahl wird nur lokal auf dem Gerät gespeichert
             - Zeigt offene Punkte, zuletzt verwendete Sendungen und bestehende RC887-Bereichsfavoriten

          2. Zentrales Warncenter
             - Warncenter-Schaltfläche in der oberen Leiste
             - Badge zeigt die Anzahl offener Arbeits-/Warnpunkte
             - Fasst Überfällig, Heute, ABD offen, POD fehlt, Abholung und Wartet auf andere zusammen
             - Direkte Sendungsöffnung ohne Status- oder Datenänderung

          3. Sendungsübersicht Schnellaktionen
             - Sichtbar in der Sendungsübersicht
             - KPI-Zusammenfassung für wichtige Fälle
             - Kritische Sendungen direkt öffnen
             - Neue Sendung und globale Suche direkt erreichbar

          4. Intelligente zuletzt bearbeitete Sendungen
             - Nutzt ausschließlich den vorhandenen RC885-Verlauf
             - Keine zweite Sendungshistorie und kein Cloud-Speicher
             - Letzte Sendungen lassen sich direkt wieder öffnen

          Sicherheit:
          - Keine neue API
          - Keine zusätzlichen Netzwerkaufrufe
          - Keine automatische Speicherung
          - Keine automatische Statusänderung
          - Keine automatische Aufgabenerledigung
          - Persönliche Arbeitsplatzwahl bleibt lokales UI-Setting

          Wo sichtbar:
          A. Testservice neu laden und Version RC890 prüfen.
          B. Dashboard: unter den bisherigen Produktivitätskarten erscheint „Mein Arbeitsplatz“.
          C. Oben in der Kopfleiste erscheint „Warncenter“ mit Zähler, wenn offene Punkte vorhanden sind.
          D. Sendungsübersicht öffnen: „Schnellaktionen & kritische Sendungen“ erscheint oberhalb der Liste.
          E. Im Dashboard den Arbeitsfokus Alles / Heute / Dokumente / Abholung wechseln und Seite neu laden: Auswahl bleibt auf diesem Gerät erhalten.
          F. Eine Sendung über Warncenter, Arbeitsplatz oder Übersicht öffnen und prüfen, dass die bestehende Sendungsansicht verwendet wird.
          G. Strg+K aus RC885 weiterhin prüfen.

          Regression:
          - RC884 Navigation/Suche/KundenAvis-Trennung
          - RC885 globale Suche/Meine Arbeit heute
          - RC886 Fortschritt/Dokumenten-Ampel
          - RC887 Favoriten/Vorlagen
          - RC888 Übergabe/Timeline/Performance
          - RC889 Aktionsleiste/Sperrgründe/Arbeitszustände
          - Produktion unverändert
          EOF

      - name: Commit RC890 testservice
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html RC890_PRUEFBERICHT.txt
          git commit -m "RC890: add personal workspace warning center and overview quick actions"
          git push origin main
