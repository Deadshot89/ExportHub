name: RC1553 Apply POD Layout Fix

on:
  push:
    branches: [fix/rc1553-pod-signed-loading-list]
    paths:
      - '.github/rc1553/apply-pod-layout.mjs'

permissions:
  contents: write

jobs:
  apply_and_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rc1553-pod-signed-loading-list
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Apply RC1553 focused runtime patch
        run: node .github/rc1553/apply-pod-layout.mjs
      - name: Syntax check
        run: |
          node --check api/shared/pod-archive.js
          node --check api/pickup-pod/index.js
      - name: Install API runtime dependencies
        working-directory: api
        run: npm install --ignore-scripts
      - name: RC1553 focused POD regression
        run: node --test test/rc1553-pod-signed-loading-list.test.mjs test/pod-customer-layout-regression.test.mjs test/pod-render-pdf.test.mjs
      - name: Commit verified runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ExportHUB RC1553'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add api/shared/pod-archive.js api/pickup-pod/index.js
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit.'
            exit 0
          fi
          git commit -m 'fix(RC1553): make POD the signed loading list'
          git push origin HEAD:fix/rc1553-pod-signed-loading-list
