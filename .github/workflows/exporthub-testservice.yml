name: ExportHUB TESTSERVICE Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'TESTVERSION.html'
      - 'staticwebapp.testservice.config.json'
      - '.github/workflows/exporthub-testservice.yml'

permissions:
  contents: read

concurrency:
  group: exporthub-testservice-deploy
  cancel-in-progress: true

jobs:
  deploy_testservice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy TESTSERVICE preview environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Validate TESTSERVICE files
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html
          test -f staticwebapp.testservice.config.json
          test -f api/exporthub-state/index.js
          test -f api/exporthub-state/function.json
          test -f api/shared/merge.js
          grep -Fq "version:'RC660'" TESTVERSION.html
          node --check api/exporthub-state/index.js
          node --check api/shared/merge.js
          node -e "JSON.parse(require('fs').readFileSync('staticwebapp.testservice.config.json','utf8'));"

      - name: Prepare isolated TESTSERVICE payload
        shell: bash
        run: |
          set -euo pipefail
          cp TESTVERSION.html index.html
          cp staticwebapp.testservice.config.json staticwebapp.config.json
          cat > testservice-environment.json <<'EOF'
          {
            "environment": "testservice",
            "isolated": true,
            "data": "TEST-DATEN",
            "productionWritesAllowed": false,
            "expectedVersion": "RC660"
          }
          EOF

      - name: Deploy TESTSERVICE named environment
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: ""
          deployment_environment: testservice

      - name: Verify live TESTSERVICE version
        shell: bash
        env:
          TESTSERVICE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          set -euo pipefail
          if [[ -z "${TESTSERVICE_URL:-}" ]]; then
            echo "Azure hat keine Testservice-URL zurückgegeben."
            exit 1
          fi

          echo "TESTSERVICE URL: $TESTSERVICE_URL"
          tmp_direct="$(mktemp)"
          tmp_route="$(mktemp)"
          trap 'rm -f "$tmp_direct" "$tmp_route"' EXIT

          ok=0
          for attempt in {1..18}; do
            direct_url="$TESTSERVICE_URL/TESTVERSION.html?verify=$GITHUB_SHA-$attempt"
            route_url="$TESTSERVICE_URL/test?verify=$GITHUB_SHA-$attempt"

            direct_code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o "$tmp_direct" -w '%{http_code}' "$direct_url" || true)"
            route_code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o "$tmp_route" -w '%{http_code}' "$route_url" || true)"

            direct_ok=0
            route_ok=0
            if [[ "$direct_code" == "200" ]] && grep -Fq "version:'RC660'" "$tmp_direct"; then
              direct_ok=1
            fi
            if [[ "$route_code" == "200" ]] && grep -Fq "version:'RC660'" "$tmp_route"; then
              route_ok=1
            fi

            if [[ "$direct_ok" == "1" && "$route_ok" == "1" ]]; then
              echo "RC660 ist im TESTSERVICE live. Direktdatei und /test liefern RC660."
              ok=1
              break
            fi

            detected_direct="$(grep -m1 -oE "version:'RC[0-9]+'" "$tmp_direct" || true)"
            detected_route="$(grep -m1 -oE "version:'RC[0-9]+'" "$tmp_route" || true)"
            echo "Live-Check $attempt/18: direkt HTTP $direct_code ${detected_direct:-keine RC}; /test HTTP $route_code ${detected_route:-keine RC}."
            sleep 5
          done

          if [[ "$ok" != "1" ]]; then
            echo "TESTSERVICE-Verifikation fehlgeschlagen: RC660 wurde nicht über beide TESTSERVICE-Routen ausgeliefert."
            exit 1
          fi

      - name: Publish TESTSERVICE address
        shell: bash
        env:
          TESTSERVICE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          {
            echo "## ExportHUB TESTSERVICE RC660"
            echo
            echo "**Diese Adresse zum Testen verwenden:**"
            echo
            echo "$TESTSERVICE_URL/test?v=660"
            echo
            echo "Direktprüfung: $TESTSERVICE_URL/TESTVERSION.html?v=660"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ÖFFNEN: $TESTSERVICE_URL/test?v=660"
          echo "DIREKT: $TESTSERVICE_URL/TESTVERSION.html?v=660"
