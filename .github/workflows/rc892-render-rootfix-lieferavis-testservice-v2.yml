name: RC892 Render Root Fix and Lieferavis TESTSERVICE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc892-render-rootfix
  cancel-in-progress: false

jobs:
  repair-testservice:
    name: RC892 render rootfix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout RC891 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard RC891 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html
          test -f customer-avis.html
          grep -Fq "var BUILD=Object.freeze({version:'RC891',cache:'891',loginReturn:'/TESTVERSION.html?v=891'});" TESTVERSION.html
          grep -Fq "/* exporthub-rc888-shipment-create-professional */" TESTVERSION.html
          grep -Fq "function avisHost(view)" TESTVERSION.html
          grep -Fq "__rc887AvisAllowed" TESTVERSION.html

      - name: RED reproduce render root causes in source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          src=Path("TESTVERSION.html").read_text(encoding="utf-8")

          problems=[]

          if "document.body.getAttribute('data-exporthub-view')" in src or              "document.body.getAttribute('data-current-view')" in src:
              problems.append("currentView reads document.body without a null guard")

          marker="/* exporthub-rc888-shipment-create-professional */"
          start=src.find(marker)
          if start<0:
              raise SystemExit("RC888 marker missing")
          next_marker=src.find("/* exporthub-",start+len(marker))
          avis=src.find("function avisHost(view)",start)
          ends=[x for x in (next_marker,avis) if x>=0]
          end=min(ends) if ends else -1
          mod=src[start:end]

          if "new MutationObserver(schedule)" in mod:
              problems.append("RC888 observes its own DOM changes")
          if "setInterval(schedule,2500)" in mod:
              problems.append("RC888 forces a refresh every 2.5 seconds")

          if len(problems)<3:
              raise SystemExit("Expected all 3 RC891 root-cause patterns; found: "+repr(problems))

          print("RED reproduced:")
          for item in problems:
              print(" - "+item)
          PY

      - name: Snapshot source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("TESTVERSION.html").read_text(encoding="utf-8")
          for k,v in {
            "script_open":src.lower().count("<script"),
            "script_close":src.lower().count("</script>"),
            "style_open":src.lower().count("<style"),
            "style_close":src.lower().count("</style>")
          }.items():
            Path("/tmp/rc892_"+k).write_text(str(v),encoding="utf-8")
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC891 backup
        shell: bash
        run: |
          set -euo pipefail

          TAG="backup-before-rc892-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Backup-Tag existiert bereits und wird wiederverwendet: $TAG"
            exit 0
          fi

          git tag -a "$TAG" -m "Backup before RC892 render root-cause repair"
          git push origin "refs/tags/$TAG"

          echo "Backup-Tag erstellt: $TAG"

