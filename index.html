<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExportHUB</title><style>html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eaf4fb;color:#0b2b5e}body{min-height:100vh;display:grid;place-items:center}.box{width:min(620px,calc(100% - 36px));background:#fff;border:1px solid #d9e6f1;border-radius:28px;box-shadow:0 24px 70px rgba(15,44,80,.16);padding:34px;text-align:center}.mark{width:68px;height:68px;border-radius:22px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#fff;font-weight:1000;font-size:25px}.bar{height:12px;border-radius:999px;background:#e7eef5;overflow:hidden;margin:24px 0 10px}.fill{height:100%;width:10%;background:linear-gradient(90deg,#2563eb,#13b9ea);transition:width .2s}.err{display:none;margin-top:16px;background:#fee2e2;color:#991b1b;border-radius:12px;padding:12px}</style></head><body><div class="box"><div class="mark">EH</div><h1>ExportHUB wird geladen</h1><p id="msg">Freigegebene Produktionsversion wird ermittelt …</p><div class="bar"><div id="fill" class="fill"></div></div><strong id="pct">10 %</strong><div id="err" class="err"></div></div><script>(function(){'use strict';var API='/api/exporthub-release',FALLBACK='/fallback/RC508.html',done=false;try{var u=new URL(location.href);if(u.searchParams.get('portal')==='test'||/\/test(?:\/|$)/i.test(u.pathname)){location.replace('/test/');return}sessionStorage.removeItem('exporthub_test_portal_requested')}catch(_){}function p(n,t){document.getElementById('fill').style.width=n+'%';document.getElementById('pct').textContent=n+' %';if(t)document.getElementById('msg').textContent=t}function marker(v){return '<script>window.__EXPORTHUB_RELEASE_STREAMED__=true;window.__EXPORTHUB_RELEASE_CHANNEL__="production";window.__EXPORTHUB_RELEASE_VERSION__='+JSON.stringify(v)+';<\\/script>'}function sanitize(h){h=String(h||'');h=h.replace(new RegExp('<script[^>]+id=[\"\']rc503-release-bootstrap[\"\'][^>]*>[\\s\\S]*?<\/script>','i'),'');return h}function patchPortal(h){return h.replace(/async function enterTest\(force\)\{[\s\S]*?\nfunction staticTestFallback/,"async function enterTest(force){try{sessionStorage.setItem('exporthub_test_portal_requested','1')}catch(_){}location.href='/test/';return true}\\nfunction staticTestFallback")}function guard(){return '<script>(function(){function k(){var c=document.getElementById("content");if(c&&/Lohnt sich ExportHUB\?/i.test(c.textContent||"")){try{var s=window.__EXPORTHUB_GET_STATE__&&window.__EXPORTHUB_GET_STATE__();if(s)s.view="dashboard"}catch(_){}try{if(window.ExportHUBRC325&&window.ExportHUBRC325.route)window.ExportHUBRC325.route("dashboard","legacy-start-removed");else if(typeof window.setView==="function")window.setView("dashboard")}catch(_){}}window.addEventListener("exporthub:ready",k);window.addEventListener("exporthub:rendered",k);setTimeout(k,200);setTimeout(k,900)})();<\\/script>'}function inject(h,v){if(done)return;h=patchPortal(sanitize(h));if(!/<html[\s>]/i.test(h))throw new Error('Ungültige ExportHUB-Version');done=true;p(100,'Produktion '+v+' wird gestartet …');h=h.replace(/<head(\s[^>]*)?>/i,function(m,a){return '<head'+(a||'')+'>'+marker(v)});h=h.replace(/<\/body>/i,guard()+'</body>');setTimeout(function(){document.open('text/html','replace');document.write(h);document.close()},40)}async function tx(u,o){var r=await fetch(u,Object.assign({credentials:'same-origin',cache:'no-store'},o||{}));if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}async function fallback(){p(70,'Freigegebene Notfallversion wird geladen …');inject(await tx(FALLBACK+'?_='+Date.now(),{headers:{Accept:'text/html'}}),'RC508')}async function boot(){try{p(30,'Produktionsstatus wird geprüft …');var m=JSON.parse(await tx(API+'?action=active&channel=production&_='+Date.now(),{headers:{Accept:'application/json'}}));var v=String(m&&m.version||'').trim().toUpperCase();if(!v)return fallback();p(55,'Produktion '+v+' wird geladen …');var h=await tx(API+'?action=html&channel=production&_='+Date.now(),{headers:{Accept:'text/html'}});p(85,'Oberfläche wird vorbereitet …');inject(h,v)}catch(e){try{await fallback()}catch(x){var er=document.getElementById('err');er.style.display='block';er.textContent='ExportHUB konnte nicht geladen werden: '+x.message;p(100,'Start fehlgeschlagen')}}}boot()})();</script></body></html>
