name: RC892 UI Cleanup Recovery v4

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: exporthub-rc892-ui-cleanup-v4
  cancel-in-progress: false

jobs:
  patch-testservice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Internal main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard RC891 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html || { echo "::error title=TESTVERSION fehlt::TESTVERSION.html wurde nicht gefunden."; exit 1; }
          VERSION="$(grep -o "version:'RC[0-9]*',cache:'[0-9]*',loginReturn:'/TESTVERSION.html?v=[0-9]*'" TESTVERSION.html | head -n1 | sed -E "s/version:'(RC[0-9]+)'.*/\1/")"
          echo "Detected TESTVERSION baseline: ${VERSION:-unbekannt}"
          if [ "$VERSION" != "RC891" ]; then
            echo "::error title=RC891 Voraussetzung fehlt::Erkannt wurde ${VERSION:-keine Version}. Bitte RC891 zuerst vollständig installieren und deployen."
            exit 1
          fi
          for marker in             'id="exporthub-rc885-productivity"'             'id="exporthub-rc886-shipment-progress"'             'id="exporthub-rc887-quickwork"'             'id="exporthub-rc888-professional"'             'id="exporthub-rc889-actionbar"'             'id="exporthub-rc890-workspace"'             'id="exporthub-rc891-overview"'; do
            grep -Fq "$marker" TESTVERSION.html || { echo "::error title=Baseline unvollständig::$marker fehlt."; exit 1; }
          done
          if grep -Fq 'id="exporthub-rc892-professional-cleanup"' TESTVERSION.html; then
            echo "::error title=RC892 bereits vorhanden::RC892 ist bereits installiert."
            exit 1
          fi

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC891 backup tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-rc891-before-rc892-ui-cleanup"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Backup tag already exists: $TAG"
          else
            git tag -a "$TAG" -m "Last known RC891 baseline before RC892 UI cleanup"
            git push origin "$TAG"
          fi

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'TESTVERSION.html';
          let text = fs.readFileSync(path, 'utf8');
          const original = text;

          function replaceOnce(oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0) throw new Error(label + ': Ausgangsblock nicht gefunden');
            if (text.indexOf(oldText, first + oldText.length) >= 0) throw new Error(label + ': Ausgangsblock mehrfach gefunden');
            text = text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          function findFunctionRange(source, name, fromIndex) {
            const marker = 'function ' + name + '(';
            const start = source.indexOf(marker, fromIndex || 0);
            if (start < 0) throw new Error(name + ': Funktion nicht gefunden');
            const brace = source.indexOf('{', start);
            if (brace < 0) throw new Error(name + ': öffnende Klammer fehlt');
            let depth = 0, quote = '', escape = false, lineComment = false, blockComment = false;
            for (let i = brace; i < source.length; i++) {
              const c = source[i], n = source[i + 1] || '';
              if (lineComment) { if (c === '\n') lineComment = false; continue; }
              if (blockComment) { if (c === '*' && n === '/') { blockComment = false; i++; } continue; }
              if (quote) {
                if (escape) { escape = false; continue; }
                if (c === '\\') { escape = true; continue; }
                if (c === quote) quote = '';
                continue;
              }
              if (c === '/' && n === '/') { lineComment = true; i++; continue; }
              if (c === '/' && n === '*') { blockComment = true; i++; continue; }
              if (c === "'" || c === '"' || c === '`') { quote = c; continue; }
              if (c === '{') depth++;
              if (c === '}') { depth--; if (depth === 0) return { start, end: i + 1, source: source.slice(start, i + 1) }; }
            }
            throw new Error(name + ': Funktionsende nicht gefunden');
          }

          function replaceFunctionAfter(anchor, name, newSource, label) {
            const anchorIndex = text.indexOf(anchor);
            if (anchorIndex < 0) throw new Error(label + ': Anker nicht gefunden');
            const range = findFunctionRange(text, name, anchorIndex);
            text = text.slice(0, range.start) + newSource + text.slice(range.end);
          }

          function browserScriptRanges(source) {
            const lower=source.toLowerCase(), ranges=[]; let cursor=0;
            while(cursor<source.length){
              const open=lower.indexOf('<script',cursor); if(open<0)break;
              const openEnd=source.indexOf('>',open); if(openEnd<0)break;
              const close=lower.indexOf('</script>',openEnd+1); if(close<0)break;
              ranges.push({open,openEnd:openEnd+1,close,end:close+9}); cursor=close+9;
            }
            return ranges;
          }
          function isInsideBrowserScript(source,pos){return browserScriptRanges(source).some(r=>pos>=r.openEnd&&pos<r.close)}
          function compileBrowserScript(source,range){
            const tag=source.slice(range.open,range.openEnd);
            if(/\bsrc\s*=/i.test(tag))return{ok:true,skipped:'src'};
            const tm=tag.match(/\btype\s*=\s*(["'])(.*?)\1/i);
            const type=tm?String(tm[2]||'').trim().toLowerCase():'';
            if(type&&type!=='text/javascript'&&type!=='application/javascript'&&type!=='module')return{ok:true,skipped:type};
            if(type==='module')return{ok:true,skipped:'module'};
            const body=source.slice(range.openEnd,range.close);
            try{new Function(body);return{ok:true}}catch(e){return{ok:false,error:String(e&&e.message||e)}}
          }
          function escapeScriptClose(source,pos){
            if(source.slice(pos,pos+9).toLowerCase()!=='</script>')throw new Error('Ungültiger Script-Endmarker bei '+pos);
            return source.slice(0,pos)+'<\\/script>'+source.slice(pos+9);
          }
          function attemptRepairFromRange(source,baseRange,anchor,anchorPos){
            let work=source,repaired=0,target=anchorPos,lastError='';
            const openStart=baseRange.open;
            for(let step=0;step<120;step++){
              const ranges=browserScriptRanges(work);
              const range=ranges.find(function(r){return r.open===openStart});
              if(!range)return null;
              const inside=target>=range.openEnd&&target<range.close;
              if(inside){
                const check=compileBrowserScript(work,range);
                if(check.ok)return{source:work,repaired,open:openStart,close:range.close,steps:step+1};
                lastError=check.error||'Syntaxprüfung fehlgeschlagen';
                // Der Browser schließt den Block noch zu früh. Den aktuellen Endmarker
                // nur dann verlängern, wenn danach noch ein weiterer </script>-Marker existiert.
                const next=work.toLowerCase().indexOf('</script>',range.close+9);
                if(next<0)break;
                work=escapeScriptClose(work,range.close);
                repaired++;
                continue;
              }
              if(target>=range.close){
                // Der bekannte JS-Anker liegt hinter dem vom Browser erkannten Scriptende.
                // Genau diesen Endmarker maskieren und denselben Scriptblock weiterverfolgen.
                work=escapeScriptClose(work,range.close);
                repaired++;
                target++;
                continue;
              }
              break;
            }
            return null;
          }
          function repairOneLeak(source,anchor,anchorPos){
            const ranges=browserScriptRanges(source).filter(function(r){return r.close<anchorPos}).reverse();
            if(!ranges.length)throw new Error('Kein vorausgehender Scriptblock für sichtbaren JavaScript-Anker gefunden: '+anchor);
            // Keine 350-kB-Grenze mehr: TESTVERSION.html ist mehrere MB groß und einzelne
            // historische Inline-Scriptblöcke sind deutlich größer als der alte Suchradius.
            const candidates=ranges.slice(0,120);
            for(let i=0;i<candidates.length;i++){
              const result=attemptRepairFromRange(source,candidates[i],anchor,anchorPos);
              if(result){
                console.log('Recovered leaked script anchor:',anchor,'candidate',i+1,'escaped closes',result.repaired,'script start',result.open,'script end',result.close);
                return result;
              }
            }
            throw new Error('Sichtbarer JavaScript-Block konnte auch mit vollständiger Script-Verfolgung nicht sicher rekonstruiert werden: '+anchor);
          }
          function firstOutsideAnchor(source,anchors){
            for(const anchor of anchors){
              let from=0;
              while(true){
                const at=source.indexOf(anchor,from);
                if(at<0)break;
                if(!isInsideBrowserScript(source,at))return{anchor,at};
                from=at+anchor.length;
              }
            }
            return null;
          }
          function repairKnownLeakedScript(source){
            const anchors=["window.open('about:blank'",'window.open("about:blank"','function applyFixedBlocks()','function canonicalActionButtons(','function createQr('];
            let repaired=0;
            for(let pass=0;pass<80;pass++){
              const found=firstOutsideAnchor(source,anchors);
              if(!found)return{source,repaired};
              const one=repairOneLeak(source,found.anchor,found.at);
              source=one.source;
              repaired+=one.repaired;
            }
            throw new Error('Zu viele Script-Reparaturschritte; sicherer Abbruch.');
          }
          function validateClassicInlineScripts(source){
            const ranges=browserScriptRanges(source),errors=[];
            for(let i=0;i<ranges.length;i++){
              const check=compileBrowserScript(source,ranges[i]);
              if(!check.ok){
                const tag=source.slice(ranges[i].open,ranges[i].openEnd).replace(/\s+/g,' ').slice(0,140);
                errors.push('Script '+(i+1)+' @'+ranges[i].open+' '+tag+' -> '+check.error);
                if(errors.length>=8)break;
              }
            }
            if(errors.length)throw new Error('Nach der Rekonstruktion sind Inline-Scriptblöcke syntaktisch unvollständig:\n'+errors.join('\n'));
          }

          replaceOnce(
            "var BUILD=Object.freeze({version:'RC891',cache:'891',loginReturn:'/TESTVERSION.html?v=891'});",
            "var BUILD=Object.freeze({version:'RC892',cache:'892',loginReturn:'/TESTVERSION.html?v=892'});",
            'Canonical BUILD'
          );

          replaceOnce(
            " version:'RC891',\n date:'30.08.2026',\n title:'Produktivitätsstufe 7: Professionelle Sendungsübersicht mit Filtern, Sortierung und gespeicherten Ansichten',",
            " version:'RC892',\n date:'30.08.2026',\n title:'Produktivitätsstufe 8: UI-Bereinigung, klare Aufgaben/Sendungen, Warncenter und Sendungserstellung',",
            'Release metadata'
          );

          // Alte Dashboard-Doppelung entfernen: globale Suche aus RC885 bleibt aktiv.
          replaceFunctionAfter(
            '<script id="exporthub-rc885-productivity">',
            'mountDashboard',
            "function mountDashboard(){var old=document.getElementById('rc885WorkToday');if(old)old.remove();return false}",
            'RC885 Dashboard-Doppelung'
          );

          // Sendung erstellen: große RC887-Schnellerfassungs-Karte entfernen; Vorlagen/Favoriten bleiben im Dashboard erhalten.
          replaceFunctionAfter(
            '<script id="exporthub-rc887-quickwork">',
            'mountShipment',
            "function mountShipment(){var old=document.getElementById('rc887ShipmentQuickStart');if(old)old.remove();return false}",
            'RC887 Sendungserstellung'
          );

          // Arbeitsübergabe vollständig aus der sichtbaren RC888-Dashboardlogik nehmen.
          replaceFunctionAfter('<script id="exporthub-rc888-professional">','handoverData',"function handoverData(){return{counts:{overdue:0,today:0,abd:0,pod:0,waiting:0},items:[]}}",'RC888 handoverData');
          replaceFunctionAfter('<script id="exporthub-rc888-professional">','handoverText',"function handoverText(){return''}",'RC888 handoverText');
          replaceFunctionAfter('<script id="exporthub-rc888-professional">','handoverHtml',"function handoverHtml(){return''}",'RC888 handoverHtml');
          replaceFunctionAfter(
            '<script id="exporthub-rc888-professional">',
            'mountDashboard',
            "function mountDashboard(){var v=view(),r=root(),old=document.getElementById('rc888Handover'),perfOld=document.getElementById('rc888Performance');if(old)old.remove();if(v!=='dashboard'){if(perfOld)perfOld.remove();return false}if(!r)return false;if(isAdmin()){var p=document.createElement('div');p.innerHTML=perfHtml();var pn=p.firstElementChild,po=document.getElementById('rc888Performance');if(po)po.replaceWith(pn);else{var anchor=document.getElementById('rc887QuickAccess')||document.getElementById('rc890Workspace');if(anchor)anchor.insertAdjacentElement('afterend',pn);else r.insertBefore(pn,r.firstChild)}}else if(perfOld)perfOld.remove();return true}",
            'RC888 Dashboard ohne Arbeitsübergabe'
          );

          // RC890: Arbeitsfokus sichtbar kennzeichnen und Aufgaben/Sendungen fachlich getrennt darstellen.
          replaceFunctionAfter(
            '<script id="exporthub-rc890-workspace">',
            'focusButtons',
            "function focusButtons(){var f=prefs().focus,defs=[['all','Alle'],['today','Fällig'],['docs','Dokumente'],['pickup','Abholung']];return defs.map(function(x){return '<button type=\"button\" data-rc890-focus=\"'+x[0]+'\" class=\"'+(f===x[0]?'active':'')+'\">'+x[1]+'</button>'}).join('')}",
            'RC890 Arbeitsfokus'
          );

          replaceFunctionAfter(
            '<script id="exporthub-rc890-workspace">',
            'itemRows',
            "function itemRows(list,max){var rows=arr(list).slice(0,max||8).map(function(x){var action=x.kind==='shipment'&&x.id?'<button type=\"button\" class=\"ghost\" data-rc890-shipment=\"'+esc(x.id)+'\">Öffnen</button>':x.kind==='task'?'<button type=\"button\" class=\"ghost\" data-rc890-route=\"tasks\">Aufgaben</button>':'';return '<div class=\"rc890-row\"><span><b>'+esc(x.title||'Offener Punkt')+'</b><small>'+esc(x.meta||'')+'</small></span><span class=\"rc892-row-side\"><span class=\"rc890-severity '+esc(x.severity||'')+'\">'+esc(x.severity==='danger'?'Dringend':'Offen')+'</span>'+action+'</span></div>'}).join('');return rows||'<div class=\"rc890-empty\">Für diesen Bereich gibt es aktuell keine offenen Punkte.</div>'}",
            'RC890 kompakte Zeilen'
          );

          replaceFunctionAfter(
            '<script id="exporthub-rc890-workspace">',
            'dashboardHtml',
            "function dashboardHtml(){var current=filteredItems(),taskItems=current.filter(function(x){return x.kind==='task'}),shipItems=current.filter(function(x){return x.kind==='shipment'});return '<section id=\"rc890Workspace\" class=\"rc890-card\"><div class=\"rc890-head\"><div><span class=\"rc890-kicker\">PERSÖNLICHER ARBEITSPLATZ</span><h3>Mein Arbeitsplatz</h3><p>Aufgaben und Sendungen sind getrennt. Sie sehen sofort, was als Nächstes bearbeitet werden muss.</p></div><div class=\"rc892-focus-wrap\"><span class=\"rc892-focus-title\">ARBEITSFOKUS</span><div class=\"rc890-focus\">'+focusButtons()+'</div></div></div>'+kpiHtml()+'<div class=\"rc890-grid rc892-workspace-grid\"><div class=\"rc890-box rc892-priority-box\"><div class=\"rc892-box-title\"><h4>Meine Aufgaben</h4><span class=\"rc892-box-count\">'+taskItems.length+'</span></div><div class=\"rc890-list\">'+itemRows(taskItems,6)+'</div></div><div class=\"rc890-box rc892-priority-box\"><div class=\"rc892-box-title\"><h4>Meine Sendungen</h4><span class=\"rc892-box-count\">'+shipItems.length+'</span></div><div class=\"rc890-list\">'+itemRows(shipItems,7)+'</div></div><div class=\"rc892-side-stack\"><div class=\"rc890-box\"><h4>Zuletzt bearbeitet</h4><div class=\"rc890-list\">'+recentRows()+'</div></div><div class=\"rc890-box\"><h4>Schnellzugriffe</h4>'+favouriteLinks()+'</div></div></div></section>'}",
            'RC890 getrennte Aufgaben und Sendungen'
          );

          replaceFunctionAfter(
            '<script id="exporthub-rc890-workspace">',
            'panelHtml',
            "function panelHtml(){var all=warningItems(),c=counts(),urgent=all.filter(function(x){return x.severity==='danger'}),other=all.filter(function(x){return x.severity!=='danger'}),taskCount=all.filter(function(x){return x.kind==='task'}).length,docCount=all.filter(function(x){return x.type==='docs'}).length,pickCount=all.filter(function(x){return x.type==='pickup'}).length;function section(title,list,total){if(!list.length)return'';return '<div class=\"rc892-warning-section\"><div class=\"rc892-warning-section-head\"><b>'+title+'</b><span>'+total+' offen</span></div><div class=\"rc890-list\">'+itemRows(list,6)+'</div></div>'}return '<div id=\"rc890WarningPanel\" class=\"rc890-panel\"><div class=\"rc890-panel-head\"><span><h3>Warncenter</h3><small>Nur wichtige offene Punkte – kompakt nach Priorität zusammengefasst.</small></span><button type=\"button\" class=\"ghost rc890-panel-close\" data-rc890-close=\"1\">Schließen</button></div><div class=\"rc892-warning-summary\"><div class=\"rc892-summary-card '+(c.overdue?'danger':'')+'\"><span>Überfällig</span><b>'+c.overdue+'</b></div><div class=\"rc892-summary-card\"><span>Aufgaben</span><b>'+taskCount+'</b></div><div class=\"rc892-summary-card '+(docCount?'warn':'')+'\"><span>Dokumente</span><b>'+docCount+'</b></div><div class=\"rc892-summary-card '+(pickCount?'warn':'')+'\"><span>Abholung</span><b>'+pickCount+'</b></div></div>'+section('Dringend',urgent,urgent.length)+section('Weitere offene Punkte',other,other.length)+'<div class=\"rc892-warning-footer\"><button type=\"button\" class=\"ghost\" data-rc890-route=\"tasks\">Meine Aufgaben</button><button type=\"button\" class=\"ghost\" data-rc890-route=\"shipmentoverview\">Meine Sendungen</button></div></div>'}",
            'RC890 Warncenter'
          );

          // RC886 Fortschritt auf eine kompakte Statuszeile reduzieren.
          replaceFunctionAfter(
            '<script id="exporthub-rc886-shipment-progress">',
            'mount',
            "function mount(){var v=view(),r=root();var old=document.getElementById('rc886ShipmentProgress');if(v!=='shipment'&&v!=='shipmentview'){if(old)old.remove();return false}var sh=currentShipment();if(!r||!sh){if(old)old.remove();return false}var list=steps(sh),ok=list.filter(function(x){return x.ok}).length,total=list.length,pct=total?Math.round(ok/total*100):0,next=nextStep(sh,list),docs=documents(sh).filter(function(d){return d.required}),ref=q(sh.ref||sh.reference||sh.shipmentRef)||'Neue Sendung',cust=q(customerFor(sh).name||sh.customerName)||'Kunde offen';var html='<section class=\"rc886-progress-card rc892-progress-compact\" id=\"rc886ShipmentProgress\" data-shipment=\"'+esc(shipmentKey(sh)||ref)+'\"><div class=\"rc892-progress-main\"><div class=\"rc892-progress-title\"><span>ARBEITSSTATUS · '+pct+' %</span><b>'+esc(next.id==='done'?'Sendung vollständig vorbereitet':'Nächster Schritt: '+next.label)+'</b><small>'+esc(ref)+' · '+esc(cust)+' · '+esc(status(sh))+'</small></div><div class=\"rc886-docs\">'+docs.map(function(d){var cls=d.ok?'ok':'missing',txt=d.ok?'✓':'Fehlt';return '<span class=\"rc886-doc '+cls+'\">'+esc(d.label)+' · '+txt+'</span>'}).join('')+'</div><div class=\"rc892-progress-action\">'+(next.id==='done'?'':'<button type=\"button\" class=\"btn\" data-rc886-action=\"'+esc(next.id)+'\">'+esc(actionLabel(next,v))+'</button>')+'</div></div><div class=\"rc886-bar\" aria-label=\"Sendungsfortschritt '+pct+' Prozent\"><i style=\"width:'+pct+'%\"></i></div></section>';if(old){if(old.outerHTML!==html)old.outerHTML=html;return true}var head=r.querySelector('.page-head,.rc776-page-head,.rc776-head');if(head&&head.parentNode)head.insertAdjacentHTML('afterend',html);else r.insertAdjacentHTML('afterbegin',html);return true}",
            'RC886 kompakter Fortschritt'
          );

          // Gezielte Parser-Reparatur für den im Testservice sichtbaren JavaScript-Quelltext.
          // Es werden nur bekannte ExportHUB-JavaScript-Anker repariert, wenn sie außerhalb eines Scriptblocks liegen.
          const repaired = repairKnownLeakedScript(text);
          text = repaired.source;
          validateClassicInlineScripts(text);
          console.log('Repaired prematurely closed ExportHUB script blocks:', repaired.repaired);
          console.log('All classic inline script blocks parse after recovery.');

          const module = Buffer.from('', 'base64').toString('utf8');
          if (!module.includes('id="exporthub-rc892-professional-cleanup"') || !module.includes('ExportHUBProfessional892=Object.freeze')) throw new Error('RC892 Modul beschädigt');
          const bodyClose = text.lastIndexOf('</body>');
          if (bodyClose < 0) throw new Error('</body> nicht gefunden');
          text = text.slice(0, bodyClose) + '\n' + module + '\n' + text.slice(bodyClose);

          const changesAnchor = " changes:Object.freeze([\n";
          const changesPos = text.indexOf(changesAnchor);
          if (changesPos >= 0) {
            const newChanges =
              '    "RC892 entfernt die Arbeitsübergabe vollständig aus dem sichtbaren Dashboard und reduziert doppelte Dashboard-Arbeitskarten.",\n' +
              '    "RC892 trennt Meine Aufgaben und Meine Sendungen im persönlichen Arbeitsplatz fachlich und optisch voneinander.",\n' +
              '    "RC892 gestaltet das Warncenter kompakter mit Prioritätsgruppen und Übersichtskennzahlen.",\n' +
              '    "RC892 räumt Sendung erstellen auf: große Schnellstartkarte entfernt, Fortschritt kompakt, bestehende Prozessblöcke klarer formatiert.",\n' +
              '    "RC892 korrigiert die Navigation für Meine Aufgaben und Meine Sendungen und repariert gefährliche Script-Endmarker, die JavaScript sichtbar in die Seite schreiben können.",\n' +
              '    "RC892 startet nach erfolgreichem Commit den TESTSERVICE-Deploy ausdrücklich und wartet auf dessen Ergebnis.",\n';
            text = text.slice(0, changesPos + changesAnchor.length) + newChanges + text.slice(changesPos + changesAnchor.length);
          }

          if (text === original) throw new Error('RC892 hat keine Änderung erzeugt');
          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: RC892 static safety and render-source tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('TESTVERSION.html','utf8');
          function required(rx,msg){if(!rx.test(text))throw new Error(msg)}
          required(/version:'RC892',cache:'892',loginReturn:'\/TESTVERSION\.html\?v=892'/,'RC892 BUILD fehlt');
          required(/id="exporthub-rc892-professional-cleanup"/,'RC892 Modul fehlt');
          required(/ExportHUBProfessional892=Object\.freeze/,'RC892 Diagnose-API fehlt');
          required(/function mountDashboard\(\){var old=document\.getElementById\('rc885WorkToday'\);if\(old\)old\.remove\(\);return false}/,'Alte RC885 Dashboardkarte ist noch aktiv');
          required(/function mountShipment\(\){var old=document\.getElementById\('rc887ShipmentQuickStart'\);if\(old\)old\.remove\(\);return false}/,'RC887 Schnellstartkarte ist noch aktiv');
          required(/function handoverHtml\(\){return''}/,'Arbeitsübergabe wurde nicht deaktiviert');
          required(/Meine Aufgaben/,'Meine Aufgaben fehlt');
          required(/Meine Sendungen/,'Meine Sendungen fehlt');
          required(/Nur wichtige offene Punkte/,'Neues Warncenter fehlt');
          required(/rc892-progress-compact/,'Kompakter Sendungsfortschritt fehlt');
          required(/rc892-navigation/,'Navigationskorrektur fehlt');

          // Browsernahe Prüfung auf sichtbaren JavaScript-Quelltext.
          function stripBrowserScripts(source){let out='',cursor=0,lower=source.toLowerCase();while(cursor<source.length){const open=lower.indexOf('<script',cursor);if(open<0){out+=source.slice(cursor);break}out+=source.slice(cursor,open);const oe=source.indexOf('>',open);if(oe<0){out+=source.slice(open);break}const close=lower.indexOf('</script>',oe+1);if(close<0){out+=source.slice(open);break}cursor=close+9}return out.replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,'')}
          const outside=stripBrowserScripts(text);
          if(/function\s+applyFixedBlocks\s*\(/.test(outside))throw new Error('applyFixedBlocks liegt weiterhin außerhalb eines Scriptblocks');
          if(/window\.open\(['"]about:blank/.test(outside))throw new Error('Druck-JavaScript liegt weiterhin sichtbar außerhalb eines Scriptblocks');
          if(/function\s+canonicalActionButtons\s*\(/.test(outside))throw new Error('canonicalActionButtons liegt weiterhin außerhalb eines Scriptblocks');
          if(/function\s+createQr\s*\(/.test(outside))throw new Error('createQr liegt weiterhin außerhalb eines Scriptblocks');

          const scriptIds=['exporthub-rc885-productivity','exporthub-rc886-shipment-progress','exporthub-rc887-quickwork','exporthub-rc888-professional','exporthub-rc890-workspace','exporthub-rc891-overview','exporthub-rc892-professional-cleanup'];
          let rc892js='';
          for(const id of scriptIds){
            const start=text.indexOf('<script id="'+id+'">');
            const body=start>=0?text.indexOf('>',start)+1:-1;
            const end=body>0?text.indexOf('</script>',body):-1;
            if(start<0||body<=0||end<0)throw new Error('Script kann nicht extrahiert werden: '+id);
            const js=text.slice(body,end);
            new Function(js);
            if(id==='exporthub-rc892-professional-cleanup')rc892js=js;
          }
          if(/fetch\s*\(|XMLHttpRequest|sendBeacon\s*\(|WebSocket\s*\(/.test(rc892js))throw new Error('RC892 enthält unerlaubten Netzwerkweg');
          if(/queueSave\s*\(|saveShipment\s*\(|azureSave|teamSave/.test(rc892js))throw new Error('RC892 enthält unerlaubten Speicherweg');
          console.log('RC892 static safety tests: PASS');
          NODE

      - name: Verify production scope untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json; then
            echo "ERROR: Production/API/public files changed."
            git diff -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json
            exit 1
          fi
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "TESTVERSION.html"

      - name: Write RC892 test report
        shell: bash
        run: |
          cat > RC892_PRUEFBERICHT.txt <<'EOF'
          TESTBERICHT RC892 – UI-BEREINIGUNG UND ARBEITSLOGIK

          Scope:
          - Ausschließlich TESTSERVICE / TESTVERSION.html
          - Produktion und APIs unverändert

          Änderungen:
          1. Arbeitsübergabe entfernt.
          2. Alte doppelte Dashboard-Arbeitskarte aus RC885 entfernt; globale Suche bleibt erhalten.
          3. Mein Arbeitsplatz trennt Meine Aufgaben und Meine Sendungen in zwei eindeutige Bereiche.
          4. Arbeitsfokus stärker markiert und verständlicher benannt: Alle / Fällig / Dokumente / Abholung.
          5. Warncenter kompakter: Kennzahlen, Dringend, weitere Punkte und direkte Wege zu Aufgaben/Sendungen.
          6. Sendung erstellen aufgeräumt:
             - große Favoriten-/Vorlagenkarte auf der Sendungsseite entfernt
             - Vorlagen/Favoriten bleiben auf dem Dashboard verfügbar
             - Fortschrittsanzeige zu einer kompakten Statuszeile reduziert
             - bestehende Prozessblöcke kompakter formatiert
          7. Navigation Meine Aufgaben -> tasks und Meine Sendungen -> shipmentoverview explizit getrennt.
          8. HTML/JS-Parser-Reparatur mit vollständiger Script-Verfolgung für gefährliche </script>-Endmarker in JavaScript-Strings/Kommentaren.
             Dadurch wird der im Screenshot sichtbare JavaScript-Quelltext verhindert.
          9. Der Workflow startet den TESTSERVICE-Deploy jetzt ausdrücklich nach dem Commit und wartet auf das Ergebnis.

          Test:
          - Dashboard: keine Arbeitsübergabe.
          - Dashboard: Meine Aufgaben und Meine Sendungen müssen unterschiedliche Inhalte zeigen.
          - Arbeitsfokus muss optisch deutlich als Filter erkennbar sein.
          - Warncenter öffnen: kompakte Zusammenfassung statt langer großer Kartenliste.
          - Menü Meine Aufgaben und Meine Sendungen nacheinander öffnen; unterschiedliche Ansichten müssen erscheinen.
          - Sendung erstellen: kein JavaScript-Quelltext sichtbar, keine große RC887-Schnellstartkarte, kompakter Arbeitsstatus.
          - Bestehende Kunden-/Colli-/Dokument-/ABD-/Mail-/Speicherlogik prüfen.
          EOF

      - name: Commit RC892 testservice
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html RC892_PRUEFBERICHT.txt
          git commit -m "RC892: clean workspace, warning center and shipment creation"
          git push origin main

      - name: Dispatch TESTSERVICE deploy explicitly
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BEFORE="$(date -u +%s)"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/exporthub-testservice.yml/dispatches" -f ref=main
          echo "TESTSERVICE deployment dispatched explicitly."

      - name: Wait for TESTSERVICE RC892 deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.dispatch.outputs.before }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow exporthub-testservice.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then break; fi
            echo "Warte auf gestarteten TESTSERVICE-Deploy ($attempt/30)..."
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error title=Deploy nicht gefunden::Der explizit gestartete TESTSERVICE-Workflow konnte nicht gefunden werden."
            exit 1
          fi
          echo "TESTSERVICE run id: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: RC892 summary
        shell: bash
        run: |
          {
            echo "## ExportHUB TESTSERVICE RC892"
            echo
            echo "RC892 wurde gepatcht, committed und der TESTSERVICE-Deploy wurde erfolgreich abgewartet."
            echo
            echo "Sichtbare Änderungen:"
            echo "- Arbeitsübergabe entfernt"
            echo "- Meine Aufgaben / Meine Sendungen getrennt"
            echo "- Arbeitsfokus klar markiert"
            echo "- Warncenter kompakter"
            echo "- Sendung erstellen aufgeräumt"
            echo "- sichtbarer JavaScript-Quelltext geprüft/repariert"
          } >> "$GITHUB_STEP_SUMMARY"
