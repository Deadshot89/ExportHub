name: RC1056 Apply Pickup Task

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1056 Abholtag-Lifecycle ergänzen
        run: node .github/rc1056/apply-pickup-task.mjs
      - name: RC1056 gezielte Regression
        run: |
          node --test test/rc1055-task-status-canonicalization.test.mjs
          node --test test/rc1056-task-pickup-reconcile.test.mjs
          node --test test/rc1014-task-lifecycle.test.mjs
      - name: Änderung committen
        run: |
          if git diff --quiet -- assets/rc1014-task-lifecycle.js; then
            echo 'Keine Änderung erforderlich.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rc1014-task-lifecycle.js
          git commit -m 'RC1056: Abholtag nach vollständiger Abholung erledigen'
          git push origin HEAD:main
