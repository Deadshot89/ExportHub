name: RC1514 Pack Read Contention
on:
  push:
    branches:
      - fix/rc1514-pack-read-contention
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1514 read-only pack regression
        run: node --test test/rc1514-pack-read-contention.test.mjs
