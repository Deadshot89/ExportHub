name: RC1477 Runtime Fix

on:
  push:
    branches:
      - rc1477-recording-diagnostics-fixes

permissions:
  contents: write

concurrency:
  group: rc1477-runtime-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: rc1477-recording-diagnostics-fixes
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply minimal RC1477 runtime fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          shipment_path = Path('assets/rc1014-shipment-overview.js')
          shipment = shipment_path.read_text(encoding='utf-8')
          shipment_old = """    if(!shouldShow){if(panel&&typeof panel.remove==='function'){panel.remove();lastMutationAt=Date.now()}return false}\n    if(panel&&typeof panel.remove==='function')panel.remove();\n    if(typeof card.appendChild!=='function'||typeof doc.createElement!=='function')return false;\n    panel=createContainerCard(doc,shipment);card.appendChild(panel);lastMutationAt=Date.now();return true;"""
          shipment_new = """    if(!shouldShow){if(panel&&typeof panel.remove==='function'){panel.remove();lastMutationAt=Date.now()}return false}\n    const fingerprint=JSON.stringify([shipmentReference(shipment),meta.required,meta.seal,meta.photos.map(photo=>[q(photo&&photo.id),q(photo&&photo.kind),q(photo&&photo.label),q(photo&&photo.name)])]);\n    if(panel&&panel.getAttribute&&panel.getAttribute('data-rc1477-container-fingerprint')===fingerprint)return true;\n    if(panel&&typeof panel.remove==='function')panel.remove();\n    if(typeof card.appendChild!=='function'||typeof doc.createElement!=='function')return false;\n    panel=createContainerCard(doc,shipment);\n    if(panel&&panel.setAttribute)panel.setAttribute('data-rc1477-container-fingerprint',fingerprint);\n    card.appendChild(panel);lastMutationAt=Date.now();return true;"""
          shipment = replace_once(shipment, shipment_old, shipment_new, 'shipment container idempotence')
          shipment_path.write_text(shipment, encoding='utf-8')

          task_path = Path('assets/rc1014-task-runtime.js')
          task = task_path.read_text(encoding='utf-8')
          task_old = """      const meta=taskCardMeta(task,ctx);\n      let row=card.querySelector&&card.querySelector('.rc1014-task-meta');\n      if(!row){row=doc.createElement('div');row.className='rc1014-task-meta';if(typeof card.appendChild==='function')card.appendChild(row);}\n      row.textContent='';\n      row.appendChild(createSpan(doc,'rc1014-priority','data-rc1014-priority',meta.priority,tr('taskDetail.priority',{priority:meta.priority})));\n      row.appendChild(createSpan(doc,'rc1014-due','data-rc1014-due',meta.dueBucket,tr('taskDetail.dueLabel',{due:meta.dueLabel})));\n      row.appendChild(createSpan(doc,'rc1014-assignee','data-rc1014-assignee',meta.assignee,tr('taskDetail.ownerLabel',{owner:meta.assignee})));\n      let button=card.querySelector&&card.querySelector('[data-rc1014-open-task]');"""
          task_new = """      const meta=taskCardMeta(task,ctx);\n      const priorityText=tr('taskDetail.priority',{priority:meta.priority});\n      const dueText=tr('taskDetail.dueLabel',{due:meta.dueLabel});\n      const assigneeText=tr('taskDetail.ownerLabel',{owner:meta.assignee});\n      const metaFingerprint=JSON.stringify([meta.priority,meta.dueBucket,meta.dueAt,meta.assignee,priorityText,dueText,assigneeText]);\n      let row=card.querySelector&&card.querySelector('.rc1014-task-meta');\n      if(!row){row=doc.createElement('div');row.className='rc1014-task-meta';if(typeof card.appendChild==='function')card.appendChild(row);}\n      if(!row.getAttribute||row.getAttribute('data-rc1477-task-meta-fingerprint')!==metaFingerprint){\n        row.textContent='';\n        row.appendChild(createSpan(doc,'rc1014-priority','data-rc1014-priority',meta.priority,priorityText));\n        row.appendChild(createSpan(doc,'rc1014-due','data-rc1014-due',meta.dueBucket,dueText));\n        row.appendChild(createSpan(doc,'rc1014-assignee','data-rc1014-assignee',meta.assignee,assigneeText));\n        if(row.setAttribute)row.setAttribute('data-rc1477-task-meta-fingerprint',metaFingerprint);\n      }\n      let button=card.querySelector&&card.querySelector('[data-rc1014-open-task]');"""
          task = replace_once(task, task_old, task_new, 'task metadata idempotence')

          marker = '  function renderManagedTaskPlan(ctx=lastContext){'
          start = task.find(marker)
          if start < 0:
              raise SystemExit('managed task plan: function not found')
          assign = task.find('    section.innerHTML=`', start)
          if assign < 0:
              raise SystemExit('managed task plan: innerHTML assignment not found')
          end = task.find(';\n    return true;', assign)
          if end < 0:
              raise SystemExit('managed task plan: assignment terminator not found')
          block = task[assign:end+1]
          if not block.startswith('    section.innerHTML=`'):
              raise SystemExit('managed task plan: unexpected assignment')
          replacement = block.replace('    section.innerHTML=`', '    const planHtml=`', 1) + "\n    if(section.innerHTML!==planHtml)section.innerHTML=planHtml;"
          task = task[:assign] + replacement + task[end+1:]
          task_path.write_text(task, encoding='utf-8')
          PY

      - name: Remove one-shot workflow from resulting commit
        run: git rm .github/workflows/rc1477-runtime-fix.yml

      - name: Verify targeted RC1477 regressions
        run: node --test --test-concurrency=1 test/rc1477-shipment-container-idempotent.test.mjs test/rc1477-task-meta-idempotent.test.mjs test/rc1477-task-plan-idempotent.test.mjs

      - name: Verify Android privacy regression
        run: node --test --test-concurrency=1 test/rc1014-task-android.test.mjs

      - name: Verify complete Node regression
        id: full_node
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-full.log

      - name: Upload complete Node regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1477-node-full-log
          path: node-full.log
          if-no-files-found: error

      - name: Enforce complete Node regression gate
        if: steps.full_node.outcome == 'failure'
        run: |
          echo 'Complete Node regression failed; verified runtime fix will not be committed.'
          exit 1

      - name: Verify diff integrity
        run: |
          git diff --check
          git status --short

      - name: Commit verified runtime fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rc1014-shipment-overview.js assets/rc1014-task-runtime.js
          git commit -m "fix: make RC1477 rendering idempotent"
          git push origin HEAD:rc1477-recording-diagnostics-fixes
