name: RC990 Production Release Materialize

on:
  push:
    branches:
      - rc990-production-release
    paths:
      - '.github/workflows/rc990-production-release-materialize.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc990-production-release
          fetch-depth: 7
      - name: Locate all stripBlock implementations
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          s=Path('TESTVERSION.html').read_text(encoding='utf-8')
          hits=list(re.finditer(r'function\s+stripBlock\s*\(([^)]*)\)',s))
          print('COUNT',len(hits))
          for i,m in enumerate(hits,1):
              print('---',i,'pos',m.start(),'args',m.group(1),'---')
              print(s[m.start():m.start()+1200])
          PY
