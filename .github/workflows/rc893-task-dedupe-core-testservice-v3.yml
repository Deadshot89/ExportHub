      - name: GREEN verify canonical tasks and untouched Index218
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          src=Path("TESTVERSION.html").read_text(encoding="utf-8")

          for needle in (
            "var BUILD=Object.freeze({version:'RC893',cache:'893',loginReturn:'/TESTVERSION.html?v=893'});",
            "/* exporthub-rc893-canonical-task-source */",
            "ExportHUBTaskSourceRC893.openTasks({mineOnly:false})",
            "ExportHUBTaskSourceRC893.openTasks({mineOnly:true})",
            "/* exporthub-rc892-render-rootfix */",
            "rc892LieferAvisBtn",
            "rc892-shipment-grid"
          ):
              if needle not in src:
                  raise SystemExit("Fehlt nach Patch: "+needle)

          old="let base=dedupeVisibleTasksRC874(rawOpen).map(t=>({...t,eowner:effectiveOwner(t)}));"
          if old in src:
              raise SystemExit("Aufgaben-Seite verwendet noch alte parallele Quelle")

          def find_function(source,name):
              start=source.find("function "+name+"(")
              if start<0: raise SystemExit(name+" fehlt")
              brace=source.find("{",start)
              depth=0; quote=""; esc=False; line=False; block=False
              i=brace
              while i<len(source):
                  c=source[i]; n=source[i+1] if i+1<len(source) else ""
                  if line:
                      if c=="\n": line=False
                      i+=1; continue
                  if block:
                      if c=="*" and n=="/": block=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False; i+=1; continue
                      if c=="\\": esc=True; i+=1; continue
                      if c==quote: quote=""
                      i+=1; continue
                  if c=="/" and n=="/": line=True; i+=2; continue
                  if c=="/" and n=="*": block=True; i+=2; continue
                  if c in ("'",'"',"`"): quote=c; i+=1; continue
                  if c=="{": depth+=1
                  elif c=="}":
                      depth-=1
                      if depth==0: return source[start:i+1]
                  i+=1
              raise SystemExit(name+" Ende fehlt")

          planner=find_function(src,"openTasksForWeek")
          before=Path("/tmp/rc893_planner.sha").read_text().strip()
          after=hashlib.sha256(planner.encode()).hexdigest()
          if before!=after:
              raise SystemExit("Index218 wurde verändert; RC893 v3 darf den Planner nicht anfassen")

          expected={
            "script_open":int(Path("/tmp/rc893_script_open").read_text()),
            "script_close":int(Path("/tmp/rc893_script_close").read_text()),
            "style_open":int(Path("/tmp/rc893_style_open").read_text()),
            "style_close":int(Path("/tmp/rc893_style_close").read_text())
          }
          actual={
            "script_open":src.lower().count("<script"),
            "script_close":src.lower().count("</script>"),
            "style_open":src.lower().count("<style"),
            "style_close":src.lower().count("</style>")
          }
          if expected!=actual:
              raise SystemExit("HTML-Grenzen verändert")

          print("GREEN: Aufgaben/Arbeitsfokus/Warncenter gemeinsame Quelle; Index218 unverändert.")
          PY

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "TESTVERSION.html" ]]; then
            echo "::error::Nur TESTVERSION.html darf geändert werden."
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi

      - name: Commit RC893 TESTSERVICE
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC893: unify task list source without touching planner"
