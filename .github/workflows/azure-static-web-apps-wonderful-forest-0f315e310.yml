name: ExportHUB PRODUCTION Deploy
on:
  push:
    branches: [main]
    paths:
      - 'production-version.js'
permissions:
  contents: read
concurrency:
  group: exporthub-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: RC1002 Produktionsfreigabe prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1002'" production-version.js
          node --test test/rc1002-release-sync.test.mjs
          npm test
      - name: RC1002 Produktionspaket bauen
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1002/build-three-env.mjs
          rm -rf .rc1002_production_app
          mkdir -p .rc1002_production_app
          cp dist-rc1002/index.html .rc1002_production_app/index.html
          cp pickup.html customer-avis.html location.html pod-notfall.html production-version.js staticwebapp.config.json .rc1002_production_app/
          cp -R assets .rc1002_production_app/assets
          grep -q 'ExportHUB RC1002 environment=production-candidate' .rc1002_production_app/index.html
          grep -q "version:'RC1002'" .rc1002_production_app/index.html
          test ! -d .rc1002_production_app/api
      - name: Deploy ExportHUB production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1002_production_app
          api_location: api
          output_location: ''
          skip_app_build: true
      - name: Live RC1002 Produktion prüfen
        shell: bash
        run: |
          set -euo pipefail
          base='https://wonderful-forest-0f315e310.7.azurestaticapps.net'
          root=$(mktemp); health=$(mktemp); trap 'rm -f "$root" "$health"' EXIT
          for attempt in {1..18}; do
            r=$(curl -sS -L -o "$root" -w '%{http_code}' --max-time 20 "$base/?rc1002=$GITHUB_SHA-$attempt" || true)
            h=$(curl -sS -o "$health" -w '%{http_code}' --max-time 20 "$base/api/exporthub-health" || true)
            if [[ "$r" == '200' && "$h" == '200' ]] && grep -q 'ExportHUB RC1002 environment=production-candidate' "$root"; then
              echo 'RC1002 Produktion live bestätigt.'
              exit 0
            fi
            sleep 10
          done
          echo 'RC1002 Produktion nicht bestätigt.'
          exit 1
