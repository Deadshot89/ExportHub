name: RC943 Sendung erstellen Felder entfernen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc943-remove-shipment-fields.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rc943-remove-shipment-fields
  cancel-in-progress: false

jobs:
  patch_verify_deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RC942 Vorbedingungen prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'" in text, 'Basis ist nicht exakt RC942.'

          def target_blocks(label,handler):
              matches=[]; pos=0
              while True:
                  i=text.find(label,pos)
                  if i<0: break
                  start=text.rfind('<label',max(0,i-900),i+1)
                  end=text.find('</label>',i)
                  if start>=0 and end>=0:
                      end+=len('</label>')
                      block=text[start:end]
                      if handler in block:
                          matches.append((start,end))
                  pos=i+1
              return list(dict.fromkeys(matches))

          assert len(target_blocks('Geplantes Abholdatum','setShipmentPickupDate(this.value)'))==1
          assert len(target_blocks('Spedition','state.shipment.carrier=this.value'))==1
          assert 'function setShipmentPickupDate(v)' in text
          assert 'function updateSavedShipmentPickupDate(id,v)' in text
          assert 'function createOrUpdateShipmentCreatedTask(s,c)' in text
          print('Vorbedingungen OK: beide Zielblöcke eindeutig, bestehende Abhol-/Aufgabenlogik vorhanden.')
          PY

      - name: RC943 – nur die zwei Eingabefelder entfernen
        shell: bash
        run: |
          cp TESTVERSION.html /tmp/TESTVERSION.before.html
          python3 <<'PY'
          from pathlib import Path
          p=Path('TESTVERSION.html')
          text=p.read_text(encoding='utf-8')

          old_build="version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'"
          new_build="version:'RC943',cache:'943',loginReturn:'/TESTVERSION.html?v=943'"
          if text.count(old_build)!=1:
              raise SystemExit(f'BUILD-Version: erwartet 1 RC942-Marker, gefunden {text.count(old_build)}')
          text=text.replace(old_build,new_build,1)

          marker="changes:Object.freeze([\n"
          if text.count(marker)!=1:
              raise SystemExit(f'Release-Anker nicht eindeutig: {text.count(marker)}')
          note="    'RC943 entfernt in Sendung erstellen die sichtbaren Eingabefelder Geplantes Abholdatum und Spedition. Die vorhandenen Abhol-, Aufgaben-, QR-, Speditions- und Dokumentdatenpfade bleiben unverändert erhalten.',\n"
          text=text.replace(marker,marker+note,1)

          def remove_target_label(source,label,handler):
              matches=[]; pos=0
              while True:
                  i=source.find(label,pos)
                  if i<0: break
                  start=source.rfind('<label',max(0,i-900),i+1)
                  end=source.find('</label>',i)
                  if start>=0 and end>=0:
                      end+=len('</label>')
                      block=source[start:end]
                      if handler in block:
                          matches.append((start,end,block))
                  pos=i+1
              unique=[]; seen=set()
              for m in matches:
                  key=(m[0],m[1])
                  if key not in seen:
                      seen.add(key); unique.append(m)
              if len(unique)!=1:
                  raise SystemExit(f'{label}: erwartet genau 1 Zielblock, gefunden {len(unique)}')
              start,end,block=unique[0]
              print(f'Entferne {label}:',repr(block))
              return source[:start]+source[end:]

          text=remove_target_label(text,'Geplantes Abholdatum','setShipmentPickupDate(this.value)')
          text=remove_target_label(text,'Spedition','state.shipment.carrier=this.value')
          p.write_text(text,encoding='utf-8')
          PY

      - name: RC943 exakt gegen erlaubtes Delta prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          before=Path('/tmp/TESTVERSION.before.html').read_text(encoding='utf-8')
          after=Path('TESTVERSION.html').read_text(encoding='utf-8')

          old_build="version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'"
          new_build="version:'RC943',cache:'943',loginReturn:'/TESTVERSION.html?v=943'"
          marker="changes:Object.freeze([\n"
          note="    'RC943 entfernt in Sendung erstellen die sichtbaren Eingabefelder Geplantes Abholdatum und Spedition. Die vorhandenen Abhol-, Aufgaben-, QR-, Speditions- und Dokumentdatenpfade bleiben unverändert erhalten.',\n"

          expected=before.replace(old_build,new_build,1).replace(marker,marker+note,1)

          def remove_target_label(source,label,handler):
              matches=[]; pos=0
              while True:
                  i=source.find(label,pos)
                  if i<0: break
                  start=source.rfind('<label',max(0,i-900),i+1)
                  end=source.find('</label>',i)
                  if start>=0 and end>=0:
                      end+=len('</label>')
                      block=source[start:end]
                      if handler in block:
                          matches.append((start,end))
                  pos=i+1
              unique=list(dict.fromkeys(matches))
              if len(unique)!=1:
                  raise SystemExit(f'{label}: Prüfdelta nicht eindeutig: {len(unique)}')
              start,end=unique[0]
              return source[:start]+source[end:]

          expected=remove_target_label(expected,'Geplantes Abholdatum','setShipmentPickupDate(this.value)')
          expected=remove_target_label(expected,'Spedition','state.shipment.carrier=this.value')
          assert after==expected, 'TESTVERSION enthält Änderungen außerhalb des freigegebenen RC943-Deltas.'

          assert new_build in after and old_build not in after
          assert 'function setShipmentPickupDate(v)' in after
          assert 'function updateSavedShipmentPickupDate(id,v)' in after
          assert 'function createOrUpdateShipmentCreatedTask(s,c)' in after
          assert after.count('Geplantes Abholdatum') == before.count('Geplantes Abholdatum')-1
          assert after.count('Spedition') == before.count('Spedition')-1
          assert 'setShipmentPickupDate(this.value)' not in after
          assert 'state.shipment.carrier=this.value' not in after
          print('GREEN: Exakt freigegebenes RC943-Delta; keine weitere Fachlogik verändert.')
          PY
          git diff --check
          git diff --stat

      - name: RC943 nach main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          git diff --cached --check
          git commit -m "RC943 Sendung erstellen Felder entfernen"
          git push origin HEAD:main

      - name: Temporären RC943-Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm .github/workflows/rc943-remove-shipment-fields.yml
          git commit -m "RC943 temporären Patch-Workflow entfernen"
          git push origin HEAD:main

      - name: TESTSERVICE-Deploy für RC943 auslösen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/exporthub-testservice-final-artifact-fix.yml/dispatches" \
            -d '{"ref":"main"}')"
          cat /tmp/dispatch.out || true
          [[ "$code" == "204" ]] || { echo "Dispatch fehlgeschlagen: HTTP $code"; exit 1; }
          echo "TESTSERVICE-Deploy RC943 ausgelöst."
