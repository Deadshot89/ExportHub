name: RC1004 Outlook Avis Apply
on:
  push:
    branches: [rc1004-avis-outlook-body-fix]
    paths:
      - '.github/rc1004/apply-avis-outlook-body-fix.mjs'
      - '.github/workflows/rc1004-avis-outlook-apply.yml'
permissions:
  contents: write
concurrency:
  group: rc1004-avis-outlook-apply-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1004-avis-outlook-body-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Outlook-Avis Root-Cause-Fix anwenden
        run: node .github/rc1004/apply-avis-outlook-body-fix.mjs
      - name: Zielgerichtete Regression
        run: |
          node --test test/rc1004-avis-outlook-body.test.mjs
          node --test --test-name-pattern='Outlook erhält auch bei langen Vorlagen den vollständigen Mailtext|Kundenmail behält Sendungsdetails' .github/rc998/partial-pickup-avis-contract.test.mjs
      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html TESTVERSION.html; then
            echo 'Keine HTML-Änderung nötig.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html TESTVERSION.html
          git commit -m 'RC1004: Outlook-Avis Mailtext vollständig an Outlook übergeben'
          git push origin HEAD:rc1004-avis-outlook-body-fix
