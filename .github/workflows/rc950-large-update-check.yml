name: RC950 Large Update Check

on:
  push:
    branches:
      - rc950-large-update
    paths:
      - 'TESTVERSION.html'
      - '.github/rc950_audit.py'
      - '.github/rc950_regression.py'
      - '.github/rc950_patch.py'
      - '.github/workflows/rc950-large-update-check.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc950-large-update-check
  cancel-in-progress: true

jobs:
  audit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout RC950 branch
        uses: actions/checkout@v4
        with:
          ref: rc950-large-update
          fetch-depth: 1

      - name: RED then apply bundled RC950 update when needed
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "version:'RC950',cache:'950',loginReturn:'/TESTVERSION.html?v=950'" TESTVERSION.html; then
            echo 'RC950 implementation already present.'
          else
            echo 'Pre-implementation baseline detected: RED required.'
            if python3 .github/rc950_regression.py; then
              echo 'RC950 regression unexpectedly passed before implementation.'
              exit 1
            fi
            echo 'Expected RED baseline confirmed. Applying bundled RC950 patch.'
            python3 .github/rc950_patch.py
          fi

      - name: Generate active-path audit after implementation
        run: python3 .github/rc950_audit.py

      - name: GREEN RC950 regression
        run: python3 .github/rc950_regression.py

      - name: Repository runtime tests
        run: npm test

      - name: Diff integrity
        run: git diff --check

      - name: Commit RC950 application and audit output when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- TESTVERSION.html docs/superpowers/rc950-audit.txt; then
            echo 'RC950 working tree already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TESTVERSION.html docs/superpowers/rc950-audit.txt
          git commit -m 'RC950 Großupdate Stabilität Performance Bedienung'
          git push origin HEAD:rc950-large-update
