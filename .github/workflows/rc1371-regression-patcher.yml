name: RC1371 regression patcher

on:
  push:
    branches:
      - feature/dashboard-personalization
    paths:
      - '.github/workflows/rc1371-regression-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/dashboard-personalization
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply anchored regression fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function patch(file,before,after,label){let src=fs.readFileSync(file,'utf8');const n=src.split(before).length-1;if(n!==1)throw new Error(label+' anchor '+n+'x');src=src.replace(before,after);fs.writeFileSync(file,src)}

          patch('assets/rc1306-layout-engine.js',
`    restoreAll();
    lastAppliedDesign=mode;
    if(dashboardOwnsLayout()){
      if(mode!=='classic')setMode(mode==='modern'?'business':mode);
      if(w.ExportHUBDashboard1371&&typeof w.ExportHUBDashboard1371.applyTheme==='function')w.ExportHUBDashboard1371.applyTheme(mode);
      return
    }
    if(mode==='classic')return;`,
`    restoreAll();
    lastAppliedDesign=mode;
    if(mode==='classic')return;
    if(dashboardOwnsLayout()){
      setMode(mode==='modern'?'business':mode);
      if(w.ExportHUBDashboard1371&&typeof w.ExportHUBDashboard1371.applyTheme==='function')w.ExportHUBDashboard1371.applyTheme(mode);
      return
    }`,
          'RC1306 classic order');

          patch('assets/rc1371-dashboard-personalization.js',
`function visibleLayout(state){
  var normalized=normalizeLayout(state,registry());normalized.widgets=normalized.widgets.filter(function(row){var def=registryStore.get(row.id);return!!def&&canUseWidget(def)&&row.visible!==false}).map(function(row,index){return Object.assign({},row,{order:index})});return normalized
}`,
`function visibleLayout(state){
  var requested=new Set((state&&Array.isArray(state.widgets)?state.widgets:[]).filter(function(row){return row&&row.visible!==false}).map(function(row){return cleanId(row.id)}));
  var normalized=normalizeLayout(state,registry());normalized.widgets=normalized.widgets.filter(function(row){var def=registryStore.get(row.id);return!!def&&canUseWidget(def)&&row.visible!==false&&(!def.generated||requested.has(row.id))}).map(function(row,index){return Object.assign({},row,{order:index})});return normalized
}`,
          'RC1371 visible quick access');

          patch('test/rc1371-dashboard-edit-mode.test.mjs',
`  assert.deepEqual(state.widgets.map(w=>w.id),['b','a']);`,
`  assert.deepEqual(state.widgets.filter(w=>w.id==='a'||w.id==='b').map(w=>w.id),['b','a']);`,
          'RC1371 local order assertion');
          NODE
      - name: Verify focused contracts
        run: |
          node --check assets/rc1371-dashboard-personalization.js
          node --check assets/rc1306-layout-engine.js
          node --test test/rc1306-true-layout-redesign.test.mjs test/rc1371-dashboard-personalization-state.test.mjs test/rc1371-dashboard-widget-registry.test.mjs test/rc1371-dashboard-edit-mode.test.mjs test/rc1371-dashboard-layout-integration.test.mjs test/rc1371-dashboard-i18n.test.mjs test/rc1371-dashboard-build-contract.test.mjs
      - name: Verify limited diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "assets/rc1306-layout-engine.js assets/rc1371-dashboard-personalization.js test/rc1371-dashboard-edit-mode.test.mjs "
      - name: Commit regression fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'exporthub-rc1371-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/rc1306-layout-engine.js assets/rc1371-dashboard-personalization.js test/rc1371-dashboard-edit-mode.test.mjs
          git commit -m 'fix: close RC1371 dashboard regression gaps'
          git push origin HEAD:feature/dashboard-personalization
