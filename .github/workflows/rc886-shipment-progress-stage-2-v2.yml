name: RC886 Shipment Progress Stage 2 v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc886-shipment-progress-v2
  cancel-in-progress: false

jobs:
  patch-testservice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Internal main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard RC885 baseline
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f TESTVERSION.html ]; then
            echo "::error title=TESTVERSION fehlt::TESTVERSION.html wurde im Repository nicht gefunden."
            exit 1
          fi
          VERSION="$(grep -o "version:'RC[0-9]*',cache:'[0-9]*',loginReturn:'/TESTVERSION.html?v=[0-9]*'" TESTVERSION.html | head -n1 | sed -E "s/version:'(RC[0-9]+)'.*/\1/")"
          echo "Detected TESTVERSION baseline: ${VERSION:-unbekannt}"
          if [ "$VERSION" != "RC885" ]; then
            echo "::error title=RC885 Voraussetzung fehlt::Erkannt wurde ${VERSION:-keine Version}. Bitte zuerst 'RC885 Productivity Stage 1 Recovery v2' erfolgreich ausführen. RC886 verändert in diesem Zustand nichts."
            exit 1
          fi
          required_marker() {
            local marker="$1"
            local label="$2"
            if ! grep -Fq "$marker" TESTVERSION.html; then
              echo "::error title=RC885 unvollständig::$label fehlt. Bitte RC885 Recovery v2 erneut prüfen, bevor RC886 gestartet wird."
              exit 1
            fi
          }
          required_marker "Produktivitätsstufe 1: globale Suche und Arbeitsfokus" "RC885 Release-Metadaten"
          required_marker 'id="exporthub-rc885-productivity-style"' "RC885 CSS"
          required_marker 'id="exporthub-rc885-productivity"' "RC885 Modul"
          required_marker 'ExportHUBProductivity885=Object.freeze' "RC885 Diagnose-API"
          required_marker 'Meine Arbeit heute' "RC885 Arbeitsfokus"
          required_marker '__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__' "RC884 Navigationsschutz"
          required_marker 'rc807ShipmentSearch' "RC884 Sendungssuche"
          required_marker 'function setShipmentCustomerSearchAuto(v)' "RC884 Kundenauswahl"
          if grep -Fq 'id="exporthub-rc886-shipment-progress"' TESTVERSION.html; then
            echo "::error title=RC886 bereits vorhanden::Der RC886-Modulmarker ist bereits in TESTVERSION.html vorhanden. Workflow wird sicher beendet, statt doppelt zu installieren."
            exit 1
          fi

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC885 backup tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-rc885-before-rc886-shipment-progress"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Backup tag already exists: $TAG"
          else
            git tag -a "$TAG" -m "Last known RC885 baseline before RC886 shipment progress"
            git push origin "$TAG"
          fi

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'TESTVERSION.html';
          let text = fs.readFileSync(path, 'utf8');
          const original = text;

          function replaceOnce(oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0) throw new Error(label + ': Ausgangsblock nicht gefunden');
            if (text.indexOf(oldText, first + oldText.length) >= 0) throw new Error(label + ': Ausgangsblock mehrfach gefunden');
            text = text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          replaceOnce(
            "var BUILD=Object.freeze({version:'RC885',cache:'885',loginReturn:'/TESTVERSION.html?v=885'});",
            "var BUILD=Object.freeze({version:'RC886',cache:'886',loginReturn:'/TESTVERSION.html?v=886'});",
            'Canonical BUILD'
          );

          replaceOnce(
            " version:'RC885',\n date:'30.08.2026',\n title:'Produktivitätsstufe 1: globale Suche und Arbeitsfokus',",
            " version:'RC886',\n date:'30.08.2026',\n title:'Produktivitätsstufe 2: Sendungsfortschritt und Dokumenten-Ampel',",
            'Release metadata'
          );

          const moduleBase64 = '';
          const moduleHtml = Buffer.from(moduleBase64, 'base64').toString('utf8');
          if (!moduleHtml.includes('exporthub-rc886-shipment-progress') || !moduleHtml.includes('ExportHUBShipmentProgress886')) throw new Error('RC886 Modul beschädigt');
          const bodyClose = text.lastIndexOf('</body>');
          if (bodyClose < 0) throw new Error('HTML body-Ende fehlt');
          text = text.slice(0, bodyClose) + '\n' + moduleHtml + '\n' + text.slice(bodyClose);

          const changesAnchor = " changes:Object.freeze([\n";
          const changesPos = text.indexOf(changesAnchor);
          if (changesPos < 0) throw new Error('Release changes: Anker fehlt');
          const newChanges =
            '    "RC886 ergänzt in Sendung erstellen und Sendungsansicht einen rein lesenden Sendungs-Fortschritt. Kunde, Empfänger, Colli, Lieferschein sowie bedingte ABD-, CMR- und POD-Schritte werden aus den bestehenden Sendungsdaten bewertet.",\n' +
            '    "RC886 ergänzt eine Dokumenten-Ampel für Lieferschein, Ladeliste, CMR, ABD und POD. Nicht erforderliche Dokumente werden ausdrücklich als nicht erforderlich gekennzeichnet und nicht künstlich als Fehler gewertet.",\n' +
            '    "RC886 zeigt die nächste sinnvolle Aktion und führt nur zu bereits vorhandenen ExportHUB-Bereichen oder Bedienelementen. Der neue Block schreibt selbst keine Fach-, Status- oder Teamdaten.",\n' +
            '    "RC886 ändert ausschließlich TESTVERSION.html. Produktion, APIs, Pickup, Location, Customer-Avis und Produktionskonfiguration bleiben unverändert.",\n';
          text = text.slice(0, changesPos + changesAnchor.length) + newChanges + text.slice(changesPos + changesAnchor.length);

          if (text === original) throw new Error('Keine Änderung erzeugt');
          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: Static RC886 safety tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('TESTVERSION.html', 'utf8');
          function required(rx, message) { if (!rx.test(text)) throw new Error(message); }

          required(/version:'RC886',cache:'886',loginReturn:'\/TESTVERSION\.html\?v=886'/, 'RC886 BUILD fehlt');
          required(/Produktivitätsstufe 2: Sendungsfortschritt und Dokumenten-Ampel/, 'RC886 Release-Metadaten fehlen');

          // Bestehende RC884/RC885 Funktionen müssen erhalten bleiben.
          required(/__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__/, 'RC884 Navigation-Guard fehlt');
          required(/rc807ShipmentSearch/, 'RC884 Sendungssuche fehlt');
          required(/function setShipmentCustomerSearchAuto\(v\)/, 'RC884 automatische Kundenauswahl fehlt');
          required(/id="exporthub-rc885-productivity-style"/, 'RC885 CSS fehlt');
          required(/id="exporthub-rc885-productivity"/, 'RC885 Modul fehlt');
          required(/ExportHUBProductivity885=Object\.freeze/, 'RC885 Diagnose-API fehlt');
          required(/Meine Arbeit heute/, 'RC885 Dashboard-Arbeitsfokus fehlt');
          required(/ctrlKey\|\|e\.metaKey/, 'RC885 Strg+K fehlt');

          // Neue RC886 Oberfläche und Logik.
          required(/id="exporthub-rc886-shipment-progress-style"/, 'RC886 CSS fehlt');
          required(/id="exporthub-rc886-shipment-progress"/, 'RC886 Modul fehlt');
          required(/__EXPORTHUB_RC886_SHIPMENT_PROGRESS__/, 'RC886 Single-Install-Guard fehlt');
          required(/ExportHUBShipmentProgress886=Object\.freeze/, 'RC886 Diagnose-API fehlt');
          required(/Sendungs-Fortschritt/, 'Sendungs-Fortschritt fehlt');
          required(/Dokumenten-Ampel/, 'Dokumenten-Ampel fehlt');
          required(/Nächste sinnvolle Aktion/, 'Nächste sinnvolle Aktion fehlt');
          required(/Ladeliste Seite 1/, 'Bestehender Ladelisten-Dokumenttyp wird nicht verwendet');
          required(/generatedActive\(sh,'CMR'\)/, 'CMR-Prüfung fehlt');
          required(/Verpackung · Anzahl · Gewicht/, 'Colli-Kernregel fehlt');
          required(/abdRequired/, 'Bedingte ABD-Prüfung fehlt');
          required(/picked\(sh\)/, 'Bedingte POD-Prüfung fehlt');

          const scriptStart = text.indexOf('<script id="exporthub-rc886-shipment-progress">');
          const bodyStart = text.indexOf('\n', scriptStart) + 1;
          const scriptEnd = text.indexOf('</script>', bodyStart);
          if (scriptStart < 0 || bodyStart <= 0 || scriptEnd < 0) throw new Error('RC886 Script kann nicht extrahiert werden');
          const js = text.slice(bodyStart, scriptEnd);
          new Function(js);

          // RC886 selbst bleibt eine UX-/Leseschicht. Keine eigenen Netzwerk-/Speicherschreibwege.
          if (/localStorage\.setItem|fetch\s*\(|queueSave\s*\(|XMLHttpRequest/.test(js)) throw new Error('RC886 enthält einen unerlaubten eigenen Speicher-/Netzwerkweg');
          if (/\bsh\.(status|processStatus|abdStatus|podFiles|generatedDocuments)\s*=/.test(js)) throw new Error('RC886 verändert Fachstatus oder Dokumentdaten');
          console.log('RC886 static safety tests: PASS');
          NODE

      - name: Verify production scope untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json; then
            echo "ERROR: Production/API/public files changed."
            git diff -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json
            exit 1
          fi
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "TESTVERSION.html"

      - name: Write RC886 test report
        shell: bash
        run: |
          cat > RC886_PRUEFBERICHT.txt <<'EOF'
          TESTBERICHT RC886 – PRODUKTIVITÄTSSTUFE 2

          Scope:
          - Ausschließlich TESTSERVICE / TESTVERSION.html
          - Keine Produktionsdatei und keine API geändert
          - RC884 Navigation/Suche und RC885 globale Suche/Arbeitsfokus bleiben erhalten

          Neue Funktionen:
          1. Sendungs-Fortschritt
             - In Sendung erstellen und Sendungsansicht
             - Kunde
             - Empfänger / Adresse
             - Colli: Verpackung + Anzahl + Gewicht
             - Lieferschein
             - ABD nur wenn erforderlich
             - Ladeliste
             - CMR nur bei Ausland
             - POD erst nach Abholung
             - Prozentanzeige und x von y vollständig

          2. Dokumenten-Ampel
             - LS
             - Ladeliste
             - CMR
             - ABD
             - POD
             - Unnötige Dokumente werden als "Nicht erforderlich" dargestellt

          3. Nächste sinnvolle Aktion
             - Zeigt den ersten echten offenen Prozessschritt
             - Verwendet bestehende ExportHUB-Bedienelemente/Routen
             - Keine automatische Statusänderung
             - Keine zweite Speicherlogik

          Verbindlicher Live-Test im Testservice:
          A. Testservice öffnen und Version prüfen.
             Erwartung: RC886.

          B. Neue Sendung öffnen.
             Erwartung: Direkt unter dem Seitenkopf erscheint "Sendungs-Fortschritt".

          C. Kunde auswählen und Empfänger/Adresse prüfen.
             Erwartung: Kunde und Empfänger wechseln von offen auf vollständig, ohne zusätzliche Bestätigung.

          D. Colli erfassen.
             Erwartung: Eine Zeile ist vollständig, sobald Verpackung, Anzahl > 0 und Gewicht > 0 vorhanden sind. Maße/LDM sind keine künstliche Pflicht.

          E. Lieferschein hochladen/hinterlegen.
             Erwartung: LS in der Dokumenten-Ampel = Vorhanden.

          F. Inlandssendung Deutschland prüfen.
             Erwartung: CMR = Nicht erforderlich und blockiert den Fortschritt nicht.

          G. Auslandssendung prüfen.
             Erwartung: CMR wird zum erforderlichen Schritt. Nach vorhandener aktiver CMR-Version wird CMR grün.

          H. Sendung mit ABD-Pflicht prüfen.
             Erwartung: ABD erscheint als Pflichtschritt. Ohne ABD ist die nächste sinnvolle Aktion ABD; mit vorhandenem ABD wird der Schritt vollständig.

          I. Nicht abgeholte Sendung prüfen.
             Erwartung: POD ist noch keine Pflicht.

          J. Abgeholte Sendung ohne POD prüfen.
             Erwartung: POD wird jetzt Pflicht und als nächste sinnvolle Aktion angezeigt.

          K. Abgeholte Sendung mit echtem POD prüfen.
             Erwartung: POD = Vorhanden.

          L. Strg+K drücken und Dashboard öffnen.
             Erwartung: RC885 globale Suche und "Meine Arbeit heute" funktionieren weiterhin.

          M. Aus Sendungsansicht nacheinander Aufgaben, Dashboard und Kunden öffnen.
             Erwartung: RC884 Navigation bleibt stabil; kein Zurückspringen in Sendungsansicht.

          N. Sendung erstellen prüfen.
             Erwartung: "Kunde übernehmen", "Adresse geprüft und bestätigt" und interner Kunden-Avis bleiben entfernt.

          O. Fehlerdiagnose exportieren.
             Erwartung: version = RC886 und keine neue RC886 JavaScript-Exception.
          EOF

      - name: Commit RC886 testservice
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html RC886_PRUEFBERICHT.txt
          git commit -m "RC886: add shipment progress document traffic light and next action"
          git push origin main
