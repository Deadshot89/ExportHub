name: RC995 Apply + Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc995-audit-red.yml'
      - '.github/rc995/apply.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Produktionsmarker absichern
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RC990' production-version.js
          if grep -q 'RC995' production-version.js; then exit 1; fi

      - name: RC995 Stage und Client anwenden
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rc995/apply.py

      - name: RC995 Vertrag und Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          for f in api/shared/public-access-store.js api/shared/merge.js api/pickup-init/index.js api/pickup-status/index.js api/pickup-confirm-v2/index.js api/pickup-pod/index.js api/pod-backup/index.js api/customer-avis/index.js; do node --check "$f"; done
          node --test .github/rc995/rc995-contract.test.mjs
          grep -q "version:'RC995'" TESTVERSION.html
          grep -q 'data-rc995-print-qr' TESTVERSION.html
          grep -q 'RC995_CUSTOMER_CONFIRMATION_AVIS_ONLY' TESTVERSION.html
          grep -q 'customerAvisToken' api/shared/merge.js
          grep -Eq 'pickupToken|qrToken' api/shared/merge.js
          grep -q 'delete next\[key\]' api/shared/merge.js
          grep -q 'RC990' production-version.js
          if grep -q 'RC995' production-version.js; then exit 1; fi

      - name: Bestehende Kernregressionen
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for f in test/rc917-pickup-token-contract.test.mjs test/rc965-avis-retry-performance.test.mjs test/rc969-conditional-state-read.test.mjs test/rc970-auth-etag-cache.test.mjs test/rc975-global-render-integrity.test.mjs test/rc980-colli-row-stability.test.mjs test/rc990-check.test.mjs test/rc991-check.test.mjs test/rc992-check.test.mjs; do
            [ -f "$f" ] && tests+=("$f")
          done
          if [ ${#tests[@]} -gt 0 ]; then node --test "${tests[@]}"; else echo 'Keine optionalen Regressionstests vorhanden.'; fi

      - name: RC995 Nutzdateien committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TESTVERSION.html api
          git diff --cached --check
          if git diff --cached --name-only | grep -qx 'production-version.js'; then exit 1; fi
          if git diff --cached --quiet; then echo 'Keine Änderungen'; exit 0; fi
          git commit -m 'RC995: QR-Abholung und Kunden-Avis sicher aktivieren'
          git push origin HEAD:main
