name: RC1483 Targeted TDD

on:
  push:
    branches: [rc1483-i18n-save-performance]

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rc1483-i18n-save-performance
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: RC1483 minimalen Save-I18N-Fix anwenden
        shell: python
        run: |
          from pathlib import Path

          dynamic = Path('api/shared/dynamic-i18n.js')
          text = dynamic.read_text()
          old = "function collect(root,fallback='de'){\n const rows=[],seen=new WeakSet();"
          new = "function collect(root,fallback='de',options={}){\n const retryPending=options.retryPending!==false,rows=[],seen=new WeakSet();"
          if old in text:
              assert text.count(old) == 1, 'collect-Signatur nicht eindeutig'
              text = text.replace(old, new)
          else:
              assert new in text, 'collect-Signatur weder alt noch RC1483'

          old = "    const original=text(current),source=sourceLanguageFor(value,key,fallback),previous=value[SIDE_CAR][key];\n    const meta=stableMeta(original,source,previous);\n    value[SIDE_CAR][key]=meta;\n    if(!complete(meta)||text(meta.originalText)!==original)rows.push({object:value,key,original,source,meta});"
          new = "    const original=text(current),source=sourceLanguageFor(value,key,fallback),previous=value[SIDE_CAR][key],sourceHash=hashText(original);\n    const samePrevious=!!(previous&&text(previous.originalText)===original&&text(previous.sourceHash)===sourceHash);\n    const meta=stableMeta(original,source,previous);\n    value[SIDE_CAR][key]=meta;\n    if(!complete(meta)&&(retryPending||!samePrevious))rows.push({object:value,key,original,source,meta});"
          if old in text:
              assert text.count(old) == 1, 'collect-Auswahl nicht eindeutig'
              text = text.replace(old, new)
          else:
              assert new in text, 'collect-Auswahl weder alt noch RC1483'

          old = "const sourceFallback=normalizeLanguage(fallbackLanguage),rows=collect(root,sourceFallback),limit=Math.max(1,Math.min(1000,Number(options.limit||50)||50));"
          new = "const sourceFallback=normalizeLanguage(fallbackLanguage),rows=collect(root,sourceFallback,options),limit=Math.max(1,Math.min(1000,Number(options.limit||50)||50));"
          if old in text:
              assert text.count(old) == 1, 'enrich-collect-Aufruf nicht eindeutig'
              text = text.replace(old, new)
          else:
              assert new in text, 'enrich-collect-Aufruf weder alt noch RC1483'
          dynamic.write_text(text)

          state = Path('api/exporthub-state/index.js')
          text = state.read_text()
          old = "const dynamicI18nReport=await enrichDynamicTranslations(merged,normalizeDynamicLanguage(writeUser.language||writeUser.uiLanguage||'de'),{limit:Number(process.env.EXPORTHUB_I18N_SAVE_LIMIT||50)||50});"
          new = "const dynamicI18nReport=await enrichDynamicTranslations(merged,normalizeDynamicLanguage(writeUser.language||writeUser.uiLanguage||'de'),{limit:Number(process.env.EXPORTHUB_I18N_SAVE_LIMIT||50)||50,retryPending:false});"
          if old in text:
              assert text.count(old) == 1, 'saveMerged-I18N-Aufruf nicht eindeutig'
              text = text.replace(old, new)
          else:
              assert new in text, 'saveMerged-I18N-Aufruf weder alt noch RC1483'
          state.write_text(text)
      - name: RC1483 fokussierte Regression
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --test tests/rc1267-dynamic-i18n.test.cjs tests/rc1483-i18n-save-performance.test.cjs
      - name: RC1483 Fix committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- api/shared/dynamic-i18n.js api/exporthub-state/index.js; then
            echo 'RC1483 Fix bereits enthalten.'
            exit 0
          fi
          test "$(git diff --name-only -- api/shared/dynamic-i18n.js api/exporthub-state/index.js | sort | tr '\n' ' ')" = "api/exporthub-state/index.js api/shared/dynamic-i18n.js "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/shared/dynamic-i18n.js api/exporthub-state/index.js
          git commit -m 'fix(RC1483): keep failed translation retries off normal saves'
          git push origin HEAD:rc1483-i18n-save-performance
