name: RC1505 Historical Shell Diagnostic

on:
  push:
    branches:
      - debug/rc1505-build-contract-20261013

permissions:
  contents: read

concurrency:
  group: rc1505-historical-shell-${{ github.sha }}
  cancel-in-progress: true

jobs:
  diagnose-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Normalize sources like Main Verification
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1018/apply-public-language.mjs
          node .github/rc1018/fix-mail-wording.mjs

      - name: Build and verify known-green contracts
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1112/build-three-env.mjs
          node .github/rc1121/verify-final-html.mjs
          node .github/rc1505/verify-build-contract.mjs

      - name: Historical shell 01 Lieferavis marker
        shell: bash
        run: grep -Fq 'assets/rc1015-lieferavis-mail-flow.js?v=1383' dist-rc1112/index.html

      - name: Historical shell 02 mail-language marker
        shell: bash
        run: grep -Fq 'assets/rc1018-mail-language-standard.js?v=1018' dist-rc1112/index.html

      - name: Historical shell 03 public-language marker in index
        shell: bash
        run: grep -Fq 'assets/rc1018-public-language.js?v=1018' dist-rc1112/index.html

      - name: Historical shell 04 registration-cc marker
        shell: bash
        run: grep -Fq 'assets/rc1065-registration-cc.js?v=1093' dist-rc1112/index.html

      - name: Historical shell 05 shipment-overview runtime marker
        shell: bash
        run: grep -Fq 'assets/rc1014-shipment-overview.js?v=1370' dist-rc1112/index.html

      - name: Historical shell 06 shipment-overview style marker
        shell: bash
        run: grep -Fq 'assets/rc1014-shipment-overview.css?v=1370' dist-rc1112/index.html

      - name: Historical shell 07 mobile-navigation file
        shell: bash
        run: test -s dist-rc1112/assets/rc1016-mobile-navigation.js

      - name: Historical shell 08 multi-truck file
        shell: bash
        run: test -s dist-rc1112/assets/rc1017-multi-truck.js

      - name: Historical shell 09 mail-language file
        shell: bash
        run: test -s dist-rc1112/assets/rc1018-mail-language-standard.js

      - name: Historical shell 10 public-language file
        shell: bash
        run: test -s dist-rc1112/assets/rc1018-public-language.js

      - name: Historical shell 11 abholkalender file
        shell: bash
        run: test -s dist-rc1112/assets/abholkalender.js

      - name: Historical shell 12 abholkalender runtime file
        shell: bash
        run: test -s dist-rc1112/assets/rc1012-abholkalender-runtime.js

      - name: Historical shell 13 lieferavis immediate file
        shell: bash
        run: test -s dist-rc1112/assets/rc1027-lieferavis-immediate.js

      - name: Historical shell 14 lieferavis timing diagnostics file
        shell: bash
        run: test -s dist-rc1112/assets/rc1037-lieferavis-timing-diagnostics.js

      - name: Historical shell 15 abd avis policy file
        shell: bash
        run: test -s dist-rc1112/assets/rc1049-abd-avis-policy.js
