name: RC1557 no-op save TDD

on:
  push:
    branches:
      - fix/storage-noop-saves

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: RED - regression must fail before implementation
        shell: bash
        run: |
          set +e
          node --test test/rc1557-storage-noop-save.test.mjs > /tmp/rc1557-red.log 2>&1
          status=$?
          set -e
          cat /tmp/rc1557-red.log
          if [ "$status" -eq 0 ]; then
            echo "RC1557 regression unexpectedly passed before implementation"
            exit 1
          fi
          echo "RED confirmed: regression fails on the unpatched implementation"

      - name: Apply minimal no-op save fix
        run: node scripts/rc1557-apply-storage-noop.mjs

      - name: GREEN - targeted regression
        run: node --test test/rc1557-storage-noop-save.test.mjs

      - name: Full regression suite
        run: npm test

      - name: Commit verified implementation and remove one-shot patcher
        shell: bash
        run: |
          rm scripts/rc1557-apply-storage-noop.mjs
          rm .github/workflows/rc1557-noop-save-tdd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/exporthub-state/index.js test/rc1557-storage-noop-save.test.mjs scripts/rc1557-apply-storage-noop.mjs .github/workflows/rc1557-noop-save-tdd.yml
          git commit -m "fix: skip no-op state blob uploads"
          git push origin HEAD:fix/storage-noop-saves
