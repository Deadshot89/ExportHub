name: RC1018 SOP Systembilder erfassen

on:
  push:
    branches: [rc1018-sop-system-images]
    paths:
      - 'browser/rc1018-sop-screenshots.mjs'
      - 'assets/sop/rc1018-sop-system-images.js'
      - 'test/rc1018-sop-system-images.test.mjs'
      - '.github/rc1018/build-three-env.mjs'
      - '.github/workflows/rc1018-sop-screenshot-capture.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc1018-sop-screenshot-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: RC1018 Demo bauen
        run: node .github/rc1018/build-three-env.mjs
      - name: Chromium bereitstellen
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Echte Demo-Systembilder aufnehmen
        shell: bash
        env:
          RC1018_BROWSER_URL: http://127.0.0.1:4173/demo.html
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist-rc1018 >/tmp/rc1018-sop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/demo.html >/dev/null; then break; fi
            sleep 1
          done
          node browser/rc1018-sop-screenshots.mjs
      - name: Systembilder in SOP-Assets übernehmen und prüfen
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/rc1018-sop-screenshots/*.png assets/sop/screenshots/
          test "$(find assets/sop/screenshots -maxdepth 1 -name 'rc1018-*.png' | wc -l)" -eq 9
          node --test test/rc1018-sop-system-images.test.mjs
          git diff --check
      - name: Echte Systembilder versionieren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Deadshot89'
          git config user.email '86518220+Deadshot89@users.noreply.github.com'
          git add assets/sop/screenshots/rc1018-*.png
          if git diff --cached --quiet; then
            echo 'Systembilder bereits aktuell.'
            exit 0
          fi
          git commit -m 'chore: echte RC1018 SOP-Systembilder erfassen'
          git push origin HEAD:rc1018-sop-system-images
      - name: Browserbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC1018-SOP-Systembilder
          path: artifacts/rc1018-sop-screenshots
          if-no-files-found: warn
          retention-days: 30
