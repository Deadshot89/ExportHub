name: RC943 Sendung erstellen Felder entfernen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc943-remove-shipment-fields.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rc943-remove-shipment-fields
  cancel-in-progress: false

jobs:
  patch_verify_deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED – die zwei sichtbaren Felder sind in RC942 noch vorhanden
        id: red
        continue-on-error: true
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'" in text, 'Basis ist nicht exakt RC942.'

          def target_blocks(label, handler):
              matches=[]
              pos=0
              while True:
                  i=text.find(label,pos)
                  if i<0: break
                  start=text.rfind('<label',max(0,i-900),i+1)
                  end=text.find('</label>',i)
                  if start>=0 and end>=0:
                      end+=len('</label>')
                      block=text[start:end]
                      if handler in block:
                          matches.append((start,end,block))
                  pos=i+1
              unique=[]
              seen=set()
              for m in matches:
                  key=(m[0],m[1])
                  if key not in seen:
                      seen.add(key); unique.append(m)
              return unique

          planned=target_blocks('Geplantes Abholdatum','setShipmentPickupDate(this.value)')
          carrier=target_blocks('Spedition','state.shipment.carrier=this.value')
          print('Geplantes Abholdatum Zielblöcke:',len(planned))
          print('Spedition Zielblöcke:',len(carrier))
          assert len(planned)==1, f'Geplantes Abholdatum: erwartet genau 1 Zielblock, gefunden {len(planned)}'
          assert len(carrier)==1, f'Spedition: erwartet genau 1 Zielblock, gefunden {len(carrier)}'
          # TDD RED: Solange die unerwünschten Felder vorhanden sind, muss diese Prüfung scheitern.
          assert not planned, 'Geplantes Abholdatum ist noch sichtbar.'
          assert not carrier, 'Spedition ist noch sichtbar.'
          PY

      - name: RED-Ergebnis verifizieren
        shell: bash
        env:
          RED_OUTCOME: ${{ steps.red.outcome }}
        run: |
          if [[ "$RED_OUTCOME" != "failure" ]]; then
            echo "RED ist nicht wie erwartet fehlgeschlagen. RC942 wird nicht verändert."
            exit 1
          fi
          echo "RED bestätigt: Beide unerwünschten Felder sind vor dem Patch vorhanden."

      - name: RC943 – nur die zwei Eingabefelder aus Sendung erstellen entfernen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('TESTVERSION.html')
          text=p.read_text(encoding='utf-8')

          old_build="version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'"
          new_build="version:'RC943',cache:'943',loginReturn:'/TESTVERSION.html?v=943'"
          if text.count(old_build)!=1:
              raise SystemExit(f'BUILD-Version: erwartet 1 RC942-Marker, gefunden {text.count(old_build)}')
          text=text.replace(old_build,new_build,1)

          marker="changes:Object.freeze([\n"
          if text.count(marker)!=1:
              raise SystemExit(f'Release-Anker nicht eindeutig: {text.count(marker)}')
          note="    'RC943 entfernt in Sendung erstellen die sichtbaren Eingabefelder Geplantes Abholdatum und Spedition. Die vorhandenen Abhol-, Aufgaben-, QR-, Speditions- und Dokumentdatenpfade bleiben unverändert erhalten.',\n"
          text=text.replace(marker,marker+note,1)

          def remove_target_label(source,label,handler):
              matches=[]
              pos=0
              while True:
                  i=source.find(label,pos)
                  if i<0: break
                  start=source.rfind('<label',max(0,i-900),i+1)
                  end=source.find('</label>',i)
                  if start>=0 and end>=0:
                      end+=len('</label>')
                      block=source[start:end]
                      if handler in block:
                          matches.append((start,end,block))
                  pos=i+1
              unique=[]
              seen=set()
              for m in matches:
                  key=(m[0],m[1])
                  if key not in seen:
                      seen.add(key); unique.append(m)
              if len(unique)!=1:
                  raise SystemExit(f'{label}: erwartet genau 1 Zielblock, gefunden {len(unique)}')
              start,end,block=unique[0]
              print(f'Entferne {label}:',repr(block[:500]))
              return source[:start]+source[end:]

          text=remove_target_label(text,'Geplantes Abholdatum','setShipmentPickupDate(this.value)')
          text=remove_target_label(text,'Spedition','state.shipment.carrier=this.value')
          p.write_text(text,encoding='utf-8')
          PY

      - name: GREEN – RC943 Anforderungen und bestehende Datenpfade prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')

          def has_target(label,handler):
              pos=0
              while True:
                  i=text.find(label,pos)
                  if i<0: return False
                  start=text.rfind('<label',max(0,i-900),i+1)
                  end=text.find('</label>',i)
                  if start>=0 and end>=0 and handler in text[start:end+len('</label>')]:
                      return True
                  pos=i+1

          assert "version:'RC943',cache:'943',loginReturn:'/TESTVERSION.html?v=943'" in text
          assert "version:'RC942',cache:'942',loginReturn:'/TESTVERSION.html?v=942'" not in text
          assert 'RC943 entfernt in Sendung erstellen die sichtbaren Eingabefelder Geplantes Abholdatum und Spedition' in text
          assert not has_target('Geplantes Abholdatum','setShipmentPickupDate(this.value)')
          assert not has_target('Spedition','state.shipment.carrier=this.value')

          # Andere Anzeigen und sämtliche zugrunde liegende Logik bleiben erhalten.
          assert text.count('Geplantes Abholdatum') >= 1, 'Andere Abholdatum-Anzeige wurde versehentlich entfernt.'
          assert 'Spedition informieren' in text, 'Speditionsprozess wurde versehentlich verändert.'
          assert 'function setShipmentPickupDate(v)' in text
          assert 'function updateSavedShipmentPickupDate(id,v)' in text
          assert 'function createOrUpdateShipmentCreatedTask(s,c)' in text
          for token in ['actualPickupDate','plannedPickupDate','pickupDate','carrier','pickup-status','shipmentRecipientAddress','Ladeliste/CMR','Verlader']:
              assert token in text, f'Bestehender Datenpfad fehlt: {token}'
          print('GREEN: Nur die zwei sichtbaren Felder in Sendung erstellen sind entfernt; bestehende Datenpfade bleiben vorhanden.')
          PY

      - name: Diff und Integrität prüfen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          grep -m1 -oE "version:'RC[0-9]+'" TESTVERSION.html
          git diff -- TESTVERSION.html

      - name: RC943 nach main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TESTVERSION.html
          if git diff --cached --quiet; then
            echo "Keine Änderung erzeugt – Abbruch."
            exit 1
          fi
          git commit -m "RC943 Sendung erstellen Felder entfernen"
          git push origin HEAD:main

      - name: Temporären RC943-Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm .github/workflows/rc943-remove-shipment-fields.yml
          git commit -m "RC943 temporären Patch-Workflow entfernen"
          git push origin HEAD:main

      - name: TESTSERVICE-Deploy für RC943 auslösen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/exporthub-testservice-final-artifact-fix.yml/dispatches" \
            -d '{"ref":"main"}')"
          cat /tmp/dispatch.out || true
          [[ "$code" == "204" ]] || { echo "Dispatch fehlgeschlagen: HTTP $code"; exit 1; }
          echo "TESTSERVICE-Deploy RC943 ausgelöst."
