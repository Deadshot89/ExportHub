name: RC888 Professional Workflow Stage 4 v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc888-professional-v2
  cancel-in-progress: false

jobs:
  patch-testservice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Internal main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard RC887 baseline
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f TESTVERSION.html ]; then
            echo "::error title=TESTVERSION fehlt::TESTVERSION.html wurde im Repository nicht gefunden."
            exit 1
          fi
          VERSION="$(grep -o "version:'RC[0-9]*',cache:'[0-9]*',loginReturn:'/TESTVERSION.html?v=[0-9]*'" TESTVERSION.html | head -n1 | sed -E "s/version:'(RC[0-9]+)'.*/\1/")"
          echo "Detected TESTVERSION baseline: ${VERSION:-unbekannt}"
          if [ "$VERSION" != "RC887" ]; then
            echo "::error title=RC887 Voraussetzung fehlt::Erkannt wurde ${VERSION:-keine Version}. Bitte zuerst 'RC887 Quick Work Stage 3 v2' erfolgreich ausführen. RC888 verändert in diesem Zustand nichts."
            exit 1
          fi
          required_marker() {
            local marker="$1"
            local label="$2"
            if ! grep -Fq "$marker" TESTVERSION.html; then
              echo "::error title=RC887 unvollständig::$label fehlt. RC888 wird aus Sicherheitsgründen nicht installiert."
              exit 1
            fi
          }
          required_marker "Produktivitätsstufe 3: Favoriten, Vorlagen und Schnellerfassung" "RC887 Release-Metadaten"
          required_marker 'id="exporthub-rc885-productivity"' "RC885 Produktivitätsmodul"
          required_marker 'ExportHUBProductivity885=Object.freeze' "RC885 Diagnose-API"
          required_marker 'id="exporthub-rc886-shipment-progress"' "RC886 Fortschrittsmodul"
          required_marker 'ExportHUBShipmentProgress886=Object.freeze' "RC886 Diagnose-API"
          required_marker 'id="exporthub-rc887-quickwork"' "RC887 Schnellarbeitsmodul"
          required_marker 'ExportHUBQuickWork887=Object.freeze' "RC887 Diagnose-API"
          required_marker '__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__' "RC884 Navigationsschutz"
          required_marker 'rc807ShipmentSearch' "RC884 Sendungssuche"
          if grep -Fq 'id="exporthub-rc888-professional"' TESTVERSION.html; then
            echo "::error title=RC888 bereits vorhanden::Der RC888-Modulmarker ist bereits vorhanden. Workflow beendet sicher, statt doppelt zu installieren."
            exit 1
          fi

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC887 backup tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-rc887-before-rc888-professional"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Backup tag already exists: $TAG"
          else
            git tag -a "$TAG" -m "Last known RC887 baseline before RC888 professional workflow"
            git push origin "$TAG"
          fi

      - name: Patch TESTVERSION only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'TESTVERSION.html';
          let text = fs.readFileSync(path, 'utf8');
          const original = text;

          function replaceOnce(oldText, newText, label) {
            const first = text.indexOf(oldText);
            if (first < 0) throw new Error(label + ': Ausgangsblock nicht gefunden');
            if (text.indexOf(oldText, first + oldText.length) >= 0) throw new Error(label + ': Ausgangsblock mehrfach gefunden');
            text = text.slice(0, first) + newText + text.slice(first + oldText.length);
          }

          replaceOnce(
            "var BUILD=Object.freeze({version:'RC887',cache:'887',loginReturn:'/TESTVERSION.html?v=887'});",
            "var BUILD=Object.freeze({version:'RC888',cache:'888',loginReturn:'/TESTVERSION.html?v=888'});",
            'Canonical BUILD'
          );

          replaceOnce(
            " version:'RC887',\n date:'30.08.2026',\n title:'Produktivitätsstufe 3: Favoriten, Vorlagen und Schnellerfassung',",
            " version:'RC888',\n date:'30.08.2026',\n title:'Produktivitätsstufe 4: Arbeitsübergabe, Prozess-Timeline und Performance-Monitor',",
            'Release metadata'
          );

          const moduleBase64 = '';
          const moduleHtml = Buffer.from(moduleBase64, 'base64').toString('utf8');
          if (!moduleHtml.includes('exporthub-rc888-professional') || !moduleHtml.includes('ExportHUBProfessional888')) throw new Error('RC888 Modul beschädigt');
          const bodyClose = text.lastIndexOf('</body>');
          if (bodyClose < 0) throw new Error('HTML body-Ende fehlt');
          text = text.slice(0, bodyClose) + '\n' + moduleHtml + '\n' + text.slice(bodyClose);

          const changesAnchor = " changes:Object.freeze([\n";
          const changesPos = text.indexOf(changesAnchor);
          if (changesPos < 0) throw new Error('Release changes: Anker fehlt');
          const newChanges =
            '    "RC888 ergänzt auf dem Dashboard eine Arbeitsübergabe mit Überfälligem, heutigen Punkten, offenen ABDs, fehlenden PODs und wartenden Vorgängen. Die Zusammenfassung ist rein lesend und kann in die Zwischenablage kopiert werden.",\n' +
            '    "RC888 ergänzt in Sendung erstellen und Sendungsansicht eine Prozess-Timeline. Es werden ausschließlich tatsächlich vorhandene Zeitstempel aus Sendung und Dokumenten angezeigt; fehlende Ereigniszeiten werden nicht erfunden.",\n' +
            '    "RC888 ergänzt für eindeutig erkannte Admin-Benutzer einen Browser-Performance-Monitor für UI-Reaktionszeit, vorhandene API/Storage-Resource-Timings, Long Tasks und DOM-Größe. Der Monitor erzeugt keine zusätzlichen API-Aufrufe.",\n' +
            '    "RC888 ändert ausschließlich TESTVERSION.html. Produktion, APIs, Pickup, Location, Customer-Avis und Produktionskonfiguration bleiben unverändert.",\n';
          text = text.slice(0, changesPos + changesAnchor.length) + newChanges + text.slice(changesPos + changesAnchor.length);

          if (text === original) throw new Error('Keine Änderung erzeugt');
          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: Static RC888 safety tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('TESTVERSION.html', 'utf8');
          function required(rx, message) { if (!rx.test(text)) throw new Error(message); }

          required(/version:'RC888',cache:'888',loginReturn:'\/TESTVERSION\.html\?v=888'/, 'RC888 BUILD fehlt');
          required(/Produktivitätsstufe 4: Arbeitsübergabe, Prozess-Timeline und Performance-Monitor/, 'RC888 Release-Metadaten fehlen');

          required(/__EXPORTHUB_RC843_RELEASE_SHIPMENT_VIEW__/, 'RC884 Navigation-Guard fehlt');
          required(/rc807ShipmentSearch/, 'RC884 Sendungssuche fehlt');
          required(/id="exporthub-rc885-productivity"/, 'RC885 Produktivitätsmodul fehlt');
          required(/ExportHUBProductivity885=Object\.freeze/, 'RC885 Diagnose-API fehlt');
          required(/id="exporthub-rc886-shipment-progress"/, 'RC886 Fortschrittsmodul fehlt');
          required(/ExportHUBShipmentProgress886=Object\.freeze/, 'RC886 Diagnose-API fehlt');
          required(/id="exporthub-rc887-quickwork"/, 'RC887 Schnellarbeitsmodul fehlt');
          required(/ExportHUBQuickWork887=Object\.freeze/, 'RC887 Diagnose-API fehlt');

          required(/id="exporthub-rc888-professional-style"/, 'RC888 CSS fehlt');
          required(/id="exporthub-rc888-professional"/, 'RC888 Modul fehlt');
          required(/__EXPORTHUB_RC888_PROFESSIONAL__/, 'RC888 Single-Install-Guard fehlt');
          required(/ExportHUBProfessional888=Object\.freeze/, 'RC888 Diagnose-API fehlt');
          required(/Arbeitsübergabe/, 'RC888 Arbeitsübergabe fehlt');
          required(/Sendungs-Timeline/, 'RC888 Timeline fehlt');
          required(/Performance-Monitor/, 'RC888 Performance-Monitor fehlt');
          required(/Nur vorhandene Zeitstempel werden angezeigt/, 'RC888 Timeline-Sicherheitsbeschreibung fehlt');
          required(/Keine zusätzlichen API-Aufrufe/, 'RC888 Performance-Sicherheitsbeschreibung fehlt');

          const scriptStart = text.indexOf('<script id="exporthub-rc888-professional">');
          const bodyStart = text.indexOf('\n', scriptStart) + 1;
          const scriptEnd = text.indexOf('</script>', bodyStart);
          if (scriptStart < 0 || bodyStart <= 0 || scriptEnd < 0) throw new Error('RC888 Script kann nicht extrahiert werden');
          const js = text.slice(bodyStart, scriptEnd);
          new Function(js);

          if (/fetch\s*\(|XMLHttpRequest|sendBeacon\s*\(|WebSocket\s*\(/.test(js)) throw new Error('RC888 enthält unerlaubten Netzwerkweg');
          if (/localStorage|sessionStorage/.test(js)) throw new Error('RC888 führt unerwartete Browser-Datenspeicherung ein');
          if (/queueSave\s*\(|saveShipment\s*\(|saveTeam|azureSave|teamSave/.test(js)) throw new Error('RC888 enthält unerlaubten Speicherweg');
          if (/state\(\)\.shipments\s*=|\.shipments\.push\s*\(/.test(js)) throw new Error('RC888 schreibt direkt in gespeicherte Sendungen');
          if (!/PerformanceObserver/.test(js) || !/performance\.getEntriesByType/.test(js)) throw new Error('RC888 Performance-Messung fehlt');
          if (!/isAdmin\(\)/.test(js)) throw new Error('RC888 Admin-Gating fehlt');
          console.log('RC888 static safety tests: PASS');
          NODE

      - name: Verify production scope untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json; then
            echo "ERROR: Production/API/public files changed."
            git diff -- index.html production-version.js api pickup.html location.html customer-avis.html staticwebapp.config.json staticwebapp.testservice.config.json
            exit 1
          fi
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "TESTVERSION.html"

      - name: Write RC888 test report
        shell: bash
        run: |
          cat > RC888_PRUEFBERICHT.txt <<'EOF'
          TESTBERICHT RC888 – PRODUKTIVITÄTSSTUFE 4

          Scope:
          - Ausschließlich TESTSERVICE / TESTVERSION.html
          - Keine Produktionsdatei und keine API geändert
          - RC884 Navigation/Suche, RC885 Arbeitsfokus, RC886 Fortschritt und RC887 Schnellarbeit bleiben erhalten

          Neue Funktionen:
          1. Arbeitsübergabe
             - Dashboard fasst Überfälliges, Heute, ABD offen, POD fehlt und Wartet auf andere zusammen
             - Offene Sendungen können direkt geöffnet werden
             - "Übergabe kopieren" erzeugt einen Text für Schicht-/Vertretungsübergabe
             - Keine Aufgabe und kein Sendungsstatus wird automatisch geändert

          2. Sendungs-Timeline
             - Sichtbar in Sendung erstellen und Sendungsansicht, sobald eine Sendung geladen ist
             - Verwendet vorhandene Zeitstempel für Erstellung, LS, ABD, Ladeliste, CMR, Bereitstellung, Abholung, POD und Abschluss
             - Fehlende Zeitstempel werden nicht geschätzt oder erfunden
             - Aktueller Status wird zusätzlich als Live-Stand angezeigt

          3. Admin Performance-Monitor
             - Nur sichtbar, wenn der bestehende Benutzerzustand eindeutig Admin-Rechte signalisiert
             - Misst UI-Reaktion im Browser
             - Liest vorhandene Resource-Timings für API/Storage
             - Erkennt Browser Long Tasks, falls unterstützt
             - Keine zusätzlichen Netzwerkaufrufe und keine Datenspeicherung

          Verbindlicher Live-Test im Testservice:
          A. Testservice öffnen.
             Erwartung: Version RC888.

          B. Dashboard öffnen.
             Erwartung: "Meine Arbeit heute", "Favoriten & Vorlagen" und darunter "Arbeitsübergabe".

          C. Übergabekacheln prüfen.
             Erwartung: Werte werden aus aktuell geladenen Aufgaben/Sendungen berechnet. Keine erfundenen Einträge.

          D. "Übergabe kopieren" anklicken.
             Erwartung: Text wird kopiert, Seite navigiert nicht weg und keine Daten werden gespeichert.

          E. Eine gespeicherte Sendung mit mehreren Prozessschritten öffnen.
             Erwartung: "Sendungs-Timeline" erscheint unter den Produktivitätskarten.

          F. Timeline mit echten Daten vergleichen.
             Erwartung: Nur Ereignisse mit vorhandenem Zeitstempel zeigen Datum/Uhrzeit. Der aktuelle Status steht separat.

          G. Eine Sendung ohne ABD/CMR/POD öffnen.
             Erwartung: Es werden keine erfundenen ABD-/CMR-/POD-Zeitpunkte angezeigt.

          H. Als normaler Benutzer Dashboard öffnen.
             Erwartung: Kein Admin Performance-Monitor sichtbar.

          I. Als Admin Dashboard öffnen.
             Erwartung: Performance-Monitor sichtbar, sofern der bestehende Benutzerzustand die Admin-Rolle eindeutig enthält.

          J. Mehrere Bereiche anklicken.
             Erwartung: UI-Reaktionswerte aktualisieren sich; Navigation bleibt funktionsfähig.

          K. Netzwerk prüfen.
             Erwartung: RC888 selbst erzeugt keine neuen API-Aufrufe. Angezeigt werden nur bereits vorhandene Browser-Resource-Timings.

          L. Strg+K Suche, Favoriten, Vorlagen, Sendungsfortschritt und Dokumenten-Ampel testen.
             Erwartung: RC885-RC887 funktionieren unverändert.

          M. Produktion vergleichen.
             Erwartung: index.html, APIs, Pickup, Location und Customer-Avis wurden nicht verändert.

          N. Fehlerdiagnose exportieren.
             Erwartung: version = RC888 und keine neue RC888 JavaScript-Exception.
          EOF

      - name: Commit RC888 testservice
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html RC888_PRUEFBERICHT.txt
          git commit -m "RC888: add handover timeline and admin performance monitor"
          git push origin main
