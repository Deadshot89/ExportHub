name: RC992 TESTSERVICE Dispatcher

on:
  push:
    branches:
      - rc992-testservice-dispatch

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch proven TESTSERVICE workflow for RC992
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run exporthub-testservice-final-artifact-fix.yml --repo Deadshot89/ExportHub --ref rc992-state-save-performance
