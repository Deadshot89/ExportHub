name: SOPMaster Coverage Verify

on:
  push:
    branches:
      - design/sopmaster-training-tour-2026-10-12
    paths:
      - 'assets/sop/rc1505-sop-*'
      - 'assets/sop/rc1506-sop-*'
      - 'test/rc1505-sop-*.test.mjs'
      - 'test/rc1506-sop-*.test.mjs'
      - '.github/rc1505/**'
      - '.github/rc1506/**'
      - '.github/workflows/sopmaster-coverage-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sopmaster-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1505 + RC1506 coverage contracts
        run: node --test test/rc1505-sop-*.test.mjs test/rc1506-sop-*.test.mjs

  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Full Node regression
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-regression.log
      - name: Upload Node regression log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc1506-node-regression-log
          path: node-regression.log
          if-no-files-found: error
