name: RC1642 TESTSERVICE Snapshot Age Audit

on:
  pull_request:
    paths:
      - api/shared/testservice-team-inventory.js
      - test/rc1627-testservice-team-metadata-inventory.test.mjs
      - .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml
      - .github/workflows/rc1642-testservice-snapshot-age-audit.yml
  push:
    branches: [main]
    paths:
      - api/shared/testservice-team-inventory.js
      - test/rc1627-testservice-team-metadata-inventory.test.mjs
      - .github/workflows/azure-static-web-apps-wonderful-forest-0f315e310.yml
      - .github/workflows/rc1642-testservice-snapshot-age-audit.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1642 read-only snapshot age buckets
        run: |
          node --check api/shared/testservice-team-inventory.js
          node --check test/rc1627-testservice-team-metadata-inventory.test.mjs
          node --test --test-concurrency=1 test/rc1627-testservice-team-metadata-inventory.test.mjs
