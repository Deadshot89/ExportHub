name: RC1491 Targeted TDD

on:
  push:
    branches:
      - deepfix/rc1491-state-guard-fail-closed

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1491 unmapped state write regression
        run: node --test test/rc1491-state-write-guard-fail-closed.test.mjs
