name: RC960 Large Update Check

on:
  push:
    branches:
      - rc960-large-update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc960-large-update
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: RC960 active-path audit
        run: python .github/rc960_audit.py | tee docs/superpowers/rc960-audit.txt
      - name: RC960 focused function extract
        run: python .github/rc960_focus.py
      - name: RC960 active runtime extract
        run: python .github/rc960_runtime_focus.py
      - name: RC960 grouped runtime extracts
        run: python .github/rc960_group_extract.py
      - name: RC960 target runtime extract
        run: python .github/rc960_target_extract.py
      - name: RC960 exact function extract
        run: python .github/rc960_exact_extract.py
      - name: RC960 release confirmation extract
        run: python .github/rc960_release_exact.py
      - name: Existing baseline tests
        run: npm test
      - name: Capture audit result on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/rc960-audit.txt docs/superpowers/rc960-focus.txt docs/superpowers/rc960-runtime-focus.txt docs/superpowers/rc960-shipping-focus.txt docs/superpowers/rc960-pickup-focus.txt docs/superpowers/rc960-release-focus.txt docs/superpowers/rc960-admin-focus.txt docs/superpowers/rc960-target-focus.txt docs/superpowers/rc960-exact-focus.txt docs/superpowers/rc960-release-exact.txt
          if git diff --cached --quiet; then
            echo "Audit output unchanged."
            exit 0
          fi
          git commit -m "test: capture RC960 audit output [rc960-audit-output]"
          git push origin HEAD:rc960-large-update
