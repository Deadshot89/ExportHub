name: RC944 Sendungsdaten DOM Override exakt eingrenzen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc944-shipment-data-layout.yml'

permissions:
  contents: write

concurrency:
  group: rc944-shipment-data-layout
  cancel-in-progress: false

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DOM-Override-Kontexte extrahieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text=Path('TESTVERSION.html').read_text(encoding='utf-8')
          assert "version:'RC943',cache:'943',loginReturn:'/TESTVERSION.html?v=943'" in text, 'Basis ist nicht RC943'
          needle='rc363BlockShipment'
          pos=[]; p=0
          while True:
              i=text.find(needle,p)
              if i<0: break
              pos.append(i); p=i+1
          assert pos, 'rc363BlockShipment nicht gefunden'
          parts=[]
          for n,i in enumerate(pos):
              parts.append('\n=== occurrence '+str(n+1)+' @ '+str(i)+' ===\n'+text[max(0,i-3500):min(len(text),i+5000)])
          Path('_rc944_active_snippet.txt').write_text(''.join(parts),encoding='utf-8')
          print('occurrences',len(pos),pos)
          PY

      - name: Diagnose-Ausschnitt aktualisieren
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _rc944_active_snippet.txt
          git commit -m "RC944 Sendungsdaten-DOM-Override erfassen"
          git push origin HEAD:main
