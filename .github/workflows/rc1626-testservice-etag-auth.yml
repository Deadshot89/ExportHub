name: RC1626 TESTSERVICE Auth Read Safety

on:
  pull_request:
    paths:
      - 'api/shared/fast-auth-store.js'
      - 'test/rc1626-testservice-auth-etag-read.test.mjs'
      - '.github/workflows/rc1626-testservice-etag-auth.yml'
  push:
    branches: [main]
    paths:
      - 'api/shared/fast-auth-store.js'
      - 'test/rc1626-testservice-auth-etag-read.test.mjs'
      - '.github/workflows/rc1626-testservice-etag-auth.yml'

permissions:
  contents: read

jobs:
  test-authorization-and-reads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Verify syntax
        run: node --check api/shared/fast-auth-store.js
      - name: Run TESTSERVICE ETag and original production coalescing tests
        run: node --test test/rc1626-testservice-auth-etag-read.test.mjs test/rc1102-fast-auth-read-coalescing.test.mjs test/rc1146-testservice-auth-completeness.test.mjs
