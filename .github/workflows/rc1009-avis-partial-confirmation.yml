name: RC1009 Avis Partial Confirmation

on:
  push:
    branches:
      - rc1009-avis-templates-partial-confirmation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: RC1009 Vertrag
        run: node --test test/rc1009-avis-templates-partial-confirmation.test.mjs
