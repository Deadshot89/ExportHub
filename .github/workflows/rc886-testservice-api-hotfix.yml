name: RC886 TESTSERVICE API Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: exporthub-rc886-testservice-api-hotfix
  cancel-in-progress: false

jobs:
  hotfix-testservice:
    name: RC886 same-origin API hotfix
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout RC885 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnose and guard RC885 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f TESTVERSION.html
          grep -Fq "version:'RC885',cache:'885',loginReturn:'/TESTVERSION.html?v=885'" TESTVERSION.html
          grep -Fq "/* exporthub-rc885-clean-workspace-v4 */" TESTVERSION.html

          echo "=== ExportHUB API markers in current TESTVERSION ==="
          grep -o "AZURE_ROUTE_BLOCKED" TESTVERSION.html | wc -l | xargs echo "AZURE_ROUTE_BLOCKED occurrences:"
          grep -o "/api/exporthub-[A-Za-z0-9_-]*" TESTVERSION.html | sort -u | head -50 || true

          if ! grep -Fq "AZURE_ROUTE_BLOCKED" TESTVERSION.html; then
            echo "::error::Die bekannte AZURE_ROUTE_BLOCKED-Fehlerbehandlung wurde nicht gefunden."
            exit 1
          fi

          if ! grep -Eq "/api/exporthub-(state|auth|auth-probe)" TESTVERSION.html; then
            echo "::error::Keine erwartete ExportHUB-API-Route in TESTVERSION gefunden."
            exit 1
          fi

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          src=Path("TESTVERSION.html").read_text(encoding="utf-8",errors="replace")

          class V(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script=0
                  self.style=0
                  self.parts=[]
              def handle_starttag(self,tag,attrs):
                  t=tag.lower()
                  if t=="script": self.script+=1
                  elif t=="style": self.style+=1
              def handle_endtag(self,tag):
                  t=tag.lower()
                  if t=="script" and self.script: self.script-=1
                  elif t=="style" and self.style: self.style-=1
              def handle_data(self,data):
                  if not self.script and not self.style:
                      self.parts.append(data)

          p=V()
          p.feed(src)
          p.close()
          visible="\n".join(p.parts)

          bad=[
              "function applyFixedBlocks()",
              "window.open('about:blank'",
              'window.open("about:blank"',
              "function warningData()"
          ]
          leaks=[x for x in bad if x in visible]
          if leaks:
              raise SystemExit("RC885 ist bereits vor dem API-Hotfix beschädigt: "+", ".join(leaks))

          marker=src.find("AZURE_ROUTE_BLOCKED")
          if marker < 0:
              raise SystemExit("AZURE_ROUTE_BLOCKED fehlt.")

          open_pos=src.rfind("<script",0,marker)
          open_end=src.find(">",open_pos)
          close_pos=src.find("</script>",marker)

          if open_pos < 0 or open_end < 0 or close_pos < 0:
              raise SystemExit("Scriptblock der API-Fehlerbehandlung konnte nicht sicher bestimmt werden.")

          if src.find("</script>",open_end,marker) >= 0:
              raise SystemExit("AZURE_ROUTE_BLOCKED liegt nicht innerhalb des erwarteten Scriptblocks.")

          open_tag=src[open_pos:open_end+1].lower()
          if "application/json" in open_tag or "application/ld+json" in open_tag:
              raise SystemExit("API-Fehlerbehandlung liegt in einem nicht ausführbaren Scriptblock.")

          Path("/tmp/rc886_api_script_open").write_text(str(open_pos))
          Path("/tmp/rc886_api_script_open_end").write_text(str(open_end))
          Path("/tmp/rc886_script_open_count").write_text(str(src.lower().count("<script")))
          Path("/tmp/rc886_script_close_count").write_text(str(src.lower().count("</script>")))
          Path("/tmp/rc886_style_open_count").write_text(str(src.lower().count("<style")))
          Path("/tmp/rc886_style_close_count").write_text(str(src.lower().count("</style>")))

          print("OK: API-Fehlerbehandlung liegt in einem klassischen Scriptblock.")
          PY

      - name: Regression test same-origin API rule
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          function oldBehavior(url){ return url; }
          function fixedBehavior(url,origin){
            var u=new URL(url,origin);
            if(/^\/api\/exporthub(?:-|\/|$)/i.test(u.pathname||'')){
              return new URL((u.pathname||'')+(u.search||'')+(u.hash||''),origin).href;
            }
            return u.href;
          }

          var origin='https://testservice.example';
          var legacy='https://production.example/api/exporthub-state?team=1';

          if(oldBehavior(legacy)===origin+'/api/exporthub-state?team=1'){
            throw new Error('RED-Test ungültig: Altverhalten ist bereits same-origin');
          }
          console.log('RED bestätigt: alte URL bleibt auf fremdem Origin.');

          var result=fixedBehavior(legacy,origin);
          if(result!==origin+'/api/exporthub-state?team=1'){
            throw new Error('GREEN fehlgeschlagen: '+result);
          }

          var external='https://carrier.example/api/rates';
          if(fixedBehavior(external,origin)!==external){
            throw new Error('Externe Nicht-ExportHUB-API darf nicht umgeschrieben werden.');
          }

          console.log('GREEN bestätigt: nur /api/exporthub-* wird auf Testservice-Origin gesetzt.');
          NODE

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC885 backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-clean-rc885-before-rc886-api-${GITHUB_RUN_ID}"
          git tag -a "${TAG}" -m "Clean RC885 before TESTSERVICE API hotfix RC886"
          git push origin "refs/tags/${TAG}"

