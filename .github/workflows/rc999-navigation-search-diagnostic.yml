name: RC999 Navigation Search Diagnostic

on:
  push:
    branches:
      - rc999-navigation-search-final
    paths:
      - '.github/workflows/rc999-navigation-search-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Inspect canonical search fields
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('TESTVERSION.html','utf8');

          function around(needle,before=900,after=1800,max=12){
            let from=0,count=0;
            console.log(`\n### ${needle}`);
            while(count<max){
              const i=src.indexOf(needle,from); if(i<0)break;
              console.log(`\n--- @${i} ---\n${src.slice(Math.max(0,i-before),Math.min(src.length,i+needle.length+after))}`);
              from=i+needle.length; count++;
            }
            console.log(`\nCOUNT ${needle}: ${count}${count===max?' (capped)':''}`);
          }

          [
            'function initIndex321(){',
            'Empfänger',
            'Lieferadresse',
            'Lieferort',
            'Standort',
            'customerAddress',
            'recipient',
            'consignee',
            'shipTo',
            'deliveryAddress',
            'destination',
            'locationName',
            'siteName'
          ].forEach(n=>around(n));

          function props(varName){
            const re=new RegExp('\\b'+varName+'\\.([A-Za-z_$][A-Za-z0-9_$]*)','g');
            const names=[...src.matchAll(re)].map(m=>m[1]);
            return [...new Set(names)].sort();
          }
          console.log('\n### CUSTOMER PROPERTIES (c.*)\n'+props('c').join('\n'));
          console.log('\n### SHIPMENT PROPERTIES (sh.*)\n'+props('sh').join('\n'));
          console.log('\n### TASK PROPERTIES (t.*)\n'+props('t').join('\n'));

          const interesting=/recipient|empf|address|street|city|postal|zip|country|location|site|destination|consignee|ship|customer|account|reference|status|priority|due|carrier|contact|mail/i;
          console.log('\n### INTERESTING SHIPMENT PROPERTIES');
          props('sh').filter(x=>interesting.test(x)).forEach(x=>console.log(x));
          console.log('\n### INTERESTING CUSTOMER PROPERTIES');
          props('c').filter(x=>interesting.test(x)).forEach(x=>console.log(x));
          console.log('\n### INTERESTING TASK PROPERTIES');
          props('t').filter(x=>interesting.test(x)).forEach(x=>console.log(x));
          NODE
