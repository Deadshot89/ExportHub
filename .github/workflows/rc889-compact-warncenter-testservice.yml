      - name: GREEN regression and source safety
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "version:'RC889',cache:'889',loginReturn:'/TESTVERSION.html?v=889'" TESTVERSION.html
          grep -Fq "rc889-group" TESTVERSION.html
          grep -Fq "Kompakt nach Handlungsart gruppiert" TESTVERSION.html
          grep -Fq "label:'Überfällig'" TESTVERSION.html
          grep -Fq "label:'Dokumente'" TESTVERSION.html
          grep -Fq "label:'Abholung'" TESTVERSION.html
          grep -Fq "label:'Sonstige'" TESTVERSION.html
          grep -Fq "Weitere " TESTVERSION.html
          grep -Fq "/* exporthub-rc888-shipment-create-professional */" TESTVERSION.html
          grep -Fq "__rc887AvisAllowed" TESTVERSION.html

          if grep -Fq "items:items.slice(0,8)" TESTVERSION.html; then
            echo "::error::Alte flache Warncenter-Datenstruktur ist noch aktiv."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          src=Path("TESTVERSION.html").read_text(encoding="utf-8",errors="replace")
          expected={
              "script_open":int(Path("/tmp/rc889_script_open").read_text()),
              "script_close":int(Path("/tmp/rc889_script_close").read_text()),
              "style_open":int(Path("/tmp/rc889_style_open").read_text()),
              "style_close":int(Path("/tmp/rc889_style_close").read_text())
          }
          actual={
              "script_open":src.lower().count("<script"),
              "script_close":src.lower().count("</script>"),
              "style_open":src.lower().count("<style"),
              "style_close":src.lower().count("</style>")
          }
          if expected!=actual:
              raise SystemExit("HTML-Grenzen verändert: "+repr({"vorher":expected,"nachher":actual}))

          class V(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script=0; self.style=0; self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=="script": self.script+=1
                  elif tag.lower()=="style": self.style+=1
              def handle_endtag(self,tag):
                  if tag.lower()=="script" and self.script: self.script-=1
                  elif tag.lower()=="style" and self.style: self.style-=1
              def handle_data(self,data):
                  if not self.script and not self.style: self.parts.append(data)

          p=V(); p.feed(src); p.close()
          visible="\n".join(p.parts)
          bad=[
              "function warningData()",
              "function ensureWarningUi()",
              "exporthub-rc889-warningcenter-style"
          ]
          leaks=[x for x in bad if x in visible]
          if leaks:
              raise SystemExit("JavaScript als Seitentext sichtbar: "+", ".join(leaks))

          print("GREEN: RC889 Warncenter gruppiert; Quellgrenzen stabil.")
          PY

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "TESTVERSION.html" ]]; then
            echo "::error::RC889 darf ausschließlich TESTVERSION.html ändern."
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi

          if ! git diff --quiet -- index.html api staticwebapp.config.json .github/workflows; then
            echo "::error::Produktion/API/Workflow-Dateien wurden verändert."
            exit 1
          fi

      - name: Commit RC889 TESTSERVICE
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC889: compact grouped Warncenter"
          git push origin main

      - name: RC889 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## ExportHUB RC889"
            echo
            echo "- Warncenter nach Überfällig / Dokumente / Abholung / Sonstige gruppiert"
            echo "- Maximal 3 direkte Einträge je Gruppe"
            echo "- Weitere offene Punkte führen kompakt zur passenden Aufgaben-/Sendungsansicht"
            echo "- Keine zweite vollständige Aufgaben-/Sendungsliste"
            echo "- Bestehende RC887 Avis- und RC888 Sendung-erstellen-Logik unverändert"
            echo "- Nur TESTVERSION.html geändert"
          } >> "$GITHUB_STEP_SUMMARY"
