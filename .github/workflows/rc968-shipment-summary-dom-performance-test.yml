name: RC968 Shipment Summary DOM Performance Regression

on:
  push:
    branches:
      - main
    paths:
      - 'TESTVERSION.html'
      - 'tests/rc963-render-performance.test.cjs'
      - 'tests/rc964-render-metrics.test.cjs'
      - 'tests/rc965-avis-retry-performance.test.cjs'
      - 'tests/rc966-warning-ui-render-performance.test.cjs'
      - 'tests/rc967-shipment-visual-refresh-performance.test.cjs'
      - 'tests/rc968-shipment-summary-dom-performance.test.cjs'
      - '.github/workflows/rc968-shipment-summary-dom-performance-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: RC963 bis RC968 Regressionen
        run: |
          node tests/rc963-render-performance.test.cjs
          node tests/rc964-render-metrics.test.cjs
          node tests/rc965-avis-retry-performance.test.cjs
          node tests/rc966-warning-ui-render-performance.test.cjs
          node tests/rc967-shipment-visual-refresh-performance.test.cjs
          node tests/rc968-shipment-summary-dom-performance.test.cjs
