<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>ExportHUB · Abholbestätigung</title>
<style>
:root{color-scheme:light;--navy:#08245d;--blue:#2563eb;--cyan:#05b8ff;--green:#166534;--red:#991b1b;--line:#dbe4ef;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;color:#0f172a;background:radial-gradient(circle at 12% 0,rgba(5,184,255,.20),transparent 36%),#eef6fb;padding:18px}.shell{min-height:calc(100vh - 36px);display:grid;place-items:center}.card{width:min(680px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 22px 60px rgba(15,23,42,.17);padding:24px}.brand{display:flex;align-items:center;gap:12px;color:var(--navy);font-weight:1000;letter-spacing:.04em}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;color:#fff}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:0}.card h1{font-size:28px;margin:15px 0 6px;color:var(--navy)}.sub{color:var(--muted);font-weight:700;line-height:1.45}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.box{border:1px solid #bfdbfe;background:#f8fbff;border-radius:15px;padding:11px}.box span{display:block;font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase}.box strong{display:block;margin-top:4px;font-size:16px;overflow-wrap:anywhere}.msg{border-radius:14px;padding:11px;margin:12px 0;font-weight:800;line-height:1.4}.info{background:#eff6ff;border-left:5px solid var(--blue)}.ok{background:#f0fdf4;border-left:5px solid #16a34a;color:var(--green)}.bad{background:#fef2f2;border-left:5px solid #dc2626;color:var(--red)}label{display:grid;gap:7px;font-weight:900;margin-top:14px}input[type=password]{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:13px;font-size:20px;font-weight:900;letter-spacing:.12em}input[type=file]{width:100%;border:1px dashed #94a3b8;border-radius:14px;padding:12px;background:#f8fafc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:14px;padding:11px 15px;font-weight:950;cursor:pointer;min-height:44px}.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff}.secondary{background:#eef6ff;color:#075985}.pod-list{display:grid;gap:7px;margin-top:10px}.pod{display:flex;justify-content:space-between;gap:10px;border:1px solid #dbeafe;border-radius:12px;padding:9px;background:#f8fbff;font-size:13px}.pod a{color:#1d4ed8;font-weight:900}.statusline{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;font-weight:800;margin-top:12px}.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b}.dot.ok{background:#16a34a}.footer{margin-top:18px;padding-top:12px;border-top:1px solid #e2e8f0;color:var(--muted);font-size:11px;line-height:1.45}@media(max-width:620px){body{padding:10px}.card{padding:17px;border-radius:20px}.meta{grid-template-columns:1fr}.card h1{font-size:23px}.actions button{width:100%}}
</style>
</head>
<body>
<main class="shell"><section class="card" id="app"><div class="brand"><div class="mark">EH</div><div>ESSENTRA · ExportHUB<small>Sichere Abholbestätigung</small></div></div><h1>Abholbestätigung</h1><div class="msg info">QR-Dienst und Sendungsdaten werden geprüft …</div><div class="statusline"><span class="dot"></span>Verbindung wird aufgebaut</div></section></main>
<script>
(function(){
'use strict';
const FIXED_PIN='25846',API_PIN='025846',API='/api',MAX_FILES=6;
const app=document.getElementById('app');
const token=(new URLSearchParams(location.search).get('token')||'').trim();
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
const fmt=v=>{try{return new Date(v).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'medium'})}catch(e){return String(v||'')}};
async function request(path,options={}){const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);options.signal=c.signal;options.cache='no-store';options.headers=Object.assign({'Accept':'application/json','Content-Type':'application/json'},options.headers||{});try{const r=await fetch(API+path,options);let b={};try{b=await r.json()}catch(e){}if(!r.ok){const x=new Error(b.error||b.message||('HTTP '+r.status));x.status=r.status;x.body=b;throw x}return b}finally{clearTimeout(timer)}}
function frame(content){app.innerHTML='<div class="brand"><div class="mark">EH</div><div>ESSENTRA · ExportHUB<small>Sichere Abholbestätigung</small></div></div>'+content+'<div class="footer">Die Abholung kann nur einmal bestätigt werden. Datum und Uhrzeit stammen vom Server. Der PIN wird nicht im QR-Code übertragen.</div>'}
function errorBox(text,retry=true){frame('<h1>Abholbestätigung</h1><div class="msg bad">'+esc(text)+'</div>'+(retry?'<div class="actions"><button class="secondary" data-action="retry">Erneut prüfen</button></div>':'')+'<div class="statusline"><span class="dot"></span>QR-Dienst nicht bereit</div>')}
function render(st,msg='',kind='info'){const used=!!st.confirmedAt;let key='';try{key=sessionStorage.getItem('rc433UploadKey:'+token)||''}catch(e){}const pods=arr(st.podFiles);frame('<h1>Abholbestätigung</h1><p class="sub">Bitte bestätigen Sie ausschließlich die Abholung dieser Sendung.</p><div class="meta"><div class="box"><span>Referenz</span><strong>'+esc(st.reference||'')+'</strong></div><div class="box"><span>Kunde / Empfänger</span><strong>'+esc(st.customer||st.recipient||'')+'</strong></div></div>'+(msg?'<div class="msg '+esc(kind)+'">'+esc(msg)+'</div>':'')+(used?'<div class="msg ok">Abholung bestätigt am <b>'+esc(fmt(st.confirmedAt))+'</b>. Dieser QR-Code ist bereits verwendet und kann nicht erneut bestätigt werden.</div>':'<label>PIN eingeben<input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="5" pattern="[0-9]*" placeholder="5-stellige PIN"></label><div class="actions"><button class="primary" data-action="confirm">Abholung bestätigen</button></div>')+(used&&key?'<hr><h2>POD-Fotos hochladen</h2><p class="sub">Bis zu 6 Fotos können direkt als Abliefernachweis gespeichert werden.</p><input id="files" type="file" accept="image/*" capture="environment" multiple><div class="actions"><button class="primary" data-action="upload">POD-Fotos hochladen</button></div>':'')+(pods.length?'<h2>Gespeicherte POD-Nachweise</h2><div class="pod-list">'+pods.map(f=>'<div class="pod"><span>'+esc(f.name||'POD')+'<br><small>'+esc(fmt(f.uploadedAt||''))+'</small></span><a target="_blank" rel="noopener" href="'+esc(f.url||'#')+'">Öffnen</a></div>').join('')+'</div>':'')+'<div class="statusline"><span class="dot ok"></span>QR-Dienst verbunden</div>');app.__status=st}
async function load(msg='',kind='info'){if(!/^[a-f0-9]{48}$/i.test(token)){errorBox('Der QR-Code ist ungültig.',false);return}try{const h=await request('/pickup-health');if(!h.ok||!h.storage)throw Object.assign(new Error('API oder Azure-Speicher ist nicht bereit.'),{status:503});const st=await request('/pickup-status?token='+encodeURIComponent(token),{headers:{'Accept':'application/json'}});render(st,msg,kind)}catch(e){if(e.status===404)errorBox('Dieser QR-Code ist noch nicht online aktiviert. Bitte die Ladeliste in ExportHUB erneut öffnen, sobald der QR-Dienst bereit ist.');else if(e.status===410)errorBox('Dieser QR-Code ist abgelaufen.',false);else errorBox('Der QR-Dienst wurde noch nicht vollständig bereitgestellt oder ist momentan nicht erreichbar.')}}
async function confirmPickup(){const st=app.__status||{},pin=(document.getElementById('pin')||{}).value||'';if(!/^\d{5}$/.test(pin)){render(st,'Bitte die 5-stellige PIN eingeben.','bad');return}try{const r=await request('/pickup-confirm',{method:'POST',body:JSON.stringify({token,pin:pin===FIXED_PIN?API_PIN:'0'+pin})});try{sessionStorage.setItem('rc433UploadKey:'+token,r.uploadKey||'')}catch(e){}await load('Abholung wurde mit Datum und Uhrzeit gespeichert und übermittelt.','ok')}catch(e){const m=e.status===409?'Diese Abholung wurde bereits bestätigt.':e.status===423?'Zu viele falsche Eingaben. Bitte später erneut versuchen.':e.status===401?'PIN ist nicht korrekt.':'Bestätigung konnte nicht gespeichert werden.';await load(m,'bad')}}
function imageData(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.82).split(',')[1];URL.revokeObjectURL(url);resolve({name:file.name.replace(/\.[^.]+$/,'.jpg'),type:'image/jpeg',dataBase64:data,size:Math.ceil(data.length*.75)})}catch(e){reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Bild konnte nicht gelesen werden'))};img.src=url})}
async function upload(){const st=app.__status||{},input=document.getElementById('files'),files=Array.from(input&&input.files||[]).slice(0,MAX_FILES);let key='';try{key=sessionStorage.getItem('rc433UploadKey:'+token)||''}catch(e){}if(!files.length){render(st,'Bitte mindestens ein Foto auswählen.','bad');return}if(!key){render(st,'Die Upload-Sitzung ist abgelaufen.','bad');return}try{const images=await Promise.all(files.map(imageData));await request('/pickup-pod',{method:'POST',body:JSON.stringify({token,uploadKey:key,images})});await load('POD-Fotos wurden sicher gespeichert.','ok')}catch(e){await load(e.status===401?'Die Upload-Sitzung ist ungültig oder abgelaufen.':'POD-Upload ist fehlgeschlagen.','bad')}}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;e.preventDefault();const a=b.dataset.action;if(a==='retry')load();else if(a==='confirm')confirmPickup();else if(a==='upload')upload()});
load();
})();
</script>
</body>
</html>
