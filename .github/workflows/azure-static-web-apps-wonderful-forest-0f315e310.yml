name: ExportHUB RC1112 Main Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'demo.html'
      - 'production-version.js'
      - 'release-version.json'
      - 'pickup.html'
      - 'customer-avis.html'
      - 'location.html'
      - 'pod-notfall.html'
      - 'migration-recovery.html'
      - 'assets/**'
      - 'api/**'
      - 'android-app/**'
      - 'staticwebapp.config.json'
      - 'staticwebapp.testservice.config.json'
      - '.github/rc*/**'
      - '.github/workflows/**'
      - 'test/**'
      - 'e2e/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: exporthub-rc1112-three-env-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_and_deploy_testservice:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GITHUB_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: RC1112 Freigabevertrag prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'" production-version.js
          node --check api/exporthub-state/index.js
          node --test test/p0-state-conditional-write-conflict.test.mjs
          node .github/rc1018/apply-public-language.mjs
          node .github/rc1018/fix-mail-wording.mjs
          node --test --test-concurrency=1 test/rc1018-mail-language-standard.test.mjs test/rc1018-production-deploy.test.mjs
          node --test test/rc1017-three-env-release.test.mjs
          node --test --test-concurrency=1 test/rc1016-production-deploy.test.mjs test/rc1016-release-sync.test.mjs test/rc1016-sop-consolidation.test.mjs test/rc1016-demo-tasks.test.mjs
          node --test --test-concurrency=1 test/rc1015-lieferavis-mail-flow.test.mjs test/rc1013-restpunkte.test.mjs test/rc1013-three-env-sync.test.mjs test/rc1011-core-open-issues.test.mjs test/rc1011-project-isolation.test.mjs
          node --test test/rc1013-pickup-readonly-flow.test.mjs
          node --test --test-name-pattern='RC995 Pickup-PIN' .github/rc995/rc995-flow.test.cjs
          node --test --test-concurrency=1 .github/rc998/partial-pickup-avis-contract.test.mjs .github/rc1000/rc1000-production-pickup.test.mjs
          npm test

      - name: RC1112 Produktion TESTSERVICE und Demo gemeinsam bauen
        shell: bash
        run: |
          set -euo pipefail
          node .github/rc1112/build-three-env.mjs
          node .github/rc1121/verify-final-html.mjs
          grep -q 'ExportHUB RC1112 environment=production-candidate' dist-rc1112/index.html
          grep -q 'ExportHUB RC1112 environment=testservice' dist-rc1112/TESTVERSION.html
          grep -q 'ExportHUB RC1112 environment=demo' dist-rc1112/demo.html
          grep -q "version:'RC1112'" dist-rc1112/index.html
          grep -q "version:'RC1112'" dist-rc1112/TESTVERSION.html
          grep -q "version:'RC1112'" dist-rc1112/demo.html
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'" dist-rc1112/production-version.js
          grep -q 'assets/rc1015-lieferavis-mail-flow.js?v=1383' dist-rc1112/index.html
          grep -q 'assets/rc1018-mail-language-standard.js?v=1018' dist-rc1112/index.html
          grep -q 'assets/rc1018-public-language.js?v=1018' dist-rc1112/index.html
          test -s dist-rc1112/assets/rc1016-mobile-navigation.js
          test -s dist-rc1112/assets/rc1017-multi-truck.js
          test -s dist-rc1112/assets/rc1018-mail-language-standard.js
          test -s dist-rc1112/assets/rc1018-public-language.js
          test -s dist-rc1112/assets/abholkalender.js
          test -s dist-rc1112/assets/rc1012-abholkalender-runtime.js

      - name: RC1112 TESTSERVICE-Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rc1112_testservice_app
          mkdir -p .rc1112_testservice_app
          cp dist-rc1112/pickup.html dist-rc1112/customer-avis.html dist-rc1112/location.html dist-rc1112/pod-notfall.html dist-rc1112/migration-recovery.html .rc1112_testservice_app/
          cp dist-rc1112/production-version.js .rc1112_testservice_app/production-version.js
          cp -R assets .rc1112_testservice_app/assets
          cp -R dist-rc1112/assets/. .rc1112_testservice_app/assets/
          cp staticwebapp.testservice.config.json .rc1112_testservice_app/staticwebapp.config.json
          cp dist-rc1112/TESTVERSION.html .rc1112_testservice_app/index.html
          cp dist-rc1112/TESTVERSION.html .rc1112_testservice_app/TESTVERSION.html
          cp dist-rc1112/demo.html .rc1112_testservice_app/demo.html
          test -s .rc1112_testservice_app/index.html
          test -s .rc1112_testservice_app/demo.html
          test -s .rc1112_testservice_app/assets/rc1016-mobile-navigation.js
          test -s .rc1112_testservice_app/assets/rc1017-multi-truck.js
          test -s .rc1112_testservice_app/assets/rc1018-mail-language-standard.js
          test -s .rc1112_testservice_app/assets/rc1018-public-language.js

      - name: RC1381 TESTSERVICE stale-deploy guard
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -n "$remote_sha" ] && [ "$remote_sha" != "$GITHUB_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$remote_sha"
            changed="$(git diff --name-only "$GITHUB_SHA" "$remote_sha" || true)"
            if printf '%s\n' "$changed" | grep -Eq '^(index\.html|TESTVERSION\.html|demo\.html|production-version\.js|release-version\.json|pickup\.html|customer-avis\.html|location\.html|pod-notfall\.html|migration-recovery\.html|assets/|api/|staticwebapp|\.github/rc[0-9]+/|\.github/workflows/azure-static-web-apps-wonderful-forest-0f315e310\.yml$|test/|e2e/)'; then
              echo "RC1381: neuerer deploy-relevanter main-Stand $remote_sha vorhanden; TESTSERVICE-Deploy für $GITHUB_SHA wird blockiert."
              exit 1
            fi
            echo "RC1396: neuerer main-Head enthält nur nicht-deploy-relevante Änderungen; TESTSERVICE-Deploy bleibt gültig. run=$GITHUB_SHA main=$remote_sha"
          fi

      - name: Deploy ExportHUB TESTSERVICE
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EXPORT_HUB_EUROPE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1112_testservice_app
          api_location: api
          output_location: ''
          skip_app_build: true
          deployment_environment: testservice

      - name: RC1249 TESTSERVICE AVIS-Mail-Konfiguration prüfen
        # Optionale automatische Upload-Mail; bekannte fehlende Mail.Send-Berechtigung bleibt P2.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          set +x
          base='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=exporthub-avis-upload-mail-readiness" \
            | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s).value;if(!v)process.exit(2);process.stdout.write(v)})"
          )"
          echo "::add-mask::$oidc_token"
          status="$(
            curl -sS -o "$response" -w '%{http_code}' --max-time 20 -X POST \
              -H "x-exporthub-github-oidc: $oidc_token" \
              -H 'x-exporthub-environment: testservice' \
              "$base/api/avis-upload-mail-readiness" || true
          )"
          STATUS="$status" ENVIRONMENT='testservice' RESPONSE="$response" node -e "
            const fs=require('fs'),status=Number(process.env.STATUS||0),env=process.env.ENVIRONMENT,v=JSON.parse(fs.readFileSync(process.env.RESPONSE,'utf8')||'{}');
            const recipient='DespatchNettetal@essentra.com';
            const requirement=v.requiredPermission||{};
            const ready=status===200&&v.ok===true&&v.configured===true&&v.authenticated===true&&v.audienceOk===true&&v.mailSendGranted===true&&v.environment===env&&v.recipient===recipient;
            if(ready){console.log('RC1249 '+env+' automatische Upload-Mail bereit');process.exit(0)}
            const knownMailSendBlocker=status===503&&v.ok===false&&v.configured===true&&v.authenticated===true&&v.audienceOk===true&&v.mailSendGranted===false&&v.environment===env&&v.recipientConfigured===true&&v.code==='GRAPH_MAIL_PERMISSION_MISSING'&&requirement.resource==='Microsoft Graph'&&requirement.type==='Application'&&requirement.name==='Mail.Send'&&requirement.id==='b633e1c5-b582-4048-a93e-9f11b44c7e96'&&requirement.adminConsentRequired===true;
            if(knownMailSendBlocker){console.log('::warning title=RC1290 AVIS-Mail P2::Microsoft Graph > Application > Mail.Send (b633e1c5-b582-4048-a93e-9f11b44c7e96) fehlt in '+env+'. Admin Consent erforderlich; Release läuft weiter, Mailversand bleibt offen.');process.exit(0)}
            console.error('RC1249 '+env+' automatische Upload-Mail weiterhin nicht verfügbar',JSON.stringify({status,ok:v.ok,configured:v.configured,authenticated:v.authenticated,audienceOk:v.audienceOk,mailSendGranted:v.mailSendGranted,code:v.code}));
            process.exit(1);
          "

      - name: RC1505 TESTSERVICE Readiness prüfen
        shell: bash
        run: |
          set -euo pipefail
          base='https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net'
          ready=0
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS -L --max-time 20 "$base/?rc1505=${GITHUB_SHA}-${attempt}" || true)"
            version="$(curl -fsS -L --max-time 20 "$base/production-version.js?rc1505=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "$body" | grep -q 'ExportHUB' \
              && printf '%s' "$version" | grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1112'"; then
              ready=1
              break
            fi
            sleep 10
          done
          [ "$ready" = '1' ] || { echo 'RC1505 TESTSERVICE Readiness fehlgeschlagen.' >&2; exit 1; }
