name: RC1018 Mail und Sprache Entwicklung

on:
  push:
    branches: [rc1018-mail-language-standard]
    paths:
      - 'test/rc1018-*.test.mjs'
      - 'test/rc1016-release-sync.test.mjs'
      - 'assets/rc1018-*.js'
      - '.github/rc1018/**'
      - 'android-app/**'
      - 'customer-avis.html'
      - 'pickup.html'
      - 'location.html'
      - 'production-version.js'
      - '.github/workflows/rc1018-development.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc1018-mail-language-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Öffentliche DE/EN-Sprachruntime einbinden
        run: node .github/rc1018/apply-public-language.mjs
      - name: Lieferavis-Wortlaut strikt trennen
        run: node .github/rc1018/fix-mail-wording.mjs
      - name: RC1018 Mail- und Sprachvertrag
        run: node --test test/rc1018-mail-language-standard.test.mjs
      - name: Bestehende Lieferavis-Regression
        run: node --test test/rc1015-lieferavis-mail-flow.test.mjs
      - name: Vollständige Node-Regression
        run: npm test
      - name: Drei Umgebungen bauen
        run: node .github/rc1018/build-three-env.mjs
      - name: Diff prüfen
        run: git diff --check
      - name: RC1018 Runtime-Bindungen versionieren
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- assets/rc1018-mail-language-standard.js customer-avis.html pickup.html location.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/rc1018-mail-language-standard.js customer-avis.html pickup.html location.html
            git commit -m 'build: RC1018 Mail und DE EN Bindungen [skip ci]'
            git push origin HEAD:rc1018-mail-language-standard
          fi
