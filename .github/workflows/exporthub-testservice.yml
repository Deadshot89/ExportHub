name: ExportHUB TESTSERVICE Einzel-Deploy

# Standard ist ab RC1003 der gemeinsame Drei-Umgebungen-Deploy über
# azure-static-web-apps-wonderful-forest-0f315e310.yml.
# Dieser Workflow bleibt bewusst nur manuell verfügbar, falls ausdrücklich
# wieder nur TESTSERVICE geändert werden soll.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exporthub-testservice-explicit-only
  cancel-in-progress: false

jobs:
  deploy_testservice:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: RC1003 TESTSERVICE-Vertrag prüfen
        run: |
          set -euo pipefail
          node --test test/rc1003-three-env-sync.test.mjs
          npm test
          node .github/rc1003/build-three-env.mjs
          grep -q 'ExportHUB RC1003 environment=testservice' dist-rc1003/TESTVERSION.html
          grep -q 'ExportHUB RC1003 environment=demo' dist-rc1003/demo.html
      - name: TESTSERVICE-Paket vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rc1003_testservice_app
          mkdir -p .rc1003_testservice_app
          cp pickup.html customer-avis.html location.html pod-notfall.html production-version.js .rc1003_testservice_app/
          cp -R assets .rc1003_testservice_app/assets
          cp staticwebapp.testservice.config.json .rc1003_testservice_app/staticwebapp.config.json
          cp dist-rc1003/TESTVERSION.html .rc1003_testservice_app/index.html
          cp dist-rc1003/TESTVERSION.html .rc1003_testservice_app/TESTVERSION.html
          cp dist-rc1003/demo.html .rc1003_testservice_app/demo.html
          cp dist-rc1003/assets/exporthub-environment-hub.js .rc1003_testservice_app/assets/exporthub-environment-hub.js
          cp dist-rc1003/assets/exporthub-demo-bootstrap.js .rc1003_testservice_app/assets/exporthub-demo-bootstrap.js
      - name: Deploy TESTSERVICE explicit only
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1003_testservice_app
          api_location: api
          output_location: ''
          skip_app_build: true
          deployment_environment: testservice
