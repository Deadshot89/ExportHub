name: RC990 Isolated Browser Preview

on:
  workflow_dispatch:
  push:
    branches:
      - rc990-large-ux
    paths:
      - 'TESTVERSION.html'
      - '.github/rc990_preview_prepare.py'
      - '.github/workflows/rc990-preview.yml'
      - 'api/exporthub-auth/**'
      - 'api/exporthub-auth-probe/**'
      - 'api/exporthub-state/**'
      - 'api/exporthub-health/**'
      - 'api/shared/**'
      - 'api/package.json'
      - 'api/host.json'
      - 'assets/**'

permissions:
  contents: read

concurrency:
  group: rc990-isolated-preview
  cancel-in-progress: true

jobs:
  deploy_preview:
    if: github.ref == 'refs/heads/rc990-large-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy RC990 isolated preview

    steps:
      - name: Checkout RC990 branch only
        uses: actions/checkout@v4
        with:
          ref: rc990-large-ux
          fetch-depth: 1

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify committed RC990 before preview
        run: |
          node --test test/rc990-design-system.test.mjs
          npm test

      - name: Prepare isolated preview payload
        run: python .github/rc990_preview_prepare.py

      - name: Validate preview API syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check rc990-preview-dist/api/shared/auth-store.js
          node --check rc990-preview-dist/api/exporthub-auth/index.js
          node --check rc990-preview-dist/api/exporthub-auth-probe/index.js
          node --check rc990-preview-dist/api/exporthub-state/index.js
          node --check rc990-preview-dist/api/exporthub-health/index.js
          node -e "JSON.parse(require('fs').readFileSync('rc990-preview-dist/staticwebapp.config.json','utf8'));JSON.parse(require('fs').readFileSync('rc990-preview-dist/preview-environment.json','utf8'));"

      - name: Deploy RC990 named preview environment
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: rc990-preview-dist
          api_location: rc990-preview-dist/api
          output_location: ""
          skip_app_build: true
          deployment_environment: rc990-preview

      - name: Resolve and verify RC990 preview URL
        id: verify
        shell: bash
        env:
          ACTION_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          SWA_BASE_HOST_PREFIX: wonderful-forest-0f315e310
        run: |
          set -euo pipefail
          if [[ -z "${ACTION_URL:-}" ]]; then
            echo "Azure returned no preview URL."
            exit 1
          fi

          ACTION_URL="${ACTION_URL%/}"
          NAMED_URL="$(python3 -c '
          from urllib.parse import urlparse
          import sys
          raw=sys.argv[1].strip(); base=sys.argv[2].strip()
          u=urlparse(raw)
          if not u.scheme or not u.hostname: raise SystemExit("invalid Azure URL: "+raw)
          host=u.hostname
          if "." not in host: raise SystemExit("unexpected Azure host: "+host)
          suffix=host.split(".",1)[1]
          print(f"{u.scheme}://{base}-rc990-preview.{suffix}")
          ' "$ACTION_URL" "$SWA_BASE_HOST_PREFIX")"

          CANDIDATES=("$NAMED_URL")
          if [[ "$ACTION_URL" != "$NAMED_URL" ]]; then CANDIDATES+=("$ACTION_URL"); fi

          echo "Azure action URL: $ACTION_URL"
          echo "Named RC990 URL:   $NAMED_URL"

          verified=""
          for attempt in $(seq 1 24); do
            echo "Preview check $attempt/24"
            for base in "${CANDIDATES[@]}"; do
              env_code="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/rc990-env.json -w '%{http_code}' "$base/preview-environment.json?sha=${GITHUB_SHA}-${attempt}" || true)"
              page_code="$(curl -sS --connect-timeout 5 --max-time 25 -o /tmp/rc990-page.html -w '%{http_code}' "$base/?sha=${GITHUB_SHA}-${attempt}" || true)"
              env_ok="$(grep -c 'rc990-preview' /tmp/rc990-env.json 2>/dev/null || true)"
              design_ok="$(grep -c 'rc990-design-system' /tmp/rc990-page.html 2>/dev/null || true)"
              echo "$base | env=$env_code marker=$env_ok | page=$page_code design=$design_ok"
              if [[ "$env_code" == "200" && "$page_code" == "200" && "$env_ok" -gt 0 && "$design_ok" -gt 0 ]]; then
                verified="$base"
                break 2
              fi
            done
            sleep 5
          done

          if [[ -z "$verified" ]]; then
            echo "RC990 preview could not be verified."
            exit 1
          fi

          echo "url=$verified" >> "$GITHUB_OUTPUT"
          echo "RC990_PREVIEW_URL=$verified"
          echo "RC990 preview is live and contains the verified design layer."

      - name: Publish preview link in workflow summary
        env:
          PREVIEW_URL: ${{ steps.verify.outputs.url }}
        run: |
          {
            echo '## RC990 isolated preview'
            echo
            echo "**URL:** $PREVIEW_URL"
            echo
            echo '- Branch: `rc990-large-ux`'
            echo '- Azure environment: `rc990-preview`'
            echo '- Team/session/diagnostics writes: `rc990-preview/*` only'
            echo '- Production deployment: unchanged'
            echo '- TESTSERVICE deployment: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
