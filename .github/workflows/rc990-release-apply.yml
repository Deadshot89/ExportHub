name: RC990 Release Apply

on:
  push:
    branches:
      - rc990-large-ux
    paths:
      - '.github/rc990_release_apply.py'
      - '.github/rc990_release_apply_v2.py'
      - '.github/workflows/rc990-release-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc990-large-ux
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply RC990 release-center patch
        run: python .github/rc990_release_apply_v2.py
      - name: Verify complete regression
        run: npm test
      - name: Verify whitespace
        run: git diff --check
      - name: Commit feature change
        shell: bash
        run: |
          if git diff --quiet -- TESTVERSION.html; then
            echo 'No TESTVERSION change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TESTVERSION.html
          git commit -m 'RC990: Release-Center Position und Status stabilisieren'
          git push origin HEAD:rc990-large-ux
