      - name: GREEN verify one canonical task source
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "var BUILD=Object.freeze({version:'RC893',cache:'893',loginReturn:'/TESTVERSION.html?v=893'});" TESTVERSION.html
          grep -Fq "/* exporthub-rc893-canonical-task-source */" TESTVERSION.html
          grep -Fq "window.ExportHUBTaskSourceRC893=Object.freeze" TESTVERSION.html
          grep -Fq "window.ExportHUBTaskSourceRC893.openTasks({mineOnly:false})" TESTVERSION.html
          grep -Fq "window.ExportHUBTaskSourceRC893.openTasks({mineOnly:true})" TESTVERSION.html

          python3 - <<'PY'
          from pathlib import Path

          src=Path("TESTVERSION.html").read_text(encoding="utf-8")

          old_base="let base=dedupeVisibleTasksRC874(rawOpen).map(t=>({...t,eowner:effectiveOwner(t)}));"
          if old_base in src:
              raise SystemExit("Aufgaben-Seite verwendet noch die alte parallele Quelle")

          marker=src.find("/* exporthub-rc885-clean-workspace-v4 */")
          workspace=src[marker:marker+90000]
          if "ExportHUBTaskSourceRC893.openTasks({mineOnly:true})" not in workspace:
              raise SystemExit("Arbeitsfokus/Warncenter verwenden nicht die kanonische Aufgabenquelle")

          planner=src.find("function openTasksForWeek")
          fragment=src[planner:planner+6000]
          if "ExportHUBTaskSourceRC893.openTasks({mineOnly:false})" not in fragment:
              raise SystemExit("Index218 verwendet nicht die kanonische Aufgabenquelle")
          if "(st().tasks||[]).forEach(function(t,i)" in fragment:
              raise SystemExit("Index218 verwendet weiterhin die direkte Rohquelle")

          if src.count("window.ExportHUBIndex218=Object.freeze")!=1:
              raise SystemExit("Index218 API ist nicht genau einmal vorhanden")
          if "function openTasksForWeek" not in src:
              raise SystemExit("Index218 openTasksForWeek fehlt")

          for required in (
              "/* exporthub-rc892-render-rootfix */",
              "rc892LieferAvisBtn",
              "rc892-shipment-grid"
          ):
              if required not in src:
                  raise SystemExit("RC892 Regression: fehlt "+required)

          before={
            "script_open":int(Path("/tmp/rc893_script_open").read_text()),
            "script_close":int(Path("/tmp/rc893_script_close").read_text()),
            "style_open":int(Path("/tmp/rc893_style_open").read_text()),
            "style_close":int(Path("/tmp/rc893_style_close").read_text())
          }
          after={
            "script_open":src.lower().count("<script"),
            "script_close":src.lower().count("</script>"),
            "style_open":src.lower().count("<style"),
            "style_close":src.lower().count("</style>")
          }
          if before!=after:
              raise SystemExit("HTML Script-/Style-Grenzen verändert: "+repr({"vorher":before,"nachher":after}))

          print("GREEN: eine kanonische Aufgabenquelle für Aufgaben, Arbeitsfokus/Warncenter und Index218.")
          PY

      - name: Verify TESTSERVICE-only scope
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "TESTVERSION.html" ]]; then
            echo "::error::RC893 darf ausschließlich TESTVERSION.html ändern."
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi

          if ! git diff --quiet -- \
            index.html \
            api \
            customer-avis.html \
            staticwebapp.config.json \
            staticwebapp.testservice.config.json \
            .github/workflows
          then
            echo "::error::Produktion/API/Avis/Deploy-Dateien wurden verändert."
            exit 1
          fi

      - name: Commit RC893 TESTSERVICE
        shell: bash
        run: |
          set -euo pipefail
          git add TESTVERSION.html
          git commit -m "TESTSERVICE RC893: canonical task source for tasks dashboard and planner"
          git push origin main

      - name: RC893 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## ExportHUB RC893"
            echo
            echo "- eine kanonische offene Aufgabenquelle"
            echo "- RC874 Dubletten-/Gültigkeitslogik bleibt verbindlich"
            echo "- Aufgaben-Seite verwendet die kanonische Quelle"
            echo "- Arbeitsfokus und Warncenter zeigen nur Aufgaben des aktuellen Benutzers plus 'Alle'"
            echo "- Index218 bleibt autoritativer Aufgabenplaner und verwendet dieselbe kanonische Quelle"
            echo "- kein neuer Aufgabenplaner und keine neue Aufgabenmaterialisierung"
            echo "- RC892 Render/Lieferavis/Sendungsdaten unverändert"
            echo "- nur TESTVERSION.html geändert"
          } >> "$GITHUB_STEP_SUMMARY"
