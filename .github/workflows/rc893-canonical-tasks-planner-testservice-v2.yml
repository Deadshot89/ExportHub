name: RC893 Canonical Tasks and Planner TESTSERVICE v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc893-canonical-tasks
  cancel-in-progress: false

jobs:
  repair-testservice:
    name: RC893 canonical tasks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout RC892 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard RC892 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f TESTVERSION.html

          python3 - <<'PY'
          from pathlib import Path

          src=Path("TESTVERSION.html").read_text(encoding="utf-8")

          required={
            "RC892 BUILD":"var BUILD=Object.freeze({version:'RC892',cache:'892',loginReturn:'/TESTVERSION.html?v=892'});",
            "RC874 Aufgaben-Dedupe":"dedupeVisibleTasksRC874(rawOpen)",
            "RC885 Workspace":"/* exporthub-rc885-clean-workspace-v4 */",
            "RC885 taskOpenList":"return tasks().filter(function(t){return t && !isDone(t)})",
            "Index218 API":"window.ExportHUBIndex218=Object.freeze",
            "Index218 Aufgabenquelle":"function openTasksForWeek",
            "RC892 Render-Fix":"/* exporthub-rc892-render-rootfix */",
            "RC892 Lieferavis":"rc892LieferAvisBtn",
            "RC892 Sendungsdaten-Grid":"rc892-shipment-grid"
          }

          missing=[]
          for label,needle in required.items():
              if needle in src:
                  print("OK:",label)
              else:
                  print("FEHLT:",label)
                  missing.append(label)

          # These helpers are required semantically because the existing tasks()
          # code already calls them; declaration style is intentionally irrelevant.
          for helper in ("taskCompletedRC777","taskMeaningfulRC818","taskLinkedTestShipmentRC818"):
              if helper+"(" in src:
                  print("OK: Aufgaben-Helfer",helper)
              else:
                  print("FEHLT: Aufgaben-Helfer",helper)
                  missing.append(helper)

          if missing:
              raise SystemExit("RC892 Baseline unvollständig: "+", ".join(missing))

          print("RC892 Baseline semantisch bestätigt.")
          PY

      - name: RED reproduce divergent task sources
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          src=Path("TESTVERSION.html").read_text(encoding="utf-8")

          if "window.ExportHUBTaskSourceRC893" in src:
              raise SystemExit("RED ungültig: RC893 Task Source existiert bereits")

          old_base="let base=dedupeVisibleTasksRC874(rawOpen).map(t=>({...t,eowner:effectiveOwner(t)}));"
          if old_base not in src:
              raise SystemExit("RED: Aufgaben-Seite verwendet nicht die erwartete RC874 Quelle")

          marker=src.find("/* exporthub-rc885-clean-workspace-v4 */")
          if marker<0:
              raise SystemExit("RED: RC885 workspace fehlt")

          workspace=src[marker:marker+90000]
          if "return tasks().filter(function(t){return t && !isDone(t)})" not in workspace:
              raise SystemExit("RED: RC885 Rohfilter taskOpenList nicht gefunden")

          planner=src.find("function openTasksForWeek")
          if planner<0:
              raise SystemExit("RED: Index218 openTasksForWeek fehlt")
          fragment=src[planner:planner+5000]
          if "(st().tasks||[]).forEach(function(t,i)" not in fragment:
              raise SystemExit("RED: Index218 liest nicht direkt aus st().tasks")

          print("RED bestätigt:")
          print(" - Aufgaben-Seite dedupliziert mit RC874")
          print(" - RC885 Arbeitsfokus/Warncenter benutzt eigenen Rohfilter")
          print(" - Index218 benutzt eine dritte direkte Aufgabenquelle")
          PY

      - name: Snapshot source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("TESTVERSION.html").read_text(encoding="utf-8")
          for k,v in {
            "script_open":src.lower().count("<script"),
            "script_close":src.lower().count("</script>"),
            "style_open":src.lower().count("<style"),
            "style_close":src.lower().count("</style>")
          }.items():
            Path("/tmp/rc893_"+k).write_text(str(v),encoding="utf-8")
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC892 backup
        shell: bash
        run: |
          set -euo pipefail

          TAG="backup-before-rc893-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Backup-Tag existiert bereits: $TAG"
          else
            git tag -a "$TAG" -m "Backup before RC893 canonical task source"
            git push origin "refs/tags/$TAG"
            echo "Backup-Tag erstellt: $TAG"
          fi

