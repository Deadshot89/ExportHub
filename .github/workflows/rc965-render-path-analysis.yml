name: RC965 Render Path Analysis

on:
  push:
    paths:
      - '.github/workflows/rc965-render-path-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse Avis and dashboard post-render paths
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('TESTVERSION.html','utf8');
          function around(label,needle,before=2200,after=4200){
            const i=s.indexOf(needle);
            console.log(`\n### ${label} needle=${JSON.stringify(needle)} offset=${i}`);
            if(i<0)return;
            console.log(s.slice(Math.max(0,i-before),Math.min(s.length,i+after)).replace(/\s+/g,' '));
          }
          function count(needle){let n=0,p=0;while((p=s.indexOf(needle,p))!==-1){n++;p+=needle.length}return n}
          console.log('FILE_BYTES='+Buffer.byteLength(s));
          console.log('AVIS_SCHEDULE_COUNT='+count('function schedule(){if(timer)return;avisRetry=0;'));
          console.log('AVIS_RETRY_30_COUNT='+count('avisRetry<30'));
          console.log('WORKSPACE_MARKER_COUNT='+count('exporthub-rc896-workspace-event-driven'));
          around('AVIS_RETRY','function schedule(){if(timer)return;avisRetry=0;',5000,8000);
          around('AVIS_INTACT','function avisIntact()',3500,5500);
          around('AVIS_VISIBLE','function visibleShipmentView()',3500,5500);
          around('AVIS_LASTSIG','lastSig=',3000,6500);
          around('WORKSPACE','exporthub-rc896-workspace-event-driven',6000,9000);
          around('DASHBOARD_LOCAL_CHANGE','dashboardLocalChangeUntil',3500,7000);
          NODE
