name: ExportHUB TESTSERVICE Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - TESTVERSION.html
      - staticwebapp.testservice.config.json
      - .github/workflows/exporthub-testservice.yml

permissions:
  contents: read

concurrency:
  group: exporthub-testservice-deploy
  cancel-in-progress: true

jobs:
  deploy_testservice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy isolated TESTSERVICE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Validate TESTSERVICE files
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html
          test -f staticwebapp.testservice.config.json
          test -f api/exporthub-state/index.js
          test -f api/exporthub-state/function.json
          test -f api/shared/merge.js
          grep -q "version:'RC657'" TESTVERSION.html
          node --check api/exporthub-state/index.js
          node --check api/shared/merge.js
          node -e "JSON.parse(require('fs').readFileSync('staticwebapp.testservice.config.json','utf8'));"

      - name: Prepare isolated TESTSERVICE deployment
        shell: bash
        run: |
          set -euo pipefail
          cp TESTVERSION.html index.html
          cp staticwebapp.testservice.config.json staticwebapp.config.json
          cat > testservice-environment.json <<'EOF'
          {
            "environment": "test",
            "isolated": true,
            "data": "TEST-DATEN",
            "productionWritesAllowed": false,
            "expectedVersion": "RC657"
          }
          EOF

      - name: Deploy TESTSERVICE
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EXPORTHUB_TESTSERVICE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: ""

      - name: Verify live TESTSERVICE version
        shell: bash
        env:
          TESTSERVICE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          set -euo pipefail
          test -n "$TESTSERVICE_URL"
          echo "TESTSERVICE URL: $TESTSERVICE_URL"
          ok=0
          for attempt in {1..24}; do
            body="$(curl -fsSL --max-time 20 "$TESTSERVICE_URL/TESTVERSION.html?verify=$GITHUB_SHA-$attempt" || true)"
            if printf '%s' "$body" | grep -q "version:'RC657'"; then
              echo "RC657 ist im isolierten TESTSERVICE live."
              ok=1
              break
            fi
            echo "Live-Check $attempt/24: RC657 noch nicht sichtbar."
            sleep 10
          done
          if [[ "$ok" != "1" ]]; then
            echo "TESTSERVICE-Verifikation fehlgeschlagen: RC657 wurde nicht ausgeliefert."
            exit 1
          fi

      - name: TESTSERVICE address
        shell: bash
        env:
          TESTSERVICE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          echo "ÖFFNEN: $TESTSERVICE_URL/test?v=657"
          echo "DIREKT: $TESTSERVICE_URL/TESTVERSION.html?v=657"
