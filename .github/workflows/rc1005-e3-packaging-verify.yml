name: RC1005 Release Verify

on:
  push:
    branches:
      - rc1005-e3-verpackungsmasse
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc1005-release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: RC1005 E3 und Drei-Umgebungen-Vertrag
        run: node --test test/rc1005-three-env-sync.test.mjs test/rc1005-e3-packaging-dimensions.test.mjs test/rc1005-e3-packaging-precedence.test.mjs
      - name: Gesamte Node-Regression
        run: npm test
      - name: RC1005 Drei-Umgebungen-Build
        run: node .github/rc1005/build-three-env.mjs
      - name: RC1005 Build verifizieren
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ExportHUB RC1005 environment=production-candidate' dist-rc1005/index.html
          grep -q 'ExportHUB RC1005 environment=testservice' dist-rc1005/TESTVERSION.html
          grep -q 'ExportHUB RC1005 environment=demo' dist-rc1005/demo.html
          grep -q "version:'RC1005'" dist-rc1005/index.html
          grep -q "version:'RC1005'" dist-rc1005/TESTVERSION.html
          grep -q "version:'RC1005'" dist-rc1005/demo.html
          grep -q "__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC1005'" production-version.js
          git diff --check
