name: RC1641 TESTSERVICE Cosmos Publication Safety

on:
  pull_request:
    paths:
      - api/shared/testservice-state-chunks.js
      - api/shared/testservice-cosmos-publication.js
      - test/rc1636-testservice-cosmos-state-chunks.test.mjs
      - test/rc1641-testservice-cosmos-publication.test.mjs
      - .github/workflows/rc1641-testservice-cosmos-publication.yml
  push:
    branches: [main]
    paths:
      - api/shared/testservice-state-chunks.js
      - api/shared/testservice-cosmos-publication.js
      - test/rc1636-testservice-cosmos-state-chunks.test.mjs
      - test/rc1641-testservice-cosmos-publication.test.mjs
      - .github/workflows/rc1641-testservice-cosmos-publication.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Offline Cosmos chunk and CAS-publication regression
        run: |
          node --check api/shared/testservice-state-chunks.js
          node --check api/shared/testservice-cosmos-publication.js
          node --check test/rc1641-testservice-cosmos-publication.test.mjs
          node --test --test-concurrency=1 test/rc1636-testservice-cosmos-state-chunks.test.mjs test/rc1641-testservice-cosmos-publication.test.mjs
