name: RC893 Task Dedupe Core TESTSERVICE v3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporthub-rc893-task-dedupe-core
  cancel-in-progress: false

jobs:
  repair-testservice:
    name: RC893 task dedupe core
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout RC892 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard RC892 confirmed baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f TESTVERSION.html

          python3 - <<'PY'
          from pathlib import Path
          src=Path("TESTVERSION.html").read_text(encoding="utf-8")
          required={
            "RC892 BUILD":"var BUILD=Object.freeze({version:'RC892',cache:'892',loginReturn:'/TESTVERSION.html?v=892'});",
            "Aufgaben-Seite RC874":"let base=dedupeVisibleTasksRC874(rawOpen).map(t=>({...t,eowner:effectiveOwner(t)}));",
            "RC885 Workspace":"/* exporthub-rc885-clean-workspace-v4 */",
            "RC885 Rohfilter":"return tasks().filter(function(t){return t && !isDone(t)})",
            "Index218":"function openTasksForWeek",
            "RC892 Render":"/* exporthub-rc892-render-rootfix */",
            "RC892 Avis":"rc892LieferAvisBtn",
            "RC892 Grid":"rc892-shipment-grid"
          }
          missing=[label for label,needle in required.items() if needle not in src]
          if missing:
              raise SystemExit("Baseline fehlt: "+", ".join(missing))
          print("RC892 bestätigte Baseline vorhanden.")
          PY

      - name: RED reproduce confirmed duplicate task sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("TESTVERSION.html").read_text(encoding="utf-8")
          if "ExportHUBTaskSourceRC893" in src:
              raise SystemExit("RC893 bereits vorhanden")

          old="let base=dedupeVisibleTasksRC874(rawOpen).map(t=>({...t,eowner:effectiveOwner(t)}));"
          if old not in src:
              raise SystemExit("Aufgaben-Seite RC874 Quelle fehlt")

          marker=src.find("/* exporthub-rc885-clean-workspace-v4 */")
          workspace=src[marker:marker+90000]
          if "return tasks().filter(function(t){return t && !isDone(t)})" not in workspace:
              raise SystemExit("RC885 Rohfilter fehlt")

          print("RED bestätigt: Aufgaben-Seite und RC885 verwenden unterschiedliche Quellen.")
          print("Index218 wird in RC893 v3 bewusst nicht angenommen oder verändert.")
          PY

      - name: Snapshot source boundaries and Index218
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          src=Path("TESTVERSION.html").read_text(encoding="utf-8")

          def find_function(source,name):
              start=source.find("function "+name+"(")
              if start<0: raise SystemExit(name+" fehlt")
              brace=source.find("{",start)
              depth=0; quote=""; esc=False; line=False; block=False
              i=brace
              while i<len(source):
                  c=source[i]; n=source[i+1] if i+1<len(source) else ""
                  if line:
                      if c=="\n": line=False
                      i+=1; continue
                  if block:
                      if c=="*" and n=="/": block=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False; i+=1; continue
                      if c=="\\": esc=True; i+=1; continue
                      if c==quote: quote=""
                      i+=1; continue
                  if c=="/" and n=="/": line=True; i+=2; continue
                  if c=="/" and n=="*": block=True; i+=2; continue
                  if c in ("'",'"',"`"): quote=c; i+=1; continue
                  if c=="{": depth+=1
                  elif c=="}":
                      depth-=1
                      if depth==0: return source[start:i+1]
                  i+=1
              raise SystemExit(name+" Ende fehlt")

          planner=find_function(src,"openTasksForWeek")
          Path("/tmp/rc893_planner.sha").write_text(hashlib.sha256(planner.encode()).hexdigest())

          for k,v in {
            "script_open":src.lower().count("<script"),
            "script_close":src.lower().count("</script>"),
            "style_open":src.lower().count("<style"),
            "style_close":src.lower().count("</style>")
          }.items():
              Path("/tmp/rc893_"+k).write_text(str(v))
          PY

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExportHUB Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create immutable RC892 backup
        shell: bash
        run: |
          set -euo pipefail
          TAG="backup-before-rc893-v3-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Backup bereits vorhanden: $TAG"
          else
            git tag -a "$TAG" -m "Backup before RC893 task dedupe core"
            git push origin "refs/tags/$TAG"
          fi

