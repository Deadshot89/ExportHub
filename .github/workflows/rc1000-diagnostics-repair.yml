name: RC1000 Diagnostics Repair

on:
  push:
    branches:
      - rc1000-clean-navigation-search
    paths:
      - '.github/workflows/rc1000-diagnostics-repair.yml'
      - '.github/rc1000/apply-diagnostics-repair.mjs'
      - '.github/rc1000/rc1000-diagnostics-repair.test.mjs'
      - 'assets/rc1000-diagnostics-guard.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc1000-diagnostics-repair
  cancel-in-progress: true

jobs:
  repair_verify_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: rc1000-clean-navigation-search
          fetch-depth: 0

      - name: Node 20 bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Baseline vor Reparatur
        run: npm test

      - name: Diagnose-Reparatur Syntax prüfen
        run: |
          node --check .github/rc1000/apply-diagnostics-repair.mjs
          node --check .github/rc1000/rc1000-diagnostics-repair.test.mjs
          node --check assets/rc1000-diagnostics-guard.js

      - name: Diagnose-Reparatur anwenden
        run: node .github/rc1000/apply-diagnostics-repair.mjs

      - name: Diagnose-Vertrag prüfen
        run: node --test .github/rc1000/rc1000-diagnostics-repair.test.mjs

      - name: QR-Sicherheitsverträge prüfen
        run: |
          node --test .github/rc1000/rc1000-pickup-token-race.test.mjs
          node --test .github/rc995/rc995-contract.test.mjs
          node --test .github/rc995/rc995-flow.test.cjs

      - name: API Syntax und Abhängigkeiten prüfen
        shell: bash
        run: |
          set -euo pipefail
          node --check api/shared/loader-pin-store.js
          node --check api/exporthub-state/index.js
          node --check api/shared/public-access-store.js
          node --check api/pickup-init/index.js
          node --check api/pickup-status/index.js
          node --check api/pickup-confirm-v2/index.js
          node --check api/exporthub-auth/index.js
          node --check api/exporthub-auth-probe/index.js
          node -e "const p=require('./api/package.json');if(p.dependencies?.['@azure/storage-blob']!=='12.27.0')throw new Error('@azure/storage-blob 12.27.0 fehlt')"
          cd api
          rm -rf node_modules
          npm install --omit=dev --no-audit --no-fund
          node -e "require('@azure/storage-blob');require('./shared/auth-store');require('./exporthub-auth/index.js');console.log('Auth-API-Abhängigkeiten lokal ladbar')"

      - name: Baseline nach Reparatur
        run: npm test

      - name: Produktionsschutz prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -F "window.__EXPORTHUB_PRODUCTION_VERSION_PROBE__='RC997';" production-version.js
          if git diff -- production-version.js | grep -q .; then
            echo 'Produktion wurde verändert.'
            exit 1
          fi

      - name: Reparatur materialisieren
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          if ! git diff --quiet -- index.html TESTVERSION.html api/shared/loader-pin-store.js api/exporthub-state/index.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html TESTVERSION.html api/shared/loader-pin-store.js api/exporthub-state/index.js
            git commit -m 'RC1000: QR Status State und PIN Diagnosefehler beheben'
            git push origin HEAD:rc1000-clean-navigation-search
          else
            echo 'Diagnose-Reparatur ist bereits materialisiert.'
          fi

      - name: TESTSERVICE Paket bauen
        shell: bash
        run: |
          set -euo pipefail
          out='.rc1000_diagnostics_testservice'
          rm -rf "$out"
          mkdir -p "$out"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),out='.rc1000_diagnostics_testservice';
          const allowed=/\.(?:html|json|js|css|svg|png|jpe?g|gif|ico|webp|woff2?|txt)$/i;
          for(const entry of fs.readdirSync('.',{withFileTypes:true})){
            if(!entry.isFile()||!allowed.test(entry.name))continue;
            if(['index.html','TESTVERSION.html','staticwebapp.config.json','staticwebapp.testservice.config.json'].includes(entry.name))continue;
            fs.copyFileSync(entry.name,path.join(out,entry.name));
          }
          if(fs.existsSync('assets'))fs.cpSync('assets',path.join(out,'assets'),{recursive:true});
          fs.copyFileSync('TESTVERSION.html',path.join(out,'index.html'));
          fs.copyFileSync('TESTVERSION.html',path.join(out,'TESTVERSION.html'));
          for(const page of ['pickup.html','customer-avis.html','location.html','pod-notfall.html']){
            if(!fs.existsSync(page))throw new Error(`Pflichtseite fehlt: ${page}`);
            fs.copyFileSync(page,path.join(out,page));
          }
          const config=fs.existsSync('staticwebapp.testservice.config.json')?'staticwebapp.testservice.config.json':'staticwebapp.config.json';
          fs.copyFileSync(config,path.join(out,'staticwebapp.config.json'));
          NODE
          grep -q 'rc1000-diagnostics-guard.js' "$out/index.html"
          test -s "$out/assets/rc1000-diagnostics-guard.js"
          grep -q 'Abholung bestätigen' "$out/pickup.html"

      - name: Auf TESTSERVICE mit Azure Build deployen
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_0F315E310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .rc1000_diagnostics_testservice
          api_location: api
          output_location: ""
          skip_app_build: true
          deployment_environment: testservice

      - name: TESTSERVICE Auth und QR live verifizieren
        shell: bash
        env:
          TEST_URL: https://wonderful-forest-0f315e310-testservice.centralus.7.azurestaticapps.net
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            root_code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o "$tmp/root" -w '%{http_code}' "$TEST_URL/?rc1000auth=$GITHUB_SHA-$attempt" || true)"
            pickup_code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o "$tmp/pickup" -w '%{http_code}' "$TEST_URL/pickup.html?rc1000auth=$GITHUB_SHA-$attempt" || true)"
            probe_code="$(curl -sS --connect-timeout 5 --max-time 30 -o "$tmp/probe" -w '%{http_code}' "$TEST_URL/api/exporthub-auth-probe?rc1000auth=$GITHUB_SHA-$attempt" || true)"
            bootstrap_code="$(curl -sS --connect-timeout 5 --max-time 30 -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST --data '{"action":"bootstrap-status"}' -o "$tmp/bootstrap" -w '%{http_code}' "$TEST_URL/api/exporthub-auth" || true)"
            login_code="$(curl -sS --connect-timeout 5 --max-time 30 -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST --data '{"action":"login","username":"__rc1000_missing_user__","password":"diagnostic-only"}' -o "$tmp/login" -w '%{http_code}' "$TEST_URL/api/exporthub-auth" || true)"
            echo "Versuch $attempt: root=$root_code pickup=$pickup_code probe=$probe_code bootstrap=$bootstrap_code dummyLogin=$login_code"
            if [[ "$root_code" == 200 && "$pickup_code" == 200 && "$probe_code" == 200 && "$bootstrap_code" == 200 && "$login_code" != 500 ]] \
              && grep -q 'rc1000-diagnostics-guard.js' "$tmp/root" \
              && grep -q 'Abholung bestätigen' "$tmp/pickup"; then
              node - "$tmp/probe" "$tmp/bootstrap" "$tmp/login" <<'NODE'
              const fs=require('fs');
              const [probePath,bootstrapPath,loginPath]=process.argv.slice(2);
              const probe=JSON.parse(fs.readFileSync(probePath,'utf8'));
              const bootstrap=JSON.parse(fs.readFileSync(bootstrapPath,'utf8'));
              const login=JSON.parse(fs.readFileSync(loginPath,'utf8'));
              if(probe.ok!==true||probe.runtimeReady!==true)throw new Error('Auth-Probe runtimeReady ist nicht true');
              for(const key of ['storageBlob','authStore','authEndpoint'])if(!probe.modules?.[key]?.ok)throw new Error('Auth-Modul nicht ladbar: '+key);
              if(bootstrap.ok!==true||bootstrap.storageConfigured!==true||bootstrap.storageReachable!==true)throw new Error('Auth-Speicher nicht einsatzbereit');
              if(login.code!=='INVALID_CREDENTIALS')throw new Error('Dummy-Login erreicht nicht die echte Credential-Prüfung: '+JSON.stringify(login));
              console.log('Auth-Backend vollständig einsatzbereit.');
              NODE
              ready=1
              break
            fi
            sleep 10
          done
          [[ "$ready" == 1 ]]
          echo 'RC1000 TESTSERVICE Auth-Backend und QR-Seite live verifiziert.'
