name: RC968 Shipment Summary Diagnose

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc968-shipment-summary-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: updateSummary und Same-View DOM-Writes analysieren
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('TESTVERSION.html','utf8');
          const build=s.match(/var BUILD=Object\.freeze\(\{version:'(RC\d+)'/);
          console.log('BUILD',build?build[1]:'unbekannt');

          function extract(name){
            const token='function '+name+'(';
            const start=s.lastIndexOf(token);
            if(start<0)return null;
            const brace=s.indexOf('{',start);
            let i=brace,depth=0,q='',esc=false,line=false,block=false;
            for(;i<s.length;i++){
              const c=s[i],n=s[i+1];
              if(line){if(c==='\n')line=false;continue}
              if(block){if(c==='*'&&n==='/'){block=false;i++}continue}
              if(q){if(esc){esc=false;continue}if(c==='\\'){esc=true;continue}if(c===q)q='';continue}
              if(c==='/'&&n==='/'){line=true;i++;continue}
              if(c==='/'&&n==='*'){block=true;i++;continue}
              if(c==='"'||c==="'"||c==='`'){q=c;continue}
              if(c==='{')depth++;
              else if(c==='}'&&--depth===0)return s.slice(start,i+1);
            }
            return null;
          }

          for(const name of ['updateSummary','updateQr','refreshVisuals']){
            const body=extract(name);
            console.log('\n=== '+name+' ===');
            if(!body){console.log('NICHT GEFUNDEN');continue}
            console.log('len',body.length,
              'textContent=',(body.match(/\.textContent\s*=/g)||[]).length,
              'innerHTML=',(body.match(/\.innerHTML\s*=/g)||[]).length,
              'value=',(body.match(/\.value\s*=/g)||[]).length,
              'class=',(body.match(/\.class(Name|List)/g)||[]).length,
              'style=',(body.match(/\.style\./g)||[]).length);
            console.log(body);
          }

          const body=extract('updateSummary')||'';
          console.log('\n=== updateSummary DOM-Zuweisungen ===');
          const assignRe=/([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*|\[[^\]]+\])*)\.(textContent|innerHTML|value|className)\s*=\s*([^;\n}]+)/g;
          let m,n=0;
          while((m=assignRe.exec(body))){console.log(++n, m[0])}
          console.log('COUNT',n);

          console.log('\n=== RC966/RC967 Diff-Helfer ===');
          for(const name of ['rc966PatchHtml']){
            const h=extract(name); if(h)console.log(h);
          }
          NODE
