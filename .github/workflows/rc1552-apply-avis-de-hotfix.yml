name: RC1552 Apply AVIS .de Hotfix

on:
  push:
    branches:
      - fix/rc1552-avis-de-domain-regression

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rc1552-avis-de-domain-regression
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1552 .de Source-of-Truth anwenden
        run: |
          set -euo pipefail
          node scripts/rc1552-restore-avis-de-domain.mjs
          rm test/rc1545-avis-canonical-com-domain.test.mjs
          rm scripts/rc1552-restore-avis-de-domain.mjs
          rm .github/workflows/rc1552-apply-avis-de-hotfix.yml
      - name: Fokussierten Vertrag nach Fix prüfen
        run: node --test test/rc1552-avis-de-domain-regression.test.mjs
      - name: Änderungen committen
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'RC1552: AVIS Produktionsdomain auf exporthub360.de wiederherstellen'
          git push origin HEAD:fix/rc1552-avis-de-domain-regression
