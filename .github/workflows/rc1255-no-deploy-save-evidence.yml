name: RC1255 No-Deploy Save Evidence

on:
  push:
    branches:
      - test/rc1255-no-deploy-evidence-20261111
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc1255-no-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-save-evidence:
    if: github.ref == 'refs/heads/test/rc1255-no-deploy-evidence-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Verify state conflict handling and browser timeout contracts without Azure access
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            test/p0-state-conditional-write-conflict.test.mjs \
            test/rc1549-live-browser-timeout-budget.test.mjs \
            test/rc1124-browser-release-gate.test.mjs \
            test/rc1982-save-meta-delta.test.mjs \
            test/rc1982-save-drain-diagnostics.test.mjs
      - name: Explicitly record live evidence as outstanding
        run: |
          echo 'OFFLINE_ONLY: no Azure deployment, no Azure mutation, no production changes.'
          echo 'RC1255 Azure ACK and independent ShipmentHistory readback remain UNVERIFIED.'
