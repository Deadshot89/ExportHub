name: RC1496 Autofix Finalize

on:
  workflow_run:
    workflows:
      - ExportHUB RC1112 Drei-Umgebungen Deploy
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: rc1496-autofix-finalize-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PROD_URL: https://wonderful-forest-0f315e310.7.azurestaticapps.net
      TEST_URL: https://ashy-grass-065b7b803-testservice.westeurope.6.azurestaticapps.net
    steps:
      - name: Zugehörigen Diagnose-Autofix-PR bestimmen
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          head_sha="${{ github.event.workflow_run.head_sha }}"
          deployment_run_url="${{ github.event.workflow_run.html_url }}"
          pulls=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/commits/$head_sha/pulls")
          matches=$(printf '%s' "$pulls" | jq '[.[] | select(.merged_at != null and .base.ref == "main" and ((.body // "") | contains("## ExportHUB Diagnose-Autofix")))]')
          count=$(printf '%s' "$matches" | jq 'length')
          if [[ "$count" == "0" ]]; then
            echo 'Kein Diagnose-Autofix-PR für diesen erfolgreichen Deploy; nichts zu finalisieren.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$count" != "1" ]]; then
            echo "Mehrdeutige Diagnose-Autofix-Zuordnung für $head_sha: $count PRs" >&2
            exit 1
          fi
          body=$(printf '%s' "$matches" | jq -r '.[0].body // ""')
          pull_request_url=$(printf '%s' "$matches" | jq -r '.[0].html_url // ""')
          autofix_commit=$(printf '%s' "$matches" | jq -r '.[0].head.sha // ""')
          diagnostic_id=$(printf '%s\n' "$body" | sed -n 's/^- Diagnose: `\([^`]*\)`.*/\1/p' | head -n1)
          job_id=$(printf '%s\n' "$body" | sed -n 's/^- Auftrag: `\([^`]*\)`.*/\1/p' | head -n1)
          environment=$(printf '%s\n' "$body" | sed -n 's/^- Zielumgebung: `\([^`]*\)`.*/\1/p' | head -n1)
          test -n "$pull_request_url" || { echo 'Autofix-PR-URL fehlt.' >&2; exit 1; }
          test -n "$autofix_commit" || { echo 'Autofix-Commit fehlt.' >&2; exit 1; }
          test -n "$diagnostic_id" || { echo 'Diagnose-ID fehlt im Autofix-PR.' >&2; exit 1; }
          test -n "$job_id" || { echo 'Autofix-Auftrag fehlt im Autofix-PR.' >&2; exit 1; }
          [[ "$environment" == "production" || "$environment" == "testservice" ]] || { echo "Ungültige Autofix-Umgebung: $environment" >&2; exit 1; }
          echo 'found=true' >> "$GITHUB_OUTPUT"
          echo "diagnostic_id=$diagnostic_id" >> "$GITHUB_OUTPUT"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "pull_request_url=$pull_request_url" >> "$GITHUB_OUTPUT"
          echo "autofix_commit=$autofix_commit" >> "$GITHUB_OUTPUT"
          echo "merge_commit=$head_sha" >> "$GITHUB_OUTPUT"
          echo "deployment_run_url=$deployment_run_url" >> "$GITHUB_OUTPUT"

      - name: Kurzlebige GitHub-OIDC-Identität abrufen
        if: steps.pr.outputs.found == 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=exporthub-diagnostic-autofix")
          token=$(printf '%s' "$response" | jq -r '.value // empty')
          test -n "$token" || { echo 'GitHub-OIDC-Token konnte nicht erstellt werden.' >&2; exit 1; }
          echo "::add-mask::$token"
          umask 077
          printf '%s' "$token" > "$RUNNER_TEMP/exporthub-autofix-finalize-oidc.jwt"

      - name: Diagnose-Autofix nach erfolgreichem Live-Deploy abschließen
        if: steps.pr.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          environment="${{ steps.pr.outputs.environment }}"
          base="$PROD_URL"
          [[ "$environment" == "testservice" ]] && base="$TEST_URL"
          payload=$(jq -nc \
            --arg j "${{ steps.pr.outputs.job_id }}" \
            --arg e "$environment" \
            --arg d "${{ steps.pr.outputs.diagnostic_id }}" \
            --arg p "${{ steps.pr.outputs.pull_request_url }}" \
            --arg a "${{ steps.pr.outputs.autofix_commit }}" \
            --arg m "${{ steps.pr.outputs.merge_commit }}" \
            --arg u "${{ steps.pr.outputs.deployment_run_url }}" \
            '{action:"finalize",jobId:$j,environment:$e,diagnosticId:$d,pullRequestUrl:$p,autofixCommit:$a,mergeCommit:$m,deploymentRunUrl:$u,message:"Autofix-PR wurde regulär gemergt und der RC1112 Drei-Umgebungen-Deploy inklusive Live-Prüfungen erfolgreich abgeschlossen."}')
          curl -fsS -X POST "$base/api/diagnostic-autofix" \
            -H 'Content-Type: application/json' \
            -H "X-ExportHUB-GitHub-OIDC: $(cat "$RUNNER_TEMP/exporthub-autofix-finalize-oidc.jwt")" \
            --data "$payload" | jq -e '.ok == true and (.status == "fixed" or .alreadyFixed == true)' >/dev/null

      - name: OIDC-Datei entfernen
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/exporthub-autofix-finalize-oidc.jwt"
