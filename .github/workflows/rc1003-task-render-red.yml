name: RC1003 Aufgaben Syntax

on:
  workflow_dispatch:
  push:
    branches:
      - rc1003-task-render-fix-pickup-prep
    paths:
      - 'index.html'
      - 'TESTVERSION.html'
      - 'test/rc1003-task-render-syntax.test.mjs'
      - '.github/workflows/rc1003-task-render-red.yml'

permissions:
  contents: read

concurrency:
  group: rc1003-task-render-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Betroffenen Inline-Scriptblock diagnostizieren
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const html=fs.readFileSync('TESTVERSION.html','utf8');
          const marker=html.indexOf('function taskGroupNameRC874(t){');
          if(marker<0)throw new Error('taskGroupNameRC874 fehlt');
          const open=html.lastIndexOf('<script',marker);
          const bodyStart=html.indexOf('>',open)+1;
          const close=html.indexOf('</script',marker);
          if(open<0||bodyStart<=open||close<=marker)throw new Error('Scriptblock-Grenzen fehlen');
          const src=html.slice(bodyStart,close);
          const info=[];
          info.push(`scriptOpen=${open} bodyStart=${bodyStart} close=${close} length=${src.length} markerInScript=${marker-bodyStart}`);
          const patterns=[
            ['backslash-newline',/\\\r?\n/g],
            ['literal-backslash-n',/\\n/g],
            ['double-backslash-n',/\\\\n/g]
          ];
          for(const [name,rx] of patterns){
            const matches=[...src.matchAll(rx)];
            info.push(`${name} count=${matches.length}`);
            matches.slice(0,80).forEach((m,i)=>{
              const p=m.index||0;
              info.push(`${name}[${i}] @${p} ${JSON.stringify(src.slice(Math.max(0,p-90),p+130))}`);
            });
          }
          try{new vm.Script(src,{filename:'TESTVERSION-affected-inline.js'});info.push('compile=OK')}
          catch(e){info.push(`compile=FAIL ${e.stack||e}`)}
          fs.writeFileSync('rc1003-script-diagnostic.txt',info.join('\n')+'\n');
          fs.writeFileSync('rc1003-affected-inline.js',src);
          console.log(info.join('\n'));
          NODE
      - name: Diagnose-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rc1003-script-diagnostic
          path: |
            rc1003-script-diagnostic.txt
            rc1003-affected-inline.js
          retention-days: 1
      - name: Aufgaben-Gruppenblock kompilieren
        run: node --test test/rc1003-task-render-syntax.test.mjs
