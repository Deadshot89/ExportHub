name: RC994 Drag TDD

on:
  push:
    branches:
      - rc994-drag-performance
    paths:
      - '.github/workflows/rc994-tdd.yml'
      - 'test/rc994-drag-performance.test.mjs'
      - 'TESTVERSION.html'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: RC994 targeted drag-performance test
        run: node --test test/rc994-drag-performance.test.mjs
      - name: Full test suite
        run: npm test

# Final GREEN verification after RC994 build materialization.
