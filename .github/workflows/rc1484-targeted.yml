name: RC1484 Targeted TDD
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/rc1207-pallet-account-fix.js'
      - 'test/rc1207-pallet-account-fix.test.mjs'
      - '.github/workflows/rc1484-targeted.yml'
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: RC1484 targeted regression
        run: node --test test/rc1207-pallet-account-fix.test.mjs
